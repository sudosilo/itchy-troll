<!DOCTYPE html>
<!-- RTSS v3 : restaurant technology site survey with a drive-thru sun model -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>RTSS V3</title>
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <button type="button" id="menuBtn" class="menu-btn" aria-label="Apps menu">&#9776;</button>
  <div class="brand"><h1>RTSS</h1><span class="badge">V3</span></div>
  <div class="sub" id="siteTitle">New survey</div>
  <span id="status" role="status">Starting</span>
</header>
<div id="sitebar">
  <select id="site" aria-label="Site"></select>
  <button type="button" id="newBtn">New</button>
  <button type="button" id="saveBtn" class="primary">Save</button>
</div>
<form id="newForm" hidden>
  <input type="text" id="newName" placeholder="Name for the new site" aria-label="New site name" required>
  <button type="submit" class="primary">Create site</button>
</form>
<nav id="tabs" aria-label="Sections"></nav>
<main id="main"></main>
<datalist id="ispList"></datalist>
<footer>RTSS V3, restaurant technology site survey</footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
