<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Rosetta Pone</title>
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#2b2418;--mute:#7a6d58;--line:#e2d8c4;--clay:#b5652e;--clay2:#f3e2d2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
.cu{font-family:"Noto Sans Cuneiform","Segoe UI Historic","Segoe UI Symbol",serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:.5px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
textarea,input{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
button{font-size:15px;padding:10px 14px;border-radius:10px;border:1px solid var(--clay);background:var(--clay);color:#fff}
button.ghost{background:var(--card);color:var(--clay)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin-bottom:6px}
.eng{font-size:20px;font-weight:600}
.tr{font-family:ui-monospace,monospace;font-size:15px;color:var(--clay)}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--clay2);border-radius:10px;padding:8px 10px;min-width:84px;text-align:center}
.card .g{font-size:34px;line-height:1.1}
.card .r{font-family:ui-monospace,monospace;font-size:13px;color:var(--clay)}
.card .m{font-size:12px;color:var(--mute)}
.card.bad{background:#f4dcdc}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:10px}
.key{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;color:var(--ink);overflow:hidden;display:flex;flex-direction:column;gap:4px}
.key .g{font-size:26px;line-height:1.3;white-space:nowrap;overflow:hidden}
.key .r{font-size:12px;color:var(--clay);font-family:ui-monospace,monospace}
.key .m{font-size:12px;line-height:1.25;color:var(--ink)}
.hint{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Rosetta Pone</h1>
<p class="sub">Paste cuneiform signs or type a transliteration like lugal gal. Get the readings and an English gloss sign by sign.</p>

<textarea id="inp" class="cu" placeholder="𒈗 𒃲   or   lugal gal"></textarea>
<div class="row">
<button id="go">Translate</button>
<button class="ghost" id="clr">Clear</button>
<button class="ghost" id="ex1">Example 1</button>
<button class="ghost" id="ex2">Example 2</button>
</div>

<div class="box">
<div class="lbl">English</div>
<div class="eng" id="eng">Waiting for input.</div>
</div>
<div class="box">
<div class="lbl">Transliteration</div>
<div class="tr" id="tr"></div>
</div>
<div class="box">
<div class="lbl">Sign by sign</div>
<div class="cards" id="cards"></div>
</div>

<div class="box">
<div class="lbl">Sign keyboard</div>
<input id="find" placeholder="Search a meaning or reading, like king or water">
<div class="grid" id="grid"></div>
<p class="hint">Tap a sign to add it to the input box.</p>
</div>
</main>
<script>
const SIGNS=[{"c": "𒀭", "n": "AN", "r": "an, dingir", "m": "sky; god (marks a divine name)", "k": "an"}, {"c": "𒈗", "n": "LUGAL", "r": "lugal", "m": "king", "k": "lugal"}, {"c": "𒂍", "n": "E2", "r": "e2", "m": "house, temple", "k": "e2"}, {"c": "𒅗", "n": "KA", "r": "ka, inim, dug4", "m": "mouth; word; to speak", "k": "ka"}, {"c": "𒀀", "n": "A", "r": "a", "m": "water; son", "k": "a"}, {"c": "𒆠", "n": "KI", "r": "ki", "m": "earth, place (marks a place name)", "k": "ki"}, {"c": "𒊩", "n": "SAL", "r": "munus, sal", "m": "woman (marks a female name)", "k": "munus"}, {"c": "𒇽", "n": "LU2", "r": "lu2", "m": "man, person", "k": "lu2"}, {"c": "𒃲", "n": "GAL", "r": "gal", "m": "great, big", "k": "gal"}, {"c": "𒌷", "n": "URU", "r": "uru", "m": "city", "k": "uru"}, {"c": "𒆳", "n": "KUR", "r": "kur", "m": "mountain; foreign land", "k": "kur"}, {"c": "𒌓", "n": "UD", "r": "ud, u4, utu", "m": "day; sun; sun god", "k": "ud"}, {"c": "𒄑", "n": "GISH", "r": "gis, ges", "m": "wood, tree (marks a wooden object)", "k": "gis"}, {"c": "𒃻", "n": "GAR", "r": "gar, ninda", "m": "bread; to place", "k": "ninda"}, {"c": "𒄞", "n": "GUD", "r": "gu4", "m": "ox", "k": "gu4"}, {"c": "𒀲", "n": "ANSHE", "r": "anse", "m": "donkey", "k": "anse"}, {"c": "𒊺", "n": "SHE", "r": "se", "m": "barley, grain", "k": "se"}, {"c": "𒃾", "n": "GESHTIN", "r": "gestin", "m": "wine, grapevine", "k": "gestin"}, {"c": "𒂁", "n": "DUG", "r": "dug", "m": "pot, jar", "k": "dug"}, {"c": "𒅆", "n": "IGI", "r": "igi, si", "m": "eye; in front; syllable si", "k": "igi"}, {"c": "𒊕", "n": "SAG", "r": "sag", "m": "head", "k": "sag"}, {"c": "𒋗", "n": "SHU", "r": "su", "m": "hand", "k": "su"}, {"c": "𒄊", "n": "GIR3", "r": "giri3", "m": "foot", "k": "giri3"}, {"c": "𒁺", "n": "DU", "r": "du, gin", "m": "to go, to walk", "k": "du"}, {"c": "𒂗", "n": "EN", "r": "en", "m": "lord", "k": "en"}, {"c": "𒎏", "n": "NIN", "r": "nin", "m": "lady", "k": "nin"}, {"c": "𒁾", "n": "DUB", "r": "dub", "m": "clay tablet", "k": "dub"}, {"c": "𒈬", "n": "MU", "r": "mu", "m": "name; year", "k": "mu"}, {"c": "𒍣", "n": "ZI", "r": "zi", "m": "life, breath", "k": "zi"}, {"c": "𒋾", "n": "TI", "r": "ti", "m": "life; arrow", "k": "ti"}, {"c": "𒉆", "n": "NAM", "r": "nam", "m": "fate; office", "k": "nam"}, {"c": "𒌨", "n": "UR", "r": "ur", "m": "dog", "k": "ur"}, {"c": "𒊊", "n": "PIRIG", "r": "pirig", "m": "lion", "k": "pirig"}, {"c": "𒆬", "n": "KU3", "r": "ku3", "m": "silver; pure", "k": "ku3"}, {"c": "𒄀", "n": "GI", "r": "gi", "m": "reed", "k": "gi"}, {"c": "𒉣", "n": "NUN", "r": "nun", "m": "prince", "k": "nun"}, {"c": "𒈣", "n": "MA2", "r": "ma2", "m": "boat", "k": "ma2"}, {"c": "𒀊", "n": "AB", "r": "ab", "m": "sea; window", "k": "ab"}, {"c": "𒍪", "n": "ZU", "r": "zu", "m": "to know", "k": "zu"}, {"c": "𒁮", "n": "DAM", "r": "dam", "m": "spouse", "k": "dam"}, {"c": "𒌋", "n": "U", "r": "u", "m": "ten", "k": "u"}, {"c": "𒁹", "n": "DISH", "r": "dis", "m": "one (marks a man's name)", "k": "dis"}, {"c": "𒈨", "n": "ME", "r": "me", "m": "divine power; to be", "k": "me"}, {"c": "𒁁", "n": "BAD", "r": "bad, us2", "m": "to open; to die", "k": "bad"}, {"c": "𒋰", "n": "TAB", "r": "tab", "m": "two, double", "k": "tab"}, {"c": "𒂟", "n": "ERIN2", "r": "erin2", "m": "troops, workers", "k": "erin2"}, {"c": "𒄭", "n": "HI", "r": "hi, dug3", "m": "good, sweet", "k": "dug3"}, {"c": "𒈾", "n": "NA", "r": "na", "m": "stone (with za); syllable na", "k": "na"}, {"c": "𒌉", "n": "TUR", "r": "tur, dumu", "m": "small; son, child", "k": "dumu"}, {"c": "𒅥", "n": "KA TIMES GAR", "r": "gu7", "m": "to eat", "k": "gu7"}, {"c": "𒅘", "n": "KA TIMES A", "r": "nag", "m": "to drink", "k": "nag"}, {"c": "𒅎", "n": "IM", "r": "im", "m": "clay; wind, storm", "k": "im"}, {"c": "𒋀", "n": "SHESH", "r": "ses", "m": "brother", "k": "ses"}, {"c": "𒁛", "n": "DAG KISIM5 TIMES GA", "r": "ama", "m": "mother", "k": "ama"}, {"c": "𒀜", "n": "AD", "r": "ad", "m": "father", "k": "ad"}, {"c": "𒀴", "n": "ARAD", "r": "arad", "m": "male servant", "k": "arad"}, {"c": "𒉒", "n": "NINDA2", "r": "nig2", "m": "thing, property", "k": "nig2"}, {"c": "𒄘", "n": "GU2", "r": "gu2", "m": "neck; tribute", "k": "gu2"}, {"c": "𒊮", "n": "SHA3", "r": "sa3", "m": "heart, inside", "k": "sa3"}, {"c": "𒌗", "n": "UD TIMES U PLUS U PLUS U", "r": "iti", "m": "month", "k": "iti"}, {"c": "𒈧", "n": "MASH2", "r": "mas2", "m": "goat", "k": "mas2"}, {"c": "𒀖", "n": "AB2", "r": "ab2", "m": "cow", "k": "ab2"}, {"c": "𒉡", "n": "NU", "r": "nu", "m": "not", "k": "nu"}, {"c": "𒁀", "n": "BA", "r": "ba", "m": "to give; syllable ba", "k": "ba"}, {"c": "𒁉", "n": "BI", "r": "bi, kas", "m": "beer; its; syllable bi", "k": "kas"}, {"c": "𒁍", "n": "BU", "r": "bu", "m": "syllable bu", "k": "bu"}, {"c": "𒁕", "n": "DA", "r": "da", "m": "with; syllable da", "k": "da"}, {"c": "𒁲", "n": "DI", "r": "di", "m": "judgment; syllable di", "k": "di"}, {"c": "𒂵", "n": "GA", "r": "ga", "m": "milk; syllable ga", "k": "ga"}, {"c": "𒄖", "n": "GU", "r": "gu", "m": "thread; syllable gu", "k": "gu"}, {"c": "𒅀", "n": "I A", "r": "ia", "m": "syllable ia", "k": "ia"}, {"c": "𒅋", "n": "IL", "r": "il", "m": "to lift; syllable il", "k": "il"}, {"c": "𒅔", "n": "IN", "r": "in", "m": "syllable in", "k": "in"}, {"c": "𒆪", "n": "KU", "r": "ku", "m": "to sit; syllable ku", "k": "ku"}, {"c": "𒆷", "n": "LA", "r": "la", "m": "syllable la", "k": "la"}, {"c": "𒇷", "n": "LI", "r": "li", "m": "syllable li", "k": "li"}, {"c": "𒇻", "n": "LU", "r": "lu, udu", "m": "sheep; syllable lu", "k": "udu"}, {"c": "𒈠", "n": "MA", "r": "ma", "m": "syllable ma", "k": "ma"}, {"c": "𒈪", "n": "MI", "r": "mi", "m": "night; syllable mi", "k": "mi"}, {"c": "𒉌", "n": "NI", "r": "ni", "m": "syllable ni", "k": "ni"}, {"c": "𒊏", "n": "RA", "r": "ra", "m": "to strike; syllable ra", "k": "ra"}, {"c": "𒊑", "n": "RI", "r": "ri", "m": "syllable ri", "k": "ri"}, {"c": "𒊒", "n": "RU", "r": "ru", "m": "syllable ru", "k": "ru"}, {"c": "𒊓", "n": "SA", "r": "sa", "m": "syllable sa", "k": "sa"}, {"c": "𒋛", "n": "SI", "r": "si", "m": "horn; syllable si", "k": "si"}, {"c": "𒋢", "n": "SU", "r": "su2", "m": "syllable su", "k": "su2"}, {"c": "𒋫", "n": "TA", "r": "ta", "m": "from; syllable ta", "k": "ta"}, {"c": "𒌅", "n": "TU", "r": "tu", "m": "to enter; syllable tu", "k": "tu"}, {"c": "𒌑", "n": "U2", "r": "u2", "m": "plant, food; syllable u", "k": "u2"}, {"c": "𒌝", "n": "UM", "r": "um", "m": "syllable um", "k": "um"}, {"c": "𒌦", "n": "UN", "r": "un", "m": "people", "k": "un"}, {"c": "𒍝", "n": "ZA", "r": "za", "m": "syllable za", "k": "za"}, {"c": "𒄿", "n": "I", "r": "i", "m": "syllable i", "k": "i"}, {"c": "𒂊", "n": "E", "r": "e", "m": "syllable e", "k": "e"}, {"c": "𒊭", "n": "SHA", "r": "sa", "m": "syllable sa", "k": "sa"}, {"c": "𒀠", "n": "AL", "r": "al", "m": "syllable al", "k": "al"}, {"c": "𒀸", "n": "ASH", "r": "as", "m": "one; syllable as", "k": "as"}, {"c": "𒅕", "n": "IR", "r": "ir", "m": "syllable ir", "k": "ir"}, {"c": "𒅖", "n": "ISH", "r": "is", "m": "dust; syllable is", "k": "is"}, {"c": "𒌫", "n": "UR2", "r": "ur2", "m": "root, base", "k": "ur2"}, {"c": "𒇲", "n": "LAL", "r": "lal", "m": "to bind, weigh", "k": "lal"}, {"c": "𒄩", "n": "HA", "r": "ha, ku6", "m": "fish; syllable ha", "k": "ku6"}, {"c": "𒄷", "n": "HU", "r": "hu, musen", "m": "bird; syllable hu", "k": "musen"}, {"c": "𒉺", "n": "PA", "r": "pa", "m": "branch; syllable pa", "k": "pa"}, {"c": "𒉿", "n": "PI", "r": "pi", "m": "ear; syllable pi", "k": "pi"}, {"c": "𒉈", "n": "NE", "r": "ne", "m": "fire; this", "k": "ne"}, {"c": "𒈲", "n": "MUSH", "r": "mus", "m": "snake", "k": "mus"}, {"c": "𒀫", "n": "AMAR", "r": "amar", "m": "calf, young", "k": "amar"}, {"c": "𒋼", "n": "TE", "r": "te", "m": "cheek; syllable te", "k": "te"}, {"c": "𒍜", "n": "UZU", "r": "uzu", "m": "flesh, meat", "k": "uzu"}, {"c": "𒂡", "n": "EZEN", "r": "ezen", "m": "festival", "k": "ezen"}, {"c": "𒆧", "n": "KISH", "r": "kis", "m": "world; the city Kish", "k": "kis"}, {"c": "𒄬", "n": "HAL", "r": "hal", "m": "to divide", "k": "hal"}, {"c": "𒍠", "n": "ZAG", "r": "zag", "m": "side, border", "k": "zag"}];
const byChar=new Map(), byRead=new Map();
function norm(s){
  return s.toLowerCase()
    .replace(/[šŠ]/g,"s").replace(/[ĝĜ]/g,"g").replace(/[ḫḪ]/g,"h").replace(/[ṣṢ]/g,"s").replace(/[ṭṬ]/g,"t")
    .replace(/[₀-₉]/g,d=>String(d.charCodeAt(0)-8320))
    .replace(/[áà]/g,"a").replace(/[éè]/g,"e").replace(/[íì]/g,"i").replace(/[úù]/g,"u");
}
SIGNS.forEach(s=>{
  byChar.set(s.c,s);
  s.r.split(",").map(x=>norm(x.trim())).forEach(x=>{ if(!byRead.has(x)) byRead.set(x,s); });
});
function gloss(s){
  const first=s.m.split(";")[0].trim();
  return first.startsWith("syllable")?"("+first.replace("syllable ","")+")":first;
}
function isCu(ch){const c=ch.codePointAt(0);return c>=0x12000&&c<=0x1254F;}
function translate(){
  const raw=document.getElementById("inp").value.trim();
  const out=[];
  if(!raw){render([]);return;}
  if([...raw].some(isCu)){
    for(const ch of raw){
      if(!isCu(ch)) continue;
      const s=byChar.get(ch);
      out.push(s?{s,read:s.k}:{bad:ch});
    }
  }else{
    const parts=raw.split(/[\s\-\.]+/).filter(Boolean);
    for(const p of parts){
      const key=norm(p).replace(/[^a-z0-9]/g,"");
      const s=byRead.get(key);
      out.push(s?{s,read:key}:{bad:p});
    }
  }
  render(out);
}
function render(out){
  const eng=document.getElementById("eng"),tr=document.getElementById("tr"),cards=document.getElementById("cards");
  cards.innerHTML="";
  if(!out.length){eng.textContent="Waiting for input.";tr.textContent="";return;}
  eng.textContent=out.map(o=>o.s?gloss(o.s):"?").join(" ");
  tr.textContent=out.map(o=>o.s?o.read:"?").join("-");
  out.forEach(o=>{
    const d=document.createElement("div");
    if(o.s){
      d.className="card";
      d.innerHTML='<div class="g cu"></div><div class="r"></div><div class="m"></div>';
      d.children[0].textContent=o.s.c;d.children[1].textContent=o.s.r;d.children[2].textContent=o.s.m;
    }else{
      d.className="card bad";
      d.innerHTML='<div class="g cu"></div><div class="m">not in sign list</div>';
      d.children[0].textContent=o.bad;
    }
    cards.appendChild(d);
  });
}
function grid(q){
  const g=document.getElementById("grid");g.innerHTML="";
  const n=norm(q||"").trim();
  SIGNS.filter(s=>!n||norm(s.r).includes(n)||s.m.toLowerCase().includes(n)).forEach(s=>{
    const k=document.createElement("div");k.className="key";k.title=s.m;
    k.innerHTML='<div class="g cu"></div><div class="r"></div><div class="m"></div>';
    k.children[0].textContent=s.c;k.children[1].textContent=s.k;k.children[2].textContent=s.m;
    k.onclick=()=>{const i=document.getElementById("inp");i.value+=s.c;translate();};
    g.appendChild(k);
  });
}
document.getElementById("go").onclick=translate;
document.getElementById("clr").onclick=()=>{document.getElementById("inp").value="";translate();};
document.getElementById("ex1").onclick=()=>{document.getElementById("inp").value="𒈗 𒃲";translate();};
document.getElementById("ex2").onclick=()=>{document.getElementById("inp").value="dumu lugal e2 gal";translate();};
document.getElementById("inp").addEventListener("input",translate);
document.getElementById("find").addEventListener("input",e=>grid(e.target.value));
grid("");
</script>
</body>
</html>
