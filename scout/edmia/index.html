<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fef5e7">
<title>EDMIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Major+Mono+Display&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  :root {
    --bg: #fef5e7;
    --ink: #1a1814;
    --paper: #fffbf2;
    --shadow: #d4c9a8;
    --hot-a: #ff2e6c;
    --hot-b: #ffd23f;
    --cool-a: #00d4d4;
    --cool-b: #6a4fff;
    --grid: rgba(26, 24, 20, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    overscroll-behavior: none;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255, 46, 108, 0.06), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(106, 79, 255, 0.06), transparent 40%),
      repeating-linear-gradient(0deg, transparent 0 39px, var(--grid) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, var(--grid) 39px 40px);
  }

  #app {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 8px;
    gap: 8px;
  }

  /* TOP BAR */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Major Mono Display', monospace;
    font-size: 18px;
    letter-spacing: 4px;
    color: var(--ink);
  }

  .stat {
    font-family: 'VT323', monospace;
    font-size: 22px;
    line-height: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .stat .label { font-size: 10px; letter-spacing: 2px; opacity: 0.6; font-family: 'Space Mono', monospace; }

  /* GAME AREA */
  .stage {
    flex: 1 1 0;
    min-height: 320px;
    position: relative;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* INTENSITY METER */
  .intensity-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    flex-shrink: 0;
  }
  .intensity-label {
    font-family: 'VT323', monospace;
    font-size: 16px;
    letter-spacing: 2px;
  }
  .intensity-bar {
    flex: 1;
    height: 14px;
    background: var(--bg);
    border: 1px solid var(--ink);
    position: relative;
    overflow: hidden;
  }
  .intensity-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cool-a), var(--hot-b), var(--hot-a));
    transition: width 0.3s ease;
  }
  .section-tag {
    font-family: 'Major Mono Display', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    min-width: 110px;
    text-align: right;
    white-space: nowrap;
  }

  /* GAMEPAD CONTROLS */
  .gamepad {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: stretch;
    height: 130px;
    flex-shrink: 0;
  }

  .pad-left {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .pad-right {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
  }

  .pad-center {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 70px;
  }

  .pad-btn {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 18px;
    box-shadow: 4px 4px 0 var(--ink);
    font-family: 'Major Mono Display', monospace;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: transform 0.06s ease, box-shadow 0.06s ease;
    cursor: pointer;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .pad-btn:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--ink);
  }
  .pad-btn .glyph {
    font-size: 32px;
    line-height: 1;
  }
  .pad-btn .label {
    font-size: 9px;
    opacity: 0.7;
    letter-spacing: 2px;
  }

  /* Per-button colors */
  .pad-dir { background: var(--paper); }
  .pad-rotate { background: var(--hot-b); }
  .pad-drop { background: var(--hot-a); color: var(--paper); }
  .pad-boost {
    background: var(--cool-a);
    width: 64px;
    height: 64px;
    border-radius: 50%;
  }
  .pad-boost .glyph { font-size: 24px; }
  .pad-boost .label { font-size: 8px; }

  /* OVERLAY */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(254, 245, 231, 0.96);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 100;
    padding: 16px;
    text-align: center;
    overflow-y: auto;
  }

  .overlay.hidden { display: none; }

  .overlay h1 {
    font-family: 'Major Mono Display', monospace;
    font-size: 38px;
    letter-spacing: 8px;
    line-height: 1;
    color: var(--ink);
    text-shadow:
      3px 3px 0 var(--hot-a),
      6px 6px 0 var(--hot-b);
  }

  .overlay p {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    max-width: 320px;
    opacity: 0.75;
  }

  .overlay .legend {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 14px;
    font-family: 'VT323', monospace;
    font-size: 20px;
    text-align: left;
  }
  .overlay .legend .k {
    font-family: 'Major Mono Display', monospace;
    font-size: 14px;
    background: var(--ink);
    color: var(--paper);
    padding: 2px 8px;
    letter-spacing: 1px;
  }

  .start-btn {
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--hot-a);
    padding: 16px 32px;
    font-family: 'Major Mono Display', monospace;
    font-size: 18px;
    letter-spacing: 4px;
    cursor: pointer;
  }
  .start-btn:active {
    transform: translate(6px, 6px);
    box-shadow: 0 0 0 var(--hot-a);
  }
  .start-btn.compact {
    padding: 10px 22px;
    font-size: 14px;
    letter-spacing: 3px;
    box-shadow: 4px 4px 0 var(--hot-a);
  }
  .start-btn.compact:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--hot-a);
  }

  .link-btn {
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    text-decoration: underline;
    cursor: pointer;
    opacity: 0.6;
  }
  .link-btn:active { opacity: 1; }

  .screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 360px;
  }
  .screen.hidden { display: none; }

  h1.small {
    font-size: 22px !important;
    letter-spacing: 5px !important;
  }

  /* Initials display */
  .initials {
    display: flex;
    gap: 8px;
    margin: 2px 0;
  }
  .initial-slot {
    width: 40px;
    height: 46px;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'VT323', monospace;
    font-size: 30px;
    color: var(--ink);
    transition: all 0.1s;
  }
  .initial-slot.active {
    background: var(--hot-b);
    box-shadow: 3px 3px 0 var(--hot-a);
    transform: translateY(-2px);
  }

  /* Letter pad */
  .letter-pad {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    width: 100%;
    max-width: 300px;
  }
  .letter-btn {
    aspect-ratio: 1;
    background: var(--paper);
    border: 1px solid var(--ink);
    font-family: 'Major Mono Display', monospace;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
    padding: 0;
    max-height: 36px;
  }
  .letter-btn:active {
    background: var(--cool-a);
    transform: scale(0.92);
  }

  .name-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 4px;
  }
  .ctl-btn {
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    width: 44px;
    height: 44px;
    font-size: 18px;
    cursor: pointer;
  }
  .ctl-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--ink);
  }

  /* Score table */
  .score-table {
    width: 100%;
    max-width: 320px;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    padding: 12px 16px;
    font-family: 'VT323', monospace;
  }
  .score-row {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 4px 0;
    font-size: 20px;
    border-bottom: 1px dashed rgba(26, 24, 20, 0.2);
  }
  .score-row:last-child { border-bottom: none; }
  .score-row.fresh {
    color: var(--hot-a);
    text-shadow: 1px 1px 0 var(--ink);
  }
  .score-rank { opacity: 0.5; font-size: 16px; }
  .score-initials { letter-spacing: 4px; }
  .score-value { text-align: right; }
  .score-empty { text-align: center; opacity: 0.5; padding: 16px; font-size: 16px; }

  /* FLOATING SCORE POPUPS */
  .popup {
    position: absolute;
    font-family: 'VT323', monospace;
    font-size: 28px;
    color: var(--hot-a);
    pointer-events: none;
    animation: rise 0.8s ease-out forwards;
    text-shadow: 2px 2px 0 var(--ink);
  }
  @keyframes rise {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-40px); }
  }

  .level-banner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--ink);
    color: var(--paper);
    border: 3px solid var(--ink);
    padding: 16px 32px;
    text-align: center;
    box-shadow: 8px 8px 0 var(--hot-a);
    z-index: 90;
    pointer-events: none;
    animation: levelPop 2.4s ease-out forwards;
  }
  .banner-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    opacity: 0.7;
    margin-bottom: 6px;
  }
  .banner-name {
    font-family: 'Major Mono Display', monospace;
    font-size: 28px;
    letter-spacing: 8px;
  }
  @keyframes levelPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    25%  { transform: translate(-50%, -50%) scale(1); }
    80%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
  }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="logo">EDMIA</div>
    <div class="stat">
      <div class="label">SCORE</div>
      <div id="score">0</div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>

    <div class="overlay" id="overlay">
      <!-- START SCREEN -->
      <div class="screen" id="screenStart">
        <h1>EDMIA</h1>
        <p>match colors. clear squares. the sweep does the rest. every move you make is part of the song.</p>
        <div class="legend">
          <div class="k">L / R</div><div>slide piece</div>
          <div class="k">ROT</div><div>rotate piece</div>
          <div class="k">DROP</div><div>hard drop</div>
        </div>
        <button class="start-btn" id="startBtn">TAP TO PLAY</button>
        <button class="link-btn" id="viewHiScoresBtn">HIGH SCORES</button>
        <p style="font-size: 11px; opacity: 0.5;">headphones recommended</p>
      </div>

      <!-- NAME ENTRY SCREEN -->
      <div class="screen hidden" id="screenName">
        <h1 class="small">NEW SCORE</h1>
        <p id="newScoreVal" style="font-family: 'VT323', monospace; font-size: 28px; color: var(--hot-a); text-shadow: 2px 2px 0 var(--ink); margin: 0;">0</p>
        <p style="font-size: 12px; margin: 0;">enter your initials</p>
        <div class="initials">
          <div class="initial-slot" data-slot="0">A</div>
          <div class="initial-slot" data-slot="1">A</div>
          <div class="initial-slot" data-slot="2">A</div>
        </div>
        <div class="letter-pad" id="letterPad"></div>
        <div class="name-actions">
          <button class="ctl-btn" id="backspaceBtn">⌫</button>
          <button class="start-btn compact" id="submitNameBtn">SUBMIT</button>
        </div>
      </div>

      <!-- HIGH SCORE TABLE SCREEN -->
      <div class="screen hidden" id="screenScores">
        <h1 class="small">TOP SCORES</h1>
        <div class="score-table" id="scoreTable"></div>
        <button class="start-btn" id="backFromScoresBtn">BACK</button>
      </div>
    </div>
  </div>

  <div class="intensity-wrap">
    <div class="intensity-label">VIBE</div>
    <div class="intensity-bar"><div class="intensity-fill" id="intensityFill"></div></div>
    <div class="section-tag" id="sectionTag">INTRO</div>
  </div>

  <div class="gamepad">
    <div class="pad-left">
      <button class="pad-btn pad-dir" id="btnLeft" aria-label="left">
        <span class="glyph">◀</span>
      </button>
      <button class="pad-btn pad-dir" id="btnRight" aria-label="right">
        <span class="glyph">▶</span>
      </button>
    </div>

    <div class="pad-center">
      <button class="pad-btn pad-boost" id="btnBoost" aria-label="boost">
        <span class="glyph">✦</span>
        <span class="label">BOOST</span>
      </button>
    </div>

    <div class="pad-right">
      <button class="pad-btn pad-rotate" id="btnRotate" aria-label="rotate">
        <span class="glyph">↻</span>
      </button>
      <button class="pad-btn pad-drop" id="btnDrop" aria-label="drop">
        <span class="glyph">▼</span>
      </button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   EDMIA
   A rhythm-locked falling block game.
   Music engine built in Tone.js, modeled after the UKG track.
   All player actions quantize to the next 16th note.
   ============================================================ */

/* ---------- AUDIO ENGINE ---------- */

let audioReady = false;
let masterCompressor, masterGain, reverb, delay;
let kickSynth, snareSynth, hatSynth, rimSynth;
let bassSynth, chordSynth, leadSynth, padSynth;
let swipeHatClosed, swipeHatOpen, rotateSynth, dropSynth, clearSynth, chainSynth;

let currentSection = 'intro';
let intensity = 0; // 0 to 1
let levelIndex = 0;

/* ============================================================
   LEVELS
   Each level has its own BPM, chord progression, bass walk, lead
   line, and color palette. You graduate to the next level when
   your score crosses its threshold.

    }
  }
];

function currentLevel() {
  return LEVELS[levelIndex];
}

/* Convenience accessors that point at the current level's data */
function getChordProg() { return currentLevel().chordProg; }
function getChordProgHigh() { return currentLevel().chordProgHigh; }
function getBassNotes() { return currentLevel().bassNotes; }
function getLeadNotes() { return currentLevel().leadNotes; }

/* Section patterns. These mirror your Strudel arrangement,
   rebuilt as Tone.js sequences. */

let drumLoop, bassLoop, chordLoop, leadLoop;
let drumPart, bassPart, chordPart, leadPart;

async function initAudio() {
  await Tone.start();
  Tone.Transport.bpm.value = currentLevel().bpm;
  Tone.Transport.swing = currentLevel().swing;
  Tone.Transport.swingSubdivision = '16n';

  // Master chain
  masterCompressor = new Tone.Compressor(-18, 4).toDestination();
  masterGain = new Tone.Gain(0.85).connect(masterCompressor);
  reverb = new Tone.Reverb({ decay: 2.5, wet: 0.18 }).connect(masterGain);
  delay = new Tone.FeedbackDelay({ delayTime: '8n.', feedback: 0.25, wet: 0.15 }).connect(masterGain);

  // Drum sounds
  kickSynth = new Tone.MembraneSynth({
    pitchDecay: 0.04,
    octaves: 6,
    envelope: { attack: 0.001, decay: 0.4, sustain: 0, release: 0.4 }
  });
  kickSynth.volume.value = -4;
  kickSynth.connect(masterGain);

  snareSynth = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.13, sustain: 0 }
  });
  snareSynth.volume.value = -12;
  const snareFilter = new Tone.Filter(2000, 'highpass').connect(reverb);
  snareSynth.connect(snareFilter);

  hatSynth = new Tone.MetalSynth({
    frequency: 250,
    envelope: { attack: 0.001, decay: 0.04, release: 0.01 },
    harmonicity: 5.1,
    modulationIndex: 32,
    resonance: 4000,
    octaves: 1.5
  });
  hatSynth.volume.value = -28;
  hatSynth.connect(masterGain);

  rimSynth = new Tone.MetalSynth({
    frequency: 800,
    envelope: { attack: 0.001, decay: 0.02, release: 0.01 },
    harmonicity: 3.1,
    modulationIndex: 16,
    resonance: 2000,
    octaves: 0.5
  });
  rimSynth.volume.value = -22;
  rimSynth.connect(masterGain);

  // Bass
  const bassFilter = new Tone.Filter({ frequency: 600, type: 'lowpass', Q: 6 });
  const bassLFO = new Tone.LFO('1m', 400, 1200).start();
  bassLFO.connect(bassFilter.frequency);
  bassSynth = new Tone.MonoSynth({
    oscillator: { type: 'sawtooth' },
    envelope: { attack: 0.01, decay: 0.2, sustain: 0.6, release: 0.2 },
    filter: { Q: 4 },
    filterEnvelope: { attack: 0.01, decay: 0.1, sustain: 0.5, release: 0.2, baseFrequency: 200, octaves: 2 }
  });
  bassSynth.volume.value = -8;
  bassSynth.chain(bassFilter, masterGain);

  // Chords
  chordSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'sawtooth' },
    envelope: { attack: 0.05, decay: 0.2, sustain: 0.4, release: 0.4 }
  });
  const chordFilter = new Tone.Filter(1500, 'lowpass');
  chordSynth.volume.value = -16;
  chordSynth.chain(chordFilter, reverb);

  // Lead (vocal-chop-ish sine)
  leadSynth = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.02, decay: 0.1, sustain: 0.3, release: 0.6 }
  });
  leadSynth.volume.value = -14;
  leadSynth.chain(delay, reverb);

  // Pad (breakdown)
  padSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'triangle' },
    envelope: { attack: 0.3, decay: 0.5, sustain: 0.6, release: 1.5 }
  });
  padSynth.volume.value = -20;
  padSynth.chain(reverb);

  // PLAYER ACTION SOUNDS
  // Two distinct hi-hat tones for LEFT and RIGHT swipes.
  // Closed hat: short, tight, percussive - for LEFT.
  // Open hat:   longer decay, washier, more air - for RIGHT.
  swipeHatClosed = new Tone.MetalSynth({
    frequency: 320,
    envelope: { attack: 0.001, decay: 0.05, release: 0.02 },
    harmonicity: 5.1,
    modulationIndex: 28,
    resonance: 5000,
    octaves: 1.2
  });
  swipeHatClosed.volume.value = -20;
  swipeHatClosed.connect(masterGain);

  swipeHatOpen = new Tone.MetalSynth({
    frequency: 280,
    envelope: { attack: 0.001, decay: 0.22, release: 0.15 },
    harmonicity: 4.2,
    modulationIndex: 22,
    resonance: 4200,
    octaves: 1.8
  });
  swipeHatOpen.volume.value = -22;
  swipeHatOpen.connect(masterGain);

  rotateSynth = new Tone.MetalSynth({
    frequency: 600,
    envelope: { attack: 0.001, decay: 0.03, release: 0.05 },
    harmonicity: 8,
    modulationIndex: 10,
    octaves: 0.5
  });
  rotateSynth.volume.value = -24;
  rotateSynth.connect(masterGain);

  dropSynth = new Tone.MembraneSynth({
    pitchDecay: 0.08,
    octaves: 4,
    envelope: { attack: 0.001, decay: 0.2, sustain: 0 }
  });
  dropSynth.volume.value = -8;
  dropSynth.connect(masterGain);

  clearSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'square' },
    envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.3 }
  });
  clearSynth.volume.value = -14;
  clearSynth.chain(reverb);

  chainSynth = new Tone.Synth({
    oscillator: { type: 'sawtooth' },
    envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.4 }
  });
  chainSynth.volume.value = -12;
  chainSynth.chain(delay, reverb);

  buildSequences();
  audioReady = true;
}

/* Level 1 progression is Cm Bbmaj Abmaj Gm - minor with a darkness.
   Each level redefines its own progression in the LEVELS array above. */

function buildSequences() {
  /*
    NEW STRUCTURE:
    The bed (kick, hat, bass, chord pads) plays CONTINUOUSLY.
    Section changes adjust the velocity and add layers on top,
    instead of muting parts of the bed.

    Section velocity multiplier (applied to drum hits):
       intro:      0.55  (soft and sparse-feeling)
       breakdown:  0.45  (quieter still, atmospheric)
       drop:       1.0   (full energy)
       vocal:      0.9
       buildup:    1.0
  */
  function sectionVel() {
    switch (currentSection) {
      case 'intro':     return 0.55;
      case 'breakdown': return 0.45;
      case 'drop':      return 1.0;
      case 'vocal':     return 0.9;
      case 'buildup':   return 1.0;
      default:          return 0.8;
    }
  }

  /* 2-step UKG drum grid, 8 eighth-note steps per bar.
     bd: 0, 3, 5  | sd: 2, 6  | hh: 1, 3, 4, 6  | rim: 4, 7 */
  const drumGrid = [
    { step: 0, sound: 'bd' },
    { step: 1, sound: 'hh' },
    { step: 2, sound: 'sd' },
    { step: 3, sound: 'bd' },
    { step: 3, sound: 'hh' },
    { step: 4, sound: 'hh' },
    { step: 4, sound: 'rim' },
    { step: 5, sound: 'bd' },
    { step: 6, sound: 'sd' },
    { step: 6, sound: 'hh' },
    { step: 7, sound: 'rim' }
  ];

  drumPart = new Tone.Loop((time) => {
    try {
      const vel = sectionVel();
      drumGrid.forEach(hit => {
        const offset = hit.step * Tone.Time('8n').toSeconds();
        const t = time + offset;
        switch (hit.sound) {
          case 'bd':
            // Kick ALWAYS plays, just softer in low sections
            kickSynth.triggerAttackRelease('C1', '8n', t, vel);
            break;
          case 'hh':
            // Hat ALWAYS plays
            hatSynth.triggerAttackRelease('C5', '32n', t, 0.3 * vel);
            break;
          case 'sd':
            // Snare only joins in high-energy sections
            if (currentSection === 'drop' || currentSection === 'vocal' || currentSection === 'buildup') {
              snareSynth.triggerAttackRelease('16n', t, vel);
            }
            break;
          case 'rim':
            // Rim adds texture in drop/vocal
            if (currentSection === 'drop' || currentSection === 'vocal') {
              rimSynth.triggerAttackRelease('C5', '32n', t, 0.2 * vel);
            }
            break;
        }
      });
    } catch (e) {}
  }, '1m').start(0);

  // Bass ALWAYS plays, velocity scales with section
  bassPart = new Tone.Loop((time) => {
    try {
      const vel = sectionVel();
      const notes = getBassNotes();
      notes.forEach((n, i) => {
        if (n) {
          const t = time + i * Tone.Time('8n').toSeconds();
          bassSynth.triggerAttackRelease(n, '8n', t, vel);
        }
      });
    } catch (e) {}
  }, '1m').start(0);

  // Chord pads ALWAYS play, softer in intro/breakdown
  let chordIdx = 0;
  chordPart = new Tone.Loop((time) => {
    try {
      const prog = getChordProg();
      const chord = prog[chordIdx % prog.length];
      const vel = currentSection === 'breakdown' ? 0.35
                : currentSection === 'intro' ? 0.4
                : 0.55;
      chordSynth.triggerAttackRelease(chord, '2n', time, vel);
      chordIdx++;
    } catch (e) {}
  }, '1m').start(0);

  // Lead (vocal section): melody from current level
  leadPart = new Tone.Loop((time) => {
    try {
      if (currentSection !== 'vocal') return;
      const notes = getLeadNotes();
      notes.forEach((n, i) => {
        if (n) {
          const t = time + i * Tone.Time('8n').toSeconds();
          leadSynth.triggerAttackRelease(n, '16n', t);
        }
      });
    } catch (e) {}
  }, '1m').start(0);
}

/* Section management driven by gameplay intensity */

function updateSection(stackHeight, recentClears) {
  // intensity 0..1 based on stack fill
  intensity = Math.min(1, stackHeight / (WELL_HEIGHT * 0.85) + recentClears * 0.1);

  let next;
  if (intensity < 0.15) next = 'intro';
  else if (intensity < 0.4) next = 'breakdown';
  else if (intensity < 0.7) next = 'drop';
  else if (intensity < 0.9) next = 'vocal';
  else next = 'buildup';

  if (next !== currentSection) {
    currentSection = next;
    document.getElementById('sectionTag').textContent = currentLevel().name + ' · ' + next.toUpperCase();
  }
  document.getElementById('intensityFill').style.width = (intensity * 100) + '%';
}

/* Safe audio trigger wrapper */
function safeAudio(fn) {
  try { fn(); } catch (e) { /* swallow - audio errors should never break gameplay */ }
}

/* Quantize a function call to next 16th note */
function quantize(fn) {
  if (!audioReady) return;
  try {
    const t = Tone.Transport.nextSubdivision('16n');
    Tone.Transport.scheduleOnce((tt) => safeAudio(() => fn(tt)), t);
  } catch (e) { /* swallow */ }
}

/* Player-action sound triggers (called via quantize) */

function playSwipe(direction) {
  if (!audioReady) return;
  // LEFT  = closed hat (tight, short)
  // RIGHT = open hat (washier, longer)
  if (direction < 0) {
    quantize((t) => swipeHatClosed.triggerAttackRelease('C6', '32n', t, 0.7));
  } else {
    quantize((t) => swipeHatOpen.triggerAttackRelease('C6', '16n', t, 0.6));
  }
}

function playRotate() {
  if (!audioReady) return;
  quantize((t) => rotateSynth.triggerAttackRelease('C6', '32n', t, 0.3));
}

function playDrop() {
  if (!audioReady) return;
  quantize((t) => dropSynth.triggerAttackRelease('G1', '8n', t));
}

function playClear(squareCount) {
  if (!audioReady) return;
  const bar = currentBarIndex();
  const chord = getChordProgHigh()[bar];
  quantize((t) => {
    clearSynth.triggerAttackRelease(chord, '8n', t, 0.7);
    if (squareCount >= 2) chainSynth.triggerAttackRelease('C6', '16n', t + 0.05, 0.6);
    if (squareCount >= 3) chainSynth.triggerAttackRelease('Eb6', '16n', t + 0.1, 0.7);
    if (squareCount >= 4) chainSynth.triggerAttackRelease('G6', '16n', t + 0.15, 0.8);
  });
}

function playLand(col) {
  if (!audioReady) return;
  quantize((t) => rimSynth.triggerAttackRelease('C6', '64n', t, 0.15));
}

function currentBarIndex() {
  try {
    const posStr = String(Tone.Transport.position);
    const barNum = parseInt(posStr.split(':')[0]) || 0;
    return ((barNum % 4) + 4) % 4;
  } catch (e) { return 0; }
}

/* ============================================================
   LEVEL PROGRESSION
   ============================================================ */

function checkLevelUp() {
  // Find the highest level whose threshold we've crossed
  let target = 0;
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (score >= LEVELS[i].threshold) { target = i; break; }
  }
  if (target !== levelIndex) {
    applyLevel(target);
  }
}

function applyLevel(idx) {
  levelIndex = idx;
  const lvl = currentLevel();

  // Smoothly ramp the tempo and swing to the new values
  if (audioReady) {
    try {
      Tone.Transport.bpm.rampTo(lvl.bpm, 1.5);
      Tone.Transport.swing = lvl.swing;
    } catch (e) {}
  }

  // Update the visual palette CSS variables
  document.documentElement.style.setProperty('--bg', lvl.palette.bg);
  document.documentElement.style.setProperty('--paper', lvl.palette.paper);
  document.body.style.background = lvl.palette.bg;

  // Refresh the section tag with the new level name
  document.getElementById('sectionTag').textContent = lvl.name + ' · ' + currentSection.toUpperCase();

  // Show a level-up announcement
  announceLevel(lvl.name);
}

function announceLevel(name) {
  const stage = document.getElementById('stage');
  const banner = document.createElement('div');
  banner.className = 'level-banner';
  banner.innerHTML = `<div class="banner-label">NEW TRACK</div><div class="banner-name">${name}</div>`;
  stage.appendChild(banner);
  setTimeout(() => banner.remove(), 2400);
}

/* ============================================================
   GAME
   ============================================================ */

const WELL_WIDTH = 6;
const WELL_HEIGHT = 14;

const COLOR_A = 0; // hot
const COLOR_B = 1; // cool

let grid = [];          // grid[row][col] = null or { color, hue, marked }
let currentPiece = null;
let sweepX = 0;         // sweep bar position in column units (0..WELL_WIDTH)
let score = 0;
let lastFallTime = 0;
let fallInterval = 800; // ms
let gameRunning = false;
let lastTouchX = null;
let lastTouchY = null;
let hueShift = 0;       // global hue rotation for visual flair

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function initGrid() {
  grid = [];
  for (let r = 0; r < WELL_HEIGHT; r++) {
    const row = [];
    for (let c = 0; c < WELL_WIDTH; c++) row.push(null);
    grid.push(row);
  }
}

function makePiece() {
  // 2x2 piece, each cell randomly colored A or B
  const cells = [
    [Math.random() < 0.5 ? COLOR_A : COLOR_B, Math.random() < 0.5 ? COLOR_A : COLOR_B],
    [Math.random() < 0.5 ? COLOR_A : COLOR_B, Math.random() < 0.5 ? COLOR_A : COLOR_B]
  ];
  return {
    cells,
    row: 0,
    col: Math.floor(WELL_WIDTH / 2) - 1
  };
}

function spawnPiece() {
  currentPiece = makePiece();
  // game over check
  if (collides(currentPiece, currentPiece.row, currentPiece.col)) {
    gameOver();
  }
}

function collides(piece, row, col) {
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 2; c++) {
      const gr = row + r;
      const gc = col + c;
      if (gc < 0 || gc >= WELL_WIDTH || gr >= WELL_HEIGHT) return true;
      if (gr >= 0 && grid[gr][gc]) return true;
    }
  }
  return false;
}

function lockPiece() {
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 2; c++) {
      const gr = currentPiece.row + r;
      const gc = currentPiece.col + c;
      if (gr >= 0 && gr < WELL_HEIGHT) {
        grid[gr][gc] = {
          color: currentPiece.cells[r][c],
          hue: Math.random() * 360,
          marked: false,
          markedColor: null
        };
      }
    }
  }
  playLand(currentPiece.col);

  // After locking, blocks should fall by gravity column-by-column
  applyGravity();
  scanForSquares();
  spawnPiece();

  // adjust intensity
  let stackHeight = 0;
  for (let r = 0; r < WELL_HEIGHT; r++) {
    for (let c = 0; c < WELL_WIDTH; c++) {
      if (grid[r][c]) { stackHeight = WELL_HEIGHT - r; break; }
    }
    if (stackHeight) break;
  }
  updateSection(stackHeight, 0);
}

function applyGravity() {
  for (let c = 0; c < WELL_WIDTH; c++) {
    // collect non-null cells from bottom up
    const stack = [];
    for (let r = WELL_HEIGHT - 1; r >= 0; r--) {
      if (grid[r][c]) stack.push(grid[r][c]);
    }
    // refill column
    for (let r = WELL_HEIGHT - 1; r >= 0; r--) {
      const popped = stack.shift();
      grid[r][c] = popped || null;
    }
  }
}

/* Scan grid for 2x2 same-color squares, mark them.
   They get cleared when the sweep bar passes over them. */
function scanForSquares() {
  for (let r = 0; r < WELL_HEIGHT - 1; r++) {
    for (let c = 0; c < WELL_WIDTH - 1; c++) {
      const a = grid[r][c];
      const b = grid[r][c+1];
      const cc = grid[r+1][c];
      const d = grid[r+1][c+1];
      if (a && b && cc && d &&
          a.color === b.color && b.color === cc.color && cc.color === d.color) {
        a.marked = true; a.markedColor = a.color;
        b.marked = true; b.markedColor = a.color;
        cc.marked = true; cc.markedColor = a.color;
        d.marked = true; d.markedColor = a.color;
      }
    }
  }
}

let clearsThisSweep = 0;

function processSweepColumn(col) {
  // Clear all marked blocks in this column
  let cleared = 0;
  for (let r = 0; r < WELL_HEIGHT; r++) {
    if (grid[r][col] && grid[r][col].marked) {
      grid[r][col] = null;
      cleared++;
    }
  }
  if (cleared > 0) {
    clearsThisSweep += cleared;
    score += cleared * (10 + clearsThisSweep * 5);
    document.getElementById('score').textContent = score;
    playClear(Math.ceil(clearsThisSweep / 4));
    spawnPopup(col, cleared);
    checkLevelUp();
  }
}

function finishSweep() {
  if (clearsThisSweep > 0) {
    applyGravity();
    scanForSquares();
  }
  clearsThisSweep = 0;
}

function spawnPopup(col, count) {
  const stage = document.getElementById('stage');
  const stageRect = stage.getBoundingClientRect();
  const { cellSize, offsetX, offsetY, wellH } = getPlayfield();
  const popup = document.createElement('div');
  popup.className = 'popup';
  popup.textContent = '+' + (count * (10 + clearsThisSweep * 5));
  popup.style.left = (offsetX + col * cellSize + cellSize / 2 - 20) + 'px';
  popup.style.top = (offsetY + wellH / 2) + 'px';
  stage.appendChild(popup);
  setTimeout(() => popup.remove(), 800);
}

/* CONTROLS */

function moveLeft() {
  if (!currentPiece || !gameRunning) return;
  if (!collides(currentPiece, currentPiece.row, currentPiece.col - 1)) {
    currentPiece.col--;
    playSwipe(-1);
  }
}
function moveRight() {
  if (!currentPiece || !gameRunning) return;
  if (!collides(currentPiece, currentPiece.row, currentPiece.col + 1)) {
    currentPiece.col++;
    playSwipe(1);
  }
}
function rotatePiece() {
  if (!currentPiece || !gameRunning) return;
  // rotate 2x2 clockwise
  const c = currentPiece.cells;
  currentPiece.cells = [
    [c[1][0], c[0][0]],
    [c[1][1], c[0][1]]
  ];
  playRotate();
}
function hardDrop() {
  if (!currentPiece || !gameRunning) return;
  while (!collides(currentPiece, currentPiece.row + 1, currentPiece.col)) {
    currentPiece.row++;
  }
  playDrop();
  lockPiece();
}

function boost() {
  // temporarily speed up the fall
  fallInterval = Math.max(150, fallInterval - 200);
  setTimeout(() => { fallInterval = Math.min(800, fallInterval + 200); }, 2000);
  // also trigger a riser sound
  if (audioReady) {
    quantize((t) => {
      chainSynth.triggerAttackRelease('C5', '4n', t, 0.7);
      chainSynth.triggerAttackRelease('G5', '4n', t + 0.1, 0.6);
    });
  }
}

/* RENDER */

function colorFor(block) {
  if (!block) return null;
  const lvl = currentLevel();
  // base palette comes from the current level, shifts subtly with hueShift
  const baseHue = block.color === COLOR_A
    ? (lvl.palette.hotHue + hueShift * 0.3) % 360
    : (lvl.palette.coolHue + hueShift * 0.3) % 360;
  const sat = block.marked ? 95 : 80;
  const light = block.marked ? 65 : 55;
  return `hsl(${baseHue}, ${sat}%, ${light}%)`;
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* Compute square cell size, well dimensions, and offsets to center it in canvas */
function getPlayfield() {
  const rect = canvas.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;
  const cellSize = Math.floor(Math.min(W / WELL_WIDTH, H / WELL_HEIGHT));
  const wellW = cellSize * WELL_WIDTH;
  const wellH = cellSize * WELL_HEIGHT;
  const offsetX = Math.floor((W - wellW) / 2);
  const offsetY = Math.floor((H - wellH) / 2);
  return { W, H, cellSize, wellW, wellH, offsetX, offsetY };
}

function draw() {
  const { W, H, cellSize, wellW, wellH, offsetX, offsetY } = getPlayfield();

  // background outside the well
  ctx.fillStyle = '#fffbf2';
  ctx.fillRect(0, 0, W, H);

  // soft frame around the playfield
  ctx.fillStyle = 'rgba(26, 24, 20, 0.04)';
  ctx.fillRect(offsetX - 4, offsetY - 4, wellW + 8, wellH + 8);
  ctx.fillStyle = '#fffbf2';
  ctx.fillRect(offsetX, offsetY, wellW, wellH);

  // subtle grid lines
  ctx.strokeStyle = 'rgba(26, 24, 20, 0.06)';
  ctx.lineWidth = 1;
  for (let i = 1; i < WELL_WIDTH; i++) {
    ctx.beginPath();
    ctx.moveTo(offsetX + i * cellSize, offsetY);
    ctx.lineTo(offsetX + i * cellSize, offsetY + wellH);
    ctx.stroke();
  }
  for (let i = 1; i < WELL_HEIGHT; i++) {
    ctx.beginPath();
    ctx.moveTo(offsetX, offsetY + i * cellSize);
    ctx.lineTo(offsetX + wellW, offsetY + i * cellSize);
    ctx.stroke();
  }

  // grid blocks
  for (let r = 0; r < WELL_HEIGHT; r++) {
    for (let c = 0; c < WELL_WIDTH; c++) {
      const b = grid[r][c];
      if (!b) continue;
      drawBlock(offsetX + c * cellSize, offsetY + r * cellSize, cellSize, cellSize, b);
    }
  }

  // current piece
  if (currentPiece) {
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 2; c++) {
        const gr = currentPiece.row + r;
        const gc = currentPiece.col + c;
        const fakeBlock = { color: currentPiece.cells[r][c], hue: 0, marked: false };
        drawBlock(offsetX + gc * cellSize, offsetY + gr * cellSize, cellSize, cellSize, fakeBlock, true);
      }
    }
  }

  // sweep bar
  const sweepPx = offsetX + (sweepX / WELL_WIDTH) * wellW;
  const sweepColor = currentLevel().sweep;
  ctx.fillStyle = sweepColor.glow;
  ctx.fillRect(sweepPx, offsetY, cellSize * 0.15, wellH);
  ctx.fillStyle = sweepColor.line;
  ctx.fillRect(sweepPx, offsetY, 3, wellH);
  // trailing glow
  const grad = ctx.createLinearGradient(sweepPx - 20, 0, sweepPx, 0);
  grad.addColorStop(0, sweepColor.fade);
  grad.addColorStop(1, sweepColor.tail);
  ctx.fillStyle = grad;
  ctx.fillRect(sweepPx - 20, offsetY, 20, wellH);
}

function drawBlock(x, y, w, h, block, isPiece) {
  const pad = 2;
  ctx.fillStyle = colorFor(block);
  ctx.fillRect(x + pad, y + pad, w - pad * 2, h - pad * 2);

  // inner highlight
  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.fillRect(x + pad, y + pad, w - pad * 2, 3);

  // shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(x + pad, y + h - pad - 3, w - pad * 2, 3);

  // outline
  ctx.strokeStyle = 'rgba(26, 24, 20, 0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + pad, y + pad, w - pad * 2, h - pad * 2);

  // marked pulse
  if (block.marked) {
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 100);
    ctx.fillStyle = `rgba(255, 255, 255, ${pulse * 0.4})`;
    ctx.fillRect(x + pad, y + pad, w - pad * 2, h - pad * 2);
  }
}

/* MAIN LOOP */

let lastFrameTime = 0;
let sweepStartBar = 0;

function tick(now) {
  if (!gameRunning) return;

  const dt = now - lastFrameTime;
  lastFrameTime = now;

  // hue drift for color variety
  hueShift = (hueShift + dt * 0.01) % 360;

  // fall
  if (currentPiece) {
    if (now - lastFallTime > fallInterval) {
      lastFallTime = now;
      if (!collides(currentPiece, currentPiece.row + 1, currentPiece.col)) {
        currentPiece.row++;
      } else {
        lockPiece();
      }
    }
  }

  // sweep bar synced to transport.
  // One sweep across the well takes 4 bars (one chord progression cycle).
  if (audioReady) {
    const posStr = String(Tone.Transport.position);
    const parts = posStr.split(':');
    const barsPart = parseFloat(parts[0]) || 0;
    const beatsPart = parseFloat(parts[1]) || 0;
    const sixteenthsPart = parseFloat(parts[2]) || 0;
    const bars = barsPart + beatsPart / 4 + sixteenthsPart / 16;
    const cycleBars = 4;
    const phase = (bars % cycleBars) / cycleBars; // 0..1
    const prevSweepX = sweepX;
    sweepX = phase * WELL_WIDTH;

    // Check which columns we crossed since last frame
    const prevCol = Math.floor(prevSweepX);
    const currCol = Math.floor(sweepX);

    if (currCol !== prevCol) {
      if (currCol > prevCol) {
        for (let c = prevCol + 1; c <= currCol; c++) {
          if (c < WELL_WIDTH) processSweepColumn(c);
        }
      } else {
        // wrapped around: finish previous columns, then start over
        for (let c = prevCol + 1; c < WELL_WIDTH; c++) processSweepColumn(c);
        finishSweep();
        processSweepColumn(0);
      }
    }
  }

  draw();
  requestAnimationFrame(tick);
}

function gameOver() {
  gameRunning = false;
  if (audioReady) {
    try { Tone.Transport.stop(); } catch (e) {}
  }
  if (qualifiesForHighScore(score)) {
    showNameEntry(score);
  } else {
    showStartScreen();
  }
}

/* ============================================================
   HIGH SCORES
   ============================================================ */

const HISCORE_KEY = 'edmia_highscores_v1';
const MAX_SCORES = 10;
let memoryScores = []; // fallback when localStorage is unavailable
let storageWorks = null;

function testStorage() {
  if (storageWorks !== null) return storageWorks;
  try {
    localStorage.setItem('__edmia_test', '1');
    localStorage.removeItem('__edmia_test');
    storageWorks = true;
  } catch (e) {
    storageWorks = false;
  }
  return storageWorks;
}

function loadScores() {
  if (testStorage()) {
    try {
      const raw = localStorage.getItem(HISCORE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }
  return memoryScores.slice();
}

function saveScores(scores) {
  if (testStorage()) {
    try { localStorage.setItem(HISCORE_KEY, JSON.stringify(scores)); } catch (e) {}
  } else {
    memoryScores = scores.slice();
  }
}

function qualifiesForHighScore(s) {
  if (s <= 0) return false;
  const scores = loadScores();
  if (scores.length < MAX_SCORES) return true;
  return s > scores[scores.length - 1].score;
}

function insertScore(initials, s) {
  const scores = loadScores();
  scores.push({ initials, score: s, ts: Date.now() });
  scores.sort((a, b) => b.score - a.score);
  const trimmed = scores.slice(0, MAX_SCORES);
  saveScores(trimmed);
  return trimmed.findIndex(r => r.initials === initials && r.score === s && r.ts === scores.find(x => x.initials === initials && x.score === s).ts);
}

/* SCREEN MANAGEMENT */

function showScreen(id) {
  document.getElementById('overlay').classList.remove('hidden');
  ['screenStart', 'screenName', 'screenScores'].forEach(sid => {
    document.getElementById(sid).classList.toggle('hidden', sid !== id);
  });
}

function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}

function showStartScreen() {
  showScreen('screenStart');
  document.getElementById('startBtn').textContent = 'TAP TO PLAY';
}

function showScoresScreen(freshIndex) {
  showScreen('screenScores');
  const scores = loadScores();
  const table = document.getElementById('scoreTable');
  if (scores.length === 0) {
    table.innerHTML = '<div class="score-empty">no scores yet</div>';
    return;
  }
  table.innerHTML = scores.map((row, i) => {
    const fresh = (i === freshIndex) ? ' fresh' : '';
    return `<div class="score-row${fresh}">
      <div class="score-rank">${String(i + 1).padStart(2, '0')}</div>
      <div class="score-initials">${row.initials}</div>
      <div class="score-value">${row.score}</div>
    </div>`;
  }).join('');
}

/* NAME ENTRY */

let nameInitials = ['A', 'A', 'A'];
let activeSlot = 0;
let pendingScore = 0;

function showNameEntry(s) {
  pendingScore = s;
  nameInitials = ['A', 'A', 'A'];
  activeSlot = 0;
  document.getElementById('newScoreVal').textContent = s;
  renderInitials();
  showScreen('screenName');
}

function renderInitials() {
  const slots = document.querySelectorAll('.initial-slot');
  slots.forEach((el, i) => {
    el.textContent = nameInitials[i];
    el.classList.toggle('active', i === activeSlot);
  });
}

function buildLetterPad() {
  const pad = document.getElementById('letterPad');
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0_';
  pad.innerHTML = '';
  for (const ch of letters) {
    const btn = document.createElement('button');
    btn.className = 'letter-btn';
    btn.textContent = ch === '_' ? '␣' : ch;
    btn.addEventListener('click', () => pickLetter(ch === '_' ? ' ' : ch));
    pad.appendChild(btn);
  }
}

function pickLetter(ch) {
  nameInitials[activeSlot] = ch;
  if (activeSlot < 2) activeSlot++;
  renderInitials();
}

function backspace() {
  if (activeSlot > 0) {
    nameInitials[activeSlot] = 'A';
    activeSlot--;
    nameInitials[activeSlot] = 'A';
  } else {
    nameInitials[0] = 'A';
  }
  renderInitials();
}

function submitName() {
  const initials = nameInitials.join('');
  insertScore(initials, pendingScore);
  // Find the freshly inserted row by matching score and initials (most recent insert)
  const scores = loadScores();
  let idx = -1;
  for (let i = 0; i < scores.length; i++) {
    if (scores[i].initials === initials && scores[i].score === pendingScore) { idx = i; break; }
  }
  showScoresScreen(idx);
}

async function startGame() {
  if (!audioReady) await initAudio();
  hideOverlay();
  resize();
  initGrid();
  score = 0;
  document.getElementById('score').textContent = '0';
  fallInterval = 800;
  sweepX = 0;
  currentSection = 'intro';
  document.getElementById('sectionTag').textContent = currentLevel().name + ' · INTRO';
  // Reset to level 1 (index 0) and apply its palette/tempo
  levelIndex = 0;
  const lvl = currentLevel();
  document.documentElement.style.setProperty('--bg', lvl.palette.bg);
  document.documentElement.style.setProperty('--paper', lvl.palette.paper);
  document.body.style.background = lvl.palette.bg;
  try {
    Tone.Transport.bpm.value = lvl.bpm;
    Tone.Transport.swing = lvl.swing;
  } catch (e) {}
  Tone.Transport.position = 0;
  Tone.Transport.start();
  spawnPiece();
  gameRunning = true;
  lastFrameTime = performance.now();
  lastFallTime = performance.now();
  requestAnimationFrame(tick);
}

/* INPUT */

function bindButton(id, fn) {
  const el = document.getElementById(id);
  const trigger = (e) => {
    e.preventDefault();
    fn();
  };
  el.addEventListener('touchstart', trigger, { passive: false });
  el.addEventListener('mousedown', trigger);
}

bindButton('btnLeft', moveLeft);
bindButton('btnRight', moveRight);
bindButton('btnRotate', rotatePiece);
bindButton('btnDrop', hardDrop);
bindButton('btnBoost', boost);

// Swipe on the game stage itself
const stage = document.getElementById('stage');
stage.addEventListener('touchstart', (e) => {
  if (!gameRunning) return;
  const t = e.touches[0];
  lastTouchX = t.clientX;
  lastTouchY = t.clientY;
}, { passive: true });

stage.addEventListener('touchend', (e) => {
  if (!gameRunning || lastTouchX === null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - lastTouchX;
  const dy = t.clientY - lastTouchY;
  const absX = Math.abs(dx);
  const absY = Math.abs(dy);
  if (absX < 20 && absY < 20) {
    // tap = rotate
    rotatePiece();
  } else if (absX > absY) {
    if (dx > 0) moveRight(); else moveLeft();
  } else {
    if (dy > 0) hardDrop();
  }
  lastTouchX = null;
  lastTouchY = null;
}, { passive: true });

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('startBtn').addEventListener('touchend', (e) => {
  e.preventDefault();
  startGame();
}, { passive: false });

document.getElementById('viewHiScoresBtn').addEventListener('click', () => showScoresScreen(-1));
document.getElementById('backFromScoresBtn').addEventListener('click', () => showStartScreen());
document.getElementById('backspaceBtn').addEventListener('click', backspace);
document.getElementById('submitNameBtn').addEventListener('click', submitName);

// Tap an initial slot to make it active
document.querySelectorAll('.initial-slot').forEach(el => {
  el.addEventListener('click', () => {
    activeSlot = parseInt(el.dataset.slot);
    renderInitials();
  });
});

buildLetterPad();
renderInitials();

window.addEventListener('resize', resize);
initGrid();
resize();
draw();

</script>
