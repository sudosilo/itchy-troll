      + 'display:block;border:2px solid #7a2e28;box-shadow:0 1px 3px rgba(43,38,32,.25);}'
      + '.mtg-seal-btn{background:none;border:0;padding:0;margin:0;cursor:pointer;'
      + 'display:flex;align-items:center;line-height:0;transition:transform .18s ease;}'
      + '.mtg-seal.open .mtg-seal-btn{transform:rotate(-8deg) scale(.94);}'
      + '.mtg-seal-svg{display:block;}'
      + '.mtg-seal-label{text-align:left;line-height:1.35;}'
      + '.mtg-seal-org{display:block;font-family:Georgia,"Times New Roman",serif;'
      + 'font-size:14px;letter-spacing:.3px;color:#2b2620;}'
      // RED PHONE: export subtitle with an inline linkable nation word.
      + '.mtg-seal-export{display:block;font-family:Georgia,"Times New Roman",serif;'
      + 'font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#4a443b;margin:2px 0;}'
      + '.mtg-seal-link{color:#7a2e28;text-decoration:underline;}'
      + '.mtg-seal-link:hover{color:#5f231e;}'
      + '.mtg-seal-ask{display:inline-block;background:none;border:0;padding:0;margin:0;'
      + 'font:inherit;font-size:12px;color:#7a2e28;text-decoration:underline;cursor:pointer;}'
      + '.mtg-seal-panel{overflow:hidden;max-height:0;opacity:0;'
      + 'transition:max-height .25s ease,opacity .25s ease;width:100%;max-width:360px;}'
      + '.mtg-seal.open .mtg-seal-panel{max-height:300px;opacity:1;}'
      + '.mtg-seal-mission{font-style:italic;color:#4a443b;font-size:13px;'
      + 'text-align:center;margin:0 0 12px;line-height:1.5;}'
      + '.mtg-seal-links{display:flex;justify-content:center;gap:10px;}'
      + '.mtg-seal-links a{flex:1;text-align:center;text-decoration:none;'
      + 'font-size:13px;color:#2b2620;background:#faf7ef;border:1px solid #cabfa3;'
      + 'border-radius:6px;padding:8px 10px;transition:background .15s ease;}'
      + '.mtg-seal-links a:hover{background:#fff;}'
      + '.mtg-flag-btn:focus-visible,.mtg-seal-btn:focus-visible,.mtg-seal-ask:focus-visible,'
      + '.mtg-seal-link:focus-visible{outline:2px solid #7a2e28;outline-offset:3px;border-radius:4px;}'
      + '.mtg-seal-links a:focus-visible{outline:2px solid #7a2e28;outline-offset:2px;}'
      + '@media (prefers-reduced-motion: reduce){'
      + '.mtg-flag-btn,.mtg-seal-btn,.mtg-seal-panel{transition:none;}}';

    var style = document.createElement("style");
    style.textContent = css;
    head.appendChild(style);

    var seal = document.createElement("footer");
    seal.className = "mtg-seal";
    seal.innerHTML = ''
      + '<div class="mtg-seal-row">'
      +   '<button class="mtg-flag-btn" type="button" aria-label="Toggle maker details">'
      +     '<img class="mtg-flag" src="' + CONFIG.flag + '" alt="' + CONFIG.nation + ' flag">'
      +   '</button>'
      +   '<button class="mtg-seal-btn" type="button" aria-label="Toggle maker details">'
      +     buildSeal()
      +   '</button>'
      +   '<span class="mtg-seal-label">'
      +     '<span class="mtg-seal-org">' + CONFIG.org + '</span>'
      +     '<span class="mtg-seal-export">Certified export of '
      +       '<a class="mtg-seal-link" href="' + CONFIG.site + '" target="_blank" rel="noopener">'
      +       CONFIG.nation + '</a></span>'
      +     '<button class="mtg-seal-ask" type="button" aria-expanded="false">Who made this?</button>'
      +   '</span>'
      + '</div>'
      + '<div class="mtg-seal-panel">'
      +   '<p class="mtg-seal-mission">' + CONFIG.mission + '</p>'
      +   '<div class="mtg-seal-links">'
      +     '<a href="' + CONFIG.site + '" target="_blank" rel="noopener">' + CONFIG.nation + '</a>'
      +     '<a href="' + CONFIG.github + '" target="_blank" rel="noopener me">GitHub</a>'
      +     '<a href="' + CONFIG.linkedin + '" target="_blank" rel="noopener me">LinkedIn</a>'
      +   '</div>'
      + '</div>';

    // RED PHONE: flag badge and "Who made this?" both toggle the panel.
    var ask = seal.querySelector(".mtg-seal-ask");
    var flagBtn = seal.querySelector(".mtg-flag-btn");
    function toggle() {
      var nowOpen = seal.classList.toggle("open");
      ask.setAttribute("aria-expanded", nowOpen ? "true" : "false");
    }
    ask.addEventListener("click", toggle);
    flagBtn.addEventListener("click", toggle);
    seal.querySelector(".mtg-seal-btn").addEventListener("click", toggle);

    // RED PHONE: drop this block into a page with no seal container and it
    // still lands at the bottom of body exactly like before. Give a page a
    // <div id="mtgSealContainer"> anywhere and the seal lands there instead,
    // which is how the landing screen pins it to its own bottom edge rather
    // than the bottom of the whole document.
    var sealContainer = document.getElementById("mtgSealContainer") || document.body;
    sealContainer.appendChild(seal);

  })();
  </script>
