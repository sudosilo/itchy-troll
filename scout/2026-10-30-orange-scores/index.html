<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Hub</title>
<style>
:root { --bg: #f7f6f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1d9; --accent: #c2410c; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
h2 { font-size: 15px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.row { display: flex; gap: 12px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; }
.row:first-of-type { border-top: 0; }
.tag { font-family: ui-monospace, monospace; font-weight: 700; white-space: pre; }
.score { margin-left: auto; font-variant-numeric: tabular-nums; }
.game { color: var(--accent); font-weight: 600; }
.dim { color: var(--muted); font-size: 13px; }
a { color: var(--accent); }
.empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
<h1>Score Hub</h1>
<p class="sub">Top scores and live plays across every game.</p>
<section><h2>Games</h2><div id="games"><p class="empty">Loading</p></div></section>
<section><h2>Recent plays</h2><div id="feed"><p class="empty">Loading</p></div></section>
</main>
<script src="sdk.js"></script>
<script src="hub.js"></script>
</body>
</html>
