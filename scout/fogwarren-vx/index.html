<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000080">
<title>FogWarren</title>
<style>
:root{--face:#c0c0c0;--hi:#ffffff;--lite:#dfdfdf;--sh:#808080;--dk:#0a0a0a;--navy:#000080;--b:56px}
@media (max-height:740px){:root{--b:50px}}
@media (max-height:640px){:root{--b:44px}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#008080}
body{font:12px Tahoma,"MS Sans Serif",Verdana,Geneva,sans-serif;color:#000;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:#000}
.raised{box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--lite),inset -2px -2px var(--sh),inset 2px 2px var(--hi)}
.sunken{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh),inset -2px -2px var(--lite),inset 2px 2px var(--dk)}
.thin{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh)}
.pressed,.btn.down,.btn:active,.smiley:active,.tb:active{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lite),inset 2px 2px var(--sh)}
#win{position:fixed;top:max(4px,env(safe-area-inset-top));bottom:max(4px,env(safe-area-inset-bottom));left:max(4px,env(safe-area-inset-left));right:max(4px,env(safe-area-inset-right));margin:0 auto;max-width:780px;display:flex;flex-direction:column;background:var(--face);padding:3px}
.title{height:22px;flex:none;display:flex;align-items:center;gap:5px;padding:0 3px 0 4px;background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;font-size:12px}
.title .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;gap:2px}
.tb{width:18px;height:16px;padding:0;border:0;background:var(--face);display:flex;align-items:center;justify-content:center;cursor:pointer}
.menubar{flex:none;display:flex;padding:2px 0}
.mi{padding:3px 9px;cursor:pointer}
.mi.open{background:var(--navy);color:#fff}
.hud{flex:none;display:flex;align-items:center;justify-content:space-between;padding:5px 7px;margin:2px 0 4px}
.led{background:#000;color:#ff2020;font:bold 22px/1 "Courier New",Courier,monospace;padding:3px 4px 2px;min-width:54px;text-align:right;letter-spacing:1px;text-shadow:0 0 4px rgba(255,0,0,.55)}
.smiley{width:38px;height:38px;border:0;padding:0;background:var(--face);display:flex;align-items:center;justify-content:center;cursor:pointer}
#view{position:relative;flex:1;min-height:120px;padding:2px;touch-action:none;background:#008080;overflow:hidden}
#cv{display:block;width:100%;height:100%}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;background:#ffffe1;border:1px solid #000;padding:4px 8px;font-size:12px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
#toast.show{opacity:1}
.controls{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 2px 4px}
.group{flex:1;min-width:0;border:1px solid var(--sh);box-shadow:1px 1px 0 var(--hi),inset 1px 1px 0 var(--hi);padding:12px 6px 6px;position:relative;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:5px;font-size:11px}
.group .lg{position:absolute;top:-7px;left:6px;background:var(--face);padding:0 3px;font-size:11px;white-space:nowrap}
.row{display:flex;justify-content:space-between;gap:4px;white-space:nowrap}
.dpad{display:grid;grid-template-columns:repeat(3,var(--b));grid-template-rows:repeat(3,var(--b));gap:3px;flex:none}
.btn{border:0;background:var(--face);padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
.dpad .btn{width:var(--b);height:var(--b)}
.dc{display:flex;align-items:center;justify-content:center;background:var(--face)}
.dc svg{transition:transform .15s}
.sense{align-self:center;min-width:40px;text-align:center}
.zrow{display:flex;gap:4px;margin-top:2px}
.zrow .btn{flex:1;height:26px;font-weight:bold;font-size:15px}
.status{flex:none;display:flex;gap:2px;margin-top:2px}
.status>div{padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status>div:first-child{flex:1}
.drop{position:fixed;z-index:50;background:var(--face);padding:3px;min-width:190px;display:none}
.drop.show{display:block}
.it{padding:6px 18px 6px 26px;position:relative;cursor:pointer;white-space:nowrap}
.it:hover,.it:active{background:var(--navy);color:#fff}
.it.on::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:3px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(-45deg)}
.sep{height:2px;margin:3px 2px;border-top:1px solid var(--sh);border-bottom:1px solid var(--hi)}
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.06)}
.dlg{background:var(--face);padding:3px;width:min(370px,100%);max-height:100%;display:flex;flex-direction:column}
.dbody{padding:12px 12px 4px;overflow:auto;font-size:12px;line-height:1.45}
.dbody p{margin:0 0 9px}
.dbody img{width:20px;height:20px;vertical-align:-5px;margin-right:5px;image-rendering:pixelated}
.dbtns{display:flex;justify-content:center;gap:8px;padding:6px 10px 10px;flex-wrap:wrap}
.dbtns .btn{min-width:86px;height:28px;padding:0 10px}
.dbtns .btn.def{outline:1px dotted #000;outline-offset:-5px}
.stats{background:#fff;padding:8px;margin:4px 0 10px}
.stats .row{padding:1px 0}
.big{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:bold;font-size:13px}
.field{display:flex;align-items:center;gap:6px;margin:0 0 6px}
.field label{width:62px;flex:none}
.field input{flex:1;min-width:0;height:26px;border:0;padding:3px 6px;background:#fff;font:13px Tahoma,Verdana,sans-serif;-webkit-user-select:text;user-select:text;outline:none;border-radius:0;-webkit-appearance:none;appearance:none}
.field input.tag{flex:none;width:64px;text-transform:uppercase;font:bold 16px "Courier New",Courier,monospace;letter-spacing:3px;color:#0a4bd6}
.smsg{min-height:16px;font-size:11px;color:#000080;margin:2px 0 4px}
.scorebig{font:bold 26px "Courier New",Courier,monospace;color:#0a4bd6;text-align:center;margin:2px 0 6px}
.brd{background:#fff;padding:4px;margin:4px 0 8px;max-height:46vh;overflow:auto}
.brow{display:flex;align-items:center;gap:8px;padding:3px 4px;font-size:12px}
.brow:nth-child(even){background:#eef4ff}
.brow.me{background:#000080;color:#fff}
.brow span{width:22px;text-align:right;flex:none}
.brow b{width:38px;flex:none;font-family:"Courier New",Courier,monospace;letter-spacing:1px}
.brow em{font-style:normal;width:56px;text-align:right;flex:none}
.brow a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#0000ee}
.brow.me a{color:#9fd0ff}
</style>
</head>
<body>
<div id="win" class="raised">
  <div class="title">
    <svg width="16" height="16" viewBox="0 0 16 16"><rect x="0.5" y="0.5" width="15" height="15" fill="#fff" stroke="#000"/><path d="M3 3h10v3H6v2h7v5H3v-3h7V10H3z" fill="#1084d0"/></svg>
    <span class="tx">FogWarren</span>
    <div class="tbtns">
      <button class="tb raised" data-tb="min"><svg width="8" height="8" viewBox="0 0 8 8"><rect x="1" y="6" width="6" height="2" fill="#000"/></svg></button>
      <button class="tb raised" data-tb="max"><svg width="9" height="9" viewBox="0 0 9 9"><rect x="0.5" y="0.5" width="8" height="8" fill="none" stroke="#000"/><rect x="0" y="0" width="9" height="2" fill="#000"/></svg></button>
      <button class="tb raised" data-tb="x"><svg width="8" height="8" viewBox="0 0 8 8"><path d="M0 0L8 8M8 0L0 8" stroke="#000" stroke-width="2"/></svg></button>
    </div>
  </div>
  <div class="menubar">
    <div class="mi" data-menu="file">File</div>
    <div class="mi" data-menu="game">Game</div>
    <div class="mi" data-menu="help">Help</div>
  </div>
  <div class="hud sunken">
    <div class="led" id="ledTime">000</div>
    <button class="smiley raised" id="smiley" aria-label="New maze"></button>
    <div class="led" id="ledSteps">000</div>
  </div>
  <div id="view" class="sunken"><canvas id="cv"></canvas><div id="toast"></div></div>
  <div class="controls">
    <div class="group">
      <span class="lg">Mine Sense</span>
      <div class="led sense" id="sense">0</div>
      <div class="row"><span>Blasts</span><b id="blasts">0</b></div>
      <div class="row"><span>Falls</span><b id="falls">0</b></div>
    </div>
    <div class="dpad">
      <div></div>
      <button class="btn raised" data-d="up" aria-label="Up"><svg width="20" height="20" viewBox="0 0 10 10"><path d="M5 2L9 7H1z" fill="#000"/></svg></button>
      <div></div>
      <button class="btn raised" data-d="left" aria-label="Left"><svg width="20" height="20" viewBox="0 0 10 10"><path d="M2 5L7 1V9z" fill="#000"/></svg></button>
      <div class="dc sunken" id="dcenter">
        <svg id="dcDiamond" width="22" height="22" viewBox="0 0 10 10"><path d="M5 0.5L9.5 5L5 9.5L0.5 5z" fill="#1084d0" stroke="#000" stroke-width=".6"/><path d="M5 2L8 5H2z" fill="#7cc4ff"/></svg>
        <svg id="dcArrow" width="26" height="26" viewBox="0 0 10 10" style="display:none"><circle cx="5" cy="5" r="4.5" fill="#fff" stroke="#000" stroke-width=".6"/><path d="M9 5L4 2.6V7.4z" fill="#e00000" stroke="#000" stroke-width=".4"/><path d="M4 2.6L1.2 5L4 7.4z" fill="#999"/></svg>
      </div>
      <button class="btn raised" data-d="right" aria-label="Right"><svg width="20" height="20" viewBox="0 0 10 10"><path d="M8 5L3 1V9z" fill="#000"/></svg></button>
      <div></div>
      <button class="btn raised" data-d="down" aria-label="Down"><svg width="20" height="20" viewBox="0 0 10 10"><path d="M5 8L9 3H1z" fill="#000"/></svg></button>
      <div></div>
    </div>
    <div class="group">
      <span class="lg">Map</span>
      <div class="row"><span>Seen</span><b id="explored">0%</b></div>
      <div class="row"><span>Compass</span><b id="cmp">off</b></div>
      <div class="zrow"><button class="btn raised" id="zin" aria-label="Zoom in">+</button><button class="btn raised" id="zout" aria-label="Zoom out">-</button></div>
    </div>
  </div>
  <div class="status">
    <div class="thin" id="stMsg">Ready</div>
    <div class="thin" id="stSize">Huge</div>
    <div class="thin" id="stClock">12:00</div>
  </div>
</div>

<div class="drop raised" id="m-file">
  <div class="it" data-act="photo">Hide My Photo In The Maze...</div>
  <div class="it" data-act="art">Use Built-in Pictures</div>
  <div class="sep"></div>
  <div class="it" data-act="new">New Maze</div>
  <div class="it" data-act="restart">Restart This Maze</div>
</div>
<div class="drop raised" id="m-game">
  <div class="it" data-act="size:small">Small</div>
  <div class="it" data-act="size:big">Big</div>
  <div class="it" data-act="size:huge">Huge</div>
  <div class="it" data-act="size:colossal">Colossal</div>
  <div class="sep"></div>
  <div class="it" data-act="mines">Mines</div>
  <div class="it" data-act="traps">Pitfalls and Color Warps</div>
  <div class="it" data-act="sound">Sound</div>
</div>
<div class="drop raised" id="m-help">
  <div class="it" data-act="board">High Scores...</div>
  <div class="it" data-act="howto">How to Play</div>
  <div class="it" data-act="about">About FogWarren</div>
</div>
<input type="file" id="fileIn" accept="image/*" hidden>

<script>
(function(){
'use strict';
var VER='fogwarren-vx v2';
var T=20;
var SIZES={small:{r:19,label:'Small'},big:{r:35,label:'Big'},huge:{r:51,label:'Huge'},colossal:{r:71,label:'Colossal'}};
var ORDER=['small','big','huge','colossal'];
var NUMC=['','#0000ff','#008000','#ff0000','#000080','#800000','#008080','#000000','#808080'];
var PALS=[
  {name:'Classic',wall:'#c0c0c0',floor:'#f2f2ee',fog:'#008080',fogDot:'#007070',mem:'rgba(0,128,128,0.30)',trail:'#1084d0'},
  {name:'Vapor',wall:'#ff9ed8',floor:'#fff3fb',fog:'#8a6cff',fogDot:'#7a5cf0',mem:'rgba(138,108,255,0.28)',trail:'#1084d0'},
  {name:'CGA',wall:'#55ffff',floor:'#ffffff',fog:'#ff55ff',fogDot:'#e645e6',mem:'rgba(255,85,255,0.25)',trail:'#0040c0'},
  {name:'Pocket',wall:'#9bbc0f',floor:'#e6f8d6',fog:'#4f7a28',fogDot:'#466f22',mem:'rgba(79,122,40,0.28)',trail:'#1084d0'},
  {name:'Blueprint',wall:'#5b8fe0',floor:'#eaf2ff',fog:'#2a62b8',fogDot:'#2458aa',mem:'rgba(42,98,184,0.26)',trail:'#003c9e'},
  {name:'Sandstone',wall:'#dba46c',floor:'#fcf2e4',fog:'#c27532',fogDot:'#b26a2c',mem:'rgba(194,117,50,0.26)',trail:'#1084d0'}
];
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
PALS.forEach(function(p){p._wall=hex(p.wall);p._floor=hex(p.floor)});
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function shade(c,f){return f>=0?mix(c,[255,255,255],f):mix(c,[0,0,0],-f)}
function css(c){return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function $(s){return document.querySelector(s)}
function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h==null?w:h;return c}

var LS={
  get:function(k,d){try{var v=localStorage.getItem('fogwarren-vx-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem('fogwarren-vx-'+k,JSON.stringify(v))}catch(e){}}
};
var cfg=Object.assign({size:'huge',mines:true,traps:true,sound:true,zt:15},LS.get('cfg',{}));
if(!SIZES[cfg.size])cfg.size='huge';
function saveCfg(){LS.set('cfg',cfg)}

var view=$('#view'),cv=$('#cv'),ctx=cv.getContext('2d');
var vw=0,vh=0,dpr=1,zoomBase=20,needSize=true;
var cam={x:0,y:0,z:20};
var S=null,base=null,bctx=null,fogPat=null,last=performance.now(),modals=0,menuOpen=null,userPhoto=null,lastSec=-1;

/* ---------- random ---------- */
function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,R){for(var i=arr.length-1;i>0;i--){var j=(R()*(i+1))|0;var t=arr[i];arr[i]=arr[j];arr[j]=t}}
function hash(i){var h=Math.imul(i+1,2654435761)^Math.imul(S.seed,40503);h^=h>>>13;h=Math.imul(h,1274126177);return (h^(h>>>16))>>>0}

/* ---------- built-in pictures ---------- */
function sceneMesa(){
  var c=mk(512),x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,380);g.addColorStop(0,'#3a4fb0');g.addColorStop(.45,'#d65a8a');g.addColorStop(.8,'#ff9f45');g.addColorStop(1,'#ffd27a');
  x.fillStyle=g;x.fillRect(0,0,512,512);
  x.fillStyle='rgba(255,255,255,.85)';for(var i=0;i<46;i++){x.fillRect((i*97)%512,(i*53)%150,2,2)}
  x.fillStyle='#fff3b0';x.beginPath();x.arc(330,300,64,0,7);x.fill();
  function layer(col,pts){x.fillStyle=col;x.beginPath();x.moveTo(0,512);pts.forEach(function(p){x.lineTo(p[0],p[1])});x.lineTo(512,512);x.closePath();x.fill()}
  layer('#a04c6c',[[0,300],[60,300],[80,258],[170,258],[192,300],[300,310],[322,248],[420,248],[442,305],[512,300]]);
  layer('#702c48',[[0,345],[40,345],[60,290],[150,290],[176,348],[260,352],[282,318],[362,318],[384,352],[512,348]]);
  g=x.createLinearGradient(0,390,0,512);g.addColorStop(0,'#b8603a');g.addColorStop(1,'#6e3220');x.fillStyle=g;x.fillRect(0,392,512,120);
  function cactus(cx,by,h){x.fillStyle='#24452a';x.fillRect(cx-7,by-h,14,h);x.fillRect(cx-26,by-h*.66,9,h*.32);x.fillRect(cx-26,by-h*.42,20,9);x.fillRect(cx+17,by-h*.82,9,h*.36);x.fillRect(cx+6,by-h*.52,20,9)}
  cactus(110,478,130);cactus(404,456,92);cactus(252,432,56);
  return c;
}
function sceneSynth(){
  var c=mk(512),x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,300);g.addColorStop(0,'#2a0a5e');g.addColorStop(.6,'#ff3d8b');g.addColorStop(1,'#ffb35c');
  x.fillStyle=g;x.fillRect(0,0,512,300);
  var s=mk(512),sx=s.getContext('2d');
  g=sx.createLinearGradient(0,110,0,300);g.addColorStop(0,'#fff27a');g.addColorStop(1,'#ff4f8b');
  sx.fillStyle=g;sx.beginPath();sx.arc(256,250,132,0,7);sx.fill();
  sx.globalCompositeOperation='destination-out';
  for(var i=0;i<8;i++){sx.fillRect(0,196+i*13,512,2+i*1.3)}
  x.drawImage(s,0,0);
  x.fillStyle='#3c1466';x.beginPath();x.moveTo(0,300);x.lineTo(0,250);x.lineTo(70,215);x.lineTo(130,262);x.lineTo(190,232);x.lineTo(230,300);x.closePath();x.fill();
  x.beginPath();x.moveTo(512,300);x.lineTo(512,240);x.lineTo(440,205);x.lineTo(380,255);x.lineTo(320,300);x.closePath();x.fill();
  x.fillStyle='#2b0f4f';x.fillRect(0,300,512,212);
  x.strokeStyle='#ff4fd8';x.lineWidth=2;
  for(var k=-12;k<=12;k++){x.beginPath();x.moveTo(256+k*14,300);x.lineTo(256+k*92,512);x.stroke()}
  for(var j=0;j<11;j++){var y=300+Math.pow(j/10,2)*212;x.beginPath();x.moveTo(0,y);x.lineTo(512,y);x.stroke()}
  return c;
}
function sceneSea(){
  var c=mk(512),x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,300);g.addColorStop(0,'#4fa8ff');g.addColorStop(1,'#e2f4ff');
  x.fillStyle=g;x.fillRect(0,0,512,300);
  x.fillStyle='#fff7c2';x.beginPath();x.arc(120,110,48,0,7);x.fill();
  x.fillStyle='#ffffff';
  [[300,80,60,20],[350,70,40,22],[260,92,44,15],[420,160,50,16],[460,152,36,18],[80,200,46,14]].forEach(function(e){x.beginPath();x.ellipse(e[0],e[1],e[2],e[3],0,0,7);x.fill()});
  g=x.createLinearGradient(0,300,0,512);g.addColorStop(0,'#1a78d6');g.addColorStop(1,'#0b3f8f');
  x.fillStyle=g;x.fillRect(0,300,512,212);
  x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=2;
  for(var y=312;y<512;y+=17){x.beginPath();for(var px=0;px<=512;px+=8){x.lineTo(px,y+Math.sin(px/22+y)*3)}x.stroke()}
  x.fillStyle='#c0392b';x.beginPath();x.moveTo(300,330);x.lineTo(400,330);x.lineTo(386,350);x.lineTo(314,350);x.closePath();x.fill();
  x.fillStyle='#ffffff';x.beginPath();x.moveTo(352,226);x.lineTo(352,326);x.lineTo(292,326);x.closePath();x.fill();
  x.fillStyle='#ffd400';x.beginPath();x.moveTo(358,240);x.lineTo(358,326);x.lineTo(400,326);x.closePath();x.fill();
  x.fillStyle='#333';x.fillRect(352,220,4,112);
  return c;
}
function sceneBloom(){
  var c=mk(512),x=c.getContext('2d');
  var g=x.createRadialGradient(256,256,20,256,256,360);g.addColorStop(0,'#fff6cc');g.addColorStop(.6,'#ffc27a');g.addColorStop(1,'#ff7f50');
  x.fillStyle=g;x.fillRect(0,0,512,512);
  var i,a;
  for(i=0;i<14;i++){a=i/14*Math.PI*2;x.fillStyle=i%2?'#ff4f7b':'#ff6a90';x.beginPath();x.ellipse(256+Math.cos(a)*125,256+Math.sin(a)*125,78,38,a,0,7);x.fill()}

function genMaze(rw,rh,R){

    for(var k=0;k<4;k++){var nx=cx+D[k][0],ny=cy+D[k][1];if(nx>=0&&ny>=0&&nx<rw&&ny<rh&&!vis[ny*rw+nx])opts.push(k)}
    if(!opts.length){st.pop();continue}
    var d=D[opts[(R()*opts.length)|0]],nx2=cx+d[0],ny2=cy+d[1];
    vis[ny2*rw+nx2]=1;g[(cy*2+1+d[1])*W+(cx*2+1+d[0])]=1;g[(ny2*2+1)*W+(nx2*2+1)]=1;st.push(ny2*rw+nx2);
  }
  for(var y=0;y<rh;y++)for(var x=0;x<rw;x++){
    var gx=x*2+1,gy=y*2+1,n=0,walls=[];
    for(var q=0;q<4;q++){var wx=gx+D[q][0],wy=gy+D[q][1];if(g[wy*W+wx])n++;else if(wx>0&&wy>0&&wx<W-1&&wy<H-1)walls.push(wy*W+wx)}
    if(n===1&&walls.length&&R()<0.3)g[walls[(R()*walls.length)|0]]=1;
  }

}
function bfs(W,g,src,block,target){
  var N=g.length,d=new Int32Array(N).fill(-1),q=new Int32Array(N),h=0,t=0;

  while(h<t){
    var c=q[h++];if(c===target)break;
    var n0=c-1,n1=c+1,n2=c-W,n3=c+W;
    if(g[n0]&&d[n0]<0&&!(block&&block[n0])){d[n0]=d[c]+1;q[t++]=n0}
    if(g[n1]&&d[n1]<0&&!(block&&block[n1])){d[n1]=d[c]+1;q[t++]=n1}
    if(g[n2]&&d[n2]<0&&!(block&&block[n2])){d[n2]=d[c]+1;q[t++]=n2}
    if(g[n3]&&d[n3]<0&&!(block&&block[n3])){d[n3]=d[c]+1;q[t++]=n3}
  }

}

  for(var s=1;s<n;s++){var t=s/n,x=Math.round(x0+(x1-x0)*t),y=Math.round(y0+(y1-y0)*t);if(x===x1&&y===y1)return true;if(!S.g[y*S.W+x])return false}

  c.beginPath();for(var k=0;k<16;k++){var a=k/16*Math.PI*2-Math.PI/2,rr=k%2?r:R;c.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}c.closePath();

function drawPlayer(c,rx,ry,z,now){

  var cx=(rx+.5)*z+bx,cy=(ry+.5)*z+by;

/* ---------- frame ---------- */
function computeZoom(){zoomBase=clamp(Math.min(vw,vh*1.15)/cfg.zt,8,48)}

  if(!needSize)return;needSize=false;
  var r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,3);
  vw=r.width;vh=r.height;dpr=d;
  cv.width=Math.max(1,Math.round(vw*dpr));cv.height=Math.max(1,Math.round(vh*dpr));

}

function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  sizeCanvas();
  if(!S||!base){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#008080';ctx.fillRect(0,0,cv.width,cv.height);return}
  if(S.started&&!S.won&&!modals&&!document.hidden)S.elapsed+=dt;
  var sec=Math.floor(S.elapsed);if(sec!==lastSec){lastSec=sec;$('#ledTime').textContent=led(sec)}
  var pal=P(),rp=renderPos(now),full=S.won||now<S.flareUntil;
  var tx=rp.x+.5,ty=rp.y+.5,tz=zoomBase;
  if(full){tx=S.W/2;ty=S.H/2;tz=Math.min(vw/S.W,vh/S.H)*.96}
  var k=1-Math.exp(-dt*(full?4.5:11));
  cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;cam.z+=(tz-cam.z)*(1-Math.exp(-dt*(full?4.5:8)));
  var sx=0,sy=0;

  var z=cam.z,ox=vw/2-cam.x*z+sx,oy=vh/2-cam.y*z+sy,W=S.W,x,y,i;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=fogPat||pal.fog;ctx.fillRect(0,0,vw,vh);
  ctx.imageSmoothingEnabled=z<T;
  ctx.drawImage(base,ox,oy,W*z,S.H*z);
  var x0=Math.max(0,Math.floor(-ox/z)),x1=Math.min(W-1,Math.floor((vw-ox)/z)),y0=Math.max(0,Math.floor(-oy/z)),y1=Math.min(S.H-1,Math.floor((vh-oy)/z));
  ctx.save();ctx.translate(ox,oy);
  if(!full){
    ctx.beginPath();
    for(y=y0;y<=y1;y++)for(x=x0;x<=x1;x++)if(!S.seen[y*W+x])ctx.rect(x*z,y*z,z+.6,z+.6);
    ctx.fillStyle=fogPat||pal.fog;ctx.fill();
    ctx.beginPath();
    for(y=y0;y<=y1;y++)for(x=x0;x<=x1;x++){i=y*W+x;if(S.seen[i]&&!S.vis[i])ctx.rect(x*z,y*z,z+.6,z+.6)}
    ctx.fillStyle=pal.mem;ctx.fill();
  }

    ctx.globalAlpha=.45;ctx.fillStyle=pal.trail;ctx.beginPath();
    for(y=y0;y<=y1;y++)for(x=x0;x<=x1;x++)if(S.visited[y*W+x]&&!(x===S.px&&y===S.py))ctx.rect((x+.5)*z-ts/2,(y+.5)*z-ts/2,ts,ts);
    ctx.fill();ctx.globalAlpha=1;
    for(y=y0;y<=y1;y++)for(x=x0;x<=x1;x++){
      i=y*W+x;var kk=S.kind[i];if(kk<2)continue;
      if(!S.seen[i]&&!full)continue;
      if(kk===2)drawPit(ctx,x,y,z);else if(kk===3)drawFlare(ctx,x,y,z,now);else if(kk===4)drawPrism(ctx,x,y,z,now);else if(kk===5)drawCompass(ctx,x,y,z,now);
    }
  }
  if(S.seen[S.goal]||full)drawGoal(ctx,S.goal%W,(S.goal/W)|0,z,now);
  var tt=S.won?(now-S.winT)/1000:0;
  if(S.won){
    var gx=(S.goal%W+.5)*z,gy=(((S.goal/W)|0)+.5)*z,maxR=Math.hypot(W,S.H)*z,r=clamp(tt/2.2,0,1)*maxR;
    if(r>0){
      ctx.save();ctx.beginPath();ctx.arc(gx,gy,r,0,7);ctx.clip();ctx.imageSmoothingEnabled=false;ctx.drawImage(S.mosaic,0,0,W*z,S.H*z);ctx.restore();
      if(tt<2.4){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=Math.max(3,z*.9);ctx.beginPath();ctx.arc(gx,gy,r,0,7);ctx.stroke()}
    }

  }
  if(!S.won||tt<2.4)drawPlayer(ctx,rp.x,rp.y,z,now);
  if(S.particles.length){
    var damp=Math.pow(.03,dt);
    S.particles=S.particles.filter(function(p){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=damp;p.vy*=damp;return p.life<p.max});
    S.particles.forEach(function(p){var s=p.sz*z;ctx.globalAlpha=1-p.life/p.max;ctx.fillStyle=p.col;ctx.fillRect(p.x*z-s/2,p.y*z-s/2,s,s)});
    ctx.globalAlpha=1;
  }
  ctx.restore();
  if(S.flash){var fp2=(now-S.flash.t)/S.flash.dur;if(fp2>=1)S.flash=null;else{ctx.fillStyle='rgba('+S.flash.col+','+((1-fp2)*.6)+')';ctx.fillRect(0,0,vw,vh)}}
  var wp=(now-S.warpT)/900;
  if(wp>=0&&wp<1){
    var gr=ctx.createLinearGradient(0,0,vw,vh);
    ['#ff0040','#ffb000','#40ff40','#00c0ff','#a040ff','#ff40c0'].forEach(function(c,n){gr.addColorStop(((n/6)+wp*2)%1,c)});
    ctx.globalAlpha=(1-wp)*.55;ctx.fillStyle=gr;ctx.fillRect(0,0,vw,vh);ctx.globalAlpha=1;
  }
}

}
function howTo(){
  var you=(function(){var c=mk(40),x=c.getContext('2d');x.fillStyle='#f2f2ee';x.fillRect(0,0,40,40);x.fillStyle='#000';x.fillRect(5,5,30,30);x.fillStyle='#0a4bd6';x.fillRect(7,7,26,26);x.fillStyle='#5aa8ff';x.fillRect(7,7,26,8);x.fillStyle='#fff';x.fillRect(11,16,6,6);x.fillRect(23,16,6,6);return c.toDataURL()})();
  var body=
    '<p><img src="'+you+'">This blue block is you. Find the checkered flag <img src="'+iconURL(drawGoal)+'"> hidden somewhere in the warren. You only see what is in your line of sight, and places you have seen stay on your map, dimmed.</p>'+
    '<p><img src="'+iconURL(null,'2')+'">Numbers on the floor count the hidden mines touching that tile, the same way Minesweeper does. The Mine Sense box shows the count where you stand. Step on a mine and the blast throws you back along your trail. There is always a mine free route to the exit.</p>'+
    '<p><img src="'+iconURL(drawPit)+'">A dark hole is a pitfall. Fall in and you land somewhere else in the maze.</p>'+
    '<p><img src="'+iconURL(drawFlare)+'">A flare lights up the entire maze for a moment.</p>'+
    '<p><img src="'+iconURL(drawPrism)+'">A prism is a color warp. It repaints the maze and swaps the hidden picture.</p>'+
    '<p><img src="'+iconURL(drawCompass)+'">A compass points at the exit for a while.</p>'+
    '<p>Every floor and wall block is secretly a piece of a picture. Reach the exit to reveal it, or hide your own photo in the maze from the File menu.</p>'+
    '<p>Your score starts from the maze size, gains a speed bonus for beating par, and loses points for every blast and fall. Put your initials and an optional link on the shared high score board when you win. Help, High Scores shows the board any time.</p>'+
    '<p>Move with the arrow buttons, the arrow keys, or by dragging across the maze. Hold a button to keep walking.</p>';
  dialog('How to Play',body,[{label:'OK',def:true,cancel:true}]);
}
function about(){
  dialog('About FogWarren','<div class="big"><svg width="32" height="32" viewBox="0 0 16 16"><rect x="0.5" y="0.5" width="15" height="15" fill="#fff" stroke="#000"/><path d="M3 3h10v3H6v2h7v5H3v-3h7V10H3z" fill="#1084d0"/></svg><span>FogWarren</span></div><p>A fog of war maze for thumbs and arrow keys.</p><p>Version '+VER+'</p>',[{label:'OK',def:true,cancel:true}]);
}
function confirmNew(){
  if(S&&S.started&&!S.won){
    dialog('New Maze','<div class="big">'+faceSvg('wow',34)+'<span>Abandon this maze?</span></div><p>Your progress here will be lost.</p>',[{label:'Yes',def:true,fn:function(){newGame()}},{label:'No',cancel:true}]);
  }else newGame();
}

/* ---------- menus ---------- */
function syncMenus(){
  document.querySelectorAll('.drop .it').forEach(function(it){
    var a=it.dataset.act,on=false;
    if(a.indexOf('size:')===0)on=a.slice(5)===cfg.size;
    else if(a==='mines')on=cfg.mines;else if(a==='traps')on=cfg.traps;else if(a==='sound')on=cfg.sound;
    else if(a==='art')on=!userPhoto;else if(a==='photo')on=!!userPhoto;
    it.classList.toggle('on',on);
  });
}
function openMenu(m,id){
  closeMenus();syncMenus();
  var d=document.getElementById('m-'+id),r=m.getBoundingClientRect();
  d.classList.add('show');
  d.style.left=Math.max(4,Math.min(r.left,innerWidth-d.offsetWidth-4))+'px';d.style.top=r.bottom+'px';
  m.classList.add('open');menuOpen=id;stopRep();
}
function closeMenus(){
  document.querySelectorAll('.drop').forEach(function(d){d.classList.remove('show')});
  document.querySelectorAll('.mi').forEach(function(m){m.classList.remove('open')});
  menuOpen=null;
}
document.querySelectorAll('.mi').forEach(function(m){
  m.addEventListener('pointerdown',function(e){e.stopPropagation();var id=m.dataset.menu;if(menuOpen===id)closeMenus();else openMenu(m,id)});
});
document.addEventListener('pointerdown',function(e){if(menuOpen&&!e.target.closest('.drop'))closeMenus()});
document.querySelectorAll('.drop .it').forEach(function(it){it.addEventListener('click',function(){closeMenus();doAct(it.dataset.act)})});
function doAct(a){
  if(a.indexOf('size:')===0){cfg.size=a.slice(5);saveCfg();syncMenus();newGame();return}
  switch(a){
    case 'photo':$('#fileIn').click();break;
    case 'art':
      userPhoto=null;try{localStorage.removeItem('fogwarren-vx-photo')}catch(e){}
      if(S){S.imgIdx=(Math.random()*SCENES.length)|0;applyImage();buildBase()}
      syncMenus();toast('Built-in pictures are back in the maze.');break;
    case 'new':confirmNew();break;
    case 'restart':newGame(S?S.seed:null);break;
    case 'mines':cfg.mines=!cfg.mines;saveCfg();syncMenus();newGame(S?S.seed:null);break;
    case 'traps':cfg.traps=!cfg.traps;saveCfg();syncMenus();newGame(S?S.seed:null);break;
    case 'sound':cfg.sound=!cfg.sound;saveCfg();syncMenus();if(cfg.sound)sfx('pick');break;
    case 'board':showBoard();break;
    case 'howto':howTo();break;
    case 'about':about();break;
  }
}
$('#fileIn').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var url=URL.createObjectURL(f),im=new Image();
  im.onload=function(){
    userPhoto=coverCrop(im);URL.revokeObjectURL(url);
    try{localStorage.setItem('fogwarren-vx-photo',userPhoto.toDataURL('image/jpeg',.85))}catch(err){}
    if(S){S.imgIdx=0;applyImage();buildBase()}
    syncMenus();toast('Your photo is now hidden in the maze blocks.');
  };
  im.onerror=function(){toast('That file could not be opened as a picture.')};
  im.src=url;e.target.value='';
});
document.querySelectorAll('[data-tb]').forEach(function(b){
  b.addEventListener('click',function(){
    var t=b.dataset.tb;
    if(t==='min')toast('The warren refuses to be minimized.');
    else if(t==='max'){cfg.zt=cfg.zt>15?15:27;saveCfg();computeZoom();toast(cfg.zt>15?'Wide view.':'Close view.')}
    else dialog('FogWarren','<div class="big">'+faceSvg('wow',34)+'<span>There is no escape.</span></div><p>The only way out is the checkered flag.</p>',[{label:'OK',def:true,cancel:true}]);
  });
});

/* ---------- input ---------- */
var repT=null;
function startRep(d){stopRep();go(d);repT=setTimeout(function loop(){go(d);repT=setTimeout(loop,100)},240)}
function stopRep(){clearTimeout(repT);repT=null}
document.querySelectorAll('[data-d]').forEach(function(b){
  var d=b.dataset.d;
  b.addEventListener('pointerdown',function(e){e.preventDefault();ac();try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('down');startRep(d)});
  function up(){b.classList.remove('down');stopRep()}
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){b.addEventListener(ev,up)});
  b.addEventListener('contextmenu',function(e){e.preventDefault()});
});
var KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
window.addEventListener('keydown',function(e){
  if(modals)return;
  var m=KEYS[e.key];
  if(m){e.preventDefault();ac();go(m)}
  else if(e.key==='Escape')closeMenus();
});
var sw=null;
view.addEventListener('pointerdown',function(e){ac();sw={x:e.clientX,y:e.clientY,id:e.pointerId};try{view.setPointerCapture(e.pointerId)}catch(_){}});
view.addEventListener('pointermove',function(e){
  if(!sw||e.pointerId!==sw.id)return;
  var dx=e.clientX-sw.x,dy=e.clientY-sw.y,th=Math.max(18,cam.z*.9);
  if(Math.abs(dx)<th&&Math.abs(dy)<th)return;
  if(Math.abs(dx)>Math.abs(dy)){go(dx>0?'right':'left');sw.x+=(dx>0?1:-1)*th;sw.y=e.clientY}
  else{go(dy>0?'down':'up');sw.y+=(dy>0?1:-1)*th;sw.x=e.clientX}
});
['pointerup','pointercancel'].forEach(function(ev){view.addEventListener(ev,function(){sw=null})});
var smiley=$('#smiley');
smiley.addEventListener('pointerdown',function(){if(S&&!S.won)setFace('wow')});
smiley.addEventListener('pointerup',function(){if(S&&!S.won)setFace('ok')});
smiley.addEventListener('click',function(){ac();confirmNew()});
$('#zin').addEventListener('click',function(){cfg.zt=Math.max(7,cfg.zt-3);saveCfg();computeZoom()});
$('#zout').addEventListener('click',function(){cfg.zt=Math.min(36,cfg.zt+3);saveCfg();computeZoom()});
document.addEventListener('gesturestart',function(e){e.preventDefault()});

/* ---------- start ---------- */
syncMenus();setFace('ok');clock();setInterval(clock,15000);
loadStoredPhoto(function(){syncMenus();newGame()});
requestAnimationFrame(frame);
window.__fw={get S(){return S},go:go,cfg:cfg,newGame:newGame};
})();
</script>
</body>
</html>
