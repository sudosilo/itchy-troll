<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>BPM Finder</title>
<style>
:root{
  --bg:#EAF0F4;
  --ink:#16222E;
  --soft:#5B6B7A;
  --line:#C9D4DD;
  --beat:#E2462F;
  --go:#1F5FD1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
h1{font-size:1.1rem;font-weight:600;margin:0 0 28px;color:var(--soft)}
.dial{
  width:min(78vw,320px);aspect-ratio:1;border-radius:50%;
  border:3px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;position:relative;background:#fff;
}
.dial.hit{border-color:var(--beat)}
#bpm{font-size:clamp(4rem,22vw,6.5rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
#unit{font-size:1rem;color:var(--soft);margin-top:6px}
#exact{font-size:0.95rem;color:var(--soft);margin-top:4px;font-variant-numeric:tabular-nums;min-height:1.2em}
.meters{width:min(78vw,320px);margin-top:28px;text-align:left}
.meters label{display:block;font-size:0.85rem;color:var(--soft);margin:12px 0 6px}
.bar{height:10px;background:#fff;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--go);transition:width .15s}
#status{margin:22px 0 0;min-height:1.4em;color:var(--soft);max-width:320px}
button{
  margin-top:22px;font:inherit;font-size:1.15rem;font-weight:700;
  padding:16px 40px;border-radius:40px;border:0;background:var(--go);color:#fff;
}
button.stop{background:var(--ink)}
button:focus-visible{outline:3px solid var(--beat);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>
<body>
<h1>BPM Finder</h1>
<div class="dial" id="dial">
  <div id="bpm">--</div>
  <div id="unit">BPM</div>
  <div id="exact"></div>
</div>
<div class="meters">
  <label for="lvl">Mic level</label>
  <div class="bar" id="lvl"><span id="lvlFill"></span></div>
  <label for="conf">Confidence</label>
  <div class="bar" id="conf"><span id="confFill"></span></div>
</div>
<p id="status">Tap Listen and hold the phone near the speaker.</p>
<button id="btn">Listen</button>

<script>
(function(){
  var HOP = 512;
  var ctx, stream, src, proc, low, merger;
  var fr, ring, ringLen, ringPos = 0, filled = 0;
  var prevLow = 0, prevFull = 0, level = 0;
  var estimates = [];
  var timer = null, pulseTimer = null, running = false;
  var bpmEl = document.getElementById('bpm');
  var exactEl = document.getElementById('exact');
  var statusEl = document.getElementById('status');
  var btn = document.getElementById('btn');
  var dial = document.getElementById('dial');
  var lvlFill = document.getElementById('lvlFill');
  var confFill = document.getElementById('confFill');

  btn.addEventListener('click', function(){ running ? stop() : start(); });

  function start(){
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})
    .then(function(s){
      stream = s;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      fr = ctx.sampleRate / HOP;
      ringLen = Math.ceil(fr * 10);
      ring = new Float32Array(ringLen);
      ringPos = 0; filled = 0; estimates = [];
      src = ctx.createMediaStreamSource(stream);
      low = ctx.createBiquadFilter();
      low.type = 'lowpass'; low.frequency.value = 180;
      merger = ctx.createChannelMerger(2);
      src.connect(low); low.connect(merger, 0, 0);
      src.connect(merger, 0, 1);
      proc = ctx.createScriptProcessor(2048, 2, 1);
      merger.connect(proc);
      var mute = ctx.createGain(); mute.gain.value = 0;
      proc.connect(mute); mute.connect(ctx.destination);
      proc.onaudioprocess = onAudio;
      running = true;
      btn.textContent = 'Stop'; btn.className = 'stop';
      statusEl.textContent = 'Listening. Give it about 6 seconds.';
      bpmEl.textContent = '--'; exactEl.textContent = '';
      timer = setInterval(analyze, 500);
    })
    .catch(function(){
      statusEl.textContent = 'Microphone is blocked. Allow the mic for this site in the browser, then tap Listen again.';
    });
  }

  function stop(){
    running = false;
    clearInterval(timer); clearInterval(pulseTimer);
    if (proc) proc.disconnect();
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    if (ctx) ctx.close();
    btn.textContent = 'Listen'; btn.className = '';
    lvlFill.style.width = '0';
    statusEl.textContent = 'Stopped. Tap Listen to measure again.';
  }

  function onAudio(e){
    var a = e.inputBuffer.getChannelData(0);
    var b = e.inputBuffer.getChannelData(1);
    for (var h = 0; h < a.length; h += HOP){
      var le = 0, fe = 0;
      for (var i = h; i < h + HOP; i++){ le += a[i]*a[i]; fe += b[i]*b[i]; }
      var ll = Math.log(1e-10 + le), fl = Math.log(1e-10 + fe);
      var on = Math.max(0, ll - prevLow) + 0.6 * Math.max(0, fl - prevFull);
      prevLow = ll; prevFull = fl;
      ring[ringPos] = on;
      ringPos = (ringPos + 1) % ringLen;
      if (filled < ringLen) filled++;
      level = Math.max(level * 0.9, Math.sqrt(fe / HOP));
    }
    lvlFill.style.width = Math.min(100, level * 400) + '%';
  }

  function analyze(){
    if (!running) return;
    var n = filled;
    if (n < fr * 4){ return; }
    var x = new Float32Array(n);
    var startIdx = (ringPos - n + ringLen) % ringLen;
    var mean = 0;
    for (var i = 0; i < n; i++){ x[i] = ring[(startIdx + i) % ringLen]; mean += x[i]; }
    mean /= n;
    for (i = 0; i < n; i++) x[i] -= mean;

    var minLag = Math.floor(fr * 60 / 200);
    var maxLag = Math.ceil(fr * 60 / 60);
    var ac = new Float32Array(maxLag * 2 + 2);
    var zero = 0;
    for (i = 0; i < n; i++) zero += x[i] * x[i];
    if (zero <= 0) return;
    for (var lag = minLag; lag < ac.length && lag < n; lag++){
      var s = 0;
      for (i = 0; i + lag < n; i++) s += x[i] * x[i + lag];
      ac[lag] = s / (n - lag);
    }
    zero /= n;

    var best = -1, bestScore = -Infinity;
    for (lag = minLag; lag <= maxLag; lag++){
      var bpm = 60 * fr / lag;
      var w = Math.exp(-0.5 * Math.pow(Math.log2(bpm / 120) / 0.9, 2));
      var score = (ac[lag] + 0.5 * (ac[lag * 2] || 0)) * w;
      if (score > bestScore){ bestScore = score; best = lag; }
    }
    if (best < 0) return;

    var y0 = ac[best - 1] || ac[best], y1 = ac[best], y2 = ac[best + 1] || ac[best];
    var den = y0 - 2 * y1 + y2;
    var shift = den !== 0 ? 0.5 * (y0 - y2) / den : 0;
    if (Math.abs(shift) > 1) shift = 0;
    var tempo = 60 * fr / (best + shift);
    while (tempo < 70) tempo *= 2;
    while (tempo > 180) tempo /= 2;

    var conf = Math.max(0, Math.min(1, y1 / zero));
    confFill.style.width = Math.round(conf * 100) + '%';
    if (level < 0.005){ statusEl.textContent = 'Too quiet. Move closer to the speaker.'; return; }

    estimates.push(tempo);
    if (estimates.length > 9) estimates.shift();
    var sorted = estimates.slice().sort(function(p, q){ return p - q; });
    var med = sorted[Math.floor(sorted.length / 2)];

    bpmEl.textContent = Math.round(med);
    exactEl.textContent = med.toFixed(1);
    statusEl.textContent = estimates.length < 5 ? 'Locking in...' : 'Locked. Keep listening to refine.';
    setPulse(med);
  }

  var pulseBpm = 0;
  function setPulse(bpm){
    if (Math.abs(bpm - pulseBpm) < 0.5) return;
    pulseBpm = bpm;
    clearInterval(pulseTimer);
    pulseTimer = setInterval(function(){
      dial.classList.add('hit');
      setTimeout(function(){ dial.classList.remove('hit'); }, 90);
    }, 60000 / bpm);
  }
})();
</script>
</body>
</html>
