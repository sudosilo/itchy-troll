  const tailWag = anim * 0.5;
  ctx.beginPath();
  ctx.moveTo(x+sw*0.88,y+sh*0.45);
  ctx.quadraticCurveTo(x+sw*1.1,y+sh*(0.3+tailWag),x+sw*1.2,y+sh*(0.15+tailWag));
  ctx.stroke();

  // Front arms/paws
  ctx.fillStyle=furColor;
  ctx.save(); ctx.translate(x+sw*0.12,y+sh*0.42); ctx.rotate(-0.4+anim*0.3);
  ctx.fillRect(-sw*0.28,0,sw*0.28,sw*0.16);
  ctx.beginPath(); ctx.ellipse(-sw*0.28,sw*0.08,sw*0.1,sw*0.1,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(x+sw*0.88,y+sh*0.42); ctx.rotate(0.4-anim*0.3);
  ctx.fillRect(0,0,sw*0.28,sw*0.16);
  ctx.beginPath(); ctx.ellipse(sw*0.28,sw*0.08,sw*0.1,sw*0.1,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Head
  ctx.fillStyle=furColor; ctx.beginPath(); ctx.ellipse(x+sw/2+wobble*0.4,y+sh*0.22,sw*0.33,sh*0.22,0,0,Math.PI*2); ctx.fill();

  // Floppy ears
  ctx.fillStyle=darkFur;
  ctx.save(); ctx.translate(x+sw*0.22+wobble*0.4,y+sh*0.16);
  ctx.beginPath(); ctx.ellipse(0,sh*0.08,sw*0.12,sh*0.14,-.3,0,Math.PI*2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(x+sw*0.78+wobble*0.4,y+sh*0.16);
  ctx.beginPath(); ctx.ellipse(0,sh*0.08,sw*0.12,sh*0.14,.3,0,Math.PI*2); ctx.fill(); ctx.restore();

  // Snout
  ctx.fillStyle='#ddbbaa'; ctx.beginPath(); ctx.ellipse(x+sw/2+wobble*0.4,y+sh*0.27,sw*0.2,sh*0.12,0,0,Math.PI*2); ctx.fill();
  // Nose
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.ellipse(x+sw/2+wobble*0.4,y+sh*0.22,sw*0.08,sh*0.06,0,0,Math.PI*2); ctx.fill();

  // Eyes (eager/crazed)
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(x+sw/2-sw*0.12+wobble*0.4,y+sh*0.18,sw*0.07,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+sw/2+sw*0.12+wobble*0.4,y+sh*0.18,sw*0.07,0,Math.PI*2); ctx.fill();
  // Eye shine
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x+sw/2-sw*0.1+wobble*0.4,y+sh*0.165,sw*0.025,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+sw/2+sw*0.14+wobble*0.4,y+sh*0.165,sw*0.025,0,Math.PI*2); ctx.fill();

  // Tongue hanging out
  ctx.fillStyle='#ff6688';
  ctx.save(); ctx.translate(x+sw/2+wobble*0.4,y+sh*0.285);
  ctx.beginPath(); ctx.ellipse(0,sh*0.06,sw*0.1,sh*0.1,anim*0.1,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Collar for brute
  if(z.name==='brute'){
    ctx.fillStyle='#cc2222'; ctx.beginPath(); ctx.rect(x+sw*0.18+wobble*0.4,y+sh*0.31,sw*0.64,sh*0.06); ctx.fill();
    ctx.fillStyle='#ffdd00'; ctx.beginPath(); ctx.arc(x+sw/2+wobble*0.4,y+sh*0.38,sw*0.07,0,Math.PI*2); ctx.fill();
  }

  if(z.name==='brute') { ctx.font=`bold ${Math.max(7,Math.floor(sw*0.28))}px "Share Tech Mono",monospace`; ctx.fillStyle='#ddaa66'; ctx.textAlign='center'; ctx.fillText('BORK',x+sw/2,y-8); }

  drawHPBar(ctx, z);
  ctx.restore();
}

// ── SKIN 5: BIRDS (FLYING) ───────────────────────────────────────────────
function drawBirdSkin(z, ctx) {
  ctx.save();
  const x=z.x, y=z.y, sw=z.dw, sh=z.dh;
  const anim=Math.sin(z.anim), wobble=anim*2;
  const wingFlap = Math.abs(Math.sin(z.anim * 2.5)); // faster wing flap
  const featherColor = z.name==='runner'?'#88ddff':z.name==='normal'?'#4499cc':z.name==='brute'?'#225588':'#cceeff';
  const darkFeather = z.name==='runner'?'#4499cc':z.name==='normal'?'#225588':z.name==='brute'?'#112244':'#88aacc';

  // Ground shadow (shows altitude)
  const shadowY = GROUND_Y + 4;
  const shadowScale = 0.4 + (y / GROUND_Y) * 0.5;
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(x+sw/2, shadowY, sw*0.4*shadowScale, 4*shadowScale, 0,0,Math.PI*2); ctx.fill();

  // Body (plump oval)
  const bg = ctx.createRadialGradient(x+sw*0.45,y+sh*0.52,0,x+sw*0.45,y+sh*0.52,sh*0.35);
  bg.addColorStop(0,featherColor); bg.addColorStop(1,darkFeather);
  ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(x+sw/2,y+sh*0.55,sw*0.38,sh*0.32,0,0,Math.PI*2); ctx.fill();

  // Belly
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(x+sw/2,y+sh*0.6,sw*0.22,sh*0.2,0,0,Math.PI*2); ctx.fill();

  // Wings - dramatic flap
  const flapAngle = -0.2 - wingFlap * 1.1;
  ctx.fillStyle=featherColor;
  ctx.save(); ctx.translate(x+sw*0.15,y+sh*0.48); ctx.rotate(flapAngle);
  ctx.beginPath(); ctx.ellipse(-sw*0.22,0,sw*0.28,sh*0.13,-0.15,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=darkFeather; ctx.lineWidth=1;
  for(let f=0;f<5;f++){ ctx.beginPath(); ctx.moveTo(-sw*0.32+f*sw*0.06,sh*0.1); ctx.lineTo(-sw*0.36+f*sw*0.06,sh*0.22); ctx.stroke(); }
  ctx.restore();
  ctx.save(); ctx.translate(x+sw*0.85,y+sh*0.48); ctx.rotate(-flapAngle);
  ctx.beginPath(); ctx.ellipse(sw*0.22,0,sw*0.28,sh*0.13,0.15,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=darkFeather; ctx.lineWidth=1;
  for(let f=0;f<5;f++){ ctx.beginPath(); ctx.moveTo(sw*0.32-f*sw*0.06,sh*0.1); ctx.lineTo(sw*0.36-f*sw*0.06,sh*0.22); ctx.stroke(); }
  ctx.restore();

  // Tail
  ctx.fillStyle=darkFeather;
  ctx.save(); ctx.translate(x+sw*0.9,y+sh*0.62);
  for(let f=0;f<4;f++){
    ctx.save(); ctx.rotate((-0.3+f*0.2)+anim*0.1);
    ctx.beginPath(); ctx.ellipse(sw*0.1,0,sw*0.05,sh*0.18,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  ctx.restore();

  // Head
  ctx.fillStyle=featherColor; ctx.beginPath(); ctx.ellipse(x+sw/2+wobble*0.4,y+sh*0.23,sw*0.27,sh*0.2,0,0,Math.PI*2); ctx.fill();

  // Crest
  ctx.fillStyle=darkFeather;
  for(let f=0;f<3;f++){
    ctx.save(); ctx.translate(x+sw/2+(f-1)*sw*0.08+wobble*0.4,y+sh*0.1);
    ctx.rotate((f-1)*0.2+anim*0.1);
    ctx.beginPath(); ctx.ellipse(0,-sh*0.06,sw*0.05,sh*0.1,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Beak
  ctx.fillStyle='#ffcc00';
  ctx.save(); ctx.translate(x+sw*0.2+wobble*0.4,y+sh*0.255);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-sw*0.22,sh*0.04); ctx.lineTo(-sw*0.22,-sh*0.04); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#cc9900';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-sw*0.22,sh*0.04); ctx.lineTo(-sw*0.15,0); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Eyes (angry)
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(x+sw*0.42+wobble*0.4,y+sh*0.2,sw*0.075,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ff2200'; ctx.beginPath(); ctx.arc(x+sw*0.42+wobble*0.4,y+sh*0.2,sw*0.04,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+sw*0.44+wobble*0.4,y+sh*0.19,sw*0.018,0,Math.PI*2); ctx.fill();

  if(z.name==='brute'||z.name==='armored'){
    ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(x+sw/2+wobble*0.4,y+sh*0.23,sw*0.27,sh*0.2,0,0,Math.PI*2); ctx.fill();
    ctx.font=`bold ${Math.max(7,Math.floor(sw*0.3))}px "Share Tech Mono",monospace`;
    ctx.fillStyle='#88ddff'; ctx.textAlign='center'; ctx.fillText(z.name==='brute'?'EAGLE':'RAVEN',x+sw/2,y-8);
  }

  drawHPBar(ctx, z);
  ctx.restore();
}

// ── SKIN 6: CLOWNS ──────────────────────────────────────────────────────
function drawClownSkin(z, ctx) {
  ctx.save();
  const x=z.x, y=z.y, sw=z.dw, sh=z.dh;
  const anim=Math.sin(z.anim), wobble=anim*3;
  const isBrute = z.name==='brute';

  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(x+sw/2,GROUND_Y+4,sw/2+3,5,0,0,Math.PI*2); ctx.fill();

  // Oversized clown shoes
  ctx.fillStyle='#ff3300';
  ctx.beginPath(); ctx.ellipse(x+sw*0.26,y+sh+anim*5,sw*0.28,sh*0.08,0.1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+sw*0.68,y+sh-anim*5,sw*0.28,sh*0.08,-0.1,0,Math.PI*2); ctx.fill();

  // Legs (baggy colored pants)
  ctx.fillStyle='#ff44ff';
  ctx.fillRect(x+sw*0.15,y+sh*0.62+anim*5,sw*0.28,sh*0.38);
  ctx.fillStyle='#44ffff';
  ctx.fillRect(x+sw*0.53,y+sh*0.62-anim*5,sw*0.28,sh*0.38);

  // Body: polka dot jumpsuit
  const jumpsuit = ctx.createLinearGradient(x,y+sh*0.28,x+sw,y+sh*0.7);
  jumpsuit.addColorStop(0,'#ff44cc'); jumpsuit.addColorStop(0.5,'#aa22aa'); jumpsuit.addColorStop(1,'#ff44cc');
  ctx.fillStyle=jumpsuit; ctx.beginPath(); ctx.roundRect(x+sw*0.08,y+sh*0.28,sw*0.84,sh*0.46,4); ctx.fill();

  // Polka dots
  const dotColors=['#ffff00','#00ffff','#ff8800','#00ff88'];
  for(let d=0;d<8;d++){
    ctx.fillStyle=dotColors[d%4];
    ctx.beginPath(); ctx.arc(x+sw*(0.18+d%4*0.22),y+sh*(0.36+Math.floor(d/4)*0.2),sw*0.06,0,Math.PI*2); ctx.fill();
  }

  // Pompom buttons
  ['#ffff00','#00ffff','#ff8800'].forEach((col,i)=>{
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x+sw/2,y+sh*(0.35+i*0.1),sw*0.07,0,Math.PI*2); ctx.fill();
  });

  // Ruffled collar
  ctx.fillStyle='#ffffff';
  for(let r=0;r<8;r++){
    const ra = (r/8)*Math.PI*2;
    ctx.beginPath(); ctx.arc(x+sw/2+Math.cos(ra)*sw*0.22,y+sh*0.3+Math.sin(ra)*sh*0.07,sw*0.11,0,Math.PI*2); ctx.fill();
  }

  // Arms flailing
  ctx.fillStyle='#ff44cc';
  ctx.save(); ctx.translate(x+sw*0.1,y+sh*0.36); ctx.rotate(-0.7+anim*0.4);
  ctx.beginPath(); ctx.roundRect(-sw*0.35,-sw*0.09,sw*0.35,sw*0.18,4); ctx.fill();
  // White glove
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.ellipse(-sw*0.35,0,sw*0.12,sw*0.12,0,0,Math.PI*2); ctx.fill(); ctx.restore();

  ctx.fillStyle='#ff44cc';
  ctx.save(); ctx.translate(x+sw*0.9,y+sh*0.36); ctx.rotate(0.7-anim*0.4);
  ctx.beginPath(); ctx.roundRect(0,-sw*0.09,sw*0.35,sw*0.18,4); ctx.fill();
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.ellipse(sw*0.35,0,sw*0.12,sw*0.12,0,0,Math.PI*2); ctx.fill(); ctx.restore();

  // Neck
  ctx.fillStyle='#ffe0c0'; ctx.fillRect(x+sw*0.4,y+sh*0.24,sw*0.2,sh*0.07);

  // Head (round clown head)
  ctx.fillStyle='#ffe0c0'; ctx.beginPath(); ctx.ellipse(x+sw/2+wobble*0.4,y+sh*0.175,sw*0.32,sh*0.21,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#ffbbaa'; ctx.lineWidth=1; ctx.stroke();

  // Wig (fluffy colored)
  const wigColor = isBrute?'#ff4400':'#ff8800';
  ctx.fillStyle=wigColor;
  for(let w=0;w<8;w++){
    const wa=(w/8)*Math.PI;
    ctx.beginPath(); ctx.arc(x+sw/2+Math.cos(wa-0.2)*sw*0.28+wobble*0.4,y+sh*0.06+Math.sin(wa)*sh*0.1,sw*0.14+Math.sin(z.anim+w)*sw*0.02,0,Math.PI*2); ctx.fill();
  }

  // Red nose
  ctx.save(); ctx.shadowColor='#ff0000'; ctx.shadowBlur=8;
  ctx.fillStyle='#ff2200'; ctx.beginPath(); ctx.arc(x+sw/2+wobble*0.4,y+sh*0.22,sw*0.1,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Wide painted smile
  ctx.fillStyle='#cc0022';
  ctx.beginPath(); ctx.ellipse(x+sw/2+wobble*0.4,y+sh*0.265,sw*0.17,sh*0.07,0,0,Math.PI); ctx.fill();
  // White teeth
  ctx.fillStyle='#eeeedd';
  for(let t=0;t<5;t++) ctx.fillRect(x+sw*0.34+t*sw*0.06+wobble*0.4,y+sh*0.265,sw*0.05,sh*0.05);

  // Scary eyes
  ctx.save(); ctx.shadowColor='#ff0000'; ctx.shadowBlur=5;
  ctx.fillStyle='#ff0000'; ctx.beginPath(); ctx.ellipse(x+sw/2-sw*0.11+wobble*0.4,y+sh*0.19,sw*0.075,sh*0.07,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+sw/2+sw*0.11+wobble*0.4,y+sh*0.19,sw*0.075,sh*0.07,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(x+sw/2-sw*0.11+wobble*0.4,y+sh*0.19,sw*0.04,sh*0.04,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+sw/2+sw*0.11+wobble*0.4,y+sh*0.19,sw*0.04,sh*0.04,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Tiny hat for brute (top hat)
  if(isBrute){
    ctx.fillStyle='#111';
    ctx.fillRect(x+sw*0.28+wobble*0.4,y+sh*0.01,sw*0.44,sh*0.08);
    ctx.fillRect(x+sw*0.34+wobble*0.4,y-sh*0.14,sw*0.32,sh*0.16);
    ctx.fillStyle='#ff44cc';
    ctx.fillRect(x+sw*0.34+wobble*0.4,y-sh*0.06,sw*0.32,sh*0.04);
  }

  if(z.name==='brute'||z.name==='armored'){
    ctx.font=`bold ${Math.max(7,Math.floor(sw*0.3))}px "Share Tech Mono",monospace`;
    ctx.fillStyle='#ff44ff'; ctx.textAlign='center'; ctx.fillText(z.name==='brute'?'PENNYWISE':'MIME',x+sw/2,y-8);
  }

  drawHPBar(ctx, z);
  ctx.restore();
}

// ── SKIN 7: INSECTS ─────────────────────────────────────────────────────
function drawInsectSkin(z, ctx) {
  ctx.save();
  const x=z.x, y=z.y, sw=z.dw, sh=z.dh;
  const anim=Math.sin(z.anim), wobble=anim*1.5;
  const flying = z.altitude > 0;
  const isRunner = z.name==='runner', isBrute = z.name==='brute', isArmored = z.name==='armored';

  // Ground shadow for flying ones
  if(flying){
    const shadowY = GROUND_Y + 4;
    const shadowScale = 0.3 + (y / GROUND_Y) * 0.5;
    ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(x+sw/2, shadowY, sw*0.5*shadowScale, 3*shadowScale, 0,0,Math.PI*2); ctx.fill();
  }

  if(flying){
    // DRAGONFLY / FLYING INSECT
    const bodyColor = isRunner?'#aaff44':isBrute?'#884400':isArmored?'#ffcc44':'#558800';

    // Thorax
    ctx.fillStyle=bodyColor;
    ctx.beginPath(); ctx.ellipse(x+sw/2+wobble,y+sh*0.55,sw*0.18,sh*0.28,0,0,Math.PI*2); ctx.fill();
    // Abdomen segments (long tail)
    const segColors=[bodyColor,'#226600',bodyColor,'#226600','#113300'];
    for(let s2=0;s2<5;s2++){
      ctx.fillStyle=segColors[s2];
      ctx.beginPath(); ctx.ellipse(x+sw/2+wobble+(s2*sw*0.12),y+sh*0.52+s2*sh*0.06,sw*0.12-s2*sw*0.015,sh*0.1-s2*sh*0.008,0.1,0,Math.PI*2); ctx.fill();
    }

    // 4 wings (dragonfly style)
    const wingFlap = Math.abs(Math.sin(z.anim*3));
    ctx.fillStyle=`rgba(180,240,255,${0.4+wingFlap*0.3})`;
    ctx.strokeStyle='rgba(100,200,150,0.6)'; ctx.lineWidth=0.8;
    // Upper wings
    ctx.save(); ctx.translate(x+sw/2+wobble,y+sh*0.42);
    ctx.rotate(-0.1-wingFlap*0.5);
    ctx.beginPath(); ctx.ellipse(-sw*0.32,0,sw*0.36,sh*0.1,-.1,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.translate(x+sw/2+wobble,y+sh*0.42);
    ctx.rotate(0.1+wingFlap*0.5);
    ctx.beginPath(); ctx.ellipse(sw*0.32,0,sw*0.36,sh*0.1,.1,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
    // Lower wings (shorter)
    ctx.save(); ctx.translate(x+sw/2+wobble,y+sh*0.52);
    ctx.rotate(-0.2-wingFlap*0.4);
    ctx.beginPath(); ctx.ellipse(-sw*0.25,0,sw*0.28,sh*0.08,-.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.translate(x+sw/2+wobble,y+sh*0.52);
    ctx.rotate(0.2+wingFlap*0.4);
    ctx.beginPath(); ctx.ellipse(sw*0.25,0,sw*0.28,sh*0.08,.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();

    // Head
    ctx.fillStyle=bodyColor; ctx.beginPath(); ctx.ellipse(x+sw/2+wobble,y+sh*0.28,sw*0.2,sh*0.16,0,0,Math.PI*2); ctx.fill();
    // Compound eyes
    ctx.save(); ctx.shadowColor='#00ff88'; ctx.shadowBlur=6;
    ctx.fillStyle='#00ff88';
    ctx.beginPath(); ctx.ellipse(x+sw/2-sw*0.14+wobble,y+sh*0.27,sw*0.1,sh*0.1,-.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+sw/2+sw*0.14+wobble,y+sh*0.27,sw*0.1,sh*0.1,.2,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // Antennae
    ctx.strokeStyle=bodyColor; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(x+sw/2-sw*0.08+wobble,y+sh*0.2); ctx.lineTo(x+sw/2-sw*0.25+wobble,y+sh*0.05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+sw/2+sw*0.08+wobble,y+sh*0.2); ctx.lineTo(x+sw/2+sw*0.25+wobble,y+sh*0.05); ctx.stroke();
    ctx.fillStyle=bodyColor;
    ctx.beginPath(); ctx.arc(x+sw/2-sw*0.25+wobble,y+sh*0.05,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+sw/2+sw*0.25+wobble,y+sh*0.05,2,0,Math.PI*2); ctx.fill();

  } else {
    // GROUND INSECT (beetle / roach)
    const bodyColor = isBrute?'#884400':isArmored?'#ffcc44':'#558800';
    const shineColor = isBrute?'#cc6600':isArmored?'#ffee88':'#88cc00';

    // 6 legs scurrying
    ctx.strokeStyle='#334400'; ctx.lineWidth=1.2; ctx.lineCap='round';
    const legWave = z.anim;
    for(let l=0;l<3;l++){
      const lx = x+sw*(0.25+l*0.22), ly = y+sh*0.55;
      const wiggle = Math.sin(legWave+l)*6;
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx-sw*0.28,ly+sh*0.25+wiggle); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx+sw*0.28,ly+sh*0.25-wiggle); ctx.stroke();
    }

    // Elytra (wing covers) - iridescent shell
    const elytraGrad = ctx.createLinearGradient(x,y,x+sw,y+sh);
    elytraGrad.addColorStop(0,shineColor); elytraGrad.addColorStop(0.4,bodyColor); elytraGrad.addColorStop(1,'#112200');
    ctx.fillStyle=elytraGrad;
    ctx.beginPath(); ctx.ellipse(x+sw/2,y+sh*0.55,sw*0.42,sh*0.36,0,0,Math.PI*2); ctx.fill();
    // Center line on elytra
    ctx.strokeStyle='#112200'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+sw/2,y+sh*0.2); ctx.lineTo(x+sw/2,y+sh*0.9); ctx.stroke();
    // Segments
    for(let s2=0;s2<3;s2++){
      ctx.beginPath(); ctx.ellipse(x+sw/2,y+sh*(0.35+s2*0.2),sw*(0.38-s2*0.04),sh*0.06,0,0,Math.PI*2); ctx.stroke();
    }

    // Head
    ctx.fillStyle=bodyColor; ctx.beginPath(); ctx.ellipse(x+sw/2+wobble*0.5,y+sh*0.2,sw*0.22,sh*0.18,0,0,Math.PI*2); ctx.fill();
    // Mandibles
    ctx.strokeStyle='#334400'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x+sw/2-sw*0.1+wobble*0.5,y+sh*0.28); ctx.lineTo(x+sw/2-sw*0.22+wobble*0.5,y+sh*0.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+sw/2+sw*0.1+wobble*0.5,y+sh*0.28); ctx.lineTo(x+sw/2+sw*0.22+wobble*0.5,y+sh*0.35); ctx.stroke();
    // Antennae
    ctx.strokeStyle=bodyColor; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+sw/2-sw*0.06+wobble*0.5,y+sh*0.12); ctx.lineTo(x+sw/2-sw*0.3+wobble*0.5,y-sh*0.08+anim*3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+sw/2+sw*0.06+wobble*0.5,y+sh*0.12); ctx.lineTo(x+sw/2+sw*0.3+wobble*0.5,y-sh*0.08-anim*3); ctx.stroke();
    // Eyes
    ctx.save(); ctx.shadowColor='#aaff00'; ctx.shadowBlur=4;
    ctx.fillStyle='#aaff00';
    ctx.beginPath(); ctx.arc(x+sw/2-sw*0.1+wobble*0.5,y+sh*0.18,sw*0.07,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+sw/2+sw*0.1+wobble*0.5,y+sh*0.18,sw*0.07,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // Iridescent shine spot
    ctx.fillStyle='rgba(180,255,180,0.25)'; ctx.beginPath(); ctx.ellipse(x+sw*0.35,y+sh*0.38,sw*0.12,sh*0.1,-.3,0,Math.PI*2); ctx.fill();
  }

  if(isBrute||isArmored){
    ctx.font=`bold ${Math.max(6,Math.floor(sw*0.28))}px "Share Tech Mono",monospace`;
    ctx.fillStyle='#aaff44'; ctx.textAlign='center';
    ctx.fillText(isBrute?(flying?'HORNET':'STAG'):isArmored?(flying?'HAWK-MOTH':'SCARAB'):'',x+sw/2,y-8);
  }

  drawHPBar(ctx, z);
  ctx.restore();
}

// ── SKIN 8: DRONES ──────────────────────────────────────────────────────
function drawDroneSkin(z, ctx) {
  ctx.save();
  const x=z.x, y=z.y, sw=z.dw, sh=z.dh;
  const anim=Math.sin(z.anim);
  // Determine drone type from altitude/name
  const isQuad = z.name==='runner';          // altitude 1 - quadcopter
  const isShaheed = z.name==='normal'||z.name==='brute'; // altitude 2 - shaheed/loitering munition
  const isReaper = z.name==='armored';       // altitude 3 - reaper UCAV

  // Ground shadow - faint and small (high altitude)
  const shadowFade = 0.05 + (1 - z.altitude/3)*0.15;
  const shadowScale = 0.2 + (1 - z.altitude/3)*0.5;
  ctx.fillStyle=`rgba(0,0,0,${shadowFade})`; ctx.beginPath(); ctx.ellipse(x+sw/2, GROUND_Y+4, sw*0.5*shadowScale, 4*shadowScale, 0,0,Math.PI*2); ctx.fill();

  if(isQuad){
    // ── QUADCOPTER ──
    const frameColor='#444'; const armColor='#333'; const propColor='rgba(200,200,255,0.5)';
    // Central body
    ctx.fillStyle='#555'; ctx.beginPath(); ctx.roundRect(x+sw*0.3,y+sh*0.35,sw*0.4,sh*0.3,4); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.roundRect(x+sw*0.35,y+sh*0.38,sw*0.3,sh*0.24,3); ctx.fill();
    // Camera eye
    ctx.save(); ctx.shadowColor='#00aaff'; ctx.shadowBlur=8;
    ctx.fillStyle='#00aaff'; ctx.beginPath(); ctx.arc(x+sw*0.38,y+sh*0.52,sw*0.07,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#002244'; ctx.beginPath(); ctx.arc(x+sw*0.38,y+sh*0.52,sw*0.04,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // 4 arms
    const armPositions=[[-.38,-.28],[.38,-.28],[-.38,.28],[.38,.28]];
    armPositions.forEach(([ax,ay])=>{
      ctx.fillStyle=armColor; ctx.beginPath(); ctx.roundRect(x+sw*(0.5+ax*0.5-0.05),y+sh*(0.5+ay*0.5-0.05),sw*0.1,sh*0.1,2); ctx.fill();
      ctx.strokeStyle='#444'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x+sw*0.5,y+sh*0.5); ctx.lineTo(x+sw*(0.5+ax*0.5),y+sh*(0.5+ay*0.5)); ctx.stroke();
      // Spinning prop blur
      ctx.save(); ctx.translate(x+sw*(0.5+ax*0.5),y+sh*(0.5+ay*0.5));
      ctx.fillStyle=propColor;
      ctx.beginPath(); ctx.ellipse(0,0,sw*0.18,sw*0.04,z.anim*4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,0,sw*0.04,sw*0.18,z.anim*4,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
    // LED blink
    const blink = Math.sin(z.anim*4)>0;
    ctx.fillStyle=blink?'#ff2200':'#440000'; ctx.beginPath(); ctx.arc(x+sw*0.62,y+sh*0.4,sw*0.05,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=blink?'#00ff44':'#004400'; ctx.beginPath(); ctx.arc(x+sw*0.62,y+sh*0.55,sw*0.05,0,Math.PI*2); ctx.fill();

    ctx.font=`bold ${Math.max(6,sw*0.28)}px "Share Tech Mono",monospace`;
    ctx.fillStyle='#aaaacc'; ctx.textAlign='center'; ctx.fillText('QUAD',x+sw/2,y-8);

  } else if(isShaheed){
    // ── SHAHEED / LOITERING MUNITION ──
    const isBig = z.name==='brute';
    const bodyLen = isBig ? sw*0.9 : sw*0.75;
    const bodyH = isBig ? sh*0.18 : sh*0.14;

    // Fuselage (cigar shape)
    const fuseGrad = ctx.createLinearGradient(x+sw*0.1,y+sh*0.5-bodyH,x+sw*0.1,y+sh*0.5+bodyH);
    fuseGrad.addColorStop(0,'#666'); fuseGrad.addColorStop(0.5,'#888'); fuseGrad.addColorStop(1,'#333');
    ctx.fillStyle=fuseGrad;
    ctx.beginPath(); ctx.ellipse(x+sw*0.5,y+sh*0.5,bodyLen*0.5,bodyH,0,0,Math.PI*2); ctx.fill();
    // Nose cone
    ctx.fillStyle='#444';
    ctx.beginPath(); ctx.moveTo(x+sw*0.08,y+sh*0.5); ctx.lineTo(x+sw*0.18,y+sh*0.5-bodyH); ctx.lineTo(x+sw*0.18,y+sh*0.5+bodyH); ctx.closePath(); ctx.fill();
    // Warhead marker
    ctx.save(); ctx.shadowColor='#ff4400'; ctx.shadowBlur=12;
    ctx.fillStyle='#ff4400'; ctx.beginPath(); ctx.arc(x+sw*0.14,y+sh*0.5,sw*0.06,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // Delta wings
    ctx.fillStyle='#555';
    ctx.beginPath(); ctx.moveTo(x+sw*0.5,y+sh*0.5-bodyH); ctx.lineTo(x+sw*0.3,y+sh*0.5-sh*0.42); ctx.lineTo(x+sw*0.75,y+sh*0.5-bodyH); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+sw*0.5,y+sh*0.5+bodyH); ctx.lineTo(x+sw*0.3,y+sh*0.5+sh*0.42); ctx.lineTo(x+sw*0.75,y+sh*0.5+bodyH); ctx.closePath(); ctx.fill();
    // Wing markings
    ctx.strokeStyle='#333'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+sw*0.5,y+sh*0.5-bodyH); ctx.lineTo(x+sw*0.38,y+sh*0.5-sh*0.32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+sw*0.5,y+sh*0.5+bodyH); ctx.lineTo(x+sw*0.38,y+sh*0.5+sh*0.32); ctx.stroke();

    // Engine exhaust glow at rear
    ctx.save(); ctx.shadowColor='#ff8800'; ctx.shadowBlur=15;
    ctx.fillStyle=`rgba(255,${100+Math.random()*80},0,0.8)`;
    ctx.beginPath(); ctx.ellipse(x+sw*0.88,y+sh*0.5,sw*0.06,bodyH*0.7,0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // Seeker head glow (front)
    ctx.save(); ctx.shadowColor='#ff2200'; ctx.shadowBlur=10+Math.sin(z.anim*2)*5;
    ctx.fillStyle='#ff2200'; ctx.beginPath(); ctx.arc(x+sw*0.14,y+sh*0.5,sw*0.04,0,Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.font=`bold ${Math.max(6,sw*0.26)}px "Share Tech Mono",monospace`;
    ctx.fillStyle='#ff6644'; ctx.textAlign='center'; ctx.fillText(isBig?'SHAHEED-136':'SHAHEED',x+sw/2,y-8);

  } else {
    // ── REAPER UCAV ──
    // Long fuselage
    const fuseGrad = ctx.createLinearGradient(x,y+sh*0.4,x,y+sh*0.7);
    fuseGrad.addColorStop(0,'#555'); fuseGrad.addColorStop(1,'#2a2a2a');
    ctx.fillStyle=fuseGrad;
    ctx.beginPath(); ctx.ellipse(x+sw*0.5,y+sh*0.52,sw*0.46,sh*0.12,0,0,Math.PI*2); ctx.fill();

    // V-tail
    ctx.fillStyle='#444';
    ctx.beginPath(); ctx.moveTo(x+sw*0.82,y+sh*0.52); ctx.lineTo(x+sw*0.98,y+sh*0.3); ctx.lineTo(x+sw*0.92,y+sh*0.52); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+sw*0.82,y+sh*0.52); ctx.lineTo(x+sw*0.98,y+sh*0.74); ctx.lineTo(x+sw*0.92,y+sh*0.52); ctx.closePath(); ctx.fill();

    // Long straight wings (Reaper style)
    ctx.fillStyle='#4a4a4a';
    ctx.beginPath(); ctx.moveTo(x+sw*0.5,y+sh*0.48); ctx.lineTo(x+sw*0.05,y+sh*0.42); ctx.lineTo(x+sw*0.05,y+sh*0.52); ctx.lineTo(x+sw*0.5,y+sh*0.56); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+sw*0.5,y+sh*0.48); ctx.lineTo(x+sw*0.95,y+sh*0.42); ctx.lineTo(x+sw*0.95,y+sh*0.52); ctx.lineTo(x+sw*0.5,y+sh*0.56); ctx.closePath(); ctx.fill();
    // Wing hardpoints (missiles)
    [0.25, 0.38, 0.62, 0.75].forEach(wx=>{
      ctx.fillStyle='#333'; ctx.fillRect(x+sw*wx,y+sh*0.56,sw*0.07,sh*0.18);
      ctx.fillStyle='#ff4400'; ctx.beginPath(); ctx.arc(x+sw*wx+sw*0.035,y+sh*0.74,sw*0.035,0,Math.PI*2); ctx.fill();
    });

    // Bulbous sensor turret (under nose)
    ctx.save(); ctx.shadowColor='#00ccff'; ctx.shadowBlur=10;
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.ellipse(x+sw*0.18,y+sh*0.64,sw*0.1,sh*0.1,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#00ccff'; ctx.beginPath(); ctx.arc(x+sw*0.18,y+sh*0.64,sw*0.05,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // Nose
    ctx.fillStyle='#333';
    ctx.beginPath(); ctx.moveTo(x+sw*0.06,y+sh*0.52); ctx.lineTo(x+sw*0.16,y+sh*0.45); ctx.lineTo(x+sw*0.16,y+sh*0.59); ctx.closePath(); ctx.fill();

    // Pusher prop at rear
    ctx.fillStyle=`rgba(200,200,200,0.4)`;
    ctx.beginPath(); ctx.ellipse(x+sw*0.92,y+sh*0.52,sw*0.06,sw*0.14,z.anim*6,0,Math.PI*2); ctx.fill();

    // USAF roundel
    ctx.fillStyle='rgba(0,50,120,0.7)'; ctx.beginPath(); ctx.arc(x+sw*0.5,y+sh*0.5,sw*0.08,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(200,0,0,0.7)'; ctx.beginPath(); ctx.arc(x+sw*0.5,y+sh*0.5,sw*0.05,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(x+sw*0.5,y+sh*0.5,sw*0.025,0,Math.PI*2); ctx.fill();

    ctx.font=`bold ${Math.max(6,sw*0.22)}px "Share Tech Mono",monospace`;
    ctx.fillStyle='#aaccff'; ctx.textAlign='center'; ctx.fillText('MQ-9 REAPER',x+sw/2,y-8);
  }

  drawHPBar(ctx, z);
  ctx.restore();
}

function drawRockets(){
  (state.rockets||[]).forEach(r=>{
    // Trail
    if(r.trail.length>1){
      ctx.save(); ctx.setLineDash([2,4]);
      ctx.strokeStyle='rgba(255,136,0,0.3)'; ctx.lineWidth=2;
      ctx.beginPath(); r.trail.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
      ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    }
    // Rocket body
    const ang = Math.atan2(r.vy,r.vx);
    ctx.save();
    ctx.translate(r.x,r.y); ctx.rotate(ang);
    // Body
    ctx.fillStyle='#888';
    ctx.beginPath(); ctx.ellipse(0,0,10,4,0,0,Math.PI*2); ctx.fill();
    // Nose cone
    ctx.fillStyle='#cc2200';
    ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(16,0); ctx.lineTo(10,3); ctx.lineTo(10,-3); ctx.closePath(); ctx.fill();
    // Fins
    ctx.fillStyle='#555';
    ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(-14,6); ctx.lineTo(-10,0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(-14,-6); ctx.lineTo(-10,0); ctx.closePath(); ctx.fill();
    // Engine glow
    ctx.save(); ctx.shadowColor='#ff8800'; ctx.shadowBlur=12;
    ctx.fillStyle='rgba(255,150,0,0.9)';
    ctx.beginPath(); ctx.ellipse(-10,0,5,3,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.restore();
  });
}

function drawEnemyBullets(){
  (state.enemyBullets||[]).forEach(b=>{
    ctx.save();
    ctx.shadowColor=b.color; ctx.shadowBlur=8;
    ctx.fillStyle=b.color;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    // Tracer line
    ctx.strokeStyle=b.color+'88'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*3,b.y-b.vy*3); ctx.stroke();
    ctx.restore();
  });
}

function drawDrops(){
  (state.drops||[]).forEach(d=>{
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    if(d.shape==='bomb'){
      // Finned bomb shape
      ctx.fillStyle='#222';
      ctx.beginPath(); ctx.ellipse(0,-d.size*0.6,d.size*0.5,d.size,0,0,Math.PI*2); ctx.fill();
      // Fins
      ctx.fillStyle='#555';
      ctx.beginPath(); ctx.moveTo(-d.size*0.5,d.size*0.2); ctx.lineTo(-d.size*1.0,d.size*0.9); ctx.lineTo(-d.size*0.5,d.size*0.6); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(d.size*0.5,d.size*0.2); ctx.lineTo(d.size*1.0,d.size*0.9); ctx.lineTo(d.size*0.5,d.size*0.6); ctx.closePath(); ctx.fill();
      // Nose glint
      ctx.save(); ctx.shadowColor='#ff4400'; ctx.shadowBlur=6;
      ctx.fillStyle='#ff4400'; ctx.beginPath(); ctx.arc(0,-d.size*1.2,d.size*0.3,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else if(d.shape==='poop'){
      // Bird poop splat shape
      ctx.fillStyle=d.color;
      ctx.beginPath(); ctx.ellipse(0,0,d.size*0.7,d.size,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-d.size*0.4,-d.size*0.5,d.size*0.4,d.size*0.5,0.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(d.size*0.3,-d.size*0.7,d.size*0.3,d.size*0.4,-0.2,0,Math.PI*2); ctx.fill();
    } else {
      // Generic teardrop / stinger
      ctx.fillStyle=d.color;
      ctx.beginPath(); ctx.ellipse(0,0,d.size*0.5,d.size*0.8,0,0,Math.PI*2); ctx.fill();
      // Trailing streak
      ctx.strokeStyle=d.color+'88'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,d.size); ctx.lineTo(0,d.size*3); ctx.stroke();
    }
    ctx.restore();
  });
}

// ── SKIN 9: ROBOTS ──────────────────────────────────────────────────────
function drawRobotSkin(z, ctx) {
  ctx.save();
  const x=z.x, y=z.y, sw=z.dw, sh=z.dh;
  const anim=Math.sin(z.anim), wobble=anim*1.5;
  const isBrute=z.name==='brute', isArmored=z.name==='armored';
  const stepL=Math.sin(z.anim)*sh*0.12, stepR=-Math.sin(z.anim)*sh*0.12;

  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(x+sw/2,GROUND_Y+4,sw/2+3,5,0,0,Math.PI*2); ctx.fill();

  // Legs (pistons)
  const legColor=isBrute?'#334':isArmored?'#556':'#446';
  ctx.fillStyle=legColor;
  ctx.fillRect(x+sw*0.18,y+sh*0.65+stepL,sw*0.22,sh*0.35);
  ctx.fillRect(x+sw*0.56,y+sh*0.65+stepR,sw*0.22,sh*0.35);
  // Piston detail
  ctx.fillStyle='#88aacc';
  ctx.fillRect(x+sw*0.22,y+sh*0.72+stepL,sw*0.12,sh*0.08);
  ctx.fillRect(x+sw*0.6,y+sh*0.72+stepR,sw*0.12,sh*0.08);
  // Feet
  ctx.fillStyle='#223';
  ctx.fillRect(x+sw*0.12,y+sh+stepL,sw*0.3,sh*0.08);
  ctx.fillRect(x+sw*0.5,y+sh+stepR,sw*0.3,sh*0.08);

  // Body (boxy chassis)
  const bodyGrad=ctx.createLinearGradient(x,y+sh*0.28,x,y+sh*0.7);
  bodyGrad.addColorStop(0,isBrute?'#334466':'#446688'); bodyGrad.addColorStop(1,'#223344');
  ctx.fillStyle=bodyGrad; ctx.beginPath(); ctx.roundRect(x+sw*0.08,y+sh*0.28,sw*0.84,sh*0.48,4); ctx.fill();
  ctx.strokeStyle='#88aacc44'; ctx.lineWidth=1; ctx.strokeRect(x+sw*0.08,y+sh*0.28,sw*0.84,sh*0.48);

  // Chest panel lines
  ctx.strokeStyle='#88aaccaa'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(x+sw*0.5,y+sh*0.3); ctx.lineTo(x+sw*0.5,y+sh*0.74); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+sw*0.1,y+sh*0.5); ctx.lineTo(x+sw*0.9,y+sh*0.5); ctx.stroke();

  // Core reactor glow
  const pulse=Math.abs(Math.sin(z.anim*2));
  ctx.save(); ctx.shadowColor='#00ccff'; ctx.shadowBlur=10+pulse*8;
  ctx.fillStyle=`rgba(0,${150+Math.floor(pulse*105)},255,0.9)`;
  ctx.beginPath(); ctx.ellipse(x+sw/2,y+sh*0.5,sw*0.1,sh*0.08,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Arms
  ctx.fillStyle='#335566';
  ctx.save(); ctx.translate(x+sw*0.08,y+sh*0.36); ctx.rotate(-0.4+anim*0.3);
  ctx.fillRect(-sw*0.32,-sw*0.09,sw*0.32,sw*0.18);
  ctx.fillStyle='#88aacc'; ctx.fillRect(-sw*0.36,-sw*0.06,sw*0.08,sw*0.12); ctx.restore();
  ctx.fillStyle='#335566';
  ctx.save(); ctx.translate(x+sw*0.92,y+sh*0.36); ctx.rotate(0.4-anim*0.3);
  ctx.fillRect(0,-sw*0.09,sw*0.32,sw*0.18);
  ctx.fillStyle='#88aacc'; ctx.fillRect(sw*0.28,-sw*0.06,sw*0.08,sw*0.12); ctx.restore();

  // Head (square)
  ctx.fillStyle='#2a3a4a'; ctx.beginPath(); ctx.roundRect(x+sw*0.15+wobble,y+sh*0.06,sw*0.7,sh*0.24,3); ctx.fill();
  ctx.strokeStyle='#88aacc66'; ctx.lineWidth=1; ctx.strokeRect(x+sw*0.15+wobble,y+sh*0.06,sw*0.7,sh*0.24);

  // Antenna
  ctx.strokeStyle='#88aacc'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x+sw/2+wobble,y+sh*0.06); ctx.lineTo(x+sw/2+wobble,y-sh*0.1); ctx.stroke();
  ctx.save(); ctx.shadowColor='#00ccff'; ctx.shadowBlur=8;
  ctx.fillStyle='#00ccff'; ctx.beginPath(); ctx.arc(x+sw/2+wobble,y-sh*0.1,sw*0.06,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Eye visor (LED strip)
  ctx.save(); ctx.shadowColor='#00ccff'; ctx.shadowBlur=6;
  ctx.fillStyle='#00ccff';
  ctx.beginPath(); ctx.roundRect(x+sw*0.22+wobble,y+sh*0.12,sw*0.56,sh*0.07,2); ctx.fill();
  ctx.restore();
  // Scan line
  const scanX=x+sw*0.22+wobble+(((z.anim*20)%(sw*0.56)));
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(Math.min(scanX, x+sw*0.78+wobble),y+sh*0.155,sw*0.04,0,Math.PI*2); ctx.fill();

  // Mouth (LED grid)
  ctx.fillStyle='#002244';
  ctx.beginPath(); ctx.roundRect(x+sw*0.28+wobble,y+sh*0.22,sw*0.44,sh*0.06,1); ctx.fill();
  ctx.fillStyle='#00ccff';
  for(let i=0;i<5;i++) if(Math.sin(z.anim*3+i)>0) ctx.fillRect(x+sw*0.3+i*sw*0.085+wobble,y+sh*0.225,sw*0.065,sh*0.045);

  if(isBrute||isArmored){
    ctx.font=`bold ${Math.max(7,Math.floor(sw*0.28))}px "Share Tech Mono",monospace`;
    ctx.fillStyle='#88ccff'; ctx.textAlign='center';
    ctx.fillText(isBrute?'TERMINATOR':'UNIT-7',x+sw/2,y-18);

// ── SKIN 11: PUMPKINS ───────────────────────────────────────────────────
function drawPumpkinSkin(z, ctx) {
  ctx.save();
  const x=z.x, y=z.y, sw=z.dw, sh=z.dh;
  const anim=Math.sin(z.anim), wobble=anim*2;
  const isBrute=z.name==='brute', isArmored=z.name==='armored';
  const bounce=Math.abs(anim)*sh*0.05;

  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(x+sw/2,GROUND_Y+4,sw/2+4,5+bounce,0,0,Math.PI*2); ctx.fill();

  // Stubby legs
  ctx.fillStyle='#3a2008';
  ctx.fillRect(x+sw*0.24,y+sh*0.82+anim*5,sw*0.16,sh*0.18);
  ctx.fillRect(x+sw*0.58,y+sh*0.82-anim*5,sw*0.16,sh*0.18);

  // Body: big round pumpkin
  const sections=isBrute?5:4;
  const sectionColors=['#e06800','#cc5500','#dd6600'];
  for(let i=0;i<sections;i++){
    const cx=x+sw*(0.15+i*(0.7/sections))+sw*(0.35/sections);
    const rx=sw*(0.4/sections);
    ctx.fillStyle=sectionColors[i%3];
    ctx.beginPath(); ctx.ellipse(cx,y+sh*0.52-bounce,rx,sh*0.38,0,0,Math.PI*2); ctx.fill();
  }
  // Highlight ridge
  ctx.strokeStyle='#ff9944'; ctx.lineWidth=1;
  for(let i=1;i<sections;i++){
    const lx=x+sw*(0.15+(i)*(0.7/sections));
    ctx.beginPath(); ctx.moveTo(lx,y+sh*0.18-bounce); ctx.lineTo(lx,y+sh*0.86-bounce); ctx.stroke();
  }

  // Stem
  ctx.fillStyle='#3a5a1a';
  ctx.beginPath(); ctx.roundRect(x+sw*0.44+wobble,y+sh*0.08-bounce,sw*0.12,sh*0.15,3); ctx.fill();
  // Curly vine
  ctx.strokeStyle='#558833'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x+sw*0.56+wobble,y+sh*0.1-bounce);
  ctx.quadraticCurveTo(x+sw*0.7+wobble,y+sh*0.06-bounce,x+sw*0.68+wobble,y+sh*0.18-bounce); ctx.stroke();

  // Jack-o-lantern face
  // Eyes (evil triangles)
  ctx.fillStyle='#ff6600'; ctx.shadowColor='#ff8800'; ctx.shadowBlur=8;
  // Left eye
  ctx.beginPath(); ctx.moveTo(x+sw*0.28+wobble,y+sh*0.3-bounce); ctx.lineTo(x+sw*0.22+wobble,y+sh*0.42-bounce); ctx.lineTo(x+sw*0.36+wobble,y+sh*0.42-bounce); ctx.closePath(); ctx.fill();
  // Right eye
  ctx.beginPath(); ctx.moveTo(x+sw*0.72+wobble,y+sh*0.3-bounce); ctx.lineTo(x+sw*0.66+wobble,y+sh*0.42-bounce); ctx.lineTo(x+sw*0.8+wobble,y+sh*0.42-bounce); ctx.closePath(); ctx.fill();
  // Nose
  ctx.beginPath(); ctx.moveTo(x+sw*0.5+wobble,y+sh*0.44-bounce); ctx.lineTo(x+sw*0.44+wobble,y+sh*0.52-bounce); ctx.lineTo(x+sw*0.56+wobble,y+sh*0.52-bounce); ctx.closePath(); ctx.fill();
  // Jagged mouth
  ctx.beginPath(); ctx.moveTo(x+sw*0.2+wobble,y+sh*0.6-bounce);
  for(let tooth=0;tooth<7;tooth++){
    const tx2=x+sw*(0.2+tooth*0.1)+wobble, ty2up=y+sh*0.6-bounce, ty2dn=y+sh*0.7-bounce;
    ctx.lineTo(tx2,tooth%2===0?ty2up:ty2dn);
  }
  ctx.lineTo(x+sw*0.82+wobble,y+sh*0.6-bounce); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;

  // Inner glow
  ctx.fillStyle='rgba(255,140,0,0.15)';
  ctx.beginPath(); ctx.ellipse(x+sw/2+wobble,y+sh*0.5-bounce,sw*0.3,sh*0.28,0,0,Math.PI*2); ctx.fill();

  // Big pumpkin for brute
  if(isBrute||isArmored){
    ctx.font=`bold ${Math.max(7,Math.floor(sw*0.28))}px "Share Tech Mono",monospace`;
    ctx.fillStyle='#ffaa44'; ctx.textAlign='center'; ctx.shadowBlur=0;
    ctx.fillText(isBrute?'GREAT PUMPKIN':'HEXED',x+sw/2,y-12);
  }
  drawHPBar(ctx,z); ctx.restore();
}

  // Head

  ctx.restore();
  ctx.fillStyle=furColor;

  ctx.rotate(0.15-earWiggle); ctx.beginPath(); ctx.ellipse(0,-sh*0.2,sw*0.09,sh*0.22,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffaacc'; ctx.beginPath(); ctx.ellipse(0,-sh*0.2,sw*0.05,sh*0.16,0,0,Math.PI*2); ctx.fill();

function drawPowerBoostHUD(){
  const pb=state&&state.powerBoost; if(!pb) return;
  const pct=pb.timer/pb.duration, barW=160, bx=W/2-80, by=16;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.75)';

// ── AIM OVERLAY ──────────────────────────────────────────────────────────
function drawAimOverlay(){
  const t=state.tank, a=t.barrelAngle;
  const tipX=t.x+44+Math.cos(a)*30, tipY=t.y+10+Math.sin(a)*30;
  const g=0.22;
  const spd=charging ? 7+Math.min((Date.now()-chargeStart)/1500,1)*5 : 9;
  const dx=mousePos.x-tipX, dy=mousePos.y-tipY, dist=Math.hypot(dx,dy)||1;
  const vx=(dx/dist)*spd;
  const tf=Math.abs(dx/vx)||1;
  const vy=(dy-0.5*g*tf*tf)/tf;
  ctx.save(); ctx.setLineDash([4,7]); ctx.strokeStyle='rgba(240,208,96,0.28)'; ctx.lineWidth=1.5;
  ctx.beginPath(); let px=tipX,py=tipY,pvx=vx,pvy=vy;
  ctx.moveTo(px,py);
  for(let i=0;i<50;i++){ pvy+=g; px+=pvx; py+=pvy; if(py>GROUND_Y||px>W+10||px<-10) break; ctx.lineTo(px,py); }
  ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  const mx=mousePos.x, my=mousePos.y;
  const onZ=state.zombies.some(z=>mx>=z.x&&mx<=z.x+z.dw&&my>=z.y&&my<=z.y+z.dh);
  const col=onZ?'rgba(255,60,60,0.85)':'rgba(240,208,96,0.5)';
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(mx-12,my); ctx.lineTo(mx+12,my); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx,my-12); ctx.lineTo(mx,my+12); ctx.stroke();
  ctx.beginPath(); ctx.arc(mx,my,7,0,Math.PI*2); ctx.stroke();
  if(onZ){ ctx.strokeStyle='rgba(255,60,60,0.4)'; ctx.beginPath(); ctx.arc(mx,my,14,0,Math.PI*2); ctx.stroke(); }
  ctx.restore();
  if(charging){
    const pct=Math.min((Date.now()-chargeStart)/1500,1);
    const previewPower = 0.35 + pct*0.65;
    const previewRadius = 22 + (previewPower-0.35)*185;
    // Blast radius preview circle at mouse
    ctx.save(); ctx.setLineDash([4,6]);
    ctx.strokeStyle=pct>0.8?`rgba(255,80,80,0.3)`:`rgba(240,208,96,0.22)`;
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(mx,my,previewRadius,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    // Charge ring on barrel tip
    ctx.save(); ctx.strokeStyle=pct>0.8?`rgba(255,80,80,${0.5+pct*0.4})`:`rgba(240,208,96,${0.4+pct*0.5})`;
    ctx.lineWidth=2+pct*3; ctx.shadowColor=pct>0.8?'#ff4444':'#f0d060'; ctx.shadowBlur=10+pct*15;
    ctx.beginPath(); ctx.arc(tipX,tipY,6+pct*18,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
  // SEA RAM active — pulsing muzzle glow
  if(seaRamActive){
    ctx.save(); ctx.shadowColor='#ff4400'; ctx.shadowBlur=20+Math.random()*15;
    ctx.strokeStyle=`rgba(255,${80+Math.random()*80},0,0.85)`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(tipX,tipY,8+Math.random()*5,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
}

function drawWaveText(){
  const s=state;

  // BUM RUSH flash
  if(s.bumRushActive && s.bumRushTimer>0){
    const pulse = Math.sin(Date.now()/80)*0.4+0.6;
    const alpha = Math.min(1, s.bumRushTimer/40);
    ctx.save(); ctx.globalAlpha=alpha*pulse; ctx.textAlign='center';
    ctx.font='bold 72px "Bebas Neue",cursive';
    ctx.fillStyle='#ff2200'; ctx.shadowColor='#ff6600'; ctx.shadowBlur=30;
    ctx.fillText('BUM RUSH!',W/2,H/2-20);
    ctx.font='16px "Share Tech Mono",monospace'; ctx.fillStyle='#ffaa66'; ctx.shadowBlur=0;
    ctx.fillText('EVERY ENEMY AT ONCE — HOLD ON!',W/2,H/2+14);
    ctx.restore();
  }
  // Layer milestone flash
  if(s.layerFlashTimer > 0){
    s.layerFlashTimer--;
    const alpha = Math.min(1, s.layerFlashTimer/40) * Math.min(1,(s.layerFlashTimer)/140);
    ctx.save(); ctx.globalAlpha=alpha; ctx.textAlign='center';
    ctx.font='bold 36px "Bebas Neue",cursive'; ctx.fillStyle='#ff6644'; ctx.shadowColor='#ff2200'; ctx.shadowBlur=20;
    ctx.fillText('LAYER '+s.layer+' — DRONES NOW PERMANENT', W/2, H/2-40);
    ctx.font='14px "Share Tech Mono",monospace'; ctx.fillStyle='#ffaa88'; ctx.shadowBlur=0;
    ctx.fillText('HORDE RESETS · DRONES STACK EACH MILLION', W/2, H/2-16);
    ctx.restore();
  }
  // Wave incoming text
  if(s.waveSpawnLeft>0&&s.spawnTimer<60&&s.zombies.filter(z=>z.altitude<3).length===0){
    const alpha=Math.min(1,(60-s.spawnTimer)/30);
    ctx.save(); ctx.globalAlpha=alpha; ctx.textAlign='center';
    ctx.font='bold 48px "Bebas Neue",cursive'; ctx.fillStyle='#f0d060'; ctx.shadowColor='#000'; ctx.shadowBlur=12;
    ctx.fillText('WAVE '+s.wave,W/2,H/2-20);
    ctx.font='14px "Share Tech Mono",monospace'; ctx.fillStyle='#b8a87a';
    ctx.fillText(getForegroundSkin().tagline.toUpperCase(),W/2,H/2+10);
    ctx.restore();
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────
// Load high score, build selector
for(let i=0;i<SKINS.length;i++){ if(highScore>=SKINS[i].unlockAt) unlockedSkins.add(i); }
buildSkinSelector();
</script>
