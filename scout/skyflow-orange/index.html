<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfe6f5">
<meta name="description" content="Run a tower crane and stack crates as high as they will stand before the clock runs out.">
<title>Sky Flow</title>
<style>:root {
  --ink: #1f2a33;
  --paper: #fbfaf4;
  --yellow: #ffcc33;
  --orange: #f26a1b;
  --green: #23a35a;
  --red: #d9463a;
  --sky: #cfe6f5;
  --face: "Roboto Condensed", "Arial Narrow", "Helvetica Neue Condensed", sans-serif-condensed, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body, #root { margin: 0; height: 100%; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--face);
  font-stretch: condensed;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

.app { position: fixed; inset: 0; overflow: hidden; }
.stage { position: absolute; inset: 0; }
.stage canvas { width: 100%; height: 100%; }

/* ---------- menu ---------- */
.menu {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: max(18px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  pointer-events: none;
}
.menu-head, .menu-foot { pointer-events: auto; width: 100%; max-width: 460px; margin: 0 auto; }
.title {
  font-size: clamp(56px, 19vw, 104px);
  line-height: 0.86;
  font-weight: 800;
  letter-spacing: -0.02em;
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.7);
}
.hazard {
  height: 14px; margin: 10px 0 10px; width: min(100%, 300px);
  border: 2px solid var(--ink);
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 14px, var(--ink) 14px 28px);
}
.tagline {
  display: inline-block; font-size: 18px; line-height: 1.25; max-width: 21em; font-weight: 700;
  background: rgba(251, 250, 244, 0.9); border: 2px solid var(--ink); border-radius: 4px; padding: 6px 10px;
}

.sheet {
  background: rgba(251, 250, 244, 0.94);
  border: 2px solid var(--ink);
  border-radius: 4px;
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: 5px 5px 0 rgba(31, 42, 51, 0.85);
  max-height: 72vh; overflow-y: auto;
  touch-action: pan-y;
}
.sheet h2 { font-size: 22px; font-weight: 800; }
.sheet p { font-size: 16px; line-height: 1.4; }
.how .keys { font-size: 14px; opacity: 0.85; }
.muted { opacity: 0.75; font-size: 15px; }

.btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  width: 100%;
  padding: 12px 14px;
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 4px;
  text-align: left;
  box-shadow: 3px 3px 0 var(--ink);
  transition: transform 60ms, box-shadow 60ms;
}
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn[disabled] { opacity: 0.5; }
.btn-primary { background: var(--yellow); }
.btn-main { font-size: 24px; font-weight: 800; line-height: 1; }
.btn-sub { font-size: 15px; font-weight: 600; opacity: 0.8; }
.btn-small { padding: 10px 12px; font-size: 17px; font-weight: 700; align-items: center; text-align: center; }
.menu-row { display: flex; gap: 10px; }
.best-line { display: flex; flex-wrap: wrap; gap: 4px 16px; font-weight: 700; font-size: 15px; }
.menu-board h2 { font-size: 17px; margin-bottom: 4px; }

.board { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
.board li { display: grid; grid-template-columns: 2.2em 4em 1fr; padding: 3px 6px; font-size: 16px; font-weight: 700; }
.board li:nth-child(odd) { background: rgba(31, 42, 51, 0.06); }
.board li.is-you { background: var(--yellow); }
.board-rank { opacity: 0.6; }
.board-tag { letter-spacing: 0.12em; white-space: pre; }
.board-score { text-align: right; }

/* ---------- play HUD ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.top {
  position: absolute; left: 0; right: 0; top: 0;
  display: flex; align-items: stretch; gap: 6px;
  padding: max(8px, env(safe-area-inset-top)) 8px 0;
  pointer-events: none;
  z-index: 5;
}
.top > * { pointer-events: auto; }
.burger {
  flex: 0 0 46px; height: 46px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  background: rgba(251, 250, 244, 0.94);
  border: 2px solid var(--ink); border-radius: 4px;
  box-shadow: 2px 2px 0 var(--ink);
}
.burger span { width: 22px; height: 3px; background: var(--ink); }
.burger.is-open { background: var(--yellow); }
.plate, .wind {
  display: flex; align-items: center;
  background: rgba(251, 250, 244, 0.94);
  border: 2px solid var(--ink); border-radius: 4px;
  height: 46px;
}
.plate { flex: 1 1 auto; min-width: 0; }
.plate-cell { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 8px; border-left: 2px solid rgba(31, 42, 51, 0.18); height: 100%; }
.plate-cell:first-child { border-left: 0; }
.plate-label { font-size: 11px; font-weight: 700; opacity: 0.65; line-height: 1; }
.plate-value { font-size: 19px; font-weight: 800; line-height: 1.05; white-space: nowrap; font-variant-numeric: tabular-nums; }
.plate-time.is-low { background: var(--red); color: #fff; }
.plate-time.is-low .plate-label { opacity: 0.9; }
.wind { flex: 0 0 auto; gap: 6px; padding: 0 8px 0 5px; }
.wind-dial { position: relative; width: 32px; height: 32px; border: 2px solid var(--ink); border-radius: 50%; background: #fff; }
.wind-arrow { position: absolute; inset: 0; transition: transform 120ms linear; }
.wind-arrow::before {
  content: ""; position: absolute; left: 50%; top: 9px; width: 3px; height: 16px; margin-left: -1.5px; background: var(--red);
}
.wind-arrow::after {
  content: ""; position: absolute; left: 50%; top: 2px; margin-left: -6px;
  border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 9px solid var(--red);
}
.wind-text { display: flex; flex-direction: column; }

.gauges {
  position: absolute; left: 8px; top: calc(max(8px, env(safe-area-inset-top)) + 54px);
  margin: 0; padding: 6px 8px;
  background: rgba(251, 250, 244, 0.82);
  border: 2px solid rgba(31, 42, 51, 0.7); border-radius: 4px;
  font-size: 13px; font-weight: 700; line-height: 1.35;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.gauges div { display: flex; justify-content: space-between; gap: 10px; }
.gauges dt { opacity: 0.65; }
.gauges dd { margin: 0; min-width: 4.2em; text-align: right; }

.supply {
  position: absolute; right: 8px; top: calc(max(8px, env(safe-area-inset-top)) + 54px);
  display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
}
.supply-label {
  font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 6px;
  background: rgba(251, 250, 244, 0.82); border-radius: 3px;
}
.supply-row {
  display: grid; grid-template-columns: repeat(3, 60px);
  border: 2px solid var(--ink); border-radius: 4px; overflow: hidden;
  box-shadow: 2px 2px 0 var(--ink);
}
.supply button {
  height: 46px; padding: 0; border: 0; border-left: 2px solid var(--ink);
  background: rgba(251, 250, 244, 0.94);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 11px; font-weight: 800; line-height: 1;
}
.supply button:first-child { border-left: 0; }
.supply button.is-on { background: var(--yellow); }
.pc { display: block; height: 14px; border: 2px solid var(--ink); border-radius: 2px; position: relative; }
.pc-crate { width: 14px; background: #d9713a; }
.pc-container { width: 36px; background: repeating-linear-gradient(90deg, #2f7fb5 0 4px, #276a98 4px 6px); }
.pc-joint { width: 14px; background: #39414b; }
.pc-joint::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--yellow); }
.version { font-size: 13px; font-weight: 700; opacity: 0.6; }

.popups {
  position: absolute; left: 0; right: 0; top: 24%;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none;
}
.popup {
  padding: 5px 14px;
  font-size: 22px; font-weight: 800;
  background: #fff; border: 2px solid var(--ink); border-radius: 4px;
  box-shadow: 3px 3px 0 var(--ink);
  animation: rise 1.4s ease-out forwards;
}
.popup-perfect { background: var(--green); color: #fff; font-size: 26px; }
.popup-good { background: var(--yellow); }
.popup-bad { background: var(--red); color: #fff; }
@keyframes rise {
  0% { transform: translateY(14px) scale(0.8); opacity: 0; }
  12% { transform: translateY(0) scale(1.06); opacity: 1; }
  20% { transform: translateY(0) scale(1); }
  75% { opacity: 1; }
  100% { transform: translateY(-26px); opacity: 0; }
}
.count {
  position: absolute; left: 0; right: 0; top: 30%;
  text-align: center; pointer-events: none;
  font-size: clamp(90px, 30vw, 170px); font-weight: 800; line-height: 1;
  color: var(--ink);
  -webkit-text-stroke: 3px #fff; paint-order: stroke fill;
  text-shadow: 5px 5px 0 var(--yellow);
  animation: thump 0.5s ease-out;
}
@keyframes thump { 0% { transform: scale(1.5); opacity: 0; } 40% { transform: scale(1); opacity: 1; } }

.controls {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 0 12px max(14px, env(safe-area-inset-bottom));
  pointer-events: none;
}
.pad { display: grid; gap: 8px; pointer-events: auto; }
.pad-left { grid-template-columns: repeat(2, var(--ctl)); }
.pad-right { grid-template-columns: var(--ctl); }
.controls { --ctl: clamp(60px, 17.5vw, 78px); }
.ctl {
  width: var(--ctl); height: var(--ctl);
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, 0.9);
  border: 2px solid var(--ink); border-radius: 6px;
  font-size: 16px; font-weight: 800;
  box-shadow: 3px 3px 0 rgba(31, 42, 51, 0.85);
  touch-action: none;
}
.ctl { white-space: nowrap; }
.ctl .glyph { font-size: 30px; line-height: 1; }
.ctl.is-down { background: var(--yellow); transform: translate(3px, 3px); box-shadow: none; }
.act { background: #fff4d0; font-size: 17px; }
.act.is-off { opacity: 0.45; }
.act:active { background: var(--yellow); transform: translate(3px, 3px); box-shadow: none; }
.grab { background: #dfe9e2; font-size: 19px; }
.grab.is-ready { background: var(--green); color: #fff; }
.grab.is-carrying { background: var(--red); color: #fff; }
.grab:active { transform: translate(3px, 3px); box-shadow: none; }

.panel-wrap {
  position: absolute; inset: 0;
  background: rgba(207, 230, 245, 0.55);
  display: flex; align-items: flex-start; justify-content: flex-start;
  padding: calc(max(8px, env(safe-area-inset-top)) + 54px) 8px 8px;
  z-index: 4;
}
.panel-center { align-items: center; justify-content: center; padding: 12px; z-index: 6; }
.panel {
  width: min(280px, 100%);
  max-height: 100%; overflow-y: auto; touch-action: pan-y;
  background: var(--paper);
  border: 2px solid var(--ink); border-radius: 4px;
  box-shadow: 5px 5px 0 rgba(31, 42, 51, 0.85);
  padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.panel h2 { font-size: 22px; font-weight: 800; }
.panel h3 { font-size: 15px; font-weight: 800; margin-top: 4px; }
.slider { display: flex; flex-direction: column; font-size: 15px; font-weight: 700; }
.slider input { width: 100%; height: 30px; accent-color: var(--orange); touch-action: pan-x; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
.seg-2 { grid-template-columns: repeat(2, 1fr); }
.seg button { border: 0; border-left: 2px solid var(--ink); background: #fff; padding: 9px 2px; font-size: 14px; font-weight: 800; }
.seg button:first-child { border-left: 0; }
.seg button.is-on { background: var(--yellow); }

.result { width: min(420px, 100%); max-height: 94vh; }
.result-score { font-size: 64px; font-weight: 800; line-height: 0.95; font-variant-numeric: tabular-nums; }
.tally { width: 100%; border-collapse: collapse; font-size: 17px; }
.tally th { text-align: left; font-weight: 700; padding: 5px 0; border-top: 2px solid rgba(31, 42, 51, 0.15); }
.tally th small { display: block; font-size: 13px; font-weight: 600; opacity: 0.7; }
.tally td { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; border-top: 2px solid rgba(31, 42, 51, 0.15); vertical-align: top; padding: 5px 0; }
.post label { font-size: 15px; font-weight: 700; display: block; margin-bottom: 4px; }
.post-row { display: flex; gap: 8px; }
.post-row input {
  width: 5.2em; flex: 0 0 auto;
  font: inherit; font-size: 24px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; text-align: center;
  border: 2px solid var(--ink); border-radius: 4px; background: #fff; color: var(--ink);
  -webkit-user-select: text; user-select: text;
}
.post-note { font-size: 14px; margin-top: 6px; }
.post-ok { font-weight: 800; color: var(--green); }

@media (min-width: 760px) {
  .menu { padding-left: 6vw; }
  .menu-head, .menu-foot { margin: 0; }
  .plate { flex: 0 1 380px; }
  .top { justify-content: flex-start; }
  .wind { margin-left: auto; }
}
@media (max-width: 400px) {
  .top { gap: 4px; padding-left: 6px; padding-right: 6px; }
  .burger { flex-basis: 42px; }
  .plate-cell { padding: 0 5px; }
  .plate-value { font-size: 16px; }
  .wind { padding: 0 6px 0 4px; gap: 4px; }
  .wind-dial { width: 28px; height: 28px; }
  .wind-arrow::before { top: 8px; height: 13px; }
  .ctl { font-size: 14px; }
}
@media (max-height: 520px) {
  .controls { --ctl: 56px; }
  .title { font-size: 48px; }
  .tagline { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .popup, .count { animation-duration: 1.4s; animation-name: fadeonly; }
  @keyframes fadeonly { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
  .btn, .ctl { transition: none; }
}
</style>
</head>
