<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Conveyor Sim</title>
<style>
:root{--bg:#f4f2ea;--panel:#fffdf7;--ink:#22262b;--muted:#6b6f75;--line:#d9d4c4;--accent:#c4621d;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#view{position:fixed;inset:0;touch-action:none}
.bar{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.title{font-weight:700;letter-spacing:.5px}
.title span{color:var(--accent)}
.bar .sp{flex:1}
button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;pointer-events:auto}
button.on{border-color:var(--accent);color:var(--accent)}
button.sm{padding:3px 8px;font-size:12px}
#hint{font-size:12px;max-width:100%}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);max-height:50vh;display:flex;flex-direction:column}
#sheet.closed .body{display:none}
.tabs{flex:none;display:flex;gap:6px;padding:8px 10px;overflow-x:auto}
.tabs button{padding:5px 9px;white-space:nowrap}
.body{overflow:auto;padding:10px 12px 18px;border-top:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}
.row.tap{cursor:pointer}
.sw{width:14px;height:14px;border-radius:3px;flex:none;margin-top:3px;border:1px solid rgba(0,0,0,.15)}
.muted{color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#card{position:fixed;left:0;top:0;width:min(300px,78vw);display:none;font-size:12px;transform-origin:50% 100%;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#card b{font-size:13px}
#card button{pointer-events:auto}
#card::after{content:'';position:absolute;left:var(--ax,50%);bottom:-7px;width:12px;height:12px;margin-left:-6px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
#card .x{float:right;margin:-2px -4px 0 6px}
textarea{width:100%;min-height:120px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;color:var(--ink)}
.gap{color:#b4442c}
p{margin:0 0 10px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="view"></div>
<div class="bar">
  <div class="chip title">CONVEYOR <span>SIM</span></div>
  <div class="chip" id="hint">loading</div>
  <div class="sp"></div>
  <button id="bBuild">Build</button>
  <button id="bHome">Home</button>
  <button id="bSheet">Panel</button>
</div>
<div class="chip" id="card"></div>
<div id="sheet" class="closed">
  <div class="tabs">
    <button data-tab="stack">Stack</button>
    <button data-tab="examples" class="on">Examples</button>
    <button data-tab="machines">Machines</button>
    <button data-tab="live">Live</button>
    <button data-tab="share">Share</button>
  </div>
  <div class="body" id="body"></div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {PALETTE,MACHINES,BELT_W,DEFAULT_COLOR,PRODUCTS,machineSegs,conveyorSegs,autoRoute} from './machines.js';
import {buildSim,packetLabel} from './sim.js';
import {SAUCES,STYLES} from './packets.js';
import {PRESETS} from './presets.js';
import {STACKS,parseStack,stackToPlan,HOST_COLORS} from './stack.js';
// What each machine is in software. This leads every label; the factory picture comes second.
const PRODUCT_ROLE={wallpaper:'Gallery page',roll:'Feed',brick:'Archive or backup',receipt:'Dashboard',token:'Login or payment token'};
const typeRole=(k)=>k==='fabricator'?'Finished product':k==='gap'?'Unbuilt part':MACHINES[k].web.split('.')[0];
const typeDesc=(k)=>MACHINES[k].web.split('. ').slice(1).join('. ')||MACHINES[k].web;
const roleOf=(m)=>m.type==='fabricator'?(PRODUCT_ROLE[m.meta&&m.meta.product]||'Finished product'):typeRole(m.type);
const realName=(m)=>m.tool||roleOf(m);

const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nk=(s)=>String(s).trim().toLowerCase();
const clone=(o)=>JSON.parse(JSON.stringify(o));
const SNAP=4000,STORE='conveyor-sim-plan';

// The plan on screen, which example it came from, and what the builder is doing.
let plan=null,source='',sim=null;
const ui={build:false,sel:null,place:null,connect:null,tab:'examples'};

const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0xf4f2ea,1);
view.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,-2000,4000);
let isoSize=70;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.enableRotate=false;controls.screenSpacePanning=true;controls.minZoom=0.3;controls.maxZoom=12;
controls.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};
controls.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_PAN};
function sizeCam(){const a=innerWidth/innerHeight;camera.left=-isoSize*a/2;camera.right=isoSize*a/2;camera.top=isoSize/2;camera.bottom=-isoSize/2;camera.updateProjectionMatrix();}
// Classic isometric angle: 45 degrees around, 35.26 degrees down.
function placeCam(){const t=controls.target,d=150,el=Math.atan(1/Math.SQRT2);camera.position.set(t.x+d*Math.cos(el)*Math.SQRT1_2,t.y+d*Math.sin(el),t.z+d*Math.cos(el)*Math.SQRT1_2);camera.lookAt(t);}

const toV=(p)=>[p[0]/1000,p[2]/1000,-p[1]/1000];
const lineMat=new THREE.LineBasicMaterial({vertexColors:true});
const fillMat=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
let world=new THREE.Group();scene.add(world);
const grid=new THREE.GridHelper(400,100,0xd9d4c4,0xe9e5d8);grid.position.y=-0.02;scene.add(grid);

// A solid box in mm with the top and sides in three fixed tones of one color. Nothing is lit.
function fillBox(f,cx,cy,z0,w,d,h,rot,col){
  const c=Math.cos(rot),s=Math.sin(rot),P=(x,y,z)=>toV([cx+x*c-y*s,cy+x*s+y*c,z]);
  const x=w/2,y=d/2,z1=z0+h;
  const quad=(a,b,cc,dd,t)=>{for(const q of [a,b,cc,a,cc,dd]){f.pos.push(...q);f.col.push(col.r*t+(1-t)*0.15,col.g*t+(1-t)*0.15,col.b*t+(1-t)*0.15);}};
  quad(P(-x,-y,z1),P(x,-y,z1),P(x,y,z1),P(-x,y,z1),1);
  quad(P(-x,-y,z0),P(x,-y,z0),P(x,-y,z1),P(-x,-y,z1),0.86);
  quad(P(x,-y,z0),P(x,y,z0),P(x,y,z1),P(x,-y,z1),0.72);
  quad(P(-x,y,z0),P(-x,-y,z0),P(-x,-y,z1),P(-x,y,z1),0.72);
  quad(P(x,y,z0),P(-x,y,z0),P(-x,y,z1),P(x,y,z1),0.86);
}
const lighten=(hex,k)=>new THREE.Color(hex).lerp(new THREE.Color(0xffffff),k);
const short=(t)=>t==='turnstile'||t==='arm';
const texCache=new Map();
function label(text,at,sel){
  const col=sel?'#c4621d':'#22262b',ck=col+'|'+text;let t=texCache.get(ck);
  if(!t){
    const cv=document.createElement('canvas'),g=cv.getContext('2d'),fs=40,font=(sel?'700 ':'')+fs+'px ui-monospace,Menlo,monospace';g.font=font;
    const w=Math.ceil(g.measureText(text).width)+28;cv.width=w;cv.height=fs+24;g.font=font;
    g.fillStyle='rgba(255,253,247,0.92)';g.fillRect(0,0,w,cv.height);g.strokeStyle=col;g.lineWidth=3;g.strokeRect(1.5,1.5,w-3,cv.height-3);
    g.fillStyle=col;g.textBaseline='middle';g.fillText(text,14,cv.height/2+2);
    t=new THREE.CanvasTexture(cv);t.userData={w,h:cv.height};texCache.set(ck,t);
  }
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));
  const h=1.1;sp.scale.set(h*t.userData.w/t.userData.h,h,1);const v=toV(at);sp.position.set(v[0],v[1],v[2]);sp.renderOrder=2;return sp;
}
function drawWorld(){
  scene.remove(world);world.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.isSprite)o.material.dispose();});
  world=new THREE.Group();
  const L={pos:[],col:[]},F={pos:[],col:[]};
  const segs=(list,hex)=>{const c=new THREE.Color(hex);for(const p of list){const v=toV(p);L.pos.push(...v);L.col.push(c.r,c.g,c.b);}};
  const byName=new Map(plan.machines.map(m=>[nk(m.name),m]));
  for(const b of plan.belts){
    const A=byName.get(nk(b.from)),B=byName.get(nk(b.to));if(!A||!B)continue;
    const pts=b.pts||autoRoute(A,B);segs(conveyorSegs({pts}),PALETTE[7]);
    for(let i=0;i<pts.length-1;i++){const a=pts[i],c=pts[i+1],len=Math.hypot(c[0]-a[0],c[1]-a[1]);fillBox(F,(a[0]+c[0])/2,(a[1]+c[1])/2,a[2]-80,len+BELT_W,BELT_W,60,Math.atan2(c[1]-a[1],c[0]-a[0]),new THREE.Color(0xd8d2c2));}
  }
  // Each host colors the floor under the machines it runs.
  for(const m of plan.machines){const hi=(plan.hosts||[]).indexOf(m.host);if(hi<0)continue;const [w,d]=MACHINES[m.type].size;fillBox(F,m.at[0],m.at[1],-30,w+2400,d+2400,20,0,new THREE.Color(HOST_COLORS[hi%HOST_COLORS.length]));}
  for(const m of plan.machines){
    const [w,d,h]=MACHINES[m.type].size,col=PALETTE[m.color??DEFAULT_COLOR[m.type]],sel=ui.sel&&nk(ui.sel)===nk(m.name);
    segs(machineSegs(Object.assign({rot:0},m)),sel?'#c4621d':col);
    fillBox(F,m.at[0],m.at[1],0,w,d,short(m.type)?h*0.25:h,m.rot||0,lighten(col,0.55));
    if(sel){const x=w/2+700,y=d/2+700;segs([[m.at[0]-x,m.at[1]-y,10],[m.at[0]+x,m.at[1]-y,10],[m.at[0]+x,m.at[1]-y,10],[m.at[0]+x,m.at[1]+y,10],[m.at[0]+x,m.at[1]+y,10],[m.at[0]-x,m.at[1]+y,10],[m.at[0]-x,m.at[1]+y,10],[m.at[0]-x,m.at[1]-y,10]],'#c4621d');}
    world.add(label(realName(m),[m.at[0],m.at[1],h+1300],sel));
  }
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(L.pos,3));lg.setAttribute('color',new THREE.Float32BufferAttribute(L.col,3));world.add(new THREE.LineSegments(lg,lineMat));
  const fg=new THREE.BufferGeometry();fg.setAttribute('position',new THREE.Float32BufferAttribute(F.pos,3));fg.setAttribute('color',new THREE.Float32BufferAttribute(F.col,3));world.add(new THREE.Mesh(fg,fillMat));
  scene.add(world);
}

// Packets. One instanced box per packet body, plus a small badge on top for wrapper styles.
const MAXP=6000;
const pGeo=new THREE.BoxGeometry(1,1,1);
{const n=pGeo.attributes.position.count,c=[];for(let i=0;i<n;i++){const f=Math.floor(i/4);const t=f===2?1:(f===0||f===1)?0.72:0.86;c.push(t,t,t);}pGeo.setAttribute('color',new THREE.Float32BufferAttribute(c,3));}
const pMesh=new THREE.InstancedMesh(pGeo,new THREE.MeshBasicMaterial({vertexColors:true}),MAXP);pMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);pMesh.frustumCulled=false;
pMesh.setColorAt(0,new THREE.Color(1,1,1));scene.add(pMesh);
const sauceCol=SAUCES.map(s=>new THREE.Color(s[2])),styleCol=STYLES.map(s=>new THREE.Color(s[1]));
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_p=new THREE.Vector3(),_s=new THREE.Vector3(),_up=new THREE.Vector3(0,1,0);
let pn=0;
function put(x,y,zc,yaw,sx,sy,sz,col){if(pn>=MAXP)return;_p.set(x/1000,zc/1000,-y/1000);_q.setFromAxisAngle(_up,yaw);_s.set(sx/1000,sy/1000,sz/1000);_m.compose(_p,_q,_s);pMesh.setMatrixAt(pn,_m);pMesh.setColorAt(pn,col);pn++;}
const box=(x,y,z,yaw,L,W,T,col)=>put(x,y,z+T/2,yaw,L,T,W,col);
const standing=(x,y,z,yaw,L,H,T,col)=>put(x,y,z+H/2,yaw,L,H,T,col);
const PL=900,PW=600,PT=160;
function drawPacket(p,x,y,z,yaw){
  const c=Math.cos(yaw),s=Math.sin(yaw);
  if(p.half)box(x,y,z,yaw,PL/2,PW,PT,sauceCol[p.s]);
  else if(p.b>=0){const o=PL/4;box(x-c*o,y-s*o,z,yaw,PL/2,PW,PT,sauceCol[p.s]);box(x+c*o,y+s*o,z,yaw,PL/2,PW,PT,sauceCol[p.b]);}
  else box(x,y,z,yaw,PL,PW,PT,sauceCol[p.s]);
  if(p.st)box(x,y,z+PT,yaw,PL*0.3,PW*0.5,60,styleCol[p.st]);
}
function drawPile(at,type,list,z0){
  const [w,d]=MACHINES[type].size,cols=Math.max(1,Math.floor(w/(PL+80))),per=cols*Math.max(1,Math.floor(d/(PW+80)));
  list.forEach((p,i)=>{const k=i%per,lay=Math.floor(i/per);drawPacket(p,at[0]-w/2+(PL+80)*(k%cols+0.5),at[1]-d/2+(PW+80)*(Math.floor(k/cols)+0.5),z0+lay*(PT+20),0);});
}
// Finished products sit beside the machine that made them.
function drawProduct(m){
  const r=m.r,[w,d]=MACHINES[r.type].size,x0=r.at[0]+w/2+600,y0=r.at[1],L=m.made;
  const prod=r.type==='showroom'?'wallpaper':r.type==='register'?'token':r.type==='ticker'?'receipt':r.meta&&r.meta.product||'wallpaper';
  if(r.type==='dock'){drawPile([r.at[0]-w/2-3600,r.at[1]],r.type,L.slice(-60),0);return;}
  if(r.type==='reject'){L.forEach((p,i)=>{const a=(p.u*2.399)%6.283,rad=200+((p.u*37)%900);drawPacket(p,r.at[0]+Math.cos(a)*rad,r.at[1]+Math.sin(a)*rad,1500+Math.floor(i/6)*(PT+10),a);});return;}
  if(prod==='wallpaper'){(r.type==='showroom'?L.slice(-36):L).forEach((p,i)=>{const col=i%12,row=Math.floor(i/12)%12,y=y0-6*(PW+40)+col*(PW+40);standing(x0,y,200+row*(PL+40),Math.PI/2,PW,PL,80,sauceCol[p.s]);if(p.b>=0&&!p.half)standing(x0+10,y,200+row*(PL+40)+PL/2,Math.PI/2,PW,PL/2,80,sauceCol[p.b]);});return;}
  if(prod==='roll'){const ys=r.at[1]-d/2-900;standing(r.at[0],ys,0,0,1400,1400,300,new THREE.Color(0xe9e4d6));L.slice(-18).forEach((p,i)=>box(r.at[0],ys-400-i*(PL*0.55),0,Math.PI/2,PL*0.55,1200,30,sauceCol[p.s]));return;}
  if(prod==='brick'){L.slice(-60).forEach((p,i)=>box(x0+400,y0,i*60,0,2400,1200,60,sauceCol[p.s]));return;}
  if(prod==='token'){L.forEach((p,i)=>{const k=i%4;box(x0+400+(k%2)*900,y0+Math.floor(k/2)*900,Math.floor(i/4)*80,(i*0.7)%3,700,700,80,styleCol[p.st]||sauceCol[p.s]);});return;}
  L.slice(-40).forEach((p,i)=>standing(x0,y0,200+i*120,Math.PI/2,1200,110,40,sauceCol[p.s]));
}
function drawPackets(){
  pn=0;
  for(const b of sim.belts)for(const it of b.items){const q=sim.beltPos(b,it.d);drawPacket(it.p,q[0],q[1],q[2]+40,q[3]);}
  for(const m of sim.machines.values()){
    const h=MACHINES[m.type].size[2],top=(short(m.type)?h*0.25:h)+20;
    const show=[].concat(m.cur?[m.cur]:[],m.q,m.hold.map(x=>x.p),m.out.map(x=>x[0]));
    if(m.type!=='reject')drawPile(m.r.at,m.type,show.slice(0,80),top);
    if(m.made.length)drawProduct(m);
  }
  pMesh.count=pn;pMesh.instanceMatrix.needsUpdate=true;if(pMesh.instanceColor)pMesh.instanceColor.needsUpdate=true;
}

function loadStack(st,src){setPlan(stackToPlan(st),src);ui.tab='stack';document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='stack'));renderPanel();}
// Loading and saving plans. Your own build is kept in this browser and can be shared as a link.
function normalize(p){p=clone(p);for(const m of p.machines){m.color??=DEFAULT_COLOR[m.type];m.meta??={};}return p;}
function setPlan(p,src,warm){plan=normalize(p);source=src;ui.sel=null;ui.connect=null;ui.place=null;restart(warm??4000);home();}
function restart(warm){sim=buildSim(plan,11);for(let i=0;i<warm;i++)sim.step(0.06);drawWorld();renderPanel();renderCard();hint();}
function edited(){source='mine';try{localStorage.setItem(STORE,JSON.stringify(plan));}catch(e){}restart(60);}
function savedPlan(){try{const s=localStorage.getItem(STORE);return s?JSON.parse(s):null;}catch(e){return null;}}
const b64e=(s)=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=(s)=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function shareLink(){const p={title:plan.title||'My build',machines:plan.machines,belts:plan.belts,hosts:plan.hosts,report:plan.report};return location.origin+location.pathname+'#p='+b64e(JSON.stringify(p));}
function valid(p){return p&&Array.isArray(p.machines)&&Array.isArray(p.belts)&&p.machines.every(m=>MACHINES[m.type]&&typeof m.name==='string'&&Array.isArray(m.at));}

function home(){
  let a=Infinity,b=-Infinity,c=Infinity,d=-Infinity;
  for(const m of plan.machines){a=Math.min(a,m.at[0]);b=Math.max(b,m.at[0]);c=Math.min(c,m.at[1]);d=Math.max(d,m.at[1]);}
  if(!plan.machines.length){a=b=c=d=0;}
  // An isometric view shows a plan W by D as about 0.71 times (W + D) across, plus room for labels and products.
  const need=((b-a)+(d-c))/1000*0.72+14;
  isoSize=Math.max(30,Math.min(320,Math.max(need*0.75,need/(innerWidth/innerHeight))));
  controls.target.set((a+b)/2000,0,-(c+d)/2000);camera.zoom=1;sizeCam();placeCam();controls.update();
  grid.position.x=Math.round((a+b)/2000/4)*4;grid.position.z=Math.round(-(c+d)/2000/4)*4;
}

// Tapping. A drag pans the view, a tap selects, places or connects.
const ray=new THREE.Raycaster(),ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;down=null;
  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),camera);
  let hit=null,bd=Infinity;
  for(const m of plan.machines){const [w,d,h]=MACHINES[m.type].size,c=toV([m.at[0],m.at[1],h/2]),s=Math.max(w,d)/1000;const bx=new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(...c),new THREE.Vector3(s,h/1000,s));const pt=ray.ray.intersectBox(bx,new THREE.Vector3());if(pt){const dd=pt.distanceTo(ray.ray.origin);if(dd<bd){bd=dd;hit=m;}}}
  if(hit)return tapMachine(hit);
  const g=ray.ray.intersectPlane(ground,new THREE.Vector3());
  if(g&&ui.build&&ui.place)return placeAt(Math.round(g.x*1000/SNAP)*SNAP,Math.round(-g.z*1000/SNAP)*SNAP);
  ui.sel=null;ui.connect=null;drawWorld();renderCard();hint();
});
function tapMachine(m){
  if(ui.build&&ui.connect){
    const from=ui.connect.from;
    if(nk(from)===nk(m.name)){ui.connect=null;hint();return;}
    plan.belts.push({from,to:m.name,out:ui.connect.out});ui.connect=null;ui.sel=from;edited();return;
  }
  ui.sel=m.name;ui.place=null;drawWorld();renderCard();hint();
}
function uniqueName(base){let n=1,name=base;while(plan.machines.some(m=>nk(m.name)===nk(name)))name=base+' '+(++n);return name;}
function placeAt(x,y){
  const M=MACHINES[ui.place];

  const m={type:ui.place,name:uniqueName(M.name),at:[x,y,0],color:DEFAULT_COLOR[ui.place],meta:ui.place==='fabricator'?{product:'wallpaper'}:ui.place==='sorter'?{by:'combo'}:{}};

// Which outputs a machine offers, so a new belt can say which one it carries.

const OUTNAME={'*':'main','a':'left halves','b':'right halves','reject':'rejects','miss':'misses','combo':'50/50 packets','whole':'whole packets','half':'loose halves'};

// The card floats above the tapped machine and grows or shrinks with the view's zoom.
const _cv=new THREE.Vector3();
function placeCard(){
  const m=ui.sel&&plan.machines.find(x=>nk(x.name)===nk(ui.sel));
  if(!m||card.style.display==='none')return;
  const h=MACHINES[m.type].size[2];
  _cv.set(...toV([m.at[0],m.at[1],h+2600])).project(camera);
  const sx=(_cv.x+1)/2*innerWidth,sy=(1-_cv.y)/2*innerHeight;
  // Follows zoom, but never grows past a readable size or past 90 percent of the screen width or 30 percent of its height.
  const k=Math.max(0.35,Math.min(1.15,camera.zoom,innerWidth*0.9/card.offsetWidth,innerHeight*0.3/card.offsetHeight));
  // Keep the card on screen; the arrow slides so it still points at the machine.
  const vw=card.offsetWidth*k,cx=Math.max(4+vw/2,Math.min(innerWidth-4-vw/2,sx));
  card.style.setProperty('--ax',Math.max(14,Math.min(card.offsetWidth-14,card.offsetWidth/2+(sx-cx)/k)).toFixed(1)+'px');
  card.style.transform=`translate(${(cx-card.offsetWidth/2).toFixed(1)}px,${(sy-card.offsetHeight-8).toFixed(1)}px) scale(${k.toFixed(3)})`;
  card.style.visibility=(sx<-200||sx>innerWidth+200||sy<-40||sy>innerHeight+400)?'hidden':'visible';
}

    // RED PHONE: flag badge and "Who made this?" both toggle the panel.

    function toggle() {
      var nowOpen = seal.classList.toggle("open");
      ask.setAttribute("aria-expanded", nowOpen ? "true" : "false");
    }
    ask.addEventListener("click", toggle);
    flagBtn.addEventListener("click", toggle);
    seal.querySelector(".mtg-seal-btn").addEventListener("click", toggle);
