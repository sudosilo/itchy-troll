<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HOPPER</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff7fb;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// GREEN PHONE EDIT: HOPPER v6, endless side scroller with templated kinetic obstacles, zones, combos
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
const VH=540,GROUND=460;
let S=1,VW=960,viewH=540;
function resize(){const d=Math.min(window.devicePixelRatio||1,1.5);cv.width=innerWidth*d;cv.height=innerHeight*d;S=Math.min(cv.height/VH,cv.width/720);VW=cv.width/S;viewH=cv.height/S;}
addEventListener('resize',resize);resize();
// GREEN PHONE EDIT: on tall phone screens the ground sits at 70 percent height instead of the very bottom
const yOffNow=()=>Math.max(0,Math.min(viewH-VH,viewH*.7-GROUND));
const visBottom=()=>camY-yOffNow()+viewH+40;

// GREEN PHONE EDIT: tuning knobs, change feel here
const T={gravity:2300,jumpV:780,holdGrav:0.45,maxHold:0.45,cutMul:0.5,cruise:200,maxSpeed:640,accel:520,decel:260,wallSlide:140,wallJumpV:740,wallKick:520,kickDecay:7,coyote:0.1,buffer:0.13,hitKick:520,hitUp:520,invuln:0.9};

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=i=>{const s=Math.sin(i*12.9898)*43758.5453;return s-Math.floor(s);};

let camX=0,camY=0,shakeA=0,flashA=0,time=0,started=false,stars=0,bonks=0,best=0,dist=0,pts=0,pieceCount=0,genX=0,lastT='';
let comboN=0,comboT=0,zoneN=0,banner=null,nextMile=500,skyHue=330;
try{best=+localStorage.getItem('hopper_best')||0}catch(e){}
const parts=[],pops=[],pieces=[];

// GREEN PHONE EDIT: ZONE REGISTRY. Each zone swaps sky color and background art. Add more here.
const THEMES=[
 {name:'CANDY HILLS',hue:330,bg:'hills'},
 {name:'BUBBLE BAY',hue:185,bg:'bubbles'},
 {name:'CONFETTI CITY',hue:265,bg:'city'},
 {name:'CLOUD CASTLE',hue:45,bg:'clouds'},
 {name:'LIME LAGOON',hue:110,bg:'hills'}
];
const ZONE_LEN=12000;
const themeAt=x=>THEMES[Math.floor(Math.max(0,x)/ZONE_LEN)%THEMES.length];

// GREEN PHONE EDIT: input, left half = throttle, right half = hop
const ptrs=new Map();let leftHeld=false,rightHeld=false,keyL=false,keyR=false;
function recompute(){let l=false,r=false;for(const s of ptrs.values()){if(s==='L')l=true;else r=true;}leftHeld=l||keyL;const was=rightHeld;rightHeld=r||keyR;if(rightHeld&&!was&&started)P.buffer=T.buffer;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,e.clientX<innerWidth/2?'L':'R');wake();recompute();});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>{ptrs.delete(e.pointerId);recompute();}));
addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='ArrowRight'||e.code==='KeyD')keyL=true;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){keyR=true;e.preventDefault();}wake();recompute();});
addEventListener('keyup',e=>{if(e.code==='ArrowRight'||e.code==='KeyD')keyL=false;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keyR=false;recompute();});
addEventListener('contextmenu',e=>e.preventDefault());
function wake(){if(!started){started=true;sfx('star');}}

// GREEN PHONE EDIT: tiny synth sounds
let AC=null;
function sfx(type){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime;let f0=440,f1=880,d=.12,w='square',v=.05;
switch(type){case'jump':f0=300;f1=700;d=.14;break;case'wall':f0=500;f1=1100;d=.12;w='sawtooth';v=.04;break;case'star':f0=900;f1=1600;d=.1;w='triangle';v=.08;break;case'hit':f0=220;f1=60;d=.25;w='sawtooth';v=.07;break;case'land':f0=160;f1=90;d=.08;w='triangle';v=.07;break;case'thud':f0=90;f1=40;d=.18;w='sine';v=.12;break;case'whoosh':f0=200;f1=1200;d=.5;w='triangle';v=.06;break;case'sky':f0=1200;f1=300;d=.35;w='sine';v=.06;break;
case'boing':f0=180;f1=900;d=.3;w='sine';v=.12;break;case'boost':f0=400;f1=1800;d=.3;w='sawtooth';v=.04;break;case'bump':f0=700;f1=350;d=.12;w='square';v=.05;break;case'fire':f0=140;f1=50;d=.15;w='square';v=.06;break;case'laser':f0=1500;f1=1400;d=.12;w='sawtooth';v=.025;break;case'zone':f0=500;f1=2000;d=.6;w='triangle';v=.08;break;case'crack':f0=300;f1=100;d=.1;w='square';v=.04;break;}
o.type=w;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}

// GREEN PHONE EDIT: player
const P={x:120,y:GROUND-40,w:40,h:40,vx:0,vy:0,speed:T.cruise,kick:0,grounded:true,ground:null,coyote:0,buffer:0,hold:0,holding:false,wall:0,touchWall:false,inv:0,squash:0,sqv:0,tube:null,wallJumps:0,boostCd:0,wallL:0,inShaft:false,wing:null,wingT:0,launchCd:0};

// GREEN PHONE EDIT: helpers for building pieces
function mk(x,w,o){return Object.assign({x,w,solids:[],ramps:[],rings:[],hazards:[],portals:[],stars:[],zones:[],bumpers:[],t:0,update(p,dt){p.t+=dt;},draw(){}},o);}
function floor(x,w,y){y=y==null?GROUND:y;return{x,y,w,h:600+GROUND-y,kind:'floor'};}
function surf(r,x){return r.y0+(r.y1-r.y0)*(x-r.x)/r.w;}
function star(x,y){return{x,y,got:false,ph:Math.random()*6};}
function starLine(x0,x1,y,n){const a=[];for(let i=0;i<n;i++)a.push(star(n<2?(x0+x1)/2:x0+(x1-x0)*i/(n-1),y));return a;}
function starArc(x0,x1,y,h,n){const a=[];for(let i=0;i<n;i++){const t=n<2?.5:i/(n-1);a.push(star(x0+(x1-x0)*t,y-Math.sin(Math.PI*t)*h));}return a;}
// GREEN PHONE EDIT: v4 sky stretch builder, reused by every flying section
function skyRun(x,len,y0,d){const rings=[],zones=[],solids=[],stars=[],y1=GROUND-140,n=Math.floor(len/230),up=y=>GROUND-(GROUND-y)*2; // GREEN PHONE EDIT: flight path sits twice as high
 for(let i=1;i<n;i++){const t=i/n;rings.push({x:x+i*230,y:up(y0+(y1-y0)*t+Math.sin(t*7)*110),r:36,got:false,ph:Math.random()*6});}
 const nu=1+Math.floor(len/1100);for(let i=0;i<nu;i++){const ux=x+len*(i+.6)/(nu+.2),py=up(y0+(y1-y0)*((ux-x)/len));zones.push({type:'wind',x:ux,y:py-260,w:130,h:520,force:2700,updraft:true});}
 if(Math.random()<.85){const ix=x+len*rand(.3,.7),iy=up(y0+(y1-y0)*((ix-x)/len))+130;solids.push({x:ix,y:iy,w:150,h:26,kind:'island',keepWing:true});stars.push(...starLine(ix+20,ix+130,iy-40,3));}
 return{rings,zones,solids,stars};}
function onScreen(x){return x>camX-100&&x<camX+VW+100;}

// GREEN PHONE EDIT: TEMPLATE REGISTRY. Every obstacle lives here.
// To add a new kinetic component: add a key with weight(d) and build(x,d), d is difficulty 0 to 1.
// build returns mk(x,width,{solids,hazards,portals,zones,bumpers,stars,update,draw}).
// solids: you stand on them and wall jump off them. Give a moving solid dx and dy each update and riders get carried.
//   solid flags: bounce (spring launch), conveyor (belt speed), crumble (falls after you land).
// hazards: circle, rect, seg. They bonk you. Set off:true to disable one.
// ramps: {x,w,y0,y1} slopes you run up or down, keep them gentle (rise under 0.7 of width).
// zones: wind (lifts you), boost (rockets you forward), shaft (stronger wall kicks for climbing),
//   wing (hands you a glider or parachute), launch (blasts you into the sky). rings: fly through for points.
// skyRun(x,len,y0,d) builds a whole flying stretch: rings, updrafts, floating islands. bumpers: pinball bounce, no damage, points.
const TEMPLATES={
 flat:{weight:d=>1,build(x,d){const w=rand(260,420);return mk(x,w,{solids:[floor(x,w)],stars:starLine(x+60,x+w-60,GROUND-60,3)});}},

 pit:{weight:d=>1.1,build(x,d){const a=rand(120,200),gap=rand(110,160+d*100),b=rand(130,200);return mk(x,a+gap+b,{solids:[floor(x,a),floor(x+a+gap,b)],stars:starArc(x+a-20,x+a+gap+20,GROUND-110,90,4)});}},

 tallWall:{weight:d=>1,build(x,d){const pre=rand(160,240),ww=rand(64,110),hh=rand(170,240+d*140),post=rand(180,260),w=pre+ww+post;
  return mk(x,w,{solids:[floor(x,w),{x:x+pre,y:GROUND-hh,w:ww,h:hh,kind:'wall',eyes:true}],stars:[star(x+pre+ww/2,GROUND-hh-60)]});}},

 staircase:{weight:d=>.7,build(x,d){const n=3+Math.floor(Math.random()*2),sw=80,pre=120,post=200,w=pre+n*sw+post;const solids=[floor(x,w)],st=[];
  for(let i=0;i<n;i++){const h=70+i*(60+d*25);solids.push({x:x+pre+i*sw,y:GROUND-h,w:sw,h,kind:'step'});st.push(star(x+pre+i*sw+sw/2,GROUND-h-40));}
  return mk(x,w,{solids,stars:st});}},

 spinner:{weight:d=>.5+d,build(x,d){const w=rand(360,440),cx=x+w/2,cy=GROUND-95,L=100,sp=(1.3+d*1.5)*(Math.random()<.5?1:-1),a0=Math.random()*6;
  const hz={type:'seg',x1:0,y1:0,x2:0,y2:0,r:10};
  return mk(x,w,{solids:[floor(x,w)],hazards:[hz],stars:[star(cx,cy-150)],
   update(p,dt){p.t+=dt;const a=a0+p.t*sp,c=Math.cos(a)*L,s=Math.sin(a)*L;hz.x1=cx-c;hz.y1=cy-s;hz.x2=cx+c;hz.y2=cy+s;},
   draw(p){g.fillStyle='#b9a3ff';g.fillRect(cx-6,cy,12,GROUND-cy);g.lineCap='round';g.lineWidth=22;g.strokeStyle='#ff4fa3';g.beginPath();g.moveTo(hz.x1,hz.y1);g.lineTo(hz.x2,hz.y2);g.stroke();
    g.lineWidth=8;g.strokeStyle='#ffe14f';g.setLineDash([10,10]);g.lineDashOffset=-p.t*120;g.stroke();g.setLineDash([]);
    g.fillStyle='#7a5cff';circle(cx,cy,16);g.fillStyle='#fff';circle(cx,cy,6);}});}},

 stomper:{weight:d=>.4+d,build(x,d){const w=rand(320,400),bw=96,bh=130,bx=x+w/2-bw/2,top=40,per=Math.max(1.3,rand(1.9,2.4)-d*.6),off=Math.random()*per;
  const hz={type:'rect',x:bx,y:top-bh,w:bw,h:bh};let prev=top;
  return mk(x,w,{solids:[floor(x,w)],hazards:[hz],stars:[star(bx+bw/2,GROUND-50)],
   update(p,dt){p.t+=dt;const ph=((p.t+off)%per)/per;let by;
    if(ph<.5)by=top;else if(ph<.58){const k=(ph-.5)/.08;by=top+(GROUND-top)*k*k;}else if(ph<.75)by=GROUND;else by=GROUND-(GROUND-top)*((ph-.75)/.25);
    if(prev<GROUND&&by>=GROUND&&onScreen(bx)){shake(4);burst(bx+bw/2,GROUND,16,30,200,'dust');sfx('thud');}prev=by;hz.y=by-bh;},
   draw(p){const near=(hz.y+bh-top)/(GROUND-top);g.fillStyle=`rgba(120,60,160,${.1+near*.25})`;g.beginPath();g.ellipse(bx+bw/2,GROUND+2,bw*(.3+near*.3),6,0,0,Math.PI*2);g.fill();
    g.strokeStyle='#9aa3b5';g.lineWidth=6;g.setLineDash([8,6]);g.beginPath();g.moveTo(bx+bw/2,hz.y-600);g.lineTo(bx+bw/2,hz.y);g.stroke();g.setLineDash([]);
    const gr=g.createLinearGradient(0,hz.y,0,hz.y+bh);gr.addColorStop(0,'#ffb13d');gr.addColorStop(1,'#ff3d5a');g.fillStyle=gr;rr(hz.x,hz.y,bw,bh,10);g.fill();
    g.save();rr(hz.x,hz.y,bw,bh,10);g.clip();g.fillStyle='#ffe14f';for(let i=-2;i<8;i++){g.beginPath();g.moveTo(bx+i*20,hz.y+bh);g.lineTo(bx+i*20+10,hz.y+bh);g.lineTo(bx+i*20+28,hz.y+bh-18);g.lineTo(bx+i*20+18,hz.y+bh-18);g.fill();}g.restore();
    angryFace(bx+bw/2,hz.y+45,bw);}});}},

 roller:{weight:d=>.4+d*.8,build(x,d){const w=rand(420,560),r=24,sp=rand(140,220+d*120);const hz={type:'circle',x:x+w-40,y:GROUND-r,r:r-3};let rot=0;
  return mk(x,w,{solids:[floor(x,w)],hazards:[hz],stars:starArc(x+w*.3,x+w*.6,GROUND-80,60,3),
   update(p,dt){p.t+=dt;hz.x-=sp*dt;rot-=sp*dt/r;if(hz.x<x+30)hz.x=x+w-30;},
   draw(p){const a=Math.min(1,(hz.x-x-30)/60,(x+w-30-hz.x)/60+.15);g.save();g.globalAlpha=clamp(a,0,1);g.translate(hz.x,hz.y);g.rotate(rot);
    g.fillStyle='#3dd68c';circle(0,0,r);g.strokeStyle='#fff';g.lineWidth=5;g.beginPath();g.moveTo(-r+4,0);g.lineTo(r-4,0);g.moveTo(0,-r+4);g.lineTo(0,r-4);g.stroke();
    g.fillStyle='#ffe14f';circle(0,0,7);g.restore();}});}},

 bobPlat:{weight:d=>.6,build(x,d){const a=rand(120,180),gap=rand(300,370),b=rand(140,200),pw=120,px=x+a+gap/2-pw/2,amp=70,mid=GROUND-110,sp=rand(1.2,2);
  const plat={x:px,y:mid,w:pw,h:22,kind:'plat',dx:0,dy:0};
  return mk(x,a+gap+b,{solids:[floor(x,a),plat,floor(x+a+gap,b)],stars:[star(px+pw/2,mid-90)],update(p,dt){p.t+=dt;const ny=mid+Math.sin(p.t*sp)*amp;plat.dy=ny-plat.y;plat.y=ny;}});}},

 // GREEN PHONE EDIT: the maze turnaround. Hop into the hole on top, loop around inside, shoot out the far side.
 chute:{weight:d=>.5,build(x,d){const w=540,th=220+d*50,tx=x+180,lipL=40,hole=92,lipR=50,tw=lipL+hole+lipR,top=GROUND-th,hx=tx+lipL;
  const portal={x:hx+6,y:top,w:hole-12,h:th,path:[[hx+hole/2-20,top+20],[hx+hole/2-20,GROUND-120],[tx+4,GROUND-150],[tx+4,GROUND-60],[hx+hole/2,GROUND-44],[tx+tw+30,GROUND-40]]};
  return mk(x,w,{solids:[floor(x,w),{x:x+80,y:GROUND-100,w:100,h:100,kind:'step'},{x:tx,y:top,w:lipL,h:th,kind:'hidden'},{x:hx+hole,y:top,w:lipR,h:th,kind:'hidden'}],portals:[portal],stars:[star(hx+hole/2,top-80)],
   draw(p){const gr=g.createLinearGradient(0,top,0,GROUND);gr.addColorStop(0,'#3dd6ff');gr.addColorStop(1,'#3d7dff');g.fillStyle=gr;rr(tx,top,tw,th+4,12);g.fill();
    g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=3;for(let yy=top+26;yy<GROUND;yy+=26){g.beginPath();g.moveTo(tx+6,yy);g.lineTo(tx+tw-6,yy);g.stroke();}
    g.save();g.beginPath();g.rect(hx,top,hole,th);g.clip();g.fillStyle='#fff6c9';g.fillRect(hx,top,hole,th);
    for(let i=0;i<9;i++){g.fillStyle=`hsla(${(i*40+p.t*200)%360},100%,65%,.85)`;const yy=top+((i*34+p.t*160)%(th+40))-20;g.beginPath();g.ellipse(hx+hole/2,yy,hole/2-6,9,0,0,Math.PI*2);g.fill();}g.restore();
    const ay=top-30+Math.sin(p.t*6)*6;g.fillStyle='#ff4fa3';g.beginPath();g.moveTo(hx+hole/2-16,ay-10);g.lineTo(hx+hole/2+16,ay-10);g.lineTo(hx+hole/2,ay+10);g.fill();
    if(P.tube&&P.tube.portal===portal){g.strokeStyle=`hsl(${(time*400)%360},100%,60%)`;g.lineWidth=6;g.setLineDash([12,8]);g.lineDashOffset=-time*200;g.beginPath();portal.path.forEach((q,i)=>{const X=q[0]+20,Y=q[1]+20;i?g.lineTo(X,Y):g.moveTo(X,Y);});g.stroke();g.setLineDash([]);}}});}},

 // GREEN PHONE EDIT: v2 additions start here
 spring:{weight:d=>.8,build(x,d){const pre=rand(150,210),sw=60,gp=rand(90,130),ww=rand(70,100),hh=rand(280,350),post=220,w=pre+sw+gp+ww+post;
  const sp={x:x+pre,y:GROUND-14,w:sw,h:14,kind:'spring',bounce:1350,squish:0};
  const st=[];for(let i=1;i<=4;i++)st.push(star(x+pre+sw/2,GROUND-60-i*80));st.push(star(x+pre+sw+gp+ww/2,GROUND-hh-50));
  return mk(x,w,{solids:[floor(x,w),sp,{x:x+pre+sw+gp,y:GROUND-hh,w:ww,h:hh,kind:'wall',eyes:true}],stars:st,update(p,dt){p.t+=dt;sp.squish*=Math.exp(-8*dt);}});}},

 boostGap:{weight:d=>.7,build(x,d){const a=rand(280,340),gap=rand(300,370+d*80),b=rand(170,230);const z={type:'boost',x:x+a-160,y:GROUND-40,w:110,h:40};
  return mk(x,a+gap+b,{solids:[floor(x,a),floor(x+a+gap,b)],zones:[z],stars:starArc(x+a,x+a+gap,GROUND-130,130,5),
   draw(p){for(let i=0;i<3;i++){const k=((time*3-i*.33)%1+1)%1;g.fillStyle=`hsla(${(time*300+i*60)%360},100%,60%,${.5+k*.5})`;const ax=z.x+10+i*34;g.beginPath();g.moveTo(ax,GROUND-2);g.lineTo(ax+18,GROUND-2);g.lineTo(ax+34,GROUND-14);g.lineTo(ax+18,GROUND-26);g.lineTo(ax,GROUND-26);g.lineTo(ax+16,GROUND-14);g.fill();}}});}},

 fanPit:{weight:d=>.6,build(x,d){const a=rand(140,200),gap=rand(300,380),b=rand(150,210),fx=x+a+gap/2;
  const z={type:'wind',x:x+a+20,y:GROUND-280,w:gap-40,h:VH+400,force:2900};
  return mk(x,a+gap+b,{solids:[floor(x,a),floor(x+a+gap,b)],zones:[z],stars:starLine(fx-60,fx+60,GROUND-230,3),
   draw(p){g.save();g.beginPath();g.rect(z.x,z.y-60,z.w,VH);g.clip();for(let i=0;i<14;i++){const sx=z.x+hash(i)*z.w,yy=VH-((p.t*260*(1+hash(i+9))+i*57)%(VH-z.y+80));g.strokeStyle=`rgba(255,255,255,${.35+hash(i+3)*.4})`;g.lineWidth=3;g.beginPath();g.moveTo(sx,yy);g.lineTo(sx,yy+30);g.stroke();}g.restore();
    g.save();g.translate(fx,VH-12);g.fillStyle='#9fd8ff';rr(-70,-8,140,30,10);g.fill();g.rotate(p.t*14);g.fillStyle='#fff';for(let i=0;i<4;i++){g.rotate(Math.PI/2);g.beginPath();g.ellipse(0,-22,9,22,0,0,Math.PI*2);g.fill();}g.restore();}});}},

 conveyor:{weight:d=>.6,build(x,d){const a=rand(100,150),cw=rand(320,440),b=rand(120,180);const c={x:x+a,y:GROUND,w:cw,h:600,kind:'conveyor',conveyor:-(120+d*130)};
  return mk(x,a+cw+b,{solids:[floor(x,a),c,floor(x+a+cw,b)],stars:starLine(x+a+40,x+a+cw-40,GROUND-60,4)});}},

 bumperField:{weight:d=>.7,build(x,d){const w=rand(480,600),n=3+Math.floor(Math.random()*2),bs=[];
  for(let i=0;i<n;i++){const y=GROUND-rand(70,240);bs.push({x:x+90+i*(w-180)/(n-1),y,by:y,r:rand(22,30),ph:Math.random()*6,amp:rand(0,45),cd:0,flash:0,hue:Math.floor(Math.random()*360)});}
  return mk(x,w,{solids:[floor(x,w)],bumpers:bs,stars:starLine(x+60,x+w-60,GROUND-300,4),
   update(p,dt){p.t+=dt;for(const b of bs){b.y=b.by+Math.sin(p.t*2+b.ph)*b.amp;b.flash*=Math.exp(-6*dt);b.cd-=dt;}},
   draw(p){for(const b of bs){const r=b.r*(1+b.flash*.3);g.fillStyle=`hsl(${b.hue},95%,62%)`;circle(b.x,b.y,r);g.strokeStyle='#fff';g.lineWidth=5;g.beginPath();g.arc(b.x,b.y,r*.62,0,Math.PI*2);g.stroke();g.fillStyle=b.flash>.1?'#fff':`hsl(${b.hue+60},100%,75%)`;circle(b.x,b.y,r*.35);
    g.strokeStyle=`hsla(${b.hue},100%,70%,${b.flash})`;g.lineWidth=4;g.beginPath();g.arc(b.x,b.y,r+12*(1-b.flash)+4,0,Math.PI*2);g.stroke();}}});}},

function ov(a,s){return a.x<s.x+s.w&&a.x+a.w>s.x&&a.y<s.y+s.h&&a.y+a.h>s.y;}

function drawWing(type,cx,top,sc){g.save();g.translate(cx,top);g.scale(sc,sc);g.strokeStyle='rgba(90,70,140,.7)';g.lineWidth=1.5;
 if(type==='glider'){g.beginPath();g.moveTo(-4,0);g.lineTo(-30,-18);g.moveTo(4,0);g.lineTo(34,-22);g.stroke();const gr=g.createLinearGradient(-46,0,50,0);for(let i=0;i<6;i++)gr.addColorStop(i/5,`hsl(${(i*60+time*120)%360},100%,62%)`);
  g.fillStyle=gr;g.beginPath();g.moveTo(-48,-14);g.quadraticCurveTo(0,-44,52,-22);g.lineTo(0,-30);g.closePath();g.fill();g.strokeStyle='#fff';g.lineWidth=2.5;g.stroke();}
 else{g.beginPath();g.moveTo(-6,0);g.lineTo(-40,-50);g.moveTo(6,0);g.lineTo(40,-50);g.moveTo(0,0);g.lineTo(0,-56);g.stroke();for(let i=0;i<6;i++){g.fillStyle=i%2?'#fff':`hsl(${(i*60+time*60)%360},95%,65%)`;g.beginPath();g.moveTo(0,-54);g.arc(0,-54,46,Math.PI+i*Math.PI/6,Math.PI+(i+1)*Math.PI/6);g.closePath();g.fill();}
  g.strokeStyle='#fff';g.lineWidth=2.5;g.beginPath();g.arc(0,-54,46,Math.PI,0);g.stroke();}
 g.restore();}
function drawRing(r){if(r.got)return;const y=r.y+Math.sin(time*2+r.ph)*6,hu=(time*200+r.ph*60)%360;g.save();g.translate(r.x,y);g.lineWidth=12;g.strokeStyle=`hsla(${hu},100%,62%,.35)`;g.beginPath();g.ellipse(0,0,16,r.r+4,0,0,Math.PI*2);g.stroke();
 g.lineWidth=7;g.strokeStyle=`hsl(${hu},100%,60%)`;g.beginPath();g.ellipse(0,0,13,r.r,0,0,Math.PI*2);g.stroke();g.lineWidth=2;g.strokeStyle='#fff';g.stroke();g.restore();}
function drawUpdraft(z){g.fillStyle='rgba(150,220,255,.16)';rr(z.x,z.y,z.w,z.h,20);g.fill();g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=3;
 for(let i=0;i<8;i++){const xx=z.x+15+hash(i+z.x)*(z.w-30),yy=z.y+z.h-((time*220*(1+hash(i)*.6)+i*70)%z.h);g.beginPath();g.moveTo(xx,yy);g.quadraticCurveTo(xx+10*Math.sin(time*6+i),yy-18,xx,yy-34);g.stroke();}}
function drawStar(st){const y=st.y+Math.sin(time*4+st.ph)*5,r=13,rot=time*2+st.ph;g.save();g.translate(st.x,y);g.rotate(rot);g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,rr2=i%2?r*.45:r;g.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);}g.closePath();g.fillStyle='#ffd000';g.fill();g.lineWidth=3;g.strokeStyle='#fff';g.stroke();g.restore();}

// GREEN PHONE EDIT: SKIN REGISTRY. Swap the sprite by adding a skin and setting skin='name'.
const SKINS={
 jelly:{draw(cx,by,sx,sy,t,hue){const hw=22*sx,hh=22*sy,cy=by-hh,N=40;g.beginPath();
  for(let i=0;i<=N;i++){const a=i/N*Math.PI*2,c=Math.cos(a),s=Math.sin(a),r=1/Math.pow(Math.abs(c)**4+Math.abs(s)**4,.25),wob=1+.05*Math.sin(a*3+t*9)+.035*Math.sin(a*5-t*7),x=cx+c*r*hw*wob*.92,y=cy+s*r*hh*wob*.92;i?g.lineTo(x,y):g.moveTo(x,y);}
  g.closePath();const gr=g.createLinearGradient(cx-hw,cy-hh,cx+hw,cy+hh);gr.addColorStop(0,`hsl(${hue},100%,62%)`);gr.addColorStop(1,`hsl(${hue+70},100%,58%)`);g.fillStyle=gr;g.fill();
  g.shadowBlur=0;g.lineWidth=4;g.strokeStyle='#fff';g.stroke();
  g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.ellipse(cx-hw*.45,cy-hh*.5,hw*.22,hh*.13,-.5,0,Math.PI*2);g.fill();
  const lx=clamp(P.vx/600,-1,1)*2.5,ly=clamp(P.vy/800,-1,1)*2.5,blink=(t%3.2)<.12,ey=cy-4*sy;
  for(const ex of[cx-3,cx+11]){if(blink){g.strokeStyle='#2a1640';g.lineWidth=2.5;g.beginPath();g.moveTo(ex-4,ey);g.lineTo(ex+4,ey);g.stroke();}else{g.fillStyle='#fff';circle(ex,ey,5.5);g.fillStyle='#2a1640';circle(ex+lx,ey+ly,2.8);}}
  g.fillStyle='rgba(255,90,150,.55)';circle(cx-8,ey+8,3.5);circle(cx+17,ey+8,3.5);
  g.strokeStyle='#2a1640';g.lineWidth=2.5;g.beginPath();if(P.inv>0){g.fillStyle='#2a1640';circle(cx+5,ey+11,3.5);}else{g.arc(cx+5,ey+6,5,.2,Math.PI-.2);g.stroke();}}}
};
let skin='jelly';

function drawPlayer(){const st=clamp(-P.vy/3000,-.22,.22),sy=clamp(1-P.squash+st,.55,1.5),sx=1/sy,sf=(P.speed-T.cruise)/(T.maxSpeed-T.cruise),hue=(time*90)%360;
 g.save();if(P.inv>0&&Math.floor(time*20)%2===0)g.globalAlpha=.35;g.shadowColor=`hsl(${hue},100%,60%)`;g.shadowBlur=P.tube?30:6+sf*24;
 if(P.wing&&!P.grounded&&P.vy>0)drawWing(P.wing,P.x+P.w/2,P.y-2,1);
 SKINS[skin].draw(P.x+P.w/2,P.y+P.h,sx,sy,time,hue);g.restore();}

// GREEN PHONE EDIT: BACKGROUND REGISTRY, one painter per zone style
const BGS={
 hills(h,yOff){for(let L=0;L<2;L++){const f=.2+L*.25;g.fillStyle=`hsl(${(h+120+L*40)%360},70%,${82-L*6}%)`;g.beginPath();g.moveTo(0,viewH);for(let x=0;x<=VW+20;x+=20){const w=x+camX*f;g.lineTo(x,yOff+330+L*50-(Math.sin(w*.006+L)*40+Math.sin(w*.013)*20)-camY*f*.3);}g.lineTo(VW,viewH);g.fill();}},
 bubbles(h,yOff){g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=3;for(let i=0;i<16;i++){const x=((i*137-camX*.15)%(VW+100)+VW+100)%(VW+100)-50+Math.sin(time*2+i)*10,y=viewH-((time*30*(1+i%3)+i*91)%(viewH+60))+30;g.beginPath();g.arc(x,y,6+hash(i)*14,0,Math.PI*2);g.stroke();}
  for(let L=0;L<2;L++){const f=.2+L*.25;g.fillStyle=`hsl(${(h+L*20)%360},75%,${80-L*6}%)`;g.beginPath();g.moveTo(0,viewH);for(let x=0;x<=VW+20;x+=20){const w=x+camX*f;g.lineTo(x,yOff+360+L*45-Math.sin(w*.02+time*(1+L))*10-camY*f*.3);}g.lineTo(VW,viewH);g.fill();}},
 city(h,yOff){for(let L=0;L<2;L++){const f=.18+L*.2,bw=70-L*10,base=yOff+VH-60+L*20-camY*f*.3,i0=Math.floor((camX*f)/bw)-1;for(let i=i0;i<i0+VW/bw+3;i++){const bh=90+hash(i+L*99)*(170-L*40),x=i*bw-camX*f;
  g.fillStyle=`hsl(${(h+hash(i)*80)%360},65%,${84-L*7}%)`;g.fillRect(x,base-bh,bw-6,bh+200);g.fillStyle='rgba(255,255,255,.75)';for(let wy=base-bh+12;wy<base-10;wy+=22)for(let wx=x+8;wx<x+bw-16;wx+=16)if(hash(wx*.1+wy)>.35)g.fillRect(wx,wy,8,10);}}
  for(let i=0;i<20;i++){const x=(hash(i)*VW+time*20*(i%3+1))%VW,y=(hash(i+5)*viewH*.6+time*40*(1+i%2))%viewH;g.fillStyle=`hsl(${i*47},90%,65%)`;g.save();g.translate(x,y);g.rotate(time*3+i);g.fillRect(-4,-2,8,4);g.restore();}},
 clouds(h,yOff){for(let i=0;i<6;i++){const x=((i*190-camX*.12)%(VW+200)+VW+200)%(VW+200)-100,y=viewH-((time*25+i*120)%(viewH+120))+60;g.strokeStyle='rgba(120,100,160,.4)';g.lineWidth=1.5;g.beginPath();g.moveTo(x,y+22);g.lineTo(x+Math.sin(time*2+i)*6,y+60);g.stroke();g.fillStyle=`hsl(${i*61},95%,70%)`;g.beginPath();g.ellipse(x,y,16,21,0,0,Math.PI*2);g.fill();}
  for(let L=0;L<2;L++){const f=.15+L*.25;g.fillStyle=L?'#fff':`hsl(${h},60%,95%)`;for(let x=-60;x<VW+60;x+=50){const w=x+camX*f,r=40+Math.sin(w*.01)*18;circle(x-((camX*f)%50),yOff+390+L*40-camY*f*.3,r);}g.fillRect(0,yOff+400+L*40-camY*f*.3,VW,viewH);}}
};

function drawBG(){const th=THEMES[Math.floor(Math.max(0,P.x)/ZONE_LEN)%THEMES.length],h=skyHue+Math.sin(time*.3)*12,gr=g.createLinearGradient(0,0,0,viewH);gr.addColorStop(0,`hsl(${h},90%,86%)`);gr.addColorStop(1,`hsl(${h+45},95%,95%)`);g.fillStyle=gr;g.fillRect(0,0,VW,viewH);
 const sx=VW*.8,sy=80;g.save();g.translate(sx,sy);g.rotate(time*.2);g.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<12;i++){g.rotate(Math.PI/6);g.beginPath();g.moveTo(0,0);g.lineTo(600,-40);g.lineTo(600,40);g.fill();}g.restore();
 g.fillStyle='#fff3a6';circle(sx,sy,46);g.fillStyle='#ffe066';circle(sx,sy,36);
 const yOff=yOffNow();
 g.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<7;i++){const x=((i*260-camX*.1)%(VW+300)+VW+300)%(VW+300)-150,y=60+((i*73)%140)+yOff*.5;circle(x,y,24);circle(x+26,y-10,30);circle(x+56,y,22);}
 BGS[th.bg](h,yOff);
 // GREEN PHONE EDIT: altitude sky, sparkles and cloud banks as you climb
 const alt=clamp(-camY/2200,0,1);if(alt>0){g.fillStyle=`hsla(205,100%,90%,${alt*.55})`;g.fillRect(0,0,VW,viewH);
  for(let i=0;i<40;i++){const x=hash(i*3.3)*VW,y=hash(i*7.7)*viewH,tw=.5+.5*Math.sin(time*3+i);g.fillStyle=`rgba(255,255,255,${alt*tw})`;g.save();g.translate(x,y);g.rotate(Math.PI/4);g.fillRect(-1.5,-6,3,12);g.fillRect(-6,-1.5,12,3);g.restore();}}
 const f=.6,cw=280,ch=320,ky0=Math.floor((camY*f-250)/ch),kx0=Math.floor(camX*f/cw)-1;
 for(let ky=ky0;ky<=ky0+Math.ceil(viewH/ch)+2;ky++){if(ky>-1)continue;for(let kx=kx0;kx<kx0+VW/cw+3;kx++){const hs=hash(kx*7.1+ky*13.3);if(hs<.45)continue;
  const sx=kx*cw+hs*120-camX*f,sy=ky*ch+hash(kx+ky*3)*120-camY*f+yOff,sc=.8+hs;g.fillStyle='rgba(255,255,255,.9)';circle(sx,sy,26*sc);circle(sx+30*sc,sy-12*sc,32*sc);circle(sx+62*sc,sy,24*sc);g.fillRect(sx,sy,62*sc,22*sc);}}
}
function txt(s,x,y,size,fill,align){g.font=`900 ${size}px system-ui,-apple-system,sans-serif`;g.textAlign=align||'left';g.lineJoin='round';g.lineWidth=size/4;g.strokeStyle='#fff';g.strokeText(s,x,y);g.fillStyle=fill;g.fillText(s,x,y);}
function meter(x,y,w,frac,label,hue,align){g.fillStyle='rgba(255,255,255,.8)';rr(x,y,w,14,7);g.fill();g.fillStyle=`hsl(${hue},95%,58%)`;rr(x,y,Math.max(14,w*clamp(frac,0,1)),14,7);g.fill();txt(label,align==='right'?x+w:x,y-6,14,`hsl(${hue},80%,40%)`,align);}

function render(){
 g.setTransform(S,0,0,S,0,0);drawBG();
 const yOff=yOffNow(),shx=(Math.random()-.5)*shakeA,shy=(Math.random()-.5)*shakeA;
 g.save();g.translate(-camX+shx,-camY+yOff+shy);
 for(const p of pieces){if(p.x>camX+VW+80||p.x+p.w<camX-80)continue;for(const z of p.zones)if(z.updraft)drawUpdraft(z);for(const r of p.ramps)drawRamp(r,p);for(const s of p.solids)drawSolid(s,p);p.draw(p);for(const rg of p.rings)drawRing(rg);for(const st of p.stars)if(!st.got)drawStar(st);}
 for(const q of parts){const a=1-q.life/q.max;g.globalAlpha=a;g.fillStyle=q.kind==='dust'?`hsl(${q.hue},60%,80%)`:`hsl(${q.hue},100%,62%)`;circle(q.x,q.y,q.kind==='trail'?q.size*a:q.size);}g.globalAlpha=1;
 drawPlayer();
 if(P.touchWall&&!P.grounded&&!P.tube&&Math.floor(time*6)%2===0)txt('HOP!',P.x+P.w/2,P.y-14,16,'#ff3d8b','center');
 for(const q of pops){g.globalAlpha=1-q.life/.9;txt(q.text,q.x,q.y,q.size,`hsl(${q.hue},95%,50%)`,'center');}g.globalAlpha=1;
 g.restore();
 const sf=(P.speed-T.cruise)/(T.maxSpeed-T.cruise);
 if(sf>.25){g.strokeStyle=`rgba(255,255,255,${(sf-.25)*.9})`;g.lineWidth=3;for(let i=0;i<10;i++){const y=(i*97+time*13)%viewH,x=VW-((time*1800+i*331)%(VW*1.5));g.beginPath();g.moveTo(x,y);g.lineTo(x+120*sf,y);g.stroke();}}
 if(leftHeld){g.fillStyle='hsla(190,100%,60%,.08)';g.fillRect(0,0,VW/2,viewH);}
 if(rightHeld){g.fillStyle='hsla(330,100%,60%,.08)';g.fillRect(VW/2,0,VW/2,viewH);}
 if(flashA>.01){g.fillStyle=`rgba(255,255,255,${flashA})`;g.fillRect(0,0,VW,viewH);}
 txt(String(dist+pts),16,40,32,`hsl(${(time*120)%360},85%,48%)`);
 txt('BEST '+best,16,62,14,'#7a5cff');
 txt('★ '+stars,VW-16,38,24,'#f0a000','right');
 txt('BONKS '+bonks,VW-16,60,14,'#ff3d5a','right');
 if(comboN>1){const pulse=1+Math.sin(time*20)*.06;txt('x'+comboN+' COMBO',VW/2,40,26*pulse,`hsl(${(time*400)%360},95%,52%)`,'center');g.fillStyle='rgba(255,255,255,.8)';rr(VW/2-60,50,120,8,4);g.fill();g.fillStyle='#ff4fa3';rr(VW/2-60,50,120*comboT/1.6,8,4);g.fill();}
 meter(16,viewH-26,150,sf,'SPEED',190);
 if(P.y<GROUND-300)txt('ALT '+Math.round((GROUND-P.y)/10)+'m',VW/2,viewH-14,18,'#1aa7d6','center');
 if(P.wing&&!P.grounded)txt(P.wing==='glider'?'HOLD RIGHT TO GLIDE':'HOLD RIGHT TO FLOAT',VW/2,viewH-38,14,'#7a5cff','center');
 meter(VW-166,viewH-26,150,P.holding?1-P.hold/T.maxHold:0,'HOP',330,'right');
 if(banner){const k=banner.t,a=k<.3?k/.3:k>2.2?(2.6-k)/.4:1,sc=k<.3?.6+k/.3*.4:1;g.globalAlpha=clamp(a,0,1);txt(banner.text,VW/2,viewH*.3,Math.min(40,VW/16)*sc,`hsl(${(time*200)%360},90%,52%)`,'center');g.globalAlpha=1;}
 if(!started){g.fillStyle='rgba(255,255,255,.55)';g.fillRect(0,0,VW,viewH);g.strokeStyle='rgba(122,92,255,.5)';g.lineWidth=3;g.setLineDash([10,10]);g.beginPath();g.moveTo(VW/2,0);g.lineTo(VW/2,viewH);g.stroke();g.setLineDash([]);
  const cy=viewH*.3;txt('HOPPER',VW/2,cy,Math.min(72,VW/7),`hsl(${(time*120)%360},90%,55%)`,'center');
  txt('HOLD LEFT',VW/4,cy+70,22,'#1aa7d6','center');txt('go faster',VW/4,cy+96,16,'#1aa7d6','center');
  txt('HOLD RIGHT',VW*.75,cy+70,22,'#ff3d8b','center');txt('hop higher, longer',VW*.75,cy+96,16,'#ff3d8b','center');
  txt('push into a wall and hop to wall jump',VW/2,cy+150,16,'#7a5cff','center');
  if(Math.floor(time*2)%2===0)txt('TAP TO START',VW/2,cy+195,24,'#f0a000','center');}
}

let last=performance.now(),saveT=0;
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;time+=dt;
 step(dt/2);step(dt/2);
 while(genX<camX+VW+700)spawnNext();
 while(pieces.length&&pieces[0].x+pieces[0].w<camX-500)pieces.shift();
 saveT+=dt;if(saveT>2){saveT=0;try{localStorage.setItem('hopper_best',best)}catch(e){}}
 render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
