<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lob Hill</title>
<meta name="description" content="Wireframe tank artillery from a dug in turret. Duel another tank or hold the hill against jeeps, Bradleys and androids.">
<meta name="theme-color" content="#e9e6dc">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23eceae3'/%3E%3Cpath d='M4 24 L10 18 L22 18 L28 24 Z M12 18 L13 14 L19 14 L20 18 M19 16 L28 10' fill='none' stroke='%23d2601a' stroke-width='2.2'/%3E%3C/svg%3E">
<!--
Lob Hill v3. Wireframe tank artillery in the MobbyHill style.
Modes: Duel (computer or pass and play), Jeep raid, Bradley push, Android swarm.
The tank sits in a dug in pit ringed with sandbags, which halve incoming hits while the tank stays in the pit.
The tank can drive a short distance each turn. Raid modes give one shell per target each turn and remember the aim for every target.
Enemies need line of sight to shoot back. Jeeps are short range, Bradleys hunt for high ground, androids die in groups to a good blast.
-->
<style>
:root{
  --panel:#eceae3; --panel2:#dedbd1; --edge:#9d9a8f; --ink:#2e3338; --ink2:#5f6469;
  --yellow:#f2c230; --red:#c8362b; --blue:#2a62b0; --green:#3f8a3f; --amber:#c27a12; --orange:#d2601a;
  --ui:"Roboto Condensed","Arial Narrow","sans-serif-condensed",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:#eef0ec;color:var(--ink);font-family:var(--ui);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 0;display:flex;gap:5px;align-items:flex-start}
.gauge{width:76px;height:76px;flex:none}
#chips{flex:1;display:grid;grid-template-columns:1fr;gap:3px;min-width:0}
.chip{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:2px 6px;display:flex;justify-content:space-between;align-items:center;gap:4px;min-width:0}
.chip .k{font-size:10px;color:var(--ink2);white-space:nowrap}
.chip .v{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:#fbe6d6;border-color:var(--orange)}
.chip.on2{background:#dcebf8;border-color:var(--blue)}
.chip.bad .v{color:var(--red)}
#strip{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 90px);display:flex;gap:5px;padding:0 8px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;touch-action:pan-x}
#strip::-webkit-scrollbar{display:none}
.tg{flex:none;min-width:58px;height:34px;background:var(--panel);border:1px solid var(--edge);border-radius:6px;font-size:12px;font-weight:800;line-height:1.05;padding:0 6px}
.tg small{display:block;font-size:10px;font-weight:700;color:var(--ink2)}
.tg.sel{background:#f6dca5;border:2px solid var(--amber)}
.tg.done{background:#dcefdc;border-color:var(--green)}
.tg.done small{color:#24552a}
#ticker{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);width:max-content;max-width:94vw;background:var(--yellow);border:2px solid #b58d12;border-radius:6px;padding:4px 12px;font-size:14px;font-weight:800;text-align:center;color:#3a2f05;opacity:1;transition:opacity .3s}
#ticker.off{opacity:0}
#ticker.bad{background:#f3c9c4;border-color:var(--red);color:#5a1510}
#side{position:absolute;right:8px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.sbtn{width:62px;height:34px;background:var(--panel);border:1px solid var(--edge);border-radius:6px;font-size:12px;font-weight:800}
.sbtn.on{background:#cfe0f4;border-color:var(--blue)}
#panel{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--edge);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 8px);pointer-events:auto}
#hud.busy #panel{opacity:.45;pointer-events:none}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;height:32px;border:2px solid var(--edge);background:#fff;border-radius:7px;font-size:14px;font-weight:900}
.tabs button.on{background:#fbe6d6;border-color:var(--orange);color:#7a3510}
.cap{font-size:11px;font-weight:800;color:var(--ink2);text-align:center;margin-bottom:2px}
.grp2{display:flex;gap:8px}
.grp{flex:1;background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:4px}
.btns{display:flex;gap:4px}
.cb{flex:1;height:44px;background:#fff;border:2px solid var(--edge);border-radius:7px;font-size:13px;font-weight:900;touch-action:none;line-height:1.05}
.cb.down{background:#f6dca5;border-color:var(--amber)}
.prow{display:flex;align-items:center;gap:6px;margin-top:6px}
.prow .cap{margin:0;width:42px;text-align:left}
.cb.sm{flex:none;width:44px;height:38px;font-size:20px}
#pow{flex:1;min-width:40px;accent-color:var(--orange);height:30px}
#powV{width:30px;text-align:right;font-size:16px;font-weight:900}
.frow{display:flex;gap:6px;margin-top:6px}
#bShell{flex:1;height:50px;background:#fff;border:2px solid var(--edge);border-radius:8px;font-size:14px;font-weight:900;line-height:1.1}
#bShell small{display:block;font-size:11px;color:var(--ink2);font-weight:800}
#bFire{flex:1.3;height:50px;background:var(--yellow);border:2px solid #b58d12;border-radius:8px;font-size:20px;font-weight:900}
.dwrap{display:flex;gap:10px;align-items:stretch}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,46px);gap:4px}
.dpad .cb{height:auto}
.dpad .mid{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ink2);text-align:center;line-height:1.1}
.dinfo{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px}
.fbar{height:12px;background:#fff;border:1px solid var(--edge);border-radius:5px;overflow:hidden}
#fuelFill{display:block;height:100%;width:100%;background:var(--green)}
#fuelTxt{font-size:15px;font-weight:900}
.note{font-size:12px;color:var(--ink2);line-height:1.3}
.note.good{color:#24552a;font-weight:800}
.hide{display:none!important}
#card{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:var(--panel);border:3px solid var(--red);border-radius:10px;padding:14px 18px;text-align:center;width:min(300px,88vw);display:none;box-shadow:0 5px 0 #a3483f;z-index:15}
#card.on{display:block}
#card.win{border-color:var(--green);box-shadow:0 5px 0 #24552a}
#card .t{font-size:24px;font-weight:900;color:var(--red)}
#card.win .t{color:var(--green)}
#card .d{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.45}
#cardBtns{display:flex;gap:8px;margin-top:12px}
#cardBtns button{flex:1;border:2px solid var(--edge);background:#fff;border-radius:8px;padding:9px 4px;font-size:14px;font-weight:800}
#cardBtns button.go{background:var(--yellow);border-color:#b58d12}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;background:rgba(238,240,236,.86);z-index:20;padding:16px;overflow-y:auto;touch-action:pan-y}
#start.hide{display:none}
.sc{background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:18px 16px;width:min(380px,100%);text-align:center;box-shadow:0 6px 0 #b9b6ab;margin:auto 0 0}
.sc h1{font-size:30px;font-weight:900;color:var(--orange);letter-spacing:.02em}
.sc p{font-size:14px;color:var(--ink2);line-height:1.45;margin-top:8px;text-align:left}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.modes button{border:2px solid var(--edge);background:#fff;border-radius:9px;padding:10px 4px;font-size:15px;font-weight:900}
.modes button.on{background:#fbe6d6;border-color:var(--orange);color:#7a3510}
.modes button.wide{grid-column:1 / 3}
.mnote{font-size:13px;color:var(--ink2);min-height:38px;margin-top:8px;line-height:1.4}
.sc .go{width:100%;margin-top:10px;border:2px solid #b58d12;background:var(--yellow);border-radius:9px;padding:12px 6px;font-size:17px;font-weight:900}
#mtgSealContainer{width:min(380px,100%);margin:16px 0 auto;border-radius:10px;overflow:hidden}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" class="busy">
  <div id="top">
    <canvas class="gauge" id="gPow"></canvas>
    <canvas class="gauge" id="gLift"></canvas>
    <canvas class="gauge" id="gTurn"></canvas>
    <div id="chips">
      <div class="chip" id="ch0"><span class="k" id="k0"></span><span class="v" id="v0"></span></div>
      <div class="chip" id="ch1"><span class="k" id="k1"></span><span class="v" id="v1"></span></div>
      <div class="chip" id="ch2"><span class="k" id="k2"></span><span class="v" id="v2"></span></div>
      <div class="chip" id="ch3"><span class="k" id="k3"></span><span class="v" id="v3"></span></div>
    </div>
  </div>
  <div id="strip"></div>
  <div id="ticker" class="off"></div>
  <div id="side">
    <button class="sbtn" id="bCam">Map</button>
    <button class="sbtn" id="bEnd">End turn</button>
    <button class="sbtn" id="bNew">Menu</button>
  </div>
  <div id="panel">
    <div class="tabs"><button id="tGun" class="on">Gun</button><button id="tDrive">Drive</button></div>
    <div id="pGun">
      <div class="grp2">
        <div class="grp"><div class="cap">Turret</div><div class="btns"><button class="cb" id="gL">&#9664; Left</button><button class="cb" id="gR">Right &#9654;</button></div></div>
        <div class="grp"><div class="cap">Barrel</div><div class="btns"><button class="cb" id="gD">&#9660; Down</button><button class="cb" id="gU">Up &#9650;</button></div></div>
      </div>
      <div class="prow"><span class="cap">Power</span><button class="cb sm" id="pM" aria-label="Less power">&#8722;</button><input type="range" id="pow" min="5" max="100" step="1" value="60" aria-label="Power"><button class="cb sm" id="pP" aria-label="More power">+</button><b id="powV">60</b></div>
      <div class="frow"><button id="bShell">Single<small>3 left</small></button><button id="bFire">Fire</button></div>
    </div>
    <div id="pDrive" class="hide">
      <div class="dwrap">
        <div class="dpad">
          <span></span><button class="cb" id="dF">&#9650;<br>Forward</button><span></span>
          <button class="cb" id="dL">&#9664;<br>Turn</button><span class="mid">Hull</span><button class="cb" id="dR">Turn<br>&#9654;</button>
          <span></span><button class="cb" id="dB">Back<br>&#9660;</button><span></span>
        </div>
        <div class="dinfo">
          <div class="cap" style="text-align:left">Move left this turn</div>
          <div class="fbar"><span id="fuelFill"></span></div>
          <div id="fuelTxt">10 m</div>
          <div class="note" id="pitNote"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="card">
  <div class="t" id="cardT"></div>
  <div class="d" id="cardD"></div>
  <div id="cardBtns"><button class="go" id="bAgain">Play again</button><button id="bMenu">Menu</button></div>
</div>
<div id="start">
  <div class="sc">
    <h1>Lob Hill</h1>
    <p>Tank artillery from a dug in turret. Aim the turret and barrel, set power, and fire. The view drops to the map to follow the shell. Your tank can drive a little each turn, and the sandbags only cover you inside the pit.</p>
    <div class="modes" id="modes"></div>
    <div class="mnote" id="mnote"></div>
    <button class="go" id="bStart">Start</button>
  </div>
  <div id="mtgSealContainer"></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const DEG=Math.PI/180,S=160,N=48,SEG=S/N,G=30,FUEL=10;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const normA=a=>{a=(a+Math.PI)%(2*Math.PI);if(a<0)a+=2*Math.PI;return a-Math.PI;};
const GC='166,120,56',SKY=['#f2e8d2','#f8f2e4','#f2e6cc'];
const PCOL=['#d2601a','#2a62b0'];

const MODES={
  duel:{n:'Duel',note:'One on one against the computer tank. Eight shells each, most damage wins.'},
  pass:{n:'Duel, pass and play',note:'Two players share one phone. Eight shells each, most damage wins.'},
  jeeps:{n:'Jeep raid',raid:true,note:'Five gun jeeps race at your pit. Their guns are short range and need line of sight. One shell per jeep every turn, and your aim is saved for each jeep.'},
  bradley:{n:'Bradley push',raid:true,note:'Four Bradleys with cannons. They shoot from much farther out but need line of sight, so they climb for high ground. Each takes more than one hit.'},
  droids:{n:'Android swarm',raid:true,note:'Twenty androids walk in. Three shells a turn, and one shell takes out every android inside the blast.'}
};
const ETYPE={
  jeep:{n:'Jeep',p:'J',hp:30,step:13,range:42,dmg:5,col:'#c8362b',h:1.4,eye:2.2,fireGap:.3},
  bradley:{n:'Bradley',p:'B',hp:90,step:8,range:88,dmg:12,col:'#2a62b0',h:1.6,eye:2.6,fireGap:.4},
  droid:{n:'Android',p:'A',hp:1,step:8,range:26,dmg:2,col:'#5f6469',h:1.2,eye:1.6,fireGap:.1}
};

/* canvas and projection, same pipeline as MobbyHill */
const cv=$('view'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
addEventListener('resize',resize);resize();
function basis(yaw,pitch){const sy=Math.sin(yaw),cy=Math.cos(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  return{F:[sy*cp,sp,cy*cp],U:[-sy*sp,cp,-cy*sp],R:[cy,0,-sy]};}
const CAM={x:0,y:0,z:0,R:[1,0,0],U:[0,1,0],F:[0,0,1],f:300,cx:0,cy:0,ortho:false,s:2};
const NEAR=.08;
function toCam(x,y,z){const dx=x-CAM.x,dy=y-CAM.y,dz=z-CAM.z,R=CAM.R,U=CAM.U,F=CAM.F;
  return[dx*R[0]+dy*R[1]+dz*R[2],dx*U[0]+dy*U[1]+dz*U[2],dx*F[0]+dy*F[1]+dz*F[2]];}
function scr(c){if(CAM.ortho)return[CAM.cx+c[0]*CAM.s,CAM.cy-c[1]*CAM.s];if(c[2]<NEAR)return null;return[CAM.cx+c[0]/c[2]*CAM.f,CAM.cy-c[1]/c[2]*CAM.f];}
function segC(p,a,b){
  let ax=a[0],ay=a[1],az=a[2],bx=b[0],by=b[1],bz=b[2];
  if(CAM.ortho){p.moveTo(CAM.cx+ax*CAM.s,CAM.cy-ay*CAM.s);p.lineTo(CAM.cx+bx*CAM.s,CAM.cy-by*CAM.s);return;}
  if(az<NEAR&&bz<NEAR)return;
  if(az<NEAR){const t=(NEAR-az)/(bz-az);ax+=(bx-ax)*t;ay+=(by-ay)*t;az=NEAR;}
  else if(bz<NEAR){const t=(NEAR-bz)/(az-bz);bx+=(ax-bx)*t;by+=(ay-by)*t;bz=NEAR;}
  const f=CAM.f,x1=CAM.cx+ax/az*f,y1=CAM.cy-ay/az*f,x2=CAM.cx+bx/bz*f,y2=CAM.cy-by/bz*f;
  const m=W*3;if((x1<-m&&x2<-m)||(x1>W+m&&x2>W+m)||(y1<-m&&y2<-m)||(y1>H+m&&y2>H+m))return;
  p.moveTo(x1,y1);p.lineTo(x2,y2);
}
function segW(p,a,b){segC(p,toCam(a[0],a[1],a[2]),toCam(b[0],b[1],b[2]));}
function poly(p,pts,closed){for(let i=0;i<pts.length-1;i++)segW(p,pts[i],pts[i+1]);if(closed)segW(p,pts[pts.length-1],pts[0]);}
function boxL(p,P,x0,x1,y0,y1,z0,z1){
  const c=[P(x0,y0,z0),P(x1,y0,z0),P(x1,y0,z1),P(x0,y0,z1),P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)];
  poly(p,c.slice(0,4),true);poly(p,c.slice(4),true);for(let k=0;k<4;k++)segW(p,c[k],c[k+4]);
}
function ringL(p,P,cx,cy,cz,r,n,plane){const pts=[];for(let k=0;k<n;k++){const a=k/n*Math.PI*2,c=Math.cos(a)*r,s=Math.sin(a)*r;
  pts.push(plane==='yz'?P(cx,cy+s,cz+c):P(cx+c,cy,cz+s));}poly(p,pts,true);}

/* terrain height grid */
const HT=new Float32Array((N+1)*(N+1));
const I=(ix,iz)=>iz*(N+1)+ix;
function genTerrain(){
  const a=Math.random()*6,b=Math.random()*6,c=Math.random()*6,d=Math.random()*6,bumps=[];
  for(let i=0;i<6;i++)bumps.push([(Math.random()-.5)*S*.8,(Math.random()-.5)*S*.8,6+Math.random()*10,(Math.random()<.7?1:-1)*(3+Math.random()*5)]);
  const ridge=14+Math.random()*8;
  for(let iz=0;iz<=N;iz++)for(let ix=0;ix<=N;ix++){
    const x=ix*SEG-S/2,z=iz*SEG-S/2;
    let h=4+3*Math.sin(x*.05+a)+3*Math.cos(z*.06+b)+2*Math.sin((x+z)*.09+c);
    h+=ridge*Math.exp(-(x*x)/800)*(0.65+0.35*Math.sin(z*.045+d));
    for(const q of bumps){const dx=x-q[0],dz=z-q[1];h+=q[3]*Math.exp(-(dx*dx+dz*dz)/(2*q[2]*q[2]));}
    const e=Math.min(ix,iz,N-ix,N-iz);if(e<3)h=h*(e/3)-(1-e/3);
    HT[I(ix,iz)]=Math.max(-1,h);
  }
}
function heightAt(x,z){
  const fx=(x+S/2)/SEG,fz=(z+S/2)/SEG;
  if(fx<0||fz<0||fx>N||fz>N)return -1;
  const ix=Math.min(N-1,Math.floor(fx)),iz=Math.min(N-1,Math.floor(fz)),u=fx-ix,v=fz-iz;
  return (HT[I(ix,iz)]*(1-u)+HT[I(ix+1,iz)]*u)*(1-v)+(HT[I(ix,iz+1)]*(1-u)+HT[I(ix+1,iz+1)]*u)*v;
}
function deform(x,z,r,dig){
  const r2=r*r;
  for(let iz=0;iz<=N;iz++)for(let ix=0;ix<=N;ix++){
    const dx=ix*SEG-S/2-x,dz=iz*SEG-S/2-z,d2=dx*dx+dz*dz;
    if(d2<r2){const k=I(ix,iz);HT[k]=Math.min(45,Math.max(-1,HT[k]-dig*(1-d2/r2)));}
  }
}
function flatPad(x,z,r){
  const h=heightAt(x,z);
  for(let iz=0;iz<=N;iz++)for(let ix=0;ix<=N;ix++){
    const dx=ix*SEG-S/2-x,dz=iz*SEG-S/2-z,d=Math.sqrt(dx*dx+dz*dz);
    if(d<r){const f=Math.min(1,1.4*(1-d/r)),k=I(ix,iz);HT[k]=h*f+HT[k]*(1-f);}
  }
}
const GCAM=new Float32Array((N+1)*(N+1)*3),GX=new Float32Array((N+1)*(N+1)),GZ=new Float32Array((N+1)*(N+1));
function drawTerrain(bands,ortho){
  for(let iz=0;iz<=N;iz++)for(let ix=0;ix<=N;ix++){
    const n=I(ix,iz),x=ix*SEG-S/2,z=iz*SEG-S/2,c=toCam(x,HT[n],z);
    GCAM[n*3]=c[0];GCAM[n*3+1]=c[1];GCAM[n*3+2]=c[2];GX[n]=x;GZ[n]=z;
  }
  const A=[0,0,0],B=[0,0,0];
  for(let iz=0;iz<=N;iz++)for(let ix=0;ix<=N;ix++){
    const a=I(ix,iz);
    for(let dir=0;dir<2;dir++){
      if(dir===0&&ix===N)continue;if(dir===1&&iz===N)continue;
      const b=dir===0?a+1:a+N+1;
      let band=1;
      if(!ortho){const mx=(GX[a]+GX[b])/2-CAM.x,mz=(GZ[a]+GZ[b])/2-CAM.z,r2=mx*mx+mz*mz;band=r2<900?0:r2<2700?1:r2<6400?2:3;}
      A[0]=GCAM[a*3];A[1]=GCAM[a*3+1];A[2]=GCAM[a*3+2];B[0]=GCAM[b*3];B[1]=GCAM[b*3+1];B[2]=GCAM[b*3+2];
      segC(bands[band],A,B);
    }
  }
}
function drawFloor(p,ext,step){
  for(let k=-ext;k<=ext;k+=step)for(let q=-ext;q<ext;q+=step){
    const m=q+step/2,inside=Math.abs(m)<S/2&&Math.abs(k)<=S/2;
    if(!inside){segW(p,[q,-1,k],[q+step,-1,k]);segW(p,[k,-1,q],[k,-1,q+step]);}
  }
}
function hasLOS(x0,y0,z0,x1,y1,z1){

/* dug in pit with a ring of sandbags, two courses high */

  }

}

function placeTank(t,x,z,hy){t.x=x;t.z=z;t.hy=hy;t.yaw=hy;t.el=38*DEG;t.power=60;t.fuel=FUEL;digPit(x,z,hy);}
function setupDuel(){

/* duel turns */
function startTurn(){
  if(left(players[0])+left(players[1])===0)return gameOver();
  cur=players[turn%2];
  if(left(cur)===0){turn++;return startTurn();}
  if(!cur.ammo[cur.weapon])cur.weapon=ORDER.find(k=>cur.ammo[k]>0);
  cur.fuel=FUEL;shellBtn();chips();
  if(cur.cpu){state='cpu';setView('map');busy(true);ticker('Computer is aiming');setTimeout(cpuAim,800);}
  else{state='aim';setView('driver');busy(false);ticker(MODE==='pass'?cur.n+', your shot. Pass the phone':'Your shot. Aim, set power, fire');}
}

/* raid turns: one shell per target, aim saved per target */

    droidSlots.forEach(s=>s.fired=false);slots=droidSlots;
  }else{
    slots=aliveE().map(e=>{if(!e.preset)e.preset={id:e.label,e,yaw:Math.atan2(e.x-m.x,e.z-m.z),el:38*DEG,power:60};e.preset.fired=false;return e.preset;});
  }
}

}

function raidTurn(){

  if(!m.ammo[m.weapon])m.weapon='single';

  }else{turn++;startTurn();}
}

/* enemy phase: move, then everyone with line of sight and range fires */
function plan(e){
  const T=ETYPE[e.type],m=me(),eye=y=>y+T.eye,tgt=center(m);
  const d=Math.hypot(m.x-e.x,m.z-e.z);
  if(d<=T.range&&hasLOS(e.x,eye(heightAt(e.x,e.z)),e.z,tgt[0],tgt[1]+.6,tgt[2]))return[e.x,e.z];
  const base=Math.atan2(m.x-e.x,m.z-e.z);let best=[e.x,e.z],bs=1e9;
  for(let k=-3;k<=3;k++)for(const f of[.5,1]){
    const a=base+k*.38,st=T.step*f,x=clamp(e.x+Math.sin(a)*st,-S/2+3,S/2-3),z=clamp(e.z+Math.cos(a)*st,-S/2+3,S/2-3);
    const nd=Math.hypot(m.x-x,m.z-z);if(nd<7)continue;
    const l=nd<=T.range&&hasLOS(x,eye(heightAt(x,z)),z,tgt[0],tgt[1]+.6,tgt[2]);
    let sc=nd+(Math.random()*3);if(l)sc-=200;if(e.type==='bradley')sc-=heightAt(x,z)*2.5;
    for(const o of enemies)if(o!==e&&o.alive&&o.tx!==undefined&&Math.hypot(o.tx-x,o.tz-z)<(e.type==='droid'?1.5:5))sc+=40;
    if(sc<bs){bs=sc;best=[x,z];}
  }
  return best;
}
function enemyPhase(){
  state='enemy';setView('map');busy(true);ticker('Enemy turn');
  for(const e of enemies){delete e.tx;delete e.tz;}
  for(const e of aliveE()){const t=plan(e);e.fx=e.x;e.fz=e.z;e.tx=t[0];e.tz=t[1];}
  ephase={stage:'move',t:0,q:[],gap:0};
}
function enemyStep(dt){
  const ep=ephase;if(!ep)return;
  if(ep.stage==='move'){
    ep.t=Math.min(1,ep.t+dt/1.3);const k=ep.t*ep.t*(3-2*ep.t);
    for(const e of aliveE()){e.x=e.fx+(e.tx-e.fx)*k;e.z=e.fz+(e.tz-e.fz)*k;e.gy=heightAt(e.x,e.z);
      if(Math.hypot(e.tx-e.fx,e.tz-e.fz)>.5){e.hy=Math.atan2(e.tx-e.fx,e.tz-e.fz);e.step+=dt*9;}}
    if(ep.t>=1){

        if(d<=T.range&&hasLOS(e.x,e.gy+T.eye,e.z,tg[0],tg[1]+.6,tg[2]))ep.q.push(e);}

    }

    ep.gap-=dt;
    if(ep.gap<=0&&ep.q.length){
      const e=ep.q.shift(),T=ETYPE[e.type],m=me(),cover=inPit(m),dmg=T.dmg*(cover?.5:1)*(.8+Math.random()*.4);
      m.hp-=dmg;tracers.push({a:[e.x,e.gy+T.eye,e.z],b:center(m),t:0,type:e.type});
      floats.push({p:[m.x+(Math.random()-.5)*3,m.gy+5,m.z],t:0,txt:'-'+Math.round(dmg),c:'#c8362b'});

function endRaid(won){

  $('cardD').textContent=MODES[MODE].n+'. '+kills+' destroyed in '+turnNo+' turn'+(turnNo>1?'s':'')+', armor '+Math.max(0,Math.round(me().hp))+'%.';

/* shells */
function fire(){
  if(state!=='aim'&&state!=='cpufire')return;
  const w=WEAP[cur.weapon];if(!cur.ammo[cur.weapon])return;
  if(raid()){syncSlot();if(slots[slotIdx])slots[slotIdx].fired=true;}
  if(isFinite(cur.ammo[cur.weapon]))cur.ammo[cur.weapon]--;
  state='flight';busy(true);setView('map');
  const sp=18+cur.power*0.6,offs=w.k===3?[-0.07,0,0.07]:[0];
  for(const o of offs){const m=muzzle(cur,cur.yaw+o,cur.el),d=dirOf(cur.yaw+o,cur.el);
    shells.push({p:m,v:[d[0]*sp,d[1]*sp,d[2]*sp],o:cur,w:cur.weapon,age:0,alive:true,trail:[m.slice()],tk:0});}
  if(raid()&&!cur.ammo[cur.weapon])cur.weapon='single';
  shellBtn();
}
function advance(s,h){
  s.v[1]-=G*h;s.p[0]+=s.v[0]*h;s.p[1]+=s.v[1]*h;s.p[2]+=s.v[2]*h;s.age+=h;
  for(const p of players){if(p.hidden||(p===s.o&&s.age<0.5))continue;if(dist(s.p,center(p))<2.8)return boom(s);}
  for(const e of enemies){if(e.alive&&dist(s.p,ecenter(e))<(e.type==='droid'?1.2:2.4))return boom(s);}
  const gy=heightAt(s.p[0],s.p[2]);if(s.p[1]<=gy){s.p[1]=gy;return boom(s);}
  if(s.p[1]<-30){s.alive=false;return;}
  if(++s.tk%3===0&&s.trail.length<500)s.trail.push(s.p.slice());
}
function boom(s){
  s.alive=false;s.trail.push(s.p.slice());
  const w=WEAP[s.w];deform(s.p[0],s.p[2],w.r,w.dig);players.forEach(settle);
  cacti=cacti.filter(c=>Math.hypot(c.x-s.p[0],c.z-s.p[2])>w.r*.8||w.dig<0);
  if(raid()){
    let n=0;
    for(const e of aliveE()){
      const d=dist(s.p,ecenter(e));if(d>=w.r)continue;
      if(e.type==='droid'){e.alive=false;n++;kills++;continue;}
      const dmg=Math.round(w.dmg*(1-.8*d/w.r));e.hp-=dmg;
      floats.push({p:[e.x,e.gy+5,e.z],t:0,txt:'-'+dmg,c:'#d2601a'});
      if(e.hp<=0){e.alive=false;kills++;n++;}
    }
    for(const e of enemies)if(e.alive)e.gy=heightAt(e.x,e.z);else e.gy=heightAt(e.x,e.z);
    const m=me(),dm=dist(s.p,center(m));
    if(dm<w.r){const dmg=w.dmg*.5*(1-.8*dm/w.r);m.hp-=dmg;floats.push({p:[m.x,m.gy+5,m.z],t:0,txt:'-'+Math.round(dmg),c:'#c8362b'});}
    if(n>0)ticker(n>1?n+' destroyed with one shell':'Target destroyed');
    else if(w.dmg>0&&aliveE().some(e=>dist(s.p,ecenter(e))<w.r))ticker('Hit');
    chips();
  }else{
    for(const p of players){
      const d=dist(s.p,center(p));
      if(w.dmg>0&&d<w.r){
        const raw=w.dmg*(1-0.8*d/w.r)*(inPit(p)?.5:1),dmg=Math.max(1,Math.round(raw)),sc=p===s.o?other(s.o):s.o;
        sc.score+=dmg;floats.push({p:[p.x,p.gy+5,p.z],t:0,txt:'+'+dmg,c:PCOL[players.indexOf(sc)]});
        if(MODE==='duel')ticker(sc.cpu?'Computer scores '+dmg:'Hit, you score '+dmg,sc.cpu);else ticker(sc.n+' scores '+dmg);
      }
    }
    chips();
  }
  booms.push({p:s.p.slice(),t:0,r:w.r*.8,mound:w.dig<0});
}

/* computer tank in duels */
function simulate(me0,yaw,el,power){
  const p=muzzle(me0,yaw,el),d=dirOf(yaw,el),sp=18+power*0.6,v=[d[0]*sp,d[1]*sp,d[2]*sp],h=1/60;
  for(let i=0;i<1200;i++){v[1]-=G*h;p[0]+=v[0]*h;p[1]+=v[1]*h;p[2]+=v[2]*h;if(p[1]<=heightAt(p[0],p[2]))return p;}
  return p;
}
function cpuAim(){
  if(state!=='cpu')return;
  const c=cur,foe=other(c);
  const av=ORDER.filter(k=>c.ammo[k]>0&&k!=='mound');c.weapon=av.length?av[Math.floor(Math.random()*av.length)]:'mound';shellBtn();
  const T=center(foe),yaw=Math.atan2(T[0]-c.x,T[2]-c.z),el=(36+Math.random()*20)*DEG;
  let best=60,bd=1e9;
  const tryP=pw=>{const L=simulate(c,yaw,el,pw),d=Math.hypot(L[0]-T[0],L[2]-T[2]);if(d<bd){bd=d;best=pw;}};
  for(let pw=5;pw<=100;pw+=2.5)tryP(pw);
  const b0=best;for(let pw=b0-2.5;pw<=b0+2.5;pw+=.25)tryP(pw);
  const y1=yaw+(Math.random()-.5)*0.14*skill;
  c.power=clamp(Math.round(best+(Math.random()-.5)*14*skill),5,100);skill*=0.68;
  cpuAnim={t:0,y0:c.yaw,y1:c.yaw+normA(y1-c.yaw),e0:c.el,e1:el};state='cpuaim';
}
function gameOver(){
  state='over';busy(true);setView('map');
  const a=players[0],b=players[1];chips();const c=$('card');
  const youWin=a.score>b.score&&a.n==='You';c.classList.toggle('win',youWin);
  $('cardT').textContent=a.score===b.score?'Tie game':(a.score>b.score?a.n:b.n)+(youWin?' win':' wins');
  $('cardD').textContent=a.n+' '+a.score+', '+b.n+' '+b.score;
  c.classList.add('on');
}

/* dials, drawn like MobbyHill's */
function prepC(c){const SZ=76;if(c.width!==Math.round(SZ*dpr)){c.width=Math.round(SZ*dpr);c.height=Math.round(SZ*dpr);}const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,SZ,SZ);return x;}

/* loop */
const holds={};
function step(dt,now){
  dt=Math.min(dt,.05);
  if(state==='aim'&&cur){
    const a=cur;
    if(holds.gL)a.yaw-=dt*.3;if(holds.gR)a.yaw+=dt*.3;
    if(holds.gU)a.el+=dt*.3;if(holds.gD)a.el-=dt*.3;a.el=clamp(a.el,3*DEG,85*DEG);
    if(holds.pP)a.power=Math.min(100,a.power+dt*20);if(holds.pM)a.power=Math.max(5,a.power-dt*20);
    if((holds.dF||holds.dB)&&a.fuel>0){
      const sp=(holds.dF?1:-1)*4*dt,nx=a.x+Math.sin(a.hy)*sp,nz=a.z+Math.cos(a.hy)*sp;
      if(Math.abs(nx)<S/2-4&&Math.abs(nz)<S/2-4){a.x=nx;a.z=nz;a.fuel=Math.max(0,a.fuel-Math.abs(sp));settle(a);}
    }
    if((holds.dL||holds.dR)&&a.fuel>0){const r=(holds.dR?1:-1)*.6*dt;a.hy+=r;a.yaw+=r;a.fuel=Math.max(0,a.fuel-Math.abs(r)*1.5);}
    if(raid())syncSlot();
  }
  if(state==='flight'){
    const sub=6,h=dt*1.8/sub;
    for(const s of shells)for(let i=0;i<sub&&s.alive;i++)advance(s,h);
    if(shells.every(s=>!s.alive)&&booms.length===0){state='settle';settleT=1.1;}
  }
  if(state==='enemy')enemyStep(dt);
  for(let i=booms.length-1;i>=0;i--){booms[i].t+=dt/.55;if(booms[i].t>=1)booms.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>1.6)floats.splice(i,1);}
  for(let i=tracers.length-1;i>=0;i--){tracers[i].t+=dt;if(tracers[i].t>.6)tracers.splice(i,1);}
  if(state==='settle'){settleT-=dt;if(settleT<=0){shells=[];afterShot();}}
  if(state==='cpuaim'&&cpuAnim){
    cpuAnim.t+=dt/1.4;const t=Math.min(1,cpuAnim.t),e=t*t*(3-2*t);
    cur.yaw=cpuAnim.y0+(cpuAnim.y1-cpuAnim.y0)*e;cur.el=cpuAnim.e0+(cpuAnim.e1-cpuAnim.e0)*e;
    if(t>=1){cpuAnim=null;state='cpufire';setTimeout(fire,350);}
  }
}
let last=performance.now();
function loop(t){const dt=(t-last)/1000;last=t;step(dt,t);render();hudDraw(dt);requestAnimationFrame(loop);}

/* input */
function bindHold(id){const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();holds[id]=true;b.classList.add('down');try{b.setPointerCapture(e.pointerId);}catch(_){}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>{holds[id]=false;b.classList.remove('down');}));
  b.addEventListener('contextmenu',e=>e.preventDefault());}
['gL','gR','gU','gD','pM','pP','dF','dB','dL','dR'].forEach(bindHold);
$('pow').addEventListener('input',e=>{if(cur&&state==='aim'){cur.power=+e.target.value;$('powV').textContent=cur.power;if(raid())syncSlot();}});
let vDrag=null;
cv.addEventListener('pointerdown',e=>{if(state!=='aim')return;vDrag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!vDrag||state!=='aim')return;const dx=e.clientX-vDrag.x,dy=e.clientY-vDrag.y;vDrag={x:e.clientX,y:e.clientY};
  cur.yaw+=dx*.004;cur.el=clamp(cur.el-dy*.004,3*DEG,85*DEG);});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{vDrag=null;}));
$('tGun').addEventListener('click',()=>setTab('gun'));
$('tDrive').addEventListener('click',()=>setTab('drive'));
$('bShell').addEventListener('click',()=>{if(state!=='aim')return;const i=ORDER.indexOf(cur.weapon);
  for(let k=1;k<=ORDER.length;k++){const w=ORDER[(i+k)%ORDER.length];if(cur.ammo[w]>0){cur.weapon=w;break;}}shellBtn();chips();});
$('bFire').addEventListener('click',()=>{if(state==='aim')fire();});
$('bCam').addEventListener('click',()=>{if(state==='aim')setView(view==='driver'?'map':'driver');});
$('bEnd').addEventListener('click',()=>{if(state==='aim'&&raid()){slots.forEach(s=>s.fired=true);enemyPhase();}});
function toMenu(){state='menu';cur=null;ephase=null;busy(true);setView('map');$('card').classList.remove('on');$('start').classList.remove('hide');}
$('bNew').addEventListener('click',toMenu);
$('bAgain').addEventListener('click',()=>newGame(MODE));
$('bMenu').addEventListener('click',toMenu);
const mb=$('modes');
Object.keys(MODES).forEach(k=>{const b=document.createElement('button');b.textContent=MODES[k].n;b.dataset.m=k;if(k==='droids')b.className='wide';
  b.onclick=()=>{pick=k;mb.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.m===k));$('mnote').textContent=MODES[k].note;};mb.appendChild(b);});
mb.querySelector('button').click();
$('bStart').addEventListener('click',()=>newGame(pick));

setupDuel();players[1].hidden=false;chips();$('strip').classList.add('hide');$('bEnd').classList.add('hide');requestAnimationFrame(loop);
})();
</script>
<script src="seal.js"></script>
