<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tank Pump Drip Demo</title>
<style>
  body {
    margin: 0;
    background: #faf6ee;
    font-family: 'Courier New', monospace;
    color: #3a3a3a;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 20px; margin: 14px 0 2px 0; }
  #status {
    font-size: 14px;
    font-weight: bold;
    margin: 4px 0 8px 0;
    padding: 4px 14px;
    border: 2px solid #3a3a3a;
    border-radius: 6px;
    background: #fff;
  }
  svg { width: 100%; max-width: 980px; height: auto; }
  .lbl { font-size: 12px; fill: #6a6a6a; }
  .lblb { font-size: 13px; font-weight: bold; fill: #3a3a3a; }
</style>
</head>
<body>
<h1>TANK PUMP DRIP CYCLE</h1>
<div id="status">IDLE</div>

<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg">

  <!-- ============ PIPES (drawn first, under boxes) ============ -->
  <!-- supply: tank to pump -->
  <path id="pipeSupply" d="M 640 300 L 640 350 L 450 350" stroke="#c8c2b4" stroke-width="8" fill="none"/>
  <!-- pump to expansion tank -->
  <path id="pipePT" d="M 300 350 L 220 350" stroke="#c8c2b4" stroke-width="8" fill="none"/>
  <!-- expansion tank to valve -->
  <path id="pipeTV" d="M 150 385 L 150 440" stroke="#c8c2b4" stroke-width="8" fill="none"/>
  <!-- valve to main to tee -->
  <path id="pipeMain" d="M 150 505 L 150 555 L 490 555" stroke="#c8c2b4" stroke-width="8" fill="none"/>
  <!-- leg A -->
  <path id="pipeA" d="M 490 555 L 490 590 L 270 590" stroke="#c8c2b4" stroke-width="8" fill="none"/>
  <!-- leg B -->
  <path id="pipeB" d="M 490 555 L 490 590 L 760 590" stroke="#c8c2b4" stroke-width="8" fill="none"/>

  <!-- water animation overlays -->
  <path class="flowSupply" d="M 640 300 L 640 350 L 450 350" stroke="#5a9bd4" stroke-width="8" fill="none" stroke-dasharray="14 12" opacity="0"/>
  <path class="flowSupply" d="M 300 350 L 220 350" stroke="#5a9bd4" stroke-width="8" fill="none" stroke-dasharray="14 12" opacity="0"/>
  <path class="flowOut" d="M 150 385 L 150 440" stroke="#5a9bd4" stroke-width="8" fill="none" stroke-dasharray="14 12" opacity="0"/>
  <path class="flowOut" d="M 150 505 L 150 555 L 490 555" stroke="#5a9bd4" stroke-width="8" fill="none" stroke-dasharray="14 12" opacity="0"/>
  <path class="flowOut" d="M 490 555 L 490 590 L 270 590" stroke="#5a9bd4" stroke-width="8" fill="none" stroke-dasharray="14 12" opacity="0"/>
  <path class="flowOut" d="M 490 555 L 490 590 L 760 590" stroke="#5a9bd4" stroke-width="8" fill="none" stroke-dasharray="14 12" opacity="0"/>

  <!-- ============ POWER ============ -->
  <rect x="30" y="90" width="140" height="70" rx="6" fill="#fff" stroke="#3a3a3a" stroke-width="2"/>
  <text x="100" y="118" text-anchor="middle" class="lblb">POWER PODIUM</text>
  <text x="100" y="136" text-anchor="middle" class="lbl">110v, always on</text>

  <path d="M 170 125 L 290 125" stroke="#d8cbb8" stroke-width="4" fill="none"/>
  <path id="wire110" d="M 170 125 L 290 125" stroke="#e0a030" stroke-width="4" fill="none" stroke-dasharray="6 8" opacity="0"/>

  <rect x="290" y="95" width="120" height="60" rx="6" fill="#fff" stroke="#3a3a3a" stroke-width="2"/>
  <text x="350" y="120" text-anchor="middle" class="lblb">CONVERTER</text>
  <text x="350" y="138" text-anchor="middle" class="lbl">110v to 12v</text>

  <path d="M 375 155 L 375 320" stroke="#d8cbb8" stroke-width="4" fill="none"/>
  <path id="wire12" d="M 375 155 L 375 320" stroke="#e0a030" stroke-width="4" fill="none" stroke-dasharray="6 8" opacity="0"/>
  <text x="392" y="240" class="lbl">12v</text>

  <!-- ============ TANK ============ -->
  <rect x="600" y="110" width="200" height="190" rx="14" fill="#e8f0e4" stroke="#3a3a3a" stroke-width="2"/>
  <text x="700" y="145" text-anchor="middle" class="lblb" font-size="15">1500 GAL TANK</text>
  <path d="M 612 185 Q 655 175 700 185 T 788 185" stroke="#7aa0c4" stroke-width="2" fill="none"/>
  <path d="M 612 205 Q 655 195 700 205 T 788 205" stroke="#7aa0c4" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="700" y="250" text-anchor="middle" class="lbl">outlet low, pump flooded</text>

  <!-- ============ PUMP ============ -->
  <rect id="pumpBox" x="300" y="320" width="150" height="62" rx="6" fill="#f0ece2" stroke="#3a3a3a" stroke-width="2"/>
  <text x="375" y="346" text-anchor="middle" class="lblb">12V RV PUMP</text>
  <text id="pumpState" x="375" y="366" text-anchor="middle" class="lbl">OFF</text>

  <!-- ============ EXPANSION TANK ============ -->
  <g>
    <rect x="90" y="300" width="120" height="85" rx="18" fill="#fff" stroke="#3a3a3a" stroke-width="2"/>
    <clipPath id="etClip"><rect x="92" y="302" width="116" height="81" rx="16"/></clipPath>
    <rect id="etFill" x="92" y="383" width="116" height="0" fill="#8db8dc" clip-path="url(#etClip)"/>
    <text x="150" y="326" text-anchor="middle" class="lblb" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">EXPANSION</text>
    <text x="150" y="342" text-anchor="middle" class="lblb" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">TANK 2 GAL</text>
    <text id="psiText" x="150" y="366" text-anchor="middle" class="lbl" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">45 PSI</text>
  </g>

  <!-- ============ TIMER VALVE ============ -->
  <rect id="valveBox" x="85" y="440" width="130" height="65" rx="6" fill="#f4e2e2" stroke="#3a3a3a" stroke-width="2"/>
  <text x="150" y="465" text-anchor="middle" class="lblb">TIMER VALVE</text>
  <text id="valveState" x="150" y="486" text-anchor="middle" class="lbl">CLOSED</text>

  <text x="255" y="545" class="lblb">1/2 in PVC MAIN</text>

  <!-- ============ PLANTS ============ -->
  <g id="plants"></g>

  <!-- day counter -->
  <text id="dayText" x="850" y="60" text-anchor="middle" class="lblb" font-size="15">DAY 1</text>
  <text x="850" y="80" text-anchor="middle" class="lbl">1 watering per day</text>
  <text x="490" y="628" text-anchor="middle" class="lbl">one full day compressed to about 10 seconds</text>
</svg>

<script>
  var plantX = [280, 340, 400, 460, 560, 620, 680, 740];
  var plantsG = document.getElementById('plants');
  var plantShapes = [];

  for (var i = 0; i < plantX.length; i++) {
    var x = plantX[i];
    var stem = document.createElementNS('http://www.w3.org/2000/svg','line');
    stem.setAttribute('x1', x); stem.setAttribute('y1', 590);
    stem.setAttribute('x2', x); stem.setAttribute('y2', 606);
    stem.setAttribute('stroke', '#3a3a3a'); stem.setAttribute('stroke-width', 2);
    plantsG.appendChild(stem);

    var bush = document.createElementNS('http://www.w3.org/2000/svg','circle');
    bush.setAttribute('cx', x); bush.setAttribute('cy', 614);
    bush.setAttribute('r', 11);
    plantsG.appendChild(bush);
    plantShapes.push(bush);
  }

  // moisture 0 = bone dry, 1 = just watered
  var moisture = 0.3;
  function plantColor(m) {
    // dry tan #b09a6a to healthy green #3f7a33
    var r = Math.round(176 + (63 - 176) * m);
    var g = Math.round(154 + (122 - 154) * m);
    var b = Math.round(106 + (51 - 106) * m);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // pressure model
  var CUTOFF = 45, CUTIN = 25;
  var psi = 45;
  var tankFillPx = 0;   // 0 to 81
  var pumpOn = false;
  var valveOpen = false;
  var day = 1;

  var etFill = document.getElementById('etFill');
  var psiText = document.getElementById('psiText');
  var pumpState = document.getElementById('pumpState');
  var pumpBox = document.getElementById('pumpBox');
  var valveState = document.getElementById('valveState');
  var valveBox = document.getElementById('valveBox');
  var statusEl = document.getElementById('status');
  var dayText = document.getElementById('dayText');
  var wire110 = document.getElementById('wire110');
  var wire12 = document.getElementById('wire12');
  var flowSupply = document.querySelectorAll('.flowSupply');
  var flowOut = document.querySelectorAll('.flowOut');

  // cycle: 10s total. 0 to 3.5s watering (valve open), rest drying.
  var CYCLE = 10000, WATER_END = 3500;
  var t0 = performance.now();
  var dashOffset = 0;

  function loop(now) {
    var t = (now - t0) % CYCLE;
    var newDay = Math.floor((now - t0) / CYCLE) + 1;
    if (newDay !== day) { day = newDay; dayText.textContent = 'DAY ' + day; }

    valveOpen = t < WATER_END;

    // pressure physics
    if (valveOpen) {
      psi -= 0.45;                    // nips draining the line
      moisture = Math.min(1, moisture + 0.012);
    } else {
      moisture = Math.max(0, moisture - 0.0035);  // desert drying
    }
    if (pumpOn) psi += valveOpen ? 0.75 : 1.6;    // pump gains, faster when dead heading

    // pressure switch
    if (psi <= CUTIN && !pumpOn) pumpOn = true;
    if (psi >= CUTOFF && pumpOn) { pumpOn = false; psi = CUTOFF; }
    psi = Math.max(0, Math.min(CUTOFF, psi));

    // expansion tank level tracks pressure between cutin and cutoff
    tankFillPx = 81 * (psi - 15) / (CUTOFF - 15);
    tankFillPx = Math.max(6, Math.min(81, tankFillPx));
    etFill.setAttribute('y', 383 - tankFillPx);
    etFill.setAttribute('height', tankFillPx);
    psiText.textContent = Math.round(psi) + ' PSI';

    // visuals
    pumpState.textContent = pumpOn ? 'RUNNING' : 'OFF';
    pumpBox.setAttribute('fill', pumpOn ? '#fbd9a8' : '#f0ece2');
    valveState.textContent = valveOpen ? 'OPEN' : 'CLOSED';
    valveBox.setAttribute('fill', valveOpen ? '#d9ecd4' : '#f4e2e2');

    statusEl.textContent = valveOpen
      ? (pumpOn ? 'WATERING, PUMP RUNNING' : 'WATERING FROM EXPANSION TANK')
      : (pumpOn ? 'VALVE CLOSED, PUMP TOPPING OFF' : 'IDLE, TANK CHARGED, PLANTS DRYING');

    // animated dashes
    dashOffset -= 1.6;
    var i;
    for (i = 0; i < flowSupply.length; i++) {
      flowSupply[i].setAttribute('opacity', pumpOn ? 1 : 0);
      flowSupply[i].setAttribute('stroke-dashoffset', dashOffset);
    }
    for (i = 0; i < flowOut.length; i++) {
      flowOut[i].setAttribute('opacity', valveOpen ? 1 : 0);
      flowOut[i].setAttribute('stroke-dashoffset', dashOffset);
    }
    wire110.setAttribute('opacity', pumpOn ? 1 : 0);
    wire12.setAttribute('opacity', pumpOn ? 1 : 0);
    wire110.setAttribute('stroke-dashoffset', dashOffset);
    wire12.setAttribute('stroke-dashoffset', dashOffset);

    // plants
    for (i = 0; i < plantShapes.length; i++) {
      plantShapes[i].setAttribute('fill', plantColor(moisture));
      plantShapes[i].setAttribute('r', 10 + moisture * 3);
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
