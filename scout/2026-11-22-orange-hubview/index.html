<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const PI=Math.PI;
const PAL=[0x8db3d6,0xe9a074,0x9cc7a4,0xf0cd6e,0xb8a3d1,0x7cc0bb,0xe58e95,0xd2cbbd];
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf3f1ec);
const camera=new THREE.PerspectiveCamera(24,1,0.05,300);
camera.position.set(10,5.8,11.7);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;
controls.target.set(0,0.6,0);
scene.add(new THREE.HemisphereLight(0xffffff,0xd6d0c4,1.7));
const sun=new THREE.DirectionalLight(0xffffff,0.7);sun.position.set(5,10,7);scene.add(sun);
const grid=new THREE.GridHelper(30,60,0xe0dbd0,0xe9e5dc);grid.position.y=-0.002;scene.add(grid);

/* geometry helpers. car axes: x forward, y up, z toward the left side */
function box(w,h,d){return new THREE.BoxGeometry(w,h,d)}
function cyl(r1,r2,h,ax='y',seg=24){const g=new THREE.CylinderGeometry(r1,r2,h,seg);if(ax==='x')g.rotateZ(PI/2);if(ax==='z')g.rotateX(PI/2);return g}
function lathe(pts,ax='y',seg=40){const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);if(ax==='z')g.rotateX(PI/2);if(ax==='x')g.rotateZ(-PI/2);return g}
function ring(r1,r2,h,ax='y',seg=40){return lathe([[r1,-h/2],[r2,-h/2],[r2,h/2],[r1,h/2],[r1,-h/2]],ax,seg)}
function sph(r){return new THREE.SphereGeometry(r,12,8)}
function rz(g,a){g.rotateZ(a);return g}
function rod(a,b,r,seg=12){const A=V(...a),B=V(...b),d=B.clone().sub(A);const g=new THREE.CylinderGeometry(r,r,d.length(),seg);g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(V(0,1,0),d.clone().normalize()));return{geo:g,pos:A.clone().add(B).multiplyScalar(0.5)}}
function coil(r,h,turns,w){const pts=[],n=turns*20;for(let i=0;i<=n;i++){const t=i/n,a=t*turns*2*PI;pts.push(V(Math.cos(a)*r,t*h-h/2,Math.sin(a)*r))}return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),n,w,6,false)}
function side(build,z,t=0.03){const sh=new THREE.Shape();build(sh);const g=new THREE.ExtrudeGeometry(sh,{depth:t,bevelEnabled:false,curveSegments:24});g.computeBoundingBox();const c=new THREE.Vector3();g.boundingBox.getCenter(c);g.translate(-c.x,-c.y,-c.z);return{geo:g,pos:V(c.x,c.y,z)}}
const poly=pts=>sh=>{sh.moveTo(...pts[0]);pts.slice(1).forEach(p=>sh.lineTo(...p));sh.closePath()};
const WY=0.297;
function arc(r,h,start,len){const g=new THREE.CylinderGeometry(r,r,h,20,1,true,start,len);g.rotateX(PI/2);return g}

const ASM=[];
function asm(name,desc,dir,fn,dx=0){
  const a={name,desc,dir:V(...dir),parts:[],amt:0,target:0};
  const P=(n,d,geo,pos,off)=>{
    if(!geo)return;
    if(geo.geo){off=pos;pos=geo.pos;geo=geo.geo}
    const v=pos.isVector3?pos.clone():V(...pos);v.x+=dx;a.parts.push({name:n,desc:d,geo,pos:v,off:off?V(...off):null,asm:a});
  };
  fn(P);ASM.push(a);
}
const LR=[[1,'Left'],[-1,'Right']];
const DX=0.07;

/* BLUEPRINT OVERLAY: 1982 Accord sedan drawing, scaled to mm */
let showBP=true;const BP=[];let carGen=0;
const tl=new THREE.TextureLoader();
function bp(file,w,h,setup){const gen=carGen;tl.load(file,t=>{if(gen!==carGen)return;t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:0.85,side:THREE.DoubleSide,depthWrite:false}));setup(m);m.visible=showBP;m.renderOrder=-1;scene.add(m);BP.push(m)})}
/* WHEEL PARTS shared by all four corners, drawn in hub units then scaled */
const K=0.0958;
const TIRE=[[2.2,-0.8],[2.75,-0.95],[3.05,-0.6],[3.1,0],[3.05,0.6],[2.75,0.95],[2.2,0.8]];
const WHEEL=[[0.5,0.25],[1.6,0.3],[1.9,0.1],[2.2,-0.7],[2.25,-0.8],[2.25,0.8],[2.2,0.7],[1.9,0.45],[1.6,0.45],[0.5,0.4]];
const CAP=[[0,0.55],[0.9,0.5],[1.3,0.35],[1.35,0.2],[1.3,0.15]];
function corner(P,cx,cz,s,k=K,wy=WY,lugs=4,lugR=0.71,td='165SR13 steel belted radial.',wd='13 inch steel wheel, 4 lug, 100 mm bolt circle.'){
  const K0=k;
  const sc=g=>{g.scale(K0,K0,K0*s);return g};
  const L=(pts,seg=48)=>sc(lathe(pts,'z',seg));
  const at=(x,y,z)=>[cx+x*K0,wy+y*K0,cz+z*K0*s];
  const o=(x,y,z)=>[x*K0,y*K0,z*K0*s];
  P('Tire',td,L(TIRE,64),at(0,0,0),o(0,0,9));
  P(lugs===5?'Alloy Wheel':'Steel Wheel',wd,L(WHEEL,64),at(0,0,0),o(0,0,7));
  P('Hub Cap','Snaps over the lug nuts.',L(CAP),at(0,0,0),o(0,0,10.5));
  for(let i=0;i<lugs;i++){const a=i*2*PI/lugs+PI/4;
    P('Lug Nut '+(i+1),'12 x 1.5 mm, 19 mm hex. About 80 ft lb in a star pattern.',sc(cyl(0.16,0.16,0.3,'z',6)),at(Math.cos(a)*lugR,Math.sin(a)*lugR,0.95),o(Math.cos(a)*0.4,Math.sin(a)*0.4,6));}
  return{sc,L,at,o};
}

function buildAccord(){
/* BODY: traced from the 1982 Accord sedan blueprint. front axle x 1.32, rear axle x -1.13 */
asm('Body Shell','Welded steel unibody. Everything else bolts to it.',[0,0,0],P=>{
  P('Floor Pan','Stamped steel floor, the base of the unibody.',box(2.15,0.035,1.5),[-0.175,0.24,0]);
  P('Trunk Floor','Raised floor over the fuel tank.',box(0.85,0.03,1.4),[-1.72,0.42,0]);
  P('Firewall','Bulkhead between the engine bay and the cabin.',box(0.035,0.5,1.45),[0.9,0.62,0]);
  P('Cowl Panel','Panel under the windshield with the fresh air intake.',box(0.25,0.03,1.4),[1.0,0.9,0]);
  P('Radiator Core Support','Front bulkhead that holds the radiator and latch.',box(0.05,0.42,1.4),[2.08,0.55,0]);
  P('Roof Panel','Single stamped roof skin.',box(1.3,0.03,1.24),[-0.315,1.335,0]);
  P('Rear Package Shelf','Shelf behind the rear seat.',box(0.45,0.03,1.35),[-1.33,0.96,0]);
  P('Rear Body Panel','Panel under the trunk opening.',box(0.035,0.42,1.5),[-2.19,0.62,0]);
  LR.forEach(([s,sd])=>{
    P(sd+' Rocker Panel','Boxed sill under the doors. Main side rail of the shell.',box(1.82,0.12,0.06),[-0.09,0.31,s*0.8]);
    P(sd+' Front Frame Rail','Box section rail carrying the engine and front suspension.',box(1.3,0.1,0.08),[1.5,0.33,s*0.52]);
    P(sd+' Front Strut Tower','Stamped tower that takes the top of the front strut.',cyl(0.1,0.13,0.32),[1.32,0.68,s*0.6]);
    P(sd+' Front Fender','Bolt on steel fender.',side(sh=>{sh.moveTo(0.82,0.92);sh.lineTo(0.82,0.3);sh.lineTo(0.95,0.3);sh.absarc(1.32,WY,0.37,PI,0,true);sh.lineTo(2.0,0.3);sh.lineTo(2.12,0.45);sh.lineTo(2.12,0.74);sh.lineTo(0.88,0.92);sh.closePath()},s*0.81));
    P(sd+' Rear Quarter Panel','Welded rear quarter, part of the shell.',side(sh=>{sh.moveTo(-1.0,0.95);sh.lineTo(-1.56,0.98);sh.lineTo(-2.05,0.94);sh.lineTo(-2.19,0.86);sh.lineTo(-2.19,0.45);sh.lineTo(-1.9,0.3);sh.lineTo(-1.5,0.3);sh.absarc(-1.13,WY,0.37,PI,1.212,true);sh.lineTo(-1.0,0.95);sh.closePath()},s*0.81));
    P(sd+' C Pillar','Sail panel behind the rear door glass.',side(poly([[-0.76,1.29],[-0.98,1.335],[-1.56,0.98],[-1.02,0.96]]),s*0.76));
    P(sd+' A Pillar','Windshield pillar.',rod([0.91,0.93,s*0.75],[0.33,1.32,s*0.65],0.025));
    P(sd+' B Pillar','Center pillar between the doors.',box(0.07,0.38,0.05),[-0.14,1.12,s*0.75]);
    P(sd+' Rear Strut Tower','Rear strut tower inside the trunk.',cyl(0.09,0.11,0.3),[-1.18,0.7,s*0.6]);
  });
});

asm('Glass','Windshield and rear window.',[0,0.8,0],P=>{
  P('Windshield','Laminated safety glass.',rz(box(0.7,0.008,1.32),-0.596),[0.621,1.124,0]);
  P('Rear Window','Tempered glass with defroster grid.',rz(box(0.676,0.008,1.26),0.545),[-1.269,1.155,0]);
});

asm('Hood','Front hinged hood with prop rod.',[0.4,2.2,0],P=>{
  P('Hood Panel','Steel hood skin and inner brace.',rz(box(1.19,0.03,1.45),-0.127),[1.495,0.85,0],[0,0.2,0]);
  P('Hood Insulation Pad','Sound pad under the hood.',rz(box(0.95,0.015,1.2),-0.127),[1.5,0.83,0],[0,-0.15,0]);
  LR.forEach(([s,sd])=>P(sd+' Hood Hinge','Bolted hinge at the cowl.',box(0.12,0.05,0.03),[0.97,0.9,s*0.62],[-0.2,0,s*0.15]));

});

asm('Trunk Lid','Rear deck lid with torsion bar hinges.',[-0.5,1.6,0],P=>{
  P('Trunk Lid Panel','Steel deck lid.',rz(box(0.5,0.03,1.4),0.102),[-1.805,0.96,0],[0,0.2,0]);
  LR.forEach(([s,sd])=>P(sd+' Trunk Hinge','Gooseneck hinge.',box(0.2,0.04,0.03),[-1.55,0.94,s*0.55],[0.2,0,s*0.15]));
  P('Torsion Bars','Spring bars that lift the lid.',rod([-1.55,0.92,-0.5],[-1.55,0.92,0.5],0.005),[0.25,-0.15,0]);
  P('Lock Cylinder','Key cylinder.',cyl(0.015,0.015,0.04,'x'),[-2.19,0.85,0],[-0.3,0,0]);
  P('Trunk Latch','Latch that catches the striker.',box(0.06,0.05,0.08),[-2.15,0.8,0],[-0.2,-0.2,0]);
});

/* DOORS */
function door(front,s,sd){
  const x0=front?0.82:-0.14,x1=front?-0.14:-1.0,xc=(x0+x1)/2;
  const skin=front?poly([[x0,0.93],[x1,0.93],[x1,0.29],[x0,0.29]]):sh=>{sh.moveTo(x0,0.93);sh.lineTo(x1,0.93);sh.lineTo(x1,0.643);sh.absarc(-1.13,WY,0.37,1.212,0,true);sh.lineTo(x0,0.29);sh.closePath()};
  asm((front?'Front ':'Rear ')+sd+' Door',(front?'Front':'Rear')+' door, hinged at its front edge.',[0,0.1,s*1.1],P=>{
    P('Outer Skin','Stamped steel door skin.',side(skin,s*0.81),[0,0,s*0.3]);
    P('Inner Panel','Inner door structure.',side(skin,s*0.765),[0,0,0]);
    P('Door Trim Panel','Vinyl trim panel with armrest.',side(skin,s*0.73,0.02),[0,0,-s*0.25]);
    if(front){
      P('Window Glass','Tempered side glass.',side(poly([[0.78,0.95],[0.36,1.27],[-0.12,1.27],[-0.12,0.95]]),s*0.785,0.006),[0,0.5,0]);
      P('Front Window Sash','Frame along the pillar edge.',rod([0.8,0.94,s*0.785],[0.35,1.3,s*0.775],0.012),[0.1,0.75,0]);
      P('Upper Window Sash','Frame along the roof edge.',rod([0.35,1.3,s*0.775],[-0.13,1.3,s*0.775],0.012),[0,0.8,0]);
      P('Side Mirror','Door mounted mirror.',box(0.12,0.08,0.1),[0.72,1.0,s*0.88],[0.1,0.25,s*0.35]);
    }else{
      P('Window Glass','Tempered side glass.',side(poly([[-0.16,0.95],[-0.16,1.27],[-0.68,1.27],[-0.68,0.95]]),s*0.785,0.006),[0,0.5,0]);
      P('Vent Glass','Fixed rear quarter glass.',side(poly([[-0.71,0.95],[-0.71,1.27],[-0.75,1.27],[-0.98,0.96]]),s*0.785,0.006),[-0.15,0.45,0]);
      P('Division Bar','Channel between the glass and vent glass.',rod([-0.695,0.94,s*0.785],[-0.695,1.29,s*0.785],0.008),[0,0.3,s*0.15]);
      P('Upper Window Sash','Frame along the roof edge.',rod([-0.15,1.3,s*0.775],[-0.76,1.3,s*0.775],0.012),[0,0.8,0]);
      P('Rear Window Sash','Frame along the C pillar.',rod([-0.76,1.3,s*0.775],[-1.0,0.96,s*0.78],0.012),[-0.2,0.7,0]);
    }
    P('Window Regulator','Crank driven scissor regulator.',box(0.32,0.3,0.02),[xc,0.62,s*0.787],[0,0.15,s*0.15]);
    P('Window Crank','Hand crank for the regulator.',box(0.1,0.015,0.015),[xc,0.75,s*0.71],[0,0.1,-s*0.4]);
    P('Outside Handle','Pull up door handle.',box(0.14,0.03,0.03),[front?0.05:-0.86,front?0.77:0.8,s*0.83],[0,0.1,s*0.5]);
    P('Door Latch','Latch at the rear edge.',box(0.03,0.1,0.06),[x1+0.03,0.75,s*0.79],[-0.3,0,0]);
    P('Upper Hinge','Bolted door hinge.',box(0.06,0.06,0.04),[x0,0.8,s*0.79],[0.3,0.05,0]);
    P('Lower Hinge','Bolted door hinge.',box(0.06,0.06,0.04),[x0,0.45,s*0.79],[0.3,-0.05,0]);
  });
}
LR.forEach(([s,sd])=>{door(true,s,sd);door(false,s,sd)});

/* ENGINE: EK1 1751cc CVCC, transverse */
const EX=1.5,EZ=-0.12,CZ=[-0.165,-0.055,0.055,0.165];
asm('Engine','EK1 1751cc CVCC inline four, SOHC 12 valve, carbureted.',[1.8,0.8,-0.5],P=>{
  P('Cylinder Block','Cast iron block with four bores.',box(0.3,0.32,0.45),[EX,0.5,EZ],[0,0,0]);
  P('Head Gasket','Seals the head to the block.',box(0.3,0.008,0.45),[EX,0.663,EZ],[0,0.25,0]);
  P('Cylinder Head','Aluminum head with CVCC prechambers.',box(0.28,0.12,0.45),[EX,0.73,EZ],[0,0.4,0]);
  P('Camshaft','Single overhead cam, belt driven.',cyl(0.015,0.015,0.46,'z'),[EX,0.77,EZ],[0,0.58,0]);
  P('Valve Cover','Stamped cover over the cam and rockers.',box(0.22,0.07,0.44),[EX,0.83,EZ],[0,0.75,0]);

  P('Timing Belt','Toothed belt from crank to cam.',box(0.06,0.4,0.02),[EX,0.57,EZ-0.25],[0,0,-0.3]);
  P('Timing Belt Cover','Upper and lower belt covers.',box(0.12,0.45,0.03),[EX,0.57,EZ-0.28],[0,0,-0.45]);
  P('Crank Pulley','Drives the alternator and water pump belt.',cyl(0.07,0.07,0.03,'z'),[EX,0.38,EZ-0.3],[0,0,-0.6]);
  P('Water Pump','Belt driven coolant pump.',cyl(0.05,0.05,0.05,'z'),[EX+0.07,0.5,EZ-0.27],[0.2,0,-0.45]);
  P('Alternator','Charges the battery.',cyl(0.06,0.06,0.12,'z'),[EX+0.12,0.45,EZ-0.18],[0.4,-0.1,-0.3]);

  P('Starter Motor','Engages the flywheel ring gear.',cyl(0.045,0.045,0.18,'z'),[EX-0.18,0.4,EZ+0.34],[-0.35,-0.1,0.35]);
  P('Flywheel','Ring gear and clutch face.',cyl(0.13,0.13,0.03,'z'),[EX,0.38,EZ+0.25],[0,0,0.4]);
  P('Oil Filter','Spin on filter.',cyl(0.04,0.04,0.09,'x'),[EX+0.14,0.38,EZ+0.07],[0.4,-0.15,0]);
  P('Fuel Pump','Mechanical pump run off the cam.',box(0.06,0.06,0.05),[EX-0.2,0.62,EZ+0.17],[-0.35,0.1,0.15]);
},DX);

  P('Bellhousing','Bolts the transaxle to the engine.',cyl(0.16,0.14,0.1,'z'),[EX,0.4,0.27],[0,0,0.05]);
  P('Transmission Case','Aluminum gearbox case.',box(0.32,0.28,0.25),[EX-0.03,0.42,0.45],[0,0,0.25]);
  P('Mainshaft','Input shaft with drive gears.',cyl(0.025,0.025,0.24,'z'),[EX,0.38,0.45],[0,0.45,0.35]);

/* ============ 2007 TOYOTA PRIUS (NHW20) ============ */
function buildPrius(){
  const FA=1.345,RA=-1.355,PWY=0.31,PK=0.1,TF=0.753,TR=0.74,PX=1.6,PZ=-0.15;
  const tab=(t,x)=>{if(x>=t[0][0])return t[0][1];for(let i=1;i<t.length;i++){if(x>=t[i][0]){const[x0,y0]=t[i-1],[x1,y1]=t[i];return y0+(y1-y0)*(x-x0)/(x1-x0)}}return t[t.length-1][1]};
  /* profiles traced from the side and plan views, metres */
  const TOP=[[2.228,0.50],[2.207,0.62],[2.134,0.739],[1.933,0.849],[1.659,0.94],[1.386,0.995],[1.148,1.049],[0.747,1.214],[0.382,1.378],[0.017,1.469],[-0.257,1.496],[-0.622,1.496],[-0.987,1.469],[-1.352,1.378],[-1.717,1.287],[-1.99,1.214],[-2.118,1.177],[-2.173,1.086],[-2.209,0.80],[-2.228,0.62]];
  const BOT=[[2.228,0.44],[2.207,0.32],[2.134,0.25],[1.9,0.2],[-2.0,0.2],[-2.15,0.24],[-2.228,0.36]];
  const HW=[[2.228,0.42],[2.134,0.62],[2.024,0.73],[1.915,0.785],[1.805,0.82],[1.696,0.84],[1.586,0.858],[-1.589,0.858],[-1.698,0.82],[-1.808,0.80],[-1.917,0.785],[-2.027,0.75],[-2.136,0.69],[-2.228,0.62]];
  const BELT=[[1.15,0.97],[-0.3,0.99],[-1.0,1.02],[-1.6,1.05],[-2.1,1.07],[-2.228,1.07]];
  const RW=[[1.15,0.72],[0.4,0.63],[-0.3,0.61],[-1.2,0.6],[-2.1,0.55],[-2.228,0.55]];
  const ytop=x=>tab(TOP,x),ybot=x=>tab(BOT,x),hw=x=>tab(HW,x),rw=x=>tab(RW,x);
  const belt=x=>x>1.15?ytop(x):Math.min(tab(BELT,x),ytop(x));
  const gh=x=>Math.max(0,Math.min(1,(ytop(x)-belt(x))/0.12));
  const lerp=(a,b,t)=>a+(b-a)*t;
  function section(x){
    const t=ytop(x),b=ybot(x),w=hw(x),bl=belt(x),g=gh(x),r=rw(x);
    const sh=lerp(t-0.05,bl,g);
    const lo=[[0,b],[w*0.55,b],[w*0.9,b+0.015],[w,b+0.1],[w,(b+0.1+sh)/2]];
    const no=[[w*0.985,t-0.05],[w*0.95,t-0.03],[w*0.85,t-0.015],[w*0.55,t-0.004],[0,t]];
    const ye=[[w*0.985,bl],[w*0.93,bl+0.03],[r+0.04,t-0.06],[r*0.6,t-0.006],[0,t]];
    const up=no.map((p,i)=>[lerp(p[0],ye[i][0],g),lerp(p[1],ye[i][1],g)]);
    const c=new THREE.CatmullRomCurve3([...lo,...up].map(p=>V(p[0],p[1],0)),false,'centripetal');
    return c.getSpacedPoints(30).map(p=>[p.x,p.y]);
  }
  const NX=120,X0=2.228,X1=-2.228,ST=[];
  for(let i=0;i<=NX;i++){const x=X0+(X1-X0)*i/NX;ST.push({x,pts:section(x)})}
  const NU=ST[0].pts.length;
  const FD0=0.893,BP=-0.311,RD1=-0.987;
  function cls(x,y,az,ny,nz){
    for(const A of [FA,RA]){const dx=x-A,dy=y-PWY;if(az>0.45&&dx*dx+dy*dy<0.37*0.37)return null}
    if(ny<-0.7)return 'Underbody';
    const bl=belt(x),g=gh(x);
    if(ny>0.6&&x>1.15&&x<2.05&&az<hw(x)*0.78)return 'Hood';
    if(x>1.97||(x>1.72&&y<0.45))return 'Front Bumper Cover';
    if(x<-2.1&&y<0.62)return 'Rear Bumper Cover';
    if(x<-1.85&&y<0.5&&az>0.5)return 'Rear Bumper Cover';
    if(x<-2.12&&y>=0.62)return (y>0.8&&y<1.06)?'Hatch Lower Glass':'Hatch Panel';
    if(y>bl+0.01&&g>0.3){
      if(ny>0.55)return x>0.1?'Windshield':x>-0.95?'Roof Panel':'Hatch Glass';
      if(y>ytop(x)-0.07)return 'Roof Rail';
      if(x>FD0)return 'Front Quarter Glass';
      if(x>BP+0.02)return 'Front Door Glass';
      if(x>BP-0.02)return 'B Pillar';
      if(x>RD1+0.03)return 'Rear Door Glass';
      if(x>RD1-0.03)return 'C Pillar';
      if(x>-1.75)return 'Rear Quarter Glass';
      return 'D Pillar';
    }
    if(ny>0.6&&x>1.15)return 'Front Fender';
    if(x>FD0)return 'Front Fender';
    if(y<0.27&&x>RD1)return 'Rocker Panel';
    if(x>BP)return 'Front Door Skin';
    if(x>RD1)return 'Rear Door Skin';
    return 'Rear Quarter Panel';
  }
  const BUCK={};
  const add=(key,tri)=>{(BUCK[key]=BUCK[key]||[]).push(...tri)};
  [1,-1].forEach(s=>{
    const P3=(i,j)=>{const p=ST[i].pts[j];return V(ST[i].x,p[1],s*p[0])};
    for(let i=0;i<NX;i++)for(let j=0;j<NU-1;j++){
      const a=P3(i,j),b=P3(i+1,j),c=P3(i+1,j+1),d=P3(i,j+1);
      const n=new THREE.Vector3().crossVectors(b.clone().sub(a),d.clone().sub(a)).normalize();
      const ctr=a.clone().add(b).add(c).add(d).multiplyScalar(0.25);
      if(n.dot(ctr.clone().sub(V(ctr.x,0.7,0)))<0)n.negate();
      const k=cls(ctr.x,ctr.y,Math.abs(ctr.z),n.y,n.z);
      if(!k)continue;
      add(k+'|'+s,[a,b,c,a,c,d]);
    }
    /* end caps: nose and tail */
    [[0,'Front Bumper Cover'],[NX,'Rear Bumper Cover']].forEach(([i,key])=>{
      const x=ST[i].x,pts=ST[i].pts,ctr=V(x,(ytop(x)+ybot(x))/2,0);
      for(let j=0;j<NU-1;j++){const a=V(x,pts[j][1],s*pts[j][0]),b=V(x,pts[j+1][1],s*pts[j+1][0]);add((key==='Rear Bumper Cover'&&pts[j][1]>0.62?'Hatch Panel':key)+'|'+s,[ctr,a,b])}
    });
  });
  function geoOf(keys,dz=0){
    const arr=[];keys.forEach(k=>(BUCK[k]||[]).forEach(v=>arr.push(v.x,v.y,v.z+dz)));
    if(!arr.length)return null;
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
    g.computeBoundingBox();const c=new THREE.Vector3();g.boundingBox.getCenter(c);g.translate(-c.x,-c.y,-c.z);g.computeVertexNormals();
    return{geo:g,pos:c};
  }
  const both=n=>[n+'|1',n+'|-1'];

      P(sd+' Front Strut Tower','Tower that takes the top of the front strut.',cyl(0.1,0.13,0.3),[FA,0.72,s*0.6]);

let total=0;

function buildAll(){ASM.forEach((a,ai)=>{
  const c=V(0,0,0);a.parts.forEach(p=>c.add(p.pos));c.divideScalar(a.parts.length);a.center=c;
  a.group=new THREE.Group();a.group.position.copy(c);scene.add(a.group);
  let rad=0;
  a.parts.forEach((p,i)=>{
    total++;
    p.local=p.pos.clone().sub(c);
    if(!p.off){const d=p.local.clone(),l=d.length();p.off=l<0.02?V(0,0,0):d.normalize().multiplyScalar(0.2+l*1.3)}
    const col=PAL[(ai*3+i)%8];
    p.mat=new THREE.MeshStandardMaterial({color:col,transparent:true,opacity:1,roughness:1,metalness:0,flatShading:true,side:THREE.DoubleSide});
    p.mesh=new THREE.Mesh(p.geo,p.mat);p.mesh.userData.part=p;
    p.edges=new THREE.LineSegments(new THREE.EdgesGeometry(p.geo,20),new THREE.LineBasicMaterial({color:0x3d3d3d,transparent:true}));
    p.wf=new THREE.LineSegments(new THREE.WireframeGeometry(p.geo),new THREE.LineBasicMaterial({color:new THREE.Color(col).multiplyScalar(0.75),transparent:true,opacity:0.2}));
    p.node=new THREE.Group();p.node.add(p.mesh,p.edges,p.wf);p.node.position.copy(p.local);a.group.add(p.node);
    p.geo.computeBoundingSphere();
    rad=Math.max(rad,p.local.clone().add(p.off).length()+p.geo.boundingSphere.radius);
  });
  a.radius=rad;
});}

    const b=homeBox(selected),i=focus.parts.indexOf(selected)+1;
    head=[CAR.name+' / '+focus.name.toUpperCase(),selected.name];cardColor='#'+selected.mat.color.getHexString();
    typeOut('p'+focus.name+i,[row('ASSEMBLY',focus.name.toUpperCase()),row('PART',i+' OF '+focus.parts.length),row('SIZE',sizeTxt(b)),...locTxt(b),'',selected.desc.toUpperCase()].join('\n'));
  }else if(focus){
    const b=new THREE.Box3();focus.parts.forEach(p=>b.union(homeBox(p)));
    head=[CAR.name,focus.name];cardColor='#'+focus.parts[0].mat.color.getHexString();
    typeOut('a'+focus.name,[row('PARTS',focus.parts.length),row('SIZE',sizeTxt(b)),...locTxt(b),'',focus.desc.toUpperCase(),'','> TAP TO EXPLODE, TAP A PART TO INSPECT'].join('\n'));
  }else{typeKey=''}
  list.innerHTML='';
  (focus?focus.parts:ASM).forEach(it=>{
    const d=document.createElement('div');d.textContent=it.name;
    if(it===selected||(!focus&&it===focus))d.className='sel';
    d.onclick=()=>{if(focus){focus.target=1;selected=it;refresh()}else{carTarget=1;open(it)}};
    list.appendChild(d);
  });
}
function open(a){if(focus&&focus!==a)focus.target=0;focus=a;selected=null;refresh()}
function back(){
  if(selected){selected=null}
  else if(focus){focus.target=0;focus=null}
  else{carTarget=0}
  refresh();
}
function setWire(on){wire=on;document.getElementById('bWire').classList.toggle('on',on);refresh()}

document.getElementById('bBack').onclick=back;
document.getElementById('bLbl').onclick=e=>{labelsOn=!labelsOn;e.target.classList.toggle('on',labelsOn)};
document.getElementById('bInfo').onclick=e=>{infoOn=!infoOn;e.target.classList.toggle('on',infoOn)};
document.getElementById('bBP').onclick=e=>{showBP=!showBP;BP.forEach(m=>m.visible=showBP);e.target.classList.toggle('on',showBP)};
document.getElementById('bExplode').onclick=()=>{if(focus)focus.target=focus.target>0.5?0:1;else{carTarget=carTarget>0.5?0:1}};
document.getElementById('bWire').onclick=()=>setWire(!wire);
document.getElementById('bParts').onclick=e=>{const s=list.style.display==='block';list.style.display=s?'none':'block';e.target.classList.toggle('on',!s)};
document.getElementById('bReset').onclick=()=>{ASM.forEach(a=>a.target=0);carTarget=0;focus=null;selected=null;refresh()};
slide.oninput=()=>{const v=slide.value/100;if(focus){focus.target=v;focus.amt=v}else{carTarget=v;carAmt=v}};

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
let down=null;
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
canvas.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr,camera);
  const meshes=a=>a.parts.map(p=>p.mesh);
  if(focus){
    const hit=ray.intersectObjects(meshes(focus),false)[0];
    if(hit){
      if(focus.amt<0.5&&focus.target<0.5){focus.target=1;return}
      selected=hit.object.userData.part;refresh();return;
    }
  }
  const all=[];ASM.forEach(a=>{if(a!==focus)all.push(...meshes(a))});
  const hit=ray.intersectObjects(all,false)[0];
  if(!hit){if(selected){selected=null;refresh()}return}
  const a=hit.object.userData.part.asm;
  if(carAmt<0.5&&carTarget<0.5){carTarget=1;return}
  open(a);
});

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
function loadCar(id){
  carGen++;
  ASM.forEach(a=>{scene.remove(a.group);a.parts.forEach(p=>{p.geo.dispose();p.mat.dispose()})});ASM.length=0;
  LBL.forEach(sp=>{scene.remove(sp);sp.material.map.dispose()});LBL.clear();
  BP.forEach(m=>scene.remove(m));BP.length=0;
  total=0;focus=null;selected=null;carAmt=carTarget=0;typeKey='';
  CAR=CARS[id];CAR.build();buildAll();
  document.getElementById('bCar').textContent=CAR.btn;
  try{history.replaceState(null,'','#'+id)}catch(e){}
  refresh();
}
document.getElementById('bCar').onclick=()=>loadCar(CAR===CARS.prius?'accord':'prius');
loadCar(location.hash==='#accord'?'accord':'prius');

const goal=V(0,0,0);
(function loop(){
  requestAnimationFrame(loop);
  carAmt+=(carTarget-carAmt)*0.07;
  ASM.forEach(a=>{
    a.amt+=(a.target-a.amt)*0.08;
    a.group.position.copy(a.center).addScaledVector(a.dir,carAmt);
    a.parts.forEach(p=>p.node.position.copy(p.local).addScaledVector(p.off,a.amt));
  });
  if(!document.activeElement||document.activeElement!==slide)slide.value=Math.round((focus?focus.amt:carAmt)*100);
  controls.update();renderer.render(scene,camera);
})();
</script>
</body>
</html>
