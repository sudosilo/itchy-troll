<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const PI=Math.PI;
const PAL=[0x8db3d6,0xe9a074,0x9cc7a4,0xf0cd6e,0xb8a3d1,0x7cc0bb,0xe58e95,0xd2cbbd];
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf3f1ec);
const camera=new THREE.PerspectiveCamera(24,1,0.05,300);
camera.position.set(10,5.8,11.7);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;
controls.target.set(0,0.6,0);
scene.add(new THREE.HemisphereLight(0xffffff,0xd6d0c4,1.7));
const sun=new THREE.DirectionalLight(0xffffff,0.7);sun.position.set(5,10,7);scene.add(sun);
const grid=new THREE.GridHelper(30,60,0xe0dbd0,0xe9e5dc);grid.position.y=-0.002;scene.add(grid);
/* car models are built with +z on the car's right hand; mirroring z puts the driver on the left */
const ROOT=new THREE.Group();ROOT.scale.z=-1;scene.add(ROOT);

/* geometry helpers. car axes: x forward, y up, z toward the left side */
function box(w,h,d){return new THREE.BoxGeometry(w,h,d)}
function cyl(r1,r2,h,ax='y',seg=24){const g=new THREE.CylinderGeometry(r1,r2,h,seg);if(ax==='x')g.rotateZ(PI/2);if(ax==='z')g.rotateX(PI/2);return g}
function lathe(pts,ax='y',seg=40){const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);if(ax==='z')g.rotateX(PI/2);if(ax==='x')g.rotateZ(-PI/2);return g}
function ring(r1,r2,h,ax='y',seg=40){return lathe([[r1,-h/2],[r2,-h/2],[r2,h/2],[r1,h/2],[r1,-h/2]],ax,seg)}
function sph(r){return new THREE.SphereGeometry(r,12,8)}
function rz(g,a){g.rotateZ(a);return g}
function rod(a,b,r,seg=12){const A=V(...a),B=V(...b),d=B.clone().sub(A);const g=new THREE.CylinderGeometry(r,r,d.length(),seg);g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(V(0,1,0),d.clone().normalize()));return{geo:g,pos:A.clone().add(B).multiplyScalar(0.5)}}
function coil(r,h,turns,w){const pts=[],n=turns*20;for(let i=0;i<=n;i++){const t=i/n,a=t*turns*2*PI;pts.push(V(Math.cos(a)*r,t*h-h/2,Math.sin(a)*r))}return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),n,w,6,false)}
function side(build,z,t=0.03){const sh=new THREE.Shape();build(sh);const g=new THREE.ExtrudeGeometry(sh,{depth:t,bevelEnabled:false,curveSegments:24});g.computeBoundingBox();const c=new THREE.Vector3();g.boundingBox.getCenter(c);g.translate(-c.x,-c.y,-c.z);return{geo:g,pos:V(c.x,c.y,z)}}
const poly=pts=>sh=>{sh.moveTo(...pts[0]);pts.slice(1).forEach(p=>sh.lineTo(...p));sh.closePath()};
const WY=0.297;
/* split a polygon of Vector3 where f changes sign, so part edges follow a smooth line instead of the mesh grid */
function cut(pg,f){const A=[],Bo=[];for(let i=0;i<pg.length;i++){const p=pg[i],q=pg[(i+1)%pg.length],fp=f(p),fq=f(q);
  (fp<0?A:Bo).push(p);if((fp<0)!==(fq<0)){const t=fp/(fp-fq),m=p.clone().lerp(q,t);A.push(m);Bo.push(m.clone())}}
  return [A,Bo].filter(x=>x.length>=3)}
/* flat panel cut to an outline seen from above: pts are [x,z] pairs, y is the panel's middle height */
function plan(pts,y,t){const sh=new THREE.Shape();pts.forEach((p,i)=>i?sh.lineTo(...p):sh.moveTo(...p));sh.closePath();
  const g=new THREE.ExtrudeGeometry(sh,{depth:t,bevelEnabled:false});g.rotateX(PI/2);g.computeBoundingBox();const c=new THREE.Vector3();g.boundingBox.getCenter(c);g.translate(-c.x,-c.y,-c.z);c.y=y;return{geo:g,pos:c}}
/* rounded block: rounded rectangle in the z,y plane pushed along x, bevelled so the edges are soft */
function rbox(L,H,W,r){const sh=new THREE.Shape(),w=W/2-r,h=H/2-r;sh.moveTo(-w,-H/2+0);sh.lineTo(w,-H/2);sh.absarc(w,-h,r,-PI/2,0);sh.lineTo(W/2,h);sh.absarc(w,h,r,0,PI/2);sh.lineTo(-w,H/2);sh.absarc(-w,h,r,PI/2,PI);sh.lineTo(-W/2,-h);sh.absarc(-w,-h,r,PI,PI*1.5);
  const b=Math.min(r,L/2)*0.8,g=new THREE.ExtrudeGeometry(sh,{depth:Math.max(L-2*b,0.002),bevelEnabled:true,bevelSize:b*0.9,bevelThickness:b,bevelSegments:4,curveSegments:8});g.translate(0,0,-(L-2*b)/2);g.rotateY(PI/2);return g}
/* door mirror: base on the door, arm out to a housing, glass on the rear face. s is the side, z points outboard */
function mirror(P,base,hc,L,H,W,r,desc){
  const s=Math.sign(hc[2]),[bx,by,bz]=base,[hx,hy,hz]=hc;
  P('Mirror Base','Mount on the door frame.',rbox(0.07,0.05,0.025,0.008),[bx,by,bz],[0.05,0.2,s*0.25]);
  P('Mirror Arm','Arm from the base to the housing.',rod([bx,by,bz+s*0.012],[hx+L*0.1,hy-H*0.25,hz-s*W*0.38],0.016),[0.05,0.25,s*0.32]);
  P('Mirror Housing',desc,rbox(L,H,W,r),[hx,hy,hz],[0.1,0.3,s*0.45]);
  P('Mirror Glass','Flat glass, adjustable from inside.',box(0.006,H*0.8,W*0.86),[hx-L/2-0.003,hy,hz],[-0.15,0.3,s*0.45]);
}
function arc(r,h,start,len){const g=new THREE.CylinderGeometry(r,r,h,20,1,true,start,len);g.rotateX(PI/2);return g}

const ASM=[];
function asm(name,desc,dir,fn,dx=0,dy=0){
  const a={name,desc,dir:V(...dir),parts:[],amt:0,target:0};
  const P=(n,d,geo,pos,off)=>{
    if(!geo)return;
    if(geo.geo){off=pos;pos=geo.pos;geo=geo.geo}
    const v=pos.isVector3?pos.clone():V(...pos);v.x+=dx;v.y+=dy;a.parts.push({name:n,desc:d,geo,pos:v,off:off?V(...off):null,asm:a});
  };
  fn(P);ASM.push(a);
}
const LR=[[1,'Left'],[-1,'Right']];
const DX=0.07;

/* BLUEPRINT OVERLAY: 1982 Accord sedan drawing, scaled to mm */
let showBP=true;const BP=[];let carGen=0;
const tl=new THREE.TextureLoader();
function bp(file,w,h,setup){const gen=carGen;tl.load(file,t=>{if(gen!==carGen)return;t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:0.85,side:THREE.DoubleSide,depthWrite:false}));setup(m);m.visible=showBP;m.renderOrder=-1;ROOT.add(m);BP.push(m)})}
/* WHEEL PARTS shared by all four corners, drawn in hub units then scaled */
const K=0.0958;
const TIRE=[[2.2,-0.8],[2.75,-0.95],[3.05,-0.6],[3.1,0],[3.05,0.6],[2.75,0.95],[2.2,0.8]];
const WHEEL=[[0.5,0.25],[1.6,0.3],[1.9,0.1],[2.2,-0.7],[2.25,-0.8],[2.25,0.8],[2.2,0.7],[1.9,0.45],[1.6,0.45],[0.5,0.4]];
const CAP=[[0,0.55],[0.9,0.5],[1.3,0.35],[1.35,0.2],[1.3,0.15]];
function corner(P,cx,cz,s,k=K,wy=WY,lugs=4,lugR=0.71,td='165SR13 steel belted radial.',wd='13 inch steel wheel, 4 lug, 100 mm bolt circle.',ld='12 x 1.5 mm, 19 mm hex. About 80 ft lb in a star pattern.'){
  const K0=k;
  const sc=g=>{g.scale(K0,K0,K0*s);return g};
  const L=(pts,seg=48)=>sc(lathe(pts,'z',seg));
  const at=(x,y,z)=>[cx+x*K0,wy+y*K0,cz+z*K0*s];
  const o=(x,y,z)=>[x*K0,y*K0,z*K0*s];
  P('Tire',td,L(TIRE,64),at(0,0,0),o(0,0,9));
  P(lugs===5?'Alloy Wheel':'Steel Wheel',wd,L(WHEEL,64),at(0,0,0),o(0,0,7));
  P('Hub Cap','Snaps over the lug nuts.',L(CAP),at(0,0,0),o(0,0,10.5));
  for(let i=0;i<lugs;i++){const a=i*2*PI/lugs+PI/4;
    P('Lug Nut '+(i+1),ld,sc(cyl(0.16,0.16,0.3,'z',6)),at(Math.cos(a)*lugR,Math.sin(a)*lugR,0.95),o(Math.cos(a)*0.4,Math.sin(a)*0.4,6));}
  return{sc,L,at,o};
}

function buildAccord(){
/* GREENHOUSE: one lofted surface from the belt line over the roof, traced from the side, front and plan views.
   Glass, pillars and sashes are cut from it so every pane follows the tumblehome and roof crown. */
const GH=(()=>{
  const tab=(t,x)=>{if(x>=t[0][0])return t[0][1];for(let i=1;i<t.length;i++){if(x>=t[i][0]){const[x0,y0]=t[i-1],[x1,y1]=t[i];return y0+(y1-y0)*(x-x0)/(x1-x0)}}return t[t.length-1][1]};
  const X0=0.92,X1=-1.56;
  const TOPA=[[X0,0.935],[0.62,1.137],[0.42,1.27],[0.3,1.322],[0.15,1.34],[-0.5,1.347],[-0.85,1.342],[-0.96,1.33],[-1.05,1.29],[-1.27,1.153],[X1,0.975]];
  const ytop=x=>tab(TOPA,x),ybelt=x=>0.935+(X0-x)*0.0161;
  const NS=12,NT=18,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
  const curve=(pts,n)=>new THREE.CatmullRomCurve3(pts.map(p=>V(p[0],p[1],0)),false,'centripetal').getSpacedPoints(n).map(p=>[p.x,p.y]);
  function section(x){
    const t=ytop(x),b=ybelt(x),h=Math.max(t-b,0.0005),g=cl(h/0.37,0,1),c=0.04*cl(h/0.12,0,1);
    const r=Math.max(b+h*0.02,t-c),wb=0.785,wr=lerp(0.77,0.635,g);
    const sideC=curve([[wb,b],[lerp(wb,wr,0.5)+0.012*g,(b+r)/2],[wr,r]],NS);
    const topC=curve([[wr,r],[wr-0.03*g-0.005,r+c*0.55],[wr*0.55,t-c*0.1],[0,t]],NT);
    return [...sideC,...topC.slice(1)];
  }
  const XS=new Set();for(let i=0;i<=200;i++)XS.add(+(X0+(X1-X0)*i/200).toFixed(4));
  [0.34,-0.105,-0.175,-0.68,-0.71,-0.98].forEach(x=>XS.add(x));
  const XL=[...XS].sort((a,b)=>b-a),ST=XL.map(x=>({x,pts:section(x)})),NU=ST[0].pts.length;
  const cline=y=>-0.76-(1.29-y)*0.788;
  function cls(x,y,j){
    if(j>=NS){const jt=j-NS;
      if(x>0.34)return jt<2?'A Pillar':'Windshield';
      if(x<-0.98)return jt<2?'C Pillar':'Rear Window';
      return 'Roof Panel';}
    const cx=cline(y);
    if(x<cx)return 'C Pillar';
    if(x>-0.105)return j===NS-1?'Front Sash':'Front Glass';
    if(x>-0.175)return 'B Pillar';
    if(j===NS-1||x<cx+0.035)return 'Rear Sash';
    if(x>-0.68)return 'Rear Glass';
    if(x>-0.71)return 'Division Bar';
    return 'Vent Glass';
  }
  const B={};
  [1,-1].forEach(s=>{
    const Q=(i,j)=>{const p=ST[i].pts[j];return V(ST[i].x,p[1],s*p[0])};
    for(let i=0;i<ST.length-1;i++)for(let j=0;j<NU-1;j++){
      const a=Q(i,j),b=Q(i+1,j),c=Q(i+1,j+1),d=Q(i,j+1);
      if(j>=NS){const k=cls((a.x+c.x)/2,(a.y+b.y+c.y+d.y)/4,j)+'|'+s;(B[k]=B[k]||[]).push(a,b,c,a,c,d);continue}
      /* side glass quads are cut along the C pillar and rear sash lines so the edges run straight */
      let polys=[[a,b,c,d]];
      [0,0.035].forEach(o=>{const f=v=>v.x-cline(v.y)-o;polys=polys.flatMap(pg=>cut(pg,f))});
      polys.forEach(pg=>{if(pg.length<3)return;const m=pg.reduce((acc,v)=>acc.add(v),V(0,0,0)).multiplyScalar(1/pg.length);
        const k=cls(m.x,m.y,j)+'|'+s;for(let q=1;q<pg.length-1;q++)(B[k]=B[k]||[]).push(pg[0],pg[q],pg[q+1])});
    }
  });
  return keys=>{
    const arr=[];keys.forEach(k=>(B[k]||[]).forEach(v=>arr.push(v.x,v.y,v.z)));
    if(!arr.length)return null;
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
    g.computeBoundingBox();const c=new THREE.Vector3();g.boundingBox.getCenter(c);g.translate(-c.x,-c.y,-c.z);g.computeVertexNormals();
    return{geo:g,pos:c};
  };
})();
const GB=n=>[n+'|1',n+'|-1'];
/* BODY: traced from the 1982 Accord sedan blueprint. front axle x 1.32, rear axle x -1.13 */
asm('Body Shell','Welded steel unibody. Everything else bolts to it.',[0,0,0],P=>{
  P('Floor Pan','Stamped steel floor, the base of the unibody. Narrows between the rear wheel wells.',plan([[0.86,-0.66],[0.86,0.66],[-0.78,0.66],[-0.82,0.5],[-1.25,0.5],[-1.25,-0.5],[-0.82,-0.5],[-0.78,-0.66]],0.24,0.035));
  P('Trunk Floor','Raised floor over the fuel tank, notched around the rear wheel wells.',plan([[-1.295,-0.5],[-1.295,0.5],[-1.56,0.5],[-1.6,0.66],[-2.145,0.66],[-2.145,-0.66],[-1.6,-0.66],[-1.56,-0.5]],0.42,0.03));
  P('Firewall','Bulkhead between the engine bay and the cabin.',box(0.035,0.5,1.45),[0.9,0.62,0]);
  P('Cowl Panel','Panel under the windshield with the fresh air intake.',box(0.25,0.03,1.4),[1.0,0.9,0]);

/* ============ 2007 TOYOTA PRIUS (NHW20) ============ */
function buildPrius(){
  const FA=1.345,RA=-1.355,PWY=0.31,PK=0.1,TF=0.753,TR=0.74,PX=1.6,PZ=-0.15;
  const tab=(t,x)=>{if(x>=t[0][0])return t[0][1];for(let i=1;i<t.length;i++){if(x>=t[i][0]){const[x0,y0]=t[i-1],[x1,y1]=t[i];return y0+(y1-y0)*(x-x0)/(x1-x0)}}return t[t.length-1][1]};
  /* profiles traced from the side and plan views, metres */
  const TOP=[[2.228,0.50],[2.207,0.62],[2.134,0.739],[1.933,0.849],[1.659,0.94],[1.386,0.995],[1.148,1.049],[0.747,1.214],[0.382,1.378],[0.017,1.469],[-0.257,1.496],[-0.622,1.496],[-0.987,1.469],[-1.352,1.378],[-1.717,1.287],[-1.99,1.214],[-2.118,1.177],[-2.173,1.086],[-2.209,0.80],[-2.228,0.62]];
  const BOT=[[2.228,0.44],[2.207,0.32],[2.134,0.25],[1.9,0.2],[-2.0,0.2],[-2.15,0.24],[-2.228,0.36]];
  const HW=[[2.228,0.42],[2.134,0.62],[2.024,0.73],[1.915,0.785],[1.805,0.82],[1.696,0.84],[1.586,0.858],[-1.589,0.858],[-1.698,0.82],[-1.808,0.80],[-1.917,0.785],[-2.027,0.75],[-2.136,0.69],[-2.228,0.62]];
  const BELT=[[1.15,0.97],[-0.3,0.99],[-1.0,1.02],[-1.6,1.05],[-2.1,1.07],[-2.228,1.07]];
  const RW=[[1.15,0.72],[0.4,0.63],[-0.3,0.61],[-1.2,0.6],[-2.1,0.55],[-2.228,0.55]];
  const ytop=x=>tab(TOP,x),ybot=x=>tab(BOT,x),hw=x=>tab(HW,x),rw=x=>tab(RW,x);
  const belt=x=>x>1.15?ytop(x):Math.min(tab(BELT,x),ytop(x));
  const gh=x=>Math.max(0,Math.min(1,(ytop(x)-belt(x))/0.12));
  const lerp=(a,b,t)=>a+(b-a)*t;
  /* section split into zones so panel seams follow grid lines:
     bot = underside, side = body side, up = shoulder to roof edge (side glass), top = roof or hood surface */
  const NB=10,NS=22,NUP=14,NT=14,RK=3;
  function section(x){
    const t=ytop(x),b=ybot(x),w=hw(x),bl=belt(x),g=gh(x),r=rw(x);
    const sh=lerp(t-0.05,bl,g);
    const S=[w*0.985,sh];
    const E=[lerp(w*0.95,r+0.04,g),lerp(t-0.03,t-0.06,g)];
    const seg=(pts,n,skip)=>{const c=new THREE.CatmullRomCurve3(pts.map(p=>V(p[0],p[1],0)),false,'centripetal');const o=c.getSpacedPoints(n).map(p=>[p.x,p.y]);return skip?o.slice(1):o};
    const bot=seg([[0,b],[w*0.55,b],[w*0.9,b+0.015]],NB,false);
    const side=seg([[w*0.9,b+0.015],[w,b+0.1],[w,(b+0.1+sh)/2],S],NS,true);
    const up=seg([S,[lerp(w*0.97,w*0.93,g),lerp(t-0.04,bl+0.03,g)],E],NUP,true);
    const top=seg([E,[lerp(w*0.85,r*0.85,g),lerp(t-0.015,t-0.03,g)],[lerp(w*0.55,r*0.6,g),lerp(t-0.004,t-0.006,g)],[0,t]],NT,true);
    return [...bot,...side,...up,...top];
  }
  const J1=NB,J2=NB+NS,J3=NB+NS+NUP;
  const zone=j=>j<J1?'bot':j<J2?'side':j<J3?'up':'top';
  const FD0=0.893,BP=-0.311,RD1=-0.987;
  const XS=new Set();for(let i=0;i<=240;i++)XS.add(+(2.228-4.456*i/240).toFixed(4));
  [2.05,1.97,1.85,1.15,FD0,0.1,BP+0.02,BP-0.02,RD1+0.03,RD1-0.03,-0.95,-1.75,-1.85,-2.1,-2.12].forEach(x=>XS.add(x));
  const XL=[...XS].sort((a,b)=>b-a),ST=XL.map(x=>({x,pts:section(x)})),NX=ST.length-1,NU=ST[0].pts.length;
  const hlLow=x=>0.93-(x-1.5)*0.42,hlIn=x=>0.66-(x-1.5)*0.24,hlTop=x=>ytop(x)-0.012;
  function cls(x,y,j,az){
    const z=zone(j),g=gh(x);
    if(z==='bot')return x>1.97?'Front Bumper Cover':x<-2.1?'Rear Bumper Cover':'Underbody';
    if(z!=='bot'&&x>1.5&&x<2.23&&az>hlIn(x)&&y>hlLow(x)&&y<hlTop(x))return 'Headlight';
    if(x<-2.12&&y>=0.62)return (y>0.8&&y<1.06)?'Hatch Lower Glass':'Hatch Panel';
    if(x<-2.1&&y<0.62)return 'Rear Bumper Cover';
    if(z==='top'){
      if(x>1.15)return x<2.05?'Hood':'Front Bumper Cover';
      return x>0.1?'Windshield':x>-0.95?'Roof Panel':'Hatch Glass';
    }
    if(z==='up'){
      if(x>=1.15||g<0.3)return x>1.97?'Front Bumper Cover':'Front Fender';
      if(x>FD0)return 'Front Quarter Glass';
      if(x>BP+0.02)return 'Front Door Glass';
      if(x>BP-0.02)return 'B Pillar';
      if(x>RD1+0.03)return 'Rear Door Glass';
      if(x>RD1-0.03)return 'C Pillar';
      if(x>-1.75)return 'Rear Quarter Glass';
      return 'D Pillar';
    }
    if(x>1.97||(x>1.85&&y<0.42))return 'Front Bumper Cover';
    if(x<-1.85&&y<0.5)return 'Rear Bumper Cover';
    if(x>FD0)return 'Front Fender';
    if(j<J1+RK&&x>RD1)return 'Rocker Panel';
    if(x>BP)return 'Front Door Skin';
    if(x>RD1)return 'Rear Door Skin';
    return 'Rear Quarter Panel';
  }
  const AR=0.37,BUCK={};
  const add=(key,tri)=>{(BUCK[key]=BUCK[key]||[]).push(...tri)};
  const inArch=v=>{for(const A of [FA,RA]){const dx=v.x-A,dy=v.y-PWY;if(Math.abs(v.z)>0.4&&dx*dx+dy*dy<AR*AR)return A}return null};
  const snap=v=>{const A=inArch(v);if(A===null)return v;const dx=v.x-A,dy=v.y-PWY;if(dy<0.12)return V(A+(dx<0?-1:1)*Math.sqrt(AR*AR-dy*dy),v.y,v.z);const l=Math.hypot(dx,dy)||1;return V(A+dx/l*AR,PWY+dy/l*AR,v.z)};
  [1,-1].forEach(s=>{
    const P3=(i,j)=>{const p=ST[i].pts[j];return V(ST[i].x,p[1],s*p[0])};
    for(let i=0;i<NX;i++)for(let j=0;j<NU-1;j++){
      let a=P3(i,j),b=P3(i+1,j),c=P3(i+1,j+1),d=P3(i,j+1);
      const ctr=a.clone().add(b).add(c).add(d).multiplyScalar(0.25);
      const zj=zone(j);
      if(zj==='bot'||zj==='side'){if([a,b,c,d].every(v=>inArch(v)!==null))continue;a=snap(a);b=snap(b);c=snap(c);d=snap(d)}
      if(Math.max(a.x,b.x,c.x,d.x)>1.45&&zj!=='bot'){
        /* headlight lens: cut along its lower, inner and hood edge lines */
        let polys=[[a,b,c,d]];
        [v=>v.y-hlLow(v.x),v=>Math.abs(v.z)-hlIn(v.x),v=>hlTop(v.x)-v.y].forEach(f=>{polys=polys.flatMap(pg=>cut(pg,f))});
        polys.forEach(pg=>{const m=pg.reduce((acc,v)=>acc.add(v),V(0,0,0)).multiplyScalar(1/pg.length);const kk=cls(m.x,m.y,j,Math.abs(m.z));
          if(kk)for(let q=1;q<pg.length-1;q++)add(kk+'|'+s,[pg[0],pg[q],pg[q+1]])});
        continue;
      }
      const k=cls(ctr.x,ctr.y,j,Math.abs(ctr.z));
      if(!k)continue;
      add(k+'|'+s,[a,b,c,a,c,d]);
    }
    [[0,'Front Bumper Cover'],[NX,'Rear Bumper Cover']].forEach(([i,key])=>{
      const x=ST[i].x,pts=ST[i].pts,ctr=V(x,(ytop(x)+ybot(x))/2,0);
      for(let j=0;j<NU-1;j++){const a=V(x,pts[j][1],s*pts[j][0]),b=V(x,pts[j+1][1],s*pts[j+1][0]);add((key==='Rear Bumper Cover'&&pts[j][1]>0.62?'Hatch Panel':key)+'|'+s,[ctr,a,b])}
    });
  });
  function geoOf(keys,dz=0){
    const arr=[];keys.forEach(k=>(BUCK[k]||[]).forEach(v=>arr.push(v.x,v.y,v.z+dz)));
    if(!arr.length)return null;
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
    g.computeBoundingBox();const c=new THREE.Vector3();g.boundingBox.getCenter(c);g.translate(-c.x,-c.y,-c.z);g.computeVertexNormals();
    return{geo:g,pos:c};
  }

function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

let SPECS=[],TREE=[];
const STOP=/^(left|right|front|rear|upper|lower|inner|outer|lh|rh|assembly|assy|\d+)$/i;
function keyWords(n){return n.replace(/[^A-Za-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.test(w))}
function scorePath(path,words){const t=path.toLowerCase();let s=0;words.forEach((w,i)=>{if(t.includes(w.toLowerCase()))s+=i===words.length-1?3:1});return s}
function archiveFor(p){
  const words=keyWords(p.name);if(!words.length)return{specs:[],pages:[]};
  const need=3;
  const specs=SPECS.map(e=>[scorePath(e.path+' '+e.title,words),e]).filter(x=>x[0]>=need).sort((a,b)=>b[0]-a[0]).slice(0,8).map(x=>x[1]);
  const pages=TREE.map(t=>[scorePath(t,words),t]).filter(x=>x[0]>=need&&!/Diagnostic Trouble Codes|Technical Service Bulletins/.test(x[1])).sort((a,b)=>b[0]-a[0]||a[1].length-b[1].length).slice(0,14).map(x=>x[1]);
  return{specs,pages};
}

(function(){const box=document.getElementById('paint');
  box.innerHTML=PAINTS.map(([n,c])=>'<button title="'+n+'" aria-label="'+n+'"'+(c===null?' class="multi">Multi':' style="background:#'+c.toString(16).padStart(6,'0')+'">')+'</button>').join('')+'<span id="paintName"></span>';
  box.querySelectorAll('button').forEach((b,i)=>b.onclick=e=>{e.stopPropagation();paint=PAINTS[i][1];try{localStorage.setItem('hubPaint',String(paint))}catch(x){}applyPaint()});
  document.getElementById('bPaint').onclick=()=>{box.classList.toggle('open');document.getElementById('bPaint').classList.toggle('on',box.classList.contains('open'))};
})();
/* CAR PICKER: makes with their models nested underneath */
const LINEUP=[['Ford',[['crownvic','2006 Crown Victoria Police Interceptor'],['crownvic_lx','2006 Crown Victoria LX']]],['Honda',[['accord','1982 Accord'],['accord2011','2011 Accord 2.4L four cylinder','Model in progress, manual archive loading'],['accord2011v6','2011 Accord 3.5L V6','Model in progress, manual archive loading']]],['Toyota',[['prius','2007 Prius']]]];
const openMk=new Set();
function drawCars(){
  const box=document.getElementById('cars');box.innerHTML='';
  LINEUP.forEach(([mk,models])=>{
    const h=document.createElement('div');h.className='mk';const isOpen=openMk.has(mk)||models.some(m=>CAR&&m[0]===CAR.id);
    h.innerHTML='<span>'+esc(mk)+'</span><span>'+(isOpen?'&#9662;':'&#9656;')+'</span>';
    h.onclick=e=>{e.stopPropagation();openMk.has(mk)?openMk.delete(mk):openMk.add(mk);drawCars()};box.appendChild(h);
    if(!isOpen)return;
    models.forEach(([id,label,note])=>{const d=document.createElement('div');const ok=!!CARS[id];
      d.className='md'+(CAR&&CAR.id===id?' sel':'')+(ok?'':' off');d.innerHTML=esc(label)+(note&&!ok?'<small>'+esc(note)+'</small>':'');
      if(ok)d.onclick=e=>{e.stopPropagation();box.classList.remove('open');document.getElementById('bCar').classList.remove('on');if(CAR.id!==id)loadCar(id)};
      box.appendChild(d)});
  });
}
document.getElementById('bCar').onclick=e=>{e.stopPropagation();const box=document.getElementById('cars');drawCars();box.style.bottom=(document.getElementById('bar').offsetHeight+6)+'px';box.classList.toggle('open');document.getElementById('bCar').classList.toggle('on',box.classList.contains('open'))};
['pointerdown','touchstart'].forEach(ev=>document.getElementById('cars').addEventListener(ev,e=>e.stopPropagation()));
loadCar(CARS[location.hash.slice(1)]?location.hash.slice(1):'prius');

const goal=V(0,0,0);
(function loop(){
  requestAnimationFrame(loop);
  carAmt+=(carTarget-carAmt)*0.07;
  ASM.forEach(a=>{
    a.amt+=(a.target-a.amt)*0.08;
    a.group.position.copy(a.center).addScaledVector(a.dir,carAmt);
    a.parts.forEach(p=>p.node.position.copy(p.local).addScaledVector(p.off,a.amt));
  });
  if(!document.activeElement||document.activeElement!==slide)slide.value=Math.round((focus?focus.amt:carAmt/(extra?EXTRA_SPREAD:1))*100);
  LBL.forEach(sp=>sp.visible=false);
  const pts=[];
  if(labelsOn&&!selected){
    const cr=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0),wp=new THREE.Vector3();
    const items=focus?focus.parts.map(p=>[p,p.node]):(carAmt>0.3?ASM.map(a=>[{name:a.name,mat:a.parts[0].mat},a.group]):[]);
    const h=focus?Math.min(0.08,Math.max(0.035,focus.radius*0.03)):0.09;
    items.forEach(([o,node])=>{const key=focus?o:node;const sp=LBL.get(key)||label(o,key);node.getWorldPosition(wp);const lp=wp.clone().add(V(0,h*2.2,0)).addScaledVector(cr,h*1.2);sp.position.copy(lp);sp.scale.set(h*sp.userData.aspect,h,1);sp.visible=true;pts.push(wp.clone(),lp)});
  }
  callLines.geometry.setFromPoints(pts);callLines.visible=pts.length>0;
  const tgt=infoOn&&(selected?selected.node:focus?focus.group:null);
  sprite.visible=leader.visible=!!tgt;
  if(tgt){
    if(typeN<typeText.length){typeN=Math.min(typeText.length,typeN+4);typedAt=performance.now()}
    drawCard();
    const bb=new THREE.Box3().setFromObject(tgt),c=new THREE.Vector3(),sz=new THREE.Vector3();bb.getCenter(c);bb.getSize(sz);
    const W=Math.min(1.3,Math.max(0.5,Math.max(sz.x,sz.z)*0.7));
    sprite.scale.set(W,W*card.height/card.width,1);
    const top=V(c.x,bb.max.y,c.z),at=V(c.x,bb.max.y+0.2+W*0.15,c.z);
    sprite.position.copy(at);
    leader.geometry.setFromPoints([top,at]);
  }
  controls.update();renderer.render(scene,camera);
})();
</script>
</body>
