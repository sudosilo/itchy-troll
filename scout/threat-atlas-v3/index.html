<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>THREAT ATLAS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#060e1f; --surface:#0d1730; --border:#2a3a5c;
  --espionage:#22e5ff; --ransomware:#ffaa00; --infrastructure:#ff3d6b;
  --supply:#d966ff; --hacktivism:#44ff77; --unknown:#6a7a8e;
  --text:#d8eaff; --dim:#6a80a0; --accent:#22e5ff;
  --conf:#ffe844; --defense:#ff8855; --gov:#55ff99;
  --sat:#cc88ff; --statecol:#33bbff; --base:#ff4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;display:flex;flex-direction:column;}

header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;gap:6px;}
.logo{font-family:'Orbitron',monospace;font-weight:900;font-size:13px;letter-spacing:4px;color:var(--accent);text-shadow:0 0 16px var(--accent),0 0 30px rgba(34,229,255,0.3);white-space:nowrap;}
.logo span{color:#fff;}
.stat-pills{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.pill{font-size:8px;padding:2px 6px;border-radius:3px;border:1px solid;letter-spacing:1px;white-space:nowrap;}

.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
.tab{flex:1;padding:8px 0;text-align:center;font-size:9px;letter-spacing:1px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;text-transform:uppercase;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);text-shadow:0 0 8px var(--accent);}

.view{display:none;flex:1;overflow:hidden;flex-direction:column;}
.view.active{display:flex;}

/* GLOBE */
#globe-view{position:relative;}
#globe-container{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
#globe-container svg{cursor:grab;touch-action:none;}
#globe-container svg:active{cursor:grabbing;}

/* LAYER TOGGLES */
.layer-bar{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;z-index:50;}
.layer-lbl{font-size:7px;color:var(--dim);letter-spacing:2px;margin-bottom:1px;}
.layer-btn{font-size:8px;padding:4px 8px;border-radius:3px;border:1px solid;cursor:pointer;letter-spacing:1px;background:rgba(6,14,31,0.88);font-family:'Share Tech Mono',monospace;transition:all .15s;white-space:nowrap;opacity:0.42;}
.layer-btn.on{opacity:1;box-shadow:0 0 8px currentColor;}

/* LEGEND */
.legend{position:absolute;bottom:10px;left:8px;background:rgba(6,14,31,0.93);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:8px;letter-spacing:1px;backdrop-filter:blur(4px);}
.legend-title{color:var(--dim);margin-bottom:6px;font-size:7px;letter-spacing:2px;}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.legend-label{color:var(--text);font-size:7px;}

/* YEAR BAR */
.year-bar{position:absolute;bottom:10px;right:8px;background:rgba(6,14,31,0.93);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:8px;letter-spacing:1px;backdrop-filter:blur(4px);min-width:130px;}
.year-label{color:var(--dim);font-size:7px;letter-spacing:2px;margin-bottom:4px;}
.year-value{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:var(--accent);text-shadow:0 0 12px var(--accent);margin-bottom:4px;}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;}
.year-note{color:var(--dim);font-size:7px;margin-top:3px;}

/* TOOLTIP */
#tooltip{position:absolute;background:rgba(6,14,31,0.97);border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:9px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:100;max-width:200px;backdrop-filter:blur(8px);}
#tooltip.show{opacity:1;}
.tt-country{font-family:'Orbitron',monospace;font-size:11px;color:#fff;margin-bottom:5px;font-weight:700;}
.tt-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:2px;}
.tt-key{color:var(--dim);font-size:8px;}
.tt-val{color:var(--text);text-align:right;font-size:8px;}
.tt-cats{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
.tt-cat{font-size:7px;padding:2px 4px;border-radius:2px;border:1px solid;letter-spacing:1px;}

/* DETAIL PANEL */
#detail-panel{position:absolute;top:0;right:-100%;width:min(290px,92vw);height:100%;background:var(--surface);border-left:1px solid var(--border);transition:right .3s ease;z-index:200;overflow-y:auto;padding:14px 12px;}
#detail-panel.open{right:0;}
#panel-backdrop{position:absolute;top:0;left:0;right:0;bottom:0;z-index:199;display:none;}
#panel-backdrop.show{display:block;}
.panel-close{position:absolute;top:10px;right:10px;background:none;border:1px solid var(--border);color:var(--dim);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:11px;padding:3px 8px;border-radius:3px;}
.panel-close:hover{color:var(--text);border-color:var(--text);}
.panel-country{font-family:'Orbitron',monospace;font-weight:900;font-size:13px;color:#fff;margin-bottom:3px;padding-right:36px;line-height:1.3;}
.panel-count{color:var(--dim);font-size:9px;letter-spacing:2px;margin-bottom:12px;}
.incident-card{background:rgba(0,0,0,0.35);border:1px solid var(--border);border-left:3px solid;border-radius:4px;padding:8px 10px;margin-bottom:8px;}
.inc-name{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;color:#fff;margin-bottom:3px;}
.inc-actor{color:var(--accent);font-size:8px;letter-spacing:1px;margin-bottom:5px;}
.inc-meta{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px;}
.inc-tag{font-size:7px;padding:2px 4px;border-radius:2px;border:1px solid var(--border);color:var(--dim);letter-spacing:1px;}
.inc-desc{font-size:8px;color:#99b0cc;line-height:1.5;}
.inc-date{font-size:7px;color:var(--dim);margin-top:4px;}
.panel-section{font-size:8px;letter-spacing:2px;color:var(--dim);margin:12px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px;}
.marker-card{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:4px;padding:8px 10px;margin-bottom:6px;}
.mc-name{font-size:9px;color:#fff;font-weight:bold;margin-bottom:2px;}
.mc-sub{font-size:8px;color:#99b0cc;line-height:1.4;}

/* LIST VIEW */
#list-view{flex-direction:column;}
.search-bar{padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.search-bar input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:11px;padding:7px 11px;outline:none;letter-spacing:1px;}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 8px rgba(34,229,255,0.25);}
.search-bar input::placeholder{color:var(--dim);}
.filter-row{display:flex;gap:5px;padding:7px 12px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;}
.filter-btn{font-size:7px;padding:3px 7px;border-radius:3px;border:1px solid;cursor:pointer;white-space:nowrap;letter-spacing:1px;background:none;font-family:'Share Tech Mono',monospace;transition:all .15s;opacity:0.45;}
.filter-btn.active{opacity:1;}
#list-container{flex:1;overflow-y:auto;padding:8px 12px;}
.list-item{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-left:3px solid;border-radius:4px;padding:8px 10px;margin-bottom:7px;cursor:pointer;transition:background .15s;}
.list-item:hover{background:rgba(34,229,255,0.06);}
.li-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:3px;}
.li-name{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;color:#fff;}
.li-year{font-size:8px;color:var(--dim);white-space:nowrap;}
.li-actor{font-size:8px;color:var(--accent);margin-bottom:3px;}
.li-country{font-size:7px;color:var(--dim);}
.li-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px;}

/* US STATES VIEW */
#states-view{flex-direction:column;}
#states-map-container{flex:1;overflow:hidden;position:relative;background:var(--bg);}
#states-svg{width:100%;height:100%;}
.state-tooltip{position:absolute;background:rgba(6,14,31,0.97);border:1px solid var(--border);border-radius:5px;padding:8px 11px;font-size:9px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:100;max-width:220px;}
.state-tooltip.show{opacity:1;}

/* SATELLITES */
@keyframes orbitSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.sat-orbit{fill:none;stroke-dasharray:3,4;}
.sat-dot{cursor:pointer;}

/* PULSE */
@keyframes pulse{0%{r:4;opacity:.9;}70%{r:11;opacity:0;}100%{r:4;opacity:0;}}
.pulse-ring{animation:pulse 2.2s infinite;}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
body::after{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.02) 2px,rgba(0,0,0,0.02) 4px);pointer-events:none;z-index:9999;}
.globe-hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:7px;color:var(--dim);letter-spacing:2px;pointer-events:none;white-space:nowrap;}
</style>
</head>

    <div class="panel-count" id="panel-count"></div>

</div>

<!-- ═══ LIST VIEW ═══ -->
<div id="list-view" class="view">

</div>

function getFiltered(){return THREATS.filter(t=>{
  if(activeYear&&parseInt(t.date.slice(0,4))>activeYear)return false;
  if(activeCategory&&t.category!==activeCategory)return false;
  if(searchQuery){const q=searchQuery.toLowerCase();return t.name.toLowerCase().includes(q)||t.actor.toLowerCase().includes(q)||t.country.toLowerCase().includes(q)||(t.malware||[]).some(m=>m.toLowerCase().includes(q))||t.desc.toLowerCase().includes(q);}
  return true;
});}
function getCountryData(n){return getFiltered().filter(t=>t.country===n);}
function getDominant(inc){if(!inc.length)return null;const c={};inc.forEach(i=>c[i.category]=(c[i.category]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];}
function getColor(numId){const code=NUM_TO_CODE[numId];if(!code)return '#0e1f3a';const n=getCountryData(CODE_TO_COUNTRY[code]);if(!n.length)return '#0e1f3a';return CAT_COLOR[getDominant(n)]||CAT_COLOR.unknown;}
function getOpacity(numId){const code=NUM_TO_CODE[numId];if(!code)return 0;const n=getCountryData(CODE_TO_COUNTRY[code]);if(!n.length)return 0;return 0.3+(Math.max(...n.map(i=>i.sophistication))/5)*0.5;}

function renderStats(){
  const f=getFiltered();
  const actors=new Set(f.map(t=>t.actor)).size;
  document.getElementById('stat-pills').innerHTML=`
    <div class="pill" style="color:#22e5ff;border-color:#22e5ff33">${f.length} INCIDENTS</div>
    <div class="pill" style="color:#ffaa00;border-color:#ffaa0033">${actors} ACTORS</div>
    <div class="pill" style="color:#d966ff;border-color:#d966ff33">${new Set(f.map(t=>t.country)).size} NATIONS</div>`;
}

function buildCountryPanel(country){
  const incidents=getCountryData(country);
  let html='';
  if(incidents.length){
    html+=incidents.sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`
      <div class="incident-card" style="border-left-color:${CAT_COLOR[t.category]}">
        <div class="inc-name">${t.name}</div>
        <div class="inc-actor">${t.actor}</div>
        <div class="inc-meta"><span class="inc-tag">${CAT_LABEL[t.category]}</span><span class="inc-tag">SOPH ${t.sophistication}/5</span><span class="inc-tag">${t.confidence} CONF</span></div>
        <div class="inc-desc">${t.desc}</div>
        ${t.platforms?.length?`<div class="inc-date">PLATFORMS: ${t.platforms.join(', ')}</div>`:''}
        ${t.malware?.length?`<div class="inc-date">MALWARE: ${t.malware.join(', ')}</div>`:''}
        <div class="inc-date">${t.date}</div>
      </div>`).join('');
  }
  // Defense firms in this country
  if(layers.defense){
    const firms=DEFENSE_FIRMS.filter(f=>matchCountry(f.hq,country));
    if(firms.length){html+=`<div class="panel-section">DEFENSE / CYBER FIRMS</div>`;html+=firms.map(f=>`<div class="marker-card"><div class="mc-name" style="color:var(--defense)">${f.name}</div><div class="mc-sub">${f.type} · ${f.hq}</div><div class="mc-sub">${f.desc}</div></div>`).join('');}
  }
  if(layers.usgov&&country==='United States'){html+=`<div class="panel-section">US GOV CYBER ENTITIES</div>`;html+=US_GOV.map(u=>`<div class="marker-card"><div class="mc-name" style="color:var(--gov)">${u.name}</div><div class="mc-sub">${u.type} · ${u.location}</div><div class="mc-sub">${u.desc}</div></div>`).join('');}
  if(layers.bases){
    const bases=US_BASES.filter(b=>b.country.toLowerCase().includes(country.toLowerCase())||(country==='United States'&&(b.country.includes('Hawaii')||b.country.includes('Guam'))));
    if(bases.length){html+=`<div class="panel-section">US MILITARY BASES IN/NEAR ${country.toUpperCase()}</div>`;html+=bases.map(b=>`<div class="marker-card"><div class="mc-name" style="color:var(--base)">✦ ${b.name}</div><div class="mc-sub">${b.command} · ${b.branch}</div><div class="mc-sub">${b.desc}</div></div>`).join('');}
  }
  if(layers.satellites){
    const sats=SATELLITES.filter(s=>s.owner===country||(country==='United States'&&s.owner==='USA'));
    if(sats.length){html+=`<div class="panel-section">SATELLITE ASSETS</div>`;html+=sats.map(s=>`<div class="marker-card"><div class="mc-name" style="color:var(--sat)">◎ ${s.name}</div><div class="mc-sub">${s.type} · ${s.orbit} orbit</div><div class="mc-sub">${s.desc}</div></div>`).join('');}
  }
  const subtitle=incidents.length?`${incidents.length} KNOWN INCIDENT${incidents.length>1?'S':''}`:layers.satellites||layers.defense||layers.bases?'ASSOCIATED ASSETS':'NO INCIDENTS';
  openPanel(country.toUpperCase(),subtitle,html);
}

function matchCountry(hq,country){
  const m={Russia:'Russia',China:'China','North Korea':'Korea','United States':['TX','VA','MD','CA','MA','GA','NM','ID','PA','NY','FL','HI','CO','WA'],Israel:'Israel',Japan:'Japan',France:'France',Germany:'Germany','United Kingdom':'UK'};
  if(country==='United States')return hq.match(/(TX|VA|MD|CA|MA|GA|NM|ID|PA|NY|FL|HI|CO|WA),\s*(USA|US)$/);
  return hq.toLowerCase().includes((m[country]||country).toLowerCase());
}

// GLOBE INIT
// ═══════════════════════════════════════════════════════════════════
async function initGlobe(){
  const container=document.getElementById('globe-container');
  const W=container.clientWidth,H=container.clientHeight;
  const R=Math.min(W,H)*0.42;
  svg=d3.select('#globe').attr('width',W).attr('height',H);
  svg.append('g').selectAll('circle')
    .data(Array.from({length:250},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.2,o:Math.random()*0.55+0.15})))
    .enter().append('circle').attr('cx',d=>d.x).attr('cy',d=>d.y).attr('r',d=>d.r).attr('fill','white').attr('opacity',d=>d.o);

  const defs=svg.append('defs');
  const glow=defs.append('filter').attr('id','glow');
  glow.append('feGaussianBlur').attr('stdDeviation','4').attr('result','coloredBlur');
  const fm=glow.append('feMerge');fm.append('feMergeNode').attr('in','coloredBlur');fm.append('feMergeNode').attr('in','SourceGraphic');
  const og=defs.append('radialGradient').attr('id','og').attr('cx','38%').attr('cy','38%').attr('r','60%');
  og.append('stop').attr('offset','0%').attr('stop-color','#071428');
  og.append('stop').attr('offset','100%').attr('stop-color','#030a14');

  projection=d3.geoOrthographic().scale(R).translate([W/2,H/2]).clipAngle(90).rotate(rotation);
  pathGen=d3.geoPath().projection(projection);
  g=svg.append('g');
  g.append('circle').attr('cx',W/2).attr('cy',H/2).attr('r',R).attr('fill','url(#og)').attr('filter','url(#glow)');
  g.append('circle').attr('cx',W/2).attr('cy',H/2).attr('r',R+2).attr('fill','none').attr('stroke','#22e5ff').attr('stroke-width','1.5').attr('opacity','0.18');
  g.append('circle').attr('cx',W/2).attr('cy',H/2).attr('r',R+7).attr('fill','none').attr('stroke','#22e5ff').attr('stroke-width','0.8').attr('opacity','0.07');

  try{
    const resp=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    world=await resp.json();
    countriesFeatures=topojson.feature(world,world.objects.countries).features;
    renderGlobe();setupGlobeInteractions();
  }catch(e){console.warn('World data failed',e);}
  setupYearSlider();
}

// RENDER GLOBE
// ═══════════════════════════════════════════════════════════════════
function renderGlobe(){
  if(!world)return;
  g.selectAll('.country,.graticule,.marker-layer,.sat-layer').remove();
  g.append('path').datum(d3.geoGraticule()()).attr('class','graticule')
    .attr('d',pathGen).attr('fill','none').attr('stroke','#1e3060').attr('stroke-width','0.4');

  const tt=document.getElementById('tooltip');

  g.selectAll('.country').data(countriesFeatures).enter().append('path').attr('class','country')
    .attr('d',pathGen)
    .attr('fill',d=>{
      if(!layers.threats) return '#1a3055';
      const col=getColor(+d.id);
      return col==='#0e1f3a' ? '#1a3055' : col;
    })
    .attr('fill-opacity',d=>{
      if(!layers.threats) return 0.85;
      return getOpacity(+d.id)||0.75;
    })
    .attr('stroke',d=>{
      const code=NUM_TO_CODE[+d.id];
      if(layers.threats&&code&&getCountryData(CODE_TO_COUNTRY[code]).length)return getColor(+d.id);
      return '#3a5580';
    })
    .attr('stroke-width',d=>{
      const code=NUM_TO_CODE[+d.id];
      return(layers.threats&&code&&getCountryData(CODE_TO_COUNTRY[code]).length)?'0.9':'0.4';
    })
    .on('mousemove touchmove',function(event,d){
      if(isDragging)return;
      const code=NUM_TO_CODE[+d.id];if(!code)return;
      const country=CODE_TO_COUNTRY[code];
      const incidents=getCountryData(country);
      if(!incidents.length&&!layers.defense&&!layers.usgov&&!layers.satellites)return;
      const cats=[...new Set(incidents.map(i=>i.category))];
      const maxS=incidents.length?Math.max(...incidents.map(i=>i.sophistication)):0;
      document.getElementById('tt-country').textContent=country.toUpperCase();
      document.getElementById('tt-count').textContent=incidents.length||'—';
      document.getElementById('tt-level').textContent=maxS?LEVEL[maxS]:'—';
      document.getElementById('tt-cats').innerHTML=cats.map(c=>`<span class="tt-cat" style="color:${CAT_COLOR[c]};border-color:${CAT_COLOR[c]}55">${CAT_LABEL[c]}</span>`).join('');
      posTooltip(event,tt);tt.classList.add('show');
    })
    .on('mouseleave touchend',()=>tt.classList.remove('show'))
    .on('click touchstart',function(event,d){
      if(isDragging)return;
      const code=NUM_TO_CODE[+d.id];if(!code)return;
      buildCountryPanel(CODE_TO_COUNTRY[code]);
    });

  if(layers.conferences)renderDots(CONFERENCES,'#ffe844','conf-layer',d=>`★ ${d.name}`,d=>`${d.region} · ${d.location}`,d=>d.desc);
  if(layers.defense)renderDots(DEFENSE_FIRMS,'#ff8855','def-layer',d=>`⬡ ${d.name}`,d=>`${d.type} · ${d.hq}`,d=>d.desc);
  if(layers.usgov)renderDots(US_GOV,'#55ff99','gov-layer',d=>`⊕ ${d.name}`,d=>`${d.type} · ${d.location}`,d=>d.desc);
  if(layers.bases)renderDots(US_BASES,'#ff4444','base-layer',d=>`✦ ${d.name}`,d=>`${d.command} · ${d.country}`,d=>d.desc);
  if(layers.satellites)renderSatellites();
}

function posTooltip(event,tt){
  const rect=document.getElementById('globe-container').getBoundingClientRect();
  const cx=event.touches?event.touches[0].clientX:event.clientX;
  const cy=event.touches?event.touches[0].clientY:event.clientY;
  let x=cx-rect.left+14,y=cy-rect.top-10;
  if(x+210>rect.width)x=cx-rect.left-220;
  if(y+140>rect.height)y=cy-rect.top-140;
  tt.style.left=x+'px';tt.style.top=y+'px';
}

function renderDots(data,color,cls,labelFn,subFn,descFn){
  const tt=document.getElementById('tooltip');
  const mg=g.append('g').attr('class','marker-layer '+cls);
  data.forEach((d,i)=>{
    const proj=projection([d.lon,d.lat]);if(!proj)return;
    const angle=d3.geoDistance([d.lon,d.lat],[-rotation[0],-rotation[1]]);
    if(angle>Math.PI/2)return;
    const dg=mg.append('g').attr('transform',`translate(${proj[0]},${proj[1]})`).style('cursor','pointer');
    dg.append('circle').attr('r',4.5).attr('fill',color).attr('opacity',0.2).attr('class','pulse-ring').style('animation-delay',`${i*0.12}s`);
    dg.append('circle').attr('r',3).attr('fill',color).attr('opacity',0.9);
    dg.on('mousemove',function(event){
      if(isDragging)return;
      document.getElementById('tt-country').textContent=labelFn(d);
      document.getElementById('tt-count').textContent='';document.getElementById('tt-level').textContent='';
      document.getElementById('tt-cats').innerHTML=`<span style="font-size:8px;color:${color};letter-spacing:1px">${subFn(d)}</span><br><span style="font-size:7px;color:var(--dim);line-height:1.5">${descFn(d)}</span>`;
      posTooltip(event,tt);tt.classList.add('show');
    })
    .on('mouseleave',()=>tt.classList.remove('show'))
    .on('click',function(event){
      if(isDragging)return;
      event.stopPropagation();
      tt.classList.remove('show');
      const html=`<div class="marker-card"><div class="mc-name">${d.name}</div><div class="mc-sub">${d.hq||d.location||''}</div>${d.freq?`<div class="mc-sub">FREQ: ${d.freq}</div>`:''}<div class="mc-sub" style="margin-top:5px">${d.desc||''}</div></div>`;
      openPanel(labelFn(d),subFn(d),html);
    })
    .on('touchend',function(event){
      if(isDragging)return;
      event.stopPropagation();
      event.preventDefault();
      tt.classList.remove('show');
      const html=`<div class="marker-card"><div class="mc-name">${d.name}</div><div class="mc-sub">${d.hq||d.location||''}</div>${d.freq?`<div class="mc-sub">FREQ: ${d.freq}</div>`:''}<div class="mc-sub" style="margin-top:5px">${d.desc||''}</div></div>`;
      openPanel(labelFn(d),subFn(d),html);
    });
  });
}

// ═══════════════════════════════════════════════════════════════════
// SATELLITES — rendered above globe surface via radial offset
// Strategy: project the satellite's ground-track lon/lat onto the
// globe surface, then push the rendered point outward from the globe
// center by the orbital altitude multiplier. A tether line connects
// the surface point to the floating satellite icon.
// ═══════════════════════════════════════════════════════════════════
function renderSatellites(){
  const W=+svg.attr('width'), H=+svg.attr('height');
  const R=projection.scale();
  const cx=W/2, cy=H/2;
  const tt=document.getElementById('tooltip');
  const sg=g.append('g').attr('class','sat-layer');

  // Orbit altitude above globe surface as fraction of R
  const ORBIT_HEIGHT = { LEO:0.14, MEO:0.26, GEO:0.42, HEO:0.32 };

  SATELLITES.forEach((sat, i)=>{
    const color = SAT_OWNER_COLOR[sat.owner] || '#cc88ff';
    const alt   = ORBIT_HEIGHT[sat.orbit] || 0.18;

    // Use the satellite's lon/lat as its ground track position.
    // Spread satellites around the globe a bit so they don't stack.
    const spreadLon = sat.lon + (i % 5 - 2) * 12;
    const spreadLat = sat.lat + (i % 3 - 1) * 8;

    // Check visibility: is this point on the front hemisphere?
    const geoAngle = d3.geoDistance([spreadLon, spreadLat], [-rotation[0], -rotation[1]]);
    const onFront  = geoAngle < Math.PI / 2;

    // Project the surface ground-track point
    const surfPt = projection([spreadLon, spreadLat]);
    if(!surfPt) return;

    // Compute unit vector from globe center to surface point.
    // Then push outward by altitude to get the satellite screen position.
    const dx = surfPt[0] - cx;
    const dy = surfPt[1] - cy;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const ux = dx / dist;
    const uy = dy / dist;

    // Surface point is at radius R (roughly). Satellite is at R*(1+alt).
    const orbitDist = R * (1 + alt);
    const sx = cx + ux * orbitDist;
    const sy = cy + uy * orbitDist;

    // --- Orbit ring (dashed circle at this altitude, centered on globe) ---
    // Draw a partial arc suggestion rather than a full circle to avoid clutter.
    // Use a dashed circle scaled to the orbital radius at this altitude.
    const orbitR = R * (1 + alt);
    // Only draw if satellite is visible
    if(onFront){
      sg.append('circle')
        .attr('cx', cx).attr('cy', cy)
        .attr('r', orbitR)
        .attr('fill', 'none')
        .attr('stroke', color)
        .attr('stroke-width', '0.5')
        .attr('stroke-dasharray', '2,6')
        .attr('opacity', 0.18);
    }

    // --- Tether line: surface → satellite ---
    if(onFront){
      sg.append('line')
        .attr('x1', surfPt[0]).attr('y1', surfPt[1])
        .attr('x2', sx).attr('y2', sy)
        .attr('stroke', color)
        .attr('stroke-width', '0.6')
        .attr('stroke-dasharray', '2,3')
        .attr('opacity', 0.35);

      // Surface ground-track dot
      sg.append('circle')
        .attr('cx', surfPt[0]).attr('cy', surfPt[1])
        .attr('r', 1.5)
        .attr('fill', color)
        .attr('opacity', 0.4);
    }

    // --- Satellite icon (always drawn at orbital position, fade if behind) ---
    const iconOpacity = onFront ? 1 : 0.15;
    const dg = sg.append('g')
      .attr('transform', `translate(${sx},${sy})`)
      .style('cursor', 'pointer')
      .attr('opacity', iconOpacity);

    // Body diamond
    dg.append('rect')
      .attr('x', -3).attr('y', -3)
      .attr('width', 6).attr('height', 6)
      .attr('transform', 'rotate(45)')
      .attr('fill', color)
      .attr('opacity', 0.95);

    // Solar panels (horizontal bars either side)
    dg.append('rect').attr('x',-9).attr('y',-1.5).attr('width',5).attr('height',3)
      .attr('fill',color).attr('opacity',0.55).attr('rx',0.5);
    dg.append('rect').attr('x', 4).attr('y',-1.5).attr('width',5).attr('height',3)
      .attr('fill',color).attr('opacity',0.55).attr('rx',0.5);
    // Panel connector lines
    dg.append('line').attr('x1',-4).attr('y1',0).attr('x2',-4).attr('y2',0)
      .attr('stroke',color).attr('stroke-width','1');

    // Subtle glow ring
    dg.append('circle').attr('r',6).attr('fill','none')
      .attr('stroke',color).attr('stroke-width','0.5').attr('opacity',0.25);

    dg.on('mousemove',function(event){
      if(isDragging)return;
      document.getElementById('tt-country').textContent=`◎ ${sat.name}`;
      document.getElementById('tt-count').textContent='';
      document.getElementById('tt-level').textContent='';
      document.getElementById('tt-cats').innerHTML=`
        <span style="font-size:8px;color:${color}">${sat.owner} · ${sat.type} · ${sat.orbit}</span>
        <br><span style="font-size:7px;color:var(--dim);line-height:1.5">${sat.desc}</span>`;
      posTooltip(event,tt);tt.classList.add('show');
    })
    .on('mouseleave',()=>tt.classList.remove('show'))
    .on('click',function(event){
      if(isDragging)return;
      event.stopPropagation();
      tt.classList.remove('show');
      openPanel(`◎ ${sat.name}`,`${sat.owner} · ${sat.type} · ${sat.orbit}`,
        `<div class="marker-card">
          <div class="mc-name" style="color:${color}">${sat.name}</div>
          <div class="mc-sub">Owner: ${sat.owner}</div>
          <div class="mc-sub">Type: ${sat.type}</div>
          <div class="mc-sub">Orbit class: ${sat.orbit} (+${Math.round(alt*100)}% above surface)</div>
          <div class="mc-sub" style="margin-top:5px">${sat.desc}</div>
        </div>`);
    })
    .on('touchend',function(event){
      if(isDragging)return;
      event.stopPropagation();
      event.preventDefault();
      tt.classList.remove('show');
      openPanel(`◎ ${sat.name}`,`${sat.owner} · ${sat.type} · ${sat.orbit}`,
        `<div class="marker-card">
          <div class="mc-name" style="color:${color}">${sat.name}</div>
          <div class="mc-sub">Owner: ${sat.owner}</div>
          <div class="mc-sub">Type: ${sat.type}</div>
          <div class="mc-sub">Orbit class: ${sat.orbit} (+${Math.round(alt*100)}% above surface)</div>
          <div class="mc-sub" style="margin-top:5px">${sat.desc}</div>
        </div>`);
    });
  });
}

// ═══════════════════════════════════════════════════════════════════
// DRAG TO ROTATE
// ═══════════════════════════════════════════════════════════════════
function setupGlobeInteractions(){
  const svgEl=document.getElementById('globe');
  function onStart(x,y){isDragging=false;lastPos=[x,y];}
  function onMove(x,y){
    if(!lastPos)return;
    const dx=x-lastPos[0],dy=y-lastPos[1];
    if(Math.abs(dx)>3||Math.abs(dy)>3)isDragging=true;
    if(!isDragging)return;
    rotation[0]+=dx*0.4;rotation[1]-=dy*0.4;
    rotation[1]=Math.max(-90,Math.min(90,rotation[1]));
    projection.rotate(rotation);
    // Only update path geometry — never re-render during drag.
    // Re-rendering adds new event listeners on every frame causing cascading input events.
    g.selectAll('path').attr('d',pathGen);
    lastPos=[x,y];
  }
  function onEnd(){
    lastPos=null;
    setTimeout(()=>{
      isDragging=false;
      // Full re-render after drag ends so overlay markers reposition correctly
      renderGlobe();
    },60);
  }
  svgEl.addEventListener('mousedown',e=>onStart(e.clientX,e.clientY));
  window.addEventListener('mousemove',e=>{if(lastPos)onMove(e.clientX,e.clientY);});
  window.addEventListener('mouseup',onEnd);
  svgEl.addEventListener('touchstart',e=>{e.preventDefault();onStart(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  svgEl.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1)onMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  svgEl.addEventListener('touchend',onEnd);
}

// YEAR SLIDER
// ═══════════════════════════════════════════════════════════════════
function setupYearSlider(){
  const slider=document.getElementById('year-slider');
  slider.min=2000;
  slider.addEventListener('input',()=>{
    const val=parseInt(slider.value);
    if(val===2025){
      activeYear=null;
      document.getElementById('year-display').textContent='ALL';
      document.getElementById('year-note').textContent=`all ${THREATS.length} incidents`;
    } else {
      activeYear=val;
      const ic=THREATS.filter(t=>parseInt(t.date.slice(0,4))<=val).length;
      document.getElementById('year-display').textContent=val;
      document.getElementById('year-note').textContent=`${ic} incident${ic!==1?'s':''} thru ${val}`;
    }
    renderGlobe();renderStats();
  });
}

// US STATES MAP
// ═══════════════════════════════════════════════════════════════════
async function renderStatesMap(){
  const container=document.getElementById('states-map-container');
  const W=container.clientWidth,H=container.clientHeight;
  const svgS=d3.select('#states-svg').attr('width',W).attr('height',H);
  svgS.selectAll('*').remove();

  const tt=document.getElementById('state-tooltip');

  try{
    const resp=await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json');
    const us=await resp.json();
    const states=topojson.feature(us,us.objects.states).features;
    const stateMesh=topojson.mesh(us,us.objects.states,(a,b)=>a!==b);
    const names=await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(()=>null).catch(()=>null);

    const proj=d3.geoAlbersUsa().fitSize([W,H],topojson.feature(us,us.objects.states));
    const path=d3.geoPath().projection(proj);

    // State name map (FIPS to name)
    const FIPS={1:'Alabama',2:'Alaska',4:'Arizona',5:'Arkansas',6:'California',8:'Colorado',9:'Connecticut',10:'Delaware',11:'DC',12:'Florida',13:'Georgia',15:'Hawaii',16:'Idaho',17:'Illinois',18:'Indiana',19:'Iowa',20:'Kansas',21:'Kentucky',22:'Louisiana',23:'Maine',24:'Maryland',25:'Massachusetts',26:'Michigan',27:'Minnesota',28:'Mississippi',29:'Missouri',30:'Montana',31:'Nebraska',32:'Nevada',33:'New Hampshire',34:'New Jersey',35:'New Mexico',36:'New York',37:'North Carolina',38:'North Dakota',39:'Ohio',40:'Oklahoma',41:'Oregon',42:'Pennsylvania',44:'Rhode Island',45:'South Carolina',46:'South Dakota',47:'Tennessee',48:'Texas',49:'Utah',50:'Vermont',51:'Virginia',53:'Washington',54:'West Virginia',55:'Wisconsin',56:'Wyoming'};

    const scoreColor=score=>{
      if(!score)return '#0e1f3a';
      const c=['#0e1f3a','#0d2d4a','#1a4060','#1e5c8a','#1a7ab5','#22e5ff'];
      return c[Math.min(score,5)];
    };

    svgS.append('g').selectAll('path').data(states).enter().append('path')
      .attr('d',path)
      .attr('fill',d=>{const name=FIPS[+d.id];const data=US_STATES_DATA[name];return scoreColor(data?.score);})
      .attr('stroke','#2a3a5c').attr('stroke-width','0.5')
      .style('cursor','pointer')
      .on('mousemove',function(event,d){
        const name=FIPS[+d.id];const data=US_STATES_DATA[name];
        if(!name)return;
        document.getElementById('st-name').textContent=name.toUpperCase();
        document.getElementById('st-content').innerHTML=data
          ?`<div style="font-size:8px;color:var(--statecol);margin-bottom:4px">CYBER SIGNIFICANCE: ${['','LOW','LOW','MODERATE','HIGH','CRITICAL'][data.score]}</div><div style="font-size:8px;color:#99b0cc;line-height:1.5">${data.note||''}</div>`
          :`<div style="font-size:8px;color:var(--dim)">NO SIGNIFICANT CYBER ENTITIES</div>`;
        const rect=container.getBoundingClientRect();
        tt.style.left=(event.clientX-rect.left+12)+'px';tt.style.top=(event.clientY-rect.top-8)+'px';
        tt.classList.add('show');
      })
      .on('mouseleave',()=>tt.classList.remove('show'))
      .on('click',function(event,d){
        const name=FIPS[+d.id];const data=US_STATES_DATA[name];if(!name||!data)return;
        tt.classList.remove('show');
        const html=`
          <div class="marker-card">
            <div class="mc-name" style="color:var(--statecol)">CYBER SIGNIFICANCE: ${['','LOW','LOW','MODERATE','HIGH','CRITICAL'][data.score]}</div>
            <div class="mc-sub" style="margin:5px 0">${data.note||''}</div>
          </div>
          ${data.entities.map(e=>`<div class="incident-card" style="border-left-color:var(--statecol)"><div class="inc-name" style="color:var(--statecol)">${e}</div></div>`).join('')}`;
        openPanel(name.toUpperCase(),`${data.entities.length} CYBER ENTITIES`,html);
      })
      .on('touchend',function(event,d){
        event.preventDefault();
        const name=FIPS[+d.id];const data=US_STATES_DATA[name];if(!name||!data)return;
        tt.classList.remove('show');
        const html=`
          <div class="marker-card">
            <div class="mc-name" style="color:var(--statecol)">CYBER SIGNIFICANCE: ${['','LOW','LOW','MODERATE','HIGH','CRITICAL'][data.score]}</div>
            <div class="mc-sub" style="margin:5px 0">${data.note||''}</div>
          </div>
          ${data.entities.map(e=>`<div class="incident-card" style="border-left-color:var(--statecol)"><div class="inc-name" style="color:var(--statecol)">${e}</div></div>`).join('')}`;
        openPanel(name.toUpperCase(),`${data.entities.length} CYBER ENTITIES`,html);
      });

    // State borders mesh
    svgS.append('path').datum(stateMesh).attr('d',path).attr('fill','none').attr('stroke','#3a5080').attr('stroke-width','0.8');

    // Labels for significant states
    svgS.append('g').selectAll('text').data(states.filter(d=>US_STATES_DATA[FIPS[+d.id]]?.score>=4)).enter()
      .append('text')
      .attr('transform',d=>{const c=path.centroid(d);return`translate(${c[0]},${c[1]})`;})
      .attr('text-anchor','middle').attr('font-size','7').attr('fill','#22e5ff').attr('font-family','Share Tech Mono').attr('opacity','0.8')
      .text(d=>{const n=FIPS[+d.id];if(!n)return'';const abbr={California:'CA',Maryland:'MD',Virginia:'VA',Texas:'TX',Georgia:'GA',Washington:'WA',Colorado:'CO',Massachusetts:'MA',DC:'DC'};return abbr[n]||n.slice(0,2).toUpperCase();});

  }catch(e){
    svgS.append('text').attr('x',W/2).attr('y',H/2).attr('text-anchor','middle').attr('fill','var(--dim)').attr('font-size','12').attr('font-family','Share Tech Mono').text('COULD NOT LOAD STATE MAP DATA');
    console.warn('States map failed',e);
  }
}

function renderList(){
  const cats=['espionage','ransomware','infrastructure','supply-chain','hacktivism'];
  document.getElementById('filter-row').innerHTML=`
    <button class="filter-btn ${!activeCategory?'active':''}" data-cat="" style="color:#fff;border-color:#ffffff44">ALL</button>
    ${cats.map(c=>`<button class="filter-btn ${activeCategory===c?'active':''}" data-cat="${c}" style="color:${CAT_COLOR[c]};border-color:${CAT_COLOR[c]}">${CAT_LABEL[c]}</button>`).join('')}`;
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{activeCategory=btn.dataset.cat||null;renderList();renderGlobe();renderStats();});
  });
  const items=getFiltered().sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('list-container').innerHTML=items.length===0
    ?`<div style="color:var(--dim);font-size:10px;padding:20px;text-align:center">NO INCIDENTS MATCH FILTER</div>`
    :items.map(t=>`
      <div class="list-item" style="border-left-color:${CAT_COLOR[t.category]}" data-id="${t.id}">
        <div class="li-header"><div class="li-name">${t.name}</div><div class="li-year">${t.date.slice(0,4)}</div></div>
        <div class="li-actor">${t.actor}</div>
        <div class="li-country">${t.country.toUpperCase()} · SOPH ${t.sophistication}/5 · ${t.confidence}</div>
        <div class="li-tags"><span class="inc-tag" style="border-color:${CAT_COLOR[t.category]}55;color:${CAT_COLOR[t.category]}">${CAT_LABEL[t.category]}</span>${(t.malware||[]).slice(0,2).map(m=>`<span class="inc-tag">${m}</span>`).join('')}</div>
      </div>`).join('');
  document.querySelectorAll('.list-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const t=THREATS.find(x=>x.id===el.dataset.id);if(!t)return;
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      document.querySelector('[data-view="globe-view"]').classList.add('active');
      document.getElementById('globe-view').classList.add('active');
      buildCountryPanel(t.country);
    });
  });
}
