<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- COFFEEKIT v9 // expert mode + cleaning sink fix // sudosilo -->
<title>COFFEEKIT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@400;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* shell - deep espresso brown */
  --shell:#1a1208;
  --shell-mid:#2a1e0e;

  /* orange phone identity - warm amber-orange */
  --orange:#d4620a;
  --orange-lt:#e8821e;
  --orange-dim:#6a3008;
  --orange-bg:#251408;

  /* blueprint paper - warm parchment/cream */
  --bp-paper:#f2ead8;
  --bp-grid:#c8b898;
  --bp-line:#7a5c3a;
  --bp-wall:#3a2410;
  --bp-hatch:#c0a87a;
  --bp-fill:#e2d4b8;
  --bp-fill-hover:#cfc0a0;
  --bp-text:#3a2410;
  --bp-zone:#8a6a48;

  /* KDS - warm dark brown terminal */
  --kds-bg:#0e0a04;
  --kds-border:#2a1c08;
  --kds-green:#c8a850;
  --kds-dim:#6a5020;
  --kds-dimmer:#3a2c10;

  /* free step: sage green instead of blue */
  --free:#4a7a50;
  --free-lt:#6aaa70;
  --free-bg:#e0eed8;
  --free-bdr:#4a7a50;

  --mono:'Share Tech Mono',monospace;
  --sans:'DM Sans',sans-serif;
}
@media(prefers-color-scheme:dark){
  .blueprint,.bpi,.eq,.ctr,.flv,.wall,.zlabel{color-scheme:light;}
}
body{background:var(--shell);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;font-family:var(--sans);color-scheme:dark;}

/* TOP BAR */
.topbar{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:var(--mono);}
.title{color:#c8d8e0;font-size:15px;letter-spacing:0.2em;}
.title span{color:var(--orange);}
.stats{display:flex;gap:14px;align-items:center;}
.stat{text-align:right;}
.stat-l{font-size:8px;color:#6a8a9a;letter-spacing:0.1em;}
.stat-v{font-size:18px;color:#ddeeff;}
.mode-badge{font-size:9px;padding:3px 9px;border-radius:2px;letter-spacing:0.12em;font-family:var(--mono);font-weight:bold;}
.mode-badge.training{background:var(--orange-bg);color:var(--orange-lt);border:1px solid var(--orange-dim);}
.mode-badge.expert{background:#0a1a0a;color:var(--kds-green);border:1px solid #1a4a1a;}
.mode-badge.cleaning{background:#1a0a2a;color:#cc88ff;border:1px solid #4a2a6a;animation:badge-flash 0.8s step-end infinite;}
@keyframes badge-flash{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* KDS */
.kds{width:100%;max-width:900px;background:var(--kds-bg);border:2px solid var(--kds-border);border-bottom:none;border-radius:3px 3px 0 0;padding:9px 13px;font-family:var(--mono);box-shadow:0 0 16px rgba(0,180,60,0.1);}
.kds-head{font-size:8px;color:var(--kds-dim);letter-spacing:0.15em;border-bottom:1px solid var(--kds-dimmer);padding-bottom:5px;margin-bottom:7px;display:flex;justify-content:space-between;}
.kds-head .brand{color:var(--orange-dim);}
.kds-name{font-size:14px;color:var(--kds-green);margin-bottom:7px;}
.kds-steps{display:flex;flex-wrap:wrap;gap:5px;}
.kds-step{font-size:9px;padding:2px 8px;border:1px solid var(--kds-dimmer);border-radius:2px;color:var(--kds-dimmer);}
.kds-step.done{color:#003018;border-color:#002010;text-decoration:line-through;}
.kds-step.current{color:var(--kds-green);border-color:var(--kds-green);box-shadow:0 0 4px rgba(200,168,80,0.35);animation:blink 1s step-end infinite;font-weight:bold;letter-spacing:0.05em;}
/* expert mode: KDS still shows current step clearly, just no floor glow */
.kds-step.current::before{content:'> ';color:var(--orange-lt);}
.kds-step.timing{color:var(--orange-lt);border-color:var(--orange);animation:blink-orange 0.5s step-end infinite;}
.kds-step.free-pending{color:var(--free-lt);border-color:var(--free);}
.kds-step.free-done{color:#003018;border-color:#002010;text-decoration:line-through;}
.kds-step.clean-step{color:#cc88ff;border-color:#4a2a6a;}
.kds-step.clean-done{color:#2a1a3a;border-color:#1a0a2a;text-decoration:line-through;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes blink-orange{0%,100%{opacity:1;}50%{opacity:0.3;}}
.kds-hint{margin-top:7px;font-size:8px;color:var(--kds-dim);font-style:italic;}

/* AMBIENT */
.ambient{width:100%;max-width:900px;background:#030a03;border:2px solid var(--kds-border);border-top:1px solid #0a1e0a;border-bottom:none;padding:6px 13px 8px;font-family:var(--mono);font-size:8px;color:var(--kds-dim);display:flex;flex-direction:column;gap:4px;}
.ambient::before{content:'// COFFEEKIT AMBIENT // ORANGE BUILD //';display:block;font-size:6px;color:var(--orange-dim);letter-spacing:0.1em;margin-bottom:3px;opacity:0.6;}
.amb-row{display:flex;align-items:center;gap:8px;min-height:13px;overflow:hidden;}
.amb-label{color:#004a1a;letter-spacing:0.1em;white-space:nowrap;flex-shrink:0;font-size:7px;}
.amb-value{color:var(--kds-dim);letter-spacing:0.05em;white-space:nowrap;}
.amb-value.flash-in{animation:amb-flash 0.35s ease-out;}
@keyframes amb-flash{0%{opacity:0;transform:translateY(3px);}100%{opacity:1;transform:none;}}

/* QUEUE */
.queue-bar{width:100%;max-width:900px;display:flex;gap:0;margin-bottom:8px;border:2px solid var(--kds-border);border-top:1px solid #0a1e0a;border-radius:0 0 3px 3px;overflow:hidden;background:#040c04;}
.q-ticket{padding:5px 9px;font-family:var(--mono);font-size:8px;color:var(--kds-dimmer);flex:1;border-right:1px solid #0a1e0a;}
.q-ticket:last-child{border-right:none;}
.q-ticket.active{color:var(--orange-lt);background:var(--orange-bg);border-bottom:2px solid var(--orange);}
.q-label{font-size:6px;opacity:0.5;margin-bottom:2px;letter-spacing:0.1em;}

/* BLUEPRINT */
.bp-wrap{width:100%;max-width:900px;}
.blueprint{width:100%;background:var(--bp-paper)!important;border:3px solid var(--bp-wall);border-radius:3px;position:relative;padding-bottom:64%;overflow:hidden;box-shadow:0 0 0 5px var(--shell),0 0 0 7px var(--orange-dim);}
.bpi{position:absolute;inset:0;background:var(--bp-paper)!important;}
.bp-grid-layer{position:absolute;inset:0;background-image:linear-gradient(var(--bp-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bp-grid) 1px,transparent 1px);background-size:5% 5%;opacity:0.55;pointer-events:none;}
.wall{position:absolute;background:var(--bp-wall)!important;}
.ctr{position:absolute;background-color:var(--bp-hatch)!important;background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(30,61,82,0.18) 3px,rgba(30,61,82,0.18) 4px)!important;border:1.5px solid var(--bp-line);display:flex;align-items:flex-end;padding:2px 4px;}
.ctr span{font-family:var(--mono);font-size:clamp(4px,0.7vw,6px);color:var(--bp-wall)!important;opacity:0.65;letter-spacing:0.07em;user-select:none;text-transform:uppercase;}
.zlabel{position:absolute;font-family:var(--mono);font-size:clamp(5px,0.8vw,7px);color:var(--bp-zone)!important;letter-spacing:0.12em;text-transform:uppercase;opacity:0.8;pointer-events:none;user-select:none;background:rgba(242,234,216,0.7);padding:1px 3px;}

/* EQUIPMENT */
.eq{position:absolute;border:1.5px solid var(--bp-line);background:var(--bp-fill)!important;color:var(--bp-text)!important;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:clamp(4px,0.9vw,7px);letter-spacing:0.03em;text-align:center;text-transform:uppercase;line-height:1.25;user-select:none;transition:background 0.12s,border-color 0.12s,opacity 0.15s;overflow:hidden;word-break:break-word;padding:2px;}
.eq.inter{cursor:pointer;}
.eq.inter:hover{background:var(--bp-fill-hover)!important;}
.eq.clickable{border:2.5px solid var(--orange)!important;background:#fff0e0!important;cursor:pointer;animation:pulse-orange 1.1s ease-in-out infinite;}
.eq.free-clickable{border:2px solid var(--free-bdr)!important;background:var(--free-bg)!important;cursor:pointer;animation:pulse-sage 1.1s ease-in-out infinite;}
.eq.timing-active{border:2.5px solid var(--orange-lt)!important;background:#fff0d0!important;cursor:default;}
.eq.used{border-color:var(--bp-grid)!important;background:#c8d8e0!important;opacity:0.5;cursor:default;}
.eq.free-used{border-color:#9ab0cc!important;background:#c8d8e0!important;opacity:0.5;cursor:default;}
.eq.clean-needed{border:2.5px solid #cc88ff!important;background:#f0e8ff!important;cursor:pointer;animation:pulse-purple 1.1s ease-in-out infinite;}
.eq.clean-done{border-color:#9ab0cc!important;background:#c8d8e0!important;opacity:0.5;cursor:default;}
@keyframes pulse-orange{0%,100%{box-shadow:0 0 0 0 rgba(232,101,10,0.55);}50%{box-shadow:0 0 0 5px rgba(232,101,10,0);}}
@keyframes pulse-sage{0%,100%{box-shadow:0 0 0 0 rgba(74,122,80,0.5);}50%{box-shadow:0 0 0 5px rgba(74,122,80,0);}}
@keyframes pulse-purple{0%,100%{box-shadow:0 0 0 0 rgba(180,120,240,0.5);}50%{box-shadow:0 0 0 5px rgba(180,120,240,0);}}

/* timer bar inside equipment block */
.eq-timer{position:absolute;bottom:0;left:0;height:3px;background:var(--orange);border-radius:0 0 0 0;transition:width 0.05s linear;}

/* FLAVOR BUTTONS */
.flv{position:absolute;border:1px solid var(--bp-line);background:var(--bp-fill)!important;color:var(--bp-text)!important;font-family:var(--mono);font-size:clamp(4px,0.75vw,6px);display:flex;align-items:center;justify-content:center;text-align:center;text-transform:uppercase;line-height:1.2;user-select:none;transition:background 0.12s;overflow:hidden;padding:1px 2px;}
.flv.inter{cursor:pointer;}
.flv.inter:hover{background:var(--bp-fill-hover)!important;}
.flv.clickable{border:2px solid var(--orange)!important;background:#fff0e0!important;cursor:pointer;animation:pulse-orange 1.1s ease-in-out infinite;}
.flv.free-clickable{border:1.5px solid var(--free-bdr)!important;background:var(--free-bg)!important;cursor:pointer;animation:pulse-sage 1.1s ease-in-out infinite;}
.flv.used,.flv.free-used{background:#c8d8e0!important;opacity:0.5;cursor:default;}

/* HOUSE COFFEE LEVEL */
.house-level-wrap{position:absolute;display:flex;flex-direction:column;align-items:center;gap:1px;}
.house-level-label{font-family:var(--mono);font-size:5.5px;color:var(--bp-text)!important;text-transform:uppercase;letter-spacing:0.05em;text-align:center;line-height:1.2;}
.house-level-bar{width:100%;background:#a8c0cc;border:1px solid var(--bp-line);border-radius:1px;overflow:hidden;position:relative;}
.house-level-fill{height:100%;background:#5a3a18;transition:width 0.3s ease;border-radius:1px;}
.house-level-bar.low .house-level-fill{background:#c86010;}
.house-level-bar.empty .house-level-fill{background:#cc2222;width:5%!important;}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;pointer-events:none;transition:opacity 0.25s;font-family:var(--mono);}
.overlay.show{opacity:1;pointer-events:all;}

/* CLEANING OVERLAY */
.clean-overlay{position:fixed;inset:0;background:rgba(10,0,20,0.95);display:flex;align-items:center;justify-content:center;z-index:290;opacity:0;pointer-events:none;transition:opacity 0.25s;font-family:var(--mono);}
.clean-overlay.show{opacity:1;pointer-events:all;}
.clean-box{border:2px solid #cc88ff;background:#0a0014;padding:24px 30px;text-align:center;max-width:380px;width:92%;}
.clean-title{font-size:15px;color:#cc88ff;margin-bottom:6px;letter-spacing:0.12em;}
.clean-sub{font-size:9px;color:#5a2a7a;margin-bottom:16px;line-height:1.8;}
.clean-btn{background:transparent;border:1.5px solid #cc88ff;color:#cc88ff;font-family:var(--mono);font-size:12px;padding:8px 20px;cursor:pointer;letter-spacing:0.1em;}
.clean-btn:hover{background:rgba(204,136,255,0.1);}

/* MILK FRIDGE OVERLAY */
.milk-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:295;opacity:0;pointer-events:none;transition:opacity 0.2s;font-family:var(--mono);}
.milk-overlay.show{opacity:1;pointer-events:all;}
.milk-box{border:2px solid var(--bp-line);background:var(--bp-paper);padding:20px 24px;text-align:center;max-width:340px;width:92%;}
.milk-title{font-size:11px;color:var(--bp-wall);margin-bottom:4px;letter-spacing:0.15em;}
.milk-sub{font-size:8px;color:var(--bp-zone);margin-bottom:14px;letter-spacing:0.08em;}
.milk-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.milk-btn{background:var(--bp-fill);border:1.5px solid var(--bp-line);color:var(--bp-wall);font-family:var(--mono);font-size:10px;padding:10px 8px;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;transition:background 0.1s;}
.milk-btn:hover{background:var(--bp-fill-hover);}
.milk-btn.milk-highlight{border-color:var(--orange)!important;background:#fff0e0!important;animation:pulse-orange 1.1s ease-in-out infinite;}

.ovbox{border:2px solid var(--orange);background:var(--orange-bg);padding:26px 34px;text-align:center;max-width:360px;width:92%;}
.ov-title{font-size:16px;color:var(--orange-lt);margin-bottom:8px;letter-spacing:0.1em;}
.ov-sub{font-size:9px;color:#a05030;margin-bottom:20px;line-height:1.9;white-space:pre-line;}
.ov-btn{background:transparent;border:1.5px solid var(--orange-lt);color:var(--orange-lt);font-family:var(--mono);font-size:12px;padding:9px 22px;cursor:pointer;letter-spacing:0.1em;}
.ov-btn:hover{background:rgba(232,101,10,0.15);}

.log{width:100%;max-width:900px;margin-top:7px;font-family:var(--mono);font-size:9px;color:var(--orange-dim);text-align:center;letter-spacing:0.04em;min-height:14px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="title">COFFEE<span>KIT</span></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="mode-badge training" id="mode-badge">TRAINING</div>
    <div class="stats">
      <div class="stat"><div class="stat-l">ORDERS</div><div class="stat-v" id="s-done">0</div></div>
      <div class="stat"><div class="stat-l">SCORE</div><div class="stat-v" id="s-score">0</div></div>
    </div>
  </div>
</div>

<div class="kds">
  <div class="kds-head">
    <span>KDS // KITCHEN DISPLAY <span class="brand">// ORANGE</span></span>
    <span id="kds-clock">--:--</span>
  </div>
  <div class="kds-name" id="kds-name">-</div>
  <div class="kds-steps" id="kds-steps"></div>
  <div class="kds-hint" id="kds-hint"></div>
</div>

<div class="ambient">
  <div class="amb-row"><span class="amb-label">DRIVE-THRU</span><span class="amb-value" id="amb-0">--</span></div>
  <div class="amb-row"><span class="amb-label">LOBBY&nbsp;&nbsp;&nbsp;&nbsp;</span><span class="amb-value" id="amb-1">--</span></div>
  <div class="amb-row"><span class="amb-label">ENVIRON&nbsp;&nbsp;</span><span class="amb-value" id="amb-2">--</span></div>
</div>

<div class="queue-bar" id="queue-bar"></div>

<div class="bp-wrap">
  <div class="blueprint"><div class="bpi" id="bpi"></div></div>
</div>

<div class="log" id="log">CLICK THE HIGHLIGHTED STATION TO BEGIN</div>

<!-- MILK FRIDGE OVERLAY -->
<div class="milk-overlay" id="milk-overlay">
  <div class="milk-box">
    <div class="milk-title">MILK FRIDGE</div>
    <div class="milk-sub" id="milk-sub">SELECT MILK</div>
    <div class="milk-grid" id="milk-grid"></div>
  </div>
</div>

<!-- ORDER COMPLETE OVERLAY -->
<div class="overlay" id="overlay">
  <div class="ovbox">
    <div class="ov-title">ORDER COMPLETE</div>
    <div class="ov-sub" id="ov-sub"></div>
    <button class="ov-btn" id="ov-btn">NEXT ORDER &gt;</button>
  </div>
</div>

<!-- CLEANING OVERLAY -->
<div class="clean-overlay" id="clean-overlay">
  <div class="clean-box">
    <div class="clean-title">CLEANING ROUND</div>
    <div class="clean-sub" id="clean-sub">Time to wash up. Click each highlighted station on the floor to clean it, then use the sink.</div>
    <button class="clean-btn" id="clean-btn">START CLEANING &gt;</button>
  </div>
</div>

<script>
// COFFEEKIT v6 // orange phone // sudosilo

// ---- AMBIENT ----
const AMB_POOLS=[
  [()=>ri(2,9)+' vehicles in queue',()=>ri(2,9)+' cars -- '+ri(2,8)+' min avg wait',()=>'last car ordered '+rp(['plain drip','3 frappuccinos','nothing and left','just water']),()=>'speaker volume '+rp(['too quiet','too loud','echoing','fine']),()=>ri(2,9)+' cars -- headset battery '+ri(12,94)+'%',()=>'vehicle '+ri(2,6)+' pulled to wrong window',()=>'someone asked if we have a kids menu',()=>'car at window '+ri(3,11)+' min',()=>'customer wants to pay in coins',()=>ri(1,3)+' mobile orders match drive-thru count'],
  [()=>ri(1,14)+' guests in lobby',()=>ri(1,14)+' lobby -- '+ri(0,3)+' on the outlet',()=>'table 4 occupied '+ri(22,90)+' min on one drink',()=>'loud call near condiment bar',()=>ri(1,14)+' guests -- music complaints: '+ri(0,2),()=>'lobby temp '+ri(68,74)+'F -- HVAC cycling',()=>'restroom key out '+ri(8,40)+' min',()=>'dog staring through front window',()=>'wifi password requested '+ri(2,6)+' times',()=>'nobody using sugar-free syrup again',()=>'child tapping on pastry case glass'],
  [()=>'outside '+ri(61,102)+'F -- '+rp(['sunny','overcast','wind advisory','mild']),()=>'ice machine sound at '+tStr()+' -- log it',()=>'espresso machine '+rp(['pulling long','running hot','shot time nominal','grinder drift']),()=>'cold brew '+ri(11,22)+' hrs in -- check level',()=>'health score: '+ri(88,100),()=>'ambient noise '+ri(62,79)+' dB',()=>'shift ends in '+ri(12,110)+' min',()=>'syrup: '+rp(['vanilla LOW','caramel OK','hazelnut CRITICAL','all fine']),()=>'cups: '+ri(180,420)+' remaining',()=>'power '+ri(14,22)+' kW -- espresso peak',()=>'POS '+ri(1,3)+' last synced '+ri(2,18)+' min ago'],
];
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rp(a){return a[Math.floor(Math.random()*a.length)];}
function tStr(){const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
function flashAmb(i){const el=document.getElementById('amb-'+i);if(!el)return;el.textContent=AMB_POOLS[i][Math.floor(Math.random()*AMB_POOLS[i].length)]();el.classList.remove('flash-in');void el.offsetWidth;el.classList.add('flash-in');}
function startAmbient(){[7000,11000,9000].forEach((ms,i)=>setTimeout(()=>{flashAmb(i);setInterval(()=>flashAmb(i),ms);},[0,3500,1800][i]));}

// ---- TIMED STATIONS ----
// These require a click then auto-complete after duration_ms
const TIMED={
  espresso:    {ms:1250, label:'PULLING SHOT'},
  blender:     {ms:1250, label:'BLENDING'},
  hot_food:    {ms:1250, label:'PLATING'},
  house_brew:  {ms:1250, label:'POURING'},
  house_brew2: {ms:1250, label:'POURING POT 2'},
  sink:        {ms:500,  label:'WASHING'},
  refill:      {ms:500,  label:'REFILLING'},
  refill2:     {ms:500,  label:'REFILLING POT 2'},
};

// ---- MILKS ----
const MILKS=[
  {id:'oat',       label:'OAT'},
  {id:'whole',     label:'WHOLE'},
  {id:'half',      label:'HALF & HALF'},
  {id:'two_pct',   label:'2%'},
  {id:'almond',    label:'ALMOND'},
  {id:'coconut',   label:'COCONUT'},
  {id:'soy',       label:'SOY'},
];

// milk needed for current order (sid of step that triggered fridge)
let milkPendingSid=null;
let milkChosen=null; // label of chosen milk for display
const activeTimers={};
function stationTiming(sid){ return !!activeTimers[sid]; }

function startTimer(sid, ms, onDone){
  if(activeTimers[sid]) cancelAnimationFrame(activeTimers[sid]);
  const pill=getKdsPill(sid);
  if(pill) pill.className='kds-step timing';
  setEqClass(sid,'timing-active');
  setLog('> '+(TIMED[sid]?TIMED[sid].label:sid)+'...');
  const start=performance.now();
  function tick(){
    const pct=Math.min((performance.now()-start)/ms,1);
    const bar=document.getElementById('timer-bar-'+sid);
    if(bar) bar.style.width=(pct*100)+'%';
    if(pct<1){ activeTimers[sid]=requestAnimationFrame(tick); }
    else{
      delete activeTimers[sid];
      if(bar) bar.style.width='100%';
      setTimeout(()=>{ if(bar) bar.style.width='0%'; },200);
      onDone();
    }
  }
  activeTimers[sid]=requestAnimationFrame(tick);
}

// ---- HOUSE COFFEE LEVEL ----
// 0.0 to 1.0, depletes each use, refill restores
let houseLevel=1.0;
const HOUSE_DEPLETION=0.22; // per use
const HOUSE_LOW=0.3;

function useHouse(){
  houseLevel=Math.max(0,houseLevel-HOUSE_DEPLETION);
  updateHouseDisplay();
}
function refillHouse(){
  houseLevel=1.0;
  updateHouseDisplay();
}
function updateHouseDisplay(){
  const fill=document.getElementById('house-fill');
  const bar=document.getElementById('house-bar');
  if(!fill||!bar) return;
  fill.style.width=(houseLevel*100)+'%';
  bar.className='house-level-bar';
  if(houseLevel<=0) bar.classList.add('empty');
  else if(houseLevel<=HOUSE_LOW) bar.classList.add('low');
}

// track how many times each station is used across 7 orders
const CLEAN_CYCLE=7;

let orderCount=0;  // total completed orders
let cleaningMode=false;
let cleanQueue=[];  // sids to wash
let cleanDone=new Set();

function recordUsage(sid){
  usageMap[sid]=(usageMap[sid]||0)+1;
}
function getCleanTargets(){
  // top 3 most-used stations that are washable
  const washable=['espresso','blender','steamer','house_brew','house_brew2'];
  const sorted=washable
    .filter(s=>usageMap[s]>0)
    .sort((a,b)=>(usageMap[b]||0)-(usageMap[a]||0));
  return sorted.slice(0,Math.min(3,sorted.length));
}

function buildFloor(){
  const bp=document.getElementById('bpi');
  bp.innerHTML='';
  bp.appendChild(mk('div','bp-grid-layer'));
  WALLS.forEach(w=>{const e=mk('div','wall');sr(e,w);bp.appendChild(e);});
  COUNTERS.forEach(c=>{
    const e=mk('div','ctr');sr(e,c);
    if(c.label){const s=mk('span');s.textContent=c.label;e.appendChild(s);}
    bp.appendChild(e);
  });
  ZONES.forEach(z=>{
    const e=mk('div','zlabel');e.style.left=z.x+'%';e.style.top=z.y+'%';e.textContent=z.label;bp.appendChild(e);
  });

  // Normal equipment (skip hidden)
  EQUIP.filter(eq=>!eq.hidden).forEach(eq=>{
    const e=mk('div','eq'+(eq.inter?' inter':''));
    e.id='eq-'+eq.id; sr(e,eq);
    e.innerHTML=eq.label.replace(/\n/g,'<br>');
    // timer bar inside
    if(eq.timed){
      const bar=mk('div','eq-timer');bar.id='timer-bar-'+eq.id;bar.style.width='0%';e.appendChild(bar);
    }
    if(eq.inter) e.addEventListener('click',()=>handleClick(eq.id));
    bp.appendChild(e);
  });

  // House brew urn - special element between hot_food and hot_water
  buildHouseBrew(bp);

  // Sink - hidden initially
  const sinkDef=EQUIP.find(e=>e.id==='sink');
  const sink=mk('div','eq inter');
  sink.id='eq-sink'; sr(sink,sinkDef);
  sink.innerHTML='SINK';
  const sinkBar=mk('div','eq-timer');sinkBar.id='timer-bar-sink';sinkBar.style.width='0%';
  sink.appendChild(sinkBar);
  sink.addEventListener('click',()=>handleClick('sink'));
  sink.style.display='none';
  bp.appendChild(sink);

  // Flavors
  FLAVORS.forEach(f=>{
    const e=mk('div','flv inter');e.id='flv-'+f.id;sr(e,f);e.textContent=f.label;
    e.addEventListener('click',()=>handleClick(f.id));
    bp.appendChild(e);

  // Door gap

}

// ---- GAME ----
function shuffleQueue(){queue=[...ORDERS].sort(()=>Math.random()-0.5);}

function loadNext(){
  // Check cleaning round
  if(orderCount>0 && orderCount%CLEAN_CYCLE===0 && !cleaningMode){
    triggerCleaningRound();return;
  }
  if(queue.length===0) shuffleQueue();
  current=queue.shift(); stepDone=new Set(); stepTiming=new Set();
  milkPendingSid=null; milkChosen=null;
  document.getElementById('milk-overlay').classList.remove('show');
  renderKDS(); renderQueue(); resetAll(); applyInitialAvailability();
  // show/hide sink
  const sinkEl=document.getElementById('eq-sink');
  if(sinkEl) sinkEl.style.display='none';
  setLog('> '+current.name);
  // warn if house level low
  if(houseLevel<=HOUSE_LOW) setLog('! house coffee LOW -- refill before serving drip orders');
}

function renderKDS(){
  document.getElementById('kds-name').textContent=current?current.name:'CLEANING';
  const el=document.getElementById('kds-steps');el.innerHTML='';
  if(cleaningMode){
    cleanQueue.forEach(sid=>{
      const e=mk('div','kds-step clean-step');e.id='ks-c-'+sid;
      e.textContent='WASH '+lbl(sid);el.appendChild(e);
    });
    const s=mk('div','kds-step clean-step');s.id='ks-c-sink';s.textContent='USE SINK';el.appendChild(s);
    return;
  }
  // One pill per step, id = ks-{sid}
  current.steps.forEach(s=>{
    const e=mk('div','kds-step'+(s.free?' free-pending':''));
    e.id='ks-'+s.id;
    e.textContent=lbl(s.id)+(s.free?' [FREE]':'');
    el.appendChild(e);
  });
  updateKDS();
}

function updateKDS(){
  if(cleaningMode||!current) return;
  current.steps.forEach(s=>{
    const e=document.getElementById('ks-'+s.id);if(!e)return;
    if(stepDone.has(s.id)){
      e.className='kds-step '+(s.free?'free-done':'done');
    } else if(stepTiming.has(s.id)){
      e.className='kds-step timing';
    } else if(isAvailable(s.id)){
      e.className='kds-step '+(s.free?'free-pending':'current');
    } else {
      e.className='kds-step '+(s.free?'free-pending':'');
    }
  });
}

function renderQueue(){
  if(cleaningMode)return;
  const bar=document.getElementById('queue-bar');bar.innerHTML='';
  [current,...queue.slice(0,3)].forEach((o,i)=>{
    const e=mk('div','q-ticket'+(i===0?' active':''));
    e.innerHTML='<div class="q-label">'+(i===0?'NOW SERVING':'NEXT '+i)+'</div>'+o.name;
    bar.appendChild(e);
  });
}

function resetAll(){
  document.querySelectorAll('.eq').forEach(e=>{
    const id=e.id.replace('eq-','');
    const def=EQUIP.find(q=>q.id===id);
    e.className='eq'+(def&&def.inter?' inter':'');
    if(e.id==='eq-sink') e.style.display='none';
  });
  document.querySelectorAll('.flv').forEach(e=>{e.className='flv inter';});
}

// ---- DAG HELPERS ----
function dagStep(sid){ return current?current.steps.find(s=>s.id===sid):null; }

// A step is available if all its requires are done and it isn't done/timing yet
function isAvailable(sid){
  if(stepDone.has(sid)||stepTiming.has(sid)) return false;
  const s=dagStep(sid); if(!s) return false;
  return s.requires.every(r=>stepDone.has(r));
}

// Steps currently available to click
function availableSteps(){
  if(!current) return [];
  return current.steps.filter(s=>isAvailable(s.id));
}

function isOrderComplete(){
  return current&&current.steps.every(s=>stepDone.has(s.id));
}

function highlight(){
  if(cleaningMode) return;
  const avail=availableSteps();
  if(!expertMode()){
    avail.forEach(s=>{
      if(s.free) setEqClass(s.id,'free-clickable');
      else        setEqClass(s.id,'clickable');
    });
  } else {
    // Expert: make available steps quietly interactive, nothing else
    avail.forEach(s=>setEqClass(s.id,'inter'));
  }
}

// Dim steps that aren't yet available (no inter class = not clickable),
// then highlight whatever is available
function applyInitialAvailability(){
  if(!current) return;
  current.steps.forEach(s=>{
    if(!isAvailable(s.id)){
      ['eq-'+s.id,'flv-'+s.id].forEach(id=>{
        const el=document.getElementById(id);
        if(!el) return;
        el.classList.remove('inter','clickable','free-clickable');
      });
    }
  });
  highlight();
}

function setEqClass(sid,cls){
  ['eq-'+sid,'flv-'+sid].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.classList.remove('inter','used','clickable','free-clickable','timing-active','clean-needed','clean-done','free-used');
    el.classList.add(cls);
  });
}

function getKdsPill(sid){
  if(cleaningMode){
    return document.getElementById('ks-c-'+sid)||document.getElementById('ks-c-sink');
  }
  return document.getElementById('ks-'+sid);
}

function handleClick(sid){
  if(stationTiming(sid)) return;
  if(cleaningMode){ handleCleanClick(sid); return; }
  if(!current) return;

  // REFILL house pot 1
  if(sid==='refill'){
    const ref=document.getElementById('eq-refill');
    if(ref) ref.classList.remove('inter');
    startTimer('refill',TIMED.refill.ms,()=>{
      refillHouse();
      setEqClass('refill','used');
      setLog('house coffee refilled');
      highlight();
    });
    return;
  }
  // REFILL pot 2
  if(sid==='refill2'){
    const ref2=document.getElementById('eq-refill2');
    if(ref2) ref2.classList.remove('inter');
    startTimer('refill2',TIMED.refill2.ms,()=>{
      setEqClass('refill2','used');
      setLog('pot 2 refilled');
      highlight();
    });
    return;
  }

  const step=dagStep(sid);
  if(!step) return; // not part of this order, silent ignore

  // Already done
  if(stepDone.has(sid)) return;

  // Not yet available - shouldn't normally fire since unavailable steps
  // lose their inter class, but guard anyway without penalty
  if(!isAvailable(sid)){
    setLog('! not ready yet');
    return;
  }

  // House brew empty guard
  if(sid==='house_brew'&&houseLevel<=0){
    setLog('! EMPTY - hit REFILL first');
    if(!expertMode()) setEqClass('refill','clickable');
    return;
  }

  // FRIDGE - open milk picker instead of completing directly
  if(sid==='fridge'){
    openFridge(sid);
    return;
  }

  // Execute step
  recordUsage(sid);
  const timedDef=TIMED[sid];
  if(timedDef){
    stepTiming.add(sid);
    setEqClass(sid,'timing-active');
    if(sid==='house_brew') useHouse();
    // KDS pill to timing
    const pill=getKdsPill(sid);
    if(pill) pill.className='kds-step timing';
    setLog('> '+(timedDef.label||sid)+'...');
    startTimer(sid,timedDef.ms,()=>{
      stepTiming.delete(sid);
      completeStep(sid);
    });
    // Don't block - immediately re-highlight so other available steps light up
    highlight();
  } else {
    completeStep(sid);
  }
}

function completeStep(sid){
  stepDone.add(sid);
  setEqClass(sid,'used');
  score+=10; upd();
  updateKDS();

  // Show house brew refill hint if low
  if(sid==='house_brew'&&houseLevel<=HOUSE_LOW&&!expertMode()){
    setLog('! house coffee LOW -- refill soon');
  }

  if(isOrderComplete()){
    score+=50; done++; orderCount++; upd(); updateModeBadge();
    setTimeout(()=>{
      document.getElementById('ov-sub').textContent=
        current.name+'\n\n'+current.note+
        (done===TRAINING_LIMIT?'\n\nTRAINING COMPLETE -- highlights off.':'')+
        '\n\n+50 pts';
      document.getElementById('overlay').classList.add('show');
    },400);
  } else {
    // Dim steps that are still not yet available
    current.steps.forEach(s=>{
      if(!stepDone.has(s.id)&&!stepTiming.has(s.id)&&!isAvailable(s.id)){
        ['eq-'+s.id,'flv-'+s.id].forEach(id=>{
          const el=document.getElementById(id);
          if(!el) return;
          el.classList.remove('inter','clickable','free-clickable');
        });
      }
    });
    // In training mode: highlight newly available steps
    // In expert mode: make available but not glowing
    const newAvail=availableSteps();
    if(!expertMode()){
      newAvail.forEach(s=>{
        if(s.free) setEqClass(s.id,'free-clickable');
        else        setEqClass(s.id,'clickable');
      });
    } else {
      newAvail.forEach(s=>setEqClass(s.id,'inter'));
    }
    // KDS hint only in training
    const hint=document.getElementById('kds-hint');
    if(hint){
      if(!expertMode()){
        const avail=availableSteps().filter(s=>!s.free);
        hint.textContent=avail.length?'> available: '+avail.map(s=>lbl(s.id)).join(', '):'';
      } else {
        hint.textContent='';
      }
    }
  }
}

// ---- CLEANING ROUND ----
function triggerCleaningRound(){
  cleaningMode=true;
  cleanQueue=getCleanTargets();
  cleanDone=new Set();

  // update badge
  const b=document.getElementById('mode-badge');
  b.className='mode-badge cleaning'; b.textContent='CLEANING';

  // build clean subtitle
  const names=cleanQueue.map(s=>lbl(s)).join(', ');
  document.getElementById('clean-sub').textContent=
    'Most used this shift: '+names+'.\nWash each highlighted station, then use the SINK to finish.\nUsage resets after cleaning.';
  document.getElementById('clean-overlay').classList.add('show');
}

function startCleanRound(){
  document.getElementById('clean-overlay').classList.remove('show');
  resetAll();
  const sinkEl=document.getElementById('eq-sink');
  if(sinkEl){ sinkEl.style.display=''; sinkEl.classList.add('inter'); }
  cleanQueue.forEach(sid=>setEqClass(sid,'clean-needed'));
  renderKDS();
  setLog('! wash highlighted stations, then use the SINK');
}

function handleCleanClick(sid){
  if(stationTiming(sid)) return;
  // Sink completes cleaning only after all stations washed
  if(sid==='sink'){
    if(cleanDone.size<cleanQueue.length){
      const rem=cleanQueue.filter(s=>!cleanDone.has(s)).map(s=>lbl(s)).join(', ');
      setLog('! wash first: '+rem);return;
    }
    // wash sink
    startTimer('sink',TIMED.sink.ms,()=>{
      finishCleaning();
    });
    return;
  }
  if(!cleanQueue.includes(sid)||cleanDone.has(sid)) return;

  // timed wash
  startTimer(sid,TIMED.sink.ms,()=>{
    cleanDone.add(sid);
    setEqClass(sid,'clean-done');
    // update KDS pill
    const pill=document.getElementById('ks-c-'+sid);
    if(pill) pill.className='kds-step clean-done';
    setLog(lbl(sid)+' clean. '+(cleanQueue.length-cleanDone.size)+' remaining.');
    // highlight sink always when all done - this is a status indicator, not a "cheat" hint
    if(cleanDone.size>=cleanQueue.length){
      setEqClass('sink','clean-needed');
      setLog('! all clean -- now use the SINK');
    }
  });
}

function finishCleaning(){
  cleaningMode=false;
  usageMap={};
  cleanQueue=[];
  cleanDone=new Set();
  // hide sink
  const sinkEl=document.getElementById('eq-sink');
  if(sinkEl) sinkEl.style.display='none';
  updateModeBadge();
  setLog('cleaning complete -- back to service');
  resetAll();
  loadNext();
}

// ---- HELPERS ----
function lbl(sid){
  const extras=[
    {id:'house_brew2',label:'BREW POT 2'},
    {id:'fridge',     label:'MILK FRIDGE'},
    ...MILKS.map(m=>({id:'milk_'+m.id, label:m.label+' MILK'})),
  ];
  return([...EQUIP,...FLAVORS,...extras].find(e=>e.id===sid)||{label:sid}).label.replace('\n',' ');
}
function upd(){
  document.getElementById('s-score').textContent=score;
  document.getElementById('s-done').textContent=done;
}
function updateModeBadge(){
  if(cleaningMode) return;
  const b=document.getElementById('mode-badge');
  if(done>=TRAINING_LIMIT){b.className='mode-badge expert';b.textContent='EXPERT';}
  else{b.className='mode-badge training';b.textContent='TRAINING';}
}
function setLog(m){document.getElementById('log').textContent=m;}
function mk(tag,cls){const e=document.createElement(tag||'div');if(cls)e.className=cls;return e;}
function sr(el,r){el.style.position='absolute';el.style.left=r.x+'%';el.style.top=r.y+'%';el.style.width=r.w+'%';el.style.height=r.h+'%';}

// ---- MILK FRIDGE ----
function openFridge(sid){
  milkPendingSid=sid;
  const step=dagStep(sid);
  // figure out if order specifies a milk
  const preferred=step&&step.milk||null;

  // build buttons
  const grid=document.getElementById('milk-grid');
  grid.innerHTML='';
  const sub=document.getElementById('milk-sub');
  sub.textContent=preferred?'ORDER WANTS: '+preferred.toUpperCase():'SELECT MILK';

  MILKS.forEach(m=>{
    const btn=document.createElement('button');
    btn.className='milk-btn'+(preferred&&m.id===preferred?' milk-highlight':'');
    btn.textContent=m.label;
    btn.addEventListener('click',()=>selectMilk(m));
    grid.appendChild(btn);
  });
  document.getElementById('milk-overlay').classList.add('show');
}

function selectMilk(m){
  document.getElementById('milk-overlay').classList.remove('show');
  milkChosen=m.label;
  // check penalty: if order specifies milk and wrong one chosen
  const step=dagStep(milkPendingSid);
  if(step&&step.milk&&step.milk!==m.id&&!expertMode()){
    score=Math.max(0,score-5); upd();
    setLog('! wrong milk -- order wanted '+step.milk+', used '+m.label);
  } else {
    setLog('> '+m.label+' milk');
  }
  const sid=milkPendingSid;
  milkPendingSid=null;
  completeStep(sid);
}

// KDS clock
function tickClock(){const n=new Date();document.getElementById('kds-clock').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
setInterval(tickClock,1000);tickClock();

// Button wiring
document.getElementById('ov-btn').addEventListener('click',()=>{
  document.getElementById('overlay').classList.remove('show');
  loadNext();
});
document.getElementById('clean-btn').addEventListener('click',()=>{
  startCleanRound();
});

buildFloor();
shuffleQueue();
loadNext();
startAmbient();
</script>
