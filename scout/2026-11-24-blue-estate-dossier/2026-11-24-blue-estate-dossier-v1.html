<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<title>Estate Dossier</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root {
    --bg: #f4ede0;
    --paper: #fffaf0;
    --ink: #1a1410;
    --muted: #5a4d3f;
    --rule: #d4c5a8;
    --accent: #b8420a;
    --vault: #7c1f0d;
    --blue: #1d4ed8;
    --blue-soft: #dbeafe;
    --protag: #fde047;
    --serif: 'Didot', 'Bodoni MT', 'Iowan Old Style', Georgia, serif;
    --body: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --mono: 'Courier New', Courier, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 14px;
    background-image:
      radial-gradient(circle at 18% 8%, rgba(29, 78, 216, 0.05) 0, transparent 38%),
      radial-gradient(circle at 82% 62%, rgba(124, 31, 13, 0.05) 0, transparent 40%);
  }
  button { font-family: inherit; color: inherit; }

  /* top bar */
  .topbar {
    flex: 0 0 54px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    background: var(--paper);
    border-bottom: 3px solid var(--blue);
  }
  .icon-btn {
    flex: 0 0 40px;
    height: 40px;
    border: 1px solid var(--ink);
    border-radius: 3px;
    background: var(--blue);
    color: #fff;
    font-size: 19px;
    box-shadow: 1px 1px 0 var(--ink);
    cursor: pointer;
    padding: 0;
  }
  .icon-btn:active { transform: translate(1px, 1px); box-shadow: none; }
  .title-wrap { flex: 1; min-width: 0; }
  .t1 { font-family: var(--serif); font-size: 18px; line-height: 1.05; white-space: nowrap; }
  .t1 b { font-family: var(--mono); font-size: 9px; color: var(--blue); font-weight: bold; margin-left: 4px; vertical-align: middle; }
  .t2 {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px;
  }
  .status-chip {
    flex: 0 0 88px;
    text-align: center;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    border: 1px solid var(--ink); border-radius: 12px; padding: 5px 0;
    background: #bef264;
  }
  .status-chip.declining { background: #fcd34d; }
  .status-chip.deceased { background: #d4d4d4; color: var(--vault); font-weight: bold; }

  /* tabs */
  .tabs {
    flex: 0 0 42px;
    display: flex;
    background: var(--bg);
    border-bottom: 1px solid var(--ink);
  }
  .tab {
    flex: 1;
    position: relative;
    border: none;
    border-right: 1px solid var(--rule);
    border-bottom: 3px solid transparent;
    background: transparent;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    padding: 0;
  }
  .tab:last-child { border-right: none; }
  .tab.active { background: var(--paper); border-bottom-color: var(--blue); font-weight: bold; }
  .tab .badge {
    position: absolute; top: 3px; right: 3px;
    min-width: 15px; height: 15px; line-height: 13px;
    border-radius: 8px; border: 1px solid var(--ink);
    background: var(--accent); color: #fff;
    font-size: 8px; padding: 0 3px; display: none;
  }
  .tab .badge.show { display: block; }

  main { flex: 1; position: relative; overflow: hidden; }
  .view { position: absolute; inset: 0; overflow-y: auto; display: none; -webkit-overflow-scrolling: touch; }
  .view.active { display: block; }
  #view-map { overflow: hidden; }

  /* generic controls */
  .btn {
    border: 1px solid var(--ink);
    background: var(--paper);
    border-radius: 3px;
    padding: 9px 11px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    box-shadow: 1px 1px 0 var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:active { transform: translate(1px, 1px); box-shadow: none; }
  .btn.blue { background: var(--blue); color: #fff; }
  .btn.yellow { background: var(--protag); }
  .btn.red { background: #fecaca; }
  .btn.sm { padding: 6px 9px; font-size: 10px; }
  .btn:disabled { opacity: 0.3; cursor: default; box-shadow: none; transform: none; }
  input, select, textarea {
    width: 100%;
    border: 1px solid var(--ink);
    border-radius: 2px;
    background: var(--bg);
    padding: 8px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: 0; }
  textarea { min-height: 70px; font-family: var(--mono); font-size: 12px; }
  .chip {
    display: inline-block;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.05em;
    border: 1px solid var(--ink); border-radius: 9px; padding: 1px 6px;
    background: var(--bg); white-space: nowrap; vertical-align: middle;
  }
  .swatch { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); flex: 0 0 11px; display: inline-block; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }

  /* sticky toolbar shared by list, triage, tasks, intake */
  .toolbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--ink);
    padding: 8px;
  }
  .tool-row { display: flex; gap: 6px; }
  .tool-row + .tool-row { margin-top: 6px; }
  .tool-row input, .tool-row select { padding: 7px; font-size: 12px; }
  .chip-row {
    display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .fchip {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--ink); border-radius: 14px;
    background: var(--bg);
    padding: 5px 10px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase;
    cursor: pointer;
  }
  .fchip.on { background: var(--blue); color: #fff; }
  .fchip.on .swatch { border-color: #fff; }

  .card {
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 3px;
    box-shadow: 2px 2px 0 rgba(26, 20, 16, 0.1);
    margin: 10px;
    padding: 12px;
  }
  .card h3 {
    margin: 0 0 8px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
  }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  @media (max-width: 480px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile {
    text-align: center;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    border: 1px dotted var(--rule); border-radius: 2px; padding: 6px 2px;
  }
  .tile strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 18px; color: var(--ink); margin-bottom: 2px; }
  .tile.blue strong { color: var(--blue); }
  .tile.red strong { color: var(--vault); }
  .bar { height: 8px; border: 1px solid var(--ink); border-radius: 2px; background: var(--bg); overflow: hidden; }
  .bar > div { height: 100%; background: var(--blue); }
  .bar-label { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); margin: 8px 0 3px; }

  /* rows */
  .group-head {
    display: flex; align-items: center; gap: 6px;
    margin: 14px 10px 4px;
    font-family: var(--serif); font-size: 15px;
  }
  .group-head .mono { font-size: 10px; color: var(--muted); }
  .rows { margin: 0 10px; border: 1px solid var(--ink); border-radius: 3px; background: var(--paper); overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px;
    border-bottom: 1px dotted var(--rule);
    cursor: pointer;
    min-height: 44px;
  }
  .row:last-child { border-bottom: none; }
  .row:active { background: var(--blue-soft); }
  .row .dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); flex: 0 0 11px; }
  .row .dot.dead { opacity: 0.45; border-style: dashed; }
  .row .main { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.dead .name { color: var(--muted); text-decoration: line-through; }
  .row .sub { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .badges { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 48%; }
  .row .side { flex: 0 0 auto; }
  .empty { padding: 36px 20px; text-align: center; font-style: italic; color: var(--muted); }

  /* map */
  #map-wrap { position: absolute; inset: 0; }
  #map-svg { width: 100%; height: 100%; display: block; touch-action: none; }
  .map-ui { position: absolute; z-index: 4; }
  .map-key { top: 8px; left: 8px; max-width: 170px; }
  .key-toggle {
    border: 1px solid var(--ink); background: rgba(255, 250, 240, 0.96); border-radius: 3px;
    padding: 6px 9px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    box-shadow: 1px 1px 0 var(--ink); cursor: pointer;
  }
  .key-body {
    display: none;
    margin-top: 4px;
    background: rgba(255, 250, 240, 0.97); border: 1px solid var(--ink); border-radius: 3px;
    padding: 6px; box-shadow: 2px 2px 0 rgba(26, 20, 16, 0.15);
    max-height: 55vh; overflow-y: auto;
  }
  .map-key.open .key-body { display: block; }
  .key-item {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 10px; padding: 3px 4px; border-radius: 2px; cursor: pointer;
  }
  .key-item.on { background: var(--ink); color: var(--paper); }
  .map-color { top: 8px; right: 8px; }
  .map-color select {
    width: auto; padding: 6px; font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    background: rgba(255, 250, 240, 0.96); box-shadow: 1px 1px 0 var(--ink);
  }
  .map-crumb {
    top: 17px; left: 64px; right: 156px; pointer-events: none;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .map-crumb b { color: var(--blue); }
  .map-zoom { right: 8px; bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
  .map-zoom button, .map-brokers {
    width: 40px; height: 40px;
    border: 1px solid var(--ink); background: var(--paper); border-radius: 3px;
    font-family: var(--mono); font-size: 16px; box-shadow: 1px 1px 0 var(--ink); cursor: pointer; padding: 0;
  }
  .map-brokers {
    left: 8px; bottom: 10px; width: auto; height: 40px; padding: 0 10px;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    background: #2dd4bf; display: none;
  }
  .map-brokers.show { display: block; }
  .map-empty {
    left: 50%; top: 62%; transform: translateX(-50%);
    text-align: center; display: none; width: 240px;
    background: var(--paper); border: 1px solid var(--ink); border-radius: 3px; padding: 12px;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .map-empty.show { display: block; }
  .map-empty p { margin: 0 0 10px; font-style: italic; color: var(--muted); }

  .link { fill: none; stroke-opacity: 0.35; stroke-width: 1px; transition: stroke-opacity 0.2s; }
  .link.dim { stroke-opacity: 0.05; }
  .link.lit { stroke-opacity: 0.9; stroke-width: 1.6px; }
  .node { cursor: pointer; }
  .node .hit { fill: transparent; }
  .node .dot { stroke: var(--ink); stroke-width: 1px; transition: opacity 0.2s; }
  .node.cat .dot { stroke-width: 1.5px; }
  .node.dead .dot { fill-opacity: 0.45; stroke-dasharray: 2 2; }
  .node.dim .dot { opacity: 0.14; }
  .node.dim text { opacity: 0.08; }
  .node.sib .dot { opacity: 0.35; }
  .node.sib text { opacity: 0.22; }
  .node .done-mark { fill: var(--ink); display: none; pointer-events: none; }
  .node.done .done-mark { display: block; }
  .node.focus .dot { stroke: var(--blue); stroke-width: 2.5px; }
  .leaf-label { font-family: var(--mono); font-size: 8.5px; fill: var(--ink); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .node.show-label .leaf-label { opacity: 1; }
  .node.dead .leaf-label { fill: var(--muted); text-decoration: line-through; }
  .cat-name { font-family: var(--mono); font-size: 8px; font-weight: bold; pointer-events: none; }
  .cat-count { font-family: var(--mono); font-size: 7px; fill: var(--muted); pointer-events: none; }
  .center { cursor: pointer; }
  .center-dot { fill: var(--protag); stroke: var(--ink); stroke-width: 2; }
  .center-ring { fill: none; stroke: var(--blue); stroke-width: 1; stroke-dasharray: 2 3; pointer-events: none; }
  .center-name { font-family: var(--serif); font-weight: 600; font-size: 10.5px; text-anchor: middle; pointer-events: none; }
  .center-meta { font-family: var(--mono); font-size: 7px; fill: var(--muted); text-anchor: middle; pointer-events: none; }
  .meta-link { fill: none; stroke-dasharray: 3 3; stroke-opacity: 0.75; }
  .meta-node circle { stroke: var(--ink); stroke-width: 0.8px; }
  .meta-node text { font-family: var(--mono); font-size: 7.5px; fill: var(--ink); pointer-events: none; }
  .meta-node text.meta-key { font-size: 6.5px; fill: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .broker-node { cursor: pointer; }
  .broker-node .dot { stroke: var(--ink); stroke-width: 1px; }
  .broker-node .relist { fill: none; stroke: var(--vault); stroke-width: 1.4px; stroke-dasharray: 2 2; }
  .broker-node.focus .dot { stroke: var(--blue); stroke-width: 2.5px; }
  .broker-label { font-family: var(--mono); font-size: 8px; fill: var(--ink); pointer-events: none; }

  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(26, 20, 16, 0.35); z-index: 55; display: none; }
  .scrim.show { display: block; }
  #sheet-scrim { z-index: 39; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: min(310px, 84vw);
    background: var(--paper);
    border-right: 3px solid var(--blue);
    z-index: 60;
    transform: translateX(-105%);
    transition: transform 0.22s;
    display: flex; flex-direction: column;
    box-shadow: 4px 0 0 rgba(26, 20, 16, 0.12);
  }
  .drawer.open { transform: none; }
  .drawer-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 10px; border-bottom: 1px solid var(--ink);
  }
  .drawer-head .t1 { flex: 1; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 6px 10px 20px; }
  .drawer details { border-bottom: 1px dotted var(--rule); padding: 6px 0; }
  .drawer summary {
    list-style: none; cursor: pointer; padding: 8px 2px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--blue);
    display: flex; justify-content: space-between;
  }
  .drawer summary::-webkit-details-marker { display: none; }
  .drawer summary::after { content: "+"; color: var(--muted); }
  .drawer details[open] summary::after { content: "-"; }
  .menu-item {
    display: block; width: 100%; text-align: left;
    border: 1px solid transparent; background: transparent; border-radius: 2px;
    padding: 9px 8px; font-size: 14px; cursor: pointer;
  }
  .menu-item:active { background: var(--blue-soft); }
  .menu-item small { display: block; font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 0.05em; margin-top: 2px; }
  .menu-item.on { border-color: var(--ink); background: var(--blue-soft); }
  .drawer-foot { flex: 0 0 auto; padding: 8px 10px; border-top: 1px solid var(--rule); font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 0.05em; }

  /* bottom sheet */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--paper);
    border-top: 3px solid var(--blue);
    border-radius: 8px 8px 0 0;
    z-index: 40;
    transform: translateY(105%);
    transition: transform 0.22s;
    display: flex; flex-direction: column;
    box-shadow: 0 -3px 0 rgba(26, 20, 16, 0.12);
    max-height: 88dvh;
  }
  .sheet.peek { max-height: 46dvh; }
  .sheet.open { transform: none; }
  .sheet-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 9px 10px; border-bottom: 1px solid var(--ink);
  }
  .sheet-title { flex: 1; min-width: 0; font-family: var(--serif); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-actions { display: flex; gap: 5px; flex: 0 0 auto; }
  .sheet-close {
    flex: 0 0 34px; height: 34px; border: 1px solid var(--ink); border-radius: 50%;
    background: var(--bg); font-size: 16px; cursor: pointer; padding: 0;
  }
  .sheet-body { flex: 1; overflow-y: auto; padding: 10px 12px 18px; }
  .seg-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 4px 0 4px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
  .seg button {
    border: 1px solid var(--ink); background: var(--bg); border-radius: 3px;
    padding: 8px 4px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .seg button.on { background: var(--blue); color: #fff; font-weight: bold; }
  .seg button.on .swatch { border-color: #fff; }
  .seg button:disabled { opacity: 0.3; }
  dl.dl { display: grid; grid-template-columns: 96px 1fr; gap: 5px 10px; margin: 6px 0 0; font-size: 13px; }
  dl.dl dt { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  dl.dl dd { margin: 0; word-break: break-word; }
  dl.dl a { color: var(--blue); }
  .hist { font-family: var(--mono); font-size: 10px; border-left: 2px solid var(--blue); padding-left: 8px; margin-top: 4px; }
  .hist div { padding: 2px 0; }
  .note { font-size: 12px; font-style: italic; color: var(--muted); margin: 4px 0 10px; }
  .warn { background: #fee2e2; border: 1px solid var(--vault); border-radius: 2px; padding: 6px 8px; font-size: 12px; margin-bottom: 10px; color: var(--vault); }
  pre.json {
    background: var(--bg); border: 1px solid var(--ink); border-radius: 2px; padding: 8px;
    font-family: var(--mono); font-size: 10px; white-space: pre-wrap; word-break: break-all; margin: 0;
  }

  /* forms */
  .field { margin-bottom: 10px; }
  .field label { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .adder { display: flex; gap: 6px; }
  .adder input { flex: 1; }
  .adder .btn { flex: 0 0 64px; }
  .tags { margin-top: 6px; }
  .tag {
    display: inline-block; vertical-align: top;
    border: 1px solid var(--ink); border-radius: 12px; background: var(--bg);
    padding: 3px 4px 3px 9px; margin: 0 5px 5px 0; font-size: 12px; max-width: 100%;
  }
  .tag span { vertical-align: middle; word-break: break-word; }
  .tag button { display: inline-block; vertical-align: middle; width: 22px; height: 22px; margin-left: 6px; border-radius: 50%; border: 1px solid var(--vault); background: transparent; color: var(--vault); cursor: pointer; padding: 0; font-size: 12px; }

  /* intake */
  .istep { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dots { display: flex; gap: 3px; margin: 7px 0; }
  .dots button { flex: 1; height: 8px; border: 1px solid var(--ink); border-radius: 1px; background: var(--bg); padding: 0; cursor: pointer; }
  .dots button.done { background: var(--protag); }
  .dots button.cur { background: var(--blue); }
  .inav { display: flex; gap: 6px; }
  .inav .btn { flex: 1; }
  .step-title { font-family: var(--serif); font-size: 22px; margin: 2px 0 4px; }
  .step-hint { font-style: italic; color: var(--muted); font-size: 12.5px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dotted var(--rule); }
  .ck-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .ck-head .mono { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .ck {
    display: flex; align-items: stretch;
    border: 1px solid var(--ink); border-radius: 3px; background: var(--bg);
    margin-bottom: 5px; overflow: hidden;
  }
  .ck.on { background: #ecfccb; }

function addTask(sid, t) {
  const dup = S.tasks.find(x => x.subject_id === sid && x.status === "open" && x.type === t.type && (x.ref || null) === (t.ref || null));
  if (dup) return dup;
  const task = { task_id: uuid(), subject_id: sid, type: t.type, title: t.title, due: t.due || today(), ref: t.ref || null, notes: t.notes || "", status: "open", created_at: nowISO(), done_at: null };
  S.tasks.push(task); return task;
}
function closeTasks(sid, type, ref) {
  S.tasks.forEach(t => { if (t.subject_id === sid && t.status === "open" && t.type === type && t.ref === ref) { t.status = "done"; t.done_at = nowISO(); } });
}
function scheduleRechecks(sid, b) {
  const base = b.submission_date || today();
  [30, 90, 180].forEach(d => addTask(sid, { type: "recheck_" + d + "d", title: `Re-check ${b.name} (${d} day)`, due: addDays(base, d), ref: b.id }));
}
function brokerTransition(sid, bid, to, opts) {
  opts = opts || {};
  const sub = S.subjects.find(x => x.subject_id === sid); if (!sub || !sub.brokers || !sub.brokers[bid]) return false;
  const b = sub.brokers[bid]; const from = b.status;
  if (!(TRANSITIONS[from] || []).includes(to)) { toast(`Not allowed: ${from} to ${to}`, "err"); return false; }
  const p = S.persons.find(x => x.person_id === sub.person_id) || {};
  if (to === "submitted" && p.death_status === "deceased") { toast("Locked: subject is deceased. Use the deceased packet workflow.", "err"); return false; }
  b.status = to;
  b.history = b.history || [];
  b.history.push({ at: nowISO(), status: to, source: opts.source || "operator" });
  if (to === "submitted") {
    b.submission_date = opts.date || today();
    if (opts.ref !== undefined && opts.ref !== null) b.confirmation_ref = opts.ref;
    scheduleRechecks(sid, b);
    closeTasks(sid, "submit_optout", bid); closeTasks(sid, "relist", bid);
  }
  if (to === "found") {
    if (from === "clean") {
      b.relisted = true;
      addTask(sid, { type: "relist", title: `Re-list detected: ${b.name}, submit opt-out again`, due: today(), ref: bid });
    } else addTask(sid, { type: "submit_optout", title: `Submit opt-out: ${b.name}`, due: today(), ref: bid });
  }
  if (to === "clean") { b.relisted = false; closeTasks(sid, "relist", bid); }
  if (to === "skip") closeTasks(sid, "submit_optout", bid);
  log("broker_status", { broker: bid, from, to });
  return true;
}

function setDeathStatus(c, val) {
  const prev = c.person.death_status || "living";
  if (prev === val) return true;
  if (val === "deceased") {
    if (!confirm("Record a death event for " + (c.person.full_legal_name || "this subject") + "? This locks new opt-out submissions and adds the post-mortem playbook to Tasks.")) return false;
    c.person.death_status = "deceased"; c.person.death_recorded_at = nowISO();
    runDeathPlaybook(c);
    log("death_event", { from: prev });
    toast("Death event recorded. Playbook added to Tasks.");
  } else {
    c.person.death_status = val;
    log("death_status", { from: prev, to: val });
  }
  persist(); return true;
}
function runDeathPlaybook(c) {
  const sid = c.sid, d = today();
  [
    ["death_cert", "Order certified copies of the death certificate", d],
    ["death_2fa", "Keep the primary phone line active for 2FA recovery", d],

  ].forEach(([type, title, due]) => addTask(sid, { type, title, due }));

    addTask(sid, { type: "memorialize", title: `Memorialize: ${a.name}`, due: addDays(d, 14), ref: a.account_id }));
  accts.filter(a => a.category === "subs" && a.disposition === "close" && a.progress !== "done" && Number(a.fee) > 0).forEach(a =>
    addTask(sid, { type: "cancel_sub", title: `Cancel: ${a.name} (${money(a.fee)}/mo)`, due: addDays(d, 5), ref: a.account_id }));
  const names = accts.map(a => a.name.toLowerCase()).join(" | ");
  if (/hmrc|gov\.uk|nhs/.test(names)) addTask(sid, { type: "death_uk", title: "Notify HMRC and UK services (Tell Us Once)", due: addDays(d, 14) });
  if (/elster|schufa/.test(names)) addTask(sid, { type: "death_de", title: "Notify Finanzamt and Schufa (DE)", due: addDays(d, 14) });
  if (/my number|japan post|smbc/.test(names)) addTask(sid, { type: "death_jp", title: "Notify JP tax office and My Number office", due: addDays(d, 14) });
}

  empty.querySelector("p").textContent = c ? "No accounts on this profile yet." : "No profiles on this account yet.";
  $("#empty-intake").textContent = c ? "Start intake" : "Create profile";
  if (M.cat && !groups.find(x => x.cat.key === M.cat)) { M.cat = null; M.leafId = null; }
  if (M.leafId && !accts.find(a => a.account_id === M.leafId)) M.leafId = null;

  const R = Math.max(90, Math.min(W, H) / 2 - 34); M.R = R;
  const root = d3.hierarchy({ children: groups });
  if (groups.length) {
    d3.cluster().size([2 * Math.PI, R * 0.82]).separation((a, b) => a.parent === b.parent ? 1 : 1.8)(root);
    root.children.forEach(n => { n.y = R * 0.5; });
  }
  M.root = root;

  if (groups.length) {
    linkG.selectAll("path").data(root.links()).join("path")
      .attr("class", "link")
      .attr("stroke", d => CAT[catKeyOf(d.target)].color)
      .attr("d", d3.linkRadial().angle(d => d.x).radius(d => d.y));

    const nodes = nodeG.selectAll("g").data(root.descendants().filter(d => d.depth > 0)).join("g")
      .attr("class", d => d.depth === 1 ? "node cat"
        : "node leaf" + (isDead(d.data.a) ? " dead" : "") + (d.data.a.progress === "done" ? " done" : ""))
      .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`);

    nodes.filter(d => d.depth === 1).each(function (d) {
      const s = d3.select(this);
      s.append("circle").attr("class", "hit").attr("r", 21);
      s.append("circle").attr("class", "dot").attr("r", 15.5).attr("fill", d.data.cat.color);
      const tg = s.append("g").attr("transform", `rotate(${90 - d.x * 180 / Math.PI})`);
      tg.append("text").attr("class", "cat-name").attr("text-anchor", "middle").attr("dy", "-0.05em").text(d.data.cat.short);
      tg.append("text").attr("class", "cat-count").attr("text-anchor", "middle").attr("dy", "1.2em").text(d.children.length);
    }).on("click", (e, d) => { e.stopPropagation(); focusCat(d.data.cat.key, true); });

    nodes.filter(d => d.depth === 2).each(function (d) {
      const s = d3.select(this);
      s.append("circle").attr("class", "hit").attr("r", 11);
      s.append("circle").attr("class", "dot").attr("r", 4.5).attr("fill", leafColor(d.data.a));
      s.append("circle").attr("class", "done-mark").attr("r", 1.7);
      const left = d.x >= Math.PI;
      s.append("text").attr("class", "leaf-label").attr("dy", "0.32em")
        .attr("x", left ? -9 : 9).attr("text-anchor", left ? "end" : "start")
        .attr("transform", left ? "rotate(180)" : null).text(d.data.a.name);
    }).on("click", (e, d) => { e.stopPropagation(); focusLeaf(d.data.a.account_id, true); });
  }

  // protagonist
  const brokers = c ? brokersOf(c.sid) : [];
  const center = g.append("g").attr("class", "center").on("click", e => { e.stopPropagation(); centerTap(); });
  center.append("circle").attr("class", "center-dot").attr("r", 36);
  if (brokers.length) {
    const counts = {}; brokers.forEach(b => { counts[b.status] = (counts[b.status] || 0) + 1; });
    let a0 = 0;
    Object.keys(BSTAT).forEach(st => {
      const n = counts[st] || 0; if (!n) return;
      const a1 = a0 + n / brokers.length * Math.PI * 2;
      center.append("path").attr("d", d3.arc().innerRadius(40).outerRadius(46).startAngle(a0).endAngle(a1)())
        .attr("fill", BSTAT[st].color).attr("stroke", "#1a1410").attr("stroke-width", 0.5).style("pointer-events", "none");
      a0 = a1;
    });
    center.append("circle").attr("cx", 29).attr("cy", -29).attr("r", 10).attr("fill", "#2dd4bf").attr("stroke", "#1a1410");
    center.append("text").attr("x", 29).attr("y", -26).attr("text-anchor", "middle")
      .style("font-family", "Courier New, monospace").style("font-size", "8.5px").style("font-weight", "bold").style("pointer-events", "none")
      .text(brokers.length);
  } else {
    center.append("circle").attr("class", "center-ring").attr("r", 42);
  }
  center.append("text").attr("class", "center-name").attr("y", -1).text(c ? shortName(c.person.full_legal_name) : "No profile");
  center.append("text").attr("class", "center-meta").attr("y", 11).text(c ? (c.subject.case_id || "") : "");

  const mb = $("#map-brokers");
  mb.classList.toggle("show", brokers.length > 0);
  mb.textContent = "Brokers " + brokers.length;

  M.zoom = d3.zoom().scaleExtent([0.45, 5]).on("zoom", e => { M.t = e.transform; g.attr("transform", e.transform); });
  svg.call(M.zoom).on("dblclick.zoom", null);
  svg.call(M.zoom.transform, M.t);
  svg.on("click", e => { if (e.target === svg.node()) clearFocus(); });

  if (M.broker && !brokers.length) { M.broker = false; M.brokerId = null; }
  applyFocus();
}

function applyFocus() {
  if (!M.g) return;
  const { cat, leafId, broker } = M;
  M.g.selectAll(".link")
    .classed("dim", d => broker || (!!cat && catKeyOf(d.target) !== cat))
    .classed("lit", d => !broker && !!cat && catKeyOf(d.target) === cat);
  M.g.selectAll(".node")
    .classed("dim", d => broker || (!!cat && catKeyOf(d) !== cat))
    .classed("sib", d => !broker && !!leafId && d.depth === 2 && catKeyOf(d) === cat && d.data.a.account_id !== leafId)
    .classed("focus", d => !broker && d.depth === 2 && d.data.a.account_id === leafId)
    .classed("show-label", d => !broker && !!cat && d.depth === 2 && catKeyOf(d) === cat);
  M.metaG.selectAll("*").remove();
  if (broker) drawBrokerRing(); else if (leafId) drawLeafMeta();
  renderKey(); renderCrumb();
}

function findLeaf(id) { return M.root ? M.root.leaves().find(n => n.depth === 2 && n.data.a.account_id === id) : null; }

function accountMetas(a) {
  const out = [];
  out.push({ k: "status", v: a.status + (a.died ? " d." + a.died : ""), c: (STATUS[a.status] || STATUS.active).color });
  out.push({ k: "plan", v: (DISPO[a.disposition] || DISPO.undecided).name + " / " + a.progress, c: (DISPO[a.disposition] || DISPO.undecided).color });
  if (a.born) out.push({ k: "born", v: "b. " + a.born, c: "#e9d5ff" });
  if (a.balance !== null && a.balance !== undefined) out.push({ k: "balance", v: money(a.balance), c: Number(a.balance) >= 0 ? "#bbf7d0" : "#fecaca" });
  if (Number(a.fee) > 0) out.push({ k: "fee", v: money(a.fee) + "/mo", c: "#fed7aa" });
  if (a.cred) out.push({ k: "cred", v: a.cred, c: "#e0f2fe" });
  if (a.twofa) out.push({ k: "2fa", v: a.twofa, c: "#c7d2fe" });
  if (a.recovery) out.push({ k: "recovery", v: a.recovery, c: "#fef08a" });
  return out;
}
function brokerMetas(b) {
  const out = [{ k: "status", v: b.status, c: BSTAT[b.status].color }];
  if (b.priority) out.push({ k: "priority", v: b.priority, c: "#e9d5ff" });
  if (b.submission_date) out.push({ k: "submitted", v: b.submission_date, c: "#fef08a" });
  if (b.confirmation_ref) out.push({ k: "ref", v: b.confirmation_ref, c: "#e0f2fe" });
  if (b.requirements && b.requirements.length) out.push({ k: "reqs", v: b.requirements.slice(0, 2).join("+"), c: "#c7d2fe" });
  if (b.relisted) out.push({ k: "alert", v: "re-listed", c: "#fca5a5" });
  return out;
}

function drawFan(ax, ay, baseAngle, metas, radius) {
  if (!metas.length) return;
  const span = Math.min(Math.PI * 0.95, 0.18 * metas.length + 0.45);
  const start = baseAngle - span / 2;
  const step = metas.length > 1 ? span / (metas.length - 1) : 0;
  metas.forEach((m, i) => {
    const ang = normAngle(metas.length > 1 ? start + step * i : baseAngle);
    const [dx, dy] = polar(ang, radius);
    const mx = ax + dx, my = ay + dy;
    M.metaG.append("path").attr("class", "meta-link").attr("stroke", m.c).attr("d", `M${ax},${ay}L${mx},${my}`);
    const grp = M.metaG.append("g").attr("class", "meta-node").attr("transform", `translate(${mx},${my})`);
    grp.append("circle").attr("r", 5).attr("fill", m.c);
    const left = ang >= Math.PI;
    const lg = grp.append("g").attr("transform", `rotate(${ang * 180 / Math.PI - 90 + (left ? 180 : 0)})`);
    const tx = left ? -10 : 10, anchor = left ? "end" : "start";
    lg.append("text").attr("class", "meta-key").attr("x", tx).attr("y", -1).attr("text-anchor", anchor).text(m.k);
    lg.append("text").attr("x", tx).attr("y", 7).attr("text-anchor", anchor).text(m.v);
  });
}

function drawLeafMeta() {
  const n = findLeaf(M.leafId); if (!n) return;
  const [ax, ay] = polar(n.x, n.y);
  drawFan(ax, ay, n.x, accountMetas(n.data.a), 78);
}

function brokerRadius() { return Math.min(112, M.R * 0.62); }
function drawBrokerRing() {
  const c = cur(); if (!c) return;
  const list = brokersOf(c.sid); if (!list.length) return;
  const rb = brokerRadius();
  list.forEach((b, i) => {
    const ang = i / list.length * Math.PI * 2;
    const [x, y] = polar(ang, rb);
    M.metaG.append("path").attr("class", "meta-link").attr("stroke", BSTAT[b.status].color).attr("d", `M0,0L${x},${y}`);
    const grp = M.metaG.append("g").attr("class", "broker-node" + (b.id === M.brokerId ? " focus" : ""))
      .attr("transform", `translate(${x},${y})`)
      .on("click", e => { e.stopPropagation(); focusBroker(b.id, true); });
    grp.append("circle").attr("r", 13).attr("fill", "transparent");
    if (b.relisted) grp.append("circle").attr("class", "relist").attr("r", 9.5);
    grp.append("circle").attr("class", "dot").attr("r", 6).attr("fill", BSTAT[b.status].color);
    const left = ang > Math.PI;
    const [lx, ly] = polar(ang, rb + 13);
    M.metaG.append("text").attr("class", "broker-label")
      .attr("transform", `translate(${lx},${ly}) rotate(${ang * 180 / Math.PI - 90 + (left ? 180 : 0)})`)
      .attr("text-anchor", left ? "end" : "start").attr("dy", "0.32em")
      .style("opacity", M.brokerId && M.brokerId !== b.id ? 0.3 : 1)
      .text(b.name);
    if (b.id === M.brokerId) drawFan(x, y, ang, brokerMetas(b), 56);
  });
}

function zoomTo(px, py, k, ty) {
  if (!M.svg) return;
  const t = d3.zoomIdentity.translate(-k * px, ty - k * py).scale(k);
  M.svg.transition().duration(420).call(M.zoom.transform, t);
}
function zoomReset() { if (M.svg) M.svg.transition().duration(380).call(M.zoom.transform, d3.zoomIdentity); }

function focusCat(key, zoom) {
  M.cat = key; M.leafId = null; M.broker = false; M.brokerId = null;
  closeSheet(true);
  applyFocus();
  if (zoom && M.root) {
    const leaves = M.root.leaves().filter(n => n.depth === 2 && catKeyOf(n) === key);
    if (leaves.length) {
      const mean = leaves.reduce((s, n) => s + n.x, 0) / leaves.length;
      const [px, py] = polar(mean, M.R * 0.55);
      zoomTo(px, py, 1.25, 0);
    }
  }
}
function focusLeaf(id, zoom) {
  const n = findLeaf(id); if (!n) return;
  M.cat = catKeyOf(n); M.leafId = id; M.broker = false; M.brokerId = null;
  applyFocus();
  openAccountSheet(id, { peek: true });
  if (zoom) { const [px, py] = polar(n.x, n.y + 40); zoomTo(px, py, 1.55, -M.H * 0.2); }
}
function enterBrokers() {
  M.broker = true; M.cat = null; M.leafId = null; M.brokerId = null;
  applyFocus(); zoomReset(); openBrokerOverview();
}
function focusBroker(id, zoom) {
  const c = cur(); const list = brokersOf(c.sid); const i = list.findIndex(b => b.id === id); if (i < 0) return;
  M.broker = true; M.cat = null; M.leafId = null; M.brokerId = id;
  applyFocus();
  openBrokerSheet(id, { peek: true });
  if (zoom) { const ang = i / list.length * Math.PI * 2; const [px, py] = polar(ang, brokerRadius() + 30); zoomTo(px, py, 1.6, -M.H * 0.2); }
}
function clearFocus() {
  M.cat = null; M.leafId = null; M.broker = false; M.brokerId = null;
  closeSheet(true); applyFocus(); zoomReset();
}
function centerTap() {
  const c = cur(); if (!c) return;
  if (brokersOf(c.sid).length) enterBrokers();
  else { M.cat = null; M.leafId = null; applyFocus(); openSubjectSheet(); }
}

function renderKey() {
  const body = $("#key-body"); if (!body) return;
  $("#map-key").classList.toggle("open", M.keyOpen);
  let html = "";
  const c = cur(); const accts = c ? accountsOf(c.sid) : [];
  if (M.broker) {
    html = Object.entries(BSTAT).map(([k, v]) => `<div class="key-item"><span class="swatch" style="background:${v.color}"></span>${v.name}</div>`).join("");
  } else if (M.colorBy === "category") {
    html = CATS.filter(k => accts.some(a => a.category === k.key)).map(k =>
      `<div class="key-item ${M.cat === k.key ? "on" : ""}" data-cat="${k.key}"><span class="swatch" style="background:${k.color}"></span>${esc(k.name)} (${accts.filter(a => a.category === k.key).length})</div>`).join("");
  } else if (M.colorBy === "disposition") {
    html = DISPOS.map(d => `<div class="key-item"><span class="swatch" style="background:${d.color}"></span>${d.name} (${accts.filter(a => a.disposition === d.key).length})</div>`).join("");
  } else {
    html = STATUSES.map(s => `<div class="key-item"><span class="swatch" style="background:${s.color}"></span>${s.name} (${accts.filter(a => a.status === s.key).length})</div>`).join("");
  }
  body.innerHTML = html || `<div class="key-item muted">empty</div>`;
  body.querySelectorAll("[data-cat]").forEach(el => el.onclick = () => focusCat(el.dataset.cat, true));
}
function renderCrumb() {
  const el = $("#map-crumb"); if (!el) return;
  const parts = ["All"];
  if (M.broker) { parts.push("Brokers"); const c = cur(); const b = M.brokerId && c && brokersOf(c.sid).find(x => x.id === M.brokerId); if (b) parts.push(b.name); }
  else if (M.cat) { parts.push(CAT[M.cat].name); const n = M.leafId && findLeaf(M.leafId); if (n) parts.push(n.data.a.name); }
  el.innerHTML = parts.map((p, i) => i === parts.length - 1 ? `<b>${esc(p)}</b>` : esc(p)).join(" &rsaquo; ");
}

// ============================================================
//  SHEET
// ============================================================
let sheetOnClose = null;
function openSheet(o) {
  const sh = $("#sheet");
  sh.classList.toggle("peek", !!o.peek);
  $("#sheet-title").innerHTML = esc(o.title || "") + (o.chip ? ` <span class="chip" style="background:${o.chip.color || "#f4ede0"}">${esc(o.chip.text)}</span>` : "");
  const act = $("#sheet-actions"); act.innerHTML = "";
  (o.actions || []).forEach(a => {
    const b = document.createElement("button");
    b.className = "btn sm " + (a.cls || ""); b.textContent = a.label; b.onclick = a.onClick;
    act.appendChild(b);
  });
  const body = $("#sheet-body");
  body.innerHTML = o.body || "";
  if (!o.keepScroll) body.scrollTop = 0;
  sh.classList.add("open");
  $("#sheet-scrim").classList.toggle("show", !o.peek);
  sheetOnClose = o.onClose || null;
  return body;
}
function closeSheet(silent) {
  const sh = $("#sheet");
  if (!sh.classList.contains("open")) return;
  sh.classList.remove("open");
  $("#sheet-scrim").classList.remove("show");
  const cb = sheetOnClose; sheetOnClose = null;
  if (cb && !silent) cb();
}
function sheetIsOpen() { return $("#sheet").classList.contains("open"); }

// ============================================================
//  ACCOUNT SHEETS
// ============================================================
function accountViewHTML(a) {
  const dispoBtns = DISPOS.map(d => `<button data-dispo="${d.key}" class="${a.disposition === d.key ? "on" : ""}"><span class="swatch" style="background:${d.color}"></span>${d.name}</button>`).join("");
  const progBtns = PROGRESS.map(p => `<button data-prog="${p}" class="${a.progress === p ? "on" : ""}">${p}</button>`).join("");
  const rows = [];
  const r = (k, v) => { if (v !== null && v !== undefined && v !== "") rows.push(`<dt>${k}</dt><dd>${v}</dd>`); };
  r("category", esc(CAT[a.category].name));
  r("identifier", esc(a.identifier));
  r("status", esc(a.status) + (a.died ? " (closed " + esc(a.died) + ")" : ""));
  r("born", esc(a.born));
  if (a.balance !== null && a.balance !== undefined && a.balance !== "") r("balance", money(a.balance));
  if (Number(a.fee) > 0) r("fee", money(a.fee) + " / month");
  r("credentials", esc(a.cred));
  r("2FA", esc(a.twofa));
  r("recovery", esc(a.recovery));
  r("notes", esc(a.notes));
  r("updated", fmtDate(a.updated_at));
  return `<div class="seg-label">Disposition</div><div class="seg">${dispoBtns}</div>
    <div class="seg-label">Progress</div><div class="seg">${progBtns}</div>
    <dl class="dl">${rows.join("")}</dl>`;
}
function openAccountSheet(id, opts) {
  opts = opts || {};
  const a = S.accounts.find(x => x.account_id === id);
  if (!a) { closeSheet(true); return; }
  const body = openSheet({
    title: a.name,
    chip: { text: CAT[a.category].short, color: CAT[a.category].color },
    peek: !!opts.peek,
    keepScroll: !!opts.keepScroll,
    actions: [{ label: "Edit", cls: "blue", onClick: () => openAccountEditor(id, { returnPeek: !!opts.peek }) }],
    onClose: opts.peek ? () => { M.leafId = null; applyFocus(); } : null,
    body: accountViewHTML(a)
  });
  body.querySelectorAll("[data-dispo]").forEach(b => b.onclick = () => {
    a.disposition = b.dataset.dispo; a.updated_at = nowISO();
    log("disposition", { account: a.name, to: a.disposition });
    afterAccountChange(id, opts);
  });
  body.querySelectorAll("[data-prog]").forEach(b => b.onclick = () => {
    a.progress = b.dataset.prog; a.updated_at = nowISO();
    log("progress", { account: a.name, to: a.progress });
    afterAccountChange(id, opts);
  });
}
function afterAccountChange(id, opts) {
  persist();
  refreshUnderSheet();
  openAccountSheet(id, Object.assign({}, opts, { keepScroll: true }));
}
function refreshUnderSheet() {
  renderChrome();
  if (VIEW === "map") buildMap(); else renderView();
}

function openAccountEditor(id, opts) {
  opts = opts || {};
  const c = cur(); if (!c) return;
  const isNew = !id;
  const a = isNew ? makeAccount(c.sid, opts.category || "email", "", {}) : S.accounts.find(x => x.account_id === id);
  if (!a) return;
  const opt = (list, val) => list.map(x => `<option value="${x.key}" ${x.key === val ? "selected" : ""}>${esc(x.name)}</option>`).join("");
  const v = x => esc(x ?? "");
  const body = openSheet({
    title: isNew ? "New account" : "Edit " + a.name,
    actions: [
      ...(isNew ? [] : [{ label: "Delete", cls: "red", onClick: () => {
        if (!confirm("Delete " + a.name + " from this dossier?")) return;
        S.accounts = S.accounts.filter(x => x.account_id !== a.account_id);
        if (M.leafId === a.account_id) M.leafId = null;
        log("account_deleted", { account: a.name });
        persist(); closeSheet(true); refreshUnderSheet(); if (VIEW === "map") applyFocus();
        toast("Deleted " + a.name);
      } }]),
      { label: "Save", cls: "blue", onClick: save }
    ],
    body: `
      <div class="field"><label>Account name</label><input id="ae-name" value="${v(a.name)}" placeholder="Chase checking"></div>
      <div class="grid2">
        <div class="field"><label>Category</label><select id="ae-cat">${opt(CATS, a.category)}</select></div>
        <div class="field"><label>Status</label><select id="ae-status">${opt(STATUSES, a.status)}</select></div>
      </div>
      <div class="field"><label>Identifier (email, handle, last four)</label><input id="ae-ident" value="${v(a.identifier)}"></div>
      <div class="grid2">
        <div class="field"><label>Year opened</label><input id="ae-born" inputmode="numeric" value="${v(a.born)}"></div>
        <div class="field"><label>Year closed</label><input id="ae-died" inputmode="numeric" value="${v(a.died)}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Balance (owed is negative)</label><input id="ae-bal" inputmode="decimal" value="${v(a.balance)}"></div>
        <div class="field"><label>Monthly fee</label><input id="ae-fee" inputmode="decimal" value="${v(a.fee)}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Credentials (abbr)</label><input id="ae-cred" value="${v(a.cred)}" placeholder="pE/sP"></div>
        <div class="field"><label>2FA method</label><input id="ae-2fa" value="${v(a.twofa)}" placeholder="TOTP / SMS / key"></div>
      </div>
      <div class="field"><label>Recovery email or phone</label><input id="ae-rec" value="${v(a.recovery)}"></div>
      <div class="grid2">
        <div class="field"><label>Disposition</label><select id="ae-dispo">${opt(DISPOS, a.disposition)}</select></div>
        <div class="field"><label>Progress</label><select id="ae-prog">${PROGRESS.map(p => `<option ${p === a.progress ? "selected" : ""}>${p}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="ae-notes">${v(a.notes)}</textarea></div>
      <div class="note">Credentials are abbreviations only (which email, which password). Real passwords stay in the password manager.</div>`
  });
  setTimeout(() => { if (isNew) { const n = body.querySelector("#ae-name"); if (n) n.focus(); } }, 250);
  function save() {
    const name = body.querySelector("#ae-name").value.trim();
    if (!name) { toast("Account name is required", "err"); return; }
    const yr = x => { const n = num(x); return n === null ? null : Math.round(n); };
    Object.assign(a, {
      name,
      category: body.querySelector("#ae-cat").value,
      status: body.querySelector("#ae-status").value,
      identifier: body.querySelector("#ae-ident").value.trim(),
      born: yr(body.querySelector("#ae-born").value),
      died: yr(body.querySelector("#ae-died").value),
      balance: num(body.querySelector("#ae-bal").value),
      fee: num(body.querySelector("#ae-fee").value),
      cred: body.querySelector("#ae-cred").value.trim(),
      twofa: body.querySelector("#ae-2fa").value.trim(),

function summarize(sid) {
  const accts = accountsOf(sid);
  let fees = 0, assets = 0, liabs = 0;
  accts.forEach(a => {
    if (Number(a.fee) > 0 && a.status === "active") fees += Number(a.fee);
    if (a.balance !== null && a.balance !== undefined && a.balance !== "") { const b = Number(a.balance); if (b > 0) assets += b; else liabs += Math.abs(b); }
  });
  const brokers = brokersOf(sid);
  return {
    total: accts.length, active: accts.filter(a => !isDead(a)).length, dead: accts.filter(isDead).length,
    fees, assets, liabs, found: brokers.filter(b => b.status === "found").length, brokers: brokers.length,
    open: tasksOf(sid).filter(t => t.status === "open").length
  };
}

function acctMatches(a) {
  const q = LS.q.trim().toLowerCase();
  if (q) {
    const hay = [a.name, a.identifier, a.cred, a.twofa, a.recovery, a.notes, a.status, a.disposition, a.born, a.balance, a.fee, CAT[a.category].name].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  switch (LS.filter) {
    case "active": return !isDead(a);
    case "dead": return isDead(a);
    case "paid": return Number(a.fee) > 0;
    case "balance": return a.balance !== null && a.balance !== undefined && a.balance !== "";
    case "twofa": return !!a.twofa;
    case "ghost": return a.status === "ghost";
    case "undecided": return a.disposition === "undecided";
    default: return true;
  }
}
function acctRow(a, showCat) {
  const d = DISPO[a.disposition] || DISPO.undecided;
  const badges = [];
  if (a.balance !== null && a.balance !== undefined && a.balance !== "") badges.push(`<span class="chip" style="background:${Number(a.balance) >= 0 ? "#bbf7d0" : "#fecaca"}">${money(a.balance)}</span>`);
  if (Number(a.fee) > 0) badges.push(`<span class="chip" style="background:#fed7aa">${money(a.fee)}/mo</span>`);
  if (a.twofa) badges.push(`<span class="chip" style="background:#c7d2fe">2FA</span>`);
  badges.push(`<span class="chip" style="background:${d.color}">${d.name}${a.progress === "done" ? " ✓" : ""}</span>`);
  const sub = [showCat ? CAT[a.category].short : "", a.identifier, a.status !== "active" ? a.status : "", a.born ? "b. " + a.born : ""].filter(Boolean).join(" · ");
  return `<div class="row ${isDead(a) ? "dead" : ""}" data-a="${a.account_id}">
    <span class="dot ${isDead(a) ? "dead" : ""}" style="background:${CAT[a.category].color}"></span>
    <div class="main"><div class="name">${esc(a.name)}</div><div class="sub">${esc(sub)}</div></div>
    <div class="badges">${badges.join("")}</div></div>`;
}
function renderListBody() {
  const box = $("#ls-body"); if (!box) return;
  const c = cur(); const sid = c.sid;

  if (LS.cat === "brokers") {

// ---------- TRIAGE ----------
let TRI = "undecided";
function renderTriage() {
  const el = $("#view-triage"); const c = cur();
  if (!c) { el.innerHTML = `<div class="empty">No profile.</div>`; return; }
  const accts = accountsOf(c.sid);
  const decided = accts.filter(a => a.disposition !== "undecided");
  const done = decided.filter(a => a.progress === "done");
  const closeFees = accts.filter(a => a.disposition === "close" && Number(a.fee) > 0);
  const stopped = closeFees.filter(a => a.progress === "done").reduce((s, a) => s + Number(a.fee), 0);
  const closeTotal = closeFees.reduce((s, a) => s + Number(a.fee), 0);
  const handoffAssets = accts.filter(a => a.disposition === "handoff" && Number(a.balance) > 0).reduce((s, a) => s + Number(a.balance), 0);
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const bucket = accts.filter(a => a.disposition === TRI)
    .sort((x, y) => PROGRESS.indexOf(x.progress) - PROGRESS.indexOf(y.progress) || CATS.findIndex(k => k.key === x.category) - CATS.findIndex(k => k.key === y.category));
  const bDone = bucket.filter(a => a.progress === "done").length;
  const bFees = bucket.reduce((s, a) => s + (Number(a.fee) || 0), 0);
  const bBal = bucket.reduce((s, a) => s + (Number(a.balance) || 0), 0);
  el.innerHTML = `
    <div class="toolbar"><div class="chip-row">${DISPOS.map(d => `<button class="fchip ${TRI === d.key ? "on" : ""}" data-t="${d.key}"><span class="swatch" style="background:${d.color}"></span>${d.name} ${accts.filter(a => a.disposition === d.key).length}</button>`).join("")}</div></div>
    <div class="card">
      <h3>Triage progress</h3>
      <div class="bar-label"><span>plan decided</span><span>${decided.length} of ${accts.length}</span></div>
      <div class="bar"><div style="width:${pct(decided.length, accts.length)}%"></div></div>
      <div class="bar-label"><span>actions done</span><span>${done.length} of ${decided.length}</span></div>
      <div class="bar"><div style="width:${pct(done.length, decided.length)}%"></div></div>
      <div class="bar-label"><span>monthly bleed stopped</span><span>${money(stopped)} of ${money(closeTotal)}</span></div>
      <div class="bar"><div style="width:${pct(stopped, closeTotal)}%"></div></div>
      <div class="tiles" style="margin-top:10px">
        <div class="tile blue"><strong>${moneyK(handoffAssets)}</strong>to hand off</div>
        <div class="tile"><strong>${bucket.length}</strong>in ${esc(DISPO[TRI].name)}</div>
        <div class="tile"><strong>${bDone}</strong>done here</div>
        <div class="tile ${bBal < 0 ? "red" : ""}"><strong>${bFees ? moneyK(bFees) + "/mo" : moneyK(bBal)}</strong>${bFees ? "fees here" : "balance here"}</div>
      </div>
    </div>
    ${bucket.length ? `<div class="rows">${bucket.map(a => `<div class="row ${isDead(a) ? "dead" : ""}">
        <span class="dot ${isDead(a) ? "dead" : ""}" style="background:${CAT[a.category].color}"></span>
        <div class="main" data-a="${a.account_id}"><div class="name">${esc(a.name)}</div><div class="sub">${esc([CAT[a.category].short, Number(a.fee) > 0 ? money(a.fee) + "/mo" : "", a.balance !== null && a.balance !== undefined && a.balance !== "" ? money(a.balance) : ""].filter(Boolean).join(" · "))}</div></div>
        <button class="prog-btn ${a.progress}" data-p="${a.account_id}">${a.progress}</button></div>`).join("")}</div>`
      : `<div class="empty">Nothing in ${esc(DISPO[TRI].name)}.</div>`}
    <div style="height:30px"></div>`;
  el.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { TRI = b.dataset.t; renderTriage(); });
  el.querySelectorAll("[data-a]").forEach(r => r.onclick = () => openAccountSheet(r.dataset.a, {}));
  el.querySelectorAll("[data-p]").forEach(b => b.onclick = e => {
    e.stopPropagation();

    a.progress = PROGRESS[(PROGRESS.indexOf(a.progress) + 1) % PROGRESS.length]; a.updated_at = nowISO();
    log("progress", { account: a.name, to: a.progress }); persist();
    b.className = "prog-btn " + a.progress; b.textContent = a.progress;
    renderChrome();
  });
}

  el.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { TF = b.dataset.f; recentlyDone.clear(); renderTasks(); });
  el.querySelector("#tk-add").onclick = openTaskEditor;
  el.querySelectorAll("[data-tick]").forEach(b => b.onclick = () => toggleTask(b.dataset.tick));
  el.querySelectorAll("[data-out]").forEach(b => b.onclick = () => recheckOutcome(b.dataset.id, b.dataset.out));

}
function taskRow(t, td) {
  const isRecheck = /^recheck_/.test(t.type) && t.status === "open";
  const dueCls = t.status === "open" && t.due < td ? "overdue" : t.status === "open" && t.due === td ? "dueday" : "";
  const kind = t.type.replace(/_/g, " ").replace(/^death /, "post-mortem ");
  return `<div class="row task ${t.status === "done" ? "isdone" : ""}">
    <button class="tick" data-tick="${t.task_id}">${t.status === "done" ? "✓" : ""}</button>
    <div class="main" data-open="${t.task_id}"><div class="name">${esc(t.title)}</div>
      <div class="sub"><span class="chip ${dueCls}">${t.status === "done" ? "done " + esc(fmtDate(t.done_at)) : "due " + esc(fmtDate(t.due))}</span> ${esc(kind)}</div></div>
    ${isRecheck ? `<div class="outs"><button class="btn" data-out="clean" data-id="${t.task_id}">Clean</button><button class="btn red" data-out="found" data-id="${t.task_id}">Listed</button></div>` : ""}
  </div>`;
}
function toggleTask(id) {
  const t = S.tasks.find(x => x.task_id === id); if (!t) return;
  if (t.status === "open") { t.status = "done"; t.done_at = nowISO(); recentlyDone.add(id); log("task_done", { task: t.title }); }
  else { t.status = "open"; t.done_at = null; recentlyDone.delete(id); log("task_reopened", { task: t.title }); }
  persist(); renderChrome(); renderTasks();
}
function recheckOutcome(id, out) {
  const c = cur(); const t = S.tasks.find(x => x.task_id === id); if (!t) return;
  const b = c.subject.brokers && c.subject.brokers[t.ref];
  if (b) {
    if (out === "clean" && b.status === "submitted") brokerTransition(c.sid, b.id, "clean", { source: "recheck" });
    if (out === "found") {
      if (b.status === "submitted") {
        b.status = "found"; b.relisted = true;
        b.history = (b.history || []).concat([{ at: nowISO(), status: "found", source: "recheck" }]);
        addTask(c.sid, { type: "relist", title: `Still listed after opt-out: ${b.name}, submit again`, due: today(), ref: b.id });
      } else if (b.status === "clean") brokerTransition(c.sid, b.id, "found", { source: "recheck" });
    }
  }
  t.status = "done"; t.done_at = nowISO(); t.outcome = out; recentlyDone.add(id);
  log("recheck", { broker: t.ref, outcome: out });
  persist(); renderChrome(); renderTasks();
  toast(out === "clean" ? "Marked clean" : "Re-list logged, new opt-out task added");
}
function openTaskEditor() {
  const c = cur(); if (!c) return;

      addTask(c.sid, { type: "custom_" + uuid().slice(0, 8), title, due: body.querySelector("#tk-due").value || today(), notes: body.querySelector("#tk-notes").value.trim() });
      log("task_added", { task: title }); persist(); closeSheet(true); renderChrome(); renderTasks(); toast("Task added");
    } }],

}

function buildFormStep(body, step, c) {
  const targets = { person: c.person, contract: c.contract, subject: c.subject };
  step.fields.forEach(f => {
    const tgt = targets[f.t];
    const wrap = document.createElement("div"); wrap.className = "field";
    wrap.innerHTML = `<label>${esc(f.label)}</label>`;
    if (f.type === "list") {
      if (!Array.isArray(tgt[f.key])) tgt[f.key] = [];
      const adder = document.createElement("div"); adder.className = "adder";
      adder.innerHTML = `<input placeholder="${esc(f.ph || "")}"><button class="btn sm blue">Add</button>`;
      const tags = document.createElement("div"); tags.className = "tags";
      const drawTags = () => {
        tags.innerHTML = tgt[f.key].map((v, i) => `<span class="tag"><span>${esc(v)}</span><button data-x="${i}" aria-label="Remove">&times;</button></span>`).join("");
        tags.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { tgt[f.key].splice(+b.dataset.x, 1); persistSoon(); drawTags(); });
      };
      const input = adder.querySelector("input");

        const v = input.value.trim(); if (!v) return;
        tgt[f.key].push(v); input.value = ""; persistSoon(); drawTags(); input.focus();
      };
      adder.querySelector("button").onclick = add;

      wrap.appendChild(adder); wrap.appendChild(tags); drawTags();

      sel.onchange = () => {

function buildCatStep(body, step, c) {
  const head = document.createElement("div"); head.className = "ck-head";

  let adopted = false;
  tmpls.forEach(([name]) => {
    if (accountsOf(c.sid).some(a => a.category === step.cat && a.tmpl === name)) return;
    const match = accountsOf(c.sid).find(a => a.category === step.cat && !a.tmpl && norm(a.name) === norm(name));
    if (match) { match.tmpl = name; adopted = true; }

  if (adopted) persistSoon();
  tmpls.forEach(([name, hint]) => listEl.appendChild(ckRow(c, step.cat, name, hint)));
  accountsOf(c.sid).filter(a => a.category === step.cat && !(a.tmpl && tmplNames.has(a.tmpl)))

function menuAction(act) {

function importScan(payload) {
  if (!payload || payload.schema !== "scrub.exposure_checklist.v1" || !Array.isArray(payload.brokers)) {
    toast("Not a scrub.exposure_checklist.v1 file", "err"); return;
  }
  const ps = payload.subject || {};
  let sub = null;
  if (payload.subject_id) sub = S.subjects.find(s => s.subject_id === payload.subject_id);
  if (!sub && ps.case) sub = S.subjects.find(s => String(s.case_id || "").toLowerCase() === String(ps.case).toLowerCase());
  if (!sub && ps.name) {
    const p = S.persons.find(x => String(x.full_legal_name || "").toLowerCase() === String(ps.name).toLowerCase());
    if (p) sub = S.subjects.find(s => s.person_id === p.person_id);
  }
  if (!sub) {
    const c = cur(); if (!c) return;
    if (!confirm(`No profile matches "${ps.name || ps.case || "this scan"}". Attach it to ${c.person.full_legal_name || "the active profile"}?`)) return;
    sub = c.subject;
  }
  const sid = sub.subject_id;
  S.active = sid;
  sub.brokers = sub.brokers || {};
  const at = payload.generated_at || nowISO();
  let relists = 0, added = 0;
  S.exposures.push({ exposure_id: uuid(), subject_id: sid, generated_at: at, imported_at: nowISO(), operator: payload.operator || "", broker_count: payload.brokers.length, brokers: payload.brokers });
  payload.brokers.forEach(raw => {
    if (!raw || !raw.id) return;
    const id = String(raw.id).toLowerCase().replace(/\s+/g, "");
    const prev = sub.brokers[id];
    const st = BSTAT[raw.status] ? raw.status : "pending";
    const b = Object.assign({}, prev || {}, {
      id, name: raw.name || (prev && prev.name) || id,
      priority: raw.priority || (prev && prev.priority) || "normal",
      search_url: raw.search_url || "", optout_url: raw.optout_url || "",
      requirements: Array.isArray(raw.requirements) ? raw.requirements.map(String) : [],
      profile_url: raw.profile_url || (prev && prev.profile_url) || "",
      submission_date: raw.submission_date || (prev && prev.submission_date) || "",
      confirmation_ref: raw.confirmation_ref || (prev && prev.confirmation_ref) || "",
      broker_notes: raw.broker_notes || "",
      status: st,
      history: ((prev && prev.history) || []).concat([{ at, status: st, source: "scan" }])
    });
    if (prev && (prev.status === "clean" || prev.status === "submitted") && st === "found") {
      b.relisted = true; relists++;
      addTask(sid, { type: "relist", title: `Re-list detected: ${b.name}, submit opt-out again`, due: today(), ref: id });
    } else if (st === "clean") b.relisted = false;
    if (!prev) added++;
    sub.brokers[id] = b;
    if (st === "found" && !b.relisted) addTask(sid, { type: "submit_optout", title: `Submit opt-out: ${b.name}`, due: today(), ref: id });
    if (st === "submitted" && b.submission_date) scheduleRechecks(sid, b);
    if (st !== "found") closeTasks(sid, "submit_optout", id);
  });
  log("scan_imported", { brokers: payload.brokers.length, relists, added });
  persist();
  M.broker = true; M.cat = null; M.leafId = null; M.brokerId = null; M.t = d3.zoomIdentity;
  if (VIEW !== "map") setView("map"); else renderAll();
  renderChrome();
  setTimeout(openBrokerOverview, 80);
  toast(`Scan imported · ${payload.brokers.length} brokers${relists ? " · " + relists + " re-listed" : ""}`);
}
function readJsonFile(file, cb) {

  r.readAsText(file);
}

      // BLUE PHONE: support the micronation donate pill with a coin icon.

      + '.mtg-donate-coin{display:block;flex:none;}'
      + '.mtg-donate-text{display:flex;flex-direction:column;line-height:1.2;text-align:left;}'

    var style = document.createElement("style");
    style.textContent = css;
    head.appendChild(style);

    var seal = document.createElement("footer");
    seal.className = "mtg-seal";
    seal.innerHTML = ''
      + '<div class="mtg-seal-row">'

      + '</a>'
      + '<div class="mtg-seal-panel">'

      +     '<a href="' + CONFIG.linkedin + '" target="_blank" rel="noopener me">LinkedIn</a>'
      +   '</div>'
      + '</div>';

    // RED PHONE: flag badge and "Who made this?" both toggle the panel.
    var ask = seal.querySelector(".mtg-seal-ask");
    var flagBtn = seal.querySelector(".mtg-flag-btn");
    function toggle() {
      var nowOpen = seal.classList.toggle("open");
      ask.setAttribute("aria-expanded", nowOpen ? "true" : "false");
    }
    ask.addEventListener("click", toggle);
    flagBtn.addEventListener("click", toggle);
    seal.querySelector(".mtg-seal-btn").addEventListener("click", toggle);

    // RED PHONE: drop this block into a page with no seal container and it
    // still lands at the bottom of body exactly like before. Give a page a
    // <div id="mtgSealContainer"> anywhere and the seal lands there instead,
    // which is how the landing screen pins it to its own bottom edge rather
    // than the bottom of the whole document.
    var sealContainer = document.getElementById("mtgSealContainer") || document.body;
    sealContainer.appendChild(seal);

  })();
  </script>
