<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tinewood Keys v1</title>
<style>
/* Layout: one suitcase-style instrument centered on a light cream room; logo rail, control panel, red felt, keys. Single committed look. */
:root{
  color-scheme: light;
  --room:#f6efe2;
  --tolex:#c9a77c;
  --tolex-hi:#dcbf96;
  --chrome-a:#e9e7e2;
  --chrome-b:#9a978f;
  --ivory:#f1e8d3;
  --ivory-shade:#d8ccb1;
  --ebony:#141210;
  --felt:#8b1e1e;
  --cream:#2b2420;
  --muted:#6f6252;
  --amber:#d9771a;
  --font-logo:"Yellowtail","Brush Script MT",cursive;
  --font-label:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 80% at 50% 0%, #fffaf0 0%, var(--room) 60%);
  color:var(--cream);
  font-family:var(--font-label);
  padding-block:28px 40px;
  padding-inline:16px;
  box-sizing:border-box;
}
.rig{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.cab{
  border-radius:16px;
  padding:12px;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.035) 0 1px, transparent 1.5px) 0 0/5px 5px,
    radial-gradient(circle at 70% 60%, rgba(0,0,0,.08) 0 1px, transparent 1.5px) 0 0/4px 4px,
    linear-gradient(180deg,var(--tolex-hi),var(--tolex));
  box-shadow:0 24px 44px -22px rgba(80,55,30,.45), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.6);
  display:flex;flex-direction:column;gap:10px;
}
.rail{
  border-radius:8px;
  padding:8px 18px 6px;
  background:linear-gradient(180deg,var(--chrome-a) 0%,#cfccc5 45%,var(--chrome-b) 100%);
  box-shadow:inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  color:var(--ebony);
}
.logo{font-family:var(--font-logo);font-size:clamp(30px,6vw,42px);line-height:1;margin:0;font-weight:400;
  text-shadow:0 1px 0 rgba(255,255,255,.6)}
.model{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
.panel{
  border-radius:8px;
  background:linear-gradient(180deg,#faf5ea,#ece2cf);
  box-shadow:inset 0 2px 5px rgba(80,55,30,.25);
  padding:14px 12px 12px;
  display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:14px 18px;
}
.knobs{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 16px}
.kgroup{display:flex;flex-direction:column;align-items:center;gap:6px;width:58px}
.knob{
  --a:0deg;
  width:50px;height:50px;border-radius:50%;position:relative;cursor:ns-resize;touch-action:none;
  background:
    repeating-conic-gradient(from -135deg, var(--muted) 0 1.5deg, transparent 1.5deg 27deg);
  -webkit-mask:radial-gradient(circle, #000 0 100%);
  outline:none;
}
.knob::before{ /* chrome skirt */
  content:"";position:absolute;inset:5px;border-radius:50%;
  background:conic-gradient(from 20deg,#d9d6cf,#7a776f,#e8e5de,#6c6962,#d9d6cf);
  box-shadow:0 3px 6px rgba(0,0,0,.7);
}
.cap{
  position:absolute;inset:10px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#4a4644,#141210 70%);
  transform:rotate(var(--a));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.15);
}
.cap::after{content:"";position:absolute;left:50%;top:3px;width:2px;height:10px;margin-left:-1px;border-radius:1px;background:var(--cream)}
.knob:focus-visible{box-shadow:0 0 0 2px var(--amber);border-radius:50%}
.klabel{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.1}
.ctrls{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.cg{display:flex;flex-direction:column;align-items:center;gap:6px}
.row{display:flex;gap:6px;align-items:center}
button.btn{
  font-family:var(--font-label);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ebony);min-width:40px;height:36px;padding:0 10px;border:0;border-radius:6px;cursor:pointer;
  background:linear-gradient(180deg,var(--ivory),var(--ivory-shade));
  box-shadow:0 3px 0 #8d826b, 0 4px 6px rgba(80,55,30,.35);
}
button.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8d826b}
button.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.lamp{width:9px;height:9px;border-radius:50%;background:#b9ab8a;box-shadow:inset 0 1px 2px rgba(0,0,0,.8);margin-right:6px;display:inline-block;vertical-align:middle}
button[aria-pressed="true"] .lamp{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.oct{min-width:34px;text-align:center;font-size:20px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;
  background:#fff;border-radius:4px;padding:2px 6px;box-shadow:inset 0 1px 3px rgba(80,55,30,.35)}
.felt{height:10px;border-radius:3px;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 4px),var(--felt);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.4)}
.keys{
  position:relative;display:flex;height:clamp(170px,40vw,270px);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  border-radius:0 0 6px 6px;overflow:hidden;background:var(--ebony);gap:2px;padding:0 1px 1px;
}
.w{
  flex:1;position:relative;border-radius:0 0 5px 5px;
  background:linear-gradient(180deg,var(--ivory-shade) 0%,var(--ivory) 10%,var(--ivory) 88%,#c9bc9e 100%);
  box-shadow:inset 0 -6px 0 #cdbf9f;
  transition:transform .04s;
}
.w.on{background:linear-gradient(180deg,#c9bd9f,#e5dac2 20%,#e5dac2);box-shadow:inset 0 -2px 0 #b9ab8a;transform:translateY(2px)}
.w span{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11px;font-weight:600;color:#8d826b;letter-spacing:.06em}
.b{
  position:absolute;top:0;height:60%;border-radius:0 0 4px 4px;z-index:2;
  background:linear-gradient(180deg,#000,#2b2724 85%,#3a3531);
  box-shadow:inset 0 -5px 0 #0b0a09, 0 3px 4px rgba(0,0,0,.6);
}
.b.on{background:linear-gradient(180deg,#000,#1d1a18);box-shadow:inset 0 -2px 0 #0b0a09}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:15px;letter-spacing:.03em;padding:0 4px}
.foot p{margin:0;max-width:60ch}
kbd{font-family:var(--font-label);font-weight:700;color:var(--cream);background:#fff;box-shadow:0 1px 0 #cdbf9f;border-radius:3px;padding:0 5px}
.start{
  position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:rgba(246,239,226,.6);
}
.start button{font-size:16px;height:44px;padding:0 20px}
@media (hover:none){.desk{display:none}}
@media (prefers-reduced-motion:reduce){.w{transition:none}}
</style>

<div class="rig">
  <div class="cab">
    <header class="rail">
      <h1 class="logo">Tinewood</h1>
      <span class="model">Suitcase 73 v1</span>
    </header>

    <section class="panel" aria-label="Controls">
      <div class="knobs" id="knobs"></div>
      <div class="ctrls">
        <div class="cg">
          <div class="row">
            <button class="btn" id="octDown" aria-label="Octave down">&minus;</button>
            <div class="oct" id="octVal" aria-live="polite">3</div>
            <button class="btn" id="octUp" aria-label="Octave up">+</button>
          </div>
          <div class="klabel">Octave</div>
        </div>
        <div class="cg">
          <button class="btn" id="sustain" aria-pressed="false"><span class="lamp"></span>Sustain</button>
          <div class="klabel">Pedal</div>
        </div>
      </div>
    </section>

    <div class="felt" aria-hidden="true"></div>
    <div class="keys" id="keys" role="group" aria-label="Keyboard">
      <div class="start" id="start"><button class="btn" id="startBtn">Power on</button></div>
    </div>
  </div>

  <div class="foot">
    <p>Play near the front of a key for a harder, barkier hit. Drag a knob up or down to turn it.</p>
    <p class="desk">Keys <kbd>A</kbd> to <kbd>;</kbd> play, <kbd>Z</kbd> <kbd>X</kbd> shift octave, hold <kbd>Space</kbd> to sustain.</p>
  </div>
</div>

<script>
(function(){
  const params = {volume:.7, tone:.5, warmth:.35, rate:.3, depth:.45};
  const knobDefs = [
    ["volume","Volume"],["tone","Tone"],["warmth","Warmth"],["rate","Vibrato Rate"],["depth","Vibrato Depth"]
  ];
  let ctx=null, nodes={}, sustain=false, octave=3;
  const voices = new Map(); // midi -> voice
  const NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

  function curve(k){
    const n=1024,c=new Float32Array(n),t=Math.tanh(k);
    for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(k*x)/t;}
    return c;
  }

  function initAudio(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC();
    const n=nodes;
    n.bus=ctx.createGain(); n.bus.gain.value=1;
    n.pre=ctx.createGain();
    n.shaper=ctx.createWaveShaper(); n.shaper.oversample="2x";
    n.post=ctx.createGain();
    n.lp=ctx.createBiquadFilter(); n.lp.type="lowpass"; n.lp.Q.value=0.5;
    n.body=ctx.createBiquadFilter(); n.body.type="peaking"; n.body.frequency.value=220; n.body.gain.value=3; n.body.Q.value=0.8;
    n.trem=ctx.createGain(); n.trem.gain.value=1;
    n.pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
    n.master=ctx.createGain();
    n.comp=ctx.createDynamicsCompressor(); n.comp.threshold.value=-14; n.comp.ratio.value=4; n.comp.attack.value=.005; n.comp.release.value=.2;
    n.lfo=ctx.createOscillator(); n.lfo.type="sine";
    n.panDepth=ctx.createGain(); n.ampDepth=ctx.createGain();
    n.lfo.connect(n.ampDepth); n.ampDepth.connect(n.trem.gain);
    if(n.pan){ n.lfo.connect(n.panDepth); n.panDepth.connect(n.pan.pan); }
    n.bus.connect(n.pre); n.pre.connect(n.shaper); n.shaper.connect(n.post);
    n.post.connect(n.body); n.body.connect(n.lp); n.lp.connect(n.trem);
    if(n.pan){ n.trem.connect(n.pan); n.pan.connect(n.master); } else n.trem.connect(n.master);
    n.master.connect(n.comp); n.comp.connect(ctx.destination);
    n.lfo.start();
    applyAll();
  }

  function applyAll(){ Object.keys(params).forEach(apply); }
  function apply(p){
    if(!ctx) return;
    const v=params[p], t=ctx.currentTime, n=nodes;
    if(p==="volume") n.master.gain.setTargetAtTime(v*v*1.1,t,.02);
    if(p==="tone") n.lp.frequency.setTargetAtTime(700*Math.pow(2,v*4.6),t,.03);
    if(p==="warmth"){ const k=1+v*5; n.shaper.curve=curve(k); n.pre.gain.setTargetAtTime(1+v*2.5,t,.02); n.post.gain.setTargetAtTime(1/(1+v*1.4),t,.02); }
    if(p==="rate") n.lfo.frequency.setTargetAtTime(.6+v*7.4,t,.05);
    if(p==="depth"){ n.panDepth.gain.setTargetAtTime(v*.85,t,.05); n.ampDepth.gain.setTargetAtTime(v*.22,t,.05); }
  }

  function noteOn(midi,vel){
    if(!ctx) return;
    if(ctx.state!=="running") ctx.resume();
    if(voices.has(midi)) kill(voices.get(midi),.03);
    if(voices.size>=20){ const first=voices.keys().next().value; kill(voices.get(first),.05); voices.delete(first); }
    const t=ctx.currentTime+.002, f=440*Math.pow(2,(midi-69)/12);
    const peak=(.12+vel*.22)*Math.min(1,Math.pow(2,-(midi-72)/36));
    // carrier + modulator at 1:1 gives the round electric piano body
    const car=ctx.createOscillator(); car.frequency.value=f;
    const mod=ctx.createOscillator(); mod.frequency.value=f;
    const modG=ctx.createGain();
    const idx=(.6+params.tone*1.6)*(.35+vel*1.1);
    modG.gain.setValueAtTime(idx*f,t);
    modG.gain.setTargetAtTime(idx*f*.12,t,.12+.1*(1-vel));
    mod.connect(modG); modG.connect(car.frequency);
    const env=ctx.createGain();
    env.gain.setValueAtTime(0,t);
    env.gain.linearRampToValueAtTime(peak,t+.004);
    env.gain.setTargetAtTime(peak*.55,t+.006,.1);
    const tau=2.4*Math.pow(2,-(midi-48)/28);
    env.gain.setTargetAtTime(0,t+.25,tau);
    car.connect(env);
    // short inharmonic tine ping on the attack
    let tine=null;
    if(f*7.1<11000){
      tine=ctx.createOscillator(); tine.frequency.value=f*7.1;
      const tg=ctx.createGain();
      tg.gain.setValueAtTime(0,t); tg.gain.linearRampToValueAtTime(peak*.35*vel,t+.002);
      tg.gain.setTargetAtTime(0,t+.003,.035);
      tine.connect(tg); tg.connect(env);
    }
    env.connect(nodes.bus);
    car.start(t); mod.start(t); if(tine){tine.start(t); tine.stop(t+.4);}
    const stopAt=t+tau*6+.5; car.stop(stopAt); mod.stop(stopAt);
    voices.set(midi,{car,mod,env,held:true,sus:false});
  }

  function kill(v,rel){
    const t=ctx.currentTime;
    const g=v.env.gain;
    if(g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t); else {g.cancelScheduledValues(t); g.setValueAtTime(g.value,t);}
    g.setTargetAtTime(0,t,rel);
    try{v.car.stop(t+rel*8+.05); v.mod.stop(t+rel*8+.05);}catch(e){}
  }
  function noteOff(midi){
    const v=voices.get(midi); if(!v) return;
    v.held=false;
    if(sustain){ v.sus=true; return; }
    kill(v,.06); voices.delete(midi);
  }
  function setSustain(on){
    sustain=on;
    susBtn.setAttribute("aria-pressed",on?"true":"false");
    if(!on){ for(const [m,v] of [...voices]) if(!v.held){ kill(v,.08); voices.delete(m);} }
  }

  /* ---------- Knobs ---------- */
  const knobWrap=document.getElementById("knobs");
  knobDefs.forEach(([key,label])=>{
    const g=document.createElement("div"); g.className="kgroup";
    const k=document.createElement("div"); k.className="knob"; k.tabIndex=0;
    k.id="knob-"+key; k.setAttribute("role","slider"); k.setAttribute("aria-label",label);
    k.setAttribute("aria-valuemin","0"); k.setAttribute("aria-valuemax","10");
    k.innerHTML='<div class="cap"></div>';
    const l=document.createElement("div"); l.className="klabel"; l.textContent=label;
    g.append(k,l); knobWrap.append(g);
    const draw=()=>{ k.style.setProperty("--a",(-135+params[key]*270)+"deg"); k.setAttribute("aria-valuenow",(params[key]*10).toFixed(1)); };
    const set=v=>{ params[key]=Math.min(1,Math.max(0,v)); draw(); apply(key); };
    draw();
    let sy=0,sv=0;
    k.addEventListener("pointerdown",e=>{ k.setPointerCapture(e.pointerId); sy=e.clientY; sv=params[key]; e.preventDefault(); });
    k.addEventListener("pointermove",e=>{ if(!k.hasPointerCapture(e.pointerId)) return; set(sv+(sy-e.clientY)/160); });
    k.addEventListener("keydown",e=>{
      const s=e.shiftKey?.1:.03;
      if(e.key==="ArrowUp"||e.key==="ArrowRight"){set(params[key]+s);e.preventDefault();}
      if(e.key==="ArrowDown"||e.key==="ArrowLeft"){set(params[key]-s);e.preventDefault();}
    });
  });

  /* ---------- Keyboard ---------- */
  const keysEl=document.getElementById("keys");
  const startEl=document.getElementById("start");
  const susBtn=document.getElementById("sustain");
  const octVal=document.getElementById("octVal");
  const keyEls=new Map();
  let lastCount=0;
  const isBlack=m=>[1,3,6,8,10].includes(m%12);

  function build(){
    const w=keysEl.clientWidth||360;
    const count=Math.max(10,Math.min(22,Math.floor(w/40)));
    keysEl.querySelectorAll(".w,.b").forEach(el=>el.remove());
    keyEls.clear();
    const base=12*(octave+1);
    const whites=[]; let m=base;
    while(whites.length<count){ if(!isBlack(m)) whites.push(m); m++; }
    whites.forEach((mm,i)=>{
      const el=document.createElement("div"); el.className="w"; el.dataset.m=mm;
      if(mm%12===0){ const s=document.createElement("span"); s.textContent="C"+(mm/12-1); el.append(s); }
      keysEl.append(el); keyEls.set(mm,el);
      if(i<count-1 && isBlack(mm+1)){
        const b=document.createElement("div"); b.className="b"; b.dataset.m=mm+1;
        const bw=62/count;
        b.style.width=bw+"%"; b.style.left="calc("+((i+1)/count*100)+"% - "+(bw/2)+"%)";
        keysEl.append(b); keyEls.set(mm+1,b);
      }
    });
    lastCount=count;
    octVal.textContent=octave;
  }

  const pointers=new Map(); // pointerId -> midi
  function keyAt(x,y){ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest(".w,.b"):null; }
  function velFrom(el,y){ const r=el.getBoundingClientRect(); return Math.min(1,Math.max(.2,.3+.75*(y-r.top)/r.height)); }
  function press(el,y){ const m=+el.dataset.m; el.classList.add("on"); noteOn(m,velFrom(el,y)); return m; }
  function lift(m){ const el=keyEls.get(m); if(el) el.classList.remove("on"); noteOff(m); }

  keysEl.addEventListener("pointerdown",e=>{
    if(!ctx) return;
    const el=e.target.closest(".w,.b"); if(!el) return;
    e.preventDefault(); keysEl.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,press(el,e.clientY));
  });
  keysEl.addEventListener("pointermove",e=>{
    if(!pointers.has(e.pointerId)) return;
    const el=keyAt(e.clientX,e.clientY); const cur=pointers.get(e.pointerId);
    if(!el){ return; }
    const m=+el.dataset.m;
    if(m!==cur){ lift(cur); pointers.set(e.pointerId,press(el,e.clientY)); }
  });
  const up=e=>{ if(!pointers.has(e.pointerId)) return; lift(pointers.get(e.pointerId)); pointers.delete(e.pointerId); };
  keysEl.addEventListener("pointerup",up);
  keysEl.addEventListener("pointercancel",up);

  document.getElementById("startBtn").addEventListener("click",()=>{
    initAudio(); ctx.resume(); startEl.hidden=true;
    noteOn(60,.7); setTimeout(()=>noteOff(60),300); noteOn(64,.6); setTimeout(()=>noteOff(64),300); noteOn(67,.6); setTimeout(()=>noteOff(67),300);
  });

  function shift(d){ const o=Math.min(6,Math.max(1,octave+d)); if(o===octave) return; octave=o; build(); }
  document.getElementById("octDown").addEventListener("click",()=>shift(-1));
  document.getElementById("octUp").addEventListener("click",()=>shift(1));
  susBtn.addEventListener("click",()=>setSustain(!sustain));

  const map="awsedftgyhujkolp;'";
  const downKeys=new Map();
  window.addEventListener("keydown",e=>{
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(document.activeElement&&document.activeElement.classList.contains("knob")&&e.key.startsWith("Arrow")) return;
    const k=e.key.toLowerCase();
    if(e.code==="Space"){ e.preventDefault(); if(!e.repeat) setSustain(true); return; }
    if(e.repeat) return;
    if(k==="z"){shift(-1);return;} if(k==="x"){shift(1);return;}
    const i=map.indexOf(k); if(i<0||!ctx) return;
    const m=12*(octave+1)+i; downKeys.set(k,m);
    const el=keyEls.get(m); if(el) el.classList.add("on");
    noteOn(m,.72);
  });
  window.addEventListener("keyup",e=>{
    if(e.code==="Space"){ setSustain(false); return; }
    const k=e.key.toLowerCase(); if(!downKeys.has(k)) return;
    lift(downKeys.get(k)); downKeys.delete(k);
  });
  window.addEventListener("blur",()=>{ pointers.forEach(m=>lift(m)); pointers.clear(); downKeys.forEach(m=>lift(m)); downKeys.clear(); });

  build();
  let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ const c=Math.max(10,Math.min(22,Math.floor((keysEl.clientWidth||360)/40))); if(c!==lastCount) build(); },120); });
})();
</script>

</body></html>
