<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Dispatch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<style>
:root{--base:#EEF2F4;--panel:#FFFFFF;--ink:#16222E;--muted:#5B6B7A;--line:#D5DDE3;--vis:#F2B705;--go:#1F6FEB;--work:#2E8B57;--late:#C93C3C;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--base);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:3px solid var(--vis)}
.cash{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px;text-align:right}
#lock{display:none;padding:8px 14px;background:var(--vis);font-weight:600}
#lock button{margin-left:8px}
#map{flex:1 1 50%;min-height:200px}
.sheet{flex:1 1 50%;display:flex;flex-direction:column;background:var(--panel);min-height:0}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px 0;border:0;background:none;font:inherit;color:var(--muted);border-bottom:3px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
#pane{overflow-y:auto;padding:4px 14px 20px;flex:1}
.row{padding:10px 0;border-bottom:1px solid var(--line)}
.row h3{margin:0 0 2px;font-size:15px}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.btn{display:inline-block;margin:6px 6px 0 0;padding:9px 12px;border:1px solid var(--ink);border-radius:6px;background:var(--panel);font:inherit;color:var(--ink)}
.btn.main{background:var(--ink);color:#fff}
.btn:disabled{opacity:.4}
.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;margin-right:6px;color:#fff}
.t-idle{background:var(--muted)}.t-enroute,.t-returning{background:var(--go)}.t-onsite{background:var(--work)}.t-late{background:var(--late)}
.empty{color:var(--muted);padding:16px 0}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:14px}
.item .btn{margin:0 0 0 4px;padding:6px 10px}
.wait{background:#FFF1BF;color:#7A5A00;padding:1px 8px;border-radius:10px;font-size:12px;margin-right:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:999;max-width:90%}
.pin{font-size:22px;line-height:1;text-shadow:0 0 3px #fff,0 0 3px #fff}
.dim{opacity:.4;filter:grayscale(1)}
video{width:100%;background:#D5DDE3;border-radius:6px;margin-top:8px}
.badge{font-size:13px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
.b-still{background:#D8E6FF;color:#1D4FA8}.b-walk{background:#D5F2DC;color:#1E6B34}.b-maybe{background:#FFF1BF;color:#7A5A00}.b-drive{background:#2E8B57;color:#fff}
.me{width:16px;height:16px;border-radius:50%;background:var(--go);border:3px solid #fff;box-shadow:0 0 0 2px var(--go)}
</style>
</head>
<body>
<header>
  <div class="cash" id="cash">$0</div>
  <div class="badge b-still" id="move">🧍 Still</div>
  <div class="sub" id="status">Finding location</div>
</header>
<div id="lock">Driving. Dispatch is locked.<button class="btn" data-act="passenger">I am a passenger</button></div>
<div id="map"></div>
<div class="sheet">
  <nav>
    <button data-tab="tickets" class="on">Tickets</button>
    <button data-tab="crew">Crew</button>
    <button data-tab="stock">Stock</button>
    <button data-tab="cams">Cameras</button>
    <button data-tab="shop">Shop</button>
  </nav>
  <div id="pane"></div>
</div>
<div id="toast"></div>
<script src="theme.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
