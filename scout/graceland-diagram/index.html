<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GRACELAND 14x20 - Kitchen Build Diagram v2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --or: #E85E00;
    --or2: #FF8C00;
    --amber: #FFA500;
    --bg: #F0EDE8;
    --panel: rgba(255,252,245,0.97);
    --border: rgba(232,94,0,0.4);
    --text: #1a1008;
    --sub: #7a5030;
  }
  body { background:var(--bg); font-family:'Share Tech Mono',monospace; color:var(--text); overflow:hidden; width:100vw; height:100vh; }
  canvas { display:block; touch-action:none; }
  #header {
    position:absolute; top:0; left:0; right:0; padding:10px 16px;
    background:linear-gradient(180deg,rgba(240,237,232,0.98) 60%,transparent);
    display:flex; align-items:baseline; gap:12px; pointer-events:none; z-index:10;
    border-bottom:1px solid var(--border);
  }
  #header h1 { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:26px; color:var(--or); letter-spacing:3px; }
  #header span { font-size:10px; color:var(--sub); letter-spacing:2px; }
  #legend {
    position:absolute; top:54px; left:12px; z-index:10;
    display:flex; flex-direction:column; gap:4px;
    background:var(--panel); border:1px solid var(--border); padding:8px 10px;
  }
  .li { display:flex; align-items:center; gap:7px; font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--sub); }
  .ld { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
  #info-panel {
    position:absolute; top:54px; right:12px; width:230px;
    background:var(--panel); border:1px solid var(--border); padding:12px; z-index:10;
    opacity:0; transform:translateX(8px); transition:all 0.18s; pointer-events:none;
  }
  #info-panel.vis { opacity:1; transform:translateX(0); }
  .ilabel { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; color:var(--or); letter-spacing:2px; text-transform:uppercase; margin-bottom:5px; border-bottom:1px solid var(--border); padding-bottom:5px; }
  .idetail { font-size:10px; line-height:1.7; color:#5a3820; }
  .ispec { margin-top:6px; font-size:9px; color:var(--amber); }
  #hint { position:absolute; bottom:120px; left:50%; transform:translateX(-50%); font-size:9px; letter-spacing:2px; color:rgba(232,94,0,0.4); text-transform:uppercase; white-space:nowrap; z-index:10; pointer-events:none; }
  #explode-wrap { position:absolute; bottom:64px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; z-index:10; }
  #explode-wrap label { font-size:10px; letter-spacing:2px; color:var(--or); text-transform:uppercase; }
  #eslider { -webkit-appearance:none; width:180px; height:3px; background:var(--border); outline:none; }
  #eslider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--or); cursor:pointer; }
  #controls { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:10; flex-wrap:wrap; justify-content:center; padding:0 10px; }
  .btn { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; padding:7px 12px; background:rgba(255,252,245,0.9); border:1px solid var(--border); color:var(--or); cursor:pointer; transition:all 0.12s; -webkit-tap-highlight-color:transparent; }
  .btn.on { background:var(--or); color:#fff; border-color:var(--or); }
  .btn:hover { background:rgba(232,94,0,0.12); }
</style>
</head>
<body>
<div id="header">
  <h1>GRACELAND</h1>
  <span>14x20 KITCHEN SHED // EXPLODED VIEW v2</span>
</div>
<div id="legend">
  <div class="li"><div class="ld" style="background:#E85E00;opacity:0.8"></div>Shell / Roof</div>
  <div class="li"><div class="ld" style="background:#EF9A9A"></div>Loft / Storage</div>
  <div class="li"><div class="ld" style="background:#29B6F6"></div>Water / PEX</div>
  <div class="li"><div class="ld" style="background:#FFD740"></div>Electrical / Romex</div>
  <div class="li"><div class="ld" style="background:#80CBC4"></div>Sinks</div>
  <div class="li"><div class="ld" style="background:#CE93D8"></div>Work Surfaces</div>
  <div class="li"><div class="ld" style="background:#80DEEA"></div>Refrigeration</div>
  <div class="li"><div class="ld" style="background:#FFCCBC"></div>Restroom</div>
  <div class="li"><div class="ld" style="background:#fff;border:1px solid #bbb"></div>FRP Panels</div>
</div>
<div id="info-panel">
  <div class="ilabel" id="ilabel">--</div>
  <div class="idetail" id="idetail">--</div>
  <div class="ispec" id="ispec"></div>
</div>
<div id="hint">DRAG TO ROTATE &nbsp;|&nbsp; PINCH ZOOM &nbsp;|&nbsp; TAP COMPONENT</div>
<div id="explode-wrap">
  <label>EXPLODE</label>
  <input type="range" id="eslider" min="0" max="100" value="0">
</div>
<div id="controls">
  <button class="btn" id="b-reset">RESET</button>
  <button class="btn on" id="b-all">ALL</button>
  <button class="btn on" id="b-shell">SHELL</button>
  <button class="btn on" id="b-loft">LOFT</button>
  <button class="btn on" id="b-water">WATER</button>
  <button class="btn on" id="b-elec">ELECTRIC</button>
  <button class="btn on" id="b-kitchen">KITCHEN</button>
  <button class="btn on" id="b-bath">RESTROOM</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=window.innerWidth, H=window.innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(W,H); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xF0EDE8);
scene.fog=new THREE.FogExp2(0xF0EDE8,0.016);

const camera=new THREE.PerspectiveCamera(42,W/H,0.1,200);
camera.position.set(24,18,28); camera.lookAt(0,4,0);

scene.add(new THREE.AmbientLight(0xfff8f0,1.2));
const sun=new THREE.DirectionalLight(0xfff5e0,2.0);
sun.position.set(15,30,20); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); scene.add(sun);
const fill=new THREE.DirectionalLight(0xe8f4ff,0.8);
fill.position.set(-15,10,-10); scene.add(fill);
const rim=new THREE.DirectionalLight(0xFFCC80,0.5);
rim.position.set(0,-5,-20); scene.add(rim);

scene.add(new THREE.GridHelper(60,60,0xd4c8b8,0xe0d8cc));

// ---- helpers ----
function m(hex,op,metal,rough){op=op===undefined?1:op;metal=metal||0;rough=rough===undefined?0.7:rough;return new THREE.MeshStandardMaterial({color:hex,transparent:op<1,opacity:op,metalness:metal,roughness:rough,side:THREE.DoubleSide});}
function wm(hex){return new THREE.LineBasicMaterial({color:hex});}
function bx(w,h,d,mat,x,y,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;return mesh;}
function wbx(w,h,d,mat,x,y,z){const mesh=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)),mat);mesh.position.set(x,y,z);return mesh;}
function cy(r,h,mat,x,y,z){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),mat);mesh.position.set(x,y,z);return mesh;}
function ln(pts,mat){const geo=new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(p[0],p[1],p[2])));return new THREE.Line(geo,mat);}

const comps=[];
function reg(mesh,cat,label,detail,spec,dir){
  scene.add(mesh);
  mesh.userData={label,detail,spec};
  comps.push({mesh,cat,home:mesh.position.clone(),dir:new THREE.Vector3(...(dir||[0,0,0]))});
  return mesh;
}

// ---- dims ----
const BW=14,BD=20,EAVE=8,PEAK=13;
const hw=BW/2,hd=BD/2;

// FLOOR
reg(bx(BW,0.2,BD,m(0xC8B89A),0,0,0),'shell','FLOOR DECK','Sealed concrete board or epoxy-coated plywood. Cove base at all wall joints. Pitched slightly toward floor drain.','14x20 ft, epoxy seal recommended',[0,-1.5,0]);

// WALLS
reg(bx(BW,EAVE,0.15,m(0xFF8844,0.1),0,EAVE/2,-hd),'shell','BACK WALL','Double window set centered. Cross ventilation with roll-up.','14ft x 8ft eave',[0,0,-3.5]);
scene.add(wbx(BW,EAVE,0.15,wm(0xE85E00),0,EAVE/2,-hd));
reg(bx(BW,EAVE,0.15,m(0xFF8844,0.1),0,EAVE/2,hd),'shell','FRONT WALL / ROLL-UP','Roll-up door main access. Entry door on left wall near this end.','14ft x 8ft eave',[0,0,3.5]);
scene.add(wbx(BW,EAVE,0.15,wm(0xE85E00),0,EAVE/2,hd));
reg(bx(0.15,EAVE,BD,m(0xFF8844,0.1),-hw,EAVE/2,0),'shell','LEFT WALL','Entry door and side window on this wall.','20ft x 8ft',[-3.5,0,0]);
scene.add(wbx(0.15,EAVE,BD,wm(0xE85E00),-hw,EAVE/2,0));
reg(bx(0.15,EAVE,BD,m(0xFF8844,0.1),hw,EAVE/2,0),'shell','RIGHT WALL','Utility wall. Subpanel, Romex drops, exterior 50A inlet.','20ft x 8ft',[3.5,0,0]);
scene.add(wbx(0.15,EAVE,BD,wm(0xE85E00),hw,EAVE/2,0));

// GAMBREL (BARN) ROOF
// Per side: two panels meeting at a knee point
// Eave at (hw, EAVE), knee at (kneeX, kneeY), ridge at (0, PEAK)
// Lower panel = steep pitch, upper panel = shallow pitch
const kneeX=4.2, kneeY=11.2;

function gambrelPanel(x0,y0, x1,y1, x2,y2, x3,y3, col){
  // Quad from (x0,y0,front)(x1,y1,front)(x2,y2,back)(x3,y3,back) extruded along Z
  const v=new Float32Array([
    x0,y0, hd,  x1,y1, hd,  x1,y1,-hd,  x0,y0,-hd,
  ]);
  const idx=new Uint16Array([0,1,2, 0,2,3]);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(v,3));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo,m(col,0.82,0.15,0.65));
}

// Left side: lower steep panel (eave to knee), upper shallow panel (knee to ridge)
reg(gambrelPanel(-hw,EAVE, -kneeX,kneeY),'shell','BARN ROOF - LEFT LOWER','Lower steep gambrel panel. Left side. Classic barn profile.','Metal panel',[- 3,2,0]);
reg(gambrelPanel(-kneeX,kneeY, 0,PEAK),'shell','BARN ROOF - LEFT UPPER','Upper shallow gambrel panel. Left side.','Metal panel',[-2,3.5,0]);

// Right side
reg(gambrelPanel(hw,EAVE, kneeX,kneeY),'shell','BARN ROOF - RIGHT LOWER','Lower steep gambrel panel. Right side.','Metal panel',[3,2,0]);
reg(gambrelPanel(kneeX,kneeY, 0,PEAK),'shell','BARN ROOF - RIGHT UPPER','Upper shallow gambrel panel. Right side.','Metal panel',[2,3.5,0]);

// End gable triangles (front and back) filled with same material
function gableEnd(z){
  // Points: left eave, left knee, right knee, right eave, left ridge, right ridge
  // Actually the gambrel gable is a pentagon: eaveL, kneeL, ridge, kneeR, eaveR
  const v=new Float32Array([
    -hw,EAVE,z,  -kneeX,kneeY,z,  0,PEAK,z,  kneeX,kneeY,z,  hw,EAVE,z
  ]);
  const idx=new Uint16Array([0,1,2, 0,2,4, 2,3,4]);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(v,3));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo,m(0xFF8844,0.15));
}
scene.add(gableEnd(hd));
scene.add(gableEnd(-hd));

// Ridge cap
reg(bx(0.3,0.3,BD+0.2,m(0xBB4400,1,0.4,0.4),0,PEAK,0),'shell','RIDGE CAP','Metal ridge cap at 13ft peak.','Galvanized or painted ridge cap',[0,3.5,0]);

// Structural edge lines for gambrel profile
[hd,-hd].forEach(z=>{
  scene.add(ln([[-hw,EAVE,z],[-kneeX,kneeY,z]],wm(0xDD6622)));
  scene.add(ln([[-kneeX,kneeY,z],[0,PEAK,z]],wm(0xDD6622)));
  scene.add(ln([[hw,EAVE,z],[kneeX,kneeY,z]],wm(0xDD6622)));
  scene.add(ln([[kneeX,kneeY,z],[0,PEAK,z]],wm(0xDD6622)));
});
// Eave runs, knee runs, ridge run along building length
scene.add(ln([[-hw,EAVE,hd],[-hw,EAVE,-hd]],wm(0xDD6622)));
scene.add(ln([[hw,EAVE,hd],[hw,EAVE,-hd]],wm(0xDD6622)));
scene.add(ln([[-kneeX,kneeY,hd],[-kneeX,kneeY,-hd]],wm(0xCC4400)));
scene.add(ln([[kneeX,kneeY,hd],[kneeX,kneeY,-hd]],wm(0xCC4400)));
scene.add(ln([[0,PEAK,hd],[0,PEAK,-hd]],wm(0xDD6622)));

// ROLL-UP DOOR
reg(bx(10,7.5,0.1,m(0x888888,0.55,0.3,0.5),0,3.75,hd+0.05),'shell','ROLL-UP DOOR','Primary equipment and service access. Size to largest piece you plan to bring in.','10ft wide x 7.5ft. Chain or electric operator.',[0,0.5,3.5]);

// Entry door
reg(bx(0.1,7,3,m(0xA0856A,0.7),-hw-0.05,3.5,6.5),'shell','ENTRY DOOR','Personnel entry left wall front half.','36in commercial self-closing door',[-3.5,0,0]);

// Windows
reg(bx(3.5,2.5,0.08,m(0x90CAF9,0.28),-2.5,5.5,-hd-0.05),'shell','BACK WINDOW LEFT','Double pane back wall.','36x30 double pane',[0,0,-3]);
reg(bx(3.5,2.5,0.08,m(0x90CAF9,0.28),2.5,5.5,-hd-0.05),'shell','BACK WINDOW RIGHT','Double pane back wall.','36x30 double pane',[0,0,-3]);
reg(bx(0.08,2.5,3.5,m(0x90CAF9,0.28),-hw-0.05,5.5,-3.5),'shell','SIDE WINDOW','Left wall rear half.','36x30 double pane',[-3,0,0]);

// ---- DUAL END LOFTS ----
// Front loft: Z 5 to 10 (5ft deep over front end)
reg(bx(BW-0.4,0.25,5,m(0xEF9A9A,0.75),0,EAVE,7.5),'loft','FRONT LOFT DECK','5ft deep loft over front end. Access via loft ladder. Dry storage: cups, containers, paper goods, smallwares.','14x5 ft. 50 psf live load minimum.',[0,3.5,2]);
scene.add(wbx(BW-0.4,0.25,5,wm(0xcc5555),0,EAVE,7.5));

// Back loft: Z -5 to -10 (5ft deep over back end)
reg(bx(BW-0.4,0.25,5,m(0xEF9A9A,0.75),0,EAVE,-7.5),'loft','BACK LOFT DECK','5ft deep loft over back end. Electrical systems, battery bank, inverter, dry goods backup.','14x5 ft. 50 psf live load.',[0,3.5,-2]);
scene.add(wbx(BW-0.4,0.25,5,wm(0xcc5555),0,EAVE,-7.5));

// Loft posts
[[hw-0.5,5],[hw-0.5,10],[hw-0.5,-5],[hw-0.5,-10],[-hw+0.5,5],[-hw+0.5,10],[-hw+0.5,-5],[-hw+0.5,-10]].forEach(([x,z])=>{
  scene.add(bx(0.3,EAVE,0.3,m(0xA0856A),x,EAVE/2,z));
});

// Loft railings
reg(bx(BW-0.4,0.08,0.06,m(0xcc4444,0.85),0,EAVE+1.1,5.02),'loft','LOFT RAILING FRONT','Front loft railing at open center span edge.','36in min height',[0,2.5,0]);
reg(bx(BW-0.4,0.08,0.06,m(0xcc4444,0.85),0,EAVE+1.1,-5.02),'loft','LOFT RAILING BACK','Back loft railing at open center edge.','36in min height',[0,2.5,0]);

// Storage on front loft
reg(bx(1.5,1.2,1.5,m(0xFFCCBC,0.9),-4,EAVE+0.75,8.5),'loft','SOLO CUPS / PAPER GOODS','Sleeve-packed cups, lids, napkins, paper towels. Date labeled.','Case storage, FIFO',[0,3,2]);
reg(bx(1.5,1.2,1.5,m(0xFFCCBC,0.9),-1.5,EAVE+0.75,8.5),'loft','FOAM CONTAINERS','Clamshell containers, foam cups, to-go packaging.','Stacked cases',[0,3,2]);
reg(bx(1.5,1.2,1.5,m(0xFFCCBC,0.9),1.5,EAVE+0.75,8.5),'loft','DRY GOODS BACKUP','Non-perishable backup stock.','FIFO rotation',[0,3,2]);
reg(bx(1.2,0.9,1.2,m(0xFFCCBC,0.9),4,EAVE+0.62,8.2),'loft','SMALLWARES BOX','Tongs, ladles, spare utensils, measuring cups.','Labeled totes',[0,3,2]);

// Storage on back loft
reg(bx(2,1.3,2,m(0xEF9A9A,0.9),-3,EAVE+0.75,-8),'loft','ELECTRICAL SYSTEMS','Inverter, battery bank, converter, spare breakers.','Back loft utility zone',[0,3,-2]);
reg(bx(1.5,1,1.5,m(0xEF9A9A,0.9),2,EAVE+0.62,-8.5),'loft','SPARE PARTS','PEX fittings, Romex coils, outlet boxes, fixtures.','Labeled totes',[0,3,-2]);

// DROP CEILING center span
reg(bx(BW-0.4,0.12,10,m(0xf5f0e8,0.25),0,7.9,0),'shell','DROP CEILING CENTER','2x4 grid tile drop ceiling over center open span between lofts. 8ft working height. Cable plenum above.','14x10 ft center zone. Washable tiles.',[0,2,0]);

// ---- FRP PANELS ----
// Back wall: 14ft = 3x4ft + 1x2ft panels, floor to 5ft
const FH=5;
[{w:4,x:-5,n:'B1'},{w:4,x:-1,n:'B2'},{w:4,x:3,n:'B3'},{w:2,x:6,n:'B4 (2ft rip)'}].forEach(p=>{
  reg(bx(p.w,FH,0.04,m(0xffffff,0.28),p.x,FH/2,-hd+0.13),'shell',`FRP ${p.n} - BACK WALL`,'Fiberglass Reinforced Panel. White, washable, food-safe. Glued and screwed with color-matched seam molding.',p.n+' 4x8 sheet ripped to height',[0,0,-3]);
  scene.add(wbx(p.w,FH,0.04,wm(0xbbbbbb),p.x,FH/2,-hd+0.13));
});

// Right wall: 20ft = 5x4ft panels
for(let i=0;i<5;i++){
  const z=-8+i*4;
  reg(bx(0.04,FH,4,m(0xffffff,0.25),hw-0.13,FH/2,z),'shell',`FRP R${i+1} - RIGHT WALL`,`Sheet ${i+1}/5 right wall wet zone.`,'4x5ft (ripped from 4x8)',[3,0,0]);
  scene.add(wbx(0.04,FH,4,wm(0xbbbbbb),hw-0.13,FH/2,z));
}

// ---- ELECTRICAL ----
reg(bx(1.2,2,0.3,m(0xFFD740,0.9,0.1,0.5),hw-0.8,5,4),'elec','MAIN SUBPANEL','100A subpanel fed from exterior 50A inlet. Distributes to all circuits: refrigeration, lighting, outlets, water pump.','100A 12-space. Eaton CH or Square D QO.',[3.5,1,0]);
reg(bx(0.35,0.35,0.15,m(0xFFCC02,1,0.2,0.4),hw+0.08,3,7),'elec','50-AMP INLET (EXTERIOR)','NEMA 14-50R on exterior right wall. Single power entry point. Generator or pedestal compatible. Non-permanent wiring strategy.','NEMA 14-50R weatherproof inlet + cover.',[4.5,0,1.5]);
reg(bx(0.9,0.55,0.6,m(0xFFD740,0.9),hw-0.8,3.8,3),'elec','AC/DC CONVERTER','120VAC to 12VDC for pump and low-voltage systems.','30A 12VDC. NOCO, Renogy, or similar.',[3.5,0.8,0]);
reg(bx(0.7,0.12,0.1,m(0xFFD740,0.9),hw-0.8,3.2,3),'elec','12V BUS BAR','Distributes 12VDC to pump, controls, low-volt lights.','Blue Sea or similar bus bar + fuse block.',[3.5,0.5,0]);

// Outlets
[-6,-2,2,6].forEach((z,i)=>{
  reg(bx(0.1,0.18,0.12,m(0xFFD740,0.9),hw-0.12,3.5,z),'elec',`20A GFCI OUTLET R${i+1}`,'20A GFCI on right wall. Commercial grade. Required in wet kitchen zones.','20A GFCI duplex',[3.5,0,0]);
});
[-6,-1,3].forEach((z,i)=>{
  reg(bx(0.12,0.18,0.1,m(0xFFD740,0.9),-hw+0.12,3.5,z),'elec',`20A OUTLET L${i+1}`,'Left wall outlets. Prep zone.','20A duplex',[-3.5,0,0]);
});

// Romex runs
[
  [[[hw-0.8,7,4],[hw-0.8,7,-2],[2,7,-2]],'Fridge/freezer circuit run'],
  [[[hw-0.8,7,4],[0,7,0],[0,7,-5]],'Lighting main trunk'],
  [[[hw-0.8,7,4],[-hw+0.5,7,4],[-hw+0.5,4,-8]],'Restroom circuit'],
  [[[hw-0.8,7,4],[hw-0.8,7,-8],[0,7,-8],[- 5,7,-8]],'Back wall outlet run'],
].forEach(([pts,label],i)=>{
  reg(ln(pts,wm(0xF9A825)),'elec',`ROMEX RUN ${i+1}`,label+'. 12/2 NM-B through ceiling plenum. Stapled 18in OC.','12/2 NM-B (Romex)',[0,1.5,0]);
});

// ---- WATER SYSTEM ----
reg(bx(2.5,3.5,2.5,m(0x29B6F6,0.85),-4,1.75,7.5),'water','IBC TOTE - FRESH','250 gal food-grade IBC. Fresh water. Near roll-up for easy hose fill access.','250 gal HDPE food grade. ~2,080 lbs full.',[-1.5,0,3]);
reg(bx(2.5,3.5,2.5,m(0x607D8B,0.8),-4,1.75,-8.5),'water','IBC TOTE - GRAY','250 gal gray water holding. All drains route here. Pump out or drain field.','250 gal, non-food-grade OK.',[-1.5,0,-3]);

// ---- EXPLODE ----
document.getElementById('eslider').addEventListener('input',function(){
  const f=parseInt(this.value)/100;
  comps.forEach(c=>{
    c.mesh.position.set(c.home.x+c.dir.x*f*4,c.home.y+c.dir.y*f*4,c.home.z+c.dir.z*f*4);
  });
});

// ---- VISIBILITY ----
const cats=new Set(['shell','loft','water','elec','kitchen','bath']);
function applyVis(){comps.forEach(c=>{c.mesh.visible=cats.has(c.cat);});}
function tog(id,cat){
  document.getElementById(id).addEventListener('click',function(){
    if(cats.has(cat))cats.delete(cat);else cats.add(cat);
    this.classList.toggle('on'); applyVis();
  });
}
tog('b-shell','shell'); tog('b-loft','loft'); tog('b-water','water');
tog('b-elec','elec'); tog('b-kitchen','kitchen'); tog('b-bath','bath');
document.getElementById('b-all').addEventListener('click',()=>{
  ['shell','loft','water','elec','kitchen','bath'].forEach(c=>cats.add(c));
  document.querySelectorAll('.btn').forEach(b=>b.classList.add('on'));
  applyVis();
});

// ---- RAYCASTING ----
const ray=new THREE.Raycaster(), mv=new THREE.Vector2();
let wasDrag=false;
function onTap(x,y){
  mv.x=(x/window.innerWidth)*2-1; mv.y=-(y/window.innerHeight)*2+1;
  ray.setFromCamera(mv,camera);
  const hits=ray.intersectObjects(comps.filter(c=>c.mesh.visible&&c.mesh.isMesh).map(c=>c.mesh));
  if(hits.length){
    const u=hits[0].object.userData;
    document.getElementById('ilabel').textContent=u.label||'--';
    document.getElementById('idetail').textContent=u.detail||'';
    document.getElementById('ispec').textContent=u.spec||'';
    document.getElementById('info-panel').classList.add('vis');
    try{hits[0].object.material.emissive=new THREE.Color(0xFF6B00);hits[0].object.material.emissiveIntensity=0.3;setTimeout(()=>{try{hits[0].object.material.emissive=new THREE.Color(0);}catch(e){}},1200);}catch(e){}
  } else {document.getElementById('info-panel').classList.remove('vis');}
}
renderer.domElement.addEventListener('click',e=>{if(!wasDrag)onTap(e.clientX,e.clientY);});
renderer.domElement.addEventListener('touchend',e=>{if(!wasDrag&&e.changedTouches.length===1)onTap(e.changedTouches[0].clientX,e.changedTouches[0].clientY);});

// ---- ORBIT ----
let rotX=-0.32,rotY=0.52,tRX=-0.32,tRY=0.52,camR=38,prev={x:0,y:0},drag=false,dragD=0;
renderer.domElement.addEventListener('mousedown',e=>{drag=true;dragD=0;wasDrag=false;prev={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-prev.x,dy=e.clientY-prev.y;dragD+=Math.abs(dx)+Math.abs(dy);if(dragD>4)wasDrag=true;tRY+=dx*0.007;tRX+=dy*0.005;tRX=Math.max(-1.1,Math.min(0.15,tRX));prev={x:e.clientX,y:e.clientY};});
window.addEventListener('mouseup',()=>{drag=false;setTimeout(()=>wasDrag=false,50);});
renderer.domElement.addEventListener('wheel',e=>{camR=Math.max(14,Math.min(65,camR+e.deltaY*0.04));},{passive:true});
let pinch0=null,pinchR0=camR;
renderer.domElement.addEventListener('touchstart',e=>{drag=true;dragD=0;wasDrag=false;if(e.touches.length===1)prev={x:e.touches[0].clientX,y:e.touches[0].clientY};if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pinch0=Math.sqrt(dx*dx+dy*dy);pinchR0=camR;}},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1){const dx=e.touches[0].clientX-prev.x,dy=e.touches[0].clientY-prev.y;dragD+=Math.abs(dx)+Math.abs(dy);if(dragD>6)wasDrag=true;tRY+=dx*0.009;tRX+=dy*0.007;tRX=Math.max(-1.1,Math.min(0.15,tRX));prev={x:e.touches[0].clientX,y:e.touches[0].clientY};}if(e.touches.length===2&&pinch0){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;camR=Math.max(14,Math.min(65,pinchR0*(pinch0/Math.sqrt(dx*dx+dy*dy))));}},{passive:false});
renderer.domElement.addEventListener('touchend',()=>{drag=false;pinch0=null;setTimeout(()=>wasDrag=false,80);},{passive:true});
document.getElementById('b-reset').addEventListener('click',()=>{tRX=-0.32;tRY=0.52;camR=38;});

// ---- RENDER ----
function animate(){
  requestAnimationFrame(animate);
  rotX+=(tRX-rotX)*0.08; rotY+=(tRY-rotY)*0.08;
  camera.position.x=camR*Math.sin(rotY)*Math.cos(rotX);
  camera.position.y=camR*Math.sin(rotX)+6;
  camera.position.z=camR*Math.cos(rotY)*Math.cos(rotX);
  camera.lookAt(0,4,0);
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>
