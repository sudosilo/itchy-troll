<!-- =====================================================================
       MOHAVE TECHNOLOGY GROUP // CREATOR SEAL
       Drop this ONE block into any HTML page, anywhere before </body>.
       The only thing you edit is the CONFIG object on the next few lines.
       ===================================================================== -->
  <script>
  (function () {

    /* ---------- CONFIG: the only part you change ---------- */
    var CONFIG = {
      org:      "Mohave Technology Group",
      monogram: "MTG",                       // shown in the center of the seal
      mission:  "Practical software and hardware, built in the field.",
      github:   "https://github.com/sudosilo",
      linkedin: "https://www.linkedin.com/in/dicktemple"
    };
    /* ----------------------------------------------------- */


    /* ---------- LAYER 1: the signature pressed into the source ----------
       This runs once and writes your identity into the page head so that
       anyone viewing source, and any machine reading the page, can find
       the maker even if the footer is removed. */
    var head = document.head || document.getElementsByTagName("head")[0];

    // A plain comment banner, visible in View Source.
    head.appendChild(document.createComment(
      " Made by " + CONFIG.org + " // " + CONFIG.github + " // " + CONFIG.linkedin + " "
    ));

    // Standard "author" tag set to the group, not a personal name.
    var metaAuthor = document.createElement("meta");
    metaAuthor.setAttribute("name", "author");
    metaAuthor.setAttribute("content", CONFIG.org);
    head.appendChild(metaAuthor);

    // rel="me" links: the web standard for saying "these profiles are mine".
    [CONFIG.github, CONFIG.linkedin].forEach(function (url) {
      var l = document.createElement("link");
      l.setAttribute("rel", "me");
      l.setAttribute("href", url);
      head.appendChild(l);
    });

    // Structured data block, so search engines and crawlers can read it.
    var ld = document.createElement("script");
    ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": CONFIG.org,
      "sameAs": [CONFIG.github, CONFIG.linkedin]
    });
    head.appendChild(ld);


    /* ---------- LAYER 2: the visible seal ---------- */

    // The look of the seal. All self contained, no fonts to download.
    var css = ''
      + '.mtg-seal{box-sizing:border-box;width:100%;background:#efe9da;'
      + 'border-top:1px solid #cabfa3;color:#2b2620;'
      + 'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;'
      + 'padding:18px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;}'
      + '.mtg-seal-row{display:flex;align-items:center;gap:14px;}'
      + '.mtg-seal-btn{background:none;border:0;padding:0;margin:0;cursor:pointer;'
      + 'display:flex;align-items:center;gap:14px;color:inherit;font:inherit;}'
      + '.mtg-seal-svg{display:block;transition:transform .18s ease;}'
      + '.mtg-seal.open .mtg-seal-svg{transform:scale(.94);}'
      + '.mtg-seal-label{text-align:left;line-height:1.3;}'
      + '.mtg-seal-org{font-family:Georgia,"Times New Roman",serif;font-size:14px;'
      + 'letter-spacing:.3px;color:#2b2620;}'
      + '.mtg-seal-ask{font-size:12px;color:#7a2e28;text-decoration:underline;}'
      + '.mtg-seal-panel{overflow:hidden;max-height:0;opacity:0;'
      + 'transition:max-height .25s ease,opacity .25s ease;width:100%;max-width:360px;}'
      + '.mtg-seal.open .mtg-seal-panel{max-height:200px;opacity:1;}'
      + '.mtg-seal-mission{font-style:italic;color:#4a443b;font-size:13px;'
      + 'text-align:center;margin:0 0 12px;line-height:1.5;}'
      + '.mtg-seal-links{display:flex;justify-content:center;gap:10px;}'
      + '.mtg-seal-links a{flex:1;text-align:center;text-decoration:none;'
      + 'font-size:13px;color:#2b2620;background:#faf7ef;border:1px solid #cabfa3;'
      + 'border-radius:6px;padding:8px 10px;transition:background .15s ease;}'
      + '.mtg-seal-links a:hover{background:#fff;}'
      + '.mtg-seal-btn:focus-visible{outline:2px solid #7a2e28;outline-offset:3px;border-radius:4px;}'
      + '.mtg-seal-links a:focus-visible{outline:2px solid #7a2e28;outline-offset:2px;}'
      + '@media (prefers-reduced-motion: reduce){'
      + '.mtg-seal-svg,.mtg-seal-panel{transition:none;}}';

    var style = document.createElement("style");
    style.textContent = css;
    head.appendChild(style);

    // The seal artwork. An SVG circle with the org name around the ring,
    // the monogram in the center, and a small diamond mark at the bottom.
    function buildSeal() {
      var org = CONFIG.org.toUpperCase();
      return ''
        + '<svg class="mtg-seal-svg" viewBox="0 0 120 120" width="58" height="58" '
        +   'role="img" aria-label="' + CONFIG.org + ' seal">'
        +   '<defs>'
        +     '<path id="mtgTop" d="M 23,60 A 37,37 0 0 1 97,60" fill="none"/>'
        +   '</defs>'
        +   '<circle cx="60" cy="60" r="55" fill="none" stroke="#7a2e28" stroke-width="2.5"/>'
        +   '<circle cx="60" cy="60" r="48" fill="none" stroke="#7a2e28" stroke-width="1"/>'
        +   '<text font-family="Georgia,serif" font-size="8" fill="#7a2e28">'
        +     '<textPath href="#mtgTop" startOffset="50%" text-anchor="middle" '
        +     'textLength="106" lengthAdjust="spacingAndGlyphs">'
        +     org + '</textPath>'
        +   '</text>'
        +   '<text x="60" y="60" text-anchor="middle" dominant-baseline="central" '
        +     'font-family="Georgia,serif" font-weight="700" font-size="27" '
        +     'fill="#7a2e28">' + CONFIG.monogram + '</text>'
        +   '<g fill="#7a2e28">'
        +     '<rect x="58" y="83.5" width="4" height="4"/>'
        +     '<rect x="63" y="88.5" width="4" height="4"/>'
        +     '<rect x="53" y="93.5" width="4" height="4"/>'
        +     '<rect x="58" y="93.5" width="4" height="4"/>'
        +     '<rect x="63" y="93.5" width="4" height="4"/>'
        +   '</g>'
        + '</svg>';
    }

    // Build the footer element.
    var seal = document.createElement("footer");
    seal.className = "mtg-seal";
    seal.innerHTML = ''
      + '<div class="mtg-seal-row">'
      +   '<button class="mtg-seal-btn" type="button" aria-expanded="false">'
      +     buildSeal()
      +     '<span class="mtg-seal-label">'
      +       '<span class="mtg-seal-org">' + CONFIG.org + '</span><br>'
      +       '<span class="mtg-seal-ask">Who made this?</span>'
      +     '</span>'
      +   '</button>'
      + '</div>'
      + '<div class="mtg-seal-panel">'
      +   '<p class="mtg-seal-mission">' + CONFIG.mission + '</p>'
      +   '<div class="mtg-seal-links">'
      +     '<a href="' + CONFIG.github + '" target="_blank" rel="noopener me">GitHub</a>'
      +     '<a href="' + CONFIG.linkedin + '" target="_blank" rel="noopener me">LinkedIn</a>'
      +   '</div>'
      + '</div>';

    // Tapping the seal opens or closes the panel.
    var btn = seal.querySelector(".mtg-seal-btn");
    btn.addEventListener("click", function () {
      var nowOpen = seal.classList.toggle("open");
      btn.setAttribute("aria-expanded", nowOpen ? "true" : "false");
    });

    // Place the seal at the very bottom of the page.
    document.body.appendChild(seal);

  })();
  </script>
  <!-- ===================== END CREATOR SEAL ===================== -->
