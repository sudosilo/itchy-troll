<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atlas of Tiles</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f4ede2; --bg-deep: #ebe0cc;
    --ink: #2a1f17; --stone: #cdbfa7; --stone-dark: #8a7558;
    --grout: #a89478; --accent: #b8552e; --glow: #e8c66a;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--sans);
    overflow: hidden; height: 100vh; width: 100vw;
    overscroll-behavior: none; touch-action: manipulation;
    color: var(--ink); background: var(--bg);
    transition: background 0.5s, color 0.5s;
  }
  body { display: flex; flex-direction: column; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 6px; flex-shrink: 0; }
  .menu-btn { background: transparent; border: none; width: 36px; height: 36px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; cursor: pointer; padding: 0; }
  .menu-btn span { display: block; width: 20px; height: 1.5px; background: var(--ink); transition: background 0.3s; }
  .top-left { display: flex; align-items: center; gap: 4px; }
  .sound-btn { background: transparent; border: none; width: 36px; height: 36px; color: var(--ink); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
  .sound-btn .mute { display: none; }
  .sound-btn.off .mute { display: inline; }
  .sound-btn.off .waves { display: none; }
  .sound-btn.off { opacity: 0.5; }
  .title { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 20px; color: var(--ink); transition: color 0.5s; }
  .stats { display: flex; gap: 14px; align-items: baseline; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; min-width: 44px; }
  .stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--stone-dark); margin-bottom: 3px; transition: color 0.5s; }
  .stat-value { font-family: var(--serif); font-weight: 600; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; transition: color 0.5s; }
  .stat-value.flash { color: var(--accent); transition: color 0.6s; }
  .stat-value.warn { color: var(--accent); }

  .modes { display: flex; gap: 6px; padding: 2px 16px 8px; flex-shrink: 0; }
  .mode-tab { flex: 1; background: transparent; color: var(--ink); border: 1px solid var(--grout); padding: 8px 0; font-family: var(--sans); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; border-radius: 2px; cursor: pointer; transition: background 0.3s, color 0.3s, border-color 0.3s; }
  .mode-tab.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .style-strip { padding: 0 16px 4px; display: flex; justify-content: space-between; align-items: baseline; flex-shrink: 0; }
  .style-name { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--stone-dark); transition: color 0.5s; }
  .style-origin { font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--stone-dark); transition: color 0.5s; }

  .board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 4px; min-height: 0; }
  .board { width: 100%; height: 100%; max-width: 100vw; touch-action: none; }

  .bottombar { padding: 8px 16px 16px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; gap: 12px; }
  .hint { font-family: var(--serif); font-style: italic; font-size: 13px; line-height: 1.2; color: var(--stone-dark); transition: color 0.5s; }
  .controls { display: flex; gap: 8px; flex-shrink: 0; }
  .btn { background: var(--ink); color: var(--bg); border: 1px solid var(--ink); padding: 9px 12px; font-family: var(--sans); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; cursor: pointer; border-radius: 2px; transition: background 0.3s, color 0.3s, opacity 0.3s; }
  .btn:active { transform: translateY(1px); }
  .btn.alt { background: transparent; color: var(--ink); }
  .btn.alt.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .btn:disabled { opacity: 0.3; pointer-events: none; }

  .tile-base { fill: var(--stone); stroke: var(--grout); stroke-width: 0.8; transition: fill 0.5s, stroke 0.5s; }
  .tile-base-alt { fill: var(--bg); stroke: var(--grout); stroke-width: 0.8; transition: fill 0.5s, stroke 0.5s; }
  .arc { fill: none; stroke: var(--ink); pointer-events: none; opacity: 0.7; transition: stroke 0.5s; stroke-linecap: round; }
  .arc-band { fill: none; stroke: var(--accent); stroke-width: 4; pointer-events: none; opacity: 0; transition: opacity 0.4s, stroke 0.5s; stroke-linecap: round; }
  .arc-band.lit { opacity: 0.7; stroke: var(--glow); }
  .arc-band.subtle { stroke-width: 2.5; }
  .arc-band.subtle.lit { opacity: 0.9; stroke: var(--accent); }
  .creature { stroke: var(--ink); stroke-width: 0.6; stroke-linejoin: round; pointer-events: none; transition: fill 0.5s, stroke 0.5s; }
  .creature-eye { pointer-events: none; }
  .vertex-glow { fill: var(--glow); opacity: 0; transition: opacity 0.4s; pointer-events: none; }
  .vertex-glow.lit { opacity: 0.55; }
  .vertex-glow.near { opacity: 0.18; }
  .wang-edge-band { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; transition: opacity 0.4s, stroke 0.5s; pointer-events: none; }
  .wang-edge-band.lit { opacity: 0.6; stroke: var(--glow); }
  .tile-group { transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; }
  .tile-hit { fill: transparent; cursor: pointer; }
  .deco { pointer-events: none; }

  .pipe-base { fill: var(--bg); stroke: var(--grout); stroke-width: 0.8; transition: fill 0.4s, stroke 0.4s; }
  .ps-streets .pipe-base { fill: #e4e8d6; stroke: #cfd4bf; }
  .ps-power .pipe-base { fill: #eef3f6; stroke: #d3dde3; }
  .ps-water .pipe-base { fill: #ece7de; stroke: #d6cfc2; }
  .pseg { fill: none; stroke-linecap: butt; pointer-events: none; }
  .phub { stroke: none; pointer-events: none; }
  .water.on .flow { animation: flow 0.9s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  .valve-arrow { fill: var(--accent); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; pointer-events: none; }
  .ps-water .valve-arrow { fill: #c0392b; stroke: #56636d; }
  .ps-streets .valve-arrow { fill: #ffffff; stroke: none; }
  .ps-power .valve-arrow, .ps-circuit .valve-arrow { fill: #24382c; stroke: none; }
  .ps-circuit .pipe-base { fill: #f3f6ef; stroke: #d9e2d3; }
  .cp-body { fill: #f3f6ef; stroke: #24382c; stroke-width: 2.2; pointer-events: none; }
  .cp-clear { fill: #f3f6ef; stroke: none; pointer-events: none; }
  .cp-line { fill: none; stroke: #24382c; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .cp-line.thick { stroke-width: 4; }
  .cp-fill { fill: #24382c; pointer-events: none; }
  .cp-hot { fill: none; stroke: #ff7a00; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .cp-glow { opacity: 0.6; pointer-events: none; }
  .cp-dot { fill: #24382c; pointer-events: none; }
  .cp-text { font-family: var(--sans); font-weight: 700; fill: #24382c; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .valve-bar { stroke: #2b2b2b; stroke-width: 3; pointer-events: none; }
  .pole { fill: #7a5a3a; stroke: #2b2b2b; stroke-width: 1.5; pointer-events: none; }
  .house { fill: #f6f3ec; stroke: #2b2b2b; stroke-width: 2; pointer-events: none; }
  .house-lit { fill: #ffd23a; pointer-events: none; }
  .pipe-tile.locked .pipe-base { fill: var(--bg-deep); stroke: var(--accent); stroke-width: 1.6; }
  .board.solved .pipe-base { fill: var(--bg-deep); }
  .pc-l { stroke: var(--ink); fill: none; stroke-linecap: butt; pointer-events: none; }
  .pc-c { fill: var(--ink); pointer-events: none; }
  .pi-l { stroke: var(--bg-deep); fill: none; stroke-linecap: butt; pointer-events: none; }
  .pi-c { fill: var(--bg-deep); pointer-events: none; }
  .pw-l { stroke: var(--glow); fill: none; stroke-linecap: butt; pointer-events: none; }
  .pw-c { fill: var(--glow); pointer-events: none; }
  .water { opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  .water.on { opacity: 1; }
  .drain { fill: var(--ink); pointer-events: none; }
  .source-plate { fill: var(--accent); stroke: var(--ink); stroke-width: 1; pointer-events: none; }
  .source-core { fill: var(--glow); pointer-events: none; }
  .rock { fill: var(--stone-dark); stroke: var(--grout); stroke-width: 0.8; }
  .rock-in { fill: var(--grout); opacity: 0.55; }
  .pipe-tile.fixed .pipe-base { fill: var(--stone); }
  .rivet { fill: var(--ink); opacity: 0.55; pointer-events: none; }
  .bridge-base { fill: var(--bg-deep); stroke: var(--accent); stroke-width: 1.4; }
  .bridge-gap { stroke: var(--bg-deep); fill: none; stroke-linecap: butt; pointer-events: none; }

  .drawer-backdrop { position: fixed; inset: 0; background: rgba(20, 14, 8, 0.25); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 10; }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 86%; max-width: 360px; background: var(--bg); transform: translateX(-100%); transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), background 0.5s; z-index: 20; display: flex; flex-direction: column; box-shadow: 4px 0 24px rgba(0,0,0,0.12); }
  .drawer.open { transform: translateX(0); }
  .drawer-header { padding: 22px 22px 14px; border-bottom: 1px solid var(--stone); flex-shrink: 0; transition: border-color 0.5s; }
  .drawer-title { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 26px; color: var(--ink); margin: 0; line-height: 1; }
  .drawer-sub { font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--stone-dark); margin-top: 8px; }
  .drawer-list { flex: 1; overflow-y: auto; padding: 6px 0 20px; }
  .section-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--stone-dark); padding: 14px 22px 6px; border-bottom: 1px solid rgba(0,0,0,0.05); font-weight: 600; }
  .style-row { padding: 14px 22px; border-bottom: 1px solid rgba(0,0,0,0.06); cursor: pointer; display: flex; align-items: center; gap: 14px; transition: background 0.2s; }
  .style-row:active { background: rgba(0,0,0,0.04); }
  .style-row.active { background: rgba(0,0,0,0.05); }
  .swatch { width: 38px; height: 38px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.1); position: relative; overflow: hidden; }
  .swatch-stripe { position: absolute; inset: 0; display: flex; }
  .swatch-stripe > div { flex: 1; }
  .style-row-text { flex: 1; min-width: 0; }
  .style-row-name { font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.1; color: var(--ink); }
  .style-row-desc { font-size: 12px; color: var(--stone-dark); margin-top: 4px; font-style: italic; font-family: var(--serif); line-height: 1.3; }
  .check { width: 16px; height: 16px; flex-shrink: 0; opacity: 0; transition: opacity 0.2s; }
  .style-row.active .check { opacity: 1; }
  .check::after { content: '◆'; color: var(--accent); font-size: 12px; }

  .vault { display: none; flex-direction: column; gap: 6px; padding: 0 16px 6px; flex-shrink: 0; }
  .vault.open { display: flex; }
  .vault-row { display: flex; align-items: center; gap: 8px; }
  .vault-label { width: 38px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--stone-dark); flex-shrink: 0; }
  .vault-cells { flex: 1; display: flex; gap: 6px; align-items: center; }
  .chip, .slot { flex: 1; height: 34px; min-width: 0; padding: 0; border: 2px solid var(--grout); background: var(--bg); color: var(--stone-dark); font-family: var(--serif); font-size: 19px; font-weight: 600; cursor: pointer; transition: opacity 0.2s, background 0.3s; }
  .chip { border-radius: 17px; }
  .slot { border-radius: 4px; }
  .chip.found { color: #fff; }
  .chip.used { opacity: 0.3; }
  .vault-cells .btn { flex-shrink: 0; }
  .shake { animation: shake 0.4s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .vault-ring { fill: var(--bg); stroke: var(--stone-dark); stroke-width: 2; pointer-events: none; transition: fill 0.4s, stroke 0.4s, opacity 0.4s; }
  .vault-pip { fill: var(--grout); pointer-events: none; transition: fill 0.3s, opacity 0.3s; }
  .vault-pip.on { fill: var(--ink); }
  .vault-spot.empty .vault-ring { fill: none; stroke-dasharray: 2 3; opacity: 0.45; }
  .vault-digit { font-family: var(--sans); font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
  .vault-spot.found .vault-digit { opacity: 1; }

  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255, 252, 245, 0.55); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 30; padding: 24px; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .card { background: var(--bg); border: 1px solid var(--grout); border-radius: 4px; padding: 26px 24px 20px; width: 100%; max-width: 320px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.12); transform: translateY(10px); transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
  .overlay.open .card { transform: translateY(0); }
  .card-title { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 28px; line-height: 1.1; }
  .card-stars { font-size: 30px; letter-spacing: 6px; color: var(--accent); margin: 10px 0 4px; min-height: 8px; }
  .card-body { font-family: var(--serif); font-size: 15px; color: var(--stone-dark); line-height: 1.4; margin: 8px 0 18px; }
  .post { margin: -6px 0 16px; }
  .post:empty { display: none; }
  .post-row { display: flex; gap: 8px; justify-content: center; align-items: center; }
  .post-tag { width: 76px; height: 36px; text-align: center; font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; border: 1px solid var(--grout); border-radius: 2px; background: var(--bg); color: var(--ink); }
  .post-msg { font-size: 12px; color: var(--stone-dark); margin-top: 8px; min-height: 14px; }
  .post-board { margin-top: 8px; text-align: left; font-size: 13px; }
  .post-board div { display: flex; justify-content: space-between; padding: 3px 4px; border-bottom: 1px solid rgba(0,0,0,0.06); font-variant-numeric: tabular-nums; }
  .post-board div.me { color: var(--accent); font-weight: 600; }
  .legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 4px; margin-top: 12px; }
  .leg-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--sans); font-size: 10px; color: var(--ink); }
  .card-actions { display: flex; gap: 8px; justify-content: center; }
</style>
</head>
<body>

<div class="topbar">
  <div class="top-left">
    <button class="menu-btn" id="menuBtn" aria-label="Skins"><span></span><span></span><span></span></button>
    <button class="sound-btn" id="soundBtn" aria-label="Sound"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="mute" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
  <div class="title">Atlas</div>
  <div class="stats">
    <div class="stat"><div class="stat-label" id="labelA">Matches</div><div class="stat-value" id="statA">0</div></div>
    <div class="stat"><div class="stat-label" id="labelB">Score</div><div class="stat-value" id="statB">0</div></div>
  </div>
</div>

<div class="modes" id="modes">
  <button class="mode-tab" data-mode="play">Play</button>
  <button class="mode-tab" data-mode="pipes">Pipes</button>
  <button class="mode-tab" data-mode="rush">Rush</button>
  <button class="mode-tab" data-mode="viz">Visualize</button>
</div>

<div class="style-strip">
  <div class="style-name" id="styleName">Andalusian</div>
  <div class="style-origin" id="styleOrigin">Free Play</div>
</div>

<div class="vault" id="vault">
  <div class="vault-row"><div class="vault-label">Found</div><div class="vault-cells" id="vaultChips"></div></div>
  <div class="vault-row"><div class="vault-label">Code</div><div class="vault-cells" id="vaultSlots"></div></div>
</div>

<div class="board-wrap">
  <svg class="board" id="board" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="bottombar">
  <div class="hint" id="hint">Tap a tile to rotate.<br/>Close the curves into loops.</div>
  <div class="controls" id="controls"></div>
</div>

<div class="drawer-backdrop" id="backdrop"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title">Skins</div>
    <div class="drawer-sub">Colors and tile shapes for every mode</div>
  </div>
  <div class="drawer-list" id="styleList"></div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="card-title" id="ovTitle"></div>
    <div class="card-stars" id="ovStars"></div>
    <div class="card-body" id="ovBody"></div>
    <div class="post" id="ovPost"></div>
    <div class="card-actions" id="ovActions"></div>
  </div>
</div>

<script src="https://2026-10-30-orange-scores.vercel.app/sdk.js"></script>
<script>
const SVG_NS = 'http://www.w3.org/2000/svg';

/* STYLE CATALOG (skins) */
const STYLES = [
  { section: 'Traditions', id: 'andalusian', name: 'Andalusian', origin: 'Granada · Spain',
    desc: 'Moorish hex tiles, tight corner curves.',
    kind: 'arc', gridType: 'hex', tilePattern: 'hex-corner-tight', rotations: 6,
    palette: { bg: '#f4ede2', bgDeep: '#ebe0cc', ink: '#2a1f17', stone: '#cdbfa7', stoneDark: '#8a7558', grout: '#a89478', accent: '#b8552e', glow: '#e8c66a' }},
  { section: 'Traditions', id: 'andalusian-sweep', name: 'Andalusian Sweep', origin: 'Granada · Spain',
    desc: 'Long sweeping curves like the Alhambra floor.',
    kind: 'arc', gridType: 'hex', tilePattern: 'hex-corner-deep', rotations: 6,
    palette: { bg: '#f2ebe0', bgDeep: '#e8dcc8', ink: '#241812', stone: '#c8b89e', stoneDark: '#7a6448', grout: '#a08c6c', accent: '#c25a30', glow: '#e8b842' }},
  { section: 'Traditions', id: 'azulejo', name: 'Azulejo', origin: 'Lisbon · Portugal',
    desc: 'Square Truchet, cobalt on white.',
    kind: 'arc', gridType: 'square', tilePattern: 'square-quarter', rotations: 4,
    palette: { bg: '#f5f4ee', bgDeep: '#e6e7e0', ink: '#1c3a6e', stone: '#ffffff', stoneDark: '#5a7aa6', grout: '#c8d2dd', accent: '#1c3a6e', glow: '#f0b942' }},
  { section: 'Traditions', id: 'azulejo-diag', name: 'Azulejo Lines', origin: 'Lisbon · Portugal',
    desc: 'Straight diagonals, geometric variant.',
    kind: 'arc', gridType: 'square', tilePattern: 'square-line-diag', rotations: 4,
    palette: { bg: '#f5f4ee', bgDeep: '#e6e7e0', ink: '#1c3a6e', stone: '#ffffff', stoneDark: '#5a7aa6', grout: '#c8d2dd', accent: '#1c3a6e', glow: '#f0b942' }},
  { section: 'Traditions', id: 'maiolica', name: 'Maiolica', origin: 'Deruta · Italy',
    desc: 'Diagonal split squares, Tuscan paint.',
    kind: 'arc', gridType: 'square', tilePattern: 'square-diagonal', rotations: 4,
    subtleLoops: true,
    palette: { bg: '#fbf3d8', bgDeep: '#f0e3b5', ink: '#4a3110', stone: '#f5e08c', stoneDark: '#8c6a2a', grout: '#c8a85a', accent: '#8c6a2a', glow: '#5a7d3a' }},
  { section: 'Traditions', id: 'zellij', name: 'Zellij', origin: 'Fez · Morocco',
    desc: 'Star-pointed hex, jewel tones.',
    kind: 'arc', gridType: 'hex', tilePattern: 'hex-star', rotations: 6,
    palette: { bg: '#f0ebe0', bgDeep: '#e0d8c5', ink: '#0e2a3a', stone: '#1c4d6e', stoneDark: '#0e2a3a', grout: '#d8cdb5', accent: '#c4502e', glow: '#e8b842' }},
  { section: 'Traditions', id: 'delft', name: 'Delft', origin: 'Delft · Netherlands',
    desc: 'Small quarter circles, deep blue.',
    kind: 'arc', gridType: 'square', tilePattern: 'square-quarter-small', rotations: 4,
    palette: { bg: '#fbfaf6', bgDeep: '#ecebe3', ink: '#1a3a78', stone: '#ffffff', stoneDark: '#6a82ac', grout: '#d4dae4', accent: '#1a3a78', glow: '#c9a13a' }},
  { section: 'Traditions', id: 'seigaiha', name: 'Seigaiha', origin: 'Kyoto · Japan',

/* SOUND. Everything is synthesized, nothing to download. */
const SND = { on: true, ctx: null, noiseBuf: null };
function actx() {
  if (!SND.ctx) { try { SND.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (SND.ctx.state === 'suspended') SND.ctx.resume();
  return SND.ctx;
}
document.addEventListener('pointerdown', () => { if (SND.on) actx(); }, { passive: true });
function tone(freq, dur, type, vol, when, slideTo) {
  if (!SND.on) return;
  const c = actx(); if (!c) return;
  const t = c.currentTime + (when || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, freq, ftype, when, freqTo) {
  if (!SND.on) return;
  const c = actx(); if (!c) return;
  if (!SND.noiseBuf) {
    SND.noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = SND.noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = c.currentTime + (when || 0);
  const src = c.createBufferSource(); src.buffer = SND.noiseBuf; src.loop = true;
  const f = c.createBiquadFilter(); f.type = ftype || 'lowpass'; f.frequency.setValueAtTime(freq, t);
  if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t); src.stop(t + dur + 0.05);
}
const sfx = {
  click() { tone(1400, 0.03, 'square', 0.03); tone(420, 0.06, 'triangle', 0.06, 0.004); },
  lock() { tone(180, 0.08, 'square', 0.05); tone(260, 0.06, 'square', 0.04, 0.05); },
  flow(style, gained) {
    const k = Math.min(gained, 12);
    if (style === 'water') noise(0.45, 0.07, 500 + k * 60, 'bandpass', 0, 1400);
    else if (style === 'streets') { tone(95, 0.35, 'sawtooth', 0.035, 0, 150); if (gained > 3) { tone(440, 0.12, 'square', 0.025, 0.12); tone(554, 0.12, 'square', 0.02, 0.12); } }
    else if (style === 'circuit') { if (P.current === 'AC') { tone(60, 0.3, 'sine', 0.06); tone(180, 0.3, 'sine', 0.02); } else { tone(1200, 0.05, 'square', 0.03); tone(1800, 0.06, 'square', 0.025, 0.05); } noise(0.06, 0.03, 5000, 'highpass'); }
    else if (style === 'power') { tone(60, 0.4, 'sawtooth', 0.045); tone(120, 0.4, 'square', 0.015); noise(0.08, 0.04, 4000, 'highpass', 0.02); }
    else tone(330 + k * 25, 0.18, 'sine', 0.07, 0, 440 + k * 30);

function applyStylePalette(s) {
  const p = s.palette;
  const r = document.documentElement.style;
  for (const [k, v] of Object.entries({ bg: p.bg, 'bg-deep': p.bgDeep, ink: p.ink, stone: p.stone, 'stone-dark': p.stoneDark, grout: p.grout, accent: p.accent, glow: p.glow })) {
    r.setProperty('--' + k, v);
  }
  document.body.style.background = `radial-gradient(ellipse at top, ${p.bg} 0%, ${p.bg} 45%, ${p.bgDeep} 100%)`;
  styleNameEl.textContent = s.name;
  updateHint();
}

function updateHint() {
  if (mode === 'pipes') {
    hintEl.innerHTML = 'Tap to turn a pipe. Hold to lock it.<br/>Fill every pipe. Route around rock.';
  } else if (mode === 'rush') {
    hintEl.innerHTML = 'Fill every pipe before time runs out.<br/>Each board you clear adds time.';
  } else if (mode === 'viz') {
    hintEl.innerHTML = 'Tap a tile to send a ripple.<br/>Mic makes the floor dance to sound.';
  } else if (currentStyle.kind === 'escher') {
    const allFound = VAULT.spots.length && VAULT.spots.every(s => s.found);
    if (VAULT.msg) hintEl.innerHTML = VAULT.msg + '<br/>Try another order.';
    else if (allFound) hintEl.innerHTML = ['All five found.<br/>Put each digit under its color.', 'All five found. Colors repeat,<br/>so test which goes where.', 'All five found. Two colors only,<br/>so test which goes where.', 'All five found. No color clues.<br/>Guess the order to crack it.'][VAULT.diff];
    else hintEl.innerHTML = 'Crack rings to find the five digits.<br/>Most rings are empty decoys.';
  } else if (currentStyle.kind === 'wang') {
    hintEl.innerHTML = 'Tap to cycle. Match colored<br/>edges with neighbors.';
  } else {
    hintEl.innerHTML = 'Tap a tile to rotate.<br/>Close the curves into loops.';
  }
}

/* ═══════════════════════════════════════════════════════
   HEX MATH
   ═══════════════════════════════════════════════════════ */
function hexToPixel(col, row, size) {
  return { x: size * Math.sqrt(3) * (col + 0.5 * (row & 1)), y: size * 1.5 * row };
}
function hexVertex(cx, cy, size, i) {
  const a = (Math.PI / 180) * (-90 + 60 * i);
  return { x: cx + size * Math.cos(a), y: cy + size * Math.sin(a) };
}
function hexEdgeMid(cx, cy, size, i) {
  const v1 = hexVertex(cx, cy, size, i);
  const v2 = hexVertex(cx, cy, size, (i + 1) % 6);
  return { x: (v1.x + v2.x) / 2, y: (v1.y + v2.y) / 2 };
}
function hexNeighbor(col, row, edgeIdx) {
  const odd = row & 1;
  const offsetsEven = [[0,-1],[1,0],[0,1],[-1,1],[-1,0],[-1,-1]];
  const offsetsOdd  = [[1,-1],[1,0],[1,1],[0,1],[-1,0],[0,-1]];
  const off = odd ? offsetsOdd[edgeIdx] : offsetsEven[edgeIdx];
  return { col: col + off[0], row: row + off[1] };
}
function hexPolygon(size) {
  let pts = '';
  for (let i = 0; i < 6; i++) {
    const v = hexVertex(0, 0, size, i);
    pts += `${v.x.toFixed(2)},${v.y.toFixed(2)} `;
  }
  return pts.trim();
}

/* ═══════════════════════════════════════════════════════
   SQUARE MATH
   ═══════════════════════════════════════════════════════ */
function sqEdgeMid(size, edgeIdx) {
  const h = size / 2;
  switch (edgeIdx) {
    case 0: return { x: 0, y: -h }; case 1: return { x: h, y: 0 };
    case 2: return { x: 0, y: h };  case 3: return { x: -h, y: 0 };
  }
}
function sqNeighbor(col, row, edgeIdx) {
  switch (edgeIdx) {
    case 0: return { col, row: row - 1 };  case 1: return { col: col + 1, row };
    case 2: return { col, row: row + 1 };  case 3: return { col: col - 1, row };
  }
}
function sqOpposite(i) { return (i + 2) % 4; }

/* ═══════════════════════════════════════════════════════
   TRIANGLE MATH
   Triangles alternate up-pointing and down-pointing.
   In offset coords, (col, row) with (col + row) even = up-pointing,
   otherwise down-pointing. Each triangle has 3 edges.
   ═══════════════════════════════════════════════════════ */
function triIsUp(col, row) {
  return ((col + row) & 1) === 0;
}
function triToPixel(col, row, size) {
  // size = edge length; triangle height = size * sqrt(3) / 2
  const h = size * Math.sqrt(3) / 2;
  const x = col * size / 2;
  const y = row * h + h * (triIsUp(col, row) ? (2/3) : (1/3));
  return { x, y };
}
function triVertex(cx, cy, size, i, isUp) {
  // For up-pointing: vertex 0 at top, 1 at bottom-right, 2 at bottom-left
  // For down-pointing: vertex 0 at bottom, 1 at top-left, 2 at top-right
  const h = size * Math.sqrt(3) / 2;
  const r = size / Math.sqrt(3); // distance from centroid to vertex
  if (isUp) {
    switch (i) {
      case 0: return { x: cx, y: cy - r };
      case 1: return { x: cx + size/2, y: cy + r/2 };
      case 2: return { x: cx - size/2, y: cy + r/2 };
    }
  } else {
    switch (i) {
      case 0: return { x: cx, y: cy + r };
      case 1: return { x: cx - size/2, y: cy - r/2 };
      case 2: return { x: cx + size/2, y: cy - r/2 };
    }
  }
}
function triEdgeMid(cx, cy, size, i, isUp) {
  const v1 = triVertex(cx, cy, size, i, isUp);
  const v2 = triVertex(cx, cy, size, (i + 1) % 3, isUp);
  return { x: (v1.x + v2.x) / 2, y: (v1.y + v2.y) / 2 };
}
function triNeighbor(col, row, edgeIdx, isUp) {
  // For up-pointing triangle: edge 0 = right, edge 1 = bottom, edge 2 = left
  // Wait let me reconsider. Vertices 0(top), 1(BR), 2(BL). Edges are 0-1(right), 1-2(bottom), 2-0(left)
  // Neighbor across edge 0 (right) = down-pointing to right
  // Neighbor across edge 1 (bottom) = down-pointing below (same col)? No, it's the down-triangle sharing bottom edge
  // Neighbor across edge 2 (left) = down-pointing to left
  if (isUp) {
    switch (edgeIdx) {
      case 0: return { col: col + 1, row };  // right neighbor (down-tri)
      case 1: return { col, row: row + 1 };  // below (down-tri, shares bottom)
      case 2: return { col: col - 1, row };  // left neighbor (down-tri)
    }
  } else {
    // Down-pointing: vertex 0(bottom), 1(TL), 2(TR), edges 0-1(left), 1-2(top), 2-0(right)
    switch (edgeIdx) {
      case 0: return { col: col - 1, row };
      case 1: return { col, row: row - 1 };
      case 2: return { col: col + 1, row };
    }
  }
}
function triOppositeEdge(edgeIdx, thisIsUp) {
  // If up-tri edge 0 (right) borders down-tri, that neighbor's edge is 0 (left? or 2 right?)
  // Down-tri edges: 0=left, 1=top, 2=right
  // Up-tri edge 0(right) borders down-tri edge 2(right)... no wait, borders down-tri edge 0(left)
  // Actually it depends on layout. Let me use: shared edges have matching indices in this simple layout.
  // For simplicity: opposite of edge i on up-tri = edge (i+? ) on down-tri
  // Empirically: up.edge0 (right) = down.edge0 (left)? Both are on the right of the up-tri, so up's right = down's left. Yes.
  // up.edge1 (bottom) = down.edge1 (top)
  // up.edge2 (left) = down.edge2 (right)
  return edgeIdx;
}
function triPolygon(size, isUp) {
  let pts = '';
  for (let i = 0; i < 3; i++) {
    const v = triVertex(0, 0, size, i, isUp);
    pts += `${v.x.toFixed(2)},${v.y.toFixed(2)} `;
  }
  return pts.trim();
}

/* ═══════════════════════════════════════════════════════
   ARC PATTERNS
   ═══════════════════════════════════════════════════════ */
function basePairsForPattern(pat) {
  switch (pat) {
    case 'hex-corner-tight': case 'hex-corner-deep': case 'hex-star': case 'hex-floral': case 'hex-mesh': case 'hex-rings':
      return [[0,1],[2,3],[4,5]];
    case 'hex-smith':
      return [[0,3],[1,4],[2,5]]; // opposite edges connected through center
    case 'square-quarter': case 'square-quarter-small': case 'square-fan': case 'square-outlined':
      return [[0,3],[1,2]];
    case 'square-diagonal': case 'square-line-diag': case 'square-encaustic':
      return [[0,1],[2,3]];
    case 'square-cross':
      return [[0,2],[1,3]]; // straight through center
    case 'square-circuit': case 'square-pixel':
      return [[0,3],[1,2]];
    case 'hex-orbit': case 'hex-neon':
      return [[0,1],[2,3],[4,5]];
    case 'square-knot':
      return [[0,3],[1,2]]; // like quarter but with over-under styling
    case 'tri-arc':
      return [[0,1],[1,2]]; // 2 arcs on each triangle
  }
}
function worldPairs(pat, rot, rotations) {
  const base = basePairsForPattern(pat);
  return base.map(([a, b]) => [(a + rot) % rotations, (b + rot) % rotations]);
}

function renderHexArc(g, edgeA, edgeB, size, pat, isBand, subtleLoops) {
  const pA = hexEdgeMid(0, 0, size, edgeA);
  const pB = hexEdgeMid(0, 0, size, edgeB);
  const sharedVertex = (Math.min(edgeA, edgeB) + 1) % 6;
  const v = hexVertex(0, 0, size, sharedVertex);
  const path = document.createElementNS(SVG_NS, 'path');
  let bandClass = 'arc-band';
  if (subtleLoops) bandClass += ' subtle';
  path.setAttribute('class', isBand ? bandClass : 'arc');
  let d;
  if (pat === 'hex-star') {
    d = `M ${pA.x} ${pA.y} L ${v.x * 0.25} ${v.y * 0.25} L ${pB.x} ${pB.y}`;
  } else if (pat === 'hex-floral') {
    d = `M ${pA.x} ${pA.y} Q 0 0 ${pB.x} ${pB.y}`;
  } else if (pat === 'hex-corner-deep') {
    d = `M ${pA.x} ${pA.y} Q ${v.x * 0.3} ${v.y * 0.3} ${pB.x} ${pB.y}`;
  } else if (pat === 'hex-mesh') {
    // Multiple thin arcs for lattice feel
    d = `M ${pA.x} ${pA.y} Q ${v.x * 0.7} ${v.y * 0.7} ${pB.x} ${pB.y}`;
  } else if (pat === 'hex-rings') {
    // Concentric arc from vertex
    d = `M ${pA.x} ${pA.y} Q ${v.x * 0.9} ${v.y * 0.9} ${pB.x} ${pB.y}`;
  } else if (pat === 'hex-orbit') {
    d = `M ${pA.x} ${pA.y} Q ${v.x * 1.15} ${v.y * 1.15} ${pB.x} ${pB.y}`;
  } else if (pat === 'hex-smith') {
    // Opposite edges connected via center, straight through
    d = `M ${pA.x} ${pA.y} Q 0 0 ${pB.x} ${pB.y}`;
  } else {
    d = `M ${pA.x} ${pA.y} Q ${v.x * 0.55} ${v.y * 0.55} ${pB.x} ${pB.y}`;
  }
  path.setAttribute('d', d);
  if (!isBand) {
    let sw = 1.4;
    if (pat === 'hex-floral' || pat === 'hex-mesh') sw = 1.0;
    if (pat === 'hex-rings') sw = 1.6;
    if (pat === 'hex-neon') sw = 3.2;
    if (pat === 'hex-orbit') sw = 1.8;
    path.setAttribute('stroke-width', sw);
  }
  g.appendChild(path);

  // Extras for specific patterns
  if (!isBand) {
    if (pat === 'hex-mesh') {
      // Add ghost arc for lattice
      const ghost = document.createElementNS(SVG_NS, 'path');
      ghost.setAttribute('class', 'arc');
      ghost.setAttribute('d', `M ${pA.x * 0.8} ${pA.y * 0.8} Q ${v.x * 0.5} ${v.y * 0.5} ${pB.x * 0.8} ${pB.y * 0.8}`);
      ghost.setAttribute('stroke-width', 0.7);
      ghost.setAttribute('opacity', 0.5);
      g.appendChild(ghost);
    }
    if (pat === 'hex-rings') {
      // Add nested arc
      for (let k = 1; k <= 2; k++) {
        const shrink = 1 - k * 0.25;
        const nested = document.createElementNS(SVG_NS, 'path');
        nested.setAttribute('class', 'arc');
        nested.setAttribute('d', `M ${pA.x * shrink} ${pA.y * shrink} Q ${v.x * 0.9 * shrink} ${v.y * 0.9 * shrink} ${pB.x * shrink} ${pB.y * shrink}`);
        nested.setAttribute('stroke-width', 1.2);
        nested.setAttribute('opacity', 0.6 - k * 0.15);
        g.appendChild(nested);
      }
    }
  }
  return path;
}

function renderSquareArc(g, edgeA, edgeB, size, pat, isBand, subtleLoops) {
  const pA = sqEdgeMid(size, edgeA);
  const pB = sqEdgeMid(size, edgeB);
  const h = size / 2;
  const path = document.createElementNS(SVG_NS, 'path');
  let bandClass = 'arc-band';
  if (subtleLoops) bandClass += ' subtle';
  path.setAttribute('class', isBand ? bandClass : 'arc');

  if (pat === 'square-diagonal' || pat === 'square-line-diag' || pat === 'square-encaustic') {
    path.setAttribute('d', `M ${pA.x} ${pA.y} L ${pB.x} ${pB.y}`);
    path.setAttribute('stroke-width', isBand ? (subtleLoops ? 2 : 4) : (pat === 'square-encaustic' ? 2.0 : 1.6));
    g.appendChild(path);
    return path;
  }
  if (pat === 'square-circuit' || pat === 'square-pixel') {
    const pts = pat === 'square-circuit'
      ? [pA, { x: pA.x * 0.4, y: pA.y * 0.4 }, { x: pB.x * 0.4, y: pB.y * 0.4 }, pB]
      : [pA, { x: pA.x * 0.5, y: pA.y * 0.5 }, { x: (pA.x + pB.x) * 0.5, y: (pA.y + pB.y) * 0.5 }, { x: pB.x * 0.5, y: pB.y * 0.5 }, pB];
    path.setAttribute('d', 'M ' + pts.map(p => `${p.x} ${p.y}`).join(' L '));
    path.setAttribute('stroke-width', isBand ? 5 : (pat === 'square-pixel' ? 3 : 2));
    if (pat === 'square-pixel') path.style.strokeLinejoin = 'miter';
    g.appendChild(path);
    if (!isBand && pat === 'square-circuit') {
      [pts[1], pts[2]].forEach(q => {
        const pad = document.createElementNS(SVG_NS, 'circle');
        pad.setAttribute('cx', q.x); pad.setAttribute('cy', q.y); pad.setAttribute('r', size * 0.045);
        pad.setAttribute('class', 'deco'); pad.setAttribute('fill', 'var(--accent)');
        g.appendChild(pad);
      });
    }
    return path;
  }
  if (pat === 'square-cross') {
    // Straight through center: pA -- 0,0 -- pB
    path.setAttribute('d', `M ${pA.x} ${pA.y} L 0 0 L ${pB.x} ${pB.y}`);
    path.setAttribute('stroke-width', isBand ? 4 : 1.8);
    g.appendChild(path);
    return path;
  }

  // Quarter-arc based
  let cornerX, cornerY;
  if ((edgeA === 0 && edgeB === 3) || (edgeA === 3 && edgeB === 0)) { cornerX = -h; cornerY = -h; }
  else { cornerX = h; cornerY = h; }
  const r = h;

  if (pat === 'square-quarter-small') {
    const fade = 0.55;
    const fA = { x: pA.x + (cornerX - pA.x) * (1 - fade), y: pA.y + (cornerY - pA.y) * (1 - fade) };
    const fB = { x: pB.x + (cornerX - pB.x) * (1 - fade), y: pB.y + (cornerY - pB.y) * (1 - fade) };
    path.setAttribute('d', `M ${fA.x} ${fA.y} A ${r * fade} ${r * fade} 0 0 1 ${fB.x} ${fB.y}`);
    path.setAttribute('stroke-width', isBand ? 4 : 1.5);
    g.appendChild(path);
    return path;
  }
  if (pat === 'square-knot') {
    // Draw the arc with over-under styling
    path.setAttribute('d', `M ${pA.x} ${pA.y} A ${r} ${r} 0 0 1 ${pB.x} ${pB.y}`);
    path.setAttribute('stroke-width', isBand ? 5 : 3.5);
    g.appendChild(path);
    if (!isBand) {
      // Under-crossing marker: bg-colored gap in the middle
      // (Approximate by adding a thin bg-colored line on top at midpoint)
      const midT = 0.5;
      // Just draw thinner ink line inside for a ribbon look
      const inner = document.createElementNS(SVG_NS, 'path');
      inner.setAttribute('class', 'arc');
      inner.setAttribute('d', `M ${pA.x} ${pA.y} A ${r} ${r} 0 0 1 ${pB.x} ${pB.y}`);
      inner.setAttribute('stroke-width', 1.2);
      inner.setAttribute('opacity', 0.9);
      inner.style.stroke = 'var(--bg)';
      g.appendChild(inner);
    }
    return path;
  }
  if (pat === 'square-outlined') {
    // Bold outlined arc
    path.setAttribute('d', `M ${pA.x} ${pA.y} A ${r} ${r} 0 0 1 ${pB.x} ${pB.y}`);
    path.setAttribute('stroke-width', isBand ? 5 : 2.4);
    g.appendChild(path);
    return path;
  }

  path.setAttribute('d', `M ${pA.x} ${pA.y} A ${r} ${r} 0 0 1 ${pB.x} ${pB.y}`);
  path.setAttribute('stroke-width', isBand ? 5 : (pat === 'square-fan' ? 1.2 : 1.8));
  g.appendChild(path);
  if (pat === 'square-fan' && !isBand) {
    for (let k = 1; k <= 2; k++) {
      const shrink = 1 - k * 0.28;
      const sA = { x: cornerX + (pA.x - cornerX) * shrink, y: cornerY + (pA.y - cornerY) * shrink };
      const sB = { x: cornerX + (pB.x - cornerX) * shrink, y: cornerY + (pB.y - cornerY) * shrink };
      const nested = document.createElementNS(SVG_NS, 'path');
      nested.setAttribute('class', 'arc');
      nested.setAttribute('d', `M ${sA.x} ${sA.y} A ${r * shrink} ${r * shrink} 0 0 1 ${sB.x} ${sB.y}`);
      nested.setAttribute('stroke-width', 1.0);
      nested.setAttribute('opacity', 0.5 - k * 0.1);
      g.appendChild(nested);
    }
  }
  return path;
}

function renderTriArc(g, edgeA, edgeB, size, pat, isBand, isUp) {
  const pA = triEdgeMid(0, 0, size, edgeA, isUp);
  const pB = triEdgeMid(0, 0, size, edgeB, isUp);
  const sharedVertex = (Math.min(edgeA, edgeB) + 1) % 3;
  const v = triVertex(0, 0, size, sharedVertex, isUp);
  const path = document.createElementNS(SVG_NS, 'path');
  path.setAttribute('class', isBand ? 'arc-band' : 'arc');
  const d = `M ${pA.x} ${pA.y} Q ${v.x * 0.5} ${v.y * 0.5} ${pB.x} ${pB.y}`;
  path.setAttribute('d', d);
  if (!isBand) path.setAttribute('stroke-width', 1.4);
  g.appendChild(path);
  return path;
}

/* ═══════════════════════════════════════════════════════
   COLOR ASSIGNMENT
   ═══════════════════════════════════════════════════════ */
function tileColorIndex(col, row, numColors, gridType) {
  if (gridType === 'triangle' && numColors === 3) return ((col + row) % 3 + 3) % 3;
  if (gridType === 'hex' && numColors === 3) return ((col + 2 * row) % 3 + 3) % 3;
  if (numColors === 2) return ((col + row) % 2 + 2) % 2;
  if (gridType === 'hex' && numColors === 6) return ((col + 2 * row) % 6 + 6) % 6;
  return 0;
}
function tileColor(style, col, row) {
  const idx = tileColorIndex(col, row, style.colors, style.gridType);
  return style.palette[`c${idx + 1}`];
}
