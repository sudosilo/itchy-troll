<!DOCTYPE html>
<!--
=========================================================================
FIELD STUDY
Single file study tool for general workplace safety training.

CONTENT SCOPE
  General safety only: lockout/tagout, arc flash and electrical safety,
  machine guarding, hand tools, ladders. Sourced from standard safety
  curriculum concepts (NFPA 70E and general industry practice).
  No employer name, internal system, role title, workflow, or proprietary
  procedure appears anywhere in this file. An earlier build carried a
  field service operations module; it was removed in full because it
  described internal systems rather than general safety, and nothing
  from it remains. Keep it that way when adding sets.

ARCHITECTURE  (RED PHONE)
  Everything is driven by the MODULES registry near the top of the
  script. Adding a study set is one object pushed onto that array and
  requires no other change. Seven set types exist:

    cards     flashcards plus a multiple choice quiz
              { q, options[], answer (index into options), note }
              Any option count works, so a two option true/false item
              can sit in the same set as four option questions.
    sort      many items into a few named buckets
              categories[{id,name}] + items[{t, cat}]
    match     one to one pairing, pairs[{a,b}]
    multi     select all that apply, { q, options[], correct[], note }
    order     sequencing, steps[] stored in correct order
    tf        true or false rows, statements[{t, a:bool, note}]
    scenario  panels[] read in turn, then questions[{q,options,answer,note}]

  Modes: Career is the gated, scored run. Flashcards opens every set and
  converts it through toCards() into front/back cards with no scoring.
  The chosen mode persists with progress.

  Skin: comic style. Ink (#1B1B1B) is used for borders and hard offset
  shadows only, never as a background.

  Gating: sets unlock in registry order at PASS (80%). Progress and the
  unlock-all toggle persist through the Store wrapper, which tries the
  artifact storage bridge, then browser storage, then memory, so the same
  file works in preview and on a deploy.

  Conventions held throughout: light backgrounds only, never near black.
  No function name may be shadowed by a local variable (a rename of the
  home screen entry point to openModule fixed a crash caused by a local
  named open). Verify with headless Node before delivery.

DOCUMENTATION CONTRIBUTION  (BLUE PHONE)
  Blue Phone supplied the Mohave Technology Group creator seal block
  (mtg-seal-demo.html), a self contained drop-in that writes maker
  identity into the page head and renders an expandable footer seal.
  Not installed here yet; it is a one block paste before </body> if
  this tool is ever published under the MTG name.
=========================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF1B8">
<title>Field Study</title>
<style>
/* RED PHONE: shared tokens. Light backgrounds only, never near black. */
:root{
  --bg:#E4E7E1;
  --surface:#FFFFFF;
  --surface-2:#F3F5F1;
  --ink:#1F2724;
  --ink-soft:#5C6661;
  --rule:#C7CDC5;
  --accent:#2F6F4E;
  --accent-soft:#DCEBE1;
  --amber:#B45B14;
  --amber-soft:#F7E6D6;
  --pick:#1F4E79;
  --pick-soft:#DCE7F2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.42;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 110px}

/* RED PHONE: header, doubles as the back control inside a module */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:34px}
.back{
  font:inherit;font-size:14px;font-weight:600;border:1px solid var(--rule);background:var(--surface);
  color:var(--ink);border-radius:9px;padding:8px 11px;cursor:pointer;flex:0 0 auto
}
.top-title{font-size:18px;font-weight:700;letter-spacing:-0.01em;margin:0;flex:1 1 auto;min-width:0}
.top-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);flex:0 0 auto}
.lede{margin:0 0 14px;font-size:15px;color:var(--ink-soft)}

.bar{height:5px;background:var(--surface-2);border:1px solid var(--rule);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .22s ease}

/* RED PHONE: home list */
.tile{
  display:block;width:100%;text-align:left;font:inherit;background:var(--surface);
  border:1px solid var(--rule);border-radius:14px;padding:16px 15px;margin-bottom:11px;
  color:var(--ink);cursor:pointer;box-shadow:0 1px 2px rgba(31,39,36,.07)
}
.tile .kind{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);font-weight:700}
.tile h2{margin:7px 0 3px;font-size:18px;font-weight:700;letter-spacing:-0.01em}
.tile p{margin:0;font-size:14px;color:var(--ink-soft)}
.tile .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tile .badge{
  flex:0 0 28px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-soft)
}
.tile.done{border-color:var(--accent);background:var(--accent-soft)}
.tile.done .badge{background:var(--accent);border-color:var(--accent);color:#fff}
.tile.done .kind{color:var(--accent)}
.tile.locked{opacity:.6;cursor:not-allowed;box-shadow:none}
.tile.locked .kind{color:var(--ink-soft)}
.gate{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-top:8px;display:block}
.reset-link{display:block;width:100%;text-align:center;font:inherit;font-size:13px;color:var(--ink-soft);background:none;border:0;padding:14px 0 0;cursor:pointer;text-decoration:underline}
.toggle{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;text-align:left;
  font:inherit;background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;
  padding:12px 14px;margin-bottom:14px;color:var(--ink);cursor:pointer
}
.toggle strong{display:block;font-size:15px}
.toggle .sub{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px}
.toggle .switch{
  flex:0 0 auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;font-weight:700;padding:7px 12px;border-radius:99px;
  background:var(--surface);border:1px solid var(--rule);color:var(--ink-soft)
}
.toggle.on{background:var(--pick-soft);border-color:var(--pick)}
.toggle.on .switch{background:var(--pick);border-color:var(--pick);color:#fff}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;padding:5px;margin-bottom:16px}
.modes button{font:inherit;font-size:15px;font-weight:600;padding:11px 8px;border:0;border-radius:8px;background:transparent;color:var(--ink-soft);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(31,39,36,.14)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:20px 16px;box-shadow:0 1px 2px rgba(31,39,36,.08)}
.tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px}

.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.flash .q{font-size:20px;font-weight:600;line-height:1.35;margin:0}
.flash .a{margin:14px 0 0;font-size:19px;font-weight:600;color:var(--accent)}
.a-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 0;border-top:1px solid var(--rule);padding-top:14px}
.hint{text-align:center;font-size:13px;color:var(--ink-soft);margin:12px 0 0}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button.btn{font:inherit;font-size:16px;font-weight:600;padding:14px 12px;border-radius:11px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;min-height:50px}
button.btn:active{transform:translateY(1px)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn:disabled{opacity:.4;cursor:default}
.btn-wide{width:100%;margin-top:10px}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:16px;line-height:1.35;padding:13px;border-radius:11px;border:1px solid var(--rule);background:var(--surface-2);color:var(--ink);cursor:pointer}
.opt .k{flex:0 0 24px;height:24px;border-radius:6px;background:var(--surface);border:1px solid var(--rule);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.opt.right{background:var(--accent-soft);border-color:var(--accent)}
.opt.right .k{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.wrong{background:var(--amber-soft);border-color:var(--amber)}
.opt.wrong .k{background:var(--amber);border-color:var(--amber);color:#fff}
.opt.chosen{background:var(--pick-soft);border-color:var(--pick)}
.opt.chosen .k{background:var(--pick);border-color:var(--pick);color:#fff}
.opt.missed{background:var(--surface);border-style:dashed}
.opt .mark{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-top:5px}
.opt:disabled{cursor:default}
.verdict{margin-top:14px;font-size:15px;font-weight:600}
.verdict.ok{color:var(--accent)}
.verdict.no{color:var(--amber)}
.score{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.06em;color:var(--ink-soft);text-align:center;margin-top:16px}

.big{font-size:48px;font-weight:700;letter-spacing:-0.03em;margin:6px 0 0;color:var(--accent)}
.big.low{color:var(--amber)}
.miss{border-top:1px solid var(--rule);padding-top:14px;margin-top:14px}
.miss h3{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px}
.miss-item{margin-bottom:14px}
.miss-item p{margin:0 0 4px;font-size:15px;font-weight:600}
.miss-item span{font-size:15px;color:var(--accent)}

/* RED PHONE: sorting drill pieces */
.tray{background:var(--surface-2);border:1px solid var(--rule);border-radius:14px;padding:12px;margin-bottom:16px}
.tray-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px}
.tray-empty,.bin-empty{font-size:14px;color:var(--ink-soft);padding:4px 2px}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:15px;line-height:1.35;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px;margin-bottom:8px;color:var(--ink);cursor:pointer;min-height:46px}
.chip:last-child{margin-bottom:0}
.chip.picked{background:var(--pick-soft);border-color:var(--pick);box-shadow:0 0 0 2px var(--pick-soft)}
.chip.right{background:var(--accent-soft);border-color:var(--accent)}
.chip.wrong{background:var(--amber-soft);border-color:var(--amber)}
.chip .mark{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-top:6px}
.chip .sub{display:block;margin-top:5px;font-size:14px;color:var(--ink-soft)}
.chip.picked .sub{color:var(--pick)}
.chip:disabled{opacity:.45;cursor:default}
.chip.right .mark{color:var(--accent)}
.chip.wrong .mark{color:var(--amber)}
.bin{background:var(--surface);border:1px solid var(--rule);border-radius:14px;margin-bottom:12px;overflow:hidden}
.bin-head{width:100%;text-align:left;font:inherit;font-size:16px;font-weight:700;background:var(--pick);color:#fff;border:0;padding:13px 14px;cursor:default;display:flex;justify-content:space-between;gap:10px;align-items:center}
.bin.open .bin-head{cursor:pointer;background:var(--accent)}
.bin-head .cue{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.87;font-weight:600}
.bin-body{padding:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.result{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 14px;margin-top:16px;text-align:center}

/* RED PHONE: true or false rows */
.tfrow{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:13px 13px 12px;margin-bottom:10px}
.tfrow.right{background:var(--accent-soft);border-color:var(--accent)}
.tfrow.wrong{background:var(--amber-soft);border-color:var(--amber)}
.tftext{margin:0 0 11px;font-size:16px;line-height:1.35}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tfb{
  font:inherit;font-size:15px;font-weight:600;padding:11px 8px;min-height:44px;
  border:1px solid var(--rule);background:var(--surface-2);color:var(--ink-soft);border-radius:9px;cursor:pointer
}
.tfb.on{background:var(--pick);border-color:var(--pick);color:#fff}
.tfb:disabled{cursor:default}
.tfrow.right .tfb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tfrow.wrong .tfb.on{background:var(--amber);border-color:var(--amber);color:#fff}
.tfnote{margin:10px 0 0;font-size:14px;color:var(--ink-soft);line-height:1.4}

.foot{text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:26px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* RED PHONE: comic skin */
:root{
  --bg:#FFF1B8; --surface:#FFFFFF; --surface-2:#FFF9E3;
  --ink:#1B1B1B; --ink-soft:#4A4A4A; --rule:#1B1B1B;
  --accent:#00A86B; --accent-soft:#C9F7DE;
  --amber:#FF5A36; --amber-soft:#FFD8CC;
  --pick:#7B3FE4; --pick-soft:#E8DCFF;
  --pop:#FF3E9A; --zap:#FFD23F; --sky:#3EC8FF;
}
body{
  background-color:var(--bg);
  background-image:radial-gradient(rgba(255,62,154,.16) 1.6px, transparent 1.8px);
  background-size:14px 14px;
}
.top-title,.tile h2,.big,.title,.bin-head,.modes button,.btn,.back{
  font-family:"Arial Black","Impact","Helvetica Neue",Arial,sans-serif;
  letter-spacing:.02em;
}
.top-title{text-transform:uppercase;text-shadow:3px 3px 0 var(--pop)}
.tile,.card,.tray,.bin,.result,.tfrow,.toggle,.opt,.chip,.btn,.tfb,.modes,.back,.tile .badge{
  border:3px solid var(--ink) !important;
  border-radius:8px !important;
  box-shadow:5px 5px 0 var(--ink) !important;
}
.chip,.opt,.tfb{box-shadow:3px 3px 0 var(--ink) !important}
.bar{border:3px solid var(--ink) !important;height:12px;border-radius:99px}
.bar span{background:repeating-linear-gradient(45deg,var(--pop) 0 8px,var(--zap) 8px 16px)}
.tile{transition:transform .08s ease}
.tile:nth-child(odd){transform:rotate(-.6deg)}
.tile:nth-child(even){transform:rotate(.5deg)}
.tile:active,.btn:active,.chip:active,.opt:active,.tfb:active{transform:translate(3px,3px) !important;box-shadow:2px 2px 0 var(--ink) !important}
.tile .kind{color:var(--pop)}
.tile .badge{background:var(--zap);color:var(--ink)}
.tile.done{background:var(--accent-soft)}
.tile.done .badge{background:var(--accent);color:#fff}
.bin-head{background:var(--pick);border-bottom:3px solid var(--ink)}
.bin.open .bin-head{background:var(--pop)}
.btn.primary{background:var(--zap);color:var(--ink)}
.btn.primary:disabled{background:var(--surface-2)}
.modes{background:var(--sky)}
.modes button[aria-pressed="true"]{background:var(--zap);color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.modes button{color:var(--ink)}
.card.flash{background:var(--surface)}
.flash .a{color:var(--pick)}
.big{text-shadow:3px 3px 0 var(--ink)}
.tag,.a-label{color:var(--pop);font-weight:700}
.ctx{font-size:14px;color:var(--ink-soft);margin:0 0 12px;padding:10px;background:var(--surface-2);border:2px dashed var(--ink);border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="topbar"></div>
  <div class="bar" id="barWrap"><span id="bar"></span></div>
  <div id="stage"></div>
  <p class="foot">Field Study &middot; Service Training</p>
</div>

<script>
/* =======================================================================
   RED PHONE: MODULE REGISTRY
   Add a new study set by pushing one object onto MODULES.
   type "cards": flashcards plus a 4 option quiz. Each card needs
     q, options (4), answer (0-3 index), note.
   type "sort": tap to categorize drill. categories need id and name,
     items need t and cat matching a category id.
   ======================================================================= */
var MODULES = [
  {
    id: "loto",
    type: "sort",
    title: "Lockout / Tagout Roles",
    blurb: "Sort each statement into Authorized, Affected, or Other Employees.",
    lede: "Tap an item, then tap the category it belongs to. Tap a placed item to send it back.",
    categories: [
      { id:"auth", name:"Authorized Employees" },
      { id:"aff", name:"Affected Employees" },
      { id:"other", name:"Other Employees" }
    ],
    items: [
      { t:"Trained by employer on how to perform lockout/tagout.", cat:"auth" },
      { t:"Are the only employees who can participate in lockout/tagout.", cat:"auth" },
      { t:"Can safely perform repairs because of lockout/tagout.", cat:"auth" },
      { t:"Apply and remove the locks and tags on the equipment.", cat:"auth" },
      { t:"May be asked to shut down a machine they operate.", cat:"aff" },
      { t:"Work in an area where lockout takes place, but do not participate in the procedure.", cat:"aff" },
      { t:"Operate the equipment that is being locked out.", cat:"aff" },
      { t:"Include visitors and contractors.", cat:"other" },
      { t:"Do not work in the area where lockout takes place, but may pass through.", cat:"other" },
      { t:"Need to know not to touch or restart locked out equipment.", cat:"other" }
    ]
  },
  {
    id: "energy",
    type: "match",
    title: "Energy Sources",
    blurb: "Match each energy source to how it is produced or stored.",
    lede: "Tap a source, then tap its description. Tap a matched pair to break it apart.",
    leftLabel: "Energy sources",
    rightLabel: "Descriptions",
    pairs: [
      { a:"Radiant Energy", b:"Sources include X-rays, microwaves, and ultraviolet light." },
      { a:"Electrical Energy", b:"May be stored in a battery or capacitor." },
      { a:"Gravitational Energy", b:"Created when objects fall." },
      { a:"Mechanical Energy", b:"Typically created by an object's motion, position, or both." },
      { a:"Chemical Energy", b:"Released during a chemical reaction." },
      { a:"Thermal Energy", b:"Generated by high heat." },
      { a:"Hydraulic / Pneumatic Energy", b:"Source is pressurized liquid or air." }
    ]
  },
  {
    id: "responsibilities",
    type: "multi",
    title: "Lockout Responsibilities",
    blurb: "Select all that apply. Every correct answer has to be picked and nothing else.",
    lede: "Tap every answer that applies, then check.",
    questions: [
      {
        q: "Which of the following accurately describes a responsibility affected workers have during a lockout/tagout procedure?",
        options: [
          "Stay out of the area during the lockout/tagout.",
          "Do not remove locks or tags from equipment.",
          "Help out with lockout/tagout procedures whenever possible.",
          "Return to the lockout area regularly to check progress.",
          "Do not attempt to operate locked/tagged equipment."
        ],
        correct: [0,1,4],
        note: "Affected workers stay clear and hands off. Participating in the procedure or checking on progress belongs to authorized employees."
      },
      {
        q: "Which of the following describe authorized employees?",
        options: [
          "Trained by the employer on how to perform lockout/tagout.",
          "Apply and remove the locks and tags on the equipment.",
          "Are the only employees who may participate in lockout/tagout.",
          "Include visitors and contractors.",
          "Pass through the area but do not work there."
        ],
        correct: [0,1,2],
        note: "Visitors, contractors, and pass through traffic fall under Other Employees."
      },
      {
        q: "Which energy sources have to be controlled before equipment is serviced?",
        options: [
          "Electrical energy stored in a battery or capacitor.",
          "Hydraulic or pneumatic pressure.",
          "Gravitational energy from a suspended or raised load.",
          "Thermal energy from high heat.",
          "Ambient light in the room."
        ],
        correct: [0,1,2,3],
        note: "Stored and residual energy counts. Room lighting is not a hazardous energy source."
      }
    ]
  },
  {
    id: "steps",
    type: "order",
    title: "Basic Lockout / Tagout Steps",
    blurb: "Put the five steps of a lockout in the order they are performed.",
    lede: "Tap a step to drop it into the next open slot. Tap a placed step to pull it back out.",
    poolLabel: "Steps",
    steps: [
      "Inform Others",
      "De-energize Machine",
      "Apply Locks/Tags",
      "Release Stored Energy",
      "Confirm De-energized"
    ],
    note: "Notify everyone affected, shut the machine down, lock and tag it, bleed off anything still stored, then verify it is dead before you touch it."
  },
  {
    id: "practices",
    type: "sort",
    title: "Safe Work Practices",
    blurb: "Decide whether each practice around locked out equipment is safe or unsafe.",
    lede: "Tap a practice, then tap Safe or Unsafe. Tap a placed item to send it back.",
    categories: [
      { id:"safe", name:"Safe" },
      { id:"unsafe", name:"Unsafe" }
    ],
    items: [
      { t:"An authorized worker must perform a lockout before reaching into a machine to unjam it.", cat:"safe" },
      { t:"Do not attempt to operate equipment that is locked or tagged out.", cat:"safe" },
      { t:"If you see a tag on the floor, take it to your facility's lost and found.", cat:"unsafe" },
      { t:"When in doubt, do not power up a machine until you have checked its status with your supervisor.", cat:"safe" },
      { t:"Be aware that a contractor's locks may look different from internal locks.", cat:"safe" },
      { t:"If a machine's controls are in the off position you can safely bypass its guards.", cat:"unsafe" },
      { t:"Notify your supervisor if you notice a tag left on equipment that is running.", cat:"safe" }
    ]

var KEYS = ["A","B","C","D"];

var topbar = document.getElementById("topbar");
var bar = document.getElementById("bar");
var barWrap = document.getElementById("barWrap");

var app = { view:"home", mod:null };

var s = {};   /* sort module state */

/* RED PHONE: progress store.
   Tries the artifact storage bridge, then browser storage, then memory,
   so the same file works in preview and on a real deploy. */
var PASS = 80;
var memState = { progress:[], unlockAll:false, mode:"career" };
var progress = [];
var unlockAll = false;
var studyMode = "career";

function normalize(v){
  if (!v) return { progress:[], unlockAll:false };
  if (Object.prototype.toString.call(v) === "[object Array]") return { progress:v, unlockAll:false };
  return { progress: v.progress || [], unlockAll: !!v.unlockAll, mode: v.mode === "flash" ? "flash" : "career" };
}

var Store = {
  load: function(cb){
    try {
      if (window.storage && window.storage.get){
        window.storage.get("progress").then(function(r){
          cb(normalize(r && r.value ? JSON.parse(r.value) : null));
        }).catch(function(){ cb(Store.localLoad()); });
        return;
      }
    } catch(e){}
    cb(Store.localLoad());
  },
  localLoad: function(){
    try {
      var v = window.localStorage.getItem("fieldstudy.progress");
      if (v) return normalize(JSON.parse(v));
    } catch(e){}
    return normalize(memState);
  },
  save: function(){
    var payload = { progress: progress.slice(), unlockAll: unlockAll, mode: studyMode };
    memState = payload;
    try {
      if (window.storage && window.storage.set){
        window.storage.set("progress", JSON.stringify(payload)).catch(function(){});
        return;
      }
    } catch(e){}
    try { window.localStorage.setItem("fieldstudy.progress", JSON.stringify(payload)); } catch(e){}
  }
};

function isDone(id){ return progress.indexOf(id) !== -1; }
function isUnlocked(i){ return unlockAll || i === 0 || isDone(MODULES[i-1].id); }
function modIndex(id){ for (var i=0;i<MODULES.length;i++) if (MODULES[i].id === id) return i; return -1; }

/* RED PHONE: called from every results screen. Marks the set done at
   the pass mark and hands back the next set if one just unlocked. */
function completeIfPassed(pct){
  if (pct < PASS) return null;
  if (!isDone(app.mod.id)){
    progress.push(app.mod.id);
    Store.save();
  }
  var n = modIndex(app.mod.id) + 1;
  return n < MODULES.length ? MODULES[n] : null;
}

function nextButton(nextMod){
  if (!nextMod) return '';
  return '<button class="btn primary btn-wide" id="goNext">Next set: ' + esc(nextMod.title) + '</button>';
}
function wireNext(nextMod){
  if (!nextMod) return;
  var b = document.getElementById("goNext");
  if (b) b.onclick = function(){ openModule(nextMod.id); };
}

function esc(v){ return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function seq(n){ var a=[]; for(var i=0;i<n;i++) a.push(i); return a; }
function setBar(pct){ bar.style.width = pct + "%"; }

/* RED PHONE: home */
function goHome(){
  app.view = "home"; app.mod = null;
  barWrap.style.display = "none";
  var flashMode = studyMode === "flash";
  topbar.innerHTML = '<h1 class="top-title">Field Study</h1>' +
                  '<span class="top-meta">' + (flashMode ? MODULES.length + ' decks' : progress.length + ' / ' + MODULES.length + ' done') + '</span>';
  var h = '<div class="modes" id="modeSw">' +
            '<button data-m="career" aria-pressed="' + !flashMode + '">Career</button>' +
            '<button data-m="flash" aria-pressed="' + flashMode + '">Flashcards</button>' +
          '</div>';
  if (!flashMode) h += '<button class="toggle' + (unlockAll ? " on" : "") + '" id="unlock" aria-pressed="' + unlockAll + '">' +
            '<span><strong>Unlock all sets</strong>' +
              '<span class="sub">' + (unlockAll ? "Open. Every set is reachable for testing." : "Locked. Sets open in order as you pass them.") + '</span>' +
            '</span><span class="switch">' + (unlockAll ? "On" : "Off") + '</span>' +
          '</button>';
  else h += '<p class="lede">Every deck is open. Tap one to flip through it, no scoring and no locks.</p>';
  for (var i=0;i<MODULES.length;i++){
    var m = MODULES[i];
    var kind, count;
    if (m.type === "cards"){ kind = "Flashcards and quiz"; count = m.cards.length + " questions"; }
    else if (m.type === "sort"){ kind = "Sorting drill"; count = m.items.length + " items"; }
    else if (m.type === "multi"){ kind = "Select all that apply"; count = m.questions.length + " questions"; }
    else if (m.type === "order"){ kind = "Sequencing drill"; count = m.steps.length + " steps"; }
    else if (m.type === "scenario"){ kind = "Scenario"; count = m.panels.length + " panels, " + m.questions.length + (m.questions.length === 1 ? " question" : " questions"); }
    else if (m.type === "tf"){ kind = "True or false"; count = m.statements.length + " statements"; }
    else { kind = "Matching drill"; count = m.pairs.length + " pairs"; }

    var done = isDone(m.id), unlocked = flashMode || isUnlocked(i);
    var gated = !flashMode && i > 0 && !isDone(MODULES[i-1].id);
    var cls = "tile" + (done ? " done" : "") + (unlocked ? "" : " locked");
    var badge = flashMode ? String(toCards(m).length) : (done ? "&#10003;" : (unlocked ? String(i+1) : "&#128274;"));

    h += '<button class="' + cls + '"' + (unlocked ? ' data-mod="' + m.id + '"' : ' disabled') + '>' +
           '<div class="head"><div>' +
             '<span class="kind">' + kind + ' &middot; ' + count + '</span>' +
             '<h2>' + esc(m.title) + '</h2>' +
             '<p>' + esc(m.blurb) + '</p>' +
             (gated && !unlocked ? '<span class="gate">Finish ' + esc(MODULES[i-1].title) + ' to unlock</span>' : '') +
             (gated && unlocked ? '<span class="gate">Open by toggle</span>' : '') +
             (done && !flashMode ? '<span class="gate">Passed</span>' : '') +
           '</div><span class="badge">' + badge + '</span></div>' +
         '</button>';
  }
  if (!flashMode) h += '<button class="reset-link" id="wipe">Clear progress</button>';
  stage.innerHTML = h;

  var tiles = stage.querySelectorAll("[data-mod]");
  for (var t=0;t<tiles.length;t++){
    tiles[t].onclick = function(){
      var id = this.getAttribute("data-mod");
      if (studyMode === "flash") openFlash(id); else openModule(id);
    };
  }
  var sw = stage.querySelectorAll("[data-m]");
  for (var w=0;w<sw.length;w++){
    sw[w].onclick = function(){ studyMode = this.getAttribute("data-m"); Store.save(); goHome(); };
  }
  if (flashMode) return;
  document.getElementById("unlock").onclick = function(){
    unlockAll = !unlockAll;
    Store.save();
    goHome();
  };
  document.getElementById("wipe").onclick = function(){
    progress = [];
    Store.save();
    goHome();
  };
}

function openModule(id){
  for (var i=0;i<MODULES.length;i++) if (MODULES[i].id === id) app.mod = MODULES[i];
  app.view = app.mod.type;
  barWrap.style.display = "";
  if (app.mod.type === "cards") resetCards("flash");
  else if (app.mod.type === "sort") resetSort();
  else if (app.mod.type === "multi") resetMulti();
  else if (app.mod.type === "order") resetOrder();
  else if (app.mod.type === "scenario") resetScenario();
  else if (app.mod.type === "tf") resetTF();
  else resetMatch();
}

function header(metaText){
  topbar.innerHTML = '<button class="back" id="back">Sets</button>' +
                  '<h1 class="top-title">' + esc(app.mod.title) + '</h1>' +
                  '<span class="top-meta">' + metaText + '</span>';
  document.getElementById("back").onclick = goHome;
}

function resetCards(mode){
  var d = app.mod.cards;
  q = { mode:mode, i:0, flipped:false, picked:null, right:0, missed:[], done:false,
        order:shuffle(seq(d.length)) };
  q.optOrder = shuffle(seq(d[q.order[0]].options.length));
  renderCards();
}
function curCard(){ return app.mod.cards[q.order[q.i]]; }

function renderCards(){
  var total = app.mod.cards.length;
  header(q.mode === "flash" ? "Flashcards" : "Quiz");
  setBar(q.done ? 100 : (q.i/total)*100);

  var modes =
    '<div class="modes">' +
      '<button id="mFlash" aria-pressed="' + (q.mode==="flash") + '">Flashcards</button>' +
      '<button id="mQuiz" aria-pressed="' + (q.mode==="quiz") + '">Quiz</button>' +
    '</div>';

  stage.innerHTML = modes + '<div id="inner"></div>';
  document.getElementById("mFlash").onclick = function(){ resetCards("flash"); };
  document.getElementById("mQuiz").onclick = function(){ resetCards("quiz"); };

  if (q.mode === "flash") renderFlash(); else renderQuiz();
}

function renderFlash(){
  var c = curCard(), total = app.mod.cards.length;
  var face = q.flipped
    ? '<p class="q">' + esc(c.q) + '</p><p class="a-label">Answer</p><p class="a">' + esc(c.options[c.answer]) +
      '</p><p class="hint" style="text-align:left;margin-top:10px">' + esc(c.note) + '</p>'
    : '<p class="q">' + esc(c.q) + '</p>';

  document.getElementById("inner").innerHTML =
    '<div class="card flash" id="flashCard" role="button" tabindex="0">' +
      '<div class="tag">Card ' + (q.i+1) + ' of ' + total + '</div>' + face +
    '</div>' +
    '<p class="hint">' + (q.flipped ? "Tap the card to hide the answer" : "Tap the card to reveal the answer") + '</p>' +
    '<div class="row">' +
      '<button class="btn" id="prev"' + (q.i===0?" disabled":"") + '>Back</button>' +
      '<button class="btn primary" id="next">' + (q.i===total-1 ? "Shuffle again" : "Next") + '</button>' +
    '</div>' +
    '<button class="btn btn-wide" id="shuf">Shuffle deck</button>';

  var fc = document.getElementById("flashCard");
  fc.onclick = function(){ q.flipped = !q.flipped; renderCards(); };
  fc.onkeydown = function(e){ if (e.key===" "||e.key==="Enter"){ e.preventDefault(); q.flipped=!q.flipped; renderCards(); } };
  document.getElementById("prev").onclick = function(){ if(q.i>0){ q.i--; q.flipped=false; renderCards(); } };
  document.getElementById("next").onclick = function(){
    if (q.i === total-1){ resetCards("flash"); return; }
    q.i++; q.flipped=false; renderCards();
  };
  document.getElementById("shuf").onclick = function(){ resetCards("flash"); };
}

function renderQuiz(){
  if (q.done) return renderCardResults();
  var c = curCard(), total = app.mod.cards.length;
  var h = '<div class="card"><div class="tag">Question ' + (q.i+1) + ' of ' + total + '</div>' +
          '<p style="font-size:19px;font-weight:600;margin:0;line-height:1.35">' + esc(c.q) + '</p><div class="opts">';

  for (var n=0;n<q.optOrder.length;n++){
    var idx = q.optOrder[n], cls = "opt";
    if (q.picked !== null){
      if (idx === c.answer) cls += " right";
      else if (idx === q.picked) cls += " wrong";
    }
    h += '<button class="' + cls + '" data-i="' + idx + '"' + (q.picked!==null?" disabled":"") + '>' +
           '<span class="k">' + KEYS[n] + '</span><span>' + esc(c.options[idx]) + '</span></button>';
  }
  h += '</div>';

  if (q.picked !== null){
    var ok = q.picked === c.answer;
    h += '<p class="verdict ' + (ok?"ok":"no") + '">' + (ok?"Correct.":"Not quite.") + ' ' + esc(c.note) + '</p>';
  }
  h += '</div>';
  if (q.picked !== null){
    h += '<button class="btn primary btn-wide" id="adv">' + (q.i===total-1?"See results":"Next question") + '</button>';
  }
  h += '<p class="score">' + q.right + ' correct of ' + (q.picked!==null ? q.i+1 : q.i) + ' answered</p>';

  var inner = document.getElementById("inner");
  inner.innerHTML = h;

  var opts = inner.querySelectorAll(".opt");
  for (var b=0;b<opts.length;b++){
    opts[b].onclick = function(){
      if (q.picked !== null) return;
      q.picked = parseInt(this.getAttribute("data-i"),10);
      var cc = curCard();
      if (q.picked === cc.answer) q.right++; else q.missed.push(q.order[q.i]);
      renderCards();
    };
  }
  var adv = document.getElementById("adv");
  if (adv) adv.onclick = function(){
    if (q.i === total-1){ q.done = true; renderCards(); return; }
    q.i++; q.picked = null; q.optOrder = shuffle(seq(curCard().options.length)); renderCards();
  };
}

function renderCardResults(){
  var total = app.mod.cards.length;
  var pct = Math.round((q.right/total)*100), pass = pct >= PASS;
  var nextMod = completeIfPassed(pct);
  var h = '<div class="card" style="text-align:center">' +
            '<div class="tag" style="text-align:left">Result</div>' +
            '<p class="big' + (pass?"":" low") + '">' + pct + '%</p>' +
            '<p style="margin:6px 0 0;font-weight:600">' + q.right + ' of ' + total + ' correct</p>' +
            '<p style="margin:6px 0 0;color:var(--ink-soft);font-size:15px">' +
              (pass ? "Passed. This set is marked complete." : "Passing is 80 percent. Run it again.") + '</p>';
  if (q.missed.length){
    h += '<div class="miss" style="text-align:left"><h3>Review these</h3>';
    for (var m=0;m<q.missed.length;m++){
      var c = app.mod.cards[q.missed[m]];
      h += '<div class="miss-item"><p>' + esc(c.q) + '</p><span>' + esc(c.options[c.answer]) + '</span></div>';
    }
    h += '</div>';
  }
  h += '</div>' + nextButton(nextMod) +
       '<button class="btn primary btn-wide" id="again">Take it again</button>' +
       '<button class="btn btn-wide" id="toFlash">Back to flashcards</button>';

  document.getElementById("inner").innerHTML = h;
  wireNext(nextMod);
  document.getElementById("again").onclick = function(){ resetCards("quiz"); };
  document.getElementById("toFlash").onclick = function(){ resetCards("flash"); };
}

/* =======================================================================
   RED PHONE: SORT MODULE
   ======================================================================= */
function resetSort(){
  var m = app.mod;
  s = { placed:[], picked:null, checked:false, order:shuffle(seq(m.items.length)) };
  for (var i=0;i<m.items.length;i++) s.placed.push(null);
  renderSort();
}
function placedCount(){ var n=0; for(var i=0;i<s.placed.length;i++) if(s.placed[i]) n++; return n; }
function catName(id){
  var cs = app.mod.categories;
  for (var i=0;i<cs.length;i++) if (cs[i].id === id) return cs[i].name;
  return id;
}

function renderSort(){
  var m = app.mod, total = m.items.length;
  header(placedCount() + " / " + total);
  setBar((placedCount()/total)*100);

  var loose = s.order.filter(function(i){ return !s.placed[i]; });
  var h = '<p class="lede">' + esc(m.lede) + '</p>' +
          '<div class="tray"><div class="tray-label">Unplaced &middot; ' + loose.length + ' left</div>';
  if (!loose.length){
    h += '<div class="tray-empty">Everything is placed. Check your answers.</div>';
  } else {
    for (var n=0;n<loose.length;n++){
      var i = loose[n];
      h += '<button class="chip' + (s.picked===i?" picked":"") + '" data-item="' + i + '">' + esc(m.items[i].t) + '</button>';
    }
  }
  h += '</div>';

  var armed = s.picked !== null && !s.checked;
  for (var c=0;c<m.categories.length;c++){
    var cat = m.categories[c], mine = [];
    for (var k=0;k<s.placed.length;k++) if (s.placed[k] === cat.id) mine.push(k);
    h += '<div class="bin' + (armed?" open":"") + '">' +
           '<button class="bin-head" data-cat="' + cat.id + '"><span>' + esc(cat.name) + '</span>' +
           '<span class="cue">' + (armed ? "Tap to place" : mine.length + " here") + '</span></button>' +
           '<div class="bin-body">';
    if (!mine.length){
      h += '<div class="bin-empty">Nothing here yet.</div>';
    } else {
      for (var p=0;p<mine.length;p++){
        var idx = mine[p], cls = "chip", mark = "";
        if (s.checked){
          var ok = m.items[idx].cat === cat.id;
          cls += ok ? " right" : " wrong";
          mark = '<span class="mark">' + (ok ? "Correct" : "Belongs in " + esc(catName(m.items[idx].cat))) + '</span>';
        }
        h += '<button class="' + cls + '" data-placed="' + idx + '"' + (s.checked?" disabled":"") + '>' +
               esc(m.items[idx].t) + mark + '</button>';
      }
    }
    h += '</div></div>';
  }

  h += '<div class="actions">' +
         '<button class="btn" id="sReset">Start over</button>' +
         '<button class="btn primary" id="sCheck"' + ((s.checked || placedCount()<total) ? " disabled":"") + '>Check answers</button>' +
       '</div><div id="sResult"></div>';

  stage.innerHTML = h;

  var chips = stage.querySelectorAll("[data-item]");
  for (var a=0;a<chips.length;a++){
    chips[a].onclick = function(){
      var n = parseInt(this.getAttribute("data-item"),10);
      s.picked = (s.picked === n) ? null : n;
      renderSort();
    };
  }
  var heads = stage.querySelectorAll("[data-cat]");
  for (var d=0;d<heads.length;d++){
    heads[d].onclick = function(){
      if (s.picked === null || s.checked) return;
      s.placed[s.picked] = this.getAttribute("data-cat");
      s.picked = null;
      renderSort();
    };
  }
  var back = stage.querySelectorAll("[data-placed]");
  for (var e=0;e<back.length;e++){
    back[e].onclick = function(){
      if (s.checked) return;
      s.placed[parseInt(this.getAttribute("data-placed"),10)] = null;
      renderSort();
    };
  }
  document.getElementById("sReset").onclick = resetSort;
  document.getElementById("sCheck").onclick = checkSort;

  if (s.checked) paintSortResult();
}

function checkSort(){
  s.checked = true; s.picked = null;
  renderSort();
}

function paintSortResult(){
  var m = app.mod, right = 0;
  for (var i=0;i<m.items.length;i++) if (s.placed[i] === m.items[i].cat) right++;
  var pct = Math.round((right/m.items.length)*100);
  var nextMod = completeIfPassed(pct);
  document.getElementById("sResult").innerHTML =
    '<div class="result">' +
      '<p class="big' + (pct>=PASS?"":" low") + '">' + pct + '%</p>' +
      '<p style="font-weight:600">' + right + ' of ' + m.items.length + ' in the right category</p>' +
      '<p style="color:var(--ink-soft);font-size:15px">' +
        (pct>=PASS ? "Passed. This set is marked complete." : "Misses are marked with where they belong.") + '</p>' +
    '</div>' + nextButton(nextMod) +
    '<button class="btn primary btn-wide" id="sAgain">Run it again</button>';
  wireNext(nextMod);
  document.getElementById("sAgain").onclick = resetSort;
}

/* =======================================================================
   RED PHONE: MATCH MODULE
   One to one pairing. links[termIndex] holds the paired description index,
   and a pair is correct when those two indexes are equal.
   ======================================================================= */
var mt = {};

function resetMatch(){
  var m = app.mod;
  mt = { links:[], picked:null, checked:false,
         leftOrder:shuffle(seq(m.pairs.length)), rightOrder:shuffle(seq(m.pairs.length)) };
  for (var i=0;i<m.pairs.length;i++) mt.links.push(null);
  renderMatch();
}

function linkedCount(){
  var n=0; for (var i=0;i<mt.links.length;i++) if (mt.links[i] !== null) n++; return n;
}

function renderMatch(){
  var m = app.mod, total = m.pairs.length;
  header(linkedCount() + " / " + total);
  setBar((linkedCount()/total)*100);

  var taken = {};
  for (var i=0;i<mt.links.length;i++) if (mt.links[i] !== null) taken[mt.links[i]] = true;

  var h = '<p class="lede">' + esc(m.lede) + '</p>' +
          '<div class="tray"><div class="tray-label">' + esc(m.leftLabel) + '</div>';

  for (var L=0;L<mt.leftOrder.length;L++){
    var t = mt.leftOrder[L], link = mt.links[t], cls = "chip", mark = "";
    if (mt.checked && link !== null){
      var ok = link === t;
      cls += ok ? " right" : " wrong";
      mark = '<span class="mark">' + (ok ? "Correct" : "Should be: " + esc(m.pairs[t].b)) + '</span>';
    } else if (mt.picked === t){
      cls += " picked";
    }
    h += '<button class="' + cls + '" data-term="' + t + '">' +
           '<strong>' + esc(m.pairs[t].a) + '</strong>' +
           '<span class="sub">' + (link === null ? "Tap to pick, then choose a description" : esc(m.pairs[link].b)) + '</span>' +
           mark +
         '</button>';
  }
  h += '</div>';

  var armed = mt.picked !== null && !mt.checked;
  var pool = mt.rightOrder.filter(function(r){ return !taken[r]; });
  h += '<div class="bin' + (armed ? " open" : "") + '">' +
         '<div class="bin-head" style="cursor:default"><span>' + esc(m.rightLabel) + '</span>' +
         '<span class="cue">' + (armed ? "Tap one to pair" : pool.length + " left") + '</span></div>' +
         '<div class="bin-body">';
  if (!pool.length){
    h += '<div class="bin-empty">All matched. Check your answers.</div>';
  } else {
    for (var R=0;R<pool.length;R++){
      h += '<button class="chip" data-desc="' + pool[R] + '"' + (armed ? "" : " disabled") + '>' +
             esc(m.pairs[pool[R]].b) + '</button>';
    }
  }
  h += '</div></div>';

  h += '<div class="actions">' +
         '<button class="btn" id="mReset">Start over</button>' +
         '<button class="btn primary" id="mCheck"' + ((mt.checked || linkedCount()<total) ? " disabled":"") + '>Check answers</button>' +
       '</div><div id="mResult"></div>';

  stage.innerHTML = h;

  var terms = stage.querySelectorAll("[data-term]");
  for (var a=0;a<terms.length;a++){
    terms[a].onclick = function(){
      if (mt.checked) return;
      var n = parseInt(this.getAttribute("data-term"),10);
      if (mt.links[n] !== null){ mt.links[n] = null; mt.picked = null; renderMatch(); return; }
      mt.picked = (mt.picked === n) ? null : n;
      renderMatch();
    };
  }
  var descs = stage.querySelectorAll("[data-desc]");
  for (var b=0;b<descs.length;b++){
    descs[b].onclick = function(){
      if (mt.picked === null || mt.checked) return;
      mt.links[mt.picked] = parseInt(this.getAttribute("data-desc"),10);
      mt.picked = null;
      renderMatch();
    };
  }
  document.getElementById("mReset").onclick = resetMatch;
  document.getElementById("mCheck").onclick = function(){ mt.checked = true; mt.picked = null; renderMatch(); };

  if (mt.checked) paintMatchResult();
}

function paintMatchResult(){
  var m = app.mod, right = 0;
  for (var i=0;i<m.pairs.length;i++) if (mt.links[i] === i) right++;
  var pct = Math.round((right/m.pairs.length)*100);
  var nextMod = completeIfPassed(pct);
  document.getElementById("mResult").innerHTML =
    '<div class="result">' +
      '<p class="big' + (pct>=PASS?"":" low") + '">' + pct + '%</p>' +
      '<p style="font-weight:600">' + right + ' of ' + m.pairs.length + ' matched correctly</p>' +
      '<p style="color:var(--ink-soft);font-size:15px">' +
        (pct>=PASS ? "Passed. This set is marked complete." : "Misses show the description that belongs there.") + '</p>' +
    '</div>' + nextButton(nextMod) +
    '<button class="btn primary btn-wide" id="mAgain">Run it again</button>';
  wireNext(nextMod);
  document.getElementById("mAgain").onclick = resetMatch;
}

/* =======================================================================
   RED PHONE: MULTI SELECT MODULE
   A question scores only when the chosen set matches the correct set
   exactly, same as the LMS grades select all that apply.
   ======================================================================= */
var ms = {};

function resetMulti(){
  var d = app.mod.questions;
  ms = { i:0, sel:[], checked:false, right:0, missed:[], done:false, order:shuffle(seq(d.length)) };
  ms.optOrder = shuffle(seq(d[ms.order[0]].options.length));
  renderMulti();
}
function curMulti(){ return app.mod.questions[ms.order[ms.i]]; }
function isCorrect(list, want){
  if (list.length !== want.length) return false;
  for (var i=0;i<want.length;i++) if (list.indexOf(want[i]) === -1) return false;
  return true;
}

function renderMulti(){
  if (ms.done) return renderMultiResults();
  var m = app.mod, c = curMulti(), total = m.questions.length;
  header("Question " + (ms.i+1) + " / " + total);
  setBar((ms.i/total)*100);

  var h = '<p class="lede">' + esc(m.lede) + '</p><div class="card">' +
          '<div class="tag">Question ' + (ms.i+1) + ' of ' + total + ' &middot; select all that apply</div>' +
          '<p style="font-size:19px;font-weight:600;margin:0;line-height:1.35">' + esc(c.q) + '</p><div class="opts">';

  for (var n=0;n<ms.optOrder.length;n++){
    var idx = ms.optOrder[n];
    var chosen = ms.sel.indexOf(idx) !== -1;
    var want = c.correct.indexOf(idx) !== -1;
    var cls = "opt", box = chosen ? "&#10003;" : "";
    if (ms.checked){
      if (want && chosen) cls += " right";
      else if (!want && chosen) cls += " wrong";
      else if (want && !chosen) cls += " right missed";
    } else if (chosen){
      cls += " chosen";
    }
    h += '<button class="' + cls + '" data-o="' + idx + '"' + (ms.checked?" disabled":"") + '>' +
           '<span class="k">' + box + '</span><span>' + esc(c.options[idx]) +
           (ms.checked && want && !chosen ? '<span class="mark" style="color:var(--accent)">Missed this one</span>' : '') +
         '</span></button>';
  }
  h += '</div>';

  if (ms.checked){
    var ok = isCorrect(ms.sel, c.correct);
    h += '<p class="verdict ' + (ok?"ok":"no") + '">' + (ok ? "Correct." : "Not the full set.") + ' ' + esc(c.note) + '</p>';
  }
  h += '</div>';

  h += '<div class="actions">' +
         '<button class="btn" id="msClear"' + (ms.checked?" disabled":"") + '>Clear picks</button>' +
         (ms.checked
           ? '<button class="btn primary" id="msNext">' + (ms.i===total-1 ? "See results" : "Next question") + '</button>'
           : '<button class="btn primary" id="msCheck"' + (ms.sel.length ? "" : " disabled") + '>Check answers</button>') +
       '</div>' +
       '<p class="score">' + ms.right + ' of ' + (ms.checked ? ms.i+1 : ms.i) + ' answered fully correct</p>';

  stage.innerHTML = h;

  var opts = stage.querySelectorAll("[data-o]");
  for (var b=0;b<opts.length;b++){
    opts[b].onclick = function(){
      if (ms.checked) return;
      var v = parseInt(this.getAttribute("data-o"),10);
      var at = ms.sel.indexOf(v);
      if (at === -1) ms.sel.push(v); else ms.sel.splice(at,1);
      renderMulti();
    };
  }
  var clear = document.getElementById("msClear");
  if (clear) clear.onclick = function(){ ms.sel = []; renderMulti(); };
  var chk = document.getElementById("msCheck");
  if (chk) chk.onclick = function(){
    ms.checked = true;
    if (isCorrect(ms.sel, curMulti().correct)) ms.right++; else ms.missed.push(ms.order[ms.i]);
    renderMulti();
  };
  var nxt = document.getElementById("msNext");
  if (nxt) nxt.onclick = function(){
    if (ms.i === app.mod.questions.length-1){ ms.done = true; renderMulti(); return; }
    ms.i++; ms.sel = []; ms.checked = false;
    ms.optOrder = shuffle(seq(curMulti().options.length));
    renderMulti();
  };
}

function renderMultiResults(){
  var m = app.mod, total = m.questions.length;
  header("Result");
  setBar(100);
  var pct = Math.round((ms.right/total)*100), pass = pct >= PASS;
  var nextMod = completeIfPassed(pct);
  var h = '<div class="card" style="text-align:center">' +
            '<div class="tag" style="text-align:left">Result</div>' +
            '<p class="big' + (pass?"":" low") + '">' + pct + '%</p>' +
            '<p style="margin:6px 0 0;font-weight:600">' + ms.right + ' of ' + total + ' fully correct</p>' +
            '<p style="margin:6px 0 0;color:var(--ink-soft);font-size:15px">' +
              (pass ? "Passed. This set is marked complete." : "A question only counts when the whole set is right.") + '</p>';
  if (ms.missed.length){
    h += '<div class="miss" style="text-align:left"><h3>Review these</h3>';
    for (var k=0;k<ms.missed.length;k++){
      var qq = m.questions[ms.missed[k]];
      var full = [];
      for (var c=0;c<qq.correct.length;c++) full.push(qq.options[qq.correct[c]]);
      h += '<div class="miss-item"><p>' + esc(qq.q) + '</p><span>' + esc(full.join("  /  ")) + '</span></div>';
    }
    h += '</div>';
  }
  h += '</div>' + nextButton(nextMod) +
       '<button class="btn primary btn-wide" id="msAgain">Run it again</button>';
  stage.innerHTML = h;
  wireNext(nextMod);
  document.getElementById("msAgain").onclick = resetMulti;
}

/* =======================================================================
   RED PHONE: ORDER MODULE
   steps[] is stored in the correct sequence. slots[n] holds the index of
   whichever step the user dropped into position n, so a slot is right
   when slots[n] === n.
   ======================================================================= */
var od = {};

function resetOrder(){
  var m = app.mod;
  od = { slots:[], checked:false, pool:shuffle(seq(m.steps.length)) };
  for (var i=0;i<m.steps.length;i++) od.slots.push(null);
  renderOrder();
}
function filledCount(){ var n=0; for(var i=0;i<od.slots.length;i++) if(od.slots[i]!==null) n++; return n; }
function nextOpenSlot(){ for(var i=0;i<od.slots.length;i++) if(od.slots[i]===null) return i; return -1; }

function renderOrder(){
  var m = app.mod, total = m.steps.length;
  header(filledCount() + " / " + total);
  setBar((filledCount()/total)*100);

  var used = {};
  for (var i=0;i<od.slots.length;i++) if (od.slots[i] !== null) used[od.slots[i]] = true;
  var pool = od.pool.filter(function(p){ return !used[p]; });

  var h = '<p class="lede">' + esc(m.lede) + '</p>' +
          '<div class="tray"><div class="tray-label">' + esc(m.poolLabel) + ' &middot; ' + pool.length + ' left</div>';
  if (!pool.length){
    h += '<div class="tray-empty">All placed. Check your answers.</div>';
  } else {
    for (var p=0;p<pool.length;p++){
      h += '<button class="chip" data-step="' + pool[p] + '"' + (od.checked?" disabled":"") + '>' +
             esc(m.steps[pool[p]]) + '</button>';
    }
  }
  h += '</div>';

  for (var n=0;n<total;n++){
    var v = od.slots[n], cls = "chip", mark = "", label = "";
    if (v === null){
      label = '<span class="sub">Empty</span>';
    } else {
      label = '<strong>' + esc(m.steps[v]) + '</strong>';
      if (od.checked){
        var ok = v === n;
        cls += ok ? " right" : " wrong";
        mark = '<span class="mark">' + (ok ? "Correct" : "Should be: " + esc(m.steps[n])) + '</span>';
      }
    }
    h += '<div class="bin' + (v === null ? " open" : "") + '" style="margin-bottom:10px">' +
           '<div class="bin-head" style="cursor:default"><span>Step ' + (n+1) + '</span>' +
             '<span class="cue">' + (v === null ? (n === nextOpenSlot() ? "Next to fill" : "Waiting") : "Placed") + '</span>' +
           '</div>' +
           '<div class="bin-body">' +
             (v === null
               ? '<div class="bin-empty">Nothing here yet.</div>'
               : '<button class="' + cls + '" data-slot="' + n + '"' + (od.checked?" disabled":"") + '>' + label + mark + '</button>') +
           '</div></div>';
  }

  h += '<div class="actions">' +
         '<button class="btn" id="oReset">Start over</button>' +
         '<button class="btn primary" id="oCheck"' + ((od.checked || filledCount()<total) ? " disabled":"") + '>Check answers</button>' +
       '</div><div id="oResult"></div>';

  stage.innerHTML = h;

  var chips = stage.querySelectorAll("[data-step]");
  for (var a=0;a<chips.length;a++){
    chips[a].onclick = function(){
      if (od.checked) return;
      var slot = nextOpenSlot();
      if (slot === -1) return;
      od.slots[slot] = parseInt(this.getAttribute("data-step"),10);
      renderOrder();
    };
  }
  var placed = stage.querySelectorAll("[data-slot]");
  for (var b=0;b<placed.length;b++){
    placed[b].onclick = function(){
      if (od.checked) return;
      od.slots[parseInt(this.getAttribute("data-slot"),10)] = null;
      renderOrder();
    };
  }
  document.getElementById("oReset").onclick = resetOrder;
  document.getElementById("oCheck").onclick = function(){ od.checked = true; renderOrder(); };

  if (od.checked) paintOrderResult();
}

function paintOrderResult(){
  var m = app.mod, right = 0;
  for (var i=0;i<m.steps.length;i++) if (od.slots[i] === i) right++;
  var pct = Math.round((right/m.steps.length)*100);
  var nextMod = completeIfPassed(pct);
  document.getElementById("oResult").innerHTML =
    '<div class="result">' +
      '<p class="big' + (pct>=PASS?"":" low") + '">' + pct + '%</p>' +
      '<p style="font-weight:600">' + right + ' of ' + m.steps.length + ' in the right position</p>' +
      '<p style="color:var(--ink-soft);font-size:15px">' + esc(m.note) + '</p>' +
    '</div>' + nextButton(nextMod) +
    '<button class="btn primary btn-wide" id="oAgain">Run it again</button>';
  wireNext(nextMod);
  document.getElementById("oAgain").onclick = resetOrder;
}

/* =======================================================================
   RED PHONE: SCENARIO MODULE
   Read the panels one at a time, then answer. Panels stay reachable
   with Back so the details can be checked while answering.
   ======================================================================= */
var sc = {};

function resetScenario(){
  var m = app.mod;
  sc = { panel:0, reading:true, i:0, picked:null, right:0, missed:[], done:false,
         optOrder:shuffle(seq(m.questions[0].options.length)) };
  renderScenario();
}

function renderScenario(){
  var m = app.mod;
  if (sc.done) return renderScenarioResults();

  if (sc.reading){
    header("Panel " + (sc.panel+1) + " / " + m.panels.length);
    setBar(((sc.panel+1)/(m.panels.length + m.questions.length))*100);
    stage.innerHTML =
      '<div class="card">' +
        '<div class="tag">Setup ' + (sc.panel+1) + ' of ' + m.panels.length + '</div>' +
        '<p style="font-size:17px;line-height:1.5;margin:0">' + esc(m.panels[sc.panel]) + '</p>' +
      '</div>' +
      '<div class="row">' +
        '<button class="btn" id="pPrev"' + (sc.panel===0?" disabled":"") + '>Back</button>' +
        '<button class="btn primary" id="pNext">' + (sc.panel === m.panels.length-1 ? "Start questions" : "Next") + '</button>' +
      '</div>';
    document.getElementById("pPrev").onclick = function(){ if (sc.panel>0){ sc.panel--; renderScenario(); } };
    document.getElementById("pNext").onclick = function(){
      if (sc.panel === m.panels.length-1){ sc.reading = false; renderScenario(); return; }
      sc.panel++; renderScenario();
    };
    return;
  }

  var c = m.questions[sc.i], total = m.questions.length;
  header("Question " + (sc.i+1) + " / " + total);
  setBar(((m.panels.length + sc.i)/(m.panels.length + total))*100);

  var h = '<div class="card">' +
            '<div class="tag">Question ' + (sc.i+1) + ' of ' + total + '</div>' +
            '<p style="font-size:19px;font-weight:600;margin:0;line-height:1.35">' + esc(c.q) + '</p><div class="opts">';
  for (var n=0;n<sc.optOrder.length;n++){
    var idx = sc.optOrder[n], cls = "opt";
    if (sc.picked !== null){
      if (idx === c.answer) cls += " right";
      else if (idx === sc.picked) cls += " wrong";
    }
    h += '<button class="' + cls + '" data-o="' + idx + '"' + (sc.picked!==null?" disabled":"") + '>' +
           '<span class="k">' + KEYS[n] + '</span><span>' + esc(c.options[idx]) + '</span></button>';
  }
  h += '</div>';
  if (sc.picked !== null){
    var ok = sc.picked === c.answer;
    h += '<p class="verdict ' + (ok?"ok":"no") + '">' + (ok?"Correct.":"Not quite.") + ' ' + esc(c.note) + '</p>';
  }
  h += '</div>';
  h += '<div class="row">' +
         '<button class="btn" id="reread">Reread setup</button>' +
         (sc.picked !== null
           ? '<button class="btn primary" id="qNext">' + (sc.i===total-1 ? "See result" : "Next question") + '</button>'
           : '<button class="btn primary" disabled>Pick an answer</button>') +
       '</div>';

  stage.innerHTML = h;

  var opts = stage.querySelectorAll("[data-o]");
  for (var b=0;b<opts.length;b++){
    opts[b].onclick = function(){
      if (sc.picked !== null) return;
      sc.picked = parseInt(this.getAttribute("data-o"),10);
      if (sc.picked === c.answer) sc.right++; else sc.missed.push(sc.i);
      renderScenario();
    };
  }
  document.getElementById("reread").onclick = function(){ sc.reading = true; sc.panel = 0; renderScenario(); };
  var nx = document.getElementById("qNext");
  if (nx) nx.onclick = function(){
    if (sc.i === total-1){ sc.done = true; renderScenario(); return; }
    sc.i++; sc.picked = null;
    sc.optOrder = shuffle(seq(m.questions[sc.i].options.length));
    renderScenario();
  };
}

function renderScenarioResults(){
  var m = app.mod, total = m.questions.length;
  header("Result");
  setBar(100);
  var pct = Math.round((sc.right/total)*100), pass = pct >= PASS;
  var nextMod = completeIfPassed(pct);
  var h = '<div class="card" style="text-align:center">' +
            '<div class="tag" style="text-align:left">Result</div>' +
            '<p class="big' + (pass?"":" low") + '">' + pct + '%</p>' +
            '<p style="margin:6px 0 0;font-weight:600">' + sc.right + ' of ' + total + ' correct</p>' +
            '<p style="margin:6px 0 0;color:var(--ink-soft);font-size:15px">' +
              (pass ? "Passed. This set is marked complete." : "Read the setup again and rerun it.") + '</p>';
  if (sc.missed.length){
    h += '<div class="miss" style="text-align:left"><h3>Review these</h3>';
    for (var k=0;k<sc.missed.length;k++){
      var qq = m.questions[sc.missed[k]];
      h += '<div class="miss-item"><p>' + esc(qq.q) + '</p><span>' + esc(qq.options[qq.answer]) + '</span></div>';
    }
    h += '</div>';
  }
  h += '</div>' + nextButton(nextMod) +
       '<button class="btn primary btn-wide" id="scAgain">Run it again</button>';
  stage.innerHTML = h;
  wireNext(nextMod);
  document.getElementById("scAgain").onclick = resetScenario;
}

/* =======================================================================
   RED PHONE: TRUE OR FALSE MODULE
   One row per statement with both buttons in reach, so it is a single
   tap per row instead of the two tap place pattern.
   ======================================================================= */
var tf = {};

function resetTF(){
  var m = app.mod;
  tf = { picks:[], checked:false, order:shuffle(seq(m.statements.length)) };
  for (var i=0;i<m.statements.length;i++) tf.picks.push(null);
  renderTF();
}
function tfAnswered(){ var n=0; for(var i=0;i<tf.picks.length;i++) if(tf.picks[i]!==null) n++; return n; }

function renderTF(){
  var m = app.mod, total = m.statements.length;
  header(tfAnswered() + " / " + total);
  setBar((tfAnswered()/total)*100);

  var h = '<p class="lede">' + esc(m.lede) + '</p>';

  for (var r=0;r<tf.order.length;r++){
    var idx = tf.order[r], st = m.statements[idx], pick = tf.picks[idx];
    var rowCls = "tfrow";
    if (tf.checked && pick !== null) rowCls += (pick === st.a) ? " right" : " wrong";

    h += '<div class="' + rowCls + '">' +
           '<p class="tftext">' + esc(st.t) + '</p>' +
           '<div class="tfbtns">' +
             '<button class="tfb' + (pick === true ? " on" : "") + '" data-tf="' + idx + '" data-v="1"' + (tf.checked?" disabled":"") + '>True</button>' +
             '<button class="tfb' + (pick === false ? " on" : "") + '" data-tf="' + idx + '" data-v="0"' + (tf.checked?" disabled":"") + '>False</button>' +
           '</div>';
    if (tf.checked){
      h += '<p class="tfnote">' + (pick === st.a ? "Correct. " : "Answer is " + (st.a ? "true" : "false") + ". ") + esc(st.note) + '</p>';
    }
    h += '</div>';
  }

  h += '<div class="actions">' +
         '<button class="btn" id="tfReset">Start over</button>' +
         '<button class="btn primary" id="tfCheck"' + ((tf.checked || tfAnswered()<total) ? " disabled":"") + '>Check answers</button>' +
       '</div><div id="tfResult"></div>';

  stage.innerHTML = h;

  var btns = stage.querySelectorAll("[data-tf]");
  for (var b=0;b<btns.length;b++){
    btns[b].onclick = function(){
      if (tf.checked) return;
      var i = parseInt(this.getAttribute("data-tf"),10);
      var v = this.getAttribute("data-v") === "1";
      tf.picks[i] = (tf.picks[i] === v) ? null : v;
      renderTF();
    };
  }
  document.getElementById("tfReset").onclick = resetTF;
  document.getElementById("tfCheck").onclick = function(){ tf.checked = true; renderTF(); };

  if (tf.checked) paintTFResult();
}

function paintTFResult(){
  var m = app.mod, right = 0;
  for (var i=0;i<m.statements.length;i++) if (tf.picks[i] === m.statements[i].a) right++;
  var pct = Math.round((right/m.statements.length)*100);
  var nextMod = completeIfPassed(pct);
  document.getElementById("tfResult").innerHTML =
    '<div class="result">' +
      '<p class="big' + (pct>=PASS?"":" low") + '">' + pct + '%</p>' +
      '<p style="font-weight:600">' + right + ' of ' + m.statements.length + ' correct</p>' +
      '<p style="color:var(--ink-soft);font-size:15px">' +
        (pct>=PASS ? "Passed. This set is marked complete." : "Each row shows the right answer and why.") + '</p>' +
    '</div>' + nextButton(nextMod) +
    '<button class="btn primary btn-wide" id="tfAgain">Run it again</button>';
  wireNext(nextMod);
  document.getElementById("tfAgain").onclick = resetTF;
}

/* =======================================================================
   RED PHONE: FLASHCARD MODE
   toCards turns any set type into {f front, b back, n note, c context}.
   No scoring, no gates, no progress writes.
   ======================================================================= */
var fd = {};

function toCards(m){
  var out = [], i, j;
  if (m.type === "cards"){
    for (i=0;i<m.cards.length;i++) out.push({ f:m.cards[i].q, b:m.cards[i].options[m.cards[i].answer], n:m.cards[i].note });
  } else if (m.type === "sort"){
    var names = {};
    for (j=0;j<m.categories.length;j++) names[m.categories[j].id] = m.categories[j].name;
    for (i=0;i<m.items.length;i++) out.push({ f:m.items[i].t, b:names[m.items[i].cat] });
  } else if (m.type === "match"){
    for (i=0;i<m.pairs.length;i++) out.push({ f:m.pairs[i].a, b:m.pairs[i].b });
  } else if (m.type === "multi"){
    for (i=0;i<m.questions.length;i++){
      var qq = m.questions[i], picks = [];
      for (j=0;j<qq.correct.length;j++) picks.push(qq.options[qq.correct[j]]);
      out.push({ f:qq.q + " (select all that apply)", b:picks.join("  /  "), n:qq.note });
    }
  } else if (m.type === "order"){
    for (i=0;i<m.steps.length;i++) out.push({ f:"Step " + (i+1) + " of " + m.steps.length + "?", b:m.steps[i], n:m.note });
  } else if (m.type === "tf"){
    for (i=0;i<m.statements.length;i++) out.push({ f:"True or false: " + m.statements[i].t, b:m.statements[i].a ? "True" : "False", n:m.statements[i].note });
  } else if (m.type === "scenario"){
    for (i=0;i<m.questions.length;i++) out.push({ f:m.questions[i].q, b:m.questions[i].options[m.questions[i].answer], n:m.questions[i].note, c:m.panels.join(" ") });
  }
  return out;
}

function openFlash(id){
  for (var i=0;i<MODULES.length;i++) if (MODULES[i].id === id) app.mod = MODULES[i];
  app.view = "flashdeck";
  barWrap.style.display = "";
  var list = toCards(app.mod);
  fd = { list:list, order:shuffle(seq(list.length)), i:0, flipped:false };
  renderFlashDeck();
}

function renderFlashDeck(){
  var total = fd.list.length, card = fd.list[fd.order[fd.i]];
  header("Card " + (fd.i+1) + " / " + total);
  setBar(((fd.i+1)/total)*100);
  var face = (card.c ? '<p class="ctx">' + esc(card.c) + '</p>' : '') + '<p class="q">' + esc(card.f) + '</p>';
  if (fd.flipped){
    face += '<p class="a-label">Answer</p><p class="a">' + esc(card.b) + '</p>' +
            (card.n ? '<p class="hint" style="text-align:left;margin-top:10px">' + esc(card.n) + '</p>' : '');
  }
  stage.innerHTML =
    '<div class="card flash" id="deckCard" role="button" tabindex="0">' +
      '<div class="tag">' + esc(app.mod.title) + '</div>' + face +
    '</div>' +
    '<p class="hint">' + (fd.flipped ? "Tap the card to hide the answer" : "Tap the card to flip it") + '</p>' +
    '<div class="row">' +
      '<button class="btn" id="fdPrev"' + (fd.i===0 ? " disabled" : "") + '>Back</button>' +
      '<button class="btn primary" id="fdNext">' + (fd.i===total-1 ? "Shuffle again" : "Next") + '</button>' +
    '</div>';
  var dc = document.getElementById("deckCard");
  dc.onclick = function(){ fd.flipped = !fd.flipped; renderFlashDeck(); };
  dc.onkeydown = function(e){ if (e.key===" "||e.key==="Enter"){ e.preventDefault(); fd.flipped=!fd.flipped; renderFlashDeck(); } };
  document.getElementById("fdPrev").onclick = function(){ if (fd.i>0){ fd.i--; fd.flipped=false; renderFlashDeck(); } };
  document.getElementById("fdNext").onclick = function(){
    if (fd.i === total-1){ fd.order = shuffle(seq(total)); fd.i = 0; }
    else fd.i++;
    fd.flipped = false; renderFlashDeck();
  };
}

/* RED PHONE: boot. Progress loads first so the gates are right on paint. */
Store.load(function(st){
  progress = st.progress || [];
  unlockAll = !!st.unlockAll;
  studyMode = st.mode === "flash" ? "flash" : "career";
  goHome();
});
