<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E4EEEA">
<title>Welcome to the Madness</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: #E4EEEA; }
  body {
    color: #22201D;
    font-family: "Roboto Condensed", "Arial Narrow", sans-serif-condensed, "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: stretch;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  canvas {
    display: block;
    width: 100%;
    max-width: 520px;
    height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" aria-label="Welcome to the Madness kitchen game"></canvas></div>

<script>
(function () {
  "use strict";

  // ---------- SETUP ----------
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var W = 400, H = 720, scale = 1, dpr = 1;

  var FONT = '"Roboto Condensed", "Arial Narrow", sans-serif-condensed, "Helvetica Neue", Arial, sans-serif';
  function font(size, weight) { return (weight || 700) + " " + size + "px " + FONT; }

  var C = {
    wall: "#E4EEEA", grout: "#CFDDD7", ink: "#22201D", paper: "#FFFFFF",
    red: "#C7361F", redDark: "#8F2414", green: "#2E8B4A", gold: "#E59A1C",
    steelHi: "#DDE1E5", steelLo: "#A9B0B7", muted: "#8A938F"
  };
  var TAGS = ["#2F6FD0", "#8B4FC9", "#14958A", "#D9711C"];

  function resize() {
    var r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    scale = r.width / W;
    H = Math.max(600, r.height / scale);
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    layout();
  }

  // ---------- FOODS ----------
  var FOODS = {
    noodles: { name: "Yakisoba", cook: 6.0, window: 2.6 },
    chicken: { name: "Chicken",  cook: 5.0, window: 2.2 },
    steak:   { name: "Steak",    cook: 7.0, window: 2.0 },
    salmon:  { name: "Salmon",   cook: 4.0, window: 1.8 },
    tofu:    { name: "Tofu",     cook: 3.5, window: 1.8 },
    veggies: { name: "Veggies",  cook: 2.5, window: 2.2 }
  };
  var PROTEINS = ["chicken", "steak", "salmon", "tofu"];
  var ORDER_NAMES = { chicken: ["Chicken teriyaki", "Yaki chicken"], steak: ["Steak teriyaki", "Yaki steak"], salmon: ["Teriyaki salmon", "Glazed salmon"], tofu: ["Spicy tofu", "Tofu teriyaki"] };
  var SKINS = ["#F1C9A5", "#D9A27A", "#B57A52", "#8C5A3C", "#F3D6C0", "#6E4630"];
  var PERFECT = 0.45; // first part of the ready window counts as perfect

  // ---------- COLOR HELPERS ----------
  function hex(c) { return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)]; }
  function mix(a, b, t) {
    t = Math.max(0, Math.min(1, t));
    var x = hex(a), y = hex(b);
    return "rgb(" + Math.round(x[0] + (y[0] - x[0]) * t) + "," + Math.round(x[1] + (y[1] - x[1]) * t) + "," + Math.round(x[2] + (y[2] - x[2]) * t) + ")";
  }
  var BURNT = "#2B211C";
  function shade(raw, cooked, d, b) { return b > 0 ? mix(cooked, BURNT, b) : mix(raw, cooked, d); }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- FOOD ART ----------
  // d is cook progress 0..1, b is burn progress 0..1, s is size in px.
  function drawFood(kind, x, y, s, d, b, seed) {
    ctx.save();
    ctx.translate(x, y);
    var k = s / 40;
    ctx.scale(k, k);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (kind === "noodles") {
      var seedN = 7;
      function rnd() { seedN = (seedN * 9301 + 49297) % 233280; return seedN / 233280; }
      ctx.lineWidth = 3.2;
      for (var i = 0; i < 14; i++) {
        ctx.strokeStyle = shade("#F4E3AE", i % 3 ? "#D49A45" : "#B97A2E", d, b);
        var sx0 = (rnd() - 0.5) * 40, sy0 = (rnd() - 0.5) * 34;
        ctx.beginPath(); ctx.moveTo(sx0, sy0);
        for (var j = 0; j < 3; j++) {
          var ex = (rnd() - 0.5) * 52, ey = (rnd() - 0.5) * 40;
          ctx.bezierCurveTo(sx0 + (rnd() - 0.5) * 50, sy0 + (rnd() - 0.5) * 40, ex + (rnd() - 0.5) * 30, ey + (rnd() - 0.5) * 30, ex, ey);
          sx0 = ex; sy0 = ey;
        }
        ctx.stroke();
      }
      if (b < 0.6) {
        ctx.fillStyle = shade("#6DBE5A", "#3E8E3A", d, b);
        for (var g = 0; g < 7; g++) { ctx.beginPath(); ctx.arc((rnd() - 0.5) * 44, (rnd() - 0.5) * 34, 2.8, 0, 7); ctx.fill(); }
      }
    } else if (kind === "chicken") {
      var pts = [[-14, -10, 13, 10], [12, -12, 12, 9], [-10, 12, 12, 9], [14, 10, 11, 9]];
      pts.forEach(function (p, n) {
        ctx.fillStyle = shade("#F2C6B6", "#C9823C", d, b);
        ctx.beginPath(); ctx.ellipse(p[0], p[1], p[2], p[3], n * 0.7, 0, 7); ctx.fill();
        ctx.strokeStyle = shade("#E3A898", "#9A5A22", d, b); ctx.lineWidth = 2; ctx.stroke();
      });
      if (d > 0.85 && b < 0.5) {
        ctx.strokeStyle = "rgba(110,48,18,0.85)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-24, -4); ctx.bezierCurveTo(-8, -18, 4, 14, 24, -2); ctx.stroke();
      }
    } else if (kind === "steak") {
      ctx.rotate(-0.18);
      ctx.fillStyle = shade("#F2E6DA", "#E7C9A2", d, b);
      rr(-31, -21, 62, 42, 16); ctx.fill();
      ctx.fillStyle = shade("#BE3C35", "#6F3A25", d, b);
      rr(-27, -17, 54, 34, 13); ctx.fill();
      if (d > 0.4) {
        ctx.strokeStyle = "rgba(35,22,16," + Math.min(0.8, (d - 0.4) * 1.6) + ")"; ctx.lineWidth = 3.5;
        for (var m = -2; m <= 2; m++) { ctx.beginPath(); ctx.moveTo(-18 + m * 9, -14); ctx.lineTo(-6 + m * 9, 14); ctx.stroke(); }
      }
    } else if (kind === "salmon") {
      ctx.rotate(0.12);
      ctx.fillStyle = shade("#9AA3A8", "#5C6366", d, b);
      rr(-30, 10, 60, 9, 4); ctx.fill();
      ctx.fillStyle = shade("#F4845C", "#EBA77E", d, b);
      rr(-30, -18, 60, 32, 10); ctx.fill();
      ctx.strokeStyle = shade("#FFD3BF", "#F7DCC6", d, b); ctx.lineWidth = 2.4;
      for (var l = -2; l <= 2; l++) { ctx.beginPath(); ctx.moveTo(l * 11 - 6, -16); ctx.quadraticCurveTo(l * 11 + 4, -2, l * 11 - 4, 12); ctx.stroke(); }
    } else if (kind === "tofu") {
      [[-14, -14], [12, -14], [-14, 12], [12, 12]].forEach(function (p) {
        ctx.fillStyle = shade("#F7F2E4", "#D9A64A", d, b);
        rr(p[0] - 11, p[1] - 11, 22, 22, 4); ctx.fill();
        ctx.strokeStyle = shade("#E2DAC4", "#A8742A", d, b); ctx.lineWidth = 2; ctx.stroke();
      });
    } else if (kind === "veggies") {
      [[-12, -6], [8, -12], [0, 8]].forEach(function (p) {
        ctx.fillStyle = shade("#93C47D", "#8FB370", d, b);
        rr(p[0] - 3, p[1], 6, 14, 2); ctx.fill();
        ctx.fillStyle = shade("#4FB060", "#2E7F3D", d, b);
        for (var q = 0; q < 5; q++) { ctx.beginPath(); ctx.arc(p[0] + Math.cos(q * 1.26) * 7, p[1] - 2 + Math.sin(q * 1.26) * 5, 6, 0, 7); ctx.fill(); }
      });
      [[-22, 14], [22, 6], [18, 20], [-24, -16]].forEach(function (p) {
        ctx.fillStyle = shade("#F59A3A", "#E07B22", d, b);
        ctx.beginPath(); ctx.arc(p[0], p[1], 6.5, 0, 7); ctx.fill();
        ctx.strokeStyle = shade("#FBC47F", "#F2A65A", d, b); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, 7); ctx.stroke();
      });
    }
    ctx.restore();
  }

  // ---------- AUDIO ----------
  var actx = null, muted = false;
  try { muted = localStorage.getItem("wttm-muted") === "1"; } catch (e) {}
  function audio() {
    if (muted) return null;
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(f, dur, type, vol, slide) {
    var a = audio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function sizzle(dur) {
    var a = audio(); if (!a) return;
    var n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), data = buf.getChannelData(0);
    for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    f.type = "bandpass"; f.frequency.value = 4200; f.Q.value = 0.8; g.gain.value = 0.22;
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  }
  var sfx = {
    start: function () { sizzle(0.45); },
    ready: function () { tone(1320, 0.12, "triangle", 0.12); },
    perfect: function () { tone(880, 0.09, "triangle", 0.14); setTimeout(function () { tone(1320, 0.14, "triangle", 0.14); }, 80); },
    good: function () { tone(660, 0.12, "triangle", 0.12); },
    bad: function () { tone(180, 0.25, "sawtooth", 0.08, 90); },
    serve: function () { tone(988, 0.08, "square", 0.07); setTimeout(function () { tone(1480, 0.2, "square", 0.07); }, 70); },
    level: function () { [523, 659, 784, 1046].forEach(function (f, i) { setTimeout(function () { tone(f, 0.16, "triangle", 0.12); }, i * 90); }); }
  };
  function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

  // ---------- STATE ----------
  var best = 0;
  try { best = parseInt(localStorage.getItem("wttm-best") || "0", 10) || 0; } catch (e) {}
  var screen = "title"; // title, play, paused, over
  var state = null;
  var parts = [];
  var floaters = [];
  var banner = null;
  var toast = { text: "", t: 0 };
  var clock = 0;

  function freshState() {
    var gs = [];
    for (var i = 0; i < 4; i++) gs.push({ id: i, status: "empty", food: null, t: 0, orderId: null, shake: 0 });
    return { score: 0, served: 0, level: 1, hearts: 3, combo: 0, orders: [], nextOrderIn: 1.2, orderCounter: 0, tagIndex: 0, grills: gs, newBest: false };
  }

  function patienceFor() { return Math.max(17, 36 - (state.level - 1) * 3.2); }
  function spawnGap() { return Math.max(4.8, 11 - (state.level - 1) * 1.3); }
  function maxOrders() { return state.level >= 2 ? 3 : 2; }
  function mult() { return 1 + Math.min(state.combo, 8) * 0.25; }

  function makeOrder() {
    state.orderCounter += 1;
    var protein = PROTEINS[Math.floor(Math.random() * PROTEINS.length)];
    var needs = ["noodles", protein, "veggies"];
    var names = ORDER_NAMES[protein], oname = names[Math.floor(Math.random() * names.length)];
    if (state.level >= 4 && Math.random() < 0.35) {
      var extra = PROTEINS[Math.floor(Math.random() * PROTEINS.length)];
      if (extra !== protein) { needs.splice(2, 0, extra); oname = "Madness bowl"; }
    }
    var used = state.orders.map(function (o) { return o.tag; });
    var tag = TAGS[state.tagIndex % TAGS.length];
    for (var i = 0; i < TAGS.length && used.indexOf(tag) !== -1; i++) { state.tagIndex++; tag = TAGS[state.tagIndex % TAGS.length]; }
    state.tagIndex++;
    var p = patienceFor() + (needs.length - 3) * 6;
    return {
      id: state.orderCounter, name: oname,
      needs: needs, got: [], patience: p, maxPatience: p, tag: tag,
      skin: SKINS[Math.floor(Math.random() * SKINS.length)], slide: 0, wobble: Math.random() * 6
    };
  }

  function say(text) { toast.text = text; toast.t = 1.9; }

  // ---------- LAYOUT ----------
  var L = {};
  function layout() {
    L.hudH = 78;
    L.railY = L.hudH + 6;
    L.ticketH = 150;
    L.gx = 12; L.gy = L.railY + L.ticketH + 22;
    L.gw = W - 24; L.gh = Math.max(300, H - L.gy - 52);
    var pad = 12, zw = (L.gw - pad * 3) / 2, zh = (L.gh - pad * 3 - 18) / 2;
    L.zones = [];
    for (var i = 0; i < 4; i++) {
      var cx = i % 2, cy = Math.floor(i / 2);
      L.zones.push({ x: L.gx + pad + cx * (zw + pad), y: L.gy + pad + cy * (zh + pad), w: zw, h: zh });
    }
    L.toastY = H - 26;
  }

  // ---------- GAME ACTIONS ----------
  function findOrder(id) { for (var i = 0; i < state.orders.length; i++) if (state.orders[i].id === id) return state.orders[i]; return null; }

  function nextNeededItem() {
    var busy = {};
    state.grills.forEach(function (g) { if (g.status === "cooking" || g.status === "ready") busy[g.orderId + ":" + g.food] = true; });
    for (var i = 0; i < state.orders.length; i++) {
      var o = state.orders[i];
      for (var j = 0; j < o.needs.length; j++) {
        var item = o.needs[j];
        if (o.got.indexOf(item) !== -1 || busy[o.id + ":" + item]) continue;
        return { orderId: o.id, food: item };
      }
    }
    return null;
  }

  function zoneCenter(i) { var z = L.zones[i]; return { x: z.x + z.w / 2, y: z.y + z.h / 2 - 6 }; }

  function tapGrill(i) {
    var g = state.grills[i];
    var c = zoneCenter(i);
    if (g.status === "empty") {
      var job = nextNeededItem();
      if (!job) { say("Nothing to cook yet"); g.shake = 0.3; return; }
      g.status = "cooking"; g.food = job.food; g.orderId = job.orderId; g.t = 0; g.pinged = false;
      sfx.start(); puff(c.x, c.y, 8, "steam");
      return;
    }
    if (g.status === "cooking") {
      say(FOODS[g.food].name + " was raw, tossed it");
      state.combo = 0; g.shake = 0.4; sfx.bad(); buzz(60);
      resetGrill(g); return;
    }
    if (g.status === "ready") { deliverItem(g, i); return; }
    if (g.status === "burnt") { say("Scraped the grill clean"); resetGrill(g); puff(c.x, c.y, 10, "smoke"); }
  }

  function resetGrill(g) { g.status = "empty"; g.food = null; g.orderId = null; g.t = 0; }

  function deliverItem(g, i) {
    var f = FOODS[g.food], c = zoneCenter(i);
    var perfect = g.t <= f.cook + f.window * PERFECT;
    var target = findOrder(g.orderId);
    if (!target || target.got.indexOf(g.food) !== -1) {
      target = null;
      for (var k = 0; k < state.orders.length; k++) {
        var o2 = state.orders[k];
        if (o2.needs.indexOf(g.food) !== -1 && o2.got.indexOf(g.food) === -1) { target = o2; break; }
      }
    }
    if (!target) { say("No bowl needs that, tossed it"); sfx.bad(); resetGrill(g); return; }
    target.got.push(g.food);
    if (perfect) { state.combo += 1; } else { state.combo = 0; }
    var pts = Math.round((perfect ? 50 : 25) * mult());
    state.score += pts;
    floaters.push({ x: c.x, y: c.y - 20, text: (perfect ? "Perfect +" : "+") + pts, color: perfect ? C.green : C.ink, life: 1.2 });
    if (perfect) { sparkle(c.x, c.y); sfx.perfect(); } else { sfx.good(); }
    resetGrill(g);
  }

  function serveOrder(o) {
    var bonus = Math.round((o.patience / o.maxPatience) * 100);
    var pts = Math.round((100 + bonus) * mult());
    state.score += pts; state.served += 1;
    state.orders.splice(state.orders.indexOf(o), 1);
    state.grills.forEach(function (g) {
      if (g.orderId === o.id && g.status !== "empty") {
        for (var k = 0; k < state.orders.length; k++) {
          var o2 = state.orders[k];
          if (o2.needs.indexOf(g.food) !== -1 && o2.got.indexOf(g.food) === -1) { g.orderId = o2.id; return; }
        }
        resetGrill(g);
      }
    });
    say("Served " + o.name.toLowerCase() + ", +" + pts);
    sfx.serve(); buzz(20);
    var lvl = 1 + Math.floor(state.served / 5);
    if (lvl > state.level) { state.level = lvl; banner = { text: "Rush level " + lvl, t: 2.2 }; sfx.level(); }
  }

  function loseOrder(o) {
    state.orders.splice(state.orders.indexOf(o), 1);
    state.hearts -= 1; state.combo = 0;
    state.grills.forEach(function (g) { if (g.orderId === o.id && g.status !== "empty") g.orderId = -1; });
    say("A customer walked out"); sfx.bad(); buzz([80, 60, 80]);
    if (state.hearts <= 0) endShift();
  }

  function startShift() {
    audio();
    state = freshState();
    parts = []; floaters = []; banner = { text: "Doors open", t: 1.6 };
    screen = "play";
  }

  function endShift() {
    screen = "over";
    if (state.score > best) { best = state.score; state.newBest = true; try { localStorage.setItem("wttm-best", String(best)); } catch (e) {} }
  }

  // ---------- PARTICLES ----------
  function puff(x, y, n, kind) {
    for (var i = 0; i < n; i++) parts.push({ x: x + (Math.random() - 0.5) * 50, y: y + (Math.random() - 0.5) * 20, vx: (Math.random() - 0.5) * 14, vy: -20 - Math.random() * 30, r: 5 + Math.random() * 7, life: 1, max: 0.9 + Math.random() * 0.8, kind: kind });
  }
  function sparkle(x, y) {
    for (var i = 0; i < 16; i++) { var a = (i / 16) * Math.PI * 2; parts.push({ x: x, y: y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, r: 3.2, life: 1, max: 0.55, kind: "spark" }); }
  }

  // ---------- UPDATE ----------
  function update(dt) {
    clock += dt;
    if (toast.t > 0) toast.t -= dt;
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    for (var p = parts.length - 1; p >= 0; p--) {
      var q = parts[p];
      q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt / q.max;
      if (q.kind === "spark") { q.vx *= 0.9; q.vy *= 0.9; } else { q.r += dt * 10; }
      if (q.life <= 0) parts.splice(p, 1);
    }
    for (var f = floaters.length - 1; f >= 0; f--) { floaters[f].y -= 34 * dt; floaters[f].life -= dt; if (floaters[f].life <= 0) floaters.splice(f, 1); }
    if (screen !== "play") return;

    state.nextOrderIn -= dt;
    if (state.nextOrderIn <= 0 && state.orders.length < maxOrders()) { state.orders.push(makeOrder()); state.nextOrderIn = spawnGap(); }
    if (state.orders.length === 0 && state.nextOrderIn > 1.5) state.nextOrderIn = 1.5;

    for (var i = state.orders.length - 1; i >= 0; i--) {
      var o = state.orders[i];
      o.slide = Math.min(1, o.slide + dt * 3);
      if (o.got.length < o.needs.length) o.patience -= dt;
      else o.patience -= dt * 0.35;
      if (o.patience <= 0) { loseOrder(o); if (screen !== "play") return; }
    }

    state.grills.forEach(function (g, gi) {
      if (g.shake > 0) g.shake -= dt;
      if (g.status === "cooking" || g.status === "ready") {
        g.t += dt;
        var fd = FOODS[g.food], c = zoneCenter(gi);
        if (g.t >= fd.cook + fd.window) {
          g.status = "burnt"; state.combo = 0; sfx.bad(); buzz(50);
          say(fd.name + " burnt");
        } else if (g.t >= fd.cook) {
          if (!g.pinged) { g.pinged = true; sfx.ready(); }
          g.status = "ready";
        }
        if (Math.random() < dt * 5) puff(c.x, c.y, 1, "steam");
      } else if (g.status === "burnt") {
        if (Math.random() < dt * 6) puff(zoneCenter(gi).x, zoneCenter(gi).y, 1, "smoke");
      }
    });
  }

  // ---------- DRAW ----------
  var hits = [];
  function hit(x, y, w, h, fn) { hits.push({ x: x, y: y, w: w, h: h, fn: fn }); }

  function drawWall() {
    ctx.fillStyle = C.wall; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = C.grout; ctx.lineWidth = 1;
    var s = 28;
    for (var y = 0; y < H; y += s) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke(); }
    for (var r = 0; r * s < H; r++) {

  function drawTicket(o, x, y, w, h) {

  function drawZone(i) {
    var z = L.zones[i], g = state ? state.grills[i] : { status: "empty", shake: 0 };
    var sx = g.shake > 0 ? Math.sin(clock * 60) * 3 : 0;

      arcSeg(fd.cook, fd.cook + fd.window * PERFECT, "rgba(46,139,74,0.55)");
      arcSeg(fd.cook + fd.window * PERFECT, total, "rgba(229,154,28,0.55)");

    hits = [];
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    drawWall();
    drawGriddle();
    drawRail();
    drawParticles();
    drawToast();
    drawOverlay();
    drawHud();
  }

  // ---------- INPUT ----------
  cv.addEventListener("pointerdown", function (e) {
    var r = cv.getBoundingClientRect();
    var x = (e.clientX - r.left) / scale, y = (e.clientY - r.top) / scale;
    for (var i = hits.length - 1; i >= 0; i--) {
      var h = hits[i];
      if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
        h.fn(); e.preventDefault(); return;
      }
    }
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden && screen === "play") screen = "paused"; });
  window.addEventListener("resize", resize);

  // ---------- LOOP ----------
  var last = performance.now();
  function frame(ts) {
    var dt = Math.min(0.1, (ts - last) / 1000); last = ts;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
