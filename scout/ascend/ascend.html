let bestFuelLevel = parseInt(localStorage.getItem('bestFuelLevel') || '0');

const SIDE = {
  DEEP: 2600,      // ground blocks reach this far down
  STEP: 16,        // ledge height you walk up without jumping
  ABYSS: 420,      // abyss line sits this far below the nearby ground
  UNIT: 25,        // world px per meter of distance
  GATE_LEN: 3200,  // fuel mode: world px per level stretch
  fuel: 100, level: 1, fuelOn: false, gates: [], counts: [], gi: 0, cans: [],
  VIEW: 720,       // world px across the screen on a phone
  terrain: [], gems: [], lane: [], deco: [],
  genX: 0, genY: 0, last: '', camX: 0, camY: 0, S: 1, vw: 0, vh: 0, t: 0,
  falls: 0, gemCount: 0, dropping: false, zi: 0, zl: 0, minX: -300, standOn: null,

  fuelTick(ms, cx, pcy) {
    const P = player;
    for (const c of this.cans) {
      if (c.taken) continue;
      const dx = cx - c.x, dy = pcy - c.y;
      if (dx * dx + dy * dy < 24 * 24) {
        c.taken = true;
        this.fuel = Math.min(100, this.fuel + 30);
        showBanner('FUEL +30');
        audio.triggers.token();
      }
    }
    // gates: every gem in the stretch means a level up
    while (this.gi < this.gates.length && P.x > this.gates[this.gi].x) {
      const c = this.counts[this.gi] || { total: 0, taken: 0 };
      if (c.taken >= c.total) {
        this.level++;
        this.fuel = 100;
        if (this.level > bestFuelLevel) { bestFuelLevel = this.level; localStorage.setItem('bestFuelLevel', bestFuelLevel); }
        showBanner('LEVEL ' + this.level + '  FULL TANK');
        audio.triggers.milestone();
        for (let i = 0; i < 30; i++) {
          const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 6;
          particles.push({ x: cx, y: pcy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.02, size: 2 + Math.random() * 3, hue: 200 + Math.random() * 40, type: 'splash' });
        }
      } else {
        showBanner('MISSED ' + (c.total - c.taken) + ' GEMS  NO LEVEL UP');
        audio.triggers.wrong();
      }
      this.gi++;
    }
    const burn = (1.2 + 1.2 * Math.min(1, Math.abs(P.vx) / 15)) * (1 + 0.05 * Math.min(20, this.level - 1));
    this.fuel -= burn * ms / 1000;
    if (this.fuel < 20 && !this.lowWarned) { this.lowWarned = true; showBanner('LOW FUEL'); audio.triggers.spent(); }
    if (this.fuel >= 25) this.lowWarned = false;
    if (this.fuel <= 0) {
      this.fuel = 0;
      audio.triggers.die();
      GHOST.save();
      LB.queue();
      setState(STATE.DEAD);
      return true;
    }
    return false;
  },
  drawFuelWorld(time) {
    for (let i = this.gi; i < this.gates.length; i++) {
      const g = this.gates[i];
      if (g.x < this.camX - 40 || g.x > this.camX + this.vw + 40) continue;
      const c = this.counts[i] || { total: 0, taken: 0 };
      const top = this.camY, h = this.vh;
      ctx.globalAlpha = 0.18 + 0.1 * Math.sin(time * 0.005);
      ctx.fillStyle = '#3d8bff';
      ctx.fillRect(g.x - 10, top, 20, h);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#3d8bff';
      ctx.fillRect(g.x - 2, top, 4, h);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold ' + Math.round(14 / this.S) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(i === this.gi ? 'LEVEL UP GATE' : 'GATE', g.x, top + 150 / this.S);
      if (i === this.gi) ctx.fillText('◆ ' + c.taken + ' / ' + c.total, g.x, top + 172 / this.S);
    }
    for (const c of this.cans) {
      if (c.x < this.camX - 30 || c.x > this.camX + this.vw + 30) continue;
      const y = c.y + Math.sin(time * 0.004 + c.ph) * 3;
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#3d8bff';
      ctx.beginPath(); ctx.arc(c.x, y, 15, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ff4466';
      ctx.fillRect(c.x - 7, y - 9, 14, 18);
      ctx.fillStyle = '#1b2440';
      ctx.fillRect(c.x - 3, y - 13, 6, 4);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(c.x - 4, y - 2, 8, 2);
      ctx.fillRect(c.x - 1, y - 5, 2, 8);
    }
    drawBlaze();
    drawRockets(time);
    drawSteadies(time);
    drawOddities(time);
    drawGliders(time);
  },
  fuelHud() {
    const bx = 14, by = 134, bw = 110;
    const f = this.fuel / 100;
    const low = this.fuel < 20 && Math.floor(performance.now() / 250) % 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = low ? '#ff4466' : '#6fb0ff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('FUEL', bx, by - 4);
    ctx.fillStyle = '#16223f';
    ctx.fillRect(bx, by, bw, 9);
    ctx.fillStyle = f > 0.2 ? '#3d8bff' : '#ff4466';
    ctx.fillRect(bx, by, bw * f, 9);
    ctx.strokeStyle = '#bfe0ff'; ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, 9);
    const P = player;
    const t = [];
    if (P.rocketTimer > 0) t.push('rocket ' + Math.ceil(P.rocketTimer) + 's');
    if (P.hasGlider) t.push('glider ' + Math.ceil(P.gliderTime / 1000) + 's');
    if (P.steadyTime > 0) t.push('steady ' + Math.ceil(P.steadyTime / 1000) + 's');
    if (P.sizeTime > 0) t.push((P.sizeKind === 'shrink' ? 'shrunk ' : 'grown ') + Math.ceil(P.sizeTime / 1000) + 's');
    if (P.slowTime > 0) t.push('slow-mo ' + Math.ceil(P.slowTime / 1000) + 's');
    if (P.trailTime > 0) t.push('trail ' + Math.ceil(P.trailTime / 1000) + 's');
    if (P.staticTime > 0) t.push('static ' + Math.ceil(P.staticTime / 1000) + 's');
    ctx.fillStyle = '#6fb0ff';
    ctx.font = 'bold 11px monospace';
    t.forEach((s, i) => ctx.fillText(s, bx, by + 26 + i * 16));
    ctx.textAlign = 'right';
    ctx.fillStyle = '#6fb0ff';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('LEVEL ' + this.level, W - 14, 104);
    const c = this.counts[this.gi] || { total: 0, taken: 0 };
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = c.taken >= c.total ? '#3dff9b' : '#bfe0ff';
    ctx.fillText('stretch ◆ ' + c.taken + '/' + c.total, W - 14, 122);
    if (this.gates[this.gi]) {
      ctx.fillStyle = CFG.UI_DIM;
      ctx.fillText('gate in ' + Math.max(0, Math.round((this.gates[this.gi].x - P.x) / this.UNIT)) + 'm', W - 14, 138);
    }
  },
  view() {
    this.S = Math.max(0.5, Math.min(1.2, W / this.VIEW));
    this.vw = W / this.S;
    this.vh = H / this.S;
  },

  init() {
    this.view();
    this.terrain = []; this.gems = []; this.lane = []; this.deco = [];
    this.genX = 0; this.genY = 0; this.last = ''; this.t = 0;
    this.falls = 0; this.gemCount = 0; this.dropping = false; this.standOn = null;
    this.minX = -300;
    this.fuelOn = mode === 'fuel';
    this.fuel = 100; this.level = 1; this.gates = []; this.counts = []; this.gi = 0;
    this.gateNext = this.GATE_LEN; this.cans = []; this.puGap = 3; this.lowWarned = false;
    const z = zoneAt(0); this.zi = z.i; this.zl = z.lap;
    // back wall at the start line
    this.terrain.push({ k: 'block', x: -300, y: -3000, w: 300, h: 3000 + this.DEEP, wall: true });
    this.flat(900, true);
    player.x = 160;
    player.y = -player.h;
    player.onGround = true;
    this.camX = player.x - this.vw * 0.3;
    this.camY = player.y - this.vh * 0.55;
    this.generate();
  },

  // ── building blocks ──────────────────────────────────────
  lanePt(x, y) { this.lane.push({ x, y }); },
  block(x, y, w, o) {
    const b = Object.assign({ k: 'block', x, y, w, h: this.DEEP, hue: Math.floor(Math.random() * 360) }, o || {});
    this.terrain.push(b);
    this.lanePt(x, y); this.lanePt(x + w, y);
    return b;
  },
  slopeSeg(x0, y0, x1, y1) {
    this.terrain.push({ k: 'slope', x0, y0, x1, y1, x: x0, w: x1 - x0, hue: Math.floor(Math.random() * 360) });
    this.lanePt(x0, y0); this.lanePt(x1, y1);
  },
  plat(x, y, w, o) {
    const p = Object.assign({ k: 'plat', x, y, w, h: CFG.PLAT_H, bx: x, by: y, ax: 0, ay: 0, sp: 0, ph: Math.random() * 6.28, dx: 0, dy: 0, hue: Math.floor(Math.random() * 360) }, o || {});
    this.terrain.push(p);
    this.lanePt(x, y + Math.abs(p.ay)); this.lanePt(x + w + Math.abs(p.ax), y + Math.abs(p.ay));
    return p;
  },
  gem(x, y) {
    const g = { x, y, ph: Math.random() * 6.28 };
    if (this.fuelOn) {
      let i = 0;
      while (i < this.gates.length && this.gates[i].x <= x) i++;
      g.si = i;
      if (!this.counts[i]) this.counts[i] = { total: 0, taken: 0 };
      this.counts[i].total++;
    }
    this.gems.push(g);
  },
  maybePU(x, y) {
    if (!this.fuelOn) return;
    this.puGap++;
    if (this.puGap < 6 || Math.random() > 0.35) return;
    this.puGap = 0;
    let total = 0; for (const k in PU_WEIGHTS) total += PU_WEIGHTS[k];
    let r = Math.random() * total, kind = 'rocket';
    for (const k in PU_WEIGHTS) { r -= PU_WEIGHTS[k]; if (r <= 0) { kind = k; break; } }
    const item = { x, y, taken: false, ph: Math.random() * Math.PI * 2 };
    if (kind === 'rocket') rockets.push(item);
    else if (kind === 'glider') gliders.push(item);
    else if (kind === 'steady') steadies.push(item);
    else { item.kind = kind; oddities.push(item); }
  },
  gemArc(x0, x1, y, lift, n) {
    for (let i = 0; i < n; i++) {
      const f = n === 1 ? 0.5 : i / (n - 1);
      this.gem(x0 + (x1 - x0) * f, y - Math.sin(f * Math.PI) * lift);
    }
  },
  diff() {
    if (this.fuelOn) return Math.min(1, (this.level - 1) / 10 + Math.max(0, this.genX - 2500) / 200000);
    return Math.min(1, Math.max(0, (this.genX - 2500) / 40000));
  },
  bias(dy) {
    if (this.genY < -1600) return Math.abs(dy);
    if (this.genY > 500) return -Math.abs(dy);
    return dy;
  },

  // ── segments ─────────────────────────────────────────────
  flat(len, quiet) {
    this.block(this.genX, this.genY, len);
    if (!quiet) {
      if (Math.random() < 0.45) {
        const n = Math.min(6, Math.floor(len / 50));
        for (let i = 0; i < n; i++) this.gem(this.genX + 40 + i * 40, this.genY - 30);
      }
      if (len > 280 && Math.random() < 0.35) {
        const lx = this.genX + len * 0.25, ly = this.genY - rand(120, 180);
        this.plat(lx, ly, 100);
        this.gemArc(lx + 10, lx + 90, ly - 26, 0, 3);
      }
      if (Math.random() < 0.3) this.deco.push({ k: 'tree', x: this.genX + rand(30, len - 30), y: this.genY, s: rand(0.7, 1.3), hue: Math.floor(rand(190, 230)) });
      if (this.fuelOn && Math.random() < 0.14) this.cans.push({ x: this.genX + len * 0.6, y: this.genY - 18, ph: Math.random() * 6.28 });
      this.maybePU(this.genX + len * 0.8, this.genY - 16);
    }
    this.genX += len;
  },
  slope() {
    const len = rand(220, 520);
    const rise = this.bias(rand(-len * 0.5, len * 0.5));
    this.slopeSeg(this.genX, this.genY, this.genX + len, this.genY + rise);
    if (Math.random() < 0.4) this.gemArc(this.genX + 40, this.genX + len - 40, this.genY + rise / 2 - 40, 0, 4);
    this.genX += len;
    this.genY += rise;
    this.flat(rand(60, 140), true);
  },
  step() {
    const d = this.diff();
    const dy = rand(50, 110 + 40 * d);
    this.genY += this.bias(Math.random() < 0.55 ? -dy : dy);
    this.flat(rand(160, 320));
  },
  gap() {
    const d = this.diff();
    const w = rand(80, 150 + 230 * d);
    const dy = this.bias(rand(-100, 80));
    this.gemArc(this.genX + 10, this.genX + w - 10, this.genY - 40, 90, 5);
    this.genX += w;
    this.genY += dy;
    this.flat(rand(160, 300));
  },
  bridge() {
    const d = this.diff();
    const span = rand(260, 460 + 220 * d);
    const x0 = this.genX, x1 = this.genX + span, y = this.genY;
    this.deco.push({ k: 'post', x: x0, y }, { k: 'post', x: x1, y }, { k: 'rope', x0, x1, y });
    if (d < 0.2 || Math.random() < 0.5) {
      this.plat(x0, y, span, { bridge: true });
    } else {
      let x = x0;
      while (x < x1) {
        const pw = Math.min(rand(50, 120), x1 - x);
        if (pw > 12) this.plat(x, y, pw, { bridge: true });
        x += pw + rand(30, 50 + 40 * d);
      }
    }
    this.gemArc(x0 + 30, x1 - 30, y - 30, 0, Math.max(3, Math.floor(span / 70)));
    this.genX = x1;
    this.flat(rand(160, 260));
  },
  clearing() {
    const len = rand(600, 950);
    const x0 = this.genX, y = this.genY;
    this.block(x0, y, len);
    this.gemArc(x0 + 80, x0 + len * 0.45, y - 30, 110, 6);
    this.gemArc(x0 + len * 0.55, x0 + len - 80, y - 30, 110, 6);
    const lx = x0 + len * 0.4, ly = y - rand(170, 210);
    this.plat(lx, ly, 120);
    this.gemArc(lx + 10, lx + 110, ly - 28, 0, 4);
    for (let i = 0; i < 4; i++) this.deco.push({ k: 'tree', x: x0 + rand(40, len - 40), y, s: rand(0.8, 1.5), hue: Math.floor(rand(190, 230)) });
    this.puGap += 3;
    this.maybePU(x0 + len * 0.7, y - 16);
    if (this.fuelOn) this.cans.push({ x: x0 + len * 0.25, y: y - 18, ph: Math.random() * 6.28 });
    this.genX += len;
  },
  land(x, y) {
    this.genX = x + rand(90, 150);
    this.genY = y + this.bias(rand(-40, 60));
    this.flat(rand(220, 360));
  },
  challenge() {
    const d = this.diff();
    const kinds = [['stones', 3], ['pillars', 2], ['stairs', 1.5], ['drop', 1], ['elevator', d > 0.1 ? 1.2 : 0], ['movers', d > 0.08 ? 1.5 : 0]];
    let r = Math.random() * kinds.reduce((a, k) => a + k[1], 0), kind = 'stones';
    for (const [k, wgt] of kinds) { r -= wgt; if (r <= 0) { kind = k; break; } }
    let x = this.genX, y = this.genY;
    const yTop = this.genY - 420, yBot = this.genY + 220;
    if (kind === 'stones') {
      const n = 3 + Math.floor(rand(0, 2 + 4 * d));
      for (let i = 0; i < n; i++) {
        const px = x + rand(90, 150 + 90 * d);
        const w = rand(Math.max(40, 100 - 50 * d), 120 - 40 * d);
        y = Math.max(yTop, Math.min(yBot, y + rand(-110, 80)));
        const mover = Math.random() < 0.12 + 0.35 * d;
        this.plat(px, y, w, mover ? { ax: rand(30, 70), sp: rand(0.0015, 0.003) } : {});
        this.gem(px + w / 2, y - 34);
        x = px + w + (mover ? 70 : 0);
      }
      this.land(x, y);
    } else if (kind === 'pillars') {
      const n = 3 + Math.floor(rand(0, 3 + 2 * d));
      for (let i = 0; i < n; i++) {
        const px = x + rand(70, 130 + 70 * d);
        const w = rand(Math.max(34, 70 - 30 * d), 90);
        y = Math.max(yTop, Math.min(yBot, y + rand(-120, 100)));
        this.block(px, y, w, { steel: true });
        this.gem(px + w / 2, y - 34);
        x = px + w;
      }
      this.land(x, y);
    } else if (kind === 'stairs') {
      const n = 3 + Math.floor(rand(0, 3));
      for (let i = 0; i < n; i++) {
        const px = x + rand(40, 110 + 40 * d);
        const w = rand(90, 150);
        y = Math.max(yTop, y - rand(80, 140));
        this.block(px, y, w);
        this.gem(px + w / 2, y - 34);
        x = px + w;
      }
      this.genX = x; this.genY = y;
      this.flat(rand(220, 360));
    } else if (kind === 'drop') {
      const n = 3 + Math.floor(rand(0, 3));
      for (let i = 0; i < n; i++) {
        const px = x + rand(60, 140);
        const w = rand(80, 130);
        y = Math.min(yBot + 200, y + rand(90, 170));
        this.plat(px, y, w);
        this.gem(px + w / 2, y - 34);
        x = px + w;
      }
      this.land(x, y);
    } else if (kind === 'elevator') {
      const gapW = rand(260, 380), high = rand(220, 380);
      const px = x + gapW / 2 - 40;
      this.plat(px, y - high / 2, 80, { ay: high / 2 + 12, sp: 0.0012, lift: true });
      for (let i = 0; i < 4; i++) this.gem(px + 40, y - 40 - i * (high / 4));
      this.genX = x + gapW;
      this.genY = y - high;
      this.flat(rand(220, 320));
    } else {
      const span = rand(380, 600), n = span > 480 ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const cx = x + span * (i + 1) / (n + 1);
        const amp = span / (n + 1) / 2 - 20;
        this.plat(cx - 45, y + rand(-40, 20), 90, { ax: amp, sp: rand(0.0012, 0.002) });
        this.gem(cx, y - 70);
      }
      this.genX = x + span;
      this.genY = y + this.bias(rand(-50, 50));
      this.flat(rand(220, 360));
    }
  },
  nextSegment() {
    const d = this.diff();
    const early = this.genX < 2500;
    const opts = [
      ['flat', 1.5], ['slope', 3], ['step', 2], ['gap', 1.6 + d], ['bridge', early ? 0 : 1],
      ['clearing', early ? 0 : 0.5], ['challenge', early || this.last === 'challenge' ? 0 : 0.8 + 2.2 * d],
    ];
    let r = Math.random() * opts.reduce((a, o) => a + o[1], 0), pick = 'flat';
    for (const [k, wgt] of opts) { r -= wgt; if (r <= 0) { pick = k; break; } }
    if (pick === 'flat') this.flat(rand(200, 420));
    else this[pick]();
    this.last = pick;
  },
  generate() {
    while (this.genX < this.camX + this.vw * 2.5) {
      while (this.fuelOn && this.gateNext < this.genX + 4000) {
        this.gates.push({ x: this.gateNext });
        this.gateNext += this.GATE_LEN;
      }
      this.nextSegment();
    }
  },
  cull() {
    const cut = this.camX - this.vw * 1.5;
    if (cut - 40 > this.minX) this.minX = cut + 40;
    this.terrain = this.terrain.filter(p => p.x + p.w + Math.abs(p.ax || 0) > cut);
    this.lane = this.lane.filter(p => p.x > cut - 800);
    this.gems = this.gems.filter(g => !g.taken && g.x > cut);
    this.deco = this.deco.filter(o => (o.x1 || o.x) > cut);
    if (this.fuelOn) {
      this.cans = this.cans.filter(c => !c.taken && c.x > cut);
      rockets = rockets.filter(r => r.x > cut);
      gliders = gliders.filter(r => r.x > cut);
      steadies = steadies.filter(r => r.x > cut);
      oddities = oddities.filter(r => r.x > cut);
    }
  },
  abyssAt(x) {
    let m = -Infinity;
    for (const p of this.lane) if (p.x > x - 700 && p.x < x + 700 && p.y > m) m = p.y;
    if (m === -Infinity) m = this.genY;
    return m + this.ABYSS;
  },

  // ── physics: same numbers as the climb ────────────────────
  update(dt, ms) {
    this.view();
    const inp = getInput();
    const P = player;
    this.t += ms * worldRate();

    const steady = P.steadyTime > 0;
    const accel = steady ? STEADY_ACCEL : CFG.PLAYER_SPEED;
    P.vx += (inp.right ? accel : 0) - (inp.left ? accel : 0);
    P.vx *= steady ? STEADY_FRICTION : CFG.FRICTION;
    if (Math.abs(P.vx) < 0.05) P.vx = 0;

    if (P.rocketTimer > 0) {
      // rocket: blast forward along the course, slight climb, no gravity
      P.vx = 14;
      P.vy = -1.2;
      P.chute = false;
      P.fallTimer = 0;
    } else {
      let grav;
      if (P.chute) grav = P.hasGlider ? 0.16 : CFG.CHUTE_GRAVITY;
      else if (inp.jump && P.vy < 0 && P.vy > -4) grav = CFG.BUBBLE_GRAV;
      else grav = CFG.GRAVITY;
      P.vy += grav * dt;
      if (P.chute && P.hasGlider) {
        P.gliderTime -= ms;
        if (P.gliderTime <= 0) { P.gliderTime = 0; P.hasGlider = false; showBanner('GLIDER SPENT'); audio.triggers.spent(); }
      }
      if (P.chute && P.hasGlider) {
        if (inp.jumpPressed) P.vy = GLIDER_LIFT;
        if (inp.left || inp.right) {
          if (P.vy > GLIDER_DIVE_FALL) P.vy = GLIDER_DIVE_FALL;
          P.vx += (inp.right ? 1 : -1) * (steady ? 0.4 : 1.2);
        } else if (P.vy > GLIDER_MAX_FALL) P.vy = GLIDER_MAX_FALL;
      }
      const maxFall = P.chute ? (P.hasGlider ? GLIDER_DIVE_FALL : CFG.CHUTE_MAX_FALL) : CFG.MAX_FALL;
      if (P.vy > maxFall) P.vy = maxFall;
    }

    if (inp.jumpPressed && (P.onGround || P.coyoteTimer > 0)) {
      P.vy = CFG.JUMP_FORCE;
      P.onGround = false;
      P.coyoteTimer = 0;
      P.chute = false;
      P.fallTimer = 0;
      this.standOn = null;
      spawnJumpPuff(P.x + P.w / 2, P.y + P.h);
      audio.triggers.jump();
    }
    if (!P.onGround) P.coyoteTimer = Math.max(0, P.coyoteTimer - ms);

    // moving platforms, carrying whoever stands on them
    for (const p of this.terrain) {
      if (p.k !== 'plat' || !p.sp) continue;
      const s = Math.sin(this.t * p.sp + p.ph);
      const nx = p.bx + s * p.ax, ny = p.by + s * p.ay;
      p.dx = nx - p.x; p.dy = ny - p.y;
      p.x = nx; p.y = ny;
      if (this.standOn === p && P.onGround) { P.x += p.dx; P.y += p.dy; }
    }

    const wasOnGround = P.onGround;
    const prevFeet = P.y + P.h;

    // horizontal move against solid ground and steel
    P.x += P.vx * dt;
    if (P.x < this.minX) { P.x = this.minX; P.vx = 0; }
    for (const b of this.terrain) {
      if (b.k !== 'block') continue;
      if (P.x + P.w <= b.x || P.x >= b.x + b.w || P.y + P.h <= b.y || P.y >= b.y + b.h) continue;
      const pen = P.y + P.h - b.y;
      if (pen <= this.STEP && P.vy >= 0 && !b.wall) { P.y = b.y - P.h; continue; }
      if (P.x + P.w / 2 < b.x + b.w / 2) P.x = b.x - P.w; else P.x = b.x + b.w;
      P.vx = 0;
    }

    // vertical move
    P.y += P.vy * dt;
    P.onGround = false;
    this.standOn = null;
    let landedHue = null;
    const cx = P.x + P.w / 2;
    for (const s of this.terrain) {
      if (s.k !== 'slope' || cx < s.x0 || cx > s.x1 || P.vy < 0) continue;
      const g = (s.y1 - s.y0) / (s.x1 - s.x0);
      const sy = s.y0 + g * (cx - s.x0);
      const feet = P.y + P.h;
      const reach = Math.abs(P.vx * g) * dt;
      const up = wasOnGround ? 8 + reach : 0;
      if (feet >= sy - up && feet <= sy + 18 + P.vy * dt + reach) {
        P.y = sy - P.h;
        if (!wasOnGround) landedHue = s.hue;
        P.onGround = true;
      }
    }
    for (const b of this.terrain) {
      if (b.k !== 'block') continue;
      if (P.x + P.w <= b.x || P.x >= b.x + b.w || P.y + P.h <= b.y || P.y >= b.y + b.h) continue;
      if (P.vy >= 0) {
        P.y = b.y - P.h;
        if (!wasOnGround) landedHue = b.steel ? 215 : b.hue;
        P.onGround = true;
      } else {
        P.y = b.y + b.h;
        P.vy = 1;
        audio.triggers.bonk();
      }
    }
    for (const p of this.terrain) {
      if (p.k !== 'plat' || P.vy < 0) continue;
      if (P.x + P.w <= p.x || P.x >= p.x + p.w) continue;
      const feet = P.y + P.h;
      if (feet >= p.y && prevFeet <= p.y + 4 + Math.abs(p.dy) + Math.max(0, -p.dy)) {
        P.y = p.y - P.h;
        if (!wasOnGround) landedHue = p.bridge ? 30 : p.hue;
        P.onGround = true;
        this.standOn = p;
      }
    }
    if (P.onGround) {
      if (landedHue !== null && P.vy > 2) {
        audio.triggers.land(P.vy);
        spawnSplash(cx, P.y + P.h, landedHue);
      }
      P.vy = 0;
      P.fallTimer = 0;
      if (P.chute) { P.chute = false; audio.triggers.chuteClose(); }
      this.dropping = false;
    }
    if (wasOnGround && !P.onGround && P.vy >= 0) P.coyoteTimer = CFG.COYOTE_MS;
    if (P.vx > 0.1) P.facing = 1;
    if (P.vx < -0.1) P.facing = -1;

    // parachute, same rule as the climb
    if (!P.onGround && P.vy > 0 && P.rocketTimer <= 0) {
      P.fallTimer += ms / 1000;
      if (!P.chute && P.fallTimer >= (P.hasGlider ? 0.35 : CFG.CHUTE_DEPLOY_S)) { P.chute = true; P.hasGlider ? audio.triggers.glider() : audio.triggers.chuteOpen(); }
    }

    // abyss: drop back out of the sky above this spot
    const abyss = this.abyssAt(cx);
    if (P.y > abyss) {
      this.falls++;
      this.dropping = true;
      this.camY = abyss + 40 - this.vh;
      P.y = this.camY - P.h - 10;
      P.vy = 2;
      P.vx *= 0.3;
      P.chute = false;
      P.fallTimer = 0;
      warpFlash = 0.8;
      audio.triggers.warp();
      showBanner('CATCH THE LEDGE');
    }

    // distance score
    const m = Math.floor(P.x / this.UNIT);
    if (m > score) {
      score = m;
      if (this.fuelOn) {
        if (score > bestFuel) { bestFuel = score; localStorage.setItem('bestFuel', bestFuel); LB.queue(); }
      } else if (score > bestSide) {
        bestSide = score;
        localStorage.setItem('bestSide', bestSide);
        LB.queue();
      }
    }
    const z = zoneAt(score);
    if (z.i !== this.zi || z.lap !== this.zl) {
      this.zi = z.i; this.zl = z.lap;
      showBanner('ZONE ' + (z.lap * ZONES.length + z.i + 1) + ' ' + ZONES[z.i].name);
      audio.triggers.zone();
    }

    // gems
    const pcy = P.y + P.h / 2;
    for (const g of this.gems) {
      if (g.taken) continue;
      const dx = cx - g.x, dy = pcy - g.y;
      if (dx * dx + dy * dy < 22 * 22) {
        g.taken = true;
        this.gemCount++;
        if (this.fuelOn) {
          this.fuel = Math.min(100, this.fuel + 1.5);
          if (this.counts[g.si]) this.counts[g.si].taken++;
        }
        audio.triggers.gem();
        for (let i = 0; i < 10; i++) {
          const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3.5;
          particles.push({ x: g.x, y: g.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.035, size: 2 + Math.random() * 2, hue: 200 + Math.random() * 40, type: 'splash' });
        }
      }
    }

    if (this.fuelOn && this.fuelTick(ms, cx, pcy)) return;

    // camera: leads to the right, never shows below the abyss
    const k = Math.min(1, 0.2 * dt), kv = Math.min(1, 0.12 * dt);
    this.camX += (P.x - this.vw * 0.3 - this.camX) * k;
    const floor = abyss + 40 - this.vh;
    const ty = this.dropping ? floor : Math.min(P.y - this.vh * 0.55, floor);
    this.camY += (ty - this.camY) * kv;

    this.generate();
    this.cull();
    GHOST.record(ms);
  },

  // ── drawing ──────────────────────────────────────────────
  sky() {
    const lap = Math.floor(score / ZONE_CYCLE), r = score - lap * ZONE_CYCLE;
    let i = 0;
    for (let q = 0; q < ZONES.length; q++) if (r >= ZONES[q].at) i = q;
    const nextAt = i + 1 < ZONES.length ? ZONES[i + 1].at : ZONE_CYCLE;
    const j = (i + 1) % ZONES.length;
    const t = Math.max(0, Math.min(1, (r - (nextAt - 80)) / 80));
    return { top: mixHex(ZONES[i].top, ZONES[j].top, t), bot: mixHex(ZONES[i].bot, ZONES[j].bot, t), Z: ZONES[i] };
  },
  render(time) {
    const z = this.sky();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, z.top); g.addColorStop(1, z.bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // stars in the dark zones
    if (z.Z.starA > 0.5) {
      ctx.fillStyle = '#cfe0ff';
      for (let i = 0; i < 60; i++) {
        const sx = ((i * 97.3 - this.camX * 0.05 * this.S) % W + W) % W;
        const sy = (i * 53.7) % (H * 0.7);
        ctx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(time * 0.002 + i));
        ctx.fillRect(sx, sy, 2, 2);
      }
      ctx.globalAlpha = 1;
    }
    // two parallax hill layers in blue
    [[0.15, 0.62, 0.18, 70], [0.35, 0.74, 0.28, 50]].forEach(([par, base, alpha, amp]) => {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#3d8bff';
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 10) {
        const wx = x + this.camX * par * this.S;
        ctx.lineTo(x, H * base + Math.sin(wx * 0.006) * amp + Math.sin(wx * 0.017) * amp * 0.35);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.scale(this.S, this.S);
    ctx.translate(-this.camX, -this.camY);
    const x0 = this.camX - 30, x1 = this.camX + this.vw + 30, yB = this.camY + this.vh + 20;

    // decorations behind
    for (const o of this.deco) {
      if ((o.x1 || o.x) < x0 || (o.x0 || o.x) > x1) continue;
      if (o.k === 'tree') {
        const s = o.s;
        ctx.fillStyle = '#2b3a66';
        ctx.fillRect(o.x - 3 * s, o.y - 34 * s, 6 * s, 34 * s);
        ctx.fillStyle = 'hsl(' + o.hue + ', 70%, 45%)';
        ctx.beginPath();
        ctx.moveTo(o.x, o.y - 80 * s); ctx.lineTo(o.x + 22 * s, o.y - 30 * s); ctx.lineTo(o.x - 22 * s, o.y - 30 * s);
        ctx.closePath(); ctx.fill();
      } else if (o.k === 'post') {
        ctx.fillStyle = '#5a4128';
        ctx.fillRect(o.x - 4, o.y - 40, 8, 40);
        ctx.fillStyle = '#3d8bff';
        ctx.fillRect(o.x - 5, o.y - 44, 10, 5);
      } else if (o.k === 'rope') {
        ctx.strokeStyle = '#3d8bff'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(o.x0, o.y - 40);
        ctx.quadraticCurveTo((o.x0 + o.x1) / 2, o.y - 10, o.x1, o.y - 40);
        ctx.stroke();
      }
    }

    // terrain
    for (const p of this.terrain) {
      if (p.x + p.w + Math.abs(p.ax || 0) < x0 || p.x > x1) continue;
      const hue = ((p.hue || 0) + time * 0.01) % 360;
      if (p.k === 'block') {
        if (p.y > yB) continue;
        const bot = Math.min(p.y + p.h, yB);
        if (p.steel) {
          ctx.fillStyle = '#5b6b8c';
          ctx.fillRect(p.x, p.y, p.w, bot - p.y);
          ctx.save();
          ctx.beginPath(); ctx.rect(p.x, p.y, p.w, Math.min(bot - p.y, 900)); ctx.clip();
          ctx.fillStyle = '#3d8bff';
          for (let sy = p.y; sy < Math.min(bot, p.y + 900); sy += 26) {
            ctx.beginPath();
            ctx.moveTo(p.x, sy + 10); ctx.lineTo(p.x + p.w, sy - 4); ctx.lineTo(p.x + p.w, sy + 4); ctx.lineTo(p.x, sy + 18);
            ctx.closePath(); ctx.fill();
          }
          ctx.restore();
          ctx.fillStyle = '#d7e3ff';
          ctx.fillRect(p.x, p.y, p.w, 3);
          ctx.strokeStyle = '#1b2440'; ctx.lineWidth = 2;
          ctx.strokeRect(p.x + 1, p.y + 1, p.w - 2, Math.min(bot - p.y, 900) - 2);
          continue;
        }
        const gg = ctx.createLinearGradient(0, p.y, 0, p.y + 420);
        gg.addColorStop(0, '#2b3a66'); gg.addColorStop(1, '#0d1222');
        ctx.fillStyle = gg;
        ctx.fillRect(p.x, p.y, p.w, bot - p.y);
        this.edge(p.x, p.y, p.x + p.w, p.y, hue, time);
      } else if (p.k === 'slope') {
        const gg = ctx.createLinearGradient(0, Math.min(p.y0, p.y1), 0, Math.min(p.y0, p.y1) + 420);
        gg.addColorStop(0, '#2b3a66'); gg.addColorStop(1, '#0d1222');
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.moveTo(p.x0, p.y0); ctx.lineTo(p.x1, p.y1); ctx.lineTo(p.x1, yB); ctx.lineTo(p.x0, yB);
        ctx.closePath(); ctx.fill();
        this.edge(p.x0, p.y0, p.x1, p.y1, hue, time);
      } else if (p.bridge) {
        ctx.fillStyle = '#8a6a48';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#5a4128';
        for (let bx = p.x + 12; bx < p.x + p.w; bx += 14) ctx.fillRect(bx, p.y, 2, p.h);
        ctx.fillStyle = '#3d8bff';
        ctx.fillRect(p.x, p.y + p.h - 2, p.w, 2);
      } else {
        const breathe = 0.2 + 0.18 * Math.abs(Math.sin(time * 0.002 + (p.hue || 0)));
        ctx.globalAlpha = breathe;
        ctx.fillStyle = 'hsl(' + hue + ', 100%, 55%)';
        ctx.fillRect(p.x - 4, p.y - 3, p.w + 8, p.h + 8);
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'hsl(' + hue + ', 35%, 18%)';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = p.lift ? '#3d8bff' : 'hsl(' + hue + ', 100%, 62%)';
        ctx.fillRect(p.x, p.y, p.w, 2);
        if (p.sp) {
          ctx.fillStyle = '#3d8bff';
          ctx.fillRect(p.x + p.w / 2 - 6, p.y + p.h, 12, 3);
        }
      }
    }

    // gems
    for (const gm of this.gems) {
      if (gm.x < x0 || gm.x > x1) continue;
      const y = gm.y + Math.sin(time * 0.003 + gm.ph) * 4;
      const pulse = 0.7 + 0.3 * Math.abs(Math.sin(time * 0.006 + gm.ph));
      ctx.globalAlpha = 0.35 * pulse;
      ctx.fillStyle = '#6fb0ff';
      ctx.beginPath(); ctx.arc(gm.x, y, 12, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'hsl(215, 95%, ' + (50 + pulse * 20) + '%)';
      ctx.beginPath();
      ctx.moveTo(gm.x, y - 8); ctx.lineTo(gm.x + 6, y); ctx.lineTo(gm.x, y + 8); ctx.lineTo(gm.x - 6, y);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.moveTo(gm.x, y - 8); ctx.lineTo(gm.x + 3, y - 2); ctx.lineTo(gm.x - 3, y - 2);
      ctx.closePath(); ctx.fill();
    }

    // the abyss
    const ay = this.abyssAt(this.camX + this.vw * 0.3);
    const fog = ctx.createLinearGradient(0, ay - 260, 0, ay + 40);
    fog.addColorStop(0, 'rgba(4,8,20,0)');
    fog.addColorStop(1, 'rgba(4,8,20,0.95)');
    ctx.fillStyle = fog;
    ctx.fillRect(this.camX - 10, ay - 260, this.vw + 20, 300);
    ctx.fillStyle = '#04060d';
    ctx.fillRect(this.camX - 10, ay + 40, this.vw + 20, 2000);
    ctx.fillStyle = '#3d8bff';
    for (let i = 0; i < 24; i++) {
      const gx = this.camX + ((i * 131 + time * 0.02 * (i % 3 + 1)) % (this.vw + 20));
      ctx.globalAlpha = 0.2 + 0.4 * Math.abs(Math.sin(time * 0.003 + i));
      ctx.fillRect(gx, ay + 10 - (i % 5) * 14, 2, 2);
    }
    ctx.globalAlpha = 1;

    if (this.fuelOn) this.drawFuelWorld(time);
    drawParticles();
    GHOST.draw(time);
    if (player.chute) { if (player.hasGlider) drawGliderWing(); else drawParachute(); }

    const P = player;
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = P.rocketTimer > 0 ? 'hsl(' + (20 + Math.sin(time * 0.02) * 15) + ', 100%, 60%)' : '#ffffff';
    ctx.fillRect(P.x - 2, P.y - 2, P.w + 4, P.h + 4);
    ctx.globalAlpha = 1;
    ctx.fillStyle = P.rocketTimer > 0 ? CFG.PLAYER : z.Z.player;
    ctx.fillRect(P.x, P.y, P.w, P.h);
    if (P.rocketTimer > 0) {
      ctx.fillStyle = '#ff4422';
      ctx.beginPath();
      ctx.moveTo(P.x + P.w, P.y); ctx.lineTo(P.x + P.w + 12, P.y + P.h / 2); ctx.lineTo(P.x + P.w, P.y + P.h);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(P.x - 5, P.y - 4, 8, 5);
      ctx.fillRect(P.x - 5, P.y + P.h - 1, 8, 5);
      for (let i = 0; i < 3; i++) particles.push({ x: P.x, y: P.y + P.h / 2 + (Math.random() - 0.5) * 8, vx: -3 - Math.random() * 3, vy: (Math.random() - 0.5) * 1.5, life: 1, decay: 0.06, size: 2.5 + Math.random() * 3, hue: 18 + Math.random() * 35, type: 'splash' });
    }
    ctx.fillStyle = '#3d8bff';
    ctx.fillRect(P.facing > 0 ? P.x + P.w - 5 : P.x + 2, P.y + 5, 3, 3);
    ctx.restore();

    staticFx.draw(16.67 * worldRate());
    if (P.slowTime > 0) {
      const sg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
      sg.addColorStop(0, 'rgba(61,139,255,0)');
      sg.addColorStop(1, 'rgba(61,139,255,0.35)');
      ctx.fillStyle = sg;
      ctx.fillRect(0, 0, W, H);
    }

    if (warpFlash > 0) {
      ctx.globalAlpha = warpFlash;
      ctx.fillStyle = '#bfe0ff';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      warpFlash = Math.max(0, warpFlash - 0.04);
    }

    ctx.shadowColor = 'rgba(0,0,0,0.75)';
    ctx.shadowBlur = 3;
    this.hud();
    if (this.fuelOn) this.fuelHud();
    GHOST.hud();
    drawBanner();
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    drawTouchHints();
  },
  edge(ax, ay, bx, by, hue, time) {
    ctx.strokeStyle = 'hsl(' + hue + ', 100%, 62%)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ax, ay + 1); ctx.lineTo(bx, by + 1); ctx.stroke();
    ctx.strokeStyle = '#3d8bff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay + 4); ctx.lineTo(bx, by + 4); ctx.stroke();
    const len = Math.hypot(bx - ax, by - ay), n = Math.floor(len / 22);
    for (let i = 0; i < n; i++) {
      const f = (i + 0.5) / n;
      ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(time * 0.003 + i * 0.7 + hue));
      ctx.fillStyle = 'hsl(' + ((hue + i * 25) % 360) + ', 100%, 75%)';
      ctx.fillRect(ax + (bx - ax) * f, ay + (by - ay) * f + 8, 2, 2);
    }
    ctx.globalAlpha = 1;
  },
  hud() {
    ctx.textAlign = 'right';
    ctx.fillStyle = CFG.SCORE_COL;
    ctx.font = 'bold 16px monospace';
    ctx.fillText(score + 'm', W - 14, 28);
    ctx.fillStyle = CFG.UI_DIM;
    ctx.font = '11px monospace';
    ctx.fillText('best ' + (this.fuelOn ? bestFuel : bestSide) + 'm', W - 14, 46);
    ctx.fillStyle = '#6fb0ff';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('◆ ' + this.gemCount, W - 14, 66);
    ctx.fillStyle = '#3d8bff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('falls ' + this.falls, W - 14, 84);
    if (!player.onGround && !player.chute && player.vy > 0) {
      const pct = Math.min(player.fallTimer / CFG.CHUTE_DEPLOY_S, 1);
      ctx.fillStyle = '#222233';
      ctx.fillRect(14, 14, 60, 6);
      ctx.fillStyle = pct > 0.7 ? CFG.CHUTE : '#5566aa';
      ctx.fillRect(14, 14, 60 * pct, 6);
      ctx.fillStyle = CFG.UI_DIM;
      ctx.font = '9px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('chute', 14, 31);
    }
  },
};

// ════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════
function initGame() {
  platforms       = [];
  rockets         = [];
  steadies        = [];
  oddities        = [];
  staticFx.on     = false;
  gliders         = [];
  gems            = [];
  gemCount        = 0;
  nextGemMilestone  = 30;
  nextCoinMilestone = 30;
  banner.t        = 0;
  coins           = [];
  coinCount       = 0;
  coinSpawnY      = 0;
  cameraY         = 0;
  score           = 0;
  highestPlatY    = 0;
  worldGenBottom  = 800;
  tokenNeed       = 1;
  tokenWrongT     = 0;
  zoneIdx = 0; zoneLap = 0; zoneFeel.grav = 1; zoneFeel.wind = 1;
  levelDoneT = 0;
  levelTime = 0;
  blaze = [];
  lives = GAUNTLET_LIVES; checkpoint = null; invulnT = 0; turrets = []; bullets = [];
  jewels = []; jewelScore = 0; jewelPlat = 0; for (const k in jewelSets) delete jewelSets[k];
  platsSincePU = Math.floor(POWERUP_GAP / 2);
  applyDifficulty();
  warpFlash       = 0;
  resetTokens();
  if (sideLike()) { initPlayer(); SIDE.init(); GHOST.reset(); return; }
  addGround();
  generateUpTo(-H * 2);
  initPlayer();
  GHOST.reset();
}

// ════════════════════════════════════════════════════════════
//  PHYSICS
// ════════════════════════════════════════════════════════════
function updatePhysics(dt, ms) {
  const inp = getInput();

  // Horizontal
  const steady = player.steadyTime > 0;
  const accel = steady ? STEADY_ACCEL : CFG.PLAYER_SPEED;
  if (inp.left)  player.vx -= accel;
  if (inp.right) player.vx += accel;

  // Wind push - only while airborne, doubled under canopy
  if (!player.onGround) {
    const windMult = player.chute ? 2.2 : 1.0;
    player.vx += wind.force * windMult * zoneFeel.wind * (steady ? 0.5 : 1) * dt;
  }

  player.vx *= steady ? STEADY_FRICTION : CFG.FRICTION;
  if (Math.abs(player.vx) < 0.05) player.vx = 0;

  // Gravity - none during rocket flight, bubble at apex when holding jump, reduced under chute
  if (player.rocketTimer > 0) {
    // rocket controls vy directly in updateRockets - no gravity
  } else {
    let grav;
    if (player.chute) {
      grav = player.hasGlider ? 0.16 : CFG.CHUTE_GRAVITY;
    } else if (inp.jump && player.vy < 0 && player.vy > -4) {
      grav = CFG.BUBBLE_GRAV;
    } else {
      grav = CFG.GRAVITY;
    }
    player.vy += grav * zoneFeel.grav * dt;

    // Glider controls (active while deployed and hasGlider)
    if (player.chute && player.hasGlider) {
      // Flight time limit: glider burns out after GLIDER_TIME ms of flying
      player.gliderTime -= ms;
      if (player.gliderTime <= 0) {
        player.gliderTime = 0;
        player.hasGlider = false;
        showBanner('GLIDER SPENT');
        audio.triggers.spent();
      }
    }
    if (player.chute && player.hasGlider) {
      // Lift pulse: tap jump to swoop up a little (grab missed coins)
      if (inp.jumpPressed) {
        player.vy = GLIDER_LIFT;
      }
      // Dive: holding a direction tilts nose down = faster fall + extra h-speed
      if (inp.left || inp.right) {
        if (player.vy > GLIDER_DIVE_FALL) player.vy = GLIDER_DIVE_FALL;
        player.vx += (inp.right ? 1 : -1) * (steady ? 0.4 : 1.2);
      } else {
        if (player.vy > GLIDER_MAX_FALL) player.vy = GLIDER_MAX_FALL;
      }
    }
  }

  // Terminal velocity
  let maxFall;
  if (player.chute) {
    maxFall = player.hasGlider ? GLIDER_DIVE_FALL : CFG.CHUTE_MAX_FALL;
  } else {
    maxFall = CFG.MAX_FALL;
  }
  if (player.vy > maxFall) player.vy = maxFall;

  // Jump - uses coyote time
  const canJump = player.onGround || player.coyoteTimer > 0;
  if (inp.jumpPressed && canJump) {
    player.vy = CFG.JUMP_FORCE;
    player.onGround  = false;
    player.coyoteTimer = 0;
    player.chute     = false;
    player.fallTimer = 0;
    spawnJumpPuff(player.x + player.w / 2, player.y + player.h);
    audio.triggers.jump();
  }

  // Long fall: warp straight to the ground so a new climb starts fast
  if (mode !== 'gauntlet' && !player.onGround && player.vy > 0 && player.rocketTimer <= 0 && player.y < -300) {
    player.dropT = (player.dropT || 0) + ms;
    if (player.dropT > FALL_WARP_MS) {
      player.dropT = 0;
      warpFlash = 1;
      audio.triggers.warp();
      showBanner('⬇ BACK TO THE GROUND');
      respawnFromY();
      return;
    }
  } else {
    player.dropT = 0;
  }

  // Coyote countdown
  if (!player.onGround) {
    player.coyoteTimer -= ms;
    if (player.coyoteTimer < 0) player.coyoteTimer = 0;
  }

  // Move
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // Facing
  if (player.vx >  0.1) player.facing =  1;
  if (player.vx < -0.1) player.facing = -1;

  // Solid blocks: bonk your head instead of passing through (rockets punch through)
  if (player.vy < 0 && player.rocketTimer <= 0) {
    const prevTop = player.y - player.vy * dt;
    for (const p of platforms) {
      if (!p.solid) continue;
      if (player.x + player.w <= p.x + 2 || player.x >= p.x + p.w - 2) continue;
      const bottom = p.y + p.h;
      if (prevTop >= bottom - 1 && player.y < bottom) {
        player.y = bottom;
        player.vy = 1;
        audio.triggers.bonk();
        for (let i = 0; i < 6; i++) particles.push({
          x: player.x + player.w / 2, y: bottom, vx: (Math.random() - 0.5) * 4, vy: Math.random() * 2,
          life: 1, decay: 0.05, size: 1.5 + Math.random() * 1.5, hue: 210, type: 'splash',
        });
        break;
      }
    }
  }

  // Horizontal wrap
  if (player.x + player.w < 0)  player.x = W;
  if (player.x > W)              player.x = -player.w;

  // ── Platform collision ──────────────────────────────────
  const wasOnGround = player.onGround;
  player.onGround = false;

  for (const p of platforms) {
    if (
      player.x + player.w > p.x &&
      player.x            < p.x + p.w &&
      player.vy >= 0 &&
      player.y + player.h >= p.y &&
      player.y + player.h <= p.y + p.h + player.vy * dt + 4
    ) {
      // Landing splash + cloud in this platform's color (only on real impact)
      if (!player.onGround && player.vy > 2) {
        audio.triggers.land(player.vy);
        spawnSplash(player.x + player.w / 2, p.y, p.hue !== undefined ? p.hue : 230);
        // Extra ring of sparks proportional to impact speed
        const extra = Math.min(Math.floor(player.vy * 2), 20);
        for (let ei = 0; ei < extra; ei++) {
          const a = Math.PI + (ei / extra) * Math.PI; // upward fan
          const sp = 3 + Math.random() * 4;
          particles.push({
            x: player.x + player.w / 2, y: p.y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6,
            life: 1, decay: 0.025,
            size: 1.5 + Math.random() * 2,
            hue: Math.random() * 360,
            type: 'splash',
          });
        }
      }

      player.y        = p.y - player.h;
      player.vy       = 0;
      player.onGround = true;
      player.fallTimer = 0;
      if (p.vx) player.x += p.vx * dt;  // carried by moving platform

      // Collapse chute on landing
      if (player.chute) {
        player.chute = false;
        audio.triggers.chuteClose();
      }

      // Landed on a rescue platform OR back on bare ground after a fall -
      // respawn fresh platforms above
      if (mode !== 'gauntlet' && (p.isRescue || (p.isGround && player.peakY < -300))) {
        respawnFromY();
        return;
      }
    }
  }

  // Coyote: just walked off an edge
  if (wasOnGround && !player.onGround) {
    player.coyoteTimer = CFG.COYOTE_MS;
  }

  // ── Parachute logic ─────────────────────────────────────
  if (!player.onGround && player.vy > 0 && player.rocketTimer <= 0) {
    player.fallTimer += ms / 1000;
    if (!player.chute && mode !== 'gauntlet' && player.fallTimer >= CFG.CHUTE_DEPLOY_S) {
      player.chute = true;
      audio.triggers.chuteOpen();
    }
  } else if (player.onGround) {
    player.fallTimer = 0;
  }

  // ── Camera follows player in both directions ─────────────
  const targetCamY = player.y - H * 0.45;
  cameraY = targetCamY;
  // Clamp: never scroll below world origin (ground level)
  if (cameraY > 0) cameraY = 0;

  // ── Track peak height ───────────────────────────────────
  if (player.y < player.peakY) player.peakY = player.y;

  // ── Score: highest point reached ─────────────────────────
  const height = Math.floor(-player.y / 10);
  if (height > score) {
    score = height;
    if (mode === 'climb' && score > best) {
      best = score;
      localStorage.setItem('best', best);
      LB.queue();
    }
  }

  if (mode !== 'gauntlet') updateZone();
  GHOST.record(ms);

  // ── Generate more world ahead ────────────────────────────
  // Keep platforms generated at least one screen above the camera top
  generateUpTo(cameraY - H);

  // Generate rescue platforms only when player has actually fallen below ground
  if (player.y > 200) {
    const visibleBottom = cameraY + H + H;
    if (visibleBottom > worldGenBottom) {
      generateBelow(worldGenBottom);
    }
  }

  cullPlatforms();
}

// ════════════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════════════
function render(time) {
  time = time || 0;
  ctx.fillStyle = CFG.BG;
  ctx.fillRect(0, 0, W, H);

  if (state === STATE.MENU) { drawMenu(); return; }
  if (state === STATE.DEAD)  { drawDead(); return; }
  if (state === STATE.RESULT) { drawResult(); return; }
  if (sideLike()) { SIDE.render(time); return; }

  drawZoneSky();

  // Sky tint shifts toward dawn-blue inside the cloud zone
  const cf = cloudFactor();
  if (cf > 0) {
    ctx.fillStyle = 'rgba(70, 90, 160, ' + (0.18 * cf) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // Parallax starfield + grid (screen-space, scrolls with cameraY)
  if (mode === 'gauntlet') {
    drawIndustrialBG(time);
  } else {
    drawStarfield(time);
    drawClouds(time);
    drawMotes(time);
  }
  drawStreaks();
  drawShooters();

  // ── Camera transform ────────────────────────────────────
  ctx.save();
  ctx.translate(0, -cameraY);

  // Platforms - each with its own neon hue, glow strip, LED sparkle dots
  for (const p of platforms) {
    const screenY = p.y - cameraY;
    if (screenY > H + 20 || screenY + p.h < -20) continue;

    if (p.isGround) {
      ctx.fillStyle = CFG.PLAT;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = CFG.PLAT_TOP;
      ctx.fillRect(p.x, p.y, p.w, 2);
      continue;
    }

    if (p.solid) { drawSolid(p, time); continue; }
    if (mode === 'gauntlet') { drawGirder(p, time); continue; }

    // Slow hue drift + breathing glow
    const hue = ((p.hue !== undefined ? p.hue : 230) + time * 0.01) % 360;
    const breathe = 0.2 + 0.18 * Math.abs(Math.sin(time * 0.002 + (p.hue || 0)));

    // Soft glow under the platform - pulses
    ctx.globalAlpha = breathe;
    ctx.fillStyle = 'hsl(' + hue + ', 100%, 55%)';
    ctx.fillRect(p.x - 4, p.y - 3, p.w + 8, p.h + 8);
    ctx.globalAlpha = breathe * 0.5;
    ctx.fillRect(p.x - 8, p.y - 6, p.w + 16, p.h + 14);
    ctx.globalAlpha = 1;

    // Dark body
    ctx.fillStyle = 'hsl(' + hue + ', 35%, 18%)';
    ctx.fillRect(p.x, p.y, p.w, p.h);

    // Bright neon top edge
    ctx.fillStyle = 'hsl(' + hue + ', 100%, 62%)';
    ctx.fillRect(p.x, p.y, p.w, 2);

    // LED sparkle dots that chase along the edge
    const ledCount = Math.floor(p.w / 18);
    for (let li = 0; li < ledCount; li++) {
      const phase = (time * 0.003 + li * 0.7 + hue) % (Math.PI * 2);
      const bright = 0.3 + 0.7 * Math.abs(Math.sin(phase));
      ctx.globalAlpha = bright;
      ctx.fillStyle = 'hsl(' + ((hue + li * 25) % 360) + ', 100%, 75%)';
      ctx.fillRect(p.x + 6 + li * 18, p.y + 4, 2, 2);
    }
    ctx.globalAlpha = 1;

    // Rescue platforms pulse red
    if (p.isRescue) {
      ctx.globalAlpha = 0.3 + 0.3 * Math.abs(Math.sin(time * 0.005));
      ctx.fillStyle = '#ff2233';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.globalAlpha = 1;
    }
  }

  drawFinishLine();
  drawJewels(time);
  drawTurrets(time);
  drawBlaze();
  GHOST.draw(time);

  // Player comet trail (world space, under everything else)
  drawTrail();

  // Rocket pickups
  drawRockets(time);
  drawSteadies(time);
  drawOddities(time);
  drawGliders(time);
  drawGems(time);
  drawTokens(time);

  // Coins (descent minigame)
  drawCoins(time);

  // Particles (world-space, under player)
  drawParticles();

  // Parachute or glider
  if (player.chute) {
    if (player.hasGlider) drawGliderWing();
    else drawParachute();
  }

  if (mode === 'gauntlet' && invulnT > 0 && Math.floor(invulnT / 100) % 2) ctx.globalAlpha = 0.35;
  // Player - rocket shape during flight, box otherwise
  if (player.rocketTimer > 0) {
    const cx = player.x + player.w / 2;
    // Hot glow
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = 'hsl(' + (20 + Math.sin(time * 0.02) * 15) + ', 100%, 60%)';
    ctx.fillRect(player.x - 4, player.y - 8, player.w + 8, player.h + 12);
    ctx.globalAlpha = 1;
    // Body
    ctx.fillStyle = CFG.PLAYER;
    ctx.fillRect(player.x, player.y, player.w, player.h);
    // Nose cone
    ctx.fillStyle = '#ff4422';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(cx, player.y - 12);
    ctx.lineTo(player.x + player.w, player.y);
    ctx.closePath();
    ctx.fill();
    // Fins
    ctx.fillStyle = '#ff4422';
    ctx.fillRect(player.x - 5, player.y + player.h - 8, 5, 8);
    ctx.fillRect(player.x + player.w, player.y + player.h - 8, 5, 8);
    // Window
    ctx.fillStyle = '#44ccff';
    ctx.beginPath();
    ctx.arc(cx, player.y + 7, 3, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(player.x - 2, player.y - 2, player.w + 4, player.h + 4);
    ctx.globalAlpha = 1;
    ctx.fillStyle = theme().player;
    ctx.fillRect(player.x, player.y, player.w, player.h);
  }

  ctx.globalAlpha = 1;
  ctx.restore();

  staticFx.draw(16.67 * worldRate());
  if (player && player.slowTime > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(61,139,255,0)');
    g.addColorStop(1, 'rgba(61,139,255,0.35)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  if (warpFlash > 0) {
    ctx.globalAlpha = warpFlash;
    ctx.fillStyle = '#bfe0ff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    warpFlash = Math.max(0, warpFlash - 0.04);
  }
  ctx.shadowColor = 'rgba(0,0,0,0.75)';
  ctx.shadowBlur = 3;
  drawHUD();
  drawLives();
  GHOST.hud();
  drawTokenArrow(time);
  drawBanner();
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  drawTouchHints();
}

function drawGliderWing() {
  const cx = player.x + player.w / 2;
  const topY = player.y - 16;
  // Tilt with horizontal velocity
  const tilt = Math.max(-0.4, Math.min(0.4, player.vx * 0.06));
  ctx.save();
  ctx.translate(cx, topY);
  ctx.rotate(tilt);
  // Swept delta wing
  ctx.fillStyle = '#22ddee';
  ctx.beginPath();
  ctx.moveTo(-26, 6);
  ctx.lineTo(0, -8);
  ctx.lineTo(26, 6);
  ctx.lineTo(0, 1);
  ctx.closePath();
  ctx.fill();
  // Wing highlight
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.moveTo(-26, 6);
  ctx.lineTo(0, -8);
  ctx.lineTo(0, -3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  // Rigging lines
  ctx.strokeStyle = '#0aa8bb';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 14, topY + 5);
  ctx.lineTo(player.x + 2, player.y);
  ctx.moveTo(cx + 14, topY + 5);
  ctx.lineTo(player.x + player.w - 2, player.y);
  ctx.stroke();
}

function drawParachute() {
  const cx = player.x + player.w / 2;
  const topY = player.y - 38;

  // Canopy - simple arc
  ctx.fillStyle = CFG.CHUTE;
  ctx.beginPath();
  ctx.arc(cx, topY, 22, Math.PI, 0);
  ctx.closePath();
  ctx.fill();

  // Canopy highlight
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.arc(cx - 5, topY - 4, 9, Math.PI, 0);
  ctx.closePath();
  ctx.fill();

  // Lines from canopy to player shoulders
  ctx.strokeStyle = CFG.CHUTE_LINE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 20, topY + 2);
  ctx.lineTo(player.x + 2, player.y);
  ctx.moveTo(cx + 20, topY + 2);
  ctx.lineTo(player.x + player.w - 2, player.y);
  ctx.stroke();
}

function drawHUD() {
  // Score
  ctx.fillStyle = CFG.SCORE_COL;
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(score + 'm', W - 14, 28);

  // Coin counter
  if (coinCount > 0) {
    ctx.fillStyle = 'hsl(48, 100%, 60%)';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('◉ ' + coinCount + '/' + nextCoinMilestone, W - 14, 66);
  }
  // Gem counter + next milestone
  if (gemCount > 0) {
    ctx.fillStyle = 'hsl(290, 95%, 70%)';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('◆ ' + gemCount + '/' + nextGemMilestone, W - 14, 86);
  }
  // Glider owned indicator
  if (player && player.hasGlider) {
    ctx.fillStyle = '#22ddee';
    ctx.font = '10px monospace';
    ctx.fillText('glider ' + Math.ceil(player.gliderTime / 1000) + 's', W - 14, 104);
    const gw = 60, gp = player.gliderTime / GLIDER_TIME;
    ctx.fillStyle = '#16223f';
    ctx.fillRect(W - 14 - gw, 110, gw, 5);
    ctx.fillStyle = gp > 0.3 ? '#3d8bff' : '#ff4466';
    ctx.fillRect(W - 14 - gw, 110, gw * gp, 5);
  }

  // Best
  ctx.fillStyle = CFG.UI_DIM;
  ctx.font = '11px monospace';
  if (mode === 'gauntlet') {
    ctx.fillText('best ' + bestGauntlet + 'm', W - 14, 46);
  } else if (mode === 'jewels') {
    ctx.fillText('best ' + bestJewels + ' jewels', W - 14, 46);
    ctx.fillStyle = '#3d8bff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('◆ ' + jewelScore, W - 14, 132);
  } else if (mode === 'career') {
    ctx.fillText('top ' + LEVEL_TARGET(careerLevel) + 'm', W - 14, 46);
    ctx.fillStyle = '#6fb0ff';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('LEVEL ' + careerLevel, W - 14, 132);
    const lp = Math.min(1, score / LEVEL_TARGET(careerLevel));
    ctx.fillStyle = '#16223f'; ctx.fillRect(W - 74, 138, 60, 5);
    ctx.fillStyle = '#3d8bff'; ctx.fillRect(W - 74, 138, 60 * lp, 5);
  } else if (mode === 'challenge') {
    ctx.fillText('best ' + bestChallenge + ' tokens', W - 14, 46);
    ctx.fillStyle = '#6fb0ff';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('next ⬡ ' + tokenNeed, W - 14, 132);
  } else {
    ctx.fillText('best ' + best + 'm', W - 14, 46);
  }

  // Steady timer
  if (player && player.steadyTime > 0) {
    const sp = player.steadyTime / STEADY_TIME;
    const secs = Math.ceil(player.steadyTime / 1000);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#6fb0ff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('steady ' + Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'), 14, 120);
    ctx.fillStyle = '#16223f';
    ctx.fillRect(14, 125, 60, 5);
    ctx.fillStyle = sp > 0.15 ? '#3d8bff' : '#ff4466';
    ctx.fillRect(14, 125, 60 * sp, 5);
    ctx.textAlign = 'right';
  }

  // Size and static timers
  if (player && player.sizeTime > 0) {
    ctx.textAlign = 'left';
    ctx.fillStyle = '#6fb0ff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText((player.sizeKind === 'shrink' ? 'shrunk ' : 'grown ') + Math.ceil(player.sizeTime / 1000) + 's', 14, 146);
    ctx.fillStyle = '#16223f'; ctx.fillRect(14, 151, 60, 5);
    ctx.fillStyle = '#3d8bff'; ctx.fillRect(14, 151, 60 * player.sizeTime / SIZE_TIME, 5);
    ctx.textAlign = 'right';
  }
  if (player && player.slowTime > 0) {
    ctx.textAlign = 'left';
    ctx.fillStyle = '#6fb0ff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('slow-mo ' + Math.ceil(player.slowTime / 1000) + 's', 14, 190);
    ctx.textAlign = 'right';
  }
  if (player && player.trailTime > 0) {
    ctx.textAlign = 'left';
    ctx.fillStyle = TRAIL_PALETTES[player.trailPal][2];
    ctx.font = 'bold 11px monospace';
    ctx.fillText('trail ' + Math.ceil(player.trailTime / 1000) + 's', 14, 208);
    ctx.textAlign = 'right';
  }
  if (player && player.staticTime > 0) {
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ff6688';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('static ' + Math.ceil(player.staticTime / 1000) + 's', 14, 172);
    ctx.textAlign = 'right';
  }

  // Parachute indicator
  if (player && !player.onGround && !player.chute && player.vy > 0) {
    const pct = Math.min(player.fallTimer / CFG.CHUTE_DEPLOY_S, 1);
    const barW = 60;
    const bx = 14, by = 14;
    ctx.fillStyle = '#222233';
    ctx.fillRect(bx, by, barW, 6);
    ctx.fillStyle = pct > 0.7 ? CFG.CHUTE : '#5566aa';
    ctx.fillRect(bx, by, barW * pct, 6);
    ctx.fillStyle = CFG.UI_DIM;
    ctx.font = '9px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('chute', bx, by + 17);
  }
}

function drawTouchHints() {
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,        0, W * 0.33, H);
  ctx.fillRect(W * 0.66, 0, W * 0.34, H);
  ctx.globalAlpha = 1;
}

function drawMenu() {
  ctx.fillStyle = CFG.UI_TEXT;
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('ASCEND', W / 2, H / 2 - 30);
  ctx.fillStyle = '#6fb0ff';
  ctx.font = 'bold 12px monospace';
  ctx.fillText(mode === 'gauntlet' ? 'RUN THE GAUNTLET' : mode === 'jewels' ? 'JEWELS MODE' : mode === 'career' ? 'CAREER  LEVEL ' + careerLevel + '  REACH ' + LEVEL_TARGET(careerLevel) + 'm'
    : mode === 'challenge' ? 'CHALLENGE MODE' : mode === 'side' ? 'SIDE SCROLL MARATHON' : mode === 'fuel' ? 'FUEL MODE' : 'MARATHON MODE', W / 2, H / 2 - 54);

  ctx.fillStyle = CFG.UI_DIM;
  ctx.font = '13px monospace';
  ctx.fillText(mode === 'fuel' ? 'grab every gem in a stretch to level up' : mode === 'side' ? 'run right as far as you can' : 'climb as high as you can', W / 2, H / 2 + 2);
  ctx.fillText(mode === 'fuel' ? 'gems are fuel, run dry and the run ends' : mode === 'side' ? 'fall in the abyss, drop from the sky' : 'fall 2s → parachute deploys', W / 2, H / 2 + 22);

  ctx.fillStyle = CFG.ACCENT;
  ctx.font = 'bold 14px monospace';
  ctx.fillText('tap to start', W / 2, H / 2 + 56);

  const menuBest = mode === 'challenge' ? bestChallenge : mode === 'career' ? careerCleared : mode === 'gauntlet' ? bestGauntlet : mode === 'jewels' ? bestJewels : mode === 'side' ? bestSide : mode === 'fuel' ? bestFuel : best;
  if (menuBest > 0) {
    ctx.fillStyle = CFG.SCORE_COL;
    ctx.font = '11px monospace';
    ctx.fillText(mode === 'career' ? 'levels cleared: ' + menuBest + ' of ' + LEVEL_COUNT
      : 'best: ' + menuBest + (mode === 'challenge' ? ' tokens' : mode === 'jewels' ? ' jewels' : 'm'), W / 2, H / 2 + 80);
  }
  if (mode === 'challenge' || mode === 'gauntlet' || mode === 'jewels') {
    ctx.fillStyle = CFG.UI_DIM;
    ctx.font = '11px monospace';
    ctx.fillText(mode === 'challenge' ? 'grab tokens in order: 1, 2, 3...'
      : mode === 'gauntlet' ? 'three lives, no parachute, dodge the turrets'
      : 'grab every jewel, full sets pay a bonus', W / 2, H / 2 + 120);
  }
  ctx.fillStyle = '#6fb0ff';
  ctx.font = '11px monospace';
  ctx.fillText('☰ global leaderboard', W / 2, H / 2 + 100);
}

function drawNamePrompt(y) {
  if (LB.name) return;
  ctx.fillStyle = '#3d8bff';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('tap ☰ to enter your name and post this score', W / 2, y);
}

function drawResult() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3d8bff';
  ctx.font = 'bold 13px monospace';
  ctx.fillText('CAREER', W / 2, H / 2 - 92);
  ctx.fillStyle = CFG.UI_TEXT;
  ctx.font = 'bold 26px monospace';
  ctx.fillText(result.level === LEVEL_COUNT ? 'CAREER COMPLETE' : 'LEVEL ' + result.level + ' CLEAR', W / 2, H / 2 - 60);
  ctx.fillStyle = CFG.SCORE_COL;
  ctx.font = 'bold 30px monospace';
  ctx.fillText(fmtTime(result.time), W / 2, H / 2 - 18);
  ctx.font = '12px monospace';
  ctx.fillStyle = result.newBest ? '#3d8bff' : CFG.UI_DIM;
  ctx.fillText(result.newBest ? 'new best time!' : 'best ' + fmtTime(result.best), W / 2, H / 2 + 6);
  ctx.fillStyle = CFG.UI_DIM;
  ctx.fillText(LB.name ? (result.posting ? 'posting...' : result.rank ? 'rank ' + result.rank + ' on level ' + result.level + ' times' : 'saved') : '', W / 2, H / 2 + 28);
  drawNamePrompt(H / 2 + 28);
  ctx.fillStyle = CFG.ACCENT;
  ctx.font = 'bold 14px monospace';
  ctx.fillText(result.level === LEVEL_COUNT ? 'tap for the menu' : 'tap for level ' + (result.level + 1), W / 2, H / 2 + 64);
}

function drawDead() {
  if (mode === 'fuel') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#3d8bff';
    ctx.font = 'bold 26px monospace';
    ctx.fillText('OUT OF FUEL', W / 2, H / 2 - 40);
    ctx.fillStyle = CFG.SCORE_COL;
    ctx.font = 'bold 20px monospace';
    ctx.fillText(score + 'm', W / 2, H / 2 - 8);
    ctx.fillStyle = '#6fb0ff';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('LEVEL ' + SIDE.level, W / 2, H / 2 + 16);
    ctx.fillStyle = CFG.UI_DIM;
    ctx.font = '12px monospace';
    ctx.fillText(score >= bestFuel && score > 0 ? 'new best!' : 'best ' + bestFuel + 'm  top level ' + bestFuelLevel, W / 2, H / 2 + 38);
    ctx.fillText('tap to fuel up and go again', W / 2, H / 2 + 64);
    drawNamePrompt(H / 2 + 90);
    return;
  }
  ctx.fillStyle = CFG.UI_TEXT;
  ctx.font = 'bold 26px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(mode === 'gauntlet' ? 'GAME OVER' : 'FELL', W / 2, H / 2 - 24);
  if (mode === 'gauntlet') {
    ctx.fillStyle = CFG.SCORE_COL;
    ctx.font = 'bold 20px monospace';
    ctx.fillText(score + 'm', W / 2, H / 2 + 4);
    if (score >= bestGauntlet && score > 0) {
      ctx.fillStyle = '#3d8bff';
      ctx.font = '12px monospace';
      ctx.fillText('new best!', W / 2, H / 2 + 24);
    }
    ctx.fillStyle = CFG.UI_DIM;
    ctx.font = '12px monospace';
    ctx.fillText('tap to run it again', W / 2, H / 2 + 50);
    drawNamePrompt(H / 2 + 76);
    return;
  }

  ctx.fillStyle = CFG.SCORE_COL;
  ctx.font = 'bold 20px monospace';
  ctx.fillText(score + 'm', W / 2, H / 2 + 4);

  if (score >= best && score > 0) {
    ctx.fillStyle = CFG.ACCENT;
    ctx.font = '12px monospace';
    ctx.fillText('new best!', W / 2, H / 2 + 24);
  }

  ctx.fillStyle = CFG.UI_DIM;
  ctx.font = '12px monospace';
  ctx.fillText('tap to retry', W / 2, H / 2 + 50);
}

// ════════════════════════════════════════════════════════════
//  GAME LOOP
// ════════════════════════════════════════════════════════════
let lastTs = 0;
let worldClock = 0;

let loopErrors = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  try { tick(ts); } catch (e) {
    // never let one bad frame freeze or blank the game
    if (loopErrors++ < 5) console.error('ascend frame error', e);
    try { ctx.restore(); ctx.globalAlpha = 1; ctx.shadowBlur = 0; } catch (e2) {}
  }
}
function tick(ts) {
  const ms = Math.min(ts - lastTs, 50); // cap spike
  const dt = ms / 16.67;
  lastTs = ts;

  if (state === STATE.PLAYING && !LB.open && sideLike()) {
    const wr = worldRate();
    worldClock += ms;
    SIDE.update(dt, ms);
    if (state === STATE.PLAYING && mode === 'fuel') {
      updateRockets(ms);
      updateSteadies(ms);
      updateOddities(ms);
      updateGliders();
      updateBlaze();
    }
    updateParticles(dt * wr);
  } else if (state === STATE.PLAYING && !LB.open) {
    const wr = worldRate();
    worldClock += ms * wr;
    updatePhysics(dt, ms);
    updateCoins();
    updateParticles(dt * wr);
    updateTrail();
    updateBlaze();
    updateGauntlet(ms, wr);
    updateJewels();
    if (Math.random() < wr) updateShooters();
    updateRockets(ms);
    updateSteadies(ms);
    updateOddities(ms);
    updateGliders();
    updateGems();
    updateTokens(ms);
    updateMovingPlatforms(dt * wr);
    updateWind(ms * wr);
    if (Math.random() < wr) updateStreaks();
    checkMilestones();
    checkLevel(ms);
  }
  if (state === STATE.PLAYING && !LB.open && mode === 'career' && levelDoneT <= 0) levelTime += ms;
  render(state === STATE.PLAYING ? worldClock : ts);
}

// ════════════════════════════════════════════════════════════
//  GLOBAL LEADERBOARD (ascend-backend on Railway)
// ════════════════════════════════════════════════════════════
const LB = {
  open: false, api: null, timer: null, posted: 0, postedC: 0, postedK: 0, postedG: 0, postedJ: 0, postedS: 0, postedF: 0,
  name: localStorage.getItem('ascendName') || '',
  el: id => document.getElementById(id),
  clean(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9 _.-]/g, '').trim().slice(0, 12); },
  status(t) { this.el('lbStatus').textContent = t; },
  async findApi() {
    if (this.api) return this.api;
    const srcs = ['ascend-api-v1.json', 'https://raw.githubusercontent.com/sudosilo/ascend/master/ascend-api-v1.json'];
    for (const u of srcs) {
      try {
        const r = await fetch(u, { cache: 'no-store' });
        if (!r.ok) continue;
        const j = await r.json();
        if (j && j.url && /^https:\/\/[^\/]+$/.test(j.url)) { this.api = j.url; return this.api; }
      } catch (e) {}
    }
    return null;
  },
  render(rows, kind, append) {
    const ol = this.el('lbList');
    if (!append) ol.innerHTML = '';
    if (append) {
      const h = document.createElement('li');
      h.className = 'hd';
      h.textContent = 'MOST LEVELS CLEARED';
      ol.appendChild(h);
    }
    if (!rows.length) {
      if (!append && !kind) { this.status('no scores yet, go set one'); return; }
      const li = document.createElement('li'); li.textContent = 'no scores yet'; ol.appendChild(li); return;
    }
    rows.forEach((r, i) => {
      const li = document.createElement('li');
      if (r.name === this.name) li.className = 'me';
      const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = (i + 1) + '.';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name;
      const sc = document.createElement('span'); sc.textContent = kind === 'time' ? fmtTime(r.score) : mode === 'career' ? 'LV ' + r.score : r.score + (mode === 'challenge' ? ' ⬡' : mode === 'jewels' ? ' ◆' : 'm');
      li.append(rk, nm, sc);
      ol.appendChild(li);
    });
  },
  async load() {
    const api = await this.findApi();
    if (!api) { this.status('leaderboard offline'); return; }
    try {
      if (mode === 'career') {
        const [rt, rc] = await Promise.all([
          fetch(api + '/scores?mode=lv' + careerLevel).then(x => x.json()),
          fetch(api + '/scores?mode=career').then(x => x.json()),
        ]);
        this.status(this.name ? 'posting as ' + this.name : 'enter a name to post your scores');
        this.render(rt.scores || [], 'time');
        this.render(rc.scores || [], 'levels', true);
        return;
      }
      const r = await fetch(api + '/scores?mode=' + mode);
      const j = await r.json();
      this.status(this.name ? 'posting as ' + this.name : 'enter a name to post your best');
      this.render(j.scores || []);
    } catch (e) { this.status('leaderboard offline'); }
  },
  async post() {
    if (!this.name) return;
    const api = await this.findApi();
    if (!api) return;
    const jobs = [];
    if (best > 0 && best > this.posted) jobs.push(['climb', best]);
    if (bestChallenge > 0 && bestChallenge > this.postedC) jobs.push(['challenge', bestChallenge]);
    if (careerCleared > 0 && careerCleared > this.postedK) jobs.push(['career', careerCleared]);
    if (bestGauntlet > 0 && bestGauntlet > this.postedG) jobs.push(['gauntlet', bestGauntlet]);
    if (bestJewels > 0 && bestJewels > this.postedJ) jobs.push(['jewels', bestJewels]);
    if (bestSide > 0 && bestSide > this.postedS) jobs.push(['side', bestSide]);
    if (bestFuel > 0 && bestFuel > this.postedF) jobs.push(['fuel', bestFuel]);
    for (const [m, val] of jobs) {
      try {
        const r = await fetch(api + '/scores', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: this.name, score: val, mode: m }),
        });
        const j = await r.json();
        if (!j.ok) continue;
        if (m === 'climb') { this.posted = val; localStorage.setItem('ascendPosted', String(val)); }
        else if (m === 'challenge') { this.postedC = val; localStorage.setItem('ascendPostedC', String(val)); }
        else if (m === 'career') { this.postedK = val; localStorage.setItem('ascendPostedK', String(val)); }
        else if (m === 'gauntlet') { this.postedG = val; localStorage.setItem('ascendPostedG', String(val)); }
        else if (m === 'side') { this.postedS = val; localStorage.setItem('ascendPostedS', String(val)); }
        else if (m === 'fuel') { this.postedF = val; localStorage.setItem('ascendPostedF', String(val)); }
        else { this.postedJ = val; localStorage.setItem('ascendPostedJ', String(val)); }
        if (this.open && m === mode) {
          this.render(j.scores || []);
          this.status('posted ' + (m === 'career' ? 'level ' + val : val + (m === 'challenge' ? ' tokens' : m === 'jewels' ? ' jewels' : 'm')) + ', rank ' + j.rank);
        }
      } catch (e) {}
    }
  },
  async postTime(level, ms) {
    if (!this.name) { this.pendingTime = { level, ms }; return; }
    const api = await this.findApi();
    if (!api) return;
    result.posting = true;
    try {
      const r = await fetch(api + '/scores', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: this.name, score: ms, mode: 'lv' + level }),
      });
      const j = await r.json();
      if (j.ok && result.level === level) result.rank = j.rank;
      if (this.open && mode === 'career') this.load();
    } catch (e) {}
    result.posting = false;
    this.pendingTime = null;
  },
  async postAllTimes() {
    for (let n = 1; n <= LEVEL_COUNT; n++) {
      const t = lvBestTime(n);
      if (t > 0) await this.postTime(n, t);
    }
  },
  setMode(m) {
    mode = m;
    localStorage.setItem('ascendMode', m);
    this.el('modeClimb').className = m === 'climb' ? 'on' : '';
    this.el('modeChallenge').className = m === 'challenge' ? 'on' : '';
    this.el('modeCareer').className = m === 'career' ? 'on' : '';
    this.el('modeGauntlet').className = m === 'gauntlet' ? 'on' : '';
    this.el('modeJewels').className = m === 'jewels' ? 'on' : '';
    this.el('modeSide').className = m === 'side' ? 'on' : '';
    this.el('modeFuel').className = m === 'fuel' ? 'on' : '';
    this.el('lbTitle').textContent = m === 'career' ? 'LEVEL ' + careerLevel + ' FASTEST TIMES'
      : ({ challenge: 'CHALLENGE', gauntlet: 'GAUNTLET', jewels: 'JEWELS', side: 'SIDE SCROLL', fuel: 'FUEL' }[m] || 'MARATHON') + ' LEADERBOARD';
    this.syncLevel();
  },
  syncLevel() {
    if (mode === 'career') this.el('lbTitle').textContent = 'LEVEL ' + careerLevel + ' FASTEST TIMES';
    this.el('lvText').textContent = 'LEVEL ' + careerLevel + '  ' + LEVEL_TARGET(careerLevel) + 'm';
    this.el('lbLevel').style.opacity = mode === 'career' ? '1' : '0.45';
  },
  queue() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { GHOST.save(); this.post(); }, 4000);
  },
  show() {
    this.open = true;
    touch.left = touch.right = touch.jump = false;
    this.el('lbName').value = this.name;
    this.el('lbPanel').classList.add('open');
    this.status('loading');
    this.load();
  },
  hide() {
    this.open = false;
    this.el('lbName').blur();
    this.el('lbPanel').classList.remove('open');
  },
  init() {
    const n = parseInt(localStorage.getItem('ascendPosted') || '0');
    const sameName = localStorage.getItem('ascendPostedName') === this.name;
    this.posted = sameName ? n : 0;
    this.postedC = sameName ? parseInt(localStorage.getItem('ascendPostedC') || '0') : 0;
    this.postedK = sameName ? parseInt(localStorage.getItem('ascendPostedK') || '0') : 0;
    this.postedG = sameName ? parseInt(localStorage.getItem('ascendPostedG') || '0') : 0;
    this.postedJ = sameName ? parseInt(localStorage.getItem('ascendPostedJ') || '0') : 0;
    this.postedS = sameName ? parseInt(localStorage.getItem('ascendPostedS') || '0') : 0;
    this.postedF = sameName ? parseInt(localStorage.getItem('ascendPostedF') || '0') : 0;
    this.setMode(mode);
    document.querySelectorAll('#lbOpts button').forEach(b => {
      const k = b.dataset.opt;
      b.className = SETTINGS[k] ? 'on' : '';
      b.addEventListener('click', () => {
        SETTINGS[k] = !SETTINGS[k];
        saveSetting(k);
        b.className = SETTINGS[k] ? 'on' : '';
        SFX.unlock();
        if (k === 'music') SETTINGS.music ? MUSIC.start() : MUSIC.stop();
        if (k === 'buzz' && SETTINGS.buzz) buzz(40);
      });
    });
    const pickLevel = d => {
      const nl = Math.max(1, Math.min(careerUnlocked, LEVEL_COUNT, careerLevel + d));
      if (nl === careerLevel && mode === 'career') { if (d > 0 && careerLevel >= careerUnlocked) this.status('clear level ' + careerLevel + ' to unlock the next'); return; }
      GHOST.save();
      careerLevel = nl;
      localStorage.setItem('ascendCareerLevel', careerLevel);
      if (mode !== 'career') { this.setMode('career'); this.status('loading'); this.load(); }
      this.syncLevel();
      state = STATE.MENU;
      initGame();
    };
    this.el('lvPrev').addEventListener('click', () => pickLevel(-1));
    this.el('lvNext').addEventListener('click', () => pickLevel(1));
    ['modeClimb', 'modeChallenge', 'modeCareer', 'modeGauntlet', 'modeJewels', 'modeSide', 'modeFuel'].forEach(id => this.el(id).addEventListener('click', e => {
      const m = e.currentTarget.dataset.mode;
      if (m === mode) return;
      GHOST.save();
      this.setMode(m);
      state = STATE.MENU;
      initGame();
      this.status('loading');
      this.load();
    }));
    const stop = e => e.stopPropagation();
    ['touchstart', 'touchmove', 'touchend'].forEach(t => {
      this.el('lbPanel').addEventListener(t, stop, { passive: true });
      this.el('lbBtn').addEventListener(t, stop, { passive: true });
    });
    this.el('lbBtn').addEventListener('click', () => this.open ? this.hide() : this.show());
    this.el('lbClose').addEventListener('click', () => this.hide());
    this.el('lbSave').addEventListener('click', async () => {
      const nm = this.clean(this.el('lbName').value);
      if (!nm) { this.status('name needs letters or numbers'); return; }
      if (nm !== this.name) { this.posted = 0; this.postedC = 0; this.postedK = 0; this.postedG = 0; this.postedJ = 0; this.postedS = 0; this.postedF = 0; }
      this.name = nm;
      this.el('lbName').value = nm;
      localStorage.setItem('ascendName', nm);
      localStorage.setItem('ascendPostedName', nm);
      this.postAllTimes();
      if (best > 0 || bestChallenge > 0 || careerCleared > 0 || bestGauntlet > 0 || bestJewels > 0 || bestSide > 0 || bestFuel > 0) { this.status('posting'); await this.post(); }
      this.load();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { GHOST.save(); this.post(); MUSIC.stop(); }
      else if (SFX.ac) MUSIC.start();
    });
    this.post();
  },
};
LB.init();

initGame();
requestAnimationFrame(loop);
</script>

      // BLUE PHONE: support the micronation donate pill with a coin icon.

    var style = document.createElement("style");

    head.appendChild(style);

      + '</div>';

    // RED PHONE: flag badge and "Who made this?" both toggle the panel.
    var ask = seal.querySelector(".mtg-seal-ask");
    var flagBtn = seal.querySelector(".mtg-flag-btn");
    function toggle() {
      var nowOpen = seal.classList.toggle("open");
      ask.setAttribute("aria-expanded", nowOpen ? "true" : "false");
    }
    ask.addEventListener("click", toggle);
    flagBtn.addEventListener("click", toggle);
    seal.querySelector(".mtg-seal-btn").addEventListener("click", toggle);

    // RED PHONE: drop this block into a page with no seal container and it

    var sealContainer = document.getElementById("mtgSealContainer") || document.body;
    sealContainer.appendChild(seal);

  })();
