<!--

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0d0d14;
    overflow: hidden;
    touch-action: none;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #lbBtn {
    position: fixed; left: 14px; top: 40px; z-index: 20;
    width: 44px; height: 44px; border-radius: 10px;
    border: 2px solid #3d8bff; background: rgba(13,13,20,0.85);
    color: #6fb0ff; font: bold 22px monospace; line-height: 1;
  }
  #lbPanel {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 30;
    width: min(320px, 82vw); padding: 18px 16px;
    background: rgba(10,18,40,0.96); border-right: 3px solid #3d8bff;
    color: #d8e6ff; font: 14px monospace;
    transform: translateX(-105%); transition: transform 0.18s ease-out;
    overflow-y: auto; touch-action: pan-y;
  }
  #lbPanel.open { transform: translateX(0); }
  #lbPanel h2 { font-size: 18px; color: #6fb0ff; margin-bottom: 12px; letter-spacing: 2px; }
  #lbPanel label { display: block; color: #8aa0c8; font-size: 11px; margin-bottom: 4px; }
  #lbName {
    width: 100%; padding: 10px; font: bold 16px monospace; text-transform: uppercase;
    background: #0d1430; color: #ffe066; border: 1px solid #3d8bff; border-radius: 6px;
  }
  #lbSave, #lbClose {
    margin-top: 8px; width: 100%; padding: 10px; font: bold 14px monospace;
    border-radius: 6px; border: 1px solid #3d8bff;
  }
  #lbSave { background: #3d8bff; color: #fff; }
  #lbClose { background: transparent; color: #6fb0ff; }
  #lbOpts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  #lbOpts button {
    padding: 10px 0; font: bold 12px monospace; border-radius: 6px;
    border: 1px solid #3d8bff; background: transparent; color: #6fb0ff;
  }
  #lbOpts button.on { background: #3d8bff; color: #fff; }
  #lbLevel { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; height: 42px; }
  #lbLevel button {
    width: 48px; height: 42px; font: bold 16px monospace; border-radius: 6px;
    border: 1px solid #3d8bff; background: transparent; color: #6fb0ff;
  }
  #lvText { flex: 1; text-align: center; font: bold 13px monospace; color: #d8e6ff; white-space: nowrap; overflow: hidden; }
  #lbModes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  #lbModes button {
    flex: 1; padding: 10px 0; font: bold 11px monospace; border-radius: 6px;
    border: 1px solid #3d8bff; background: transparent; color: #6fb0ff;
  }
  #lbModes button.on { background: #3d8bff; color: #fff; }
  #lbStatus { min-height: 18px; margin: 10px 0; font-size: 11px; color: #8aa0c8; }
  #lbList { list-style: none; }

<body>
<canvas id="c"></canvas>
<button id="lbBtn" aria-label="leaderboard">☰</button>
<div id="lbPanel">
  <h2>ASCEND</h2>
  <label>MODE</label>
  <div id="lbModes">
    <button id="modeClimb" data-mode="climb">MARATHON</button>
    <button id="modeChallenge" data-mode="challenge">CHALLENGE</button>
    <button id="modeCareer" data-mode="career">CAREER</button>
    <button id="modeGauntlet" data-mode="gauntlet">GAUNTLET</button>
    <button id="modeJewels" data-mode="jewels">JEWELS</button>
  </div>
  <label>CAREER LEVEL</label>
  <div id="lbLevel">
    <button id="lvPrev">◀</button>
    <span id="lvText">LEVEL 1</span>
    <button id="lvNext">▶</button>
  </div>
  <label>OPTIONS</label>
  <div id="lbOpts">
    <button data-opt="sound">SOUND</button>
    <button data-opt="music">MUSIC</button>
    <button data-opt="buzz">VIBRATE</button>
    <button data-opt="ghost">GHOST</button>
  </div>
  <h2 id="lbTitle">LEADERBOARD</h2>
  <label for="lbName">YOUR NAME</label>
  <input id="lbName" maxlength="12" autocomplete="off" spellcheck="false">
  <button id="lbSave">SAVE NAME AND POST BEST</button>
  <div id="lbStatus"></div>
  <ol id="lbList"></ol>
  <button id="lbClose">CLOSE</button>
</div>
<script>
// ════════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════════
const CFG = {
  // Physics
  GRAVITY:        0.42,
  JUMP_FORCE:    -13.5,  // strong jump
  BUBBLE_GRAV:    0.08,  // floaty gravity when holding jump at apex
  FRICTION:       0.80,
  MAX_FALL:       13,
  CHUTE_MAX_FALL: 1.6,
  CHUTE_GRAVITY:  0.08,
  CHUTE_DEPLOY_S: 2.0,
  COYOTE_MS:      120,

  // Player
  PLAYER_W:  14,
  PLAYER_H:  22,
  PLAYER_SPEED: 3.8,

  // World
  PLAT_MIN_W:  55,
  PLAT_MAX_W: 110,
  PLAT_H:       8,
  CHUNK_H:    160,   // world-units per generated chunk
  PLAT_PER_CHUNK: 3,
  CULL_BELOW:  80,   // cull platforms this many px below camera bottom

  // Colors  (AESTHETICS iteration: own these)
  BG:        '#0d0d14',
  PLAYER:    '#e8e8d0',
  PLAT:      '#2a2a3a',
  PLAT_TOP:  '#3a3a55',
  CHUTE:     '#ff4466',
  CHUTE_LINE:'#cc2244',
  ACCENT:    '#ff4466',
  UI_TEXT:   '#c0c0c0',
  UI_DIM:    '#606070',
  SCORE_COL: '#ffe066',
};

// ════════════════════════════════════════════════════════════
//  CANVAS - fills full screen, logical coords = pixel coords
// ════════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ════════════════════════════════════════════════════════════
//  INPUT
// ════════════════════════════════════════════════════════════
const keys  = {};
const touch = { left: false, right: false, jump: false };
let jumpPressedThisFrame = false;
let jumpWasDown = false;

window.addEventListener('keydown', e => { if (e.target && e.target.tagName === 'INPUT') return; SFX.unlock(); keys[e.code] = true;  e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.code] = false; });

canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
canvas.addEventListener('touchmove',  handleTouchMove,  { passive: false });
canvas.addEventListener('touchend',   e => {
  e.preventDefault();
  touch.left = touch.right = touch.jump = false;
}, { passive: false });

function handleTouchStart(e) {
  e.preventDefault();
  SFX.unlock();
  // Tap to start / retry from menu or dead screen, or continue from a result
  if (state !== STATE.PLAYING) {
    if (performance.now() - stateSince < 700) return;   // ignore the thumb still on the glass
    if (state === STATE.RESULT) { advanceFromResult(); return; }
    setState(STATE.PLAYING);
    return;
  }
  updateTouchZones(e);
}

function handleTouchMove(e) {
  e.preventDefault();
  updateTouchZones(e);
}

function updateTouchZones(e) {
  touch.left = touch.right = touch.jump = false;
  for (const t of e.touches) {
    const x = t.clientX;
    if      (x < W * 0.33) touch.left  = true;
    else if (x > W * 0.66) touch.right = true;
    else                    touch.jump  = true;
  }
}

function getInput() {
  const jumpDown = keys['ArrowUp'] || keys['KeyW'] || keys['Space'] || touch.jump;
  jumpPressedThisFrame = jumpDown && !jumpWasDown;
  jumpWasDown = jumpDown;
  return {
    left:  keys['ArrowLeft']  || keys['KeyA'] || touch.left,
    right: keys['ArrowRight'] || keys['KeyD'] || touch.right,
    jump:  jumpDown,
    jumpPressed: jumpPressedThisFrame,
  };
}

// ════════════════════════════════════════════════════════════
//  STATE MACHINE
// ════════════════════════════════════════════════════════════
const STATE = { MENU: 'menu', PLAYING: 'playing', DEAD: 'dead', RESULT: 'result' };
let state = STATE.MENU;

let stateSince = 0;
function setState(s) {
  state = s;
  stateSince = performance.now();
  if (s === STATE.PLAYING) initGame();
}

window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if ((e.code === 'Space' || e.code === 'Enter') && state !== STATE.PLAYING) {
    if (performance.now() - stateSince < 700) return;
    if (state === STATE.RESULT) advanceFromResult(); else setState(STATE.PLAYING);
  }
});

// ════════════════════════════════════════════════════════════
//  WORLD - infinite procedural platforms
// ════════════════════════════════════════════════════════════
let platforms = [];
let cameraY = 0;       // world-Y of the top of the screen

// worldY: 0 = starting ground level, negative = higher up.
// SIMPLE SYSTEM: track highestPlatY (most negative platform generated so far).
// Keep generating upward whenever camera approaches it. Cull below screen bottom.

let highestPlatY = 0;     // y of the highest platform generated so far
let worldGenBottom = 800; // lowest rescue platform generated

function rand(min, max) { return min + Math.random() * (max - min); }
const SOLID_CHANCE = 0.13;
const DIFF = { solid: SOLID_CHANCE, mover: 0.15, gapMax: 90 };

function addGround() {
  platforms.push({ x: 0, y: 0, w: W, h: 40, isGround: true });
}

// Generate platforms upward until we've covered up to targetY (more negative = higher)
function generateUpTo(targetY) {
  while (highestPlatY > targetY) {
    const gap = rand(55, DIFF.gapMax);
    highestPlatY -= gap;
    const pw = rand(CFG.PLAT_MIN_W, CFG.PLAT_MAX_W);
    const px = rand(0, W - pw);
    const np = { x: px, y: highestPlatY, w: pw, h: CFG.PLAT_H, hue: Math.floor(Math.random() * 360) };
    // ~15% of platforms drift left-right (harder to land)
    if (Math.random() < DIFF.mover) {
      np.vx = (0.6 + Math.random() * 0.9) * (Math.random() < 0.5 ? 1 : -1);
    } else if (highestPlatY < -400 && Math.random() < DIFF.solid) {
      // Solid steel block: cannot be jumped through from below
      np.solid = true;
      np.h = 16;
      np.w = Math.max(np.w, 80);
      np.x = Math.min(np.x, W - np.w);
    }
    platforms.push(np);
    maybeSpawnPowerup(np);
    maybeSpawnGem(np);
    maybeSpawnToken(np);
    maybeSpawnTurret(np);
    maybeSpawnJewels(np);
  }
}

// Rescue platforms below ground for long falls
function generateBelow(bottomY) {
  for (let i = 0; i < 4; i++) {
    const y = bottomY + 80 + i * 90;
    const pw = rand(CFG.PLAT_MIN_W, CFG.PLAT_MAX_W);
    const px = rand(0, W - pw);
    platforms.push({ x: px, y, w: pw, h: CFG.PLAT_H, isRescue: true, hue: 0 });
  }
  worldGenBottom = bottomY + 4 * 90 + 80;
}

// Dissolve platforms that have scrolled off the BOTTOM of the screen (behind the climber)
function cullPlatforms() {
  if (mode === 'challenge') return;   // keep the whole tower so you can drop back for a token
  const bottomEdge = cameraY + H + 100; // 100px grace below screen bottom
  platforms = platforms.filter(p => p.y <= bottomEdge || p.isGround || p.isRescue);
}

// Moving platforms drift and bounce off screen edges
function updateMovingPlatforms(dt) {
  for (const p of platforms) {
    if (!p.vx) continue;
    p.x += p.vx * dt;
    if (p.x < 0)          { p.x = 0;          p.vx =  Math.abs(p.vx); }
    if (p.x + p.w > W)    { p.x = W - p.w;    p.vx = -Math.abs(p.vx); }
  }
}

// Respawn after hitting rescue: back to ground, fresh world, score kept
function respawnFromY() {
  platforms = platforms.filter(p => p.isGround);
  rockets = [];
  steadies = [];
  oddities = [];
  platsSincePU = Math.floor(POWERUP_GAP / 2);
  jewels = [];
  turrets = []; bullets = [];
  gliders = [];
  gems = [];
  coins = [];
  coinSpawnY = 0;
  const startY = -CFG.PLAYER_H - 42;
  player.y        = startY;
  player.x        = W / 2 - CFG.PLAYER_W / 2;
  player.vx       = 0;
  player.vy       = 0;
  player.onGround = false;
  player.chute    = false;
  player.fallTimer = 0;
  player.peakY    = startY;
  highestPlatY    = 0;
  worldGenBottom  = 800;
  cameraY         = 0;
  resetTokens();
  generateUpTo(-H * 2);
}

// ════════════════════════════════════════════════════════════
//  CHALLENGE MODE - numbered tokens taken in order
// ════════════════════════════════════════════════════════════
const TOKEN_EVERY = 3;       // one token per this many platforms
let tokens = [];
let tokenNeed = 1;           // number the player has to grab next
let tokenSpawnNext = 1;      // number the next spawned token will carry
let tokenPlatCount = 0;
let tokenWrongT = 0;

function maybeSpawnToken(p) {
  if (mode !== 'challenge') return;
  tokenPlatCount++;
  if (tokenPlatCount % TOKEN_EVERY !== 0) return;
  tokens.push({ n: tokenSpawnNext++, x: p.x + p.w / 2, y: p.y - 20, plat: p, flash: 0 });
}

function resetTokens() {
  tokens = [];
  tokenSpawnNext = tokenNeed;
  tokenPlatCount = 0;
}

function updateTokens(ms) {
  if (mode !== 'challenge') return;
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;
  if (tokenWrongT > 0) tokenWrongT -= ms;
  for (const t of tokens) {
    if (t.plat && t.plat.vx) t.x = t.plat.x + t.plat.w / 2;
    if (t.flash > 0) t.flash -= ms;
    const dx = pcx - t.x, dy = pcy - t.y;
    if (dx * dx + dy * dy > 24 * 24) continue;
    if (t.n === tokenNeed) {
      t.taken = true;
      tokenNeed++;
      if (tokenNeed - 1 > bestChallenge) {
        bestChallenge = tokenNeed - 1;
        localStorage.setItem('bestChallenge', bestChallenge);
        LB.queue();
      }
      if ((tokenNeed - 1) % 10 === 0) showBanner('TOKEN ' + (tokenNeed - 1) + '!');
      audio.triggers.token();
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 5;
        particles.push({
          x: t.x, y: t.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 1, decay: 0.03, size: 2 + Math.random() * 3,
          hue: 210 + Math.random() * 20, type: 'splash',
        });
      }
    } else if (t.n > tokenNeed && t.flash <= 0) {
      t.flash = 700;
      tokenWrongT = 1500;
      showBanner('GET ' + tokenNeed + ' FIRST');
      audio.triggers.wrong();
    }
  }
  tokens = tokens.filter(t => !t.taken);
}

function drawTokens(time) {
  if (mode !== 'challenge') return;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of tokens) {
    if (t.y < cameraY - 40 || t.y > cameraY + H + 40) continue;
    const isNext = t.n === tokenNeed;
    const bob = Math.sin(time * 0.004 + t.n) * 3;
    const r = isNext ? 13 : 11;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 6 + i * Math.PI / 3;
      const px = t.x + Math.cos(a) * r, py = t.y + bob + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    if (t.flash > 0) ctx.fillStyle = '#ff2244';
    else ctx.fillStyle = isNext ? '#3d8bff' : '#2a2f4a';
    ctx.fill();
    ctx.lineWidth = isNext ? 3 : 1.5;
    ctx.strokeStyle = isNext ? '#bfe0ff' : '#6fb0ff';
    ctx.stroke();
    ctx.fillStyle = isNext ? '#ffffff' : '#9fc4ff';
    ctx.font = 'bold ' + (isNext ? 12 : 10) + 'px monospace';
    ctx.fillText(String(t.n), t.x, t.y + bob + 1);
  }
  ctx.textBaseline = 'alphabetic';
}

// Screen-space arrow at the top or bottom edge pointing to the next token
function drawTokenArrow(time) {
  if (mode !== 'challenge' || state !== STATE.PLAYING) return;
  const t = tokens.find(k => k.n === tokenNeed);
  if (!t) return;
  const sy = t.y - cameraY;
  if (sy > 20 && sy < H - 20) return;
  const up = sy <= 20;
  const x = Math.max(24, Math.min(W - 24, t.x));
  const y = up ? 96 : H - 34;
  const pulse = 0.6 + 0.4 * Math.abs(Math.sin(time * 0.006));
  ctx.globalAlpha = pulse;
  ctx.fillStyle = tokenWrongT > 0 ? '#ff2244' : '#3d8bff';
  ctx.beginPath();
  if (up) { ctx.moveTo(x, y - 14); ctx.lineTo(x - 12, y + 6); ctx.lineTo(x + 12, y + 6); }
  else    { ctx.moveTo(x, y + 14); ctx.lineTo(x - 12, y - 6); ctx.lineTo(x + 12, y - 6); }
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#bfe0ff';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  const dist = Math.round(Math.abs(t.y - player.y) / 10);
  ctx.fillText(tokenNeed + '  ' + dist + 'm', x, up ? y + 20 : y - 12);
}

//  SOLID BLOCKS, FALL WARP
// ════════════════════════════════════════════════════════════
const FALL_WARP_MS = 6000;
let warpFlash = 0;

function drawSolid(p, time) {
  // steel body
  ctx.fillStyle = '#5b6b8c';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  // hazard stripes
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
  ctx.fillStyle = '#3d8bff';
  for (let sx = p.x - p.h; sx < p.x + p.w; sx += 14) {
    ctx.beginPath();
    ctx.moveTo(sx, p.y + p.h); ctx.lineTo(sx + 6, p.y + p.h);
    ctx.lineTo(sx + 6 + p.h, p.y); ctx.lineTo(sx + p.h, p.y);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // frame + rivets
  ctx.strokeStyle = '#1b2440'; ctx.lineWidth = 2;
  ctx.strokeRect(p.x + 1, p.y + 1, p.w - 2, p.h - 2);
  ctx.fillStyle = '#d7e3ff';
  ctx.fillRect(p.x, p.y, p.w, 2);
  ctx.fillStyle = '#1b2440';
  for (let rx = p.x + 5; rx < p.x + p.w - 3; rx += 18) {
    ctx.fillRect(rx, p.y + 4, 2, 2);
    ctx.fillRect(rx, p.y + p.h - 5, 2, 2);
  }
}

//  ZONES - every stretch of height has its own sky, weather and feel
// ════════════════════════════════════════════════════════════
const ZONE_CYCLE = 10000;  // meters before the zones loop with a new lap
const ZONES = [
  { at: 0,    name: 'NEON BASEMENT', top: '#0d0d14', bot: '#0d0d14', grid: '#8899ff', starA: 1,   weather: 'rain',  wcol: '160,190,255', player: '#e8e8d0', grav: 1.00, wind: 1.0 },
  { at: 600,  name: 'SUNRISE DECK',  top: '#bfe3ff', bot: '#ffd9b8', grid: '#e08a5a', starA: 0.2, weather: 'rain',  wcol: '70,110,190',  player: '#1f3a8a', grav: 1.00, wind: 1.3 },
  { at: 1500, name: 'CLOUD KINGDOM', top: '#d6ebff', bot: '#f4f9ff', grid: '#7aa6e0', starA: 0.1, weather: 'snow',  wcol: '120,160,230', player: '#1f3a8a', grav: 0.95, wind: 1.6 },
  { at: 2700, name: 'AURORA FIELD',  top: '#e6dcff', bot: '#e3fff2', grid: '#8a6be0', starA: 0.3, weather: 'spark', wcol: '90,200,160',  player: '#2a2a8a', grav: 0.92, wind: 0.8 },
  { at: 4200, name: 'STRATOSPHERE',  top: '#b8c8e8', bot: '#e9eef7', grid: '#3d8bff', starA: 0.6, weather: 'dust',  wcol: '60,80,140',   player: '#0f2a6e', grav: 0.86, wind: 2.0 },
  { at: 6000, name: 'NORTHERN LIGHTS', top: '#06142e', bot: '#0b2a3a', grid: '#3dffb0', starA: 1, weather: 'snow', wcol: '200,230,255', player: '#e8f1ff', grav: 0.90, wind: 1.2, aurora: true },
  { at: 8000, name: 'EMERALD NIGHT', top: '#032018', bot: '#0d3b2a', grid: '#3d8bff', starA: 0.8, weather: 'spark', wcol: '80,255,160', player: '#bfe0ff', grav: 0.94, wind: 1.0, aurora: true },
];
let zoneIdx = 0, zoneLap = 0;
const zoneFeel = { grav: 1, wind: 1 };

function zoneAt(m) {
  const lap = Math.floor(Math.max(0, m) / ZONE_CYCLE);
  const r = Math.max(0, m) - lap * ZONE_CYCLE;
  let i = 0;
  for (let k = 0; k < ZONES.length; k++) if (r >= ZONES[k].at) i = k;
  return { i, lap };
}

function updateZone() {
  const m = Math.floor(-player.y / 10);
  const z = zoneAt(m);
  if (z.i !== zoneIdx || z.lap !== zoneLap) {
    const up = z.lap > zoneLap || (z.lap === zoneLap && z.i > zoneIdx);
    zoneIdx = z.i; zoneLap = z.lap;
    if (up) {
      showBanner('ZONE ' + (zoneLap * ZONES.length + zoneIdx + 1) + ' ' + ZONES[zoneIdx].name);
      audio.triggers.zone();
    }
  }
  const Z = ZONES[zoneIdx];
  zoneFeel.grav += (Z.grav - zoneFeel.grav) * 0.02;
  zoneFeel.wind += (Z.wind - zoneFeel.wind) * 0.02;
}

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixHex(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')';
}

// Sky: blends into the next zone across the last 80m of each zone
function zoneSky() {
  const m = Math.max(0, Math.floor(-cameraY / 10));
  const lap = Math.floor(m / ZONE_CYCLE), r = m - lap * ZONE_CYCLE;
  let i = 0;
  for (let k = 0; k < ZONES.length; k++) if (r >= ZONES[k].at) i = k;
  const nextAt = i + 1 < ZONES.length ? ZONES[i + 1].at : ZONE_CYCLE;
  const j = (i + 1) % ZONES.length;
  const t = Math.max(0, Math.min(1, (r - (nextAt - 80)) / 80));
  const lapHue = (lap * 40) % 360;
  return {
    top: mixHex(ZONES[i].top, ZONES[j].top, t),
    bot: mixHex(ZONES[i].bot, ZONES[j].bot, t),
    t, i, j, lapHue,
  };
}

function drawZoneSky() {
  if (mode === 'gauntlet') {
    const gg = ctx.createLinearGradient(0, 0, 0, H);
    gg.addColorStop(0, GAUNTLET_THEME.top);
    gg.addColorStop(1, GAUNTLET_THEME.bot);
    ctx.fillStyle = gg;
    ctx.fillRect(0, 0, W, H);
    return;
  }
  const z = zoneSky();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, z.top);
  g.addColorStop(1, z.bot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if (ZONES[z.i].aurora || ZONES[z.j].aurora) {
    const a = ZONES[z.i].aurora ? (ZONES[z.j].aurora ? 1 : 1 - z.t) : z.t;
    const t = performance.now() * 0.0004;
    const bands = [['61,255,176', 0.30], ['61,139,255', 0.22], ['176,110,255', 0.18]];
    bands.forEach(([col, base], k) => {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 12) {
        const y = H * (0.18 + k * 0.1) + Math.sin(x * 0.012 + t * (1.5 + k) + k) * 26 + Math.sin(x * 0.031 - t * 2) * 10;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      for (let x = W; x >= 0; x -= 12) {
        const y = H * (0.18 + k * 0.1) + 70 + Math.sin(x * 0.01 + t * (1.2 + k)) * 30;
        ctx.lineTo(x, y);
      }
      ctx.closePath();
      const g2 = ctx.createLinearGradient(0, H * (0.12 + k * 0.1), 0, H * (0.36 + k * 0.1));
      g2.addColorStop(0, 'rgba(' + col + ',0)');
      g2.addColorStop(0.4, 'rgba(' + col + ',' + (base * a) + ')');
      g2.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = g2;
      ctx.fill();
    });
  }
  if (z.lapHue) {
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = 'hsl(' + z.lapHue + ', 80%, 60%)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

//  GHOST - replays your best run for the current mode
// ════════════════════════════════════════════════════════════
const GHOST = {
  rec: [], recT: 0, runT: 0, play: null, playBest: 0, dirty: false,
  key() { return 'ascendGhostRun_' + mode + (mode === 'career' ? '_' + careerLevel : ''); },
  metric() { return mode === 'challenge' ? tokenNeed - 1 : mode === 'jewels' ? jewelScore : score; },
  load() {
    this.play = null; this.playBest = 0;
    try {
      const j = JSON.parse(localStorage.getItem(this.key()) || 'null');
      if (j && j.p && j.p.length) { this.play = j.p; this.playBest = j.best || 0; }
    } catch (e) {}
  },
  reset() { this.rec = []; this.recT = 0; this.runT = 0; this.dirty = false; this.load(); },
  record(ms) {
    this.runT += ms;
    this.recT += ms;
    if (this.recT >= 100 && this.rec.length < 18000) {
      this.recT = 0;
      this.rec.push(+(player.x / W).toFixed(3), Math.round(player.y));
    }
    if (this.metric() > this.playBest) this.dirty = true;
  },
  save() {
    if (!this.dirty) return;
    const m = this.metric();
    if (m <= this.playBest) return;
    try {
      localStorage.setItem(this.key(), JSON.stringify({ best: m, p: this.rec }));
      this.playBest = m;
      this.dirty = false;
    } catch (e) {}
  },
  pos() {
    if (!this.play || !SETTINGS.ghost) return null;
    const i = Math.floor(this.runT / 100) * 2;
    if (i + 1 >= this.play.length) return { x: this.play[this.play.length - 2] * W, y: this.play[this.play.length - 1], done: true };
    return { x: this.play[i] * W, y: this.play[i + 1] };
  },
  draw(time) {
    const g = this.pos();
    if (!g) return;
    ctx.globalAlpha = g.done ? 0.2 : 0.38 + 0.12 * Math.sin(time * 0.006);
    ctx.fillStyle = '#3d8bff';
    ctx.fillRect(g.x - 2, g.y - 2, CFG.PLAYER_W + 4, CFG.PLAYER_H + 4);
    ctx.fillStyle = '#bfe0ff';
    ctx.fillRect(g.x, g.y, CFG.PLAYER_W, CFG.PLAYER_H);
    ctx.fillStyle = '#3d8bff';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GHOST', g.x + CFG.PLAYER_W / 2, g.y - 6);
    ctx.globalAlpha = 1;
  },
  hud() {
    const g = this.pos();
    if (!g) return;
    const d = Math.round((g.y - player.y) / 10);
    ctx.textAlign = 'left';
    ctx.font = 'bold 12px monospace';
    ctx.fillStyle = d >= 0 ? '#3dff9b' : '#ff6688';
    ctx.fillText('ghost ' + (d >= 0 ? '+' : '') + d + 'm', 14, 100);
  },
};

// ── Synth sound effects (WebAudio, no files) ────────────────
const SFX = {
  ac: null, master: null, last: {},
  unlock() {
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ac.destination);
    }
    if (this.ac.state === 'suspended') this.ac.resume();
    MUSIC.start();
  },
  ok(name, gap) {
    if (!SETTINGS.sound || !this.ac) return false;
    const now = performance.now();
    if (this.last[name] && now - this.last[name] < (gap || 40)) return false;
    this.last[name] = now;
    return true;
  },
  tone(type, f1, f2, dur, vol, delay) {
    const t = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq, delay) {
    const t = this.ac.currentTime + (delay || 0);
    const len = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
    const g = this.ac.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
};

// ── Music: plays ascend-music-v1.mp3 from the repo if it exists ─
const MUSIC = {
  el: null, tried: false,
  start() {
    if (!SETTINGS.music) return;
    if (!this.el && !this.tried) {
      this.tried = true;
      const a = new Audio('ascend-music-v1.mp3');
      a.loop = true; a.volume = 0.45;
      a.addEventListener('error', () => { this.el = null; });
      this.el = a;
    }
    if (this.el && this.el.paused) this.el.play().catch(() => {});
  },
  stop() { if (this.el) this.el.pause(); },
};

function buzz(pattern) {
  if (!SETTINGS.buzz || !navigator.vibrate) return;
  try { navigator.vibrate(pattern); } catch (e) {}
}

// ── Particle system ──────────────────────────────────────────
let particles = [];

function spawnSplash(x, y, hue) {
  // Color splash - fast radial burst
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 2,
      life: 1,
      decay: 0.03 + Math.random() * 0.03,
      size: 2 + Math.random() * 3,
      hue: hue + Math.random() * 40 - 20,
      type: 'splash',
    });
  }
  // Dust cloud - slow drifting puffs
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 30,
      y: y - Math.random() * 6,
      vx: (Math.random() - 0.5) * 1.5,
      vy: -0.3 - Math.random() * 0.6,
      life: 1,
      decay: 0.012 + Math.random() * 0.01,
      size: 6 + Math.random() * 10,
      hue: hue,
      type: 'cloud',
    });
  }
}

function spawnJumpPuff(x, y) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 14,
      y,
      vx: (Math.random() - 0.5) * 2,
      vy: 0.5 + Math.random(),
      life: 1,
      decay: 0.05,
      size: 2 + Math.random() * 2,
      hue: 200 + Math.random() * 60,
      type: 'splash',
    });
  }
}

function updateParticles(dt) {
  for (const pt of particles) {
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vy += 0.05 * dt;       // light gravity
    pt.life -= pt.decay * dt;
  }
  particles = particles.filter(pt => pt.life > 0);
  if (particles.length > 400) particles.splice(0, particles.length - 400);
}

function drawParticles() {
  for (const pt of particles) {
    if (pt.type === 'cloud') {
      ctx.globalAlpha = pt.life * 0.25;
      ctx.fillStyle = 'hsl(' + pt.hue + ', 90%, 65%)';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * (1.4 - pt.life * 0.4), 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.globalAlpha = pt.life;
      ctx.fillStyle = 'hsl(' + pt.hue + ', 100%, ' + (55 + pt.life * 25) + '%)';
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
  }
  ctx.globalAlpha = 1;
}

// ── COIN DESCENT MINIGAME - RED PHONE ────────────────────────
// Coins spawn below the player while the parachute is open.
// Steer left/right to catch them. Each catch = gold sparkle burst.
let coins = [];
let coinCount = 0;
let coinSpawnY = 0;   // world-Y we've spawned coins down to

function spawnCoinsBelow(fromY, toY) {
  let y = fromY;
  let cx = player.x + player.w / 2;
  while (y < toY) {
    y += 60 + Math.random() * 50;
    // drift the trail horizontally so the player has to steer
    cx += (Math.random() - 0.5) * 160;
    cx = Math.max(20, Math.min(W - 20, cx));
    coins.push({ x: cx, y, r: 7, taken: false, ph: Math.random() * Math.PI * 2 });
  }
  coinSpawnY = y;
}

function updateCoins() {
  if (player.chute) {
    // Falling = y increases. Spawn coins from just below player down to 1.5 screens below.
    const target = player.y + H * 1.5;
    // Reset spawn cursor if it's stale (above the player or way past the target)
    if (coinSpawnY < player.y + 60 || coinSpawnY > target + H) {
      coinSpawnY = player.y + 60;
    }
    if (coinSpawnY < target) spawnCoinsBelow(coinSpawnY, target);
  }

  // Collect
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;
  for (const c of coins) {
    if (c.taken) continue;
    const dx = pcx - c.x, dy = pcy - c.y;
    if (dx * dx + dy * dy < (c.r + 12) * (c.r + 12)) {
      c.taken = true;
      coinCount++;
      // Gold sparkle burst
      for (let i = 0; i < 10; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1.5 + Math.random() * 3.5;
        particles.push({
          x: c.x, y: c.y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 1, decay: 0.04,
          size: 2 + Math.random() * 2,
          hue: 48 + Math.random() * 12,
          type: 'splash',
        });
      }
      audio.triggers.coin();
    }
  }

  // Cull coins above the camera (passed) or taken
  coins = coins.filter(c => !c.taken && c.y > cameraY - 60);
}

function drawCoins(time) {
  for (const c of coins) {
    const sy = c.y - cameraY;
    if (sy < -20 || sy > H + 20) continue;
    // Spin illusion: width oscillates
    const spin = Math.abs(Math.sin(time * 0.004 + c.ph));
    const rw = c.r * (0.25 + 0.75 * spin);
    // Glow
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = 'hsl(50, 100%, 60%)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, rw + 4, c.r + 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Coin body
    ctx.fillStyle = 'hsl(48, 100%, ' + (55 + spin * 15) + '%)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, rw, c.r, 0, 0, Math.PI * 2);
    ctx.fill();
    // Inner shine
    ctx.fillStyle = 'hsl(52, 100%, 85%)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, rw * 0.5, c.r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Twinkle sparkle on top
    const tw = Math.abs(Math.sin(time * 0.008 + c.ph * 3));
    if (tw > 0.8) {
      ctx.globalAlpha = (tw - 0.8) * 5;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(c.x - 1, c.y - c.r - 4, 2, 3);
      ctx.fillRect(c.x + rw, c.y - 1, 3, 2);
      ctx.globalAlpha = 1;
    }
  }
}

// ── MILESTONES - RED PHONE ───────────────────────────────────
// Every 30 climb-gems (◆) and every 30 descent-coins (◉) grants a
// power-up instantly, alternating rocket / glider.
let nextGemMilestone  = 30;
let nextCoinMilestone = 30;
let banner = { text: '', t: 0 };

function showBanner(text) {
  banner.text = text;
  banner.t = 1;
}

function grantPowerup(kind) {
  if (kind === 'rocket') {
    player.rocketTimer = ROCKET_TIME;
    player.chute = false;
    player.fallTimer = 0;
    showBanner('🚀 ROCKET UNLOCKED!');
    audio.triggers.rocket();
  } else {
    player.hasGlider = true;
    player.gliderTime = GLIDER_TIME;
    showBanner('🪂 GLIDER UNLOCKED!');
    audio.triggers.glider();
  }
  // celebration burst
  for (let i = 0; i < 24; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 6;
    particles.push({
      x: player.x + player.w / 2, y: player.y + player.h / 2,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, decay: 0.02, size: 2 + Math.random() * 3,
      hue: Math.random() * 360, type: 'splash',
    });
  }
  audio.triggers.milestone();
}

function checkMilestones() {
  if (gemCount >= nextGemMilestone) {
    // alternate: 30 rocket, 60 glider, 90 rocket...
    grantPowerup((nextGemMilestone / 30) % 2 === 1 ? 'rocket' : 'glider');
    nextGemMilestone += 30;
  }
  if (coinCount >= nextCoinMilestone) {
    grantPowerup((nextCoinMilestone / 30) % 2 === 1 ? 'glider' : 'rocket');
    nextCoinMilestone += 30;
  }
}

function drawBanner() {
  if (banner.t <= 0) return;
  banner.t -= 0.008;
  const a = Math.min(1, banner.t * 3);
  ctx.globalAlpha = a;
  ctx.fillStyle = 'hsl(' + ((1 - banner.t) * 720 % 360) + ', 100%, 65%)';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'center';
  const bob = Math.sin(banner.t * 20) * 2;
  ctx.fillText(banner.text, W / 2, H * 0.3 + bob);
  ctx.globalAlpha = 1;
}

// ── WIND - RED PHONE ─────────────────────────────────────────
// Global wind drifts between gusts. Pushes the player while airborne
// (double under chute/glider). Indicated by leaning rain-streaks + motes.
const wind = { force: 0, target: 0, timer: 0 };

function updateWind(ms) {
  wind.timer -= ms;
  if (wind.timer <= 0) {
    // New gust target every 4-9 seconds, range -0.28..0.28
    wind.target = (Math.random() - 0.5) * 0.56;
    wind.timer = 4000 + Math.random() * 5000;
  }
  // Ease toward target
  wind.force += (wind.target - wind.force) * 0.01;
}

// Rain-like wind streaks (screen space)
let streaks = [];
function updateStreaks() {
  const strength = Math.abs(wind.force);
  // Spawn rate scales with wind strength - calm = almost none
  const wzz = theme().weather;
  if (Math.random() < (wzz === 'rain' ? 0.1 + strength * 3 : 0.35 + strength * 2)) {
    streaks.push({
      x: Math.random() * W,
      y: -10,
      life: 1,
    });
  }
  for (const s of streaks) {
    const wz = theme().weather;
    const slow = wz === 'snow' ? 0.3 : wz === 'dust' ? 0.15 : wz === 'spark' ? 0.5 : wz === 'ash' ? 0.4 : 1;
    s.x += wind.force * 30 * (wz === 'dust' ? 1.6 : 1);   // lean hard with the wind
    s.y += (7 + strength * 6) * slow;                      // fall
    s.life -= 0.012;
  }
  streaks = streaks.filter(s => s.life > 0 && s.y < H + 20);
}
function drawStreaks() {
  const strength = Math.abs(wind.force);
  const Z = theme();
  if (Z.weather === 'ash') {
    for (const s of streaks) {
      ctx.globalAlpha = s.life * 0.8;
      ctx.fillStyle = (Math.floor(s.x) % 3) ? 'rgba(255,140,40,1)' : 'rgba(90,74,62,1)';
      ctx.fillRect(s.x, s.y, 2, 2);
    }
    ctx.globalAlpha = 1;
    return;
  }
  if (Z.weather !== 'rain') {
    for (const s of streaks) {
      ctx.globalAlpha = s.life * (Z.weather === 'dust' ? 0.5 : 0.8);
      if (Z.weather === 'snow') {
        ctx.fillStyle = 'rgba(' + Z.wcol + ',0.9)';
        ctx.beginPath(); ctx.arc(s.x, s.y, 1.5 + Math.abs(s.y % 3), 0, Math.PI * 2); ctx.fill();
      } else if (Z.weather === 'spark') {
        ctx.fillStyle = (Math.floor(s.y / 40) % 2) ? 'rgba(' + Z.wcol + ',1)' : 'rgba(150,110,240,1)';
        ctx.fillRect(s.x, s.y, 2, 6);
      } else {
        ctx.fillStyle = 'rgba(' + Z.wcol + ',1)';
        ctx.fillRect(s.x, s.y, 1.5, 1.5);
      }
    }
    ctx.globalAlpha = 1;
    return;
  }
  ctx.strokeStyle = 'rgba(' + Z.wcol + ', 0.35)';
  ctx.lineWidth = 1;
  for (const s of streaks) {
    ctx.globalAlpha = s.life * (0.2 + strength * 1.5);
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - wind.force * 30 * 1.8, s.y - (7 + strength * 6) * 1.8);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ── GLIDER POWER-UP - RED PHONE ──────────────────────────────
// Pickup upgrades your parachute to a glider for the rest of the run.
// Glider: faster fall than chute, steerable dives (hold left/right = speed),
// tap jump for a small lift pulse to grab missed coins.
let gliders = [];
const GLIDER_CHANCE = 0.02;
const GLIDER_MAX_FALL = 3.2;
const GLIDER_DIVE_FALL = 7;     // while holding a direction
const GLIDER_LIFT = -4.5;       // lift pulse on jump tap
const GLIDER_TIME = 10000;   // ms of glider flight before it burns out

function maybeSpawnGlider(p) {
  if (Math.random() < GLIDER_CHANCE) {
    gliders.push({ x: p.x + p.w / 2, y: p.y - 14, taken: false, ph: Math.random() * Math.PI * 2 });
  }
}

function updateGliders() {
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;
  for (const g of gliders) {
    if (g.taken) continue;
    const dx = pcx - g.x, dy = pcy - g.y;
    if (dx * dx + dy * dy < 22 * 22) {
      g.taken = true;
      player.hasGlider = true;
      player.gliderTime = GLIDER_TIME;
      audio.triggers.glider();
      for (let i = 0; i < 16; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 5;
        particles.push({
          x: g.x, y: g.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 1, decay: 0.03, size: 2 + Math.random() * 3,
          hue: 175 + Math.random() * 30, type: 'splash',
        });
      }
    }
  }
  gliders = gliders.filter(g => !g.taken && g.y < cameraY + H + 200);
}

function drawGliders(time) {
  for (const g of gliders) {
    const sy = g.y - cameraY;
    if (sy < -20 || sy > H + 20) continue;
    const bob = Math.sin(time * 0.004 + g.ph) * 3;
    const y = g.y + bob;
    ctx.globalAlpha = 0.3 + 0.2 * Math.abs(Math.sin(time * 0.005 + g.ph));
    ctx.fillStyle = 'hsl(185, 100%, 60%)';
    ctx.beginPath();
    ctx.arc(g.x, y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Glider icon: swept wing
    ctx.fillStyle = '#22ddee';
    ctx.beginPath();
    ctx.moveTo(g.x - 10, y + 2);
    ctx.lineTo(g.x, y - 5);
    ctx.lineTo(g.x + 10, y + 2);
    ctx.lineTo(g.x, y - 1);
    ctx.closePath();
    ctx.fill();
  }
}

// ── GEMS (climb collectible, worth 5) - RED PHONE ────────────
let gems = [];
let gemCount = 0;
const GEM_CHANCE = 0.35;

function maybeSpawnGem(p) {
  if (Math.random() < GEM_CHANCE) {
    gems.push({ x: p.x + p.w / 2 + (Math.random() - 0.5) * 30, y: p.y - 40 - Math.random() * 30, taken: false, ph: Math.random() * Math.PI * 2 });
  }
}

function updateGems() {
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;
  for (const g of gems) {
    if (g.taken) continue;
    const dx = pcx - g.x, dy = pcy - g.y;
    if (dx * dx + dy * dy < 20 * 20) {
      g.taken = true;
      gemCount++;
      audio.triggers.gem();
      for (let i = 0; i < 12; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1.5 + Math.random() * 4;
        particles.push({
          x: g.x, y: g.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 1, decay: 0.035, size: 2 + Math.random() * 2.5,
          hue: 280 + Math.random() * 40, type: 'splash',
        });
      }
    }
  }
  gems = gems.filter(g => !g.taken && g.y < cameraY + H + 200);
}

function drawGems(time) {
  for (const g of gems) {
    const sy = g.y - cameraY;
    if (sy < -20 || sy > H + 20) continue;
    const bob = Math.sin(time * 0.003 + g.ph) * 4;
    const y = g.y + bob;
    const pulse = 0.7 + 0.3 * Math.abs(Math.sin(time * 0.006 + g.ph));
    // Glow
    ctx.globalAlpha = 0.35 * pulse;
    ctx.fillStyle = 'hsl(295, 100%, 65%)';
    ctx.beginPath();
    ctx.arc(g.x, y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Diamond
    ctx.fillStyle = 'hsl(290, 95%, ' + (55 + pulse * 20) + '%)';
    ctx.beginPath();
    ctx.moveTo(g.x, y - 8);
    ctx.lineTo(g.x + 6, y);
    ctx.lineTo(g.x, y + 8);
    ctx.lineTo(g.x - 6, y);
    ctx.closePath();
    ctx.fill();
    // Facet shine
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.moveTo(g.x, y - 8);
    ctx.lineTo(g.x + 3, y - 2);
    ctx.lineTo(g.x - 3, y - 2);
    ctx.closePath();
    ctx.fill();
  }
}

// ── CLOUD ZONE (above 300m) - RED PHONE ──────────────────────
const CLOUD_START = -3000;  // world y where clouds begin (300m)
const cloudPuffs = [];
(function initClouds() {
  for (let i = 0; i < 14; i++) {
    cloudPuffs.push({
      x: Math.random() * 2000,
      y: Math.random() * 3000,
      w: 80 + Math.random() * 140,
      h: 24 + Math.random() * 30,
      speed: 0.4 + Math.random() * 0.5,
      drift: (Math.random() - 0.5) * 0.3,
    });
  }
})();

function cloudFactor() {
  // 0 below the zone, fades to 1 across 800px of altitude
  return Math.max(0, Math.min(1, (CLOUD_START - cameraY) / 800));
}

function drawClouds(time) {
  const f = cloudFactor();
  if (f <= 0) return;
  for (const c of cloudPuffs) {
    const sy = ((c.y - cameraY * c.speed) % H + H) % H;
    const sx = ((c.x + time * 0.01 * c.drift * 60) % (W + c.w)) - c.w / 2;
    ctx.globalAlpha = 0.10 * f;
    ctx.fillStyle = '#dde6ff';
    ctx.beginPath();
    ctx.ellipse(sx, sy, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.07 * f;
    ctx.beginPath();
    ctx.ellipse(sx + c.w * 0.25, sy - c.h * 0.3, c.w * 0.3, c.h * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ── ROCKET POWER-UP - RED PHONE ──────────────────────────────
// Pickups spawn on platforms. Grab = 3s uninterrupted upward flight,
// fire out the back, player turns rocket-shaped, ends with a jump kick.
let rockets = [];          // pickup items in world
const ROCKET_TIME = 3.0;   // seconds of flight
const ROCKET_SPEED = -13;  // upward velocity during flight
const ROCKET_CHANCE = 0.03; // chance per platform to carry a pickup

// ── STEADY POWER-UP: two minutes of calm, controllable side movement ──
let steadies = [];
const STEADY_CHANCE   = 0.035;
const STEADY_TIME     = 120000;  // ms
const STEADY_ACCEL    = 1.1;     // vs CFG.PLAYER_SPEED
const STEADY_FRICTION = 0.84;    // vs CFG.FRICTION (higher keeps it smooth, lower accel caps top speed)

function maybeSpawnSteady(p) {
  if (p.solid || p.vx) return;
  if (Math.random() < STEADY_CHANCE) {
    steadies.push({ x: p.x + p.w / 2, y: p.y - 14, taken: false, ph: Math.random() * Math.PI * 2 });
  }
}

function updateSteadies(ms) {
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;
  for (const st of steadies) {
    if (st.taken) continue;
    const dx = pcx - st.x, dy = pcy - st.y;
    if (dx * dx + dy * dy < 22 * 22) {
      st.taken = true;
      player.steadyTime = STEADY_TIME;
      showBanner('STEADY CONTROLS');
      audio.triggers.steady();
      for (let i = 0; i < 16; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 4;
        particles.push({
          x: st.x, y: st.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 1, decay: 0.03, size: 2 + Math.random() * 3,
          hue: 205 + Math.random() * 20, type: 'splash',
        });
      }
    }
  }
  steadies = steadies.filter(st => !st.taken && (mode === 'challenge' || st.y < cameraY + H + 200));
  if (player.steadyTime > 0) {
    player.steadyTime -= ms;
    if (player.steadyTime <= 0) {
      player.steadyTime = 0;
      showBanner('STEADY WORE OFF');
      audio.triggers.spent();
    }
  }
}

function drawSteadies(time) {
  for (const st of steadies) {
    const sy = st.y - cameraY;
    if (sy < -20 || sy > H + 20) continue;
    const y = st.y + Math.sin(time * 0.004 + st.ph) * 3;
    ctx.globalAlpha = 0.3 + 0.2 * Math.abs(Math.sin(time * 0.005 + st.ph));
    ctx.fillStyle = '#3d8bff';
    ctx.beginPath(); ctx.arc(st.x, y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // spirit level: rounded bar with a bubble centered
    ctx.fillStyle = '#1b2f6b';
    ctx.fillRect(st.x - 10, y - 4, 20, 8);
    ctx.fillStyle = '#bfe0ff';
    ctx.fillRect(st.x - 8, y - 2, 16, 4);
    ctx.fillStyle = '#3dff9b';
    ctx.beginPath(); ctx.arc(st.x, y, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1b2f6b';
    ctx.fillRect(st.x - 4, y - 3, 1, 6);
    ctx.fillRect(st.x + 3, y - 3, 1, 6);
  }
}

// ── SHRINK / GROW / STATIC PICKUPS ─────────────────────────────
let oddities = [];
const ODD_CHANCE = { shrink: 0.025, grow: 0.025, static: 0.025, slowmo: 0.025, trail: 0.025 };
const SIZE_TIME   = 30000;   // ms a shrink or grow lasts
const STATIC_TIME = 10000;   // ms the bitfield static covers the screen
const SIZE_SCALE  = { shrink: 0.6, grow: 1.55 };

function maybeSpawnOddity(p) {
  if (p.vx) return;
  const r = Math.random();
  let kind = null, acc = 0;
  for (const k of ['shrink', 'grow', 'static', 'slowmo', 'trail']) { acc += ODD_CHANCE[k]; if (r < acc) { kind = k; break; } }
  if (!kind) return;
  oddities.push({ kind, x: p.x + p.w / 2, y: p.y - 14, taken: false, ph: Math.random() * Math.PI * 2 });
}

function setPlayerSize(scale) {
  const feet = player.y + player.h;
  const cx = player.x + player.w / 2;
  player.w = Math.round(CFG.PLAYER_W * scale);
  player.h = Math.round(CFG.PLAYER_H * scale);
  player.y = feet - player.h;
  player.x = cx - player.w / 2;
}

function updateOddities(ms) {
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;
  const reach = 20 + player.w / 2;
  for (const o of oddities) {
    if (o.taken) continue;
    const dx = pcx - o.x, dy = pcy - o.y;
    if (dx * dx + dy * dy > reach * reach) continue;
    o.taken = true;
    if (o.kind === 'slowmo') {
      player.slowTime = SLOWMO_TIME;
      showBanner('SLOW-MO');
      audio.triggers.slowmo();
    } else if (o.kind === 'trail') {
      const keys = Object.keys(TRAIL_PALETTES);
      player.trailPal = keys[Math.floor(Math.random() * keys.length)];
      player.trailTime = TRAIL_TIME;
      showBanner('TRAIL BLAZER');
      audio.triggers.trail();
    } else if (o.kind === 'static') {
      player.staticTime = STATIC_TIME;
      staticFx.start();
      showBanner('STATIC!');
      audio.triggers.staticOn();
    } else {
      player.sizeKind = o.kind;
      player.sizeTime = SIZE_TIME;
      setPlayerSize(SIZE_SCALE[o.kind]);
      showBanner(o.kind === 'shrink' ? 'SHRUNK' : 'GROWN');
      audio.triggers[o.kind]();
    }
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 4;
      particles.push({ x: o.x, y: o.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: 0.03, size: 2 + Math.random() * 3,
        hue: o.kind === 'static' ? Math.random() * 360 : 210, type: 'splash' });
    }
  }
  oddities = oddities.filter(o => !o.taken && (mode === 'challenge' || o.y < cameraY + H + 200));

  if (player.sizeTime > 0) {
    player.sizeTime -= ms;
    if (player.sizeTime <= 0) {
      player.sizeTime = 0;
      player.sizeKind = '';
      setPlayerSize(1);
      showBanner('BACK TO NORMAL SIZE');
      audio.triggers.spent();
    }
  }
  if (player.slowTime > 0) {
    player.slowTime -= ms;
    if (player.slowTime <= 0) { player.slowTime = 0; showBanner('BACK TO FULL SPEED'); audio.triggers.spent(); }
  }
  if (player.trailTime > 0) {
    player.trailTime -= ms;
    if (player.trailTime <= 0) player.trailTime = 0;
  }
  if (player.staticTime > 0) {
    player.staticTime -= ms;
    if (player.staticTime <= 0) {
      player.staticTime = 0;
      staticFx.on = false;
      showBanner('STATIC CLEARED');
    }
  }
}

function drawOddities(time) {
  for (const o of oddities) {
    const sy = o.y - cameraY;
    if (sy < -24 || sy > H + 24) continue;
    const y = o.y + Math.sin(time * 0.004 + o.ph) * 3;
    ctx.globalAlpha = 0.3 + 0.2 * Math.abs(Math.sin(time * 0.005 + o.ph));
    ctx.fillStyle = o.kind === 'static' ? 'hsl(' + ((time * 0.3) % 360) + ',100%,60%)' : '#3d8bff';
    ctx.beginPath(); ctx.arc(o.x, y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (o.kind === 'slowmo') {
      // hourglass
      ctx.fillStyle = '#e8f1ff';
      ctx.beginPath(); ctx.moveTo(o.x - 7, y - 9); ctx.lineTo(o.x + 7, y - 9); ctx.lineTo(o.x, y); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(o.x - 7, y + 9); ctx.lineTo(o.x + 7, y + 9); ctx.lineTo(o.x, y); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1b2f6b';
      ctx.fillRect(o.x - 8, y - 11, 16, 2); ctx.fillRect(o.x - 8, y + 9, 16, 2);
      ctx.fillStyle = '#ffd21a';
      ctx.beginPath(); ctx.moveTo(o.x - 4, y + 8); ctx.lineTo(o.x + 4, y + 8); ctx.lineTo(o.x, y + 3); ctx.closePath(); ctx.fill();
      continue;
    }
    if (o.kind === 'trail') {
      const pal = TRAIL_PALETTES.rainbow;
      for (let k = 0; k < 6; k++) { ctx.fillStyle = pal[k]; ctx.fillRect(o.x - 10, y - 9 + k * 3, 14, 3); }
      ctx.fillStyle = '#e8f1ff'; ctx.fillRect(o.x + 4, y - 6, 7, 12);
      ctx.strokeStyle = '#1b2f6b'; ctx.lineWidth = 1.5; ctx.strokeRect(o.x + 4, y - 6, 7, 12);
      continue;
    }
    if (o.kind === 'static') {
      for (let gy = 0; gy < 4; gy++) for (let gx = 0; gx < 4; gx++) {
        ctx.fillStyle = 'hsl(' + (((gx * 7 ^ gy * 13) * 40 + time * 0.4) % 360) + ',100%,55%)';
        ctx.fillRect(o.x - 8 + gx * 4, y - 8 + gy * 4, 4, 4);
      }
      ctx.strokeStyle = '#1b2f6b'; ctx.lineWidth = 1.5;
      ctx.strokeRect(o.x - 8, y - 8, 16, 16);
    } else {
      const big = o.kind === 'grow';
      const sz = big ? 14 : 6;
      ctx.fillStyle = '#e8f1ff';
      ctx.fillRect(o.x - sz / 2, y - sz / 2, sz, sz);
      ctx.strokeStyle = '#1b2f6b'; ctx.lineWidth = 1.5;
      ctx.strokeRect(o.x - sz / 2, y - sz / 2, sz, sz);
      // corner arrows: out for grow, in for shrink
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      for (const [ax, ay] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        const a1 = big ? 9 : 12, a2 = big ? 12 : 8;
        ctx.beginPath();
        ctx.moveTo(o.x + ax * a1, y + ay * a1);
        ctx.lineTo(o.x + ax * a2, y + ay * a2);
        ctx.stroke();
      }
    }
  }
}

// ── Bitfield static: patterns ported from sudosilo/bitfield-synth ──
const staticFx = {
  on: false, R: 72, cv: null, cx: null, img: null, fn: null, pal: null, t: 0, skip: 0,
  exprs: [
    (x, y, t, b) => Math.tan(x | y ^ t / 30) * 10,
    (x, y, t, b) => Math.tan(x | y ^ t / 30) * 10 * (1 + b.bass * 4),
    (x, y, t, b) => (x ^ y) + t + b.treble * 60,
    (x, y, t, b) => Math.tan(x * y / 40 + t / 20 + b.beat * 3) * 8,
    (x, y, t, b) => (Math.sin(x / 8 + t / 30) + Math.sin(y / 8) + Math.sin((x + y) / 16 + t / 40) + b.vol * 4) * 40,
    (x, y, t, b) => (x | y ^ t / 20) * (1 + b.bass * 5),
    (x, y, t, b) => ((x * y) >> 3) + t * 2,
    (x, y, t, b) => (x & y) * 4 + t,
  ],
  palettes: ['blue', 'spectrum', 'fire', 'ice', 'neon'],
  hue(h) {
    h = ((h % 360) + 360) % 360;
    const c = 255, X = (c * (1 - Math.abs((h / 60) % 2 - 1))) | 0;
    if (h < 60) return [c, X, 0]; if (h < 120) return [X, c, 0]; if (h < 180) return [0, c, X];
    if (h < 240) return [0, X, c]; if (h < 300) return [X, 0, c]; return [c, 0, X];
  },
  buildPal(kind) {
    const P = new Uint8ClampedArray(256 * 3);
    for (let b = 0; b < 256; b++) {
      const n = b / 255; let r, g, bl;
      if (kind === 'blue') { r = b * 0.22; g = b * 0.52; bl = Math.min(255, b * 1.1); }
      else if (kind === 'spectrum') { [r, g, bl] = this.hue(n * 360); }
      else if (kind === 'fire') { r = Math.min(255, n * 3 * 255); g = Math.min(255, Math.max(0, (n - 0.33) * 3) * 255); bl = Math.min(255, Math.max(0, (n - 0.66) * 3) * 255); }
      else if (kind === 'ice') { bl = Math.min(255, n * 2.2 * 255); g = Math.min(255, Math.max(0, (n - 0.35) * 2.2) * 255); r = Math.min(255, Math.max(0, (n - 0.7) * 3.3) * 255); }
      else { if (n < 0.5) { const k = n / 0.5; r = k * 255; g = k * 40; bl = k * 255; } else { const k = (n - 0.5) / 0.5; r = 40 * (1 - k); g = k * 255; bl = 255; } }
      P[b * 3] = r; P[b * 3 + 1] = g; P[b * 3 + 2] = bl;
    }
    return P;
  },
  start() {
    if (!this.cv) {
      this.cv = document.createElement('canvas');
      this.cv.width = this.cv.height = this.R;
      this.cx = this.cv.getContext('2d');
      this.img = this.cx.createImageData(this.R, this.R);
    }
    this.fn = this.exprs[Math.floor(Math.random() * this.exprs.length)];
    this.pal = this.buildPal(this.palettes[Math.floor(Math.random() * this.palettes.length)]);
    this.t = Math.random() * 1000;
    this.on = true;
  },
  render() {
    const R = this.R, d = this.img.data, P = this.pal, fn = this.fn, t = this.t;
    // fake audio drive so the audio presets still pulse
    const b = {
      bass: 0.5 + 0.5 * Math.sin(t / 9), treble: 0.5 + 0.5 * Math.sin(t / 5),
      vol: 0.5 + 0.5 * Math.sin(t / 13), beat: Math.max(0, Math.sin(t / 4)) ** 8,
    };
    for (let y = 0; y < R; y++) for (let x = 0; x < R; x++) {
      let v; try { v = fn(x, y, t, b); } catch (e) { v = 0; }
      if (!isFinite(v)) v = 0;
      const c = (v | 0) & 255, i = (y * R + x) * 4;
      d[i] = P[c * 3]; d[i + 1] = P[c * 3 + 1]; d[i + 2] = P[c * 3 + 2]; d[i + 3] = 255;
    }
    this.cx.putImageData(this.img, 0, 0);
  },
  draw(ms) {
    if (!this.on || !player || player.staticTime <= 0) return;
    this.t += ms / 16.67;
    if ((this.skip = (this.skip + 1) % 2) === 0) this.render();
    const left = player.staticTime, total = STATIC_TIME;
    // fade in over the first half second, out over the last second
    const fade = Math.min(1, (total - left) / 500, left / 1000);
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = 0.62 * fade;
    ctx.drawImage(this.cv, 0, 0, W, H);
    ctx.restore();
  },
};

// ── POWER-UP PACING: one picker, spaced far apart ──────────────
const POWERUP_GAP  = 14;     // minimum platforms between any two power-ups
const POWERUP_ROLL = 0.30;   // chance per platform once the gap has passed
const PU_WEIGHTS = { rocket: 3, glider: 2, steady: 3, shrink: 1.5, grow: 1.5, static: 1.5, slowmo: 2, trail: 2 };
let platsSincePU = 0;
function maybeSpawnPowerup(p) {
  platsSincePU++;
  if (p.vx || platsSincePU < POWERUP_GAP || Math.random() > POWERUP_ROLL) return;
  let total = 0; for (const k in PU_WEIGHTS) total += PU_WEIGHTS[k];
  let r = Math.random() * total, kind = 'rocket';
  for (const k in PU_WEIGHTS) { r -= PU_WEIGHTS[k]; if (r <= 0) { kind = k; break; } }
  const item = { x: p.x + p.w / 2, y: p.y - 14, taken: false, ph: Math.random() * Math.PI * 2 };
  if (kind === 'rocket') rockets.push(item);
  else if (kind === 'glider') gliders.push(item);
  else if (kind === 'steady') steadies.push(item);
  else { item.kind = kind; oddities.push(item); }
  platsSincePU = 0;
}

// ── GAUNTLET MODE: industrial, three lives, turrets, no falling ──
const GAUNTLET_LIVES = 3;
const GAUNTLET_FALL  = 340;   // px below your last platform before you lose a life
const GAUNTLET_THEME = { top: '#f3cf9e', bot: '#b9a58e', grid: '#7a6450', player: '#1f3a8a', weather: 'ash', wcol: '255,140,40', starA: 0 };
let lives = GAUNTLET_LIVES;
let checkpoint = null;
let invulnT = 0;
let turrets = [];
let bullets = [];

function theme() { return mode === 'gauntlet' ? GAUNTLET_THEME : ZONES[zoneIdx]; }

function maybeSpawnTurret(p) {
  if (mode !== 'gauntlet' || p.vx || p.isGround || p.y > -1500) return;
  const m = -p.y / 10;
  const chance = Math.min(0.28, 0.10 + m / 20000);
  if (Math.random() > chance) return;
  const side = Math.random() < 0.5 ? 0.2 : 0.8;
  turrets.push({ x: p.x + p.w * side, y: p.y, plat: p, cd: 1200 + Math.random() * 1500, aim: -Math.PI / 2, dead: false });
}

function loseLife(reason) {
  if (invulnT > 0 || state !== STATE.PLAYING) return;
  lives--;
  audio.triggers.hurt();
  buzz([120, 60, 160]);
  warpFlash = 0.6;
  if (lives <= 0) {
    lives = 0;
    GHOST.dirty = true; GHOST.save();
    LB.queue();
    state = STATE.DEAD;
    stateSince = performance.now();
    audio.triggers.die();
    return;
  }
  showBanner(reason + ' ' + lives + (lives === 1 ? ' LIFE LEFT' : ' LIVES LEFT'));
  invulnT = 2200;
  bullets = [];
  const cp = checkpoint && platforms.includes(checkpoint) ? checkpoint : platforms.find(q => q.isGround);
  player.x = cp.x + cp.w / 2 - player.w / 2;
  player.y = cp.y - player.h;
  player.vx = 0; player.vy = 0;
  player.chute = false; player.fallTimer = 0; player.rocketTimer = 0;
}

function updateGauntlet(ms, wr) {
  if (mode !== 'gauntlet') return;
  if (invulnT > 0) invulnT -= ms;
  if (player.onGround) {
    const under = platforms.find(q => !q.vx &&
      player.x + player.w > q.x && player.x < q.x + q.w && Math.abs(player.y + player.h - q.y) < 2);
    if (under) checkpoint = under;
  }
  const cpY = checkpoint ? checkpoint.y : 0;
  if (player.y > cpY + GAUNTLET_FALL && player.rocketTimer <= 0) loseLife('FELL!');
  if (score > bestGauntlet) {
    bestGauntlet = score;
    localStorage.setItem('bestGauntlet', bestGauntlet);
    LB.queue();
  }
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  const m = Math.max(0, score);
  const interval = Math.max(1300, 2200 - m * 0.25);
  for (const t of turrets) {
    if (!platforms.includes(t.plat)) { t.dead = true; continue; }
    const sy = t.y - cameraY;
    t.aim = Math.atan2(pcy - (t.y - 10), pcx - t.x);
    if (sy < -40 || sy > H + 40) continue;
    t.cd -= ms * wr;
    if (t.cd <= 0) {
      t.cd = interval * (0.85 + Math.random() * 0.3);
      const sp = 3.4;
      bullets.push({ x: t.x + Math.cos(t.aim) * 14, y: t.y - 10 + Math.sin(t.aim) * 14,
        vx: Math.cos(t.aim) * sp, vy: Math.sin(t.aim) * sp, life: 4500 });
      audio.triggers.shot();
    }
  }
  turrets = turrets.filter(t => !t.dead);
  for (const b of bullets) {
    b.x += b.vx * wr * (ms / 16.67);
    b.y += b.vy * wr * (ms / 16.67);
    b.life -= ms * wr;
    if (b.x > player.x - 2 && b.x < player.x + player.w + 2 && b.y > player.y - 2 && b.y < player.y + player.h + 2) {
      b.life = 0;
      if (player.rocketTimer <= 0) loseLife('HIT!');
    }
    // steel blocks stop rounds
    for (const q of platforms) if (q.solid && b.x > q.x && b.x < q.x + q.w && b.y > q.y && b.y < q.y + q.h) b.life = 0;
  }
  bullets = bullets.filter(b => b.life > 0);
}

function drawTurrets(time) {
  if (mode !== 'gauntlet') return;
  for (const t of turrets) {
    const sy = t.y - cameraY;
    if (sy < -40 || sy > H + 40) continue;
    ctx.fillStyle = '#4a4038';
    ctx.fillRect(t.x - 10, t.y - 10, 20, 10);
    ctx.fillStyle = '#ffcc00';
    for (let i = 0; i < 4; i++) ctx.fillRect(t.x - 10 + i * 6, t.y - 3, 3, 3);
    ctx.fillStyle = '#6b5d50';
    ctx.beginPath(); ctx.arc(t.x, t.y - 10, 8, Math.PI, 0); ctx.fill();
    ctx.save();
    ctx.translate(t.x, t.y - 10);
    ctx.rotate(t.aim);
    ctx.fillStyle = '#2b2520';
    ctx.fillRect(0, -2.5, 16, 5);
    ctx.restore();
    // warning light flashes right before a shot
    const warn = t.cd < 450;
    ctx.fillStyle = warn ? (Math.floor(time / 80) % 2 ? '#ff3b1a' : '#ffd21a') : '#3d8bff';
    ctx.beginPath(); ctx.arc(t.x, t.y - 16, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  for (const b of bullets) {
    ctx.fillStyle = '#ff6a1a';
    ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.arc(b.x, b.y, 1.5, 0, Math.PI * 2); ctx.fill();
  }
}

function drawGirder(p, time) {
  ctx.fillStyle = '#5a4a3e';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = '#8a6d55';
  ctx.fillRect(p.x, p.y, p.w, 2);
  ctx.fillStyle = '#3a2f27';
  ctx.fillRect(p.x, p.y + p.h - 2, p.w, 2);
  ctx.fillStyle = '#ffcc00';
  for (let x = p.x; x < p.x + p.w - 4; x += 12) ctx.fillRect(x, p.y + 2, 6, 2);
  ctx.fillStyle = '#2b2520';
  for (let x = p.x + 4; x < p.x + p.w - 2; x += 10) ctx.fillRect(x, p.y + 5, 2, 2);
  if (p.vx) {
    ctx.fillStyle = '#3d8bff';
    ctx.fillRect(p.x, p.y + p.h, p.w, 2);
  }
}

// Factory skyline with smokestacks, steam, pipes and blinking lights
const factory = [];
(function initFactory() {
  for (let i = 0; i < 18; i++) factory.push({ x: Math.random() * 2000, w: 30 + Math.random() * 70, h: 80 + Math.random() * 220, layer: i % 2, stack: Math.random() < 0.4, ph: Math.random() * 6 });
})();
function drawIndustrialBG(time) {
  const speeds = [0.08, 0.2];
  for (let L = 0; L < 2; L++) {
    const col = L ? '#7a6656' : '#9c8875';
    for (const f of factory) {
      if (f.layer !== L) continue;
      const sx = f.x % (W + 100) - 50;
      const base = H + ((-cameraY * speeds[L]) % 300);
      ctx.fillStyle = col;
      ctx.fillRect(sx, base - f.h, f.w, f.h + 400);
      if (f.stack) {
        ctx.fillRect(sx + f.w * 0.35, base - f.h - 60, 10, 60);
        const puff = (time * 0.02 + f.ph * 40) % 60;
        ctx.globalAlpha = 0.25 * (1 - puff / 60);
        ctx.fillStyle = '#f5ece0';
        ctx.beginPath(); ctx.arc(sx + f.w * 0.35 + 5, base - f.h - 64 - puff, 8 + puff * 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = Math.sin(time * 0.004 + f.ph) > 0.6 ? '#ff3b1a' : '#3d8bff';
      ctx.fillRect(sx + 4, base - f.h + 6, 3, 3);
    }
  }
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#5a4a3e';
  const gap = 260, off = ((-cameraY * 0.5) % gap + gap) % gap;
  for (let y = off; y < H; y += gap) { ctx.fillRect(0, y, W, 6); ctx.fillRect(0, y + 10, W, 2); }
  ctx.globalAlpha = 1;
}

function drawLives() {
  if (mode !== 'gauntlet') return;
  for (let i = 0; i < GAUNTLET_LIVES; i++) {
    const x = 68 + i * 18, y = 54;
    ctx.fillStyle = i < lives ? '#3d8bff' : 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.moveTo(x + 7, y + 12);
    ctx.bezierCurveTo(x - 4, y + 4, x + 1, y - 3, x + 7, y + 2);
    ctx.bezierCurveTo(x + 13, y - 3, x + 18, y + 4, x + 7, y + 12);
    ctx.fill();
  }
  if (invulnT > 0) {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('shielded', 68, 80);
    ctx.textAlign = 'right';
  }
}

// ── JEWELS MODE: jewels everywhere, score is jewels collected ────
const JEWEL_SET = 8;          // platforms per set; collect every jewel in a set for a bonus
const JEWEL_SET_BONUS = 10;
const JEWEL_KINDS = [
  { c: '#ff2a55', e: '#ffd0da' },  // ruby
  { c: '#3d8bff', e: '#d6e8ff' },  // sapphire
  { c: '#22d07a', e: '#c8ffe2' },  // emerald
  { c: '#ffb81a', e: '#fff0c0' },  // topaz
  { c: '#a64bff', e: '#ead6ff' },  // amethyst
];
let jewels = [];
let jewelScore = 0;
let jewelPlat = 0;
const jewelSets = {};

function maybeSpawnJewels(p) {
  if (mode !== 'jewels') return;
  const set = Math.floor(jewelPlat++ / JEWEL_SET);
  const S = jewelSets[set] || (jewelSets[set] = { total: 0, got: 0, done: false });
  const n = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const diamond = Math.random() < 0.04;
    const k = JEWEL_KINDS[Math.floor(Math.random() * JEWEL_KINDS.length)];
    const arc = (i - (n - 1) / 2);
    jewels.push({
      x: Math.max(10, Math.min(W - 10, p.x + p.w / 2 + arc * 18)),
      y: p.y - 24 - (n - Math.abs(arc)) * 10,
      c: diamond ? '#e8f8ff' : k.c, e: diamond ? '#ffffff' : k.e, v: diamond ? 5 : 1,
      diamond, set, ph: Math.random() * 6, taken: false,
    });
    S.total++;
  }
}

function updateJewels() {
  if (mode !== 'jewels') return;
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  const reach = 16 + player.w / 2;
  for (const j of jewels) {
    if (j.taken) continue;
    const dx = pcx - j.x, dy = pcy - j.y;
    if (dx * dx + dy * dy > reach * reach) continue;
    j.taken = true;
    jewelScore += j.v;
    const S = jewelSets[j.set];
    if (S) S.got++;
    audio.triggers.gem();
    if (j.diamond) { showBanner('DIAMOND +5'); buzz(30); }
    if (S && S.got === S.total && !S.done) {
      S.done = true;
      jewelScore += JEWEL_SET_BONUS;
      showBanner('PERFECT SET +' + JEWEL_SET_BONUS);
      audio.triggers.token();
    }
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3;
      particles.push({ x: j.x, y: j.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.04,
        size: 1.5 + Math.random() * 2, hue: 200, type: 'splash' });
    }
  }
  jewels = jewels.filter(j => !j.taken && j.y < cameraY + H + 200);
  if (jewelScore > bestJewels) {
    bestJewels = jewelScore;
    localStorage.setItem('bestJewels', bestJewels);
    LB.queue();
  }
}

function drawJewels(time) {
  if (mode !== 'jewels') return;
  for (const j of jewels) {
    const sy = j.y - cameraY;
    if (sy < -20 || sy > H + 20) continue;
    const y = j.y + Math.sin(time * 0.005 + j.ph) * 2.5;
    const r = j.diamond ? 9 : 6;
    ctx.fillStyle = j.c;
    ctx.beginPath();
    ctx.moveTo(j.x, y - r); ctx.lineTo(j.x + r * 0.8, y - r * 0.2);
    ctx.lineTo(j.x, y + r); ctx.lineTo(j.x - r * 0.8, y - r * 0.2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = j.e;
    ctx.beginPath();
    ctx.moveTo(j.x, y - r); ctx.lineTo(j.x + r * 0.35, y - r * 0.2); ctx.lineTo(j.x - r * 0.35, y - r * 0.2);
    ctx.closePath(); ctx.fill();
    if (Math.sin(time * 0.01 + j.ph * 3) > 0.92) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(j.x + r * 0.3, y - r, 2, 2);
    }
  }
}

// ── CAREER MODE: 25 levels, each one a target height ───────────
const LEVEL_COUNT = 25;
const LEVEL_TARGET = n => Math.round(150 * Math.pow(14000 / 150, (n - 1) / (LEVEL_COUNT - 1)) / 10) * 10;
let careerLevel    = Math.max(1, parseInt(localStorage.getItem('ascendCareerLevel') || '1'));
let careerUnlocked = Math.max(1, parseInt(localStorage.getItem('ascendCareerUnlocked') || '1'));
let careerCleared  = parseInt(localStorage.getItem('ascendCareerCleared') || '0');
let levelDoneT = 0;
careerLevel = Math.min(careerLevel, careerUnlocked, LEVEL_COUNT);

function applyDifficulty() {
  if (mode === 'career') {
    const k = (careerLevel - 1) / (LEVEL_COUNT - 1);
    DIFF.solid = 0.06 + k * 0.16;
    DIFF.mover = 0.10 + k * 0.18;
    DIFF.gapMax = 80 + k * 30;
  } else {
    DIFF.solid = SOLID_CHANCE; DIFF.mover = 0.15; DIFF.gapMax = 90;
  }
}

let levelTime = 0;
const result = { level: 1, time: 0, best: 0, newBest: false, rank: null, posting: false };
function lvBestTime(n) { return parseInt(localStorage.getItem('ascendLvTime_' + n) || '0'); }
function fmtTime(ms) {
  const t = Math.max(0, Math.round(ms / 100));
  const m = Math.floor(t / 600), sec = Math.floor((t % 600) / 10), d = t % 10;
  return m + ':' + String(sec).padStart(2, '0') + '.' + d;
}

function advanceFromResult() {
  if (careerLevel < LEVEL_COUNT) {
    careerLevel++;
    localStorage.setItem('ascendCareerLevel', careerLevel);
    LB.syncLevel();
    setState(STATE.PLAYING);
  } else {
    setState(STATE.MENU);
    initGame();
  }
}

function checkLevel(ms) {
  if (mode !== 'career') return;
  if (levelDoneT > 0) {
    levelDoneT -= ms;
    if (levelDoneT <= 0) {
      levelDoneT = 0;
      setState(STATE.RESULT);
    }
    return;
  }
  if (score >= LEVEL_TARGET(careerLevel)) {
    levelDoneT = 1400;
    const prev = lvBestTime(careerLevel);
    result.level = careerLevel; result.time = levelTime; result.rank = null;
    result.newBest = !prev || levelTime < prev;
    result.best = result.newBest ? levelTime : prev;
    if (result.newBest) localStorage.setItem('ascendLvTime_' + careerLevel, String(Math.round(levelTime)));
    LB.postTime(careerLevel, Math.round(levelTime));
    if (careerLevel > careerCleared) {
      careerCleared = careerLevel;
      localStorage.setItem('ascendCareerCleared', careerCleared);
      LB.queue();
    }
    if (careerLevel + 1 > careerUnlocked && careerLevel < LEVEL_COUNT) {
      careerUnlocked = careerLevel + 1;
      localStorage.setItem('ascendCareerUnlocked', careerUnlocked);
    }
    GHOST.dirty = true; GHOST.save();
    showBanner(careerLevel === LEVEL_COUNT ? 'CAREER COMPLETE!' : 'LEVEL ' + careerLevel + ' CLEAR');
    audio.triggers.milestone();
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
      particles.push({ x: player.x + player.w / 2, y: player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: 0.015, size: 2 + Math.random() * 4, hue: 200 + Math.random() * 40, type: 'splash' });
    }
  }
}

function drawFinishLine() {
  if (mode !== 'career') return;
  const y = -LEVEL_TARGET(careerLevel) * 10;
  if (y - cameraY < -30 || y - cameraY > H + 30) return;
  const sq = 10;
  for (let i = 0; i * sq < W; i++) for (let r = 0; r < 2; r++) {
    ctx.fillStyle = (i + r) % 2 ? '#3d8bff' : '#ffffff';
    ctx.fillRect(i * sq, y - 10 + r * sq, sq, sq);
  }
  ctx.fillStyle = '#1b2f6b';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('LEVEL ' + careerLevel + ' TOP', W / 2, y - 16);
}

const TRAIL_TIME = 20000;
const TRAIL_PALETTES = {
  rainbow: ['#ff2a2a', '#ff9a1a', '#ffe81a', '#33e04a', '#2a9bff', '#8a4bff'],
  ocean:   ['#0b2a6e', '#1b4fbf', '#3d8bff', '#6fb0ff', '#a9d4ff', '#e3f1ff'],
  fire:    ['#5a0a00', '#b31d00', '#ff4a00', '#ff8c1a', '#ffd21a', '#fff3b0'],

let blaze = [];
function updateBlaze() {
  if (!player || player.trailTime <= 0) { if (blaze.length) blaze = blaze.filter(b => (b.life -= 0.02) > 0); return; }
  const pal = TRAIL_PALETTES[player.trailPal];

  const last = blaze[blaze.length - 1];
  const steps = last ? Math.min(12, Math.ceil(Math.hypot(x - last.x, y - last.y) / 3)) : 1;
  for (let i = 1; i <= steps; i++) {
    const f = i / steps;
    blaze.push({ x: last ? last.x + (x - last.x) * f : x, y: last ? last.y + (y - last.y) * f : y, life: 1, pal });
  }
  for (const b of blaze) b.life -= 0.006;

function maybeSpawnRocket(p) {

function updateRockets(ms) {
  // Collect
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;
  for (const r of rockets) {
    if (r.taken) continue;
    const dx = pcx - r.x, dy = pcy - r.y;
    if (dx * dx + dy * dy < 22 * 22) {
      r.taken = true;
      player.rocketTimer = ROCKET_TIME;
      player.chute = false;
      player.fallTimer = 0;
      audio.triggers.rocket();
      // launch burst
      for (let i = 0; i < 16; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 5;
        particles.push({
          x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 1, decay: 0.03, size: 2 + Math.random() * 3,
          hue: 20 + Math.random() * 40, type: 'splash',
        });
      }
    }
  }
  rockets = rockets.filter(r => !r.taken && r.y < cameraY + H + 200);

  // Rocket flight
  if (player.rocketTimer > 0) {
    player.rocketTimer -= ms / 1000;
    player.vy = ROCKET_SPEED;
    // Fire out the back - every frame
    for (let i = 0; i < 3; i++) {
      particles.push({
        x: player.x + player.w / 2 + (Math.random() - 0.5) * 6,
        y: player.y + player.h,
        vx: (Math.random() - 0.5) * 1.5,
        vy: 3 + Math.random() * 3,
        life: 1, decay: 0.05 + Math.random() * 0.04,
        size: 2.5 + Math.random() * 3.5,
        hue: Math.random() < 0.6 ? 18 + Math.random() * 25 : 45 + Math.random() * 15, // orange/yellow
        type: 'splash',
      });
    }
    // Expiry → ending jump kick
    if (player.rocketTimer <= 0) {
      player.rocketTimer = 0;
      player.vy = CFG.JUMP_FORCE;
      spawnJumpPuff(player.x + player.w / 2, player.y + player.h);
    }
  }
}

function drawRockets(time) {
  for (const r of rockets) {
    const sy = r.y - cameraY;
    if (sy < -20 || sy > H + 20) continue;
    const bob = Math.sin(time * 0.004 + r.ph) * 3;
    const y = r.y + bob;

function drawStarfield(time) {

    const sy = ((s.y - cameraY * speeds[s.layer]) % H + H) % H;
    const sx = s.x % W;

    ctx.globalAlpha = twinkle * (0.25 + s.layer * 0.25) * ZONES[zoneIdx].starA;
    ctx.fillStyle = 'hsl(' + ((s.hue + time * 0.02) % 360) + ', 90%, 70%)';
    ctx.fillRect(sx, sy, s.size, s.size);
  }
  ctx.globalAlpha = 1;

  // Faint horizontal grid lines that scroll with the world - strong fall cue
  ctx.globalAlpha = zoneIdx === 0 ? 0.05 : 0.12;
  ctx.strokeStyle = ZONES[zoneIdx].grid;
  ctx.lineWidth = 1;
  const gridGap = 120;
  const offset = ((-cameraY) % gridGap + gridGap) % gridGap;
  for (let gy = offset; gy < H; gy += gridGap) {
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
