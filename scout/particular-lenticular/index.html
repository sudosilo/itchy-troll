<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lenticular Tilt</title>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #6b7078;
    --line: #dcd8cf;
    --accent: #e0662a;
    --accent-ink: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
  body { padding: 16px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .slot {
    position: relative; aspect-ratio: 3 / 4; border: 2px dashed var(--line); border-radius: 10px;
    background: var(--panel); display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-size: 13px; color: var(--muted); text-align: center;
  }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slot input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  .slot .tag {
    position: absolute; left: 6px; top: 6px; background: var(--accent); color: var(--accent-ink);
    border-radius: 6px; padding: 2px 6px; font-size: 12px; z-index: 2;
  }
  .stage {
    position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: var(--panel);
    border: 1px solid var(--line);
  }
  canvas { display: block; width: 100%; height: auto; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    flex: 1; min-width: 120px; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: 15px;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  label.ctl { display: block; margin-top: 12px; font-size: 14px; color: var(--muted); }
  input[type=range] { width: 100%; }
  .status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
</style>
</head>
<body>
  <h1>Lenticular Tilt</h1>

  <div class="slots">
    <label class="slot"><span class="tag">1</span><span>Tap to add left photo</span><input type="file" accept="image/*" data-i="0"></label>
    <label class="slot"><span class="tag">2</span><span>Tap to add center photo</span><input type="file" accept="image/*" data-i="1"></label>
    <label class="slot"><span class="tag">3</span><span>Tap to add right photo</span><input type="file" accept="image/*" data-i="2"></label>
  </div>

  <div class="stage" id="stage">
    <div class="empty" id="empty">Add all three photos, then tilt the phone left and right.</div>
    <canvas id="cv" hidden></canvas>
  </div>

  <div class="row">
    <button class="primary" id="startBtn">Start tilt</button>
    <button id="centerBtn">Set center here</button>
  </div>

  <label class="ctl">Tilt range in degrees: <span id="rangeVal">15</span>
    <input type="range" id="range" min="5" max="40" value="15">
  </label>
  <label class="ctl">Lens lines: <span id="linesVal">60</span>
    <input type="range" id="lines" min="20" max="160" value="60">
  </label>
  <label class="ctl">Manual tilt (works without the sensor)
    <input type="range" id="manual" min="-100" max="100" value="0">
  </label>

  <div class="status" id="status"></div>

<script>
(function () {
  var imgs = [null, null, null];
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var statusEl = document.getElementById("status");
  var rangeEl = document.getElementById("range");
  var linesEl = document.getElementById("lines");
  var manualEl = document.getElementById("manual");

  var tiltRange = 15;
  var lineCount = 60;
  var centerGamma = 0;
  var lastGamma = 0;
  var target = 1;
  var pos = 1;
  var sensorOn = false;

  function setStatus(t) { statusEl.textContent = t; }

  document.querySelectorAll(".slot input").forEach(function (inp) {
    inp.addEventListener("change", function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var i = Number(inp.dataset.i);
      var url = URL.createObjectURL(f);
      var im = new Image();
      im.onload = function () {
        imgs[i] = im;
        var slot = inp.parentElement;
        var old = slot.querySelector("img");
        if (old) old.remove();
        var thumb = document.createElement("img");
        thumb.src = url;
        slot.insertBefore(thumb, inp);
        setupCanvas();
      };
      im.src = url;
    });
  });

  function setupCanvas() {
    if (!imgs[0] || !imgs[1] || !imgs[2]) {
      var n = imgs.filter(Boolean).length;
      setStatus(n + " of 3 photos loaded.");
      return;
    }
    var base = imgs[1];
    var maxW = 1200;
    var scale = Math.min(1, maxW / base.naturalWidth);
    cv.width = Math.round(base.naturalWidth * scale);
    cv.height = Math.round(base.naturalHeight * scale);
    cv.hidden = false;
    document.getElementById("empty").hidden = true;
    setStatus("Ready. Tap Start tilt, hold the phone level, then tap Set center here.");
  }

  function drawCover(im, sx, sw) {
    var cw = cv.width, ch = cv.height;
    var r = Math.max(cw / im.naturalWidth, ch / im.naturalHeight);
    var dw = im.naturalWidth * r, dh = im.naturalHeight * r;
    var ox = (cw - dw) / 2, oy = (ch - dh) / 2;
    var srcX = (sx - ox) / r, srcW = sw / r;
    ctx.drawImage(im, srcX, -oy / r, srcW, ch / r, sx, 0, sw, ch);
  }

  function render() {
    if (!cv.hidden && imgs[0] && imgs[1] && imgs[2]) {
      var cw = cv.width, ch = cv.height;
      var stripW = cw / lineCount;
      ctx.clearRect(0, 0, cw, ch);
      for (var s = 0; s < lineCount; s++) {
        var x = Math.floor(s * stripW);
        var w = Math.ceil(stripW) + 1;
        var sweep = (s / (lineCount - 1) - 0.5) * 0.6;
        var p = Math.max(0, Math.min(2, pos + sweep));
        var a = Math.floor(p);
        if (a > 1) a = 1;
        var frac = p - a;
        var k = frac * frac * (3 - 2 * frac);
        ctx.globalAlpha = 1;
        drawCover(imgs[a], x, w);
        if (k > 0.001) {
          ctx.globalAlpha = k;
          drawCover(imgs[a + 1], x, w);
        }
      }
      ctx.globalAlpha = 1;
      for (var l = 0; l < lineCount; l++) {
        var lx = Math.floor(l * stripW);
        var g = ctx.createLinearGradient(lx, 0, lx + stripW, 0);
        g.addColorStop(0, "rgba(255,255,255,0.18)");
        g.addColorStop(0.45, "rgba(255,255,255,0)");
        g.addColorStop(1, "rgba(0,0,0,0.16)");
        ctx.fillStyle = g;
        ctx.fillRect(lx, 0, Math.ceil(stripW), ch);
      }
    }
    pos += (target - pos) * 0.18;
    requestAnimationFrame(render);
  }

  function gammaToTarget(gamma) {
    var d = gamma - centerGamma;
    var t = d / tiltRange;
    t = Math.max(-1, Math.min(1, t));
    target = 1 + t;
  }

  function onOrient(e) {
    if (e.gamma == null) return;
    lastGamma = e.gamma;
    gammaToTarget(e.gamma);
  }

  function startSensor() {
    if (sensorOn) return;
    var add = function () {
      window.addEventListener("deviceorientation", onOrient);
      sensorOn = true;
      setStatus("Tilt is live. Tap Set center here while holding the phone level.");
      setTimeout(function () {
        if (lastGamma === 0) setStatus("No tilt data yet. Use the manual slider, or check that motion sensors are allowed for this site.");
      }, 2500);
    };
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(function (r) {
        if (r === "granted") add(); else setStatus("Motion permission was denied.");
      }).catch(function () { setStatus("Motion permission failed."); });
    } else {
      add();
    }
  }

  document.getElementById("startBtn").addEventListener("click", startSensor);
  document.getElementById("centerBtn").addEventListener("click", function () {
    centerGamma = lastGamma;
    gammaToTarget(lastGamma);
    setStatus("Center set.");
  });
  rangeEl.addEventListener("input", function () {
    tiltRange = Number(rangeEl.value);
    document.getElementById("rangeVal").textContent = tiltRange;
  });
  linesEl.addEventListener("input", function () {
    lineCount = Number(linesEl.value);
    document.getElementById("linesVal").textContent = lineCount;
  });
  manualEl.addEventListener("input", function () {
    target = 1 + Number(manualEl.value) / 100;
  });

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
