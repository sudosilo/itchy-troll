<title>Fleet</title>
<style>
:root{--sea:#eef7f9;--ink:#123a4a;--card:#ffffff;--muted:#4f6f7c;--line:#d5e7ec;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sea);overflow:hidden;font-family:"Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.title{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);background:rgba(255,255,255,.85);padding:8px 12px;border-radius:10px;font-weight:700;font-size:17px;pointer-events:none}
.title span{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.back{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);background:rgba(255,255,255,.85);color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:460px;margin:0 auto;background:var(--card);border-radius:16px;padding:16px 16px 14px;box-shadow:0 6px 24px rgba(18,58,74,.18);transform:translateY(160%);transition:transform .25s ease}
.sheet.open{transform:none}
.sheet h2{margin:0 0 4px;font-size:19px;word-break:break-word}
.sheet p{margin:0 0 4px;color:var(--muted);font-size:14px;word-break:break-all}
.row{display:flex;gap:10px;margin-top:12px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.go{background:var(--ink);color:#fff;flex:1}
.close{background:var(--line);color:var(--ink)}
button:focus-visible{outline:3px solid #2f6fd6;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>

  const rx=W*0.42,ry=H*0.24,R=Math.min(W,H)*0.17;
  const coast=(th,f)=>[rx*f*Math.cos(th),H-ry*f*Math.sin(th)];

}

function placeAnchors(){

function poly(p,col){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.strokeStyle=col;ctx.stroke();}

  ctx.lineWidth=1.2;ctx.lineJoin='round';ctx.lineCap='round';

    poly([[L/2,0],[L*.22,-w/2],[-L*.44,-w/2],[-L/2,-w*.3],[-L/2,w*.3],[-L*.44,w/2],[L*.22,w/2]],c);
    box(-L*.16,-w*.22,L*.06,w*.22,acc);
    line(L*.12,0,L*.34,0,c);line(-L*.26,0,-L*.4,0,c);
    stacks(b,[[-L*.05,0],[-L*.12,0]].slice(0,b.stackN),L*.03,c);
  }else if(b.kind==='tanker'){
    const w=L*0.2;
    poly([[L/2,0],[L*.44,-w*.4],[L*.34,-w/2],[-L/2,-w/2],[-L/2,w/2],[L*.34,w/2],[L*.44,w*.4]],c);
    line(-L*.3,0,L*.4,0,c);
    for(let i=0;i<5;i++){ctx.strokeStyle=c;ctx.beginPath();ctx.arc(-L*.24+i*L*.14,0,w*.22,0,6.283);ctx.stroke();}
    box(-L*.46,-w*.34,-L*.34,w*.34,acc);
    stacks(b,[[-L*.4,0]],L*.02,c);
  }else if(b.kind==='cargo'){
    const w=L*0.24;
    poly([[L/2,0],[L*.36,-w/2],[-L/2,-w/2],[-L/2,w/2],[L*.36,w/2]],c);
    const x0=-L*.3,cw=L*.15;
    for(let i=0;i<4;i++)box(x0+i*cw+0.8,-w*.3,x0+(i+1)*cw-0.8,w*.3,c);
    box(-L*.46,-w*.3,-L*.36,w*.3,acc);
    stacks(b,[[-L*.41,0]],L*.025,c);
  }else if(b.kind==='tug'){
    const w=L*0.5;
    poly([[L/2,0],[L*.36,-w*.42],[L*.1,-w/2],[-L*.36,-w/2],[-L/2,-w*.3],[-L/2,w*.3],[-L*.36,w/2],[L*.1,w/2],[L*.36,w*.42]],c);
    box(-L*.14,-w*.22,L*.18,w*.22,acc);
    stacks(b,[[-L*.27,0]],L*.05,c);
  }else if(b.kind==='speed'){
    const w=L*0.34;
    poly([[L/2,0],[L*.05,-w/2],[-L/2,-w*.42],[-L/2,w*.42],[L*.05,w/2]],c);
    ctx.strokeStyle=acc;ctx.beginPath();ctx.moveTo(L*.02,-w*.3);ctx.lineTo(L*.18,0);ctx.lineTo(L*.02,w*.3);ctx.stroke();
  }else{
    const w=L*0.28;
    poly([[L/2,0],[L*.15,-w/2],[-L*.45,-w*.38],[-L/2,0],[-L*.45,w*.38],[L*.15,w/2]],c);
    const mx=L*.12,ang=Math.PI-b.side*(0.45+0.12*Math.sin(t*0.6+b.bob));
    const ex=mx+Math.cos(ang)*L*.6,ey=Math.sin(ang)*L*.6;
    const midx=(mx+ex)/2,midy=ey/2,px=-Math.sin(ang)*L*.14*b.side,py=Math.cos(ang)*L*.14*b.side;
    poly([[mx,0],[midx+px,midy+py],[ex,ey]],acc);
  }
}

function label(text,x,y,align){ctx.font='600 '+Math.round(11*Math.min(1.2,T))+'px "Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif';ctx.textAlign=align||'center';ctx.fillStyle=MUTED;ctx.fillText(text,x,y);}
function drawShore(t){
  ctx.lineWidth=1.3;ctx.lineJoin='round';ctx.lineCap='round';
  const b=G.bay;
  ctx.strokeStyle='#9bb7c0';ctx.setLineDash([4,5]);ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.stroke();ctx.setLineDash([]);
  const ax=b.x,ay=b.y-b.r-8*T;
  ctx.strokeStyle=MUTED;ctx.beginPath();ctx.arc(ax,ay-6*T,1.8*T,0,6.283);ctx.moveTo(ax,ay-4*T);ctx.lineTo(ax,ay+4*T);ctx.moveTo(ax-3*T,ay-1.5*T);ctx.lineTo(ax+3*T,ay-1.5*T);ctx.moveTo(ax-4.5*T,ay+1*T);ctx.quadraticCurveTo(ax,ay+7*T,ax+4.5*T,ay+1*T);ctx.stroke();
  label('Anchor bay',ax+8*T,ay+1*T,'left');
  const [lx,ly]=G.light,h=22*T;
  const ba=t*0.9;
  ctx.strokeStyle='rgba(224,120,0,.45)';ctx.lineWidth=1;
  for(const o of [0,Math.PI]){ctx.beginPath();ctx.moveTo(lx,ly-h);ctx.lineTo(lx+Math.cos(ba+o)*70*T,ly-h+Math.sin(ba+o)*70*T*0.5);ctx.stroke();}
  ctx.lineWidth=1.3;ctx.strokeStyle=INK;
  poly([[lx-4*T,ly],[lx+4*T,ly],[lx+2.5*T,ly-h+4*T],[lx-2.5*T,ly-h+4*T]],INK);
  box(lx-3*T,ly-h,lx+3*T,ly-h+4*T,'#e07800');
  line(lx-3.4*T,ly-h*0.45,lx+3.4*T,ly-h*0.45,INK);
  label('Cloudflare',lx+8*T,ly-h*0.5,'left');
  const [yx,yy]=G.yard,[sx,sy]=G.yardStop,ang=Math.atan2(sy-yy,sx-yx),nx=-Math.sin(ang)*5*T,ny=Math.cos(ang)*5*T;
  line(yx+nx,yy+ny,sx+nx*0.6,sy+ny*0.6,INK);line(yx-nx,yy-ny,sx-nx*0.6,sy-ny*0.6,INK);
  for(let i=1;i<5;i++){const f=i/5,px=yx+(sx-yx)*f*0.8,py=yy+(sy-yy)*f*0.8;line(px+nx,py+ny,px-nx,py-ny,'#8a7550');}
  line(yx-10*T,yy+6*T,yx-10*T,yy-18*T,INK);line(yx-10*T,yy-18*T,yx+6*T,yy-18*T,INK);line(yx+4*T,yy-18*T,yx+4*T,yy-12*T,INK);
  label('GitHub shipyard',yx,yy+16*T,'center');
  const [pax,pay]=G.pierA,[dex,dey]=G.dockEnd,pa=Math.atan2(dey-pay,dex-pax),qx=-Math.sin(pa)*3*T,qy=Math.cos(pa)*3*T;
  line(pax+qx,pay+qy,dex+qx,dey+qy,INK);line(pax-qx,pay-qy,dex-qx,dey-qy,INK);line(dex+qx,dey+qy,dex-qx,dey-qy,INK);
  const [cx,cy]=G.crane;
  box(cx-9*T,cy-6*T,cx+3*T,cy+4*T,INK);
  line(cx+6*T,cy+4*T,cx+6*T,cy-16*T,INK);line(cx+6*T,cy-16*T,cx+16*T,cy-12*T,INK);
  label('Railway dock',cx-2*T,cy+16*T,'center');
  for(const u of G.buoys){
    ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(u.x,u.y,3*T,0,6.283);ctx.stroke();
    if(u.lit>0){ctx.strokeStyle='rgba(214,58,58,'+Math.min(1,u.lit*2).toFixed(2)+')';ctx.beginPath();ctx.arc(u.x,u.y,6*T,0,6.283);ctx.stroke();}
  }
  label('Redis',G.buoys[1].x+8*T,G.buoys[1].y+4*T,'left');
}

function adiff(a,b){let d=a-b;while(d>Math.PI)d-=6.283;while(d<-Math.PI)d+=6.283;return d;}
function update(dt,t){
  const m=50*S+20;
  for(const b of boats){
    const k=KIND[b.kind],L=k.len*b.lenF*S;
    if(b.anchored){
      b.h+=Math.sin(t*0.25+b.bob)*0.12*dt;
      b.x=b.ax+Math.cos(t*0.3+b.bob)*2*S;b.y=b.ay+Math.sin(t*0.3+b.bob)*2*S;
    }else{
      let sp=b.spdBase*S*MOTION,tr;
      if(b.trip){
        const dx=b.trip.x-b.x,dy=b.trip.y-b.y,d=Math.hypot(dx,dy);
        if(d<6+L*0.3){sp=0;b.trip.wait-=dt;tr=0;if(b.trip.wait<=0){b.trip=null;b.tripT=40+Math.random()*50;b.h+=Math.PI;}}
        else{tr=Math.sign(adiff(Math.atan2(dy,dx),b.h))*1.8;sp=Math.max(sp,10*S*MOTION);}
      }else{
        b.turnT-=dt;
        if(b.turnT<=0){b.turn=(Math.random()-0.5)*(b.kind==='cargo'||b.kind==='tanker'?0.25:b.kind==='tug'?0.9:0.6);b.turnT=2+Math.random()*4;}
        tr=b.turn;
        if(b.x<m||b.x>W-m||b.y<m+40||b.y>H-m||inLand(b.x,b.y,34)||inBay(b.x,b.y,22)){const want=Math.atan2(H*0.4-b.y,W*0.62-b.x);tr=Math.sign(adiff(want,b.h))*(b.kind==='cargo'||b.kind==='tanker'?0.8:1.5);}
        if(b.dest){b.tripT-=dt;if(b.tripT<=0){const p=b.dest==='dock'?G.dockEnd:G.yardStop;b.trip={x:p[0],y:p[1],wait:3};}}
        if(b.kind==='tug'){
          b.spinT-=dt;
          if(b.spinT<=0&&b.spin<=0){b.spin=Math.PI*2;b.spinT=6+Math.random()*9;}
          if(b.spin>0){const d=Math.min(b.spin,dt*Math.PI*MOTION);b.h+=d;b.spin-=d;sp*=0.3;}
        }
      }
      b.h+=tr*dt*MOTION;
      b.x+=Math.cos(b.h)*sp*dt;b.y+=Math.sin(b.h)*sp*dt;
      b.x=Math.min(Math.max(b.x,0),W);b.y=Math.min(Math.max(b.y,0),H);
      b.trailT-=dt;
      if(b.trailT<=0){b.trailT=0.12;if(sp>0)b.trail.unshift([b.x-Math.cos(b.h)*L*.5,b.y-Math.sin(b.h)*L*.5,b.h]);else b.trail.pop();if(b.trail.length>14)b.trail.pop();}
      for(const u of G.buoys)if(Math.hypot(u.x-b.x,u.y-b.y)<12*T+L*0.4)u.lit=0.6;
    }
    if(k.stacks&&b.stackLocal&&!b.anchored){
      b.smokeT-=dt;
      if(b.smokeT<=0){b.smokeT=0.5+Math.random()*0.3;const c=Math.cos(b.h),s=Math.sin(b.h);for(const p of b.stackLocal)smoke.push({x:b.x+p[0]*c-p[1]*s,y:b.y+p[0]*s+p[1]*c,r:2*S,life:1});}
    }
  }
  for(const u of G.buoys)u.lit=Math.max(0,u.lit-dt);
  for(const p of smoke){p.life-=dt*1.1;p.r+=dt*4*S;p.x+=dt*6;p.y-=dt*4;}
  smoke=smoke.filter(p=>p.life>0);
  if(smoke.length>600)smoke.splice(0,smoke.length-600);
}
function drawWake(b){
  const tr=b.trail;if(tr.length<2)return;
  const L=KIND[b.kind].len*b.lenF*S,spread=(0.25+b.spdBase/46)*L*0.5;
  ctx.lineCap='round';ctx.lineWidth=1;
  for(let side=-1;side<=1;side+=2){
    for(let i=0;i<tr.length-1;i++){
      const a=tr[i],c=tr[i+1],ta=i/tr.length,tc=(i+1)/tr.length;
      const oa=L*.08+ta*spread,oc=L*.08+tc*spread;
      ctx.strokeStyle='rgba(18,58,74,'+(0.3*(1-ta)).toFixed(3)+')';
      ctx.beginPath();
      ctx.moveTo(a[0]-Math.sin(a[2])*oa*side,a[1]+Math.cos(a[2])*oa*side);
      ctx.lineTo(c[0]-Math.sin(c[2])*oc*side,c[1]+Math.cos(c[2])*oc*side);
      ctx.stroke();
    }
  }
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000),t=now/1000;last=now;
  update(dt,t);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(water,0,0,W,H);
  drawShore(t);
  for(const b of boats)drawWake(b);
  for(const b of boats){const L=KIND[b.kind].len*b.lenF*S;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.h+(b.anchored?0:Math.sin(t*1.3+b.bob)*0.03));drawBoat(b,L,t);ctx.restore();}
  ctx.lineWidth=1;for(const p of smoke){ctx.strokeStyle='rgba(18,58,74,'+(0.28*p.life).toFixed(3)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.stroke();}
  if(sel){const L=KIND[sel.kind].len*sel.lenF*S;ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.beginPath();ctx.arc(sel.x,sel.y,L*0.62+6,0,6.283);ctx.stroke();ctx.setLineDash([]);}
  requestAnimationFrame(frame);
}

const sheet=document.getElementById('sheet');
function openSheet(b){
  sel=b;
  document.getElementById('bname').textContent=b.name;
  document.getElementById('bkind').textContent=KIND[b.kind].label+(b.kb?', '+(b.kb/1024).toFixed(1)+' MB':'');
  document.getElementById('bage').textContent=b.days==null?'No update date':(b.anchored?'Anchored, ':'')+'updated '+b.days+(b.days===1?' day ago':' days ago');
  document.getElementById('bhost').textContent=b.host;
  sheet.classList.add('open');
}
function closeSheet(){sel=null;sheet.classList.remove('open');}
cv.addEventListener('pointerdown',e=>{
  let best=null,bd=1e9;
  for(const b of boats){const L=KIND[b.kind].len*b.lenF*S,d=Math.hypot(e.clientX-b.x,e.clientY-b.y);if(d<Math.max(L*0.6,20)&&d<bd){bd=d;best=b;}}
  if(best)openSheet(best);else closeSheet();
});
document.getElementById('go').addEventListener('click',()=>{if(sel)window.open('https://'+sel.host,'_blank','noopener');});
document.getElementById('shut').addEventListener('click',closeSheet);
addEventListener('resize',resize);
resize();place();requestAnimationFrame(frame);
</script>
<script src="viz-menu.js"></script>
