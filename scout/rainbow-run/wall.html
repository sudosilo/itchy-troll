<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Rainbow Run wall</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#eef3f5}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hold{display:none}
</style>
<script>
/* Rainbow Run wall host.
   Rainbow Run sizes this page to the whole wall of phones and shows each phone only its own slice.
   Every phone runs the same visualizer with the same seed and the same steps of time, so every phone
   ends up with the same picture. The visualizer code is the mohave.wtf code, unchanged; this page only
   swaps in a seeded Math.random, a shared clock, and a frame loop that Rainbow Run drives. */
(function(){
"use strict";
const q=new URLSearchParams(location.search);

/* seeded random, the same sequence on every phone */
let a=(parseInt(q.get("seed"),10)||1)>>>0;
Math.random=function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* time only moves when Rainbow Run says so, in fixed sixtieths of a second */
let sim=0;const queue=[];
performance.now=function(){return sim};
window.requestAnimationFrame=function(f){queue.push(f);return queue.length};
window.cancelAnimationFrame=function(){};
const dpr=parseFloat(q.get("dpr"))||1;
try{Object.defineProperty(window,"devicePixelRatio",{get:function(){return dpr}})}catch(e){}
window.matchMedia=function(){return {matches:false,addEventListener:function(){},removeEventListener:function(){},addListener:function(){},removeListener:function(){}}};

/* while catching up to the room, steps run without drawing */
window.__skip=false;
const P=CanvasRenderingContext2D.prototype;
["fill","stroke","fillRect","strokeRect","clearRect","fillText","strokeText","drawImage","putImageData"].forEach(function(m){
  const o=P[m];P[m]=function(){if(window.__skip)return;return o.apply(this,arguments)};
});
const STEP=1000/60;
/* Rainbow Run calls this every frame with the milliseconds since this scene's shared start. */
window.__tick=function(target){
  /* catch up in slices of about a dozen milliseconds, so the phone never freezes while it catches up */
  const until=Date.now()+12;let n=0;
  while(sim+STEP<=target&&(n<4||Date.now()<until)){
    window.__skip=target-(sim+STEP)>STEP*2;
    sim+=STEP;n++;
    const run=queue.splice(0,queue.length);
    for(let i=0;i<run.length;i++){try{run[i](sim)}catch(e){window.__err=String(e&&e.stack||e)}}
  }
  window.__skip=false;
  return target-sim>STEP*3?"catching":"live";
};

/* A made up catalog for the visualizers to draw. Each entry becomes one fish, car, bird and so on. */
const WORDS=["maple","comet","harbor","juniper","quartz","ember","drift","lumen","cobalt","sable","willow","onyx",
  "breeze","cinder","delta","fable","glint","hollow","iris","jetty","kestrel","lark","meadow","nimbus",
  "orbit","pebble","quill","ripple","summit","thistle","umber","vapor","wren","yarrow","zephyr","basalt"];
const now=Date.now(),RAW=[],DATES={},REAL={};
let r=7;const rnd=function(){r=(r*16807)%2147483647;return r/2147483647};
WORDS.forEach(function(w,i){
  RAW.push(w+"|=");
  DATES[w]=new Date(now-Math.floor(rnd()*rnd()*140)*86400000).toISOString().slice(0,10);
  const k=rnd();if(k>0.8)REAL[w]=Math.round(1000+rnd()*7000);else if(k>0.5)REAL[w]=Math.round(100+rnd()*900);
});
window.FLEET_DATA={RAW:RAW.join("\n"),DATES:DATES,REAL:REAL};
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hold">
  <span id="count"></span>
  <div id="sheet"><h2 id="bname"></h2><p id="bkind"></p><p id="bage"></p><p id="bhost"></p><button id="go"></button><button id="shut"></button></div>
</div>
<script type="text/plain" src="viz-menu.js"></script>
<script>
(function(){
  const q=new URLSearchParams(location.search),file=(q.get("s")||"").replace(/[^a-z]/g,""),sc=(q.get("sc")||"").replace(/[^a-z]/g,"");
  if(sc)document.body.dataset.scene=sc;
  /* g=ck runs a coffeekit screensaver, g=se a Spectral Engine visualizer, anything else a mohave.wtf visualizer */
  const gr=q.get("g"),list=gr==="ck"?["ck/coffeekit.js"]:gr==="se"?["se/spectral-engine-v2-loop.js","se/spectral.js"]:["mw/viz-common.js","mw/"+file+".js"];
  list.forEach(function(src){const el=document.createElement("script");el.src=src;el.async=false;document.body.appendChild(el)});
})();
</script>
</body>
</html>
