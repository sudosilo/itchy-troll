<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Packet Baron</title>
<style>
:root{--bg:#fffaf0;--card:#ffffff;--ink:#2b2420;--muted:#7a6e66;--line:#eadfce;--red:#d8432b;--yellow:#f2b705;--green:#2f9e5b;--blue:#2d6cdf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-variant-numeric:tabular-nums;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;height:86px;overflow:hidden;background:var(--card);border-bottom:2px solid var(--line);padding:10px 14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}
.logo span{color:var(--red)}
.cash{font-weight:800;font-size:22px;color:var(--green)}
.sub{color:var(--muted);font-size:12px;display:flex;gap:12px;white-space:nowrap;overflow:hidden;height:16px;margin-top:4px}
.goal{height:6px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.goal i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yellow));width:0}
nav{display:flex;gap:6px;padding:8px 10px;background:var(--bg);position:sticky;top:86px;z-index:4;overflow-x:auto}
nav button{flex:1;min-width:54px;padding:9px 4px;border:2px solid var(--line);background:var(--card);border-radius:10px;font-weight:700;color:var(--ink);font-size:12px;white-space:nowrap}
nav button.on{border-color:var(--red);color:var(--red)}
nav button.lock{opacity:.4}
main{padding:6px 10px 120px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px}
.name{font-weight:700}
.meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:16px}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:20px}
.flav{height:34px;overflow:hidden}
.slot{min-height:78px}
.grow{flex:1;min-width:0}
.btns{display:flex;gap:6px;margin-top:8px}
button.act{flex:1;min-width:0;height:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;border:none;border-radius:10px;font-weight:700;font-size:13px;color:#fff;background:var(--red)}
button.act.alt{background:var(--blue)}
button.act.ok{background:var(--green)}
button.act:disabled{background:#cfc6bb}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);width:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:#fff1c9;color:#8a6200;margin-left:4px}
.tag.hit{background:#ffe0d9;color:var(--red)}
h3{margin:14px 4px 4px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.flav{font-size:13px;color:var(--muted);font-style:italic;margin-top:4px}
#tw{display:block;width:100%;border:2px solid var(--line);border-radius:14px;background:#eaf4ff;touch-action:manipulation}
.twhint{color:var(--muted);font-size:12px;text-align:center;height:16px;margin:4px 0}
.gcard{height:132px;padding:8px 10px}
.gcard canvas{display:block;width:100%;height:96px}
.glg{display:flex;gap:14px;font-size:12px;font-weight:700;height:18px;white-space:nowrap;overflow:hidden}
.glg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sorts{display:flex;gap:6px;margin:6px 0;height:36px}
.sorts button{flex:1;border:2px solid var(--line);background:#fff;border-radius:9px;font-weight:700;font-size:11px;color:var(--ink);padding:0 2px}
.sorts button.on{border-color:var(--blue);color:var(--blue)}
.meta2{color:var(--ink);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:16px}
button.act.mini{flex:0 0 50px;font-size:12px}
button.act.stop{background:#7a6e66}
.tower{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#eaf4ff}
.roof{height:54px;background:linear-gradient(#cfe8ff,#eaf4ff);position:relative}
.roof:before{content:'';position:absolute;left:0;right:0;bottom:0;height:30px;background:#d8432b;clip-path:polygon(0 100%,50% 0,100% 100%)}
.roof span{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:#fff;color:#d8432b;font-weight:800;font-size:12px;padding:3px 10px;border-radius:6px;white-space:nowrap;z-index:1}
.fl{margin:0 8px;background:#f6efe2;border-left:2px solid #d9ccb6;border-right:2px solid #d9ccb6}
.flc{display:block;width:100%;height:56px;touch-action:manipulation}
.card .dd{margin:8px -12px -10px;width:calc(100% + 24px);border-radius:0 0 12px 12px}
.card.nest{margin-left:18px;border-left:4px solid #e8873a}
.dd{display:block;width:100%;height:34px;border:none;border-top:1px dashed #d9ccb6;background:#fffaf0;text-align:left;padding:0 10px;font-weight:700;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden}
.ddl{background:#fff;border-top:1px solid #eadfce}
.mrow{display:flex;align-items:center;gap:6px;height:58px;padding:0 6px;border-bottom:1px solid #f1e8da}
.mrow .grow{min-width:0}
.mrow button.act{flex:0 0 auto;height:36px;max-width:96px;font-size:11px}
.mrow button.act.mini{flex:0 0 44px}
.ground canvas{display:block;width:100%;height:60px}
#ticker{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);padding:8px 12px;font-size:13px;max-height:96px;overflow:hidden;z-index:6}
#ticker div{padding:2px 0;color:var(--muted)}
#ticker div:first-child{color:var(--ink);font-weight:600}
.shelf{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pk{flex:none;position:relative;line-height:0;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.pk svg{display:block}
.fly{position:fixed;z-index:25;pointer-events:none;animation:fly .9s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(-50%,-50%) rotate(0)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - var(--dy))) rotate(var(--r))}}
.bin{text-align:center;font-size:10px;color:var(--muted);width:52px;line-height:1.3}
.bin .pk{margin:0 auto 2px;width:44px}
input[type=range]{width:100%}
.big{font-size:20px;font-weight:800}
.pop{position:fixed;inset:0;background:rgba(43,36,32,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.pop .card{max-width:380px;text-align:center}
#evt{position:fixed;inset:0;background:rgba(255,250,240,.94);z-index:30;display:none}
#evt .box{position:absolute;left:16px;right:16px;top:150px;background:#fff;border:3px solid var(--red);border-radius:16px;padding:14px;text-align:center}
#evt .kicker{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--red)}
#evt .big{margin:6px 0}
#evt .fx{margin-top:8px;font-weight:700;color:var(--blue)}
#evtGo{position:absolute;top:18px;right:12px;padding:10px 16px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-weight:800;color:var(--ink)}
#evtBait{position:absolute;padding:10px 6px;border:none;border-radius:10px;font-weight:700;font-size:13px;color:#fff;background:var(--red);transform:translate(-50%,-50%);width:44%}
.haha{position:fixed;z-index:40;font-weight:900;color:var(--red);pointer-events:none;transform:translate(-50%,-50%);animation:up 1.4s ease-out forwards;text-align:center;font-size:18px}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-90px}}
.pk.glit{filter:drop-shadow(0 0 3px #ffd700) drop-shadow(0 0 1px #ffb000)}
.pk.glit:after{content:'';position:absolute;inset:4px 2px;border-radius:3px;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.85) 45%,rgba(255,255,255,0) 60%);background-size:250% 100%;animation:shine 1.6s linear infinite;pointer-events:none}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.pk.s2{filter:drop-shadow(0 0 2px #9aa7b0) drop-shadow(0 0 4px #dfe6ea)}
.pk.s2:after{background:linear-gradient(115deg,rgba(255,255,255,0) 25%,rgba(255,255,255,1) 45%,rgba(200,210,220,.6) 55%,rgba(255,255,255,0) 70%);background-size:250% 100%}
.pk.s3{filter:drop-shadow(0 0 3px #b388ff) drop-shadow(0 0 2px #4dd0e1)}
.pk.s3:after{background:linear-gradient(115deg,rgba(255,0,128,.35),rgba(255,200,0,.35),rgba(0,255,170,.35),rgba(0,140,255,.35),rgba(200,0,255,.35));background-size:300% 100%;animation:shine 2.2s linear infinite}
.pk.s4{filter:drop-shadow(0 0 0 #000) drop-shadow(2px 2px 0 #222)}
.pk.s5{filter:drop-shadow(0 0 4px #ff4fa3)}
.pk.s5:before{content:'★';position:absolute;right:-4px;top:-6px;font-size:16px;line-height:1;color:#ffcc00;text-shadow:0 0 3px #ff4fa3;z-index:2;animation:twk 1s ease-in-out infinite alternate}
.pk.s6{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 2px #39ff14)}to{filter:drop-shadow(0 0 9px #39ff14) drop-shadow(0 0 3px #b6ff9a)}}
@keyframes twk{from{transform:scale(.85) rotate(-10deg)}to{transform:scale(1.15) rotate(10deg)}}
.tag.st{background:#f1e6ff;color:#6b2fb3}
.tag.gl{background:#fff4b8;color:#a07800}
.tag.evt{background:#dde9ff;color:var(--blue)}
</style>
</head>

function factoryList(){const L=ownedList().filter(p=>!p.combo);if(!sortOrder)return S.sort==='new'?L.slice().reverse():L;const idx=id=>{const i=sortOrder.indexOf(id);return i<0?-1:i};return L.slice().sort((a,b)=>idx(a.id)-idx(b.id))}
function graphHTML(){return '<div class="card gcard"><div class="glg"><span><i style="background:#2d6cdf"></i>Made <span class="gm">0</span>/s</span><span><i style="background:#2f9e5b"></i>Sold <span class="gs">0</span>/s</span><span class="gp" style="color:#7a6e66"></span></div><canvas class="gr"></canvas></div>'}
function drawGraphs(){document.querySelectorAll('canvas.gr').forEach(c=>{const W=c.clientWidth,H=96,d=window.devicePixelRatio||1;if(!W)return;
 if(c.width!==Math.round(W*d)){c.width=Math.round(W*d);c.height=Math.round(H*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,H);
 const mx=Math.max(1,...hist.map(h=>Math.max(h.m,h.s)))*1.1;x.strokeStyle='#eadfce';x.lineWidth=1;for(let k=1;k<4;k++){x.beginPath();x.moveTo(0,H*k/4);x.lineTo(W,H*k/4);x.stroke()}
 x.fillStyle='#7a6e66';x.font='10px system-ui';x.textAlign='left';x.fillText(num(mx),2,10);
 const N=120,line=(key,col)=>{x.strokeStyle=col;x.lineWidth=2;x.beginPath();hist.forEach((h,i)=>{const px=W-(hist.length-1-i)*(W/(N-1)),py=H-2-(h[key]/mx)*(H-14);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()};
 line('m','#2d6cdf');line('s','#2f9e5b')});
 const L=hist[hist.length-1]||{m:0,s:0};document.querySelectorAll('.gm').forEach(e=>e.textContent=L.m.toFixed(1));document.querySelectorAll('.gs').forEach(e=>e.textContent=L.s.toFixed(1));
 const gap=L.m?Math.round(L.s/L.m*100):0;document.querySelectorAll('.gp').forEach(e=>e.textContent=L.m?'selling '+gap+'% of output':'')}
let last=performance.now(),dAcc=0,sAcc=0;
let tAcc=0;
function loop(now){const dt=Math.min(1,(now-last)/1000);last=now;tAcc+=dt;if(tAcc>=.1){tick(Math.min(1,tAcc));tAcc=0}if(tab==='tower')drawTower(now);dAcc+=dt;sAcc+=dt;
 if(dAcc>.5){dAcc=0;const ae=document.activeElement;if(!(ae&&ae.type==='range'))draw();else{$('cash').textContent=money(S.cash)}}
 if(sAcc>5){sAcc=0;save()}requestAnimationFrame(loop)}
say('You make ketchup, mustard, mayo and soy sauce. The margins are terrible.');
draw();requestAnimationFrame(loop);
</script>
