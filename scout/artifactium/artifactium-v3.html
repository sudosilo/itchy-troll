<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artifactium</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f2ea;--card:#fffdf8;--ink:#1d2430;--muted:#6b7380;--line:#ddd6c6;
  --blue:#1d5fc4;--blue-soft:#e3ecfa;--mat:#2a64c0;
  --known:#1d5fc4;--hunch:#b7791f;--mystery:#7a4fb5;
  --hdr:58px;--flt:118px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px}
button,select,input,textarea{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",monospace}

#top{position:fixed;top:0;left:0;right:0;height:var(--hdr);display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--card);border-bottom:3px solid var(--blue);z-index:20}
#burger{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;flex:none;cursor:pointer}
#burger span{display:block;width:20px;height:2px;background:var(--blue);border-radius:2px}
.brand{flex:1;min-width:0}
.title{font-family:Fraunces,serif;font-weight:700;letter-spacing:.14em;font-size:18px;color:var(--ink)}
.sub{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.iconbtn{width:42px;height:42px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:24px;line-height:1;flex:none;cursor:pointer}

#filters{position:fixed;top:var(--hdr);left:0;right:0;height:var(--flt);background:var(--paper);border-bottom:1px solid var(--line);z-index:15;padding:10px 12px 0}
#q{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card)}
#q:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.frow{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:4px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.frow select{flex:none;width:150px;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:0 8px}
.frow select.set{border-color:var(--blue);background:var(--blue-soft);color:#173f80;font-weight:600}
#countline{height:18px;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#grid{padding:calc(var(--hdr) + var(--flt) + 12px) 12px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:1100px;margin:0 auto}
#grid.size-s{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
#grid.size-l{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{display:block;text-align:left;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;cursor:pointer}
.card:active{transform:scale(.98)}
.mat{background-color:var(--mat);background-image:linear-gradient(rgba(255,255,255,.17) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.17) 1px,transparent 1px);background-size:12px 12px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative}
.mat svg{width:78%;height:78%;filter:drop-shadow(2px 3px 2px rgba(0,0,30,.35))}
.mat img{width:100%;height:100%;object-fit:cover}
.mat .oq{position:absolute;top:6px;right:6px;background:#fff;color:var(--mystery);font-size:10px;font-weight:600;border-radius:10px;padding:2px 7px}
.cmeta{padding:8px 10px 10px;height:78px}
.code{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--blue);letter-spacing:.03em}
.kname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid currentColor;letter-spacing:.03em}
.chip.known{color:var(--known);background:var(--blue-soft)}
.chip.hunch{color:var(--hunch);background:#fbf1e0}
.chip.mystery{color:var(--mystery);background:#f1eaf9}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:7px;background:var(--blue-soft);color:#173f80;margin:0 6px 6px 0}
.ptag{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:6px;background:#fbf1e0;color:var(--hunch);margin-left:6px;vertical-align:middle}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px}

#scrim{position:fixed;inset:0;background:rgba(20,32,60,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:39}
#menu{position:fixed;top:0;left:0;bottom:0;width:min(84vw,340px);background:var(--card);z-index:40;transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;border-right:3px solid var(--blue);box-shadow:6px 0 24px rgba(0,0,40,.15)}
body.menu-open #menu{transform:none}
body.menu-open #scrim{opacity:1;pointer-events:auto}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.ver{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--blue);margin-left:8px;letter-spacing:0}
#menu details{border-bottom:1px solid var(--line)}
#menu summary,.sect summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
#menu summary::-webkit-details-marker,.sect summary::-webkit-details-marker{display:none}
#menu summary::after,.sect summary::after{content:"\25BE";color:var(--blue);transition:transform .15s}
#menu details[open]>summary::after,.sect[open]>summary::after{transform:rotate(180deg)}
#menu details>button,#menu .mlist button{display:block;width:100%;text-align:left;border:none;background:none;padding:11px 16px 11px 28px;color:var(--ink);cursor:pointer}
#menu details>button:active,#menu .mlist button:active{background:var(--blue-soft)}
#menu label{display:block;padding:6px 16px 12px 28px;font-size:13px;color:var(--muted)}
#menu label select{display:block;width:100%;margin-top:4px;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;color:var(--ink)}
.x{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:16px;cursor:pointer;flex:none}

#ov{position:fixed;inset:0;background:rgba(20,32,60,.35);z-index:50}
#ov[hidden]{display:none}
.ovbox{position:absolute;inset:0;max-width:680px;margin:0 auto;background:var(--paper);display:flex;flex-direction:column}
.ovhead{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--card);border-bottom:3px solid var(--blue)}
#ovTitle{flex:1;font-family:Fraunces,serif;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ovBody{flex:1;overflow-y:auto;padding:14px 14px 40px}

.rtop{display:flex;gap:14px;align-items:flex-start}
.rtop .mat{width:46%;max-width:240px;border-radius:12px;flex:none}
.rid h2{font-family:Fraunces,serif;font-size:22px;margin:4px 0 6px;line-height:1.15}
.lineage{font-size:13px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.lineage b{color:var(--blue);font-weight:600}
.hunch{font-style:italic;font-size:14px;margin:8px 0 0;color:#5a4a2a}
.actions{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.btn{height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--blue);background:var(--card);color:var(--blue);font-weight:600;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff}
.btn.sm{height:38px;font-size:13px;padding:0 10px;flex:1}
.sect{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sect .in{padding:0 16px 14px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;font-size:14px;align-items:center}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.note{border-left:3px solid var(--blue);padding:6px 10px;margin:0 0 10px;background:#f8f9fd;border-radius:0 8px 8px 0}
.note .who{font-size:12px;color:var(--muted);margin-bottom:3px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mini{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0;overflow:hidden;text-align:left;cursor:pointer}
.mini .mat{border-radius:0}
.mini .code{padding:5px 7px}
.muted{color:var(--muted);font-size:14px;line-height:1.5}
.qbtn{border:1px dashed var(--mystery);color:var(--mystery);background:#f8f4fd;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;margin:0 6px 6px 0}

.stage{display:flex;gap:10px;margin-bottom:12px}
.stage .dot{width:14px;height:14px;border-radius:50%;margin-top:3px;flex:none}
.dot.done{background:var(--blue)}.dot.wait{background:var(--hunch)}.dot.later{background:#c9c3b5}
.stage h4{margin:0 0 2px;font-size:14px}
.stage p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}

.form label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
.form input[type=text],.form input[type=number],.form select,.form textarea{display:block;width:100%;margin-top:4px;height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 10px;color:var(--ink)}
.form textarea{height:90px;padding:8px 10px;resize:none}
.form .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.photo input{display:none}
.photo .mat{border-radius:12px;max-width:260px;color:#fff;font-size:13px;text-align:center;padding:20px;cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.checks label{margin:0;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink);background:var(--blue-soft);padding:6px 10px;border-radius:8px}

.cpanel{position:sticky;top:-14px;margin:-14px -14px 14px;padding:12px 14px 4px;background:var(--card);border-bottom:2px solid var(--blue);z-index:3}
.cpanel .row{display:flex;gap:8px;margin-bottom:8px}
.cpanel select{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 8px}
.cnode{position:relative;padding:0 0 12px 20px;border-left:3px solid var(--blue)}
.cnode::before{content:"";position:absolute;left:-3px;top:20px;width:16px;height:3px;background:var(--blue)}
.cnode.last{border-left-color:transparent}
.cnode.last::after{content:"";position:absolute;left:-3px;top:0;height:21px;width:3px;background:var(--blue)}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 10px 4px}
.cbox.root{background:var(--blue-soft);border-color:#b9cdee}
.fname{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;font-weight:600}
.pill{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 10px;margin:0 6px 6px 0;font-size:13px;cursor:pointer}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill .n{opacity:.7;margin-left:4px;font-size:11px}

#ovBody.full{overflow:hidden;padding:0;display:flex;flex-direction:column}
#ovBody.full .cpanel{position:relative;top:0;margin:0}
.flowwrap{flex:1;position:relative;min-height:0;background:#eef3fb}
.flowwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.flowhint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--muted);pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.sent{grid-column:1/-1;height:1px}
.tracecv{width:100%;max-width:360px;border-radius:12px;touch-action:none;display:block;margin:0 auto 14px}
.layer{display:flex;gap:12px;margin-bottom:14px}
.layer .lvl{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:700}
.layer h3{margin:4px 0 4px;font-size:16px}
.layer p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.tree .kbtn{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 6px 8px 22px;color:var(--blue);cursor:pointer}
.tree .vline{font-size:13px;color:var(--muted);padding:2px 6px 6px 36px}
</style>
</head>
<body>

<header id="top">
  <button id="burger" aria-label="Menu" data-act="openMenu"><span></span><span></span><span></span></button>
  <div class="brand"><div class="title">ARTIFACTIUM</div><div class="sub">open archive of found objects</div></div>
  <button class="iconbtn" aria-label="Log a specimen" data-act="add">+</button>
</header>

<div id="filters">
  <input id="q" type="search" placeholder="Search kind, brand, marking, spec, hunch, or code">
  <div class="frow" id="frow"></div>
  <div id="countline"></div>
</div>

<main id="grid"></main>

<div id="scrim" data-act="closeMenu"></div>
<nav id="menu">
  <div class="mhead"><div class="title">ARTIFACTIUM<span class="ver">v3</span></div><button class="x" data-act="closeMenu" aria-label="Close menu">&#10005;</button></div>
  <details open><summary>Browse</summary>
    <button data-act="status" data-v="">All specimens</button>
    <button data-act="status" data-v="mystery">Mystery pile</button>
    <button data-act="status" data-v="hunch">Hunches</button>
    <button data-act="status" data-v="known">Known parts</button>
    <button data-act="openqs">Most open questions</button>
    <button data-act="clearf">Clear every filter</button>
  </details>
  <details open><summary>Tree explorer</summary>
    <button data-act="cascade" data-v="matclass">Start at material</button>
    <button data-act="cascade" data-v="color">Start at color</button>
    <button data-act="cascade" data-v="finish">Start at finish</button>
    <button data-act="cascade" data-v="weight">Start at weight</button>
    <button data-act="cascade" data-v="size">Start at size</button>
    <button data-act="cascade" data-v="moving">Start at moving parts</button>
    <button data-act="cascade" data-v="family">Start at purpose</button>
    <button data-act="cascade" data-v="source">Start at what it came off of</button>
    <button data-act="cascade" data-v="marks">Start at markings</button>
    <button data-act="cascade" data-v="brand">Start at brand</button>
  </details>
  <details><summary>Purpose tree</summary>
    <button data-act="tree">Open the full purpose tree</button>
    <div class="mlist" id="menuFams"></div>
  </details>
  <details><summary>Contribute</summary>
    <button data-act="add">Log a new specimen</button>
    <button data-act="trace">Trace search (draw a shape)</button>
    <button data-act="status" data-v="mystery">Help identify mysteries</button>
    <button data-act="openqs">Fill in open questions</button>
  </details>
  <details><summary>Contributors</summary>
    <div class="mlist" id="menuRoles"></div>
  </details>
  <details><summary>How it works</summary>
    <button data-act="naming">How specimens get named</button>
    <button data-act="pipeline">How identification works</button>
  </details>
  <details><summary>Settings</summary>
    <label>Units<select id="sUnits"><option value="mm">Millimeters</option><option value="in">Inches</option></select></label>
    <label>Sample crowd<select id="sCrowd"><option value="0">Off, real archive only</option><option value="500">500 sample pieces</option><option value="4000">4,000 sample pieces</option></select></label>
    <label>Card size<select id="sSize"><option value="m">Regular</option><option value="s">Compact</option><option value="l">Large</option></select></label>
  </details>
</nav>

<div id="ov" hidden>
  <div class="ovbox">
    <div class="ovhead">
      <button class="x" id="ovBack" data-act="back" aria-label="Back" hidden>&#8249;</button>
      <div id="ovTitle"></div>
      <button class="x" data-act="closeOv" aria-label="Close">&#10005;</button>
    </div>
    <div id="ovBody"></div>
  </div>
</div>

<script>
/* ---------- purpose tree ---------- */
const TAX = {
  CLO:{name:'Closures',kinds:{
    'zipper-slider':{name:'Zipper slider',aliases:['zipper head','slider body','zip runner']},
    'zipper-pull':{name:'Zipper pull tab',aliases:['pull','zipper handle','slider tab']},
    'snap':{name:'Snap fastener',aliases:['press stud','popper','snap button']},
    'buckle':{name:'Frame buckle',aliases:['belt buckle','strap buckle']},
    'turnlock':{name:'Turn lock clasp',aliases:['twist lock','purse lock','flap lock']},
    'toggle':{name:'Toggle',aliases:['duffle toggle','coat toggle']}
  }},
  FST:{name:'Fasteners',kinds:{
    'machine-screw':{name:'Machine screw',aliases:['screw','small bolt']},
    'cotter':{name:'Cotter pin',aliases:['split pin']},
    'hex-nut':{name:'Hex nut',aliases:['nut']},
    'rivet':{name:'Garment rivet',aliases:['jeans rivet','denim rivet']},
    'grommet':{name:'Grommet',aliases:['eyelet']}
  }},
  SPR:{name:'Springs',kinds:{
    'compression':{name:'Compression spring',aliases:['coil spring']}
  }},
  TRM:{name:'Trim and trinkets',kinds:{
    'charm':{name:'Stamped charm',aliases:['trinket','pendant blank','dangle']}
  }},
  MEC:{name:'Mechanisms',kinds:{
    'gear':{name:'Small gear',aliases:['cog','toothed wheel']},
    'key-blank':{name:'Key blank',aliases:['uncut key']},
    'hinge':{name:'Small hinge',aliases:['box hinge','butt hinge']},
    'pen-tip':{name:'Ballpoint pen tip',aliases:['pen point','writing tip','refill tip']}
  }},
  UNK:{name:'Unsorted mysteries',kinds:{
    'flat-two-hole':{name:'Flat bar with two holes',aliases:['strap plate'],placeholder:true}
  }}
};
const KIND = {};
for(const f in TAX) for(const k in TAX[f].kinds) KIND[k] = {...TAX[f].kinds[k], fam:f, id:k};

const VAR = {
  'KSW-70':{kind:'zipper-slider',maker:'Kestrel Slide Works',era:'1970s run',size:'Medium gauge',finish:'Nickel plate',ref:'KS5 vintage die'},
  'KSW-NOW':{kind:'zipper-slider',maker:'Kestrel Slide Works',era:'Current production',size:'Medium gauge',finish:'Matte nickel',ref:'KS5R'},
  'KSW-HVY':{kind:'zipper-slider',maker:'Kestrel Slide Works',era:'Current production',size:'Heavy gauge, oversized',finish:'Black oxide',ref:'KS10 HD'},
  'ARR-PULL':{kind:'zipper-pull',maker:'Arroyo Stampings',era:'1990s',size:'Long tab',finish:'Antique brass',ref:'AS pull 22'},
  'GEN-COT':{kind:'cotter',maker:'Generic hardware stock',era:'Any',size:'Small',finish:'Zinc plate',ref:'Standard split pin'},
  'GEN-NUT':{kind:'hex-nut',maker:'Generic hardware stock',era:'Any',size:'Small machine thread',finish:'Plain steel',ref:'Standard hex nut'},
  'GEN-M3':{kind:'machine-screw',maker:'Generic hardware stock',era:'Any',size:'M3 by 12',finish:'Zinc plate',ref:'Pan head Phillips M3'},
  'HAL-RIV':{kind:'rivet',maker:'Halvard Notions',era:'1980s',size:'Standard cap',finish:'Raw copper',ref:'HN burr rivet'},
  'HAL-GRM':{kind:'grommet',maker:'Halvard Notions',era:'Current production',size:'Medium',finish:'Polished brass',ref:'HN eyelet M'},
  'TUL-KEY':{kind:'key-blank',maker:'Tullman Lockworks',era:'2000s',size:'House key',finish:'Brass',ref:'TL five pin blank'}
};

/* spec sheets per kind; blank values become open questions */
const SPECS = {
  'machine-screw':['Thread standard','Diameter','Pitch or TPI','Length','Head type','Drive type'],
  'zipper-slider':['Gauge','Lock type','Pull'],
  'grommet':['Inner diameter','Outer diameter','Setting style'],
  'rivet':['Cap diameter','Back type'],
  'hex-nut':['Thread size','Across flats'],
  'compression':['Wire diameter','Free length','Coil count'],
  'hinge':['Leaf count','Pin type','Leaf length'],
  'pen-tip':['Ball size','Ink type'],
  'turnlock':['Mechanism','Plate shape'],
  'gear':['Tooth count','Bore'],
  'key-blank':['Pin count','Keyway profile'],
  'toggle':['Wood type','Cord hole']
};
const SPEC_HINTS = {
  'Thread standard':['Metric coarse','Metric fine','UNC','UNF','Self tapping','Wood thread'],
  'Head type':['Pan','Flat','Oval','Round','Button','Cheese','Truss','Hex'],
  'Drive type':['Phillips','Slotted','Torx','Hex socket','Square','Pozidriv','Tri wing'],
  'Lock type':['Auto lock','Non lock','Pin lock','Semi auto'],
  'Setting style':['One piece','Two piece','Self piercing'],
  'Back type':['Burr','Tack','Cap'],
  'Pin type':['Fixed','Removable','Spring loaded'],
  'Mechanism':['Turn lock','Push lock','Slide lock'],
  'Ink type':['Oil based','Gel','Rollerball']
};

const MATS = {
  steel:{label:'Steel',cls:'Metal',fill:'#aeb6c1',stroke:'#3d4552'},
  zinc:{label:'Zinc alloy',cls:'Metal',fill:'#c3c7cc',stroke:'#4b5059'},
  brass:{label:'Brass',cls:'Metal',fill:'#d4ad4f',stroke:'#6b5320'},
  copper:{label:'Copper',cls:'Metal',fill:'#c87a4a',stroke:'#5e3218'},
  aluminum:{label:'Aluminum',cls:'Metal',fill:'#dfe3e8',stroke:'#5a6470'},
  wood:{label:'Wood',cls:'Wood',fill:'#b98552',stroke:'#5b3a1c'},
  plastic:{label:'Plastic',cls:'Plastic',fill:'#ece6d4',stroke:'#6f6650'},
  unknown:{label:'Not sure',cls:'Not sure',fill:'#9b9488',stroke:'#4a453d'}

const FORDER = Object.keys(FACETS);
function valuesFor(fid,list){

/* ---------- shapes ---------- */
const circ = (cx,cy,r) => `M${cx-r} ${cy} a${r} ${r} 0 1 0 ${2*r} 0 a${r} ${r} 0 1 0 ${-2*r} 0 Z`;
function gearPath(){const p=[],n=14;for(let i=0;i<n;i++){const b=2*Math.PI*i/n,w=2*Math.PI/n;[[0,27],[.18,35],[.5,35],[.68,27]].forEach(([f,r])=>{const a=b+f*w;p.push((50+r*Math.cos(a)).toFixed(1)+' '+(50+r*Math.sin(a)).toFixed(1))})}return 'M'+p.join(' L')+' Z'}
function starPath(){const p=[];for(let i=0;i<10;i++){const a=(-90+36*i)*Math.PI/180,r=i%2?13:30;p.push((50+r*Math.cos(a)).toFixed(1)+' '+(58+r*Math.sin(a)).toFixed(1))}return 'M'+p.join(' L')+' Z'}
function hexPath(){const p=[];for(let i=0;i<6;i++){const a=(30+60*i)*Math.PI/180;p.push((50+34*Math.cos(a)).toFixed(1)+' '+(50+34*Math.sin(a)).toFixed(1))}return 'M'+p.join(' L')+' Z'}
function springPts(){const p=['50,12'];for(let i=0;i<10;i++)p.push(`${i%2?30:70},${16+i*7.6}`);p.push('50,90');return p.join(' ')}
function screwSVG(F,m,flat,step){
  const top=flat?30:28;
  const head=flat?`<path ${F} d="M28 14 H72 L58 30 H42 Z"/>`:`<path ${F} d="M30 14 H70 Q73 26 66 28 H34 Q27 26 30 14 Z"/>`;
  let th='';for(let y=top+3;y<84;y+=step)th+=`M42 ${(y+step/2).toFixed(1)} L58 ${y.toFixed(1)} `;
  return `${head}<path ${F} d="M42 ${top} H58 V84 L50 93 L42 84 Z"/><path d="${th}" stroke="${m.stroke}" stroke-width="1.1"/>`;
}
function shapeSVG(s){
  const m = paintOf(s);
  const F = `fill="${m.fill}" stroke="${m.stroke}" stroke-width="1.5"`;
  const shape = s.shape || KSHAPE[s.kind] || 'bar2';
  let b='';
  switch(shape){
    case 'slider': b=`<path ${F} d="M28 18 H72 L64 64 H36 Z"/><path d="M38 30 H62" stroke="${m.stroke}" stroke-width="2"/><path ${F} fill-rule="evenodd" d="M43 58 H57 V84 Q50 92 43 84 Z ${circ(50,77,3.5)}"/>`;break;
    case 'pull': b=`<path ${F} fill-rule="evenodd" d="M40 10 H60 Q64 10 64 14 V78 Q50 92 36 78 V14 Q36 10 40 10 Z ${circ(50,22,5)}"/><path d="M42 40 H58 M42 48 H58" stroke="${m.stroke}" stroke-width="1" opacity=".5"/>`;break;
    case 'cotter': b=`<path d="M45 26 V90 M55 26 V82" stroke="${m.stroke}" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M45 26 V90 M55 26 V82" stroke="${m.fill}" stroke-width="6" stroke-linecap="round" fill="none"/><circle cx="50" cy="18" r="10" fill="none" stroke="${m.stroke}" stroke-width="9"/><circle cx="50" cy="18" r="10" fill="none" stroke="${m.fill}" stroke-width="6"/>`;break;
    case 'grommet': b=`<path ${F} fill-rule="evenodd" d="${circ(50,50,32)} ${circ(50,50,17)}"/><circle cx="50" cy="50" r="24" fill="none" stroke="${m.stroke}" stroke-width="1" opacity=".5"/>`;break;
    case 'nut': b=`<path ${F} fill-rule="evenodd" d="${hexPath()} ${circ(50,50,15)}"/><circle cx="50" cy="50" r="15" fill="none" stroke="${m.stroke}" stroke-width="1" stroke-dasharray="3 2"/>`;break;
    case 'spring': b=`<polyline points="${springPts()}" fill="none" stroke="${m.stroke}" stroke-width="7" stroke-linejoin="round"/><polyline points="${springPts()}" fill="none" stroke="${m.fill}" stroke-width="4.5" stroke-linejoin="round"/>`;break;
    case 'charm': b=`<path ${F} d="${starPath()}"/><path ${F} fill-rule="evenodd" d="${circ(50,20,7)} ${circ(50,20,3.5)}"/>`;break;
    case 'bar2': b=`<g transform="rotate(-22 50 50)"><path ${F} fill-rule="evenodd" d="M14 42 H86 Q92 42 92 50 Q92 58 86 58 H14 Q8 58 8 50 Q8 42 14 42 Z ${circ(20,50,4.5)} ${circ(80,50,4.5)}"/></g>`;break;
    case 'gear': b=`<path ${F} fill-rule="evenodd" d="${gearPath()} ${circ(50,50,8)}"/><circle cx="50" cy="50" r="19" fill="none" stroke="${m.stroke}" stroke-width="1" opacity=".5"/>`;break;
    case 'key': b=`<path ${F} fill-rule="evenodd" d="${circ(50,20,16)} ${circ(50,16,5)}"/><path ${F} d="M46 35 H54 V50 H60 V56 H54 V64 H62 V70 H54 V86 L50 92 L46 86 Z"/>`;break;
    case 'rivet': b=`<circle ${F} cx="50" cy="50" r="27"/><circle cx="50" cy="50" r="19" fill="none" stroke="${m.stroke}" stroke-width="1" opacity=".6"/><circle cx="50" cy="50" r="5" fill="${m.stroke}" opacity=".5"/>`;break;
    case 'snap': b=`<path ${F} fill-rule="evenodd" d="${circ(50,50,30)} ${circ(50,50,21)}"/><circle ${F} cx="50" cy="50" r="12"/>`;break;
    case 'buckle': b=`<path ${F} fill-rule="evenodd" d="M16 24 H84 V76 H16 Z M25 33 H75 V67 H25 Z"/><rect ${F} x="46" y="24" width="8" height="48" rx="2"/>`;break;
    case 'screw': b=screwSVG(F,m,false,5.5);break;
    case 'screwfine': b=screwSVG(F,m,true,3);break;
    case 'hinge': b=`<path ${F} fill-rule="evenodd" d="M14 22 H46 V78 H14 Z ${circ(27,36,3.5)} ${circ(27,64,3.5)}"/><path ${F} fill-rule="evenodd" d="M54 22 H86 V78 H54 Z ${circ(73,36,3.5)} ${circ(73,64,3.5)}"/><rect ${F} x="45" y="18" width="10" height="64" rx="4"/><path d="M45 39 H55 M45 61 H55" stroke="${m.stroke}" stroke-width="1.5"/>`;break;
    case 'pentip': b=`<path ${F} d="M42 10 H58 V36 L53 78 H47 L42 36 Z"/><path d="M42 30 H58" stroke="${m.stroke}" stroke-width="1.5"/><circle cx="50" cy="82" r="5" fill="#d9dde3" stroke="#3d4552" stroke-width="1.2"/>`;break;
    case 'turnlock': b=`<path ${F} d="M22 28 H78 Q86 28 86 36 V64 Q86 72 78 72 H22 Q14 72 14 64 V36 Q14 28 22 28 Z"/><g transform="rotate(35 50 50)"><rect ${F} x="35" y="40" width="30" height="20" rx="10"/></g><circle cx="21" cy="35" r="2.5" fill="${m.stroke}"/><circle cx="79" cy="35" r="2.5" fill="${m.stroke}"/><circle cx="21" cy="65" r="2.5" fill="${m.stroke}"/><circle cx="79" cy="65" r="2.5" fill="${m.stroke}"/>`;break;
    case 'toggle': b=`<g transform="rotate(-30 50 50)"><rect ${F} x="40" y="10" width="20" height="80" rx="10"/><path d="M40 50 H60" stroke="${m.stroke}" stroke-width="3"/><path d="M46 20 V80" stroke="${m.stroke}" opacity=".25"/></g>`;break;
  }
  const t=[];

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true"><g ${tf}>${b}</g></svg>`;

/* ---------- formatting ---------- */
function fmtDims(d){return S.units==='in'?d.map(v=>(v/25.4).toFixed(2)).join(' × ')+' in':d.join(' × ')+' mm'}

function opts(sel,list,val){sel.innerHTML=list.map(([v,l])=>`<option value="${esc(v)}"${v===val?' selected':''}>${esc(l)}</option>`).join('')}
function buildFilterRow(){
  $('frow').innerHTML=FORDER.map(f=>`<select data-f="${f}"></select>`).join('')+`<select id="fSort"></select>`;
  $('frow').querySelectorAll('select[data-f]').forEach(sel=>sel.onchange=()=>{

}
function fillFilters(){

    const f=sel.dataset.f;let list=all;
    if(f==='kind'&&S.f.family)list=all.filter(s=>KIND[s.kind].fam===S.f.family);
    opts(sel,[['',FACETS[f].all],...valuesFor(f,list).map(([v,n])=>[v,`${FACETS[f].label(v)} (${n})`])],S.f[f]||'');

function hay(s){
  const k=KIND[s.kind],v=s.variant?VAR[s.variant]:{};

    brandOf(s),s.markText,s.marks.map(x=>MARKS[x]).join(' '),s.sources.map(x=>SOURCES[x.o]).join(' '),s.moving.map(x=>MOVES[x]).join(' '),Object.entries(s.specs).map(e=>e.join(' ')).join(' '),SIZEL[sizeClass(s)],WCLSL[weightClass(s)],COLORS[colorOf(s)][0],FINISHES[finishOf(s)]].join(' ').toLowerCase();

    const drawVal=()=>{
      const t=$('fTarget').value;let h='';
      if(t==='kind')h=`<label>Kind<select id="vKind">${kindOpts}</select></label><label>Maker, run, or era if you know it<input type="text" id="vMaker"></label>`;

      else if(t==='brand')h=`<label>Brand or maker<input type="text" id="vBrand" value="${esc(s.brand)}"></label>`;
      else if(t==='source')h=`<label>It came off of<select id="vSrc">${Object.entries(SOURCES).filter(([k])=>k!=='unknown').map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label><div class="checks"><label><input type="checkbox" id="vSure">I am sure about this</label></div>`;

      $('fVal').innerHTML=h;
    };

    $('fForm').onsubmit=e=>{
      e.preventDefault();
      const t=$('fTarget').value,txt=$('fNote').value.trim();let line='';
      if(t==='kind'){const kid=$('vKind').value,mk=$('vMaker').value.trim();line=`Proposed ID: ${KIND[kid].name}${mk?', '+mk:''}.`;
        if(s.status==='mystery'){s.status='hunch';s.hunch=`${KIND[kid].name}${mk?', '+mk:''} (awaiting confirmation)`}s.proposed.kind=true}
      else if(t.startsWith('spec:')){const f=t.slice(5),val=$('vSpec').value.trim();if(!val)return;s.specs[f]=val;s.proposed[t]=true;line=`Filled ${f}: ${val}.`}

}

function nextCode(f){

/* ---------- tree explorer: flowchart and list ---------- */
let C={path:[],facet:'matclass',mode:'flow'};
const FV={scale:1,tx:0,ty:0,focus:true,L:null,raf:0};
let RO=null;
const SPR=new Map();
function sprite(s){
  const p=paintOf(s),key=[s.shape||KSHAPE[s.kind],p.fill,p.stroke,s.condition.includes('crushed'),s.condition.includes('bent'),s.scale||1].join('|');
  let o=SPR.get(key);
  if(!o){o={img:new Image(),ok:false};o.img.onload=()=>{o.ok=true;drawSoon()};o.img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(shapeSVG(s).replace('<svg ','<svg width="128" height="128" '));SPR.set(key,o)}
  return o;
}
function drawSoon(){if(!FV.raf)FV.raf=requestAnimationFrame(()=>{FV.raf=0;drawFlow()})}
function rr(x,ctx,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function layoutFlow(){
  const NW=210,NH=66,GX=22,GY=124,T=64,G=8;
  const nodes=[],edges=[],all=ALL();
  const root={x:0,y:0,type:'root',title:'Start',label:'Everything in the archive',n:all.length};
  nodes.push(root);
  let parent=root,rowRight=NW/2;
  C.path.forEach((p,i)=>{
    const before=all.filter(s=>matches(s,pathFilter(C.path.slice(0,i))));
    const vals=valuesFor(p.f,before);
    const w=vals.length*(NW+GX)-GX,sx=parent.x-w/2+NW/2,y=(i+1)*GY;
    let chosen=null;
    vals.forEach(([v,n],j)=>{
      const nd={x:sx+j*(NW+GX),y,type:'level',title:FACETS[p.f].name,label:FACETS[p.f].label(v),n,on:v===p.v,i,v};
      nodes.push(nd);edges.push({a:parent,b:nd,on:nd.on});if(nd.on)chosen=nd;
    });
    rowRight=Math.max(rowRight,sx+(vals.length-1)*(NW+GX)+NW/2);
    parent=chosen||parent;
  });
  const leaf=parent,cur=all.filter(s=>matches(s,pathFilter(C.path)));
  const N=cur.length,cols=Math.max(1,Math.ceil(Math.sqrt(N*1.8))),rows=Math.max(1,Math.ceil(N/cols));
  const fw=cols*(T+G)-G,fh=rows*(T+G)-G,fx=leaf.x-fw/2,fy=leaf.y+NH/2+200;
  const field={x:fx,y:fy,w:fw,h:fh,cols,T,G,items:cur};
  if(C.facet){
    const vals=valuesFor(C.facet,cur),px=Math.max(rowRight,leaf.x+fw/2)+NW/2+180;
    vals.forEach(([v,n],j)=>nodes.push({x:px,y:leaf.y+j*(NH+14),type:'preview',title:'Branch by '+FACETS[C.facet].name.toLowerCase(),label:FACETS[C.facet].label(v),n,f:C.facet,v}));
  }
  let x0=fx-20,x1=fx+fw+20,y0=-NH/2-20,y1=fy+fh+20;
  nodes.forEach(n=>{x0=Math.min(x0,n.x-NW/2-20);x1=Math.max(x1,n.x+NW/2+20);y1=Math.max(y1,n.y+NH/2+20)});
  return {nodes,edges,leaf,field,NW,NH,b:{x0,x1,y0:y0-40,y1}};
}
function viewSize(){const c=$('fc');return c?{w:c.clientWidth,h:c.clientHeight}:{w:1,h:1}}
function focusLeaf(){const L=FV.L,v=viewSize();const s=Math.min(v.w/(L.NW*2.4),1.3);FV.scale=s;FV.tx=v.w/2-L.leaf.x*s;FV.ty=v.h*.3-L.leaf.y*s}
function fitAll(){const b=FV.L.b,v=viewSize();const s=Math.min(v.w/(b.x1-b.x0),v.h/(b.y1-b.y0));FV.scale=s;FV.tx=v.w/2-(b.x0+b.x1)/2*s;FV.ty=v.h/2-(b.y0+b.y1)/2*s}
function zoomAt(px,py,f){const s2=Math.max(.004,Math.min(5,FV.scale*f));const wx=(px-FV.tx)/FV.scale,wy=(py-FV.ty)/FV.scale;FV.scale=s2;FV.tx=px-wx*s2;FV.ty=py-wy*s2;drawSoon()}

function drawFlow(){
  const c=$('fc');if(!c||!FV.L)return;
  const ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,L=FV.L,sc=FV.scale;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#eef3fb';ctx.fillRect(0,0,c.width,c.height);
  const vw=c.width/dpr,vh=c.height/dpr,wx0=-FV.tx/sc,wy0=-FV.ty/sc,wx1=wx0+vw/sc,wy1=wy0+vh/sc;
  ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*FV.tx,dpr*FV.ty);
  /* blueprint grid */
  const gs=sc>.25?40:sc>.04?400:4000;
  ctx.strokeStyle='rgba(29,95,196,.08)';ctx.lineWidth=1/sc;ctx.beginPath();
  for(let x=Math.floor(wx0/gs)*gs;x<wx1;x+=gs){ctx.moveTo(x,wy0);ctx.lineTo(x,wy1)}
  for(let y=Math.floor(wy0/gs)*gs;y<wy1;y+=gs){ctx.moveTo(wx0,y);ctx.lineTo(wx1,y)}
  ctx.stroke();
  const NW=L.NW,NH=L.NH,F=L.field;
  const hf=Math.min(Math.max(15,11/sc),60);
  /* edges */
  L.edges.forEach(e=>{
    ctx.strokeStyle=e.on?'#1d5fc4':'#b8b2a4';ctx.lineWidth=Math.max(e.on?3:1.5,(e.on?2.5:1)/sc);
    const ax=e.a.x,ay=e.a.y+NH/2,bx=e.b.x,by=e.b.y-NH/2,my=(ay+by)/2;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.bezierCurveTo(ax,my,bx,my,bx,by);ctx.stroke();
  });
  ctx.strokeStyle='#1d5fc4';ctx.lineWidth=Math.max(4,3/sc);ctx.beginPath();ctx.moveTo(L.leaf.x,L.leaf.y+NH/2);ctx.lineTo(L.leaf.x,F.y-24-hf);ctx.stroke();
  ctx.setLineDash([8,6]);ctx.lineWidth=Math.max(1.5,1/sc);ctx.strokeStyle='#7da3e0';
  L.nodes.filter(n=>n.type==='preview').forEach(n=>{const ax=L.leaf.x+NW/2,ay=L.leaf.y,bx=n.x-NW/2,mx=(ax+bx)/2;ctx.beginPath();ctx.moveTo(ax,ay);ctx.bezierCurveTo(mx,ay,mx,n.y,bx,n.y);ctx.stroke()});
  ctx.setLineDash([]);
  /* field */
  ctx.fillStyle='#2a64c0';rr(F.x-12,ctx,F.y-12,F.w+24,F.h+24,14);ctx.fill();
  ctx.fillStyle='#1d5fc4';ctx.font=`600 ${hf}px "IBM Plex Sans",sans-serif`;ctx.textAlign='center';
  ctx.fillText(`LANDS ON ${F.items.length.toLocaleString()} SPECIMEN${F.items.length===1?'':'S'}`,L.leaf.x,F.y-24);
  const step=F.T+F.G,st=F.T*sc;
  const c0=Math.max(0,Math.floor((wx0-F.x)/step)),c1=Math.min(F.cols-1,Math.floor((wx1-F.x)/step));
  const r0=Math.max(0,Math.floor((wy0-F.y)/step)),r1=Math.floor((wy1-F.y)/step);
  const STC={known:'#1d5fc4',hunch:'#e0a23b',mystery:'#a77fe0'};
  for(let r=r0;r<=r1;r++)for(let cc=c0;cc<=c1;cc++){
    const i=r*F.cols+cc;if(i>=F.items.length)break;
    const s=F.items[i],x=F.x+cc*step,y=F.y+r*step;
    if(st<9){ctx.fillStyle=paintOf(s).fill;ctx.fillRect(x+8,y+8,F.T-16,F.T-16);continue}
    ctx.fillStyle='rgba(255,255,255,.1)';rr(x,ctx,y,F.T,F.T,6);ctx.fill();
    const sp=sprite(s);
    if(sp.ok)ctx.drawImage(sp.img,x+5,y+3,F.T-10,F.T-10);else{ctx.fillStyle=paintOf(s).fill;ctx.fillRect(x+16,y+16,F.T-32,F.T-32)}
    if(st>34){ctx.fillStyle=STC[s.status];ctx.beginPath();ctx.arc(x+F.T-7,y+7,4,0,7);ctx.fill()}
    if(st>90){ctx.fillStyle='#fff';ctx.font='6px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.fillText(s.code,x+F.T/2,y+F.T-3)}
  }
  /* nodes */
  const txt=NH*sc>16;
  L.nodes.forEach(n=>{
    if(n.x+NW/2<wx0||n.x-NW/2>wx1||n.y+NH/2<wy0||n.y-NH/2>wy1)return;
    const x=n.x-NW/2,y=n.y-NH/2;
    rr(x,ctx,y,NW,NH,12);
    if(n.type==='root'){ctx.fillStyle='#e3ecfa';ctx.fill();ctx.strokeStyle='#9fbbe8';ctx.lineWidth=1.5;ctx.stroke()}
    else if(n.on){ctx.fillStyle='#1d5fc4';ctx.fill()}
    else if(n.type==='preview'){ctx.fillStyle='#fffdf8';ctx.fill();ctx.setLineDash([6,4]);ctx.strokeStyle='#1d5fc4';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([])}
    else{ctx.fillStyle='#fffdf8';ctx.fill();ctx.strokeStyle='#ddd6c6';ctx.lineWidth=1.5;ctx.stroke()}
    if(!txt)return;
    const light=n.on;
    ctx.save();rr(x,ctx,y,NW,NH,12);ctx.clip();ctx.textAlign='left';
    ctx.fillStyle=light?'rgba(255,255,255,.75)':'#6b7380';ctx.font='600 11px "IBM Plex Sans",sans-serif';
    ctx.fillText(n.title.toUpperCase(),x+14,y+22);
    ctx.fillStyle=light?'#fff':'#1d2430';ctx.font='600 16px "IBM Plex Sans",sans-serif';
    let lab=n.label;while(ctx.measureText(lab).width>NW-70&&lab.length>3)lab=lab.slice(0,-2);if(lab!==n.label)lab+='…';
    ctx.fillText(lab,x+14,y+48);
    ctx.textAlign='right';ctx.fillStyle=light?'#fff':'#1d5fc4';ctx.font='600 14px "IBM Plex Mono",monospace';
    ctx.fillText(n.n.toLocaleString(),x+NW-14,y+48);
    ctx.restore();
  });
}
function flowTap(px,py){
  const L=FV.L,wx=(px-FV.tx)/FV.scale,wy=(py-FV.ty)/FV.scale;
  for(let k=L.nodes.length-1;k>=0;k--){
    const n=L.nodes[k];
    if(Math.abs(wx-n.x)<=L.NW/2&&Math.abs(wy-n.y)<=L.NH/2){
      if(n.type==='level'&&!n.on){C.path[n.i].v=n.v;C.path=C.path.slice(0,n.i+1);FV.focus=true;paint(true)}
      else if(n.type==='preview'){C.path.push({f:n.f,v:n.v});C.facet='';FV.focus=true;paint(true)}
      return;
    }
  }
  const F=L.field,step=F.T+F.G,cc=Math.floor((wx-F.x)/step),r=Math.floor((wy-F.y)/step);
  if(cc>=0&&cc<F.cols&&r>=0&&(wx-F.x)-cc*step<=F.T&&(wy-F.y)-r*step<=F.T){const s=F.items[r*F.cols+cc];if(s)openView(()=>recordView(s.code))}
}
function mountFlow(){
  const c=$('fc'),wrap=c.parentElement;
  FV.L=layoutFlow();
  const size=()=>{const dpr=window.devicePixelRatio||1;c.width=Math.max(1,c.clientWidth*dpr);c.height=Math.max(1,c.clientHeight*dpr);if(FV.focus){focusLeaf();FV.focus=false}drawFlow()};
  RO=new ResizeObserver(size);RO.observe(wrap);
  const pts=new Map();let tap=null,pinch=null;
  const rel=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);const p=rel(e);pts.set(e.pointerId,p);
    if(pts.size===1)tap={x:p.x,y:p.y,t:Date.now(),moved:false};
    else{tap=null;const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}};
  c.onpointermove=e=>{if(!pts.has(e.pointerId))return;const p=rel(e),o=pts.get(e.pointerId);pts.set(e.pointerId,p);
    if(pts.size===1){FV.tx+=p.x-o.x;FV.ty+=p.y-o.y;if(tap&&Math.hypot(p.x-tap.x,p.y-tap.y)>8)tap.moved=true;drawSoon()}
    else if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      FV.tx+=mx-pinch.mx;FV.ty+=my-pinch.my;zoomAt(mx,my,d/Math.max(pinch.d,1));pinch={d,mx,my}}};
  const up=e=>{const p=rel(e);if(tap&&!tap.moved&&pts.size===1&&Date.now()-tap.t<500)flowTap(p.x,p.y);pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)tap=null};
  c.onpointerup=up;c.onpointercancel=e=>{pts.delete(e.pointerId);tap=null;pinch=null};
  c.onwheel=e=>{e.preventDefault();const p=rel(e);zoomAt(p.x,p.y,Math.exp(-e.deltaY*.0015))};
}
function listTreeHTML(){
  const all=ALL(),cur=all.filter(s=>matches(s,pathFilter(C.path)));
  let tree=`<div class="cnode${C.path.length?'':' last'}"><div class="cbox root"><div class="fname">Start</div>Everything in the archive <span class="muted">(${all.length})</span></div></div>`;
  C.path.forEach((p,i)=>{
    const before=all.filter(s=>matches(s,pathFilter(C.path.slice(0,i))));
    const pills=valuesFor(p.f,before).map(([v,n])=>`<span class="pill${v===p.v?' on':''}" data-ci="${i}" data-cv="${esc(v)}">${esc(FACETS[p.f].label(v))}<span class="n">${n}</span></span>`).join('');
    tree+=`<div class="cnode" style="margin-left:${(i+1)*12}px"><div class="cbox"><div class="fname">${esc(FACETS[p.f].name)}</div>${pills}</div></div>`;
  });
  const shownList=cur.slice(0,300);
  tree+=`<div class="cnode last" style="margin-left:${(C.path.length+1)*12}px"><div class="cbox"><div class="fname">Lands on ${cur.length} specimen${cur.length===1?'':'s'}${cur.length>300?', first 300 shown, the flowchart shows them all':''}</div>${cur.length?minis(shownList):'<p class="muted">This branch is empty. Tap a different pill above.</p>'}</div></div>`;
  return tree;
}
function cascadeView(){
  const used=C.path.map(p=>p.f),unused=FORDER.filter(f=>!used.includes(f));
  if(!unused.includes(C.facet))C.facet=unused[0]||'';
  const cur=ALL().filter(s=>matches(s,pathFilter(C.path)));
  const vals=C.facet?valuesFor(C.facet,cur):[];
  const flow=C.mode!=='list';
  const panel=`<div class="cpanel">
    <div class="row"><select id="cF">${unused.map(f=>`<option value="${f}"${f===C.facet?' selected':''}>Branch by ${esc(FACETS[f].name.toLowerCase())}</option>`).join('')}</select>
    <select id="cV"><option value="">Pick one</option>${vals.map(([v,n])=>`<option value="${esc(v)}">${esc(FACETS[C.facet].label(v))} (${n})</option>`).join('')}</select></div>
    <div class="row"><button class="btn primary sm" id="cAdd" type="button">Add branch</button><button class="btn sm" id="cBack" type="button">Step back</button><button class="btn sm" id="cReset" type="button">Start over</button><button class="btn sm" id="cUse" type="button">Use in catalog</button></div>
    <div class="row"><select id="cMode"><option value="flow"${flow?' selected':''}>Chart</option><option value="list"${flow?'':' selected'}>List</option></select><button class="btn sm" id="cFit" type="button">See it all</button><button class="btn sm" id="cOut" type="button">Zoom out</button><button class="btn sm" id="cIn" type="button">Zoom in</button></div>
  </div>`;
  const body=flow?`<div class="flowwrap"><canvas id="fc"></canvas><div class="flowhint">Drag to pan, pinch to zoom, tap a node to switch branches, tap a dashed node to add it</div></div>`:`<div style="padding:14px;overflow-y:auto;flex:1" id="cTree">${listTreeHTML()}</div>`;
  return {title:'Tree explorer',full:true,html:panel+body,mount(){
    const change=()=>{FV.focus=true;paint(true)};
    $('cF').onchange=e=>{C.facet=e.target.value;paint(true)};
    $('cAdd').onclick=()=>{const v=$('cV').value;if(!v)return;C.path.push({f:C.facet,v});C.facet='';change()};
    $('cBack').onclick=()=>{C.path.pop();change()};
    $('cReset').onclick=()=>{C.path=[];change()};
    $('cUse').onclick=()=>{S.f=pathFilter(C.path);closeOv();refresh();window.scrollTo(0,0)};
    $('cMode').onchange=e=>{C.mode=e.target.value;change()};
    const vw=()=>viewSize();
    $('cFit').onclick=()=>{if(flow){fitAll();drawSoon()}};
    $('cOut').onclick=()=>{if(flow){const v=vw();zoomAt(v.w/2,v.h/2,.5)}};
    $('cIn').onclick=()=>{if(flow){const v=vw();zoomAt(v.w/2,v.h/2,2)}};
    if(flow)mountFlow();
    else $('cTree').onclick=e=>{const p=e.target.closest('.pill');if(!p)return;const i=+p.dataset.ci;C.path[i].v=p.dataset.cv;C.path=C.path.slice(0,i+1);paint(true)};
  }};
}

/* ---------- purpose tree view ---------- */
function treeView(){
  const html=`<p class="muted">The purpose tree is one of several trees every specimen sits on. Family, then kind, then the catalog part when anyone knows it. Tap a kind to see every specimen under it.</p><div class="tree">`+
  Object.keys(TAX).map(f=>{
    const ks=Object.values(KIND).filter(k=>k.fam===f);
    const cnt=ALL().filter(s=>KIND[s.kind].fam===f).length;
    return sect(`${esc(TAX[f].name)} <span class="muted">(${cnt})</span>`,ks.map(k=>{
      const vs=Object.values(VAR).filter(v=>v.kind===k.id);
      const kc=ALL().filter(s=>s.kind===k.id).length;
      const loose=ALL().filter(s=>s.kind===k.id&&!s.variant).length;
      return `<button class="kbtn" data-act="kind" data-v="${k.id}">${esc(k.name)} (${kc})</button>`+
        vs.map(v=>`<div class="vline">${esc(v.maker)}, ${esc(v.era)}, ${esc(v.size)}</div>`).join('')+
        (loose?`<div class="vline">Unmatched specimens: ${loose}</div>`:'');
    }).join(''),true);
  }).join('')+`</div>`;
  return {title:'Purpose tree',html};
}

/* ---------- explainer views ---------- */
function namingView(){
  const ex=byCode('ART-CLO-0003'),pen=byCode('ART-MEC-0003');
  const html=`
  <div class="layer"><div class="lvl">F</div><div><h3>Family</h3><p>The broad branch of the purpose tree. Closures, fasteners, springs, trim and trinkets, mechanisms. Anything nobody can place sits under unsorted mysteries.</p></div></div>
  <div class="layer"><div class="lvl">K</div><div><h3>Kind</h3><p>What the thing is in general. A zipper slider is a kind, no matter who made it or when. Kinds hold every alias people use, and each kind can carry a spec sheet, like thread, head, and length for a screw.</p></div></div>
  <div class="layer"><div class="lvl">V</div><div><h3>Catalog part</h3><p>A specific maker and run when somebody knows it. The seventies slider and today's version of it are siblings under one kind. An oversized gauge is just another sibling.</p></div></div>
  <div class="layer"><div class="lvl">S</div><div><h3>Specimen</h3><p>The piece in your drawer. It gets a code that never changes. Damage like crushed, bent, or rusted goes in its condition, so a smashed slider is still the same part.</p></div></div>
  ${sect('Many trees, one specimen',`<p class="muted">The purpose tree is only one way in. Every specimen also hangs on the material tree, the size tree, the moving parts tree, the came off of tree, the markings tree, and the brand tree, all at once. The trees overlap on purpose. A pen tip shows up under pen tip on the purpose tree and under pen tip and smaller on the size tree, so whoever is looking finds it from whichever end they know.</p><div class="rtop"><div class="mat" style="width:34%">${visual(pen)}</div><div class="rid"><div class="code">${pen.code}</div><div class="lineage">${lineage(pen)}</div><span class="tag">${SIZEL[sizeClass(pen)]}</span><span class="tag">${MATS[pen.material].cls}</span><span class="tag">${MOVES[pen.moving[0]]}</span></div></div>`,true)}
  ${sect('Example of the purpose layers',`<div class="rtop"><div class="mat" style="width:34%">${visual(ex)}</div><div class="rid"><div class="code">${ex.code}</div><div class="lineage">${lineage(ex)}</div><span class="tag">crushed</span></div></div>`)}
  ${sect('When a mystery gets solved',`<p class="muted">Nothing gets renamed. The specimen keeps its code and moves under the right kind and catalog part, picking up the whole family tree above it. Placeholder kinds in the unsorted branch get merged into the real kind once enough people agree.</p>`)}`;
  return {title:'How specimens get named',html};
}
function pipelineView(){
  const html=`<p class="muted">Every identification starts with a person and ends with people agreeing. The machines come in the middle, and only after the humans have laid down the seed.</p>
  <div class="layer"><div class="lvl">H</div><div><h3>Human investigation</h3><p>Whoever has the piece in hand photographs it on a grid mat, measures it, picks the material, notes moving parts, markings, and what it might have come off of, and fills in whatever spec fields they can. Anything left blank becomes an open question.</p></div></div>
  <div class="layer"><div class="lvl">C</div><div><h3>Outsourced humans</h3><p>Open questions go out to everybody. The picker who has seen a thousand of them, the engineer who ran the press, the route tracer, the fashion eye who can read a logo plate. Each answer posts as a proposal tied to who gave it.</p></div></div>
  <div class="layer"><div class="lvl">A</div><div><h3>Image analysis, later</h3><p>Not running yet. When it comes online it uses the best model available at the time, reads the human seed first, then the photo, and adds its guess as one more proposal. It never overwrites what people wrote.</p></div></div>
  <div class="layer"><div class="lvl">K</div><div><h3>Known</h3><p>Once enough proposals agree, the specimen moves from mystery to hunch to known, and its proposed tags drop off.</p></div></div>`;
  return {title:'How identification works',html};
}
function roleView(id){
  const r=ROLES.find(x=>x.id===id);
  const hits=ALL().filter(s=>s.notes.some(n=>n.role===id));
  const notes=hits.flatMap(s=>s.notes.filter(n=>n.role===id).map(n=>`<div class="note"><div class="who">${esc(n.handle)} on <a href="#" data-code="${s.code}">${s.code}</a></div>${esc(n.text)}</div>`)).join('');
  return {title:r.name,html:`<p class="muted">${esc(r.desc)}</p>${sect('Their field notes',notes||'<p class="muted">No notes from this group yet.</p>',true)}${sect('Specimens they have touched',minis(hits),true)}`};
}

/* ---------- trace search ---------- */
function traceView(){
  const html=`<div class="actions" style="margin-top:0"><button class="btn primary" id="tFind" type="button">Find matches</button><button class="btn" id="tClear" type="button">Clear</button></div>
  <p class="muted" style="margin-top:0">Draw the rough outline of the piece you are looking for. The archive matches it against the proportions of every specimen.</p>
  <canvas id="tc" class="mat tracecv" width="600" height="600"></canvas><div id="tRes"></div>`;
  return {title:'Trace search',html,mount(){
    const c=$('tc'),x=c.getContext('2d');let pts=[],down=false;
    x.lineCap='round';x.lineJoin='round';x.lineWidth=12;x.strokeStyle='#fff';
    const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
    c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const p=pos(e);pts.push(p);x.beginPath();x.moveTo(...p)};
    c.onpointermove=e=>{if(!down)return;const p=pos(e);pts.push(p);x.lineTo(...p);x.stroke()};
    c.onpointerup=()=>{down=false};
    $('tClear').onclick=()=>{pts=[];x.clearRect(0,0,c.width,c.height);$('tRes').innerHTML=''};
    $('tFind').onclick=()=>{
      if(pts.length<4){$('tRes').innerHTML='<p class="muted">Draw a shape first.</p>';return}
      const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
      const w=Math.max(...xs)-Math.min(...xs)+1,h=Math.max(...ys)-Math.min(...ys)+1;
      const a=Math.max(w,h)/Math.min(w,h);
      const ranked=ALL().map(s=>{const sa=Math.max(s.dims[0],s.dims[1])/Math.max(Math.min(s.dims[0],s.dims[1]),.5);return{s,d:Math.abs(Math.log(sa)-Math.log(a))}}).sort((p,q)=>p.d-q.d).slice(0,6).map(r=>r.s);
      $('tRes').innerHTML=sect('Closest by proportion',minis(ranked),true);
    };
  }};
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){e.preventDefault();act(a.dataset.act,a.dataset.v);return}
  const c=e.target.closest('[data-code]');
  if(c){e.preventDefault();closeMenu();openView(()=>recordView(c.dataset.code))}
});
function act(k,v){
  const go=()=>{closeMenu();closeOv();refresh();window.scrollTo(0,0)};
  switch(k){
    case 'openMenu':openMenu();break;
    case 'closeMenu':closeMenu();break;
    case 'closeOv':closeOv();break;
    case 'back':back();break;
    case 'status':S.f.status=v||'';go();break;
    case 'openqs':S.sort='open';go();break;
    case 'clearf':S.f={};S.q='';S.sort='code';go();break;
    case 'fam':S.f.family=v;S.f.kind='';go();break;
    case 'kind':S.f.family=KIND[v].fam;S.f.kind=v;go();break;
    case 'tree':closeMenu();openView(treeView);break;
    case 'add':closeMenu();openView(addView);break;
    case 'trace':closeMenu();openView(traceView);break;
    case 'naming':closeMenu();openView(namingView);break;
    case 'pipeline':closeMenu();openView(pipelineView);break;
    case 'role':closeMenu();openView(()=>roleView(v));break;
    case 'cascade':closeMenu();C={path:[],facet:v,mode:C.mode||'flow'};FV.focus=true;openView(cascadeView);break;
    case 'branches':{const s=byCode(v);C={path:[{f:'matclass',v:MATS[s.material].cls},{f:'size',v:sizeClass(s)},{f:'moving',v:(s.moving[0]||'none')}],facet:'family',mode:C.mode||'flow'};FV.focus=true;openView(cascadeView);break}
    case 'fill':{const i=v.indexOf('|');const code=v.slice(0,i),key=v.slice(i+1);openView(()=>fillView(code,key));break}
  }
}
$('q').oninput=e=>{S.q=e.target.value;render()};
$('sUnits').onchange=e=>{S.units=e.target.value;savePrefs();if(stack.length)paint(true)};
$('sSize').onchange=e=>{S.size=e.target.value;savePrefs();render()};
$('sCrowd').onchange=e=>{S.crowd=e.target.value;savePrefs();SIM=+S.crowd?makeCrowd(+S.crowd):[];refresh()};

load();SIM=+S.crowd?makeCrowd(+S.crowd):[];buildFilterRow();renderMenu();refresh();
</script>
