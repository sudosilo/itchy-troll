<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Lens</title>
<script src="https://cdn.jsdelivr.net/npm/acorn@8.12.1/dist/acorn.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/bangers@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/comic-neue@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/comic-neue@5/400.css">
<style>
:root{--paper:#fffbea;--ink:#111111;--muted:#3d3d3d;--red:#e63946;--yellow:#ffd60a;--blue:#1e6fff;--cyan:#9fe7ff;--pink:#ffb3c7;--code:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink)}
body{font:17px/1.5 "Comic Neue","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background-color:var(--paper);background-image:radial-gradient(#f2c94c 1.3px,transparent 1.4px);background-size:12px 12px}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 80px}
header{position:relative;background:var(--yellow);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:12px 14px 14px;margin:6px 6px 18px 0;transform:rotate(-1deg)}
h1{font:400 46px/1 Bangers,Impact,"Arial Black",sans-serif;letter-spacing:2px;margin:0;color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
header p{margin:8px 0 0;font-weight:700;font-size:15px}
.card{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:4px;padding:14px;margin:16px 6px 16px 0}
label{display:block;font:400 18px Bangers,Impact,sans-serif;letter-spacing:1px;color:var(--ink);margin:12px 0 4px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:10px;border:3px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);font-weight:700}
textarea{min-height:170px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;gap:10px}
.row input{flex:1;min-width:0}
button{padding:8px 16px;border:3px solid var(--ink);border-radius:4px;background:var(--red);color:#fff;font:400 20px Bangers,Impact,sans-serif;letter-spacing:1.5px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);text-shadow:1px 1px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button.ghost{background:var(--cyan);color:var(--ink);text-shadow:none}
.tabs{display:flex;gap:8px;position:sticky;top:0;background:var(--paper);padding:10px 6px 10px 0;z-index:5;border-bottom:3px solid var(--ink)}
.tabs button{flex:1;background:#fff;color:var(--ink);text-shadow:none}
.tabs button.on{background:var(--blue);color:#fff;text-shadow:1px 1px 0 var(--ink);transform:rotate(-2deg)}
.status{font-weight:700;font-size:15px;min-height:20px;margin-top:10px}
.status.err{color:var(--red)}
.hidden{display:none}
.fn{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);margin:12px 0;padding:10px 12px;font:inherit;text-shadow:none;letter-spacing:0}
.fn:nth-child(odd){transform:rotate(-.4deg)}
.fn:nth-child(even){transform:rotate(.4deg)}
.fn .nm{font:700 16px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.fn.top{background:var(--yellow)}
.meta{font-size:14px;color:var(--muted);font-weight:700}
.note{background:var(--pink);border:3px solid var(--ink);padding:8px 10px;font-weight:700;margin:10px 0;box-shadow:3px 3px 0 var(--ink)}
.step{display:grid;grid-template-columns:40px 1fr;gap:0 10px;padding:12px 0 6px}
.step.d{border-left:4px dashed var(--ink);padding-left:8px}
.ln{font:400 18px Bangers,Impact,sans-serif;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:15px;align-self:start}
.code{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:#fff;border:3px solid var(--ink);padding:6px 8px;white-space:pre-wrap;word-break:break-word;box-shadow:3px 3px 0 var(--ink)}
.say{position:relative;margin:16px 0 4px;padding:8px 12px;background:#fff;border:3px solid var(--ink);border-radius:18px;font-weight:700;font-size:16px}
.say:before{content:"";position:absolute;top:-14px;left:22px;border:7px solid transparent;border-bottom:7px solid var(--ink);border-left:7px solid var(--ink)}
.say:after{content:"";position:absolute;top:-7px;left:25px;border:4px solid transparent;border-bottom:4px solid #fff;border-left:4px solid #fff}
.lab{display:inline-block;font:400 17px Bangers,Impact,sans-serif;letter-spacing:1.5px;background:var(--yellow);border:3px solid var(--ink);padding:2px 10px;margin:12px 0 2px;box-shadow:2px 2px 0 var(--ink)}
a.jump{color:var(--blue);cursor:pointer;text-decoration:underline;text-decoration-thickness:2px}
details{border:3px solid var(--ink);padding:6px 10px;margin:8px 0;background:var(--cyan);box-shadow:3px 3px 0 var(--ink)}
details[open]{background:#fff}
summary{cursor:pointer;font:400 19px Bangers,Impact,sans-serif;letter-spacing:1px}
.fname{font:700 19px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;margin:0 0 8px;background:var(--yellow);display:inline-block;padding:2px 8px;border:3px solid var(--ink)}
.links{font-size:15px;margin:8px 0;font-weight:700}
.burst{float:right;font:400 22px Bangers,Impact,sans-serif;color:#fff;background:var(--red);border:3px solid var(--ink);padding:10px 12px;margin:-28px -24px 6px 8px;transform:rotate(8deg);clip-path:polygon(50% 0,61% 22%,85% 8%,78% 35%,100% 42%,80% 58%,96% 82%,68% 76%,58% 100%,45% 78%,22% 96%,24% 70%,0 62%,18% 47%,4% 22%,30% 26%);padding:22px 24px;text-shadow:2px 2px 0 var(--ink)}
#mapBox{overflow-x:hidden}
svg text{font-family:"Comic Neue","Comic Sans MS",system-ui,sans-serif}
svg .hd{font-family:Bangers,Impact,sans-serif;letter-spacing:1px}
svg g[data-fn],svg g[data-top]{cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>CODE LENS!</h1>
<p>Pick one of your GitHub projects. Code Lens reads the code and explains every function in plain English, step by step, using code you already wrote.</p>
</header>

<section class="card">
<label for="user">GitHub username</label>
<div class="row"><input id="user" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="loadRepos">Load</button></div>
<label for="repo">Project</label>
<select id="repo" disabled><option>Load your projects first</option></select>
<label for="file">File</label>
<select id="file" disabled><option>Pick a project first</option></select>
<button class="ghost" id="pasteToggle" style="margin-top:12px">Paste code instead</button>
<div id="pasteBox" class="hidden">
<label for="paste">Paste HTML or JavaScript</label>
<textarea id="paste" spellcheck="false"></textarea>
<button id="pasteGo" style="margin-top:8px">Explain this code</button>
</div>
<div class="status" id="status"></div>
</section>

<nav class="tabs">
<button data-tab="fns" class="on">Functions</button>
<button data-tab="map">Map</button>
<button data-tab="exp">Explain</button>
</nav>
<section id="tab-fns"><div class="card meta">Load a project and pick a file. Every function in it shows up here.</div></section>
<section id="tab-map" class="hidden"><div class="card" id="mapBox"></div></section>
<section id="tab-exp" class="hidden"><div class="card meta">Tap a function to see it explained line by line.</div></section>
</div>

<script>
var S = { user: '', repos: [], repo: null, A: null, sel: null, tab: 'fns' };
var CS = null;

function $(id) { return document.getElementById(id); }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function setStatus(t, err) { var s = $('status'); s.textContent = t || ''; s.className = 'status' + (err ? ' err' : ''); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function cap(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
function listWords(a) { if (a.length < 2) return a.join(''); if (a.length === 2) return a[0] + ' and ' + a[1]; return a.slice(0, -1).join(', ') + ', and ' + a[a.length - 1]; }
function sh(n, max) {
  if (!n || !CS) return '';
  var t = CS.code.slice(n.start, n.end).replace(/\s+/g, ' ').trim();
  max = max || 40;
  return t.length > max ? t.slice(0, max - 3) + '...' : t;
}
function ref(f) { return '\u0001' + f.id + '\u0002' + f.name + '\u0003'; }
function rich(t) { return esc(t).replace(/\u0001(\w+)\u0002([^\u0003]*)\u0003/g, '<a class="jump" data-fn="$1">$2</a>'); }

function walkP(node, parent, fn) {
  if (!node || typeof node.type !== 'string') return;
  if (fn(node, parent) === false) return;
  for (var k in node) {
    if (k === 'loc' || k === 'start' || k === 'end' || k === 'type') continue;
    var v = node[k];
    if (Array.isArray(v)) { for (var i = 0; i < v.length; i++) if (v[i] && typeof v[i].type === 'string') walkP(v[i], node, fn); }
    else if (v && typeof v.type === 'string') walkP(v, node, fn);
  }
}
function isFnNode(n) { return n && (n.type === 'FunctionDeclaration' || n.type === 'FunctionExpression' || n.type === 'ArrowFunctionExpression'); }

/* ---------- GitHub ---------- */
async function gh(path) {
  var r = await fetch('https://api.github.com' + path, { headers: { Accept: 'application/vnd.github+json' } });
  if (r.status === 403 || r.status === 429) throw new Error('GitHub is limiting requests from this connection right now. Wait about an hour and try again, or paste the code instead.');
  if (r.status === 404) throw new Error('GitHub could not find that. Check the username spelling.');
  if (r.status === 409) throw new Error('That project has no files yet.');
  if (!r.ok) throw new Error('GitHub answered with code ' + r.status + '.');
  return r.json();
}

async function loadRepos() {
  var u = $('user').value.trim();
  if (!u) { setStatus('Type a GitHub username first.', true); return; }
  S.user = u; store('codelens.user', u);
  setStatus('Loading projects...');
  try {
    var all = [], page = 1;
    while (page <= 5) {
      var batch = await gh('/users/' + encodeURIComponent(u) + '/repos?per_page=100&sort=pushed&page=' + page);
      all = all.concat(batch);
      if (batch.length < 100) break;
      page++;
    }
    S.repos = all;
    var sel = $('repo');
    sel.innerHTML = '<option value="">Pick a project (' + all.length + ')</option>' + all.map(function (r, i) { return '<option value="' + i + '">' + esc(r.name) + '</option>'; }).join('');
    sel.disabled = false;
    setStatus(all.length ? 'Pick a project. Most recently changed are at the top.' : 'No public projects found for that username.');
  } catch (e) { setStatus(e.message, true); }
}

async function loadFiles() {
  var i = $('repo').value; if (i === '') return;
  var r = S.repos[+i]; S.repo = r;
  var fsel = $('file');
  fsel.disabled = true; fsel.innerHTML = '<option>Loading files...</option>';
  setStatus('Reading the file list...');
  try {
    var tree = await gh('/repos/' + encodeURIComponent(S.user) + '/' + encodeURIComponent(r.name) + '/git/trees/' + encodeURIComponent(r.default_branch || 'main') + '?recursive=1');
    var files = (tree.tree || []).filter(function (t) {
      return t.type === 'blob' && /\.(html?|m?js|jsx)$/i.test(t.path) && !/(^|\/)node_modules\//.test(t.path) && !/\.min\.js$/i.test(t.path) && (t.size || 0) < 900000;
    }).map(function (t) { return t.path; });
    files.sort(function (a, b) { return a.split('/').length - b.split('/').length || a.localeCompare(b); });
    if (!files.length) { fsel.innerHTML = '<option>No HTML or JavaScript files</option>'; setStatus('That project has no HTML or JavaScript files to explain.', true); return; }
    fsel.innerHTML = files.map(function (p) { return '<option value="' + esc(p) + '">' + esc(p) + '</option>'; }).join('');
    fsel.disabled = false;
    var pick = files.indexOf('index.html') >= 0 ? 'index.html' : files[0];
    fsel.value = pick;
    loadFile();
  } catch (e) { fsel.innerHTML = '<option>Could not load files</option>'; setStatus(e.message, true); }
}

async function loadFile() {
  var p = $('file').value; if (!p || !S.repo) return;
  setStatus('Reading ' + p + '...');
  try {
    var url = 'https://raw.githubusercontent.com/' + encodeURIComponent(S.user) + '/' + encodeURIComponent(S.repo.name) + '/' + encodeURIComponent(S.repo.default_branch || 'main') + '/' + p.split('/').map(encodeURIComponent).join('/');
    var r = await fetch(url);
    if (!r.ok) throw new Error('Could not download that file (code ' + r.status + ').');
    var text = await r.text();
    runAnalysis(text, p);
  } catch (e) { setStatus(e.message, true); }
}

function runAnalysis(text, name) {
  if (typeof acorn === 'undefined') { setStatus('The code reader did not load. Check the connection and reload the page.', true); return; }
  S.A = analyze(text, name);
  S.sel = null;
  var n = S.A.fns.length;
  setStatus(n ? 'Found ' + n + ' function' + (n === 1 ? '' : 's') + ' in ' + name + '. Tap one to learn what it does.' : 'Read ' + name + '.');
  renderFns();
  $('tab-exp').innerHTML = '<div class="card meta">Tap a function to see it explained line by line.</div>';
  showTab('fns');
}

/* ---------- Analysis ---------- */
function analyze(text, name) {
  var A = { name: name, scripts: [], fns: [], byName: Object.create(null), byShort: Object.create(null), taken: Object.create(null), fnByNode: new Map(), events: new Map(), edges: new Set(), errors: [], external: [] };
  var isHtml = /\.html?$/i.test(name) || (/<script/i.test(text) && /<(html|body|div|head)\b/i.test(text));
  A.isHtml = isHtml;
  if (isHtml) {
    var re = /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi, m;
    while ((m = re.exec(text))) {
      var attrs = m[1];
      var sm = attrs.match(/\bsrc\s*=\s*["']?([^"'\s>]+)/i);
      if (sm) { A.external.push(sm[1]); continue; }
      var tm = attrs.match(/\btype\s*=\s*["']?([^"'\s>]+)/i);
      var type = tm ? tm[1].toLowerCase() : '';
      if (type && !/(javascript|module|ecmascript)/.test(type)) continue;
      var start = m.index + m[0].indexOf('>') + 1;
      var off = text.slice(0, start).split('\n').length - 1;
      if (m[2].trim()) A.scripts.push({ code: m[2], off: off, module: type === 'module' });
    }
  } else {
    A.scripts.push({ code: text, off: 0, module: /^\s*(import|export)\b/m.test(text) });
  }

  A.scripts.forEach(function (sc, i) {
    sc.i = i;
    var tries = sc.module ? ['module', 'script'] : ['script', 'module'], err = null;
    for (var t = 0; t < tries.length; t++) {
      try {
        sc.ast = acorn.parse(sc.code, { ecmaVersion: 'latest', sourceType: tries[t], locations: true, allowHashBang: true, allowReturnOutsideFunction: tries[t] === 'script', allowAwaitOutsideFunction: true, allowImportExportEverywhere: true });
        break;
      } catch (e) { if (!err) err = e; }
    }
    if (!sc.ast) A.errors.push('Script block ' + (i + 1) + ' could not be read near line ' + ((err && err.loc ? err.loc.line : 1) + sc.off) + '. ' + (err ? err.message.replace(/\s*\(\d+:\d+\)$/, '') : ''));
  });

  A.scripts.forEach(function (sc) {
    if (!sc.ast) return;
    CS = sc;
    walkP(sc.ast, null, function (n, p) {
      var nm = null, member = false;
      if (n.type === 'FunctionDeclaration' && n.id) nm = n.id.name;
      else if (n.type === 'FunctionExpression' || n.type === 'ArrowFunctionExpression') {
        if (p && p.type === 'VariableDeclarator' && p.init === n && p.id.type === 'Identifier') nm = p.id.name;
        else if (p && p.type === 'AssignmentExpression' && p.right === n) { nm = sh(p.left, 60); member = p.left.type === 'MemberExpression'; }
        else if (p && p.type === 'Property' && p.value === n && !p.computed) { nm = p.key.name || String(p.key.value); member = true; }
        else if (p && p.type === 'MethodDefinition' && !p.computed) { nm = p.key.name || String(p.key.value); member = true; }
        else if (p && p.type === 'PropertyDefinition' && p.value === n && !p.computed) { nm = p.key.name; member = true; }
        else if (n.id) nm = n.id.name;
      }
      if (nm) {
        var unique = nm, k = 2;
        while (A.taken[unique]) unique = nm + ' (' + (k++) + ')';
        A.taken[unique] = 1;
        var f = { id: 'f' + A.fns.length, name: unique, base: nm, member: member, node: n, sc: sc, line: n.loc.start.line + sc.off, end: n.loc.end.line + sc.off };
        A.fns.push(f); A.fnByNode.set(n, f);
        if (!member || nm.indexOf('.') >= 0) { if (!A.byName[nm]) A.byName[nm] = f; }
        if (member) { var s = nm.split('.').pop(); if (!BUILTIN_NAMES[s]) (A.byShort[s] = A.byShort[s] || []).push(f); }
      }
    });
  });

  function addEdge(a, b) { if (a && b && a !== b) A.edges.add(a + '>' + b); }
  function evNode(label, type) {
    if (!A.events.has(label)) A.events.set(label, { id: 'e' + A.events.size, label: label, type: type });
    return A.events.get(label).id;
  }
  function targetLabel(o) {
    if (o.type === 'CallExpression' && o.callee.type === 'MemberExpression' && !o.callee.computed && o.arguments[0] && o.arguments[0].type === 'Literal') {
      var pn = o.callee.property.name, v = String(o.arguments[0].value);
      if (pn === 'getElementById') return '#' + v;
      if (pn === 'querySelector' || pn === 'querySelectorAll') return v;
    }
    if (o.type === 'CallExpression' && o.callee.type === 'Identifier' && o.arguments[0] && o.arguments[0].type === 'Literal') return '#' + String(o.arguments[0].value).replace(/^#/, '');
    return sh(o, 24);
  }
  function scanBody(root, owner) {
    walkP(root, null, function (n) {
      if (n !== root && A.fnByNode.has(n)) return false;
      if (n.type === 'CallExpression') {
        var cal = n.callee;
        var prop = cal.type === 'MemberExpression' && !cal.computed ? cal.property.name : null;
        if (prop === 'addEventListener' && n.arguments.length >= 2) {
          var t0 = n.arguments[0];
          var evt = t0.type === 'Literal' ? String(t0.value) : sh(t0, 20);
          var id = evNode(evt + ' on ' + targetLabel(cal.object), evt);
          var h = n.arguments[1];
          var hf = A.fnByNode.get(h) || resolve(A, h);
          if (hf) addEdge(id, hf.id);
          else if (isFnNode(h)) scanBody(h, id);
          scanBody(cal.object, owner);
          return false;
        }
        var tf = resolve(A, cal);
        if (tf) addEdge(owner, tf.id);
        n.arguments.forEach(function (a) {
          if (a.type === 'Identifier' || a.type === 'MemberExpression') { var af = resolve(A, a); if (af) addEdge(owner, af.id); }
        });
      }
      if (n.type === 'AssignmentExpression' && n.left.type === 'MemberExpression' && !n.left.computed && /^on[a-z]+$/.test(n.left.property.name)) {
        var ev = n.left.property.name.slice(2);
        var eid = evNode(ev + ' on ' + targetLabel(n.left.object), ev);
        var rf = A.fnByNode.get(n.right) || resolve(A, n.right);
        if (rf) addEdge(eid, rf.id);
        else if (isFnNode(n.right)) scanBody(n.right, eid);
        return false;
      }
    });
  }

  A.scripts.forEach(function (sc) { if (!sc.ast) return; CS = sc; scanBody(sc.ast, 'load'); });
  A.fns.forEach(function (f) { CS = f.sc; scanBody(f.node, f.id); });

  if (isHtml) {
    var htmlOnly = text.replace(/<script\b[\s\S]*?<\/script\s*>/gi, '');
    var ar = /\son([a-z]+)\s*=\s*(["'])([\s\S]*?)\2/gi, am;
    while ((am = ar.exec(htmlOnly))) {
      var lt = htmlOnly.lastIndexOf('<', am.index);
      var tagText = htmlOnly.slice(lt, am.index);
      var tg = tagText.match(/<([a-z0-9-]+)/i), idm = tagText.match(/\bid\s*=\s*["']?([^"'\s>]+)/i);
      var where = idm ? '#' + idm[1] : (tg ? '<' + tg[1].toLowerCase() + '>' : 'an element');
      var nr = /([A-Za-z_$][\w$.]*)\s*\(/g, nm2;
      while ((nm2 = nr.exec(am[3]))) {
        var f2 = A.byName[nm2[1]];
        if (f2) addEdge(evNode(am[1] + ' on ' + where, am[1]), f2.id);
      }
    }
  }

  A.out = {}; A.inn = {};
  A.edges.forEach(function (e) {
    var p = e.split('>');
    (A.out[p[0]] = A.out[p[0]] || []).push(p[1]);
    (A.inn[p[1]] = A.inn[p[1]] || []).push(p[0]);
  });
  A.evById = {};
  A.events.forEach(function (v) { A.evById[v.id] = v; });
  return A;
}

var BUILTIN_NAMES = {};
'push pop shift unshift splice slice map filter forEach find findIndex some every reduce includes indexOf join split sort reverse concat trim toLowerCase toUpperCase replace replaceAll startsWith endsWith toFixed padStart toString appendChild append prepend remove removeChild insertBefore setAttribute getAttribute focus click scrollIntoView getBoundingClientRect preventDefault stopPropagation then catch finally json text getContext fillRect strokeRect clearRect beginPath closePath moveTo lineTo arc fill stroke fillText drawImage save restore translate rotate scale play pause get set has delete add clear keys values entries addEventListener removeEventListener setItem getItem removeItem querySelector querySelectorAll getElementById createElement log error warn parse stringify floor ceil round random min max abs sqrt now send emit on off open close start stop connect disconnect update render init draw'.split(' ').forEach(function (k) { BUILTIN_NAMES[k] = 1; });
function resolve(A, c) {
  if (!c) return null;
  if (c.type === 'ChainExpression') c = c.expression;
  if (c.type === 'Identifier') return A.byName[c.name] || null;
  if (c.type === 'MemberExpression' && !c.computed) {
    var full = sh(c, 80);
    if (A.byName[full]) return A.byName[full];
    var s = A.byShort[c.property.name];
    if (s && s.length) return s[0];
  }
  return null;
}
function fnById(id) { return S.A && id && id.charAt(0) === 'f' ? S.A.fns[+id.slice(1)] : null; }

      d = 'M' + sx + ' ' + sy + ' C' + bend + ' ' + sy + ' ' + bend + ' ' + ty + ' ' + tx + ' ' + ty;
      st += ' stroke-dasharray="4 3"';
    }
    s += '<path d="' + d + '" fill="none" ' + st + ' marker-end="' + mk + '"/>';
  });
  var maxC = Math.max(6, Math.floor((nw - 14) / 7.4));
  order.forEach(function (id) {
    var n = nodes[id], p = pos[id]; if (!p) return;
    var isSel = id === sel, f = fnById(id);
    var fill = isSel ? '#9fe7ff' : n.kind === 'trig' ? '#ffd60a' : '#ffffff', stroke = '#111';
    var lab = n.label.length > maxC ? n.label.slice(0, maxC - 3) + '...' : n.label;
    var sub = f ? 'line ' + f.line : n.kind === 'trig' ? (id === 'load' ? 'top level code' : 'event') : '';
    var attr = f ? ' data-fn="' + id + '"' : id === 'load' ? ' data-top="0"' : '';
    s += '<g' + attr + '><rect x="' + (p.x + 4) + '" y="' + (p.y + 4) + '" width="' + (nw - 4) + '" height="' + (nh - 4) + '" fill="#111"/><rect x="' + p.x + '" y="' + p.y + '" width="' + (nw - 4) + '" height="' + (nh - 4) + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + (isSel ? 3.5 : 2.5) + '"/>';
    s += '<text x="' + (p.x + 8) + '" y="' + (p.y + 19) + '" font-size="14" font-weight="700" fill="#111">' + esc(lab) + '</text>';
    s += '<text x="' + (p.x + 8) + '" y="' + (p.y + 36) + '" font-size="11" font-weight="700" fill="#3d3d3d">' + esc(sub) + '</text></g>';
  });
  s += '</svg>';
  box.innerHTML = '<div class="meta" style="margin-bottom:8px">Arrows point from what starts something to what it runs. Dashed arrows loop back up. Tap a box to explain it.</div>' + s;
}

function showTab(t) {
  S.tab = t;
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
  ['fns', 'map', 'exp'].forEach(function (k) { $('tab-' + k).classList.toggle('hidden', k !== t); });
  if (t === 'map') renderMap();
}

document.addEventListener('click', function (ev) {
  var tb = ev.target.closest('.tabs button');
  if (tb) { showTab(tb.getAttribute('data-tab')); return; }
  var fe = ev.target.closest('[data-fn]');
  if (fe && S.A) { var f = fnById(fe.getAttribute('data-fn')); if (f) openFn(f); return; }
  var te = ev.target.closest('[data-top]');
  if (te && S.A) openTop(+te.getAttribute('data-top'));
});
$('loadRepos').addEventListener('click', loadRepos);
$('user').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadRepos(); });
$('repo').addEventListener('change', loadFiles);
$('file').addEventListener('change', loadFile);
$('pasteToggle').addEventListener('click', function () { $('pasteBox').classList.toggle('hidden'); });
$('pasteGo').addEventListener('click', function () {
  var t = $('paste').value;
  if (!t.trim()) { setStatus('Paste some code first.', true); return; }
  runAnalysis(t, /<script|<html|<body|<div/i.test(t) ? 'pasted.html' : 'pasted.js');
});
var savedUser = store('codelens.user');
if (savedUser) $('user').value = savedUser;
