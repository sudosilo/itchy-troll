name: scout

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"
  push:
    branches: [main]
    paths: [scout-request.txt]

permissions:
  contents: write

concurrency:
  group: itchy-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get agent code
        uses: actions/checkout@v4

      - name: Copy public app repos into scout
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scout.js

      - name: Save scout
        run: |
          git add -A scout
          if [ -n "$(git status --porcelain scout)" ]; then
            git config user.name "itchy-troll"
            git config user.email "itchy-troll@users.noreply.github.com"
            git commit -q -m "Scout repos [no heckle]"
            git pull --rebase -q origin main
            git push
          fi
