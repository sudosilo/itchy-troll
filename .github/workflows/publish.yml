name: publish

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Game repo under sudosilo to publish"
        required: true
      price:
        description: "Price in dollars"
        required: false
        default: "0.99"
      title:
        description: "Optional page title. Empty uses the HTML title tag"
        required: false
        default: ""
  push:
    branches: [main]
    paths: [ship.json]

permissions:
  contents: write

concurrency:
  group: itchy-troll
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get agent code
        uses: actions/checkout@v4

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d butler-bin
          chmod +x butler-bin/butler
          echo "$GITHUB_WORKSPACE/butler-bin" >> $GITHUB_PATH

      - name: Install browser
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Run agent
        env:
          ITCH_USERNAME: ${{ secrets.ITCH_USERNAME }}
          ITCH_PASSWORD: ${{ secrets.ITCH_PASSWORD }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          GH_OWNER: sudosilo
          GAME_REPO: ${{ inputs.repo }}
          GAME_PRICE: ${{ inputs.price }}
          GAME_TITLE: ${{ inputs.title }}
        run: node troll.js

      - name: Save ledger
        if: always()
        run: |
          if [ -n "$(git status --porcelain itch-ledger.json)" ]; then
            git config user.name "itchy-troll"
            git config user.email "itchy-troll@users.noreply.github.com"
            git add itch-ledger.json
            git commit -m "Update itch ledger [no heckle]"
            git pull --rebase -q origin main
            git push
          fi

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
          if-no-files-found: ignore
