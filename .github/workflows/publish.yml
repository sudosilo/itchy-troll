name: publish

on:
  workflow_dispatch:
    inputs:
      only_repo:
        description: "Optional. Leave empty and the agent picks the games itself"
        required: false
        default: ""
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: itchy-troll
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get agent code
        uses: actions/checkout@v4

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d butler-bin
          chmod +x butler-bin/butler
          echo "$GITHUB_WORKSPACE/butler-bin" >> $GITHUB_PATH

      - name: Install browser
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Run agent
        env:
          ITCH_USERNAME: ${{ secrets.ITCH_USERNAME }}
          ITCH_PASSWORD: ${{ secrets.ITCH_PASSWORD }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          GH_OWNER: sudosilo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY_REPO: ${{ inputs.only_repo }}
        run: node troll.js

      - name: Save ledger
        if: always()
        run: |
          if [ -n "$(git status --porcelain itch-ledger.json)" ]; then
            git config user.name "itchy-troll"
            git config user.email "itchy-troll@users.noreply.github.com"
            git add itch-ledger.json
            git commit -m "Update itch ledger"
            git push
          fi

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
          if-no-files-found: ignore
