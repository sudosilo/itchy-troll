name: itch-login

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: itchy-login
  cancel-in-progress: true

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get agent code
        uses: actions/checkout@v4

      - name: Install browser and tunnel
        timeout-minutes: 8
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          curl -sSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Live login for the owner
        env:
          ITCH_USERNAME: ${{ secrets.ITCH_USERNAME }}
          ITCH_PASSWORD: ${{ secrets.ITCH_PASSWORD }}
        run: node login-relay.js
