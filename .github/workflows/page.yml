name: page

on:
  push:
    branches: [main]
    paths: ['pages/**']
  workflow_dispatch:
    inputs:
      repo:
        description: "Game repo whose pages/REPO.json to apply"
        required: true

permissions:
  contents: read

concurrency:
  group: itchy-troll
  cancel-in-progress: false

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get agent code
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Check secrets
        env:
          ITCH_USERNAME: ${{ secrets.ITCH_USERNAME }}
          ITCH_PASSWORD: ${{ secrets.ITCH_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -z "$ITCH_USERNAME" ] && missing="$missing ITCH_USERNAME"
          [ -z "$ITCH_PASSWORD" ] && missing="$missing ITCH_PASSWORD"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -f itch-session.enc ] || missing="$missing saved-login(run itch-login)"
          if [ -n "$missing" ]; then
            echo "Missing:$missing" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install browser
        timeout-minutes: 8
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Edit itch.io page
        env:
          ITCH_USERNAME: ${{ secrets.ITCH_USERNAME }}
          ITCH_PASSWORD: ${{ secrets.ITCH_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGE_REPO: ${{ inputs.repo }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node page.js
